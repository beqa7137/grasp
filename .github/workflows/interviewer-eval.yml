name: Interviewer eval

# Runs the live AI interviewer eval against the production model through the AI Gateway: scripted strong
# and weak candidates on every track, verdicts, score separation, caching, cost and latency. Run it before
# changing prompts, the model or effort. Needs the AI_GATEWAY_API_KEY secret. Well under a dollar.
# See docs/AI_INTERVIEWER.md.
on:
  workflow_dispatch:
    inputs:
      model:
        description: AI Gateway model id
        default: openai/gpt-6-luna

permissions:
  contents: read

jobs:
  eval:
    name: Live eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the engine
        run: npm run build:engine

      - name: Run the eval
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          INTERVIEW_AI_MODEL: ${{ inputs.model }}
        run: npm run eval:interviewer

      - name: Upload transcripts and scorecards
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interviewer-eval
          path: apps/api/eval-results
          retention-days: 30
