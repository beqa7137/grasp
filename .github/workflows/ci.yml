name: CI

on:
  push:
    branches: [main, feature/improvements]
  pull_request:
  workflow_dispatch:

# A newer push stops the run it supersedes, except on main and feature/improvements, where every commit gets a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/feature/improvements' }}

permissions:
  contents: read

jobs:
  # A commit fast-forwarded onto main or feature/improvements has usually passed CI on its branch, and the same tree gives
  # the same verdict.
  verdict:
    name: Earlier verdict for this commit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed lookup prints nothing, so the jobs run. A pull request run tested a merge commit, not this one.
          earlier=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success \
            --json url,headSha,event \
            --jq "map(select(.headSha == \"$GITHUB_SHA\" and .event != \"pull_request\")) | .[0].url // empty") || true
          if [ -n "$earlier" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "Passed already for ${GITHUB_SHA::7}: $earlier" >> "$GITHUB_STEP_SUMMARY"
          fi

  static:
    name: Lint, format, typecheck
    needs: verdict
    if: ${{ !cancelled() && needs.verdict.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Unit and API tests
    needs: verdict
    if: ${{ !cancelled() && needs.verdict.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TEST_DATABASE_URL: postgresql://grasp:grasp@localhost:5432/grasp_test

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/start-postgres
        with:
          database: grasp_test

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/wait-for-postgres

      - name: Test (engine, API against memory + Postgres, app)
        run: npm test

  # The runners have two cores, so the suite is split across four of them. Each shard builds the app itself,
  # which is quicker than waiting for a separate build job.
  e2e:
    name: Browser end-to-end tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: verdict
    if: ${{ !cancelled() && needs.verdict.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      DATABASE_URL: postgresql://grasp:grasp@localhost:5432/grasp_e2e

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/start-postgres
        with:
          database: grasp_e2e

      - uses: ./.github/actions/setup

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # Only Chromium's headless shell, since the tests run headless. Chromium needs no --with-deps: the runner
      # image already has its libraries (it ships Google Chrome), and the app brings its own fonts. WebKit's
      # libraries are not on the image.
      - name: Install Chromium and WebKit
        run: |
          npx -w @grasp/e2e playwright install --only-shell chromium
          npx -w @grasp/e2e playwright install --with-deps webkit

      - name: Build
        run: npm run build

      - name: Upload web build
        if: matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: apps/app/dist/app/browser
          retention-days: 7

      - uses: ./.github/actions/wait-for-postgres

      - name: Run the learner flows on desktop, Android and iPhone
        run: npm run e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --workers=100% --reporter=github,blob

      - name: Upload the blob report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 1

  # One HTML report for every failed shard, with traces and screenshots.
  e2e-report:
    name: Browser test report
    needs: e2e
    if: ${{ failure() && needs.e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: e2e/all-blob-reports
          merge-multiple: true

      - name: Merge the shard reports
        run: npx -w @grasp/e2e playwright merge-reports --reporter html all-blob-reports

      - name: Upload the report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  image:
    name: Docker image smoke test
    needs: verdict
    if: ${{ !cancelled() && needs.verdict.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://grasp:grasp@localhost:5432/grasp
      JWT_SECRET: ci-only-secret-for-the-smoke-test-0123456789

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/start-postgres
        with:
          database: grasp

      - name: Build image
        run: docker build --build-arg RELEASE="${GITHUB_SHA::7}" -t grasp:ci .

      - uses: ./.github/actions/wait-for-postgres

      - name: Run migrations the way the release step does
        run: docker run --rm --network host -e DATABASE_URL grasp:ci node apps/api/dist/migrate.js

      - name: Start the container
        run: docker run -d --name grasp --network host -e NODE_ENV=production -e DATABASE_URL -e JWT_SECRET grasp:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/health/ready && break; sleep 1; done
          curl -fsS localhost:3000/api/health | grep -q '"storage":"postgres"'
          curl -fsS localhost:3000/api/health | grep -q "\"release\":\"${GITHUB_SHA::7}\""
          curl -fsS -H 'Accept: text/html' localhost:3000/tabs/learn | grep -q '<app-root'
          curl -fsS localhost:3000/config.json | grep -q '"apiUrl":null'
          curl -fsS localhost:3000/api/curriculum/patterns | grep -q 'sliding-window'
          curl -fsS localhost:3000/api/auth/config | jq -e '. == {google: null, github: null}' > /dev/null
          curl -fsS -o /dev/null localhost:3000/pyodide/pyodide.asm.wasm

      - name: Container logs
        if: always()
        run: docker logs grasp || true

  vercel:
    name: Vercel build smoke test
    needs: verdict
    if: ${{ !cancelled() && needs.verdict.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERCEL_CLI: vercel@59.26.0
      VERCEL_TELEMETRY_DISABLED: '1'
      # Express handles req/res itself; Vercel's helpers would shadow res.json and friends.
      NODEJS_HELPERS: '0'
      DATABASE_URL: postgresql://grasp:grasp@localhost:5432/grasp
      JWT_SECRET: ci-only-secret-for-the-smoke-test-0123456789

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/start-postgres
        with:
          database: grasp

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The same `vercel build` the deploy runs, with a placeholder project link: no Vercel account needed.
      - name: Build the Vercel output
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_ci","orgId":"team_ci","settings":{"framework":null}}' > .vercel/project.json
          npx --yes "$VERCEL_CLI" build --prod --yes

      - uses: ./.github/actions/wait-for-postgres

      - name: Migrate the test database
        run: node apps/api/dist/migrate.js

      - name: Smoke-test the function and the static output
        run: node --no-experimental-require-module scripts/smoke-vercel-output.mjs
