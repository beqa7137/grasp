name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grasp
          POSTGRES_PASSWORD: grasp
          POSTGRES_DB: grasp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grasp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://grasp:grasp@localhost:5432/grasp_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test (engine, API against memory + Postgres, app)
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: apps/app/dist/app/browser
          retention-days: 7

  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grasp
          POSTGRES_PASSWORD: grasp
          POSTGRES_DB: grasp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grasp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://grasp:grasp@localhost:5432/grasp_e2e

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx -w @grasp/e2e playwright install --with-deps chromium

      - name: Run every learner flow on desktop and phone
        run: npm run e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  image:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grasp
          POSTGRES_PASSWORD: grasp
          POSTGRES_DB: grasp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grasp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://grasp:grasp@localhost:5432/grasp
      JWT_SECRET: ci-only-secret-for-the-smoke-test-0123456789

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --build-arg RELEASE="${GITHUB_SHA::7}" -t grasp:ci .

      - name: Run migrations the way the release step does
        run: docker run --rm --network host -e DATABASE_URL grasp:ci node apps/api/dist/migrate.js

      - name: Start the container
        run: docker run -d --name grasp --network host -e NODE_ENV=production -e DATABASE_URL -e JWT_SECRET grasp:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/health/ready && break; sleep 1; done
          curl -fsS localhost:3000/api/health | grep -q '"storage":"postgres"'
          curl -fsS localhost:3000/api/health | grep -q "\"release\":\"${GITHUB_SHA::7}\""
          curl -fsS -H 'Accept: text/html' localhost:3000/tabs/learn | grep -q '<app-root'
          curl -fsS localhost:3000/config.json | grep -q '"apiUrl":null'
          curl -fsS localhost:3000/api/curriculum/patterns | grep -q 'sliding-window'
          curl -fsS localhost:3000/api/auth/config | jq -e '. == {google: null, github: null}' > /dev/null
          curl -fsS -o /dev/null localhost:3000/pyodide/pyodide.asm.wasm

      - name: Container logs
        if: always()
        run: docker logs grasp || true

  vercel:
    name: Vercel build smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grasp
          POSTGRES_PASSWORD: grasp
          POSTGRES_DB: grasp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grasp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      VERCEL_CLI: vercel@59.26.0
      VERCEL_TELEMETRY_DISABLED: '1'
      # Express handles req/res itself; Vercel's helpers would shadow res.json and friends.
      NODEJS_HELPERS: '0'
      DATABASE_URL: postgresql://grasp:grasp@localhost:5432/grasp
      JWT_SECRET: ci-only-secret-for-the-smoke-test-0123456789

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The same `vercel build` the deploy runs, with a placeholder project link: no Vercel account needed.
      - name: Build the Vercel output
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_ci","orgId":"team_ci","settings":{"framework":null}}' > .vercel/project.json
          npx --yes "$VERCEL_CLI" build --prod --yes

      - name: Migrate the test database
        run: node apps/api/dist/migrate.js

      - name: Smoke-test the function and the static output
        run: node --no-experimental-require-module scripts/smoke-vercel-output.mjs
