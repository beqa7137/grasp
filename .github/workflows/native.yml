name: Native builds

# Compiles the Capacitor shells so native breakage (plugins, SDK or Xcode bumps) shows up in review
# instead of on a release day. Debug builds only; nothing is signed or published. Run it by hand with an
# API URL to get an APK and a simulator app that talk to that deployment, e.g. for testing on emulators.
on:
  push:
    branches: [main, feature/improvements]
    # Only what can break a native compile: a broken web build fails CI, and the package.json files carry the plugins.
    paths: &native-paths
      - apps/app/android/**
      - apps/app/ios/**
      - apps/app/angular.json
      - apps/app/capacitor.config.ts
      - apps/app/package.json
      - apps/app/scripts/**
      # The bundle and style gates are plain node scripts and data, which no native compile reads.
      - '!apps/app/scripts/*.baseline.json'
      - '!apps/app/scripts/first-paint-bytes*.mjs'
      - '!apps/app/scripts/style-tokens*.mjs'
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/actions/setup/**
      - .github/workflows/native.yml
  pull_request:
    paths: *native-paths
  workflow_dispatch:
    inputs:
      api_url:
        description: API the apps call, e.g. https://grasp-rho-taupe.vercel.app/api (empty for a development build)
        default: ''

# A newer push stops the run it supersedes, except on main and feature/improvements, where every commit gets a verdict.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/feature/improvements' }}

permissions:
  contents: read

jobs:
  # As in ci.yml: a commit fast-forwarded onto main or feature/improvements has usually been built on its branch already.
  verdict:
    name: Earlier verdict for this commit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed lookup prints nothing, so the jobs run. A pull request run tested a merge commit, not this one.
          earlier=$(gh run list -R "$GITHUB_REPOSITORY" --workflow native.yml --commit "$GITHUB_SHA" --status success \
            --json url,headSha,event \
            --jq "map(select(.headSha == \"$GITHUB_SHA\" and .event != \"pull_request\")) | .[0].url // empty") || true
          if [ -n "$earlier" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "Passed already for ${GITHUB_SHA::7}: $earlier" >> "$GITHUB_STEP_SUMMARY"
          fi

  android:
    name: Android debug build
    needs: verdict
    if: ${{ !cancelled() && needs.verdict.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Capacitor 8 uses Android Gradle Plugin 8.13, which runs on JDK 21. Set up before node_modules exists:
      # the Gradle cache key hashes every *.gradle file in the tree, and the plugins' own would change it.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: ./.github/actions/setup

      - name: Build web app and sync native projects
        env:
          GRASP_API_URL: ${{ inputs.api_url }}
          GRASP_RELEASE: ${{ inputs.api_url && '1' || '' }}
          GRASP_VERSION: ${{ github.sha }}
          GRASP_SENTRY_DSN: ${{ inputs.api_url && secrets.SENTRY_WEB_DSN || '' }}
          GRASP_GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          npm run build -w @grasp/engine
          npm run cap:sync -w @grasp/app

      # One stable signing key for test builds, so Google sign-in can trust its fingerprint. Without the
      # secret (e.g. forks), Gradle's throwaway debug key is used.
      - name: Use the shared test signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          fi

      # The Capacitor plugin modules only change with the lockfile, so their compiled outputs are reused.
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ hashFiles('package-lock.json', 'apps/app/android/**/*.gradle', 'apps/app/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Assemble debug APK
        working-directory: apps/app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --build-cache

      - uses: actions/upload-artifact@v7
        with:
          name: grasp-debug-apk
          path: apps/app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios:
    name: iOS simulator build
    needs: verdict
    if: ${{ !cancelled() && needs.verdict.outputs.passed != 'true' }}
    # Capacitor 8 requires Xcode 26, the default on this image.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build web app and sync native projects
        env:
          GRASP_API_URL: ${{ inputs.api_url }}
          GRASP_RELEASE: ${{ inputs.api_url && '1' || '' }}
          GRASP_VERSION: ${{ github.sha }}
          GRASP_SENTRY_DSN: ${{ inputs.api_url && secrets.SENTRY_WEB_DSN || '' }}
          GRASP_GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          npm run build -w @grasp/engine
          npm run cap:sync -w @grasp/app

      # Swift packages (Capacitor, Sentry, Google Sign-In and theirs) are cloned and downloaded once per
      # dependency set; xcodebuild still resolves them, but only fetches what changed.
      - uses: actions/cache@v6
        with:
          path: apps/app/ios/App/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/app/ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build for the iOS simulator
        working-directory: apps/app/ios/App
        run: >-
          xcodebuild build
          -project App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO

      - name: Package the simulator app
        run: ditto -c -k --keepParent apps/app/ios/App/build/Build/Products/Debug-iphonesimulator/App.app App.app.zip

      - uses: actions/upload-artifact@v7
        with:
          name: grasp-simulator-app
          path: App.app.zip
          retention-days: 7

  # Hand-run builds for a deployment are also published as the `test-build` pre-release, so testers and
  # tools can fetch them with `gh release download test-build` instead of through the Actions UI.
  publish:
    name: Publish test builds
    # Explicit results: an implicit success() would also see the skipped verdict job (actions/runner#2205).
    if: ${{ !cancelled() && inputs.api_url != '' && needs.android.result == 'success' && needs.ios.result == 'success' }}
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: builds
          merge-multiple: true

      - name: Replace the test-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ inputs.api_url }}
        run: |
          gh release delete test-build --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create test-build builds/app-debug.apk builds/App.app.zip -R "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" --title "Test builds (${GITHUB_SHA::7})" \
            --notes "Debug builds that call ${API_URL}. For emulators and simulators only; not signed."
