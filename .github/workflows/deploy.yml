name: Deploy

# Deploys main to Vercel after CI passes on a push, or by hand from the Actions tab. Inactive until the
# repository variable VERCEL_DEPLOY_ENABLED is 'true'. Vercel's own Git deployments are off (vercel.json),
# so nothing reaches production without CI. See docs/DEPLOYMENT.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A commit fast-forwarded onto main is usually live already, deployed by hand from its branch.
  live:
    name: Check the live release
    if: >-
      vars.VERCEL_DEPLOY_ENABLED == 'true' && vars.PUBLIC_URL != '' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      already: ${{ steps.health.outputs.already }}
    steps:
      - id: health
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          health=$(curl -fsS --max-time 30 "$PUBLIC_URL/api/health" || true)
          # Only a hand deploy that passed its own checks counts; a release that went live and then failed them does not.
          deployed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --commit "$SHA" --event workflow_dispatch \
            --status success --json headSha --jq "map(select(.headSha == \"$SHA\")) | length") || deployed=0
          if [ "$deployed" -gt 0 ] && grep -qF "\"release\":\"${SHA::7}\"" <<< "$health"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Production already runs ${SHA::7}." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy to Vercel
    needs: live
    if: >-
      !cancelled() && needs.live.outputs.already != 'true' && vars.VERCEL_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_sha == github.sha))
    # The same image as CI's browser tests, which the smoke walk-through repeats.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    env:
      VERCEL_CLI: vercel@59.26.0
      VERCEL_TELEMETRY_DISABLED: '1'
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      PROJECT: ${{ vars.VERCEL_PROJECT || 'grasp' }}
      # Express handles req/res itself; Vercel's helpers would shadow res.json and friends.
      NODEJS_HELPERS: '0'
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Link the project and pull its production settings
        run: |
          vc() { npx --yes "$VERCEL_CLI" "$@" --token "$VERCEL_TOKEN" ${VERCEL_SCOPE:+--scope "$VERCEL_SCOPE"}; }
          vc link --yes --project "$PROJECT"
          vc pull --yes --environment=production

      - name: Build
        run: npx --yes "$VERCEL_CLI" build --prod --token "$VERCEL_TOKEN"

      # Before the new code takes traffic. Migrations must stay compatible with the release still running
      # (add columns and tables first, drop them in a later release).
      - name: Migrate the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL }}
        run: node apps/api/dist/migrate.js

      - name: Deploy
        id: deploy
        run: |
          npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --env RELEASE="${SHA::7}" \
            --token "$VERCEL_TOKEN" ${VERCEL_SCOPE:+--scope "$VERCEL_SCOPE"} | tee deployment-url.txt
          echo "Deployed $(cat deployment-url.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the new release is live
        if: vars.PUBLIC_URL != ''
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          release="\"release\":\"${SHA::7}\""
          fetch() { curl -sS --max-time 30 -w '\nHTTP %{http_code}' "$@" 2>&1 || true; }
          failed=0
          expect() {
            local name=$1 pattern=$2 out
            shift 2
            out=$(fetch "$@")
            grep -q -- "$pattern" <<< "$out" && return 0
            echo "::error title=$name::expected $pattern, got: $(head -c 1000 <<< "$out" | tr '\n' ' ')"
            failed=1
          }

          for i in $(seq 1 20); do
            grep -q -- "$release" <<< "$(fetch "$PUBLIC_URL/api/health")" && break
            sleep 3
          done
          expect 'Health reports the new release' "$release" "$PUBLIC_URL/api/health"
          expect 'Database is reachable' '"database":"ok"' "$PUBLIC_URL/api/health/ready"
          expect 'Deep links serve the app' '<app-root' -H 'Accept: text/html' "$PUBLIC_URL/learn"
          expect 'Runtime config reports the new release' "$release" "$PUBLIC_URL/config.json"
          expect 'Python runtime is served' 'HTTP 200' -o /dev/null "$PUBLIC_URL/pyodide/pyodide.asm.wasm"
          [ "$failed" = 0 ] || exit 1
          echo "Verified ${SHA::7} at $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"

      # The @smoke browser tests, read-only: they block every API call that could write data.
      - name: Walk through the main flows in a browser
        if: vars.PUBLIC_URL != ''
        env:
          E2E_BASE_URL: ${{ vars.PUBLIC_URL }}
        run: |
          npx -w @grasp/e2e playwright install --with-deps --only-shell chromium
          npx -w @grasp/e2e playwright install --with-deps webkit
          npm run e2e

      - name: Upload the browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      # Puts the function's own errors next to the failed check.
      - name: Show the deployment's runtime errors
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          npx --yes "$VERCEL_CLI" logs "$(cat deployment-url.txt)" --since 15m --status-code 5xx --expand --limit 20 \
            --no-color --token "$VERCEL_TOKEN" ${VERCEL_SCOPE:+--scope "$VERCEL_SCOPE"} > runtime-errors.txt 2>&1 || true
          cat runtime-errors.txt
          echo "::error title=Runtime errors::$(head -c 6000 runtime-errors.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
