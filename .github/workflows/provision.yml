name: Provision Fly

# One-time and idempotent: creates the Fly app named in fly.toml if it is missing and loads its secrets
# from this repository's secrets. Deploys stay in deploy.yml. See docs/DEPLOYMENT.md.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    name: Create app and load secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          missing=()
          for name in FLY_API_TOKEN DATABASE_URL JWT_SECRET; do [ -n "${!name}" ] || missing+=("$name"); done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Add these repository secrets first: ${missing[*]}"
            exit 1
          fi

      - name: Create the app if it does not exist
        run: |
          app=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          echo "APP=$app" >> "$GITHUB_ENV"
          if flyctl status --app "$app" > /dev/null 2>&1; then
            echo "App $app already exists"
          else
            flyctl apps create "$app" --org "${{ vars.FLY_ORG || 'personal' }}"
          fi

      # Secrets are piped on stdin, never passed as arguments, so they cannot show up in logs.
      # --stage applies them with the next deploy instead of restarting machines now.
      - name: Load secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_WEB_DSN: ${{ secrets.SENTRY_WEB_DSN }}
          AI_DAILY_BUDGET_USD: ${{ vars.AI_DAILY_BUDGET_USD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: |
          names=(DATABASE_URL JWT_SECRET ADMIN_TOKEN ANTHROPIC_API_KEY RESEND_API_KEY SENTRY_DSN SENTRY_WEB_DSN AI_DAILY_BUDGET_USD MAIL_FROM)
          set=()
          for name in "${names[@]}"; do [ -n "${!name}" ] && set+=("$name"); done
          for name in "${set[@]}"; do printf '%s=%s\n' "$name" "${!name}"; done | flyctl secrets import --app "$APP" --stage
          echo "Staged for $APP: ${set[*]}"
