# Fly.io deployment: one machine serves the API and the web app. See docs/DEPLOYMENT.md.
# Change `app` to your own app name before the first `fly launch --copy-config --no-deploy`.
app = "grasp"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "node apps/api/dist/migrate.js"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  LOG_FORMAT = "json"
  TRUST_PROXY = "1"
  CORS_ORIGINS = "capacitor://localhost,https://localhost,ionic://localhost"

[http_service]
  internal_port = 3000
  force_https = true
  # Spend ceiling, locks and quotas live in process memory: keep exactly one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/api/health/ready"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
