# Fly.io deployment: each machine serves the API and the web app. See docs/DEPLOYMENT.md.
# App names are global on Fly; `app` below is this deployment's. Change it when deploying your own copy.
app = "grasp-beqa"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "node apps/api/dist/migrate.js"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  LOG_FORMAT = "json"
  TRUST_PROXY = "1"
  CORS_ORIGINS = "capacitor://localhost,https://localhost,ionic://localhost"

[http_service]
  internal_port = 3000
  force_https = true
  # Shared state (spend ceiling, quotas, locks, rate limits) lives in Postgres, so more machines are safe:
  # `fly scale count 2` for zero-downtime deploys and failover.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    # Liveness, not readiness: a database check every 15 s would keep a scale-to-zero database (Neon)
    # awake around the clock, and a database outage should return the API's own 503s, not proxy errors.
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
