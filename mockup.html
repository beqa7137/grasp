<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sharding widget mockup</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url(fonts/inter-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        src: url(fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 800;
        font-display: block;
      }
      /* The app's tokens (apps/app/src/_theme.scss, styles.scss): light is the base, dark overrides. */
      :root {
        color-scheme: light;
        --g-bg: #f4f5f9;
        --g-surface: #ffffff;
        --g-raised: #ffffff;
        --g-sunken: #eef0f5;
        --g-line: #dfe2ea;
        --g-line-strong: #c6cbd6;
        --g-stroke: #707889;
        --g-text: #161a23;
        --g-text-rgb: 22, 26, 35;
        --g-muted: #4a5263;
        --g-faint: #5c6477;
        --g-on-fill: #ffffff;
        --g-warn-ink: #6e4200;
        --g-danger-ink: #9d1630;
        --g-found-ink: #02583f;
        --g-accent: #5846dc;
        --g-accent-rgb: 88, 70, 220;
        --g-accent-soft: rgba(88, 70, 220, 0.14);
        --g-found: #036b4c;
        --g-danger: #c3203d;
        --g-warn: #945800;
        --g-success-ink: var(--g-found-ink);
        --g-success-line: var(--g-found);
        --g-success-soft: rgba(3, 107, 76, 0.12);
        --g-danger-soft: rgba(195, 32, 61, 0.12);
        --g-warn-soft: rgba(148, 88, 0, 0.12);
        --g-viz-stage: #f7f8fb;
        --g-viz-current: #0b74ad;
        --g-viz-current-soft: rgba(11, 116, 173, 0.16);
        --g-viz-considering: #c77700;
        --g-viz-considering-soft: rgba(199, 119, 0, 0.14);
        --g-viz-final: #12925f;
        --g-viz-final-ink: var(--g-found-ink);
        --g-viz-discarded-ink: #687082;
        --g-viz-critical: #d42a49;
        --g-viz-track: #d3d7e0;
        --g-kind-lb: #3a5fcd;
        --g-kind-cache: #c0266f;
        --g-kind-replica: #a8841c;
        --g-kind-worker: #2e9477;
        --g-kind-blob: #56657f;
        --g-pointer-alt: #9a2a08;
        --g-shadow: 0 1px 2px rgba(var(--g-text-rgb), 0.06), 0 3px 10px rgba(var(--g-text-rgb), 0.07);
        --g-shadow-raised: 0 1px 2px rgba(var(--g-text-rgb), 0.08);
        --g-radius-xs: 6px;
        --g-radius-sm: 10px;
        --g-radius-md: 14px;
        --g-radius-pill: 999px;
        --g-text-title-m: 1.0625rem;
        --g-text-title-s: 0.9375rem;
        --g-text-body: 0.875rem;
        --g-text-body-s: 0.8125rem;
        --g-text-label: 0.6875rem;
        --g-font: 'Inter Variable', system-ui, sans-serif;
        --g-font-mono: 'JetBrains Mono Variable', ui-monospace, monospace;
        --g-focus-ring: 2px solid var(--g-accent);
      }
      :root.dark {
        color-scheme: dark;
        --g-bg: #0b0d12;
        --g-surface: #141824;
        --g-raised: #1c2130;
        --g-sunken: #0f121a;
        --g-line: #252a37;
        --g-line-strong: #343b4d;
        --g-stroke: #6b7387;
        --g-text: #e9ebf2;
        --g-text-rgb: 233, 235, 242;
        --g-muted: #8b93a8;
        --g-faint: #828a9e;
        --g-on-fill: #0b0d12;
        --g-warn-ink: #f3e6b3;
        --g-danger-ink: #ffb3bd;
        --g-found-ink: #3ddc97;
        --g-accent: #9d8cff;
        --g-accent-rgb: 157, 140, 255;
        --g-accent-soft: rgba(157, 140, 255, 0.14);
        --g-found: #3ddc97;
        --g-danger: #ff5d73;
        --g-warn: #ffb547;
        --g-success-soft: rgba(61, 220, 151, 0.12);
        --g-danger-soft: rgba(255, 93, 115, 0.12);
        --g-warn-soft: rgba(255, 181, 71, 0.12);
        --g-viz-stage: #0e1118;
        --g-viz-current: #1f9fd0;
        --g-viz-current-soft: rgba(31, 159, 208, 0.16);
        --g-viz-considering: #c08420;
        --g-viz-considering-soft: rgba(192, 132, 32, 0.18);
        --g-viz-final: #22ad74;
        --g-viz-final-ink: var(--g-found);
        --g-viz-discarded-ink: var(--g-muted);
        --g-viz-critical: #e5485f;
        --g-viz-track: #2a3040;
        --g-kind-lb: #7aa2ff;
        --g-kind-cache: #ff7eb6;
        --g-kind-replica: #ffd28a;
        --g-kind-worker: #8be0bd;
        --g-kind-blob: #a9b8d6;
        --g-pointer-alt: #ff8a5c;
        --g-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        --g-shadow-raised: var(--g-shadow);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--g-bg);
        color: var(--g-text);
        font: 400 var(--g-text-body) / 1.5 var(--g-font);
        font-variant-ligatures: none;
        -webkit-font-smoothing: antialiased;
        overflow-wrap: break-word;
      }
      button {
        font-size: 0.8333rem;
      }
      .page {
        max-width: 1048px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      .eyebrow {
        margin: 0;
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
      }
      h1 {
        margin: 4px 0 14px;
        font: 600 1.25rem/1.3 var(--g-font);
      }
      .panel {
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background: var(--g-surface);
        box-shadow: var(--g-shadow);
        padding: 16px;
      }
      /* Narrow: one column, the controls as the stage's first rows, then the stage, the question, Describe, the cards. */
      .widget {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }
      .main,
      .experiments {
        display: contents;
      }
      .controls {
        order: 1;
      }
      .stage {
        order: 2;
        min-width: 0;
      }
      .dock {
        order: 3;
      }
      .describe {
        order: 4;
      }
      .heading,
      .cards {
        order: 5;
      }
      .controls {
        padding: 12px 12px 0;
        border: 1px solid var(--g-line);
        border-bottom: 0;
        border-radius: var(--g-radius-md) var(--g-radius-md) 0 0;
        background: var(--g-viz-stage);
        display: grid;
        gap: 10px;
        min-width: 0;
      }
      .stage {
        margin-top: -12px;
      }
      .stage .well {
        border-top: 0;
        border-radius: 0 0 var(--g-radius-md) var(--g-radius-md);
      }
      @media (min-width: 1000px) {
        .widget {
          grid-template-columns: minmax(0, 1fr) 340px;
          grid-template-rows: auto 1fr;
          align-items: start;
          column-gap: 20px;
        }
        .main {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: 12px;
          grid-column: 1;
          grid-row: 1 / span 2;
          min-width: 0;
        }
        .controls {
          grid-column: 2;
          grid-row: 1;
          padding: 0;
          border: 0;
          background: none;
        }
        .experiments {
          display: block;
          grid-column: 2;
          grid-row: 2;
          min-width: 0;
        }
        .stage {
          margin-top: 0;
        }
        .stage .well {
          border-top: 1px solid var(--g-line);
          border-radius: var(--g-radius-md);
        }
        .dock {
          margin-top: 12px;
        }
      }
      .well {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background-color: var(--g-viz-stage);
        background-image: radial-gradient(circle, rgba(var(--g-text-rgb), 0.09) 1px, transparent 1.5px);
        background-size: 24px 24px;
        background-position: 11px 11px;
      }
      /* Every fieldset.group carries the same zero padding; a control's own class only adds to it (the R41 padding bug). */
      fieldset.group {
        margin: 0;
        padding: 0;
        border: 0;
        min-width: 0;
      }
      .control-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
        padding: 0;
        margin-bottom: 4px;
      }
      .segments {
        display: flex;
        gap: 4px;
      }
      .segment {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
      }
      .segment input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .segment span {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 6px;
        border-radius: var(--g-radius-sm);
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        font: 500 var(--g-text-body) / 1.15 var(--g-font);
        text-align: center;
      }
      .segment input:checked + span {
        background: var(--g-accent-soft);
        border-color: var(--g-accent);
        box-shadow: inset 0 0 0 1px var(--g-accent);
      }
      fieldset:disabled .segment span,
      .segment input:disabled + span {
        opacity: 0.55;
      }
      .control-label .why {
        font-weight: 500;
        letter-spacing: normal;
        text-transform: none;
      }
      .segment small {
        font: 500 var(--g-text-label) var(--g-font);
        color: var(--g-muted);
      }
      .toggles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .toggles .segment span {
        flex-direction: column;
        gap: 0;
        font-size: var(--g-text-body-s);
      }
      .notice {
        margin: 0;
        min-height: 2lh;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      /* Below wide the notice would sit over the stage and push it down as it speaks: read out only (_widget-controls.scss). */
      @media (max-width: 999px) {
        .notice {
          position: absolute;
          width: 1px;
          height: 1px;
          min-height: 0;
          overflow: hidden;
          clip-path: inset(50%);
        }
        .controls {
          padding-bottom: 12px;
        }
      }
      .caption {
        margin: 0;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      .play {
        position: absolute;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        z-index: 2;
      }
      .play svg {
        display: block;
        width: 36px;
        height: 36px;
        margin: 4px;
      }
      .play circle {
        fill: var(--g-raised);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .play path {
        fill: var(--g-accent);
      }
      .play:disabled {
        cursor: default;
        opacity: 0.55;
      }
      /* Drawing roles: text sits on a stage-coloured halo; small text is measured as drawn (no tabular digits). */
      svg.draw {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        overflow: visible;
      }
      svg.draw text {
        paint-order: stroke;
        stroke: var(--g-viz-stage);
        stroke-width: 3px;
        stroke-linejoin: round;
      }
      svg.draw text.on-box {
        stroke: var(--g-raised);
      }
      svg.draw text.on-chip {
        stroke: none;
      }
      .t-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: var(--g-muted);
      }
      .t-cap {
        font: 500 var(--g-text-body-s) var(--g-font);
        fill: var(--g-muted);
      }
      .t-capB {
        font: 600 var(--g-text-body-s) var(--g-font);
        fill: var(--g-text);
      }
      .t-small {
        font: 500 var(--g-text-label) var(--g-font);
        fill: var(--g-muted);
      }
      .t-smallB {
        font: 700 var(--g-text-label) var(--g-font);
        fill: var(--g-text);
      }
      .t-mono {
        font: 600 var(--g-text-label) var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-nameS {
        font: 600 13px var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-head {
        font: 600 var(--g-text-title-m) var(--g-font-mono);
        fill: var(--g-text);
      }
      .ink {
        fill: var(--g-text);
      }
      .muted {
        fill: var(--g-muted);
      }
      .bad {
        fill: var(--g-danger-ink);
      }
      .wait-ink {
        fill: var(--g-warn-ink);
      }
      .cur-ink {
        fill: var(--g-viz-current);
      }
      .crit-ink {
        fill: var(--g-viz-critical);
      }
      .focus-outline {
        fill: none;
        stroke: var(--g-accent);
        stroke-width: 2;
      }
      .tag {
        fill: var(--g-viz-stage);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .t-look {
        font: 600 var(--g-text-label) var(--g-font);
        fill: var(--g-accent);
      }
      /* The experiment dock and cards (experiment-dock.component.ts, widget-check.component.ts). */
      .dock {
        padding: 12px 16px;
        border-radius: var(--g-radius-md);
        border: 1px solid var(--g-line);
        border-left: 3px solid var(--g-accent);
        background: var(--g-surface);
      }
      .dock:empty {
        display: none;
      }
      .legend {
        margin: 0 0 4px;
        font-weight: 600;
        line-height: 1.45;
      }
      .options {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .g-choice {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        color: var(--g-text);
        font: 500 0.90625rem/1.45 var(--g-font);
        text-align: left;
      }
      button.g-choice {
        box-shadow: var(--g-shadow-raised);
        cursor: pointer;
      }
      .g-choice.right {
        border-color: var(--g-success-line);
        background: var(--g-success-soft);
      }
      .g-choice.wrong {
        border-color: var(--g-danger);
        background: var(--g-danger-soft);
      }
      .mark {
        flex: none;
        width: 20px;
        height: 20px;
      }
      .held {
        margin: 10px 0 0;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      .reveal {
        margin: 10px 0 0;
        line-height: 1.55;
        font-size: 0.90625rem;
      }
      .status-line {
        margin: 8px 0 4px;
        font: 600 var(--g-text-body) var(--g-font);
        color: var(--g-muted);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .status-line.met {
        color: var(--g-success-ink);
      }
      .status {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 4px;
        font: 600 var(--g-text-body-s) var(--g-font);
        font-variant-numeric: tabular-nums;
        color: var(--g-muted);
      }
      .status li {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .status li.met {
        color: var(--g-success-ink);
      }
      .status .state {
        flex: none;
        width: 16px;
      }
      .heading {
        display: flex;
        align-items: center;
        gap: 8px;
        font: 600 var(--g-text-title-s) var(--g-font);
        margin: 20px 0 8px;
      }
      .heading svg {
        color: var(--g-accent);
      }
      .cards {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 8px;
      }
      .card-btn {
        width: 100%;
        min-height: 48px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border: 1px solid var(--g-line-strong);
        border-radius: var(--g-radius-sm);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        font: 500 var(--g-text-body) var(--g-font);
        text-align: left;
      }
      .card-btn[aria-current] {
        border-color: var(--g-accent);
        box-shadow: inset 0 0 0 1px var(--g-accent);
        background: var(--g-accent-soft);
      }
      .card-btn .num {
        flex: none;
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: var(--g-radius-pill);
        background: var(--g-sunken);
        font: 600 var(--g-text-body-s) var(--g-font-mono);
        color: var(--g-muted);
      }
      /* Describe: a minmax(0, 1fr) grid, its table scrolling inside its own box; compact on narrow stages. */
      .describe {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
        justify-items: start;
      }
      .describe .muted-note {
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
        margin: 0;
      }
      .describe p.summary {
        margin: 0;
        font-size: var(--g-text-body-s);
      }
      .g-btn {
        appearance: none;
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        border-radius: var(--g-radius-sm);
        padding: 9px 14px;
        min-height: 44px;
        font: 500 var(--g-text-body) / 1 var(--g-font);
      }
      .g-btn:disabled {
        opacity: 0.55;
      }
      .table-box {
        justify-self: stretch;
        overflow: auto;
        border-top: 1px solid var(--g-line);
      }
      tbody tr {
        height: 28px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font: 500 var(--g-text-body-s) var(--g-font);
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: right;
        padding: 4px 8px;
        white-space: nowrap;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      th {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
        position: sticky;
        top: 0;
        background: var(--g-surface);
        vertical-align: bottom;
      }
      td {
        border-top: 1px solid var(--g-line);
      }
      tr.now td {
        background: var(--g-accent-soft);
        font-weight: 600;
      }
      .compact th,
      .compact td {
        padding-inline: 4px;
      }
      .compact th {
        letter-spacing: normal;
        white-space: normal;
      }
      th .unit {
        text-transform: none;
      }
      /* The Sharding stage. Six node colours of the widget's own series (the shard tokens, validated with the dataviz
         validator over all pairs in both themes: 3:1 on the stage, normal-vision ΔE 15 or more, CVD ΔE 7.5 light and
         8.9 dark, clear of the critical red and the focus purple); a key is a dot in its node's colour. */
      :root {
        --n-a: #364288;
        --n-b: #9b2fb1;
        --n-c: #948312;
        --n-d: #16753b;
        --n-e: #822d06;
        --n-f: #3092c0;
      }
      :root.dark {
        --n-a: #2064ef;
        --n-b: #9a498c;
        --n-c: #b07d0a;
        --n-d: #2dad72;
        --n-e: #a83f16;
        --n-f: #1794c3;
      }
      .nA {
        fill: var(--n-a);
      }
      .nB {
        fill: var(--n-b);
      }
      .nC {
        fill: var(--n-c);
      }
      .nD {
        fill: var(--n-d);
      }
      .nE {
        fill: var(--n-e);
      }
      .nF {
        fill: var(--n-f);
      }
      .band {
        fill: none;
        stroke-width: 8;
      }
      .band.nA,
      .base.nA {
        stroke: var(--n-a);
      }
      .band.nB,
      .base.nB {
        stroke: var(--n-b);
      }
      .band.nC,
      .base.nC {
        stroke: var(--n-c);
      }
      .band.nD,
      .base.nD {
        stroke: var(--n-d);
      }
      .band.nE,
      .base.nE {
        stroke: var(--n-e);
      }
      .band.nF,
      .base.nF {
        stroke: var(--n-f);
      }
      .band {
        fill: none;
      }
      .base {

  </head>
  <body>
    <main class="page">
      <p class="eyebrow">System design · Sharding</p>
      <h1>Try it</h1>
      <section class="panel widget" id="widget"></section>
    </main>
    <script src="model.js"></script>
    <script>
      'use strict';
      const M = window.ShardModel;
      const params = new URLSearchParams(location.search);
      document.documentElement.classList.toggle('dark', params.get('theme') === 'dark');
      const K = M.K;
      /** The hot key drawn at the size of its traffic: as many ordinary keys as carry its 30%. */
      const HOT_SLOTS = (M.HOT_PCT / (100 - M.HOT_PCT)) * K;
      /** The piles' scale is all the keys: every pile of keys fits it (197 at most, enum.cjs prints it). A hot key on a
       * full pile is cut at the scale's end and says how much of its traffic the cut leaves out; the room over the scale
       * is the cut's label's. */
      const MAX_SLOTS = 200;

      // ---------- Text measurement, with the fonts the app ships (no tabular digits: small text is measured as drawn).
      const ROLE = {
        label: { css: '600 11px "Inter Variable"', size: 11, track: 0.12, upper: true },
        title: { css: '600 13px "Inter Variable"', size: 13 },
        cap: { css: '500 13px "Inter Variable"', size: 13 },
        capB: { css: '600 13px "Inter Variable"', size: 13 },
        small: { css: '500 11px "Inter Variable"', size: 11 },
        smallB: { css: '700 11px "Inter Variable"', size: 11 },
        mono: { css: '600 11px "JetBrains Mono Variable"', size: 11 },
        nameS: { css: '600 13px "JetBrains Mono Variable"', size: 13 },
        head: { css: '600 17px "JetBrains Mono Variable"', size: 17 },
        look: { css: '600 11px "Inter Variable"', size: 11 },
      };
      const ctx = document.createElement('canvas').getContext('2d');
      const widthCache = new Map();
      // The label role is set in capitals, but a key's name keeps its case ("user:56").
      const upperKeepNames = (t) => t.toUpperCase().replace(/USER:(\d+|HOT)/g, (m) => m.toLowerCase());
      function tw(text, role) {
        const key = role + '|' + text;
        if (widthCache.has(key)) return widthCache.get(key);
        const f = ROLE[role];
        ctx.font = f.css;
        const s = f.upper ? upperKeepNames(text) : text;
        const w = Math.ceil(ctx.measureText(s).width + (f.track ? f.track * f.size * s.length : 0)) + 1;
        widthCache.set(key, w);
        return w;
      }
      const partsWidth = (parts) => parts.reduce((s, [t, role, , dx = 0]) => s + tw(t, role) + dx, 0);
      // A line never parts a number from its unit, "mod" from its number, an equation, or what stands in brackets.
      const NB = ' ';
      const glue = (t) =>
        t
          .replace(/\(([^)]*)\)/g, (m) => m.replace(/ /g, NB))
          .replace(/([\d,]+) mod (\d+) = (\d+)/g, `$1${NB}mod${NB}$2${NB}=${NB}$3`)
          .replace(/\bhash mod (\d+|N)/g, `hash${NB}mod${NB}$1`)
          .replace(/(\d) (keys?|nodes?|points?|shards?|of|×)(?=[\s,.;:]|$)/g, `$1${NB}$2`)
          .replace(/\b(of|to|from|on|is|at|by|holds) ([\d,.]+%?|[A-F])(?=[\s,.;:']|$)/g, `$1${NB}$2`)
          .replace(/(\d+) of(?: | )(the )?(\d+)/g, (m) => m.replace(/ /g, NB));
      function wrap(text, role, width) {
        const lines = [];
        let line = '';
        for (const w of glue(text).split(' ')) {
          const next = line ? line + ' ' + w : w;
          if (tw(next, role) <= width || !line) line = next;
          else {
            lines.push(line);
            line = w;
          }
        }
        if (line) lines.push(line);
        return lines.map((l) => l.replace(/ /g, ' '));
      }
      const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const labelInner = (t) =>
        esc(t)
          .split(/(user:(?:\d+|hot))/)
          .map((p, i) => (i % 2 ? `<tspan class="t-unit">${p}</tspan>` : p))
          .join('');
      const r1 = (v) => Math.round(v * 10) / 10;
      const plural = (n, one, many) => (n === 1 ? one : many);
      const pick = (forms, fits) => forms.find(fits) ?? forms[forms.length - 1];

      // ---------- The drawing: SVG parts in layers, and the boxes placement checks against.
      class Draw {
        constructor(W) {
          this.W = W;
          this.layers = { back: [], grid: [], links: [], marks: [], dots: [], fly: [], text: [], top: [] };
          this.texts = [];
          this.marks = [];
          this.links = [];
          this.hits = [];
          this.regions = {};
          this.missing = [];
          this.meta = {};
        }
        add(layer, s) {
          this.layers[layer].push(s);
        }
        textBox(x, y, w, role, anchor = 'start') {
          const fs = ROLE[role].size;
          const x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
          return { x0, x1: x0 + w, y0: y - 0.74 * fs, y1: y + 0.22 * fs };
        }
        text(x, y, parts, o = {}) {
          if (typeof parts === 'string') parts = [[parts, o.role ?? 'small', o.cls ?? '']];
          const anchor = o.anchor ?? 'start';
          const w = partsWidth(parts);
          const role = parts.reduce((a, p) => (ROLE[p[1]].size > ROLE[a].size ? p[1] : a), parts[0][1]);
          const box = this.textBox(x, y, w, role, anchor);
          box.owner = o.owner ?? '';
          box.s = parts.map((p) => p[0]).join('');
          this.texts.push(box);
          const spans = parts.map(([t, r, cls = '', dx = 0]) => `<tspan class="t-${r} ${cls}"${dx ? ` dx="${dx}"` : ''}>${r === 'label' ? labelInner(t) : esc(t)}</tspan>`).join('');
          const attrs = `x="${r1(x)}" y="${r1(y)}" text-anchor="${anchor}"${o.owner ? ` data-owner="${o.owner}"` : ''}${o.ground ? ' data-ground="1"' : ''}${o.id ? ` data-id="${o.id}"` : ''}${o.data ?? ''}`;
          this.add(o.layer ?? 'text', `<text class="${o.textCls ?? ''}" ${attrs}>${spans}</text>`);
          return box;
        }
        mark(box, owner = '') {
          this.marks.push({ ...box, owner });
        }
        link(points, owner = '') {
          this.links.push({ points, owner });
        }
        hit(kind, x, y, w, h, extra = {}) {
          this.hits.push({ kind, x, y, w, h, ...extra });
        }
        region(id, box) {
          (this.regions[id] ??= []).push(box);
        }
        free(box, ignoreOwner = '', margin = 2) {
          const b = { x0: box.x0 - margin, x1: box.x1 + margin, y0: box.y0 - margin, y1: box.y1 + margin };
          const hit = (o) => !(o.x1 <= b.x0 || o.x0 >= b.x1 || o.y1 <= b.y0 || o.y0 >= b.y1);
          const mine = (o) => ignoreOwner && o.owner && o.owner.split(' ').some((t) => ignoreOwner.split(' ').includes(t));
          if (this.texts.some((t) => hit(t) && !mine(t))) return false;
          if (this.marks.some((m) => hit(m) && !mine(m))) return false;
          for (const l of this.links) {
            if (mine(l)) continue;
            if (l.points.some(([x, y]) => x > b.x0 && x < b.x1 && y > b.y0 && y < b.y1)) return false;
          }
          return b.x0 >= 2 && b.x1 <= this.W - 2;
        }
        /** Puts a text at the first candidate where it covers nothing; records it as missing when none is free. */
        place(cands, parts, o = {}) {
          if (typeof parts === 'string') parts = [[parts, o.role ?? 'small', o.cls ?? '']];
          for (const [x, y, anchor = 'start'] of cands) {
            const w = partsWidth(parts);
            const role = parts.reduce((a, p) => (ROLE[p[1]].size > ROLE[a].size ? p[1] : a), parts[0][1]);
            const box = this.textBox(x, y, w, role, anchor);
            if (box.y0 < (o.minY ?? 0) || box.y1 > (o.maxY ?? Infinity) || box.x0 < (o.minX ?? 2) || box.x1 > (o.maxX ?? this.W - 2)) continue;
            if (o.avoidDots) {
              const dots = this.meta.ringDots ?? [];
              if (dots.some(([dx, dy, dr]) => dx + dr + 2 > box.x0 && dx - dr - 2 < box.x1 && dy + dr + 2 > box.y0 && dy - dr - 2 < box.y1)) continue;
              if (!this.free(box, `${o.ignore ?? ''} ring-disc`, o.margin ?? 2)) continue;
            } else if (!this.free(box, o.ignore ?? '', o.margin ?? 2)) continue;
            return this.text(x, y, parts, { ...o, anchor });
          }
          if (!o.optional) this.missing.push(parts.map((p) => p[0]).join(''));
          return null;
        }
        svg(H, label) {
          const L = this.layers;
          return `<svg class="draw" width="${this.W}" height="${H}" viewBox="0 0 ${this.W} ${H}" role="img" aria-label="${esc(label)}">
<g>${L.back.join('')}</g><g>${L.grid.join('')}</g><g>${L.links.join('')}</g><g>${L.marks.join('')}</g><g>${L.dots.join('')}</g><g>${L.fly.join('')}</g><g>${L.text.join('')}</g><g>${L.top.join('')}</g></svg>`;
        }
      }
      const sampleLine = (x1, y1, x2, y2, step = 3) => {
        const n = Math.max(2, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / step));
        return Array.from({ length: n + 1 }, (_, i) => [x1 + ((x2 - x1) * i) / n, y1 + ((y2 - y1) * i) / n]);
      };
      function xGlyph(D, cx, cy, owner, s = 4) {
        D.add('marks', `<circle class="xground" cx="${r1(cx)}" cy="${r1(cy)}" r="${s + 3}"/><path class="xmark" data-owner="${owner}" d="M${r1(cx - s)} ${r1(cy - s)}l${2 * s} ${2 * s}M${r1(cx + s)} ${r1(cy - s)}l${-2 * s} ${2 * s}"/>`);
        D.mark({ x0: cx - s - 2, x1: cx + s + 2, y0: cy - s - 2, y1: cy + s + 2 }, owner);
      }

      // ---------- What an open question hides, on every surface: one map (prevention 1). A question names its regions in
      // its own `hide` list with the phase that hides them. `after` hides, while the answer plays, every number the model
      // gives for the act's new setting: the moved count and its story, the table's rows, the marks on moved keys, the
      // followed key's new node, the fullest or busiest shard, the hot key's label. No trace of a change made before the
      // card shows while a question asks: a card's setup is a new start.
      function hiding(view) {
        const active = new Set((view.hide ?? []).filter((h) => h.when === view.phase || h.when === 'both').map((h) => h.region));
        const after = active.has('after');
        return { after, numbers: after, moved: after, rule: after, standing: after, ghost: view.phase === 'asking' && !view.leakGhost };
      }

      // ---------- Geometry that depends only on the stage's width.
      const TAU = Math.PI * 2;
      const polar = (cx, cy, rad, a) => [cx + rad * Math.sin(a * TAU), cy - rad * Math.cos(a * TAU)];
      const ALL_AT = [...M.KEY_AT, M.HOT_AT, ...M.SALT_AT];
      const HOT_I = K;
      const posOf = (i) => ALL_AT[i] / M.TURN;
      const swarmCache = new Map();
      /** The ring's dots: each key at its hash's angle, pushed outward to the first lane where it touches no other. The
       * band's radius is the largest that keeps every lane inside `Rmax`. Positions never depend on the setting. */
      function ringSwarm(Rmax, r) {
        const id = `${Rmax}|${r}`;
        if (swarmCache.has(id)) return swarmCache.get(id);
        const pitch = 2 * r + 1.4;
        const order = ALL_AT.map((_, i) => i).sort((a, b) => ALL_AT[a] - ALL_AT[b]);
        let out = null;
        for (let rb = Rmax - 12; rb > 30 && !out; rb -= 1) {
          const lane0 = rb + 4 + 3 + r;
          const lanes = [];
          const pos = new Array(ALL_AT.length);
          let ok = true;
          let maxLane = 0;
          for (const i of order) {
            const ang = posOf(i) * TAU;
            let lane = 0;
            for (; ; lane++) {
              const rad = lane0 + lane * pitch;
              if (rad + r > Rmax) {
                ok = false;
                break;
              }
              const need = (2 * r + 0.9) / rad;
              const arr = (lanes[lane] ??= []);
              if (arr.every((b) => Math.min(Math.abs(b - ang), TAU - Math.abs(b - ang)) >= need)) {
                arr.push(ang);
                pos[i] = { rad, a: posOf(i) };
                break;
              }
            }
            if (!ok) break;
            maxLane = Math.max(maxLane, lane);
          }
          if (ok) out = { rb, pos, r, outer: lane0 + maxLane * pitch + r };
        }
        swarmCache.set(id, out);
        return out;
      }
      /** The magnified strip's window. One point a node: the whole ring. More: about one point every 20 px, so a point's
       * arc stays wide enough to read, and never more than 28% of the ring, so the strip draws at most 60 keys. */
      const LENS_MOST = 0.28;
      function lensWindow(points, stripW) {
        const f = points === 1 ? 1 : Math.min(LENS_MOST, Math.floor(stripW / 20) / (5 * points));
        const c = posOf(M.FOLLOW);
        return f >= 1 ? { f: 1, start: 0 } : { f, start: (((c - f * 0.42) % 1) + 1) % 1 };
      }
      const rel = (a, start) => (((a - start) % 1) + 1) % 1;
      /** Dots along the strip, stacked upward where they would touch. */
      function stripStack(xs, r, first = null) {
        const out = new Map();
        const placedAt = [];
        // The first key (the followed one) takes lane 0; every other key the first lane where it touches none.
        const sorted = [...xs].sort((a, b) => (a[0] === first ? -1 : b[0] === first ? 1 : a[1] - b[1]));
        let most = 0;
        for (const [i, x] of sorted) {
          let lane = 0;
          while (placedAt.some(([l, px]) => l === lane && Math.abs(x - px) < 2 * r + 1)) lane++;
          placedAt.push([lane, x]);
          out.set(i, lane);
          most = Math.max(most, lane + 1);
        }
        return { lane: out, lanes: most };
      }
      const lensLanesCache = new Map();
      function lensLanes(stripW, r, points) {
        const id = `${stripW}|${r}|${points}`;
        if (lensLanesCache.has(id)) return lensLanesCache.get(id);
        const { f, start } = lensWindow(points, stripW);
        const xs = ALL_AT.map((_, i) => [i, rel(posOf(i), start)]).filter(([, p]) => p < f).map(([i, p]) => [i, (p / f) * stripW]);
        const most = stripStack(xs, r, M.FOLLOW).lanes;
        lensLanesCache.set(id, most);
        return most;
      }

      // ---------- Words reserved by width: the longest story and standing line any setting can say.
      let SCENARIOS = null;
      function allScenarios() {
        if (SCENARIOS) return SCENARIOS;
        SCENARIOS = [];
        for (const s of M.allSettings()) {
          const froms = [null];
          if (!s.down) {
            for (const n of M.NODE_COUNTS) if (n !== s.nodes) froms.push(M.NAMES.slice(0, n));
            for (const m of M.NAMES.slice(0, s.nodes)) froms.push(M.NAMES.slice(0, s.nodes).filter((x) => x !== m));
          }
          for (const from of froms) SCENARIOS.push({ s, from });
        }
        return SCENARIOS;
      }
      window.ALL_SCENARIOS = allScenarios;
      // Before any node joins or leaves. It never says that no key moved: a new placement or new points place keys afresh.
      const NO_CHANGE = ['Change the nodes, or take the busiest node down, and watch which keys move.'];
      // While a question asks every control waits, so the free line's invitation would be false there.
      const ASK_CHANGE = 'The answer’s change shows here.';
      const REPLACE_HIDDEN = 'What each node holds with the new points shows at the reveal.';
      const REPLACE_PLAYING = 'Each key moves to the owner of the next point clockwise of its hash.';
      const HIDDEN_STORY = 'Which keys moved, and where, shows at the reveal.';
      const HIDDEN_STANDING = 'The fullest shard shows at the reveal.';
      const playingLine = (n) => `Counting each key as it lands${n ? `; ${M.num(n)} ${n === 1 ? 'key is' : 'keys are'} in flight` : ''}.`;
      const restWords = (sc, narrow) => ({ story: sc.change ? M.changeStory(sc, { hot: !narrow, short: narrow }) : NO_CHANGE, standing: M.standing(sc, { hotLine: !narrow }) });
      /** What the last change block says, by phase; a play that will end on the story reserves its lines from the start,
       * so nothing under the block moves at the climax. A hidden play reserves nothing it would not show. */
      function verdictWords(sc, view, hid, c, frame, narrow) {
        const live = frame && !frame.done;
        const hiddenStanding = sc.settings.hot ? HIDDEN_STANDING.replace('fullest', 'busiest') : HIDDEN_STANDING;
        if (!c) {
          if (view.phase === 'asking') return { story: [ASK_CHANGE], standing: M.standing(sc, { hotLine: !narrow }) };
          if (hid.after) return { story: [REPLACE_HIDDEN], standing: hiddenStanding };
          if (live) {
            const end = restWords(sc, narrow);
            return { story: [REPLACE_PLAYING], standing: '', reserve: { story: (w) => end.story.reduce((a, l) => a + wrap(l, 'cap', w).length, 0), standing: (w) => wrap(end.standing, 'cap', w).length } };
          }
          return restWords(sc, narrow);
        }
        if (hid.moved) return { story: [HIDDEN_STORY], standing: hiddenStanding };
        if (live) {
          const end = restWords(sc, narrow);
          return { story: [playingLine(frame.flying)], standing: '', reserve: { story: (w) => end.story.reduce((a, l) => a + wrap(l, 'cap', w).length, 0), standing: (w) => wrap(end.standing, 'cap', w).length } };
        }
        return restWords(sc, narrow);
      }
      /** The rule line: the long form where it fits two lines, else the short one; while a play runs or hides its answer,
       * only the hash, with nothing about its node. */
      function ruleWords(sc, hid, playing, width, ringMode) {
        const follow = M.KEYS[M.FOLLOW];
        if (hid.rule || playing) return ringMode ? `${follow} hashes to ${M.round(M.KEY_AT[M.FOLLOW])} of the way round.` : `${follow} hashes to ${M.num(M.KEY_AT[M.FOLLOW])}.`;
        const long = M.rule(sc, false);
        return wrap(long, 'cap', width).length <= 2 ? long : M.rule(sc, true);
      }
      const reserveCache = new Map();
      /** The most lines the last change block and the rule line can take at a width, over every scenario and phase: the
       * stage's height is laid for them, and the spare room sits at the stage's foot. */
      function reserves(width, narrow) {
        const id = `${width}|${narrow}`;
        if (reserveCache.has(id)) return reserveCache.get(id);
        const lines = (t) => wrap(t, 'cap', width).length;
        let verdict = Math.max(lines(playingLine(51)), lines(REPLACE_PLAYING), lines(REPLACE_HIDDEN), lines(HIDDEN_STORY)) + lines(HIDDEN_STANDING.replace('fullest', 'busiest'));
        let rule = 1;
        for (const { s, from } of allScenarios()) {
          const sc = M.scenario(s, from);
          const w = restWords(sc, narrow);
          const st = w.story.reduce((a, l) => a + lines(l), 0);
          verdict = Math.max(verdict, Math.max(st, lines(playingLine(51)), sc.change ? 0 : lines(REPLACE_PLAYING)) + lines(w.standing), lines(ASK_CHANGE) + lines(w.standing));
          rule = Math.max(rule, lines(ruleWords(sc, {}, false, width, sc.scheme === 'ring')), lines(ruleWords(sc, { rule: true }, false, width, sc.scheme === 'ring')));
        }
        const out = { verdict, rule };
        reserveCache.set(id, out);
        return out;
      }

      // ---------- A play's clock: one monotone fraction from 0 to 1. The node set changes first, then the arcs that
      // changed owner take their new colour, then each moved key leaves its pile as a hand sweeping the ring once passes
      // its hash, and lands a flight later. Nothing is drawn for a key before its moment.
      const { points: T_POINTS, sweep0: T_SWEEP0, sweep1: T_SWEEP1, flight: T_FLIGHT } = M.PLAY;
      function frameOf(c, frac) {
        if (frac === null || frac === undefined || !c) return null;
        const takeoff = M.takeoff;
        const state = new Map();
        let landed = 0;
        for (const mv of c.moves) {
          const t0 = takeoff(mv.key);
          const st = frac < t0 ? 'src' : frac < t0 + T_FLIGHT ? 'fly' : 'dst';
          if (st === 'dst') landed++;
          state.set(mv.key, { ...mv, st, u: st === 'fly' ? (frac - t0) / T_FLIGHT : 0, t0 });
        }
        const flying = [...state.values()].filter((m) => m.st === 'fly').length;
        return { frac, state, landed, flying, pointsIn: frac >= T_POINTS, sweep: frac >= T_SWEEP0 && frac <= T_SWEEP1 ? (frac - T_SWEEP0) / (T_SWEEP1 - T_SWEEP0) : null, done: frac >= T_SWEEP1 + T_FLIGHT };
      }

      const nodeCls = (m) => `n${m}`;

      // ---------- The stage. Its height depends only on its width.
      function buildStage(W, sc, view) {
        const D = new Draw(W);
        const hid = hiding(view);
        const s = sc.settings;
        const c = hid.ghost ? null : sc.change;
        // A change of points is no change of the node set, but it plays once: each key whose owner differs flies.
        const replay = !c && view.replace && view.frac !== null && view.frac !== undefined ? { ...M.diff(M.place('ring', view.replace.points, sc.now.members), sc.now), kind: 'replace' } : null;
        const play = c ?? replay;
        const frame = play ? frameOf(play, view.frac) : null;
        const playing = !!frame && !frame.done;
        const pad = W < 420 ? 12 : 16;
        const inner = W - 2 * pad;
        const two = W >= 600;
        const ringMode = sc.scheme === 'ring';
        // The placement the ring and the strip draw: the one before the change until its points move.
        const placed = frame && !frame.pointsIn && !replay ? c.before : sc.now;
        const ownerNow = (key) => {
          const st = frame?.state.get(key);
          return st && st.st === 'src' ? st.from : sc.now.owners[key];
        };
        const showMoved = !!c && !hid.moved;
        const movedSet = new Map((play?.moves ?? []).map((m) => [m.key, m]));
        const landedKey = (key) => movedSet.has(key) && (!frame || frame.state.get(key).st === 'dst');
        D.meta = { change: c, play, frame, hid, sc, view };
        const narrow = W < 324;

        // ----- Header: Replay, the title, the key.
        D.hit('play', pad - 4, 2, 44, 44);
        const title = D.text(pad + 44, 29, [[`Where ${M.num(K)} keys live`, 'title']], { owner: 'title' });
        // The key: dots in the neutral ink (a key's colour is its node's), and while the hot key is on, its block. The
        // row is laid for the widest entries any setting draws, so the height never depends on the setting.
        const kr = two ? 2.2 : 2;
        const legend = [
          ['a key, in its node’s colour', 'a key'],
          ['moved in the last change', 'moved last'],
          [s.split ? `a tenth of the hot key, ${M.HOT_PCT / M.SALTS}%` : 'the hot key', s.split ? `a tenth, ${M.HOT_PCT / M.SALTS}%` : 'hot key'],
        ];
        const widestHot = [`a tenth of the hot key, ${M.HOT_PCT / M.SALTS}%`, `a tenth, ${M.HOT_PCT / M.SALTS}%`];
        const itemW = (t) => 2 * kr + 6 + tw(t, 'small');
        const legendW = (k, withHot) => itemW(legend[0][k]) + 14 + itemW(legend[1][k]) + (withHot ? 14 + 8 + 6 + tw(widestHot[k], 'small') - 2 * kr : 0);
        let y = 46;
        const sameRow = title.x1 + 20 + legendW(0, true) <= W - pad;
        const lk = sameRow || legendW(0, true) <= inner ? 0 : 1;
        const ly = sameRow ? 29 : y + 12;
        let lx = sameRow ? W - pad - legendW(lk, true) : pad;
        const keyDot = (x, moved) => {
          D.add('marks', `<circle class="legend-key${moved ? ' moved' : ''}" data-legend="1" cx="${r1(x + kr)}" cy="${ly - 4}" r="${moved ? kr - 0.5 : kr}"/>`);
          D.mark({ x0: x - 2, x1: x + 2 * kr + 2, y0: ly - 4 - kr - 2, y1: ly - 4 + kr + 2 }, 'legend');
        };
        keyDot(lx, false);
        lx += 2 * kr + 6;
        lx = D.text(lx, ly, legend[0][lk], { role: 'small', owner: 'legend' }).x1 + 14;
        keyDot(lx, true);
        lx = D.text(lx + 2 * kr + 6, ly, legend[1][lk], { role: 'small', owner: 'legend' }).x1 + 14;
        if (s.hot) {
          D.add('marks', `<rect class="hot-block" data-legend="1" x="${r1(lx)}" y="${ly - 7}" width="8" height="6" rx="1"/>`);
          D.mark({ x0: lx - 1, x1: lx + 9, y0: ly - 8, y1: ly }, 'legend');
          D.text(lx + 14, ly, legend[2][lk], { role: 'small', owner: 'legend', id: 'hot-legend' });
        }
        if (!sameRow) y += 22;
        y += 6;

        // ----- The ring: every key at its hash, and who owns each stretch.
        const ringW = two ? 284 : Math.min(inner, 300);
        const ringX = two ? pad : pad + (inner - ringW) / 2;
        const ringY = y;
        const Rmax = ringW / 2 - 10;
        const dr = ringW >= 280 ? 1.8 : two ? 1.7 : 1.5;
        const sw = ringSwarm(Rmax, dr);
        const cx = ringX + ringW / 2;
        // 6 px plus the title's descent part the ring's title from the "0" over the ring.
        const cy = ringY + 18 + 14 + 6 + Rmax;
        const ringH = 18 + 14 + 6 + 2 * Rmax + 8;
        const ringTitle = ringMode
          ? pick(['The ring · a key belongs to the next point clockwise', 'The ring of hashes, clockwise from 0', 'The ring of hashes'], (t) => tw(t, 'label') <= (two ? ringW : inner))
          : pick([`Keys by hash · node = hash mod ${placed.members.length}`, 'Keys by hash'], (t) => tw(t, 'label') <= (two ? ringW : inner));
        D.text(two ? ringX : pad, ringY + 11, ringTitle, { role: 'label', owner: 'ring-title' });
        if (ringMode) {
          const byNode = {};
          // Each point owns the stretch that ends at it, clipped to [lo, hi) of the turn. While a change of points plays,
          // the hand recolours the band: the new points' arcs behind it, the old ones ahead.
          const arcs = (ring, lo, hi) =>
            ring.forEach((p, i) => {
              const q = ring[(i - 1 + ring.length) % ring.length];
              let a0 = q.at / M.TURN;
              let a1 = p.at / M.TURN;
              if (a1 <= a0) a1 += 1;
              for (const off of [-1, 0]) {
                const b0 = Math.max(a0 + off, lo);
                const b1 = Math.min(a1 + off, hi);
                if (b1 - b0 < 1e-6) continue;
                const [x0, y0] = polar(cx, cy, sw.rb, b0);
                const [x1, y1] = polar(cx, cy, sw.rb, b1);
                (byNode[p.node] ??= []).push(`M${x0.toFixed(2)} ${y0.toFixed(2)}A${sw.rb} ${sw.rb} 0 ${b1 - b0 > 0.5 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`);
              }
            });
          if (replay && frame && !frame.done) {
            const hand = frame.sweep ?? (frame.frac < T_SWEEP0 ? 0 : 1);
            arcs(replay.after.ring, 0, hand);
            arcs(replay.before.ring, hand, 1);
          } else arcs(placed.ring, 0, 1);
          // One path per node, so the band is at most six elements however many points there are.
          for (const m of placed.members) if (byNode[m]) D.add('marks', `<path class="band ${nodeCls(m)}" data-node="${m}" d="${byNode[m].join('')}"/>`);
        } else D.add('marks', `<circle class="track" cx="${cx}" cy="${cy}" r="${sw.rb}"/>`);
        // 0, where the ring starts and ends, and the direction a key walks.
        const zr = sw.outer + 2;
        D.add('marks', `<line class="zero" x1="${cx}" y1="${r1(cy - sw.rb - (ringMode ? 4 : 1))}" x2="${cx}" y2="${r1(cy - zr - 5)}"/>`);
        D.text(cx, cy - zr - 8, '0', { role: 'mono', anchor: 'middle', owner: 'zero', cls: 'muted' });
        if (ringMode) {
          const ar = sw.rb - 11;
          const [ax0, ay0] = polar(cx, cy, ar, 0.985);
          const [ax1, ay1] = polar(cx, cy, ar, 0.07);
          const [hx, hy] = polar(cx, cy, ar - 4, 0.058);
          const [hx2, hy2] = polar(cx, cy, ar + 4.5, 0.052);
          D.add('marks', `<path class="arrow" data-owner="cw" d="M${r1(ax0)} ${r1(ay0)}A${ar} ${ar} 0 0 1 ${r1(ax1)} ${r1(ay1)}M${r1(hx)} ${r1(hy)}L${r1(ax1)} ${r1(ay1)}L${r1(hx2)} ${r1(hy2)}"/>`);
          D.mark({ x0: ax0 - 2, x1: ax1 + 3, y0: ay0 - 3, y1: ay1 + 3 }, 'cw');
        }
        // The keys, each a dot in its owner's colour; a key that moved in the last change carries an ink ring.
        for (let i = 0; i < K; i++) {
          const p = sw.pos[i];
          const [x, yy] = polar(cx, cy, p.rad, p.a);
          const moved = showMoved && landedKey(i);
          (D.meta.ringDots ??= []).push([x, yy, dr]);
          D.add('dots', `<circle class="dot key ${nodeCls(ownerNow(i))}${moved ? ' moved' : ''}" data-id="k${i}" data-owner="keys" cx="${r1(x)}" cy="${r1(yy)}" r="${moved ? dr - 0.5 : dr}"${moved ? ' data-moved="1"' : ''}/>`);
        }
        const hotIds = s.hot ? (s.split ? M.SALT_AT.map((_, j) => K + 1 + j) : [HOT_I]) : [];
        for (const i of hotIds) {
          const p = sw.pos[i];
          const [x, yy] = polar(cx, cy, p.rad, p.a);
          D.add('dots', `<circle class="dot hot" data-id="h${i}" data-owner="keys" cx="${r1(x)}" cy="${r1(yy)}" r="${dr}"/>`);
        }
        // The band and its dots as marks: an annulus in 48 sectors, so the ring's corners and its middle stay free.
        for (let k = 0; k < 48; k++) {
          const pts = [k / 48, (k + 1) / 48].flatMap((a) => [polar(cx, cy, sw.rb - 5, a), polar(cx, cy, sw.outer + 1, a)]);
          D.mark({ x0: Math.min(...pts.map((p) => p[0])), x1: Math.max(...pts.map((p) => p[0])), y0: Math.min(...pts.map((p) => p[1])), y1: Math.max(...pts.map((p) => p[1])) }, 'ring-disc');
        }
        // One point a node: each point is named where it sits; a node that left keeps a struck chip there.
        if (ringMode && s.points === 1) {
          const chips = [];
          const gone = c ? c.left : [];
          const names = [...placed.members, ...gone.filter((m) => !placed.members.includes(m))];
          for (const m of names.sort((a, b) => M.hash32(`${a}#0`) - M.hash32(`${b}#0`))) {
            const a = M.hash32(`${m}#0`) / M.TURN;
            // A chip sits inside the band at its point; where two points are close the later chip steps along the band,
            // away from its neighbour, and its tick leans back to its own point.
            const rad = sw.rb - 18;
            let p = polar(cx, cy, rad, a);
            const near = chips.find((q) => Math.hypot(q[0] - p[0], q[1] - p[1]) < 30);
            if (near) {
              const dir = Math.sign(a - near[2]) || 1;
              for (let k = 1; k <= 60 && chips.some((q) => Math.hypot(q[0] - p[0], q[1] - p[1]) < 30); k++) p = polar(cx, cy, rad, a + (dir * k * 1.5) / (TAU * rad));
            }
            chips.push([p[0], p[1], a]);
            const out = gone.includes(m);
            const [tx, ty] = polar(cx, cy, sw.rb - 4, a);
            const dd = Math.hypot(tx - p[0], ty - p[1]);
            const [ux, uy] = [p[0] + ((tx - p[0]) * 8) / dd, p[1] + ((ty - p[1]) * 8) / dd];
            D.add('links', `<line class="pt-tick" x1="${r1(tx)}" y1="${r1(ty)}" x2="${r1(ux)}" y2="${r1(uy)}"/>`);
            // A node down or gone keeps a grey chip at its point, its letter beside the piles' critical ×.
            const hw = out ? 13 : 8;
            D.add('marks', `<rect class="chip-pt ${out ? 'gone' : ''}" ${out ? '' : `style="stroke:var(--n-${m.toLowerCase()})"`} x="${r1(p[0] - hw)}" y="${r1(p[1] - 8)}" width="${2 * hw}" height="16" rx="8"/>`);
            // The chip sits inside the band: the annulus's coarse sector boxes do not apply to it.
            D.text(out ? p[0] - 4 : p[0], p[1] + 4, m, { role: 'mono', anchor: 'middle', owner: `chip${m} ring-disc`, cls: out ? 'muted' : '', textCls: 'on-chip' });
            if (out) D.add('marks', `<path class="xmark" data-owner="chip${m}" stroke-width="1.6" d="M${r1(p[0] + 2.5)} ${r1(p[1] - 3)}l6 6M${r1(p[0] + 8.5)} ${r1(p[1] - 3)}l-6 6"/>`);
            D.mark({ x0: p[0] - hw, x1: p[0] + hw, y0: p[1] - 8, y1: p[1] + 8 }, `chip${m}`);
          }
        }
        // The ring's middle says what is placed on it.
        {
          const n = placed.members.length;
          const l1 = `${n} nodes${placed.members.length < sc.names.length ? ' up' : ''}`;
          const l2 = ringMode ? `${M.num(s.points)} ${plural(s.points, 'point', 'points')} each` : `hash mod ${n}`;
          D.place([[cx, cy - 1, 'middle']], [[l1, 'capB']], { owner: 'centre', optional: true });
          D.place([[cx, cy + 14, 'middle']], [[l2, 'small']], { owner: 'centre', optional: true });
        }
        // The stretch the strip magnifies, bracketed outside the dots; the followed key under a caret.
        const stripW = inner - 8;
        // While a change of points plays, the closer look keeps the old points until the hand passes the followed key.
        const lensPlaced = replay && frame && !frame.done && frame.frac < M.takeoff(M.FOLLOW) ? replay.before : sc.now;
        const win = lensWindow(ringMode ? lensPlaced.points : s.points, stripW);
        const fa = posOf(M.FOLLOW);
        const fp = sw.pos[M.FOLLOW];
        if (ringMode && win.f < 1) {
          const br = sw.outer + 4;
          const a0 = win.start;
          const a1 = win.start + win.f;
          const [bx0, by0] = polar(cx, cy, br, a0);
          const [bx1, by1] = polar(cx, cy, br, a1);
          const [cx0, cy0] = polar(cx, cy, br - 4, a0);
          const [cx1, cy1] = polar(cx, cy, br - 4, a1);
          const bpts = [];
          for (let t = 0; t <= 1.0001; t += 0.02) bpts.push(polar(cx, cy, br, a0 + win.f * t));
          D.link(bpts, 'bracket');
          D.add('marks', `<path class="bracket" data-owner="bracket" d="M${r1(cx0)} ${r1(cy0)}L${r1(bx0)} ${r1(by0)}A${br} ${br} 0 ${win.f > 0.5 ? 1 : 0} 1 ${r1(bx1)} ${r1(by1)}L${r1(cx1)} ${r1(cy1)}"/>`);
        }
        {
          // The caret sits outside the bracket, 6 px clear of it.
          const far = ringMode && win.f < 1 ? sw.outer + 4 + 6 : fp.rad + dr + 3;
          const [px, py] = polar(cx, cy, far, fa);
          const [qx, qy] = polar(cx, cy, far + 7, fa - 0.012);
          const [rx, ry] = polar(cx, cy, far + 7, fa + 0.012);
          D.add('marks', `<path class="caret" data-owner="follow" d="M${r1(px)} ${r1(py)}L${r1(qx)} ${r1(qy)}L${r1(rx)} ${r1(ry)}Z"/>`);
          D.mark({ x0: Math.min(px, qx, rx) - 1, x1: Math.max(px, qx, rx) + 1, y0: Math.min(py, qy, ry) - 1, y1: Math.max(py, qy, ry) + 1 }, 'follow');
          const [lx0, ly0] = polar(cx, cy, far + 12, fa);
          const name = M.KEYS[M.FOLLOW];
          const wn = tw(name, 'mono');
          // The name sits just outside the caret: candidates round it, nearest first.
          const near = [];
          for (const d of [12, 16, 20, 26])
            for (const da of [0, -0.015, 0.015, -0.03, 0.03]) {
              const [nx, ny] = polar(cx, cy, far + d, fa + da);
              const anchor = nx < cx - 8 ? 'end' : nx > cx + 8 ? 'start' : 'middle';
              near.push([nx, ny + 4, anchor]);
            }
          D.place(
            [...near, ...[0, -8, 8, -16, 16, -24, 24, -32, -40, -48].map((dy) => [two ? ringX + 2 : pad, py + 4 + dy, 'start']), [lx0 - 2, ly0 + 9, 'end'], [lx0 + 4, ly0 + 12, 'end'], [ringX + 2, ly0 + 12, 'start'], [ringX + 2, cy + Rmax + 4, 'start'], [lx0, ly0 + 14, 'middle']],
            [[name, 'mono']],
            { owner: 'follow ring-disc', ignore: 'follow', avoidDots: true, minX: (two ? ringX : pad) - 2, maxX: two ? ringX + ringW : W - pad },
          );
          void wn;
        }
        // The sweep hand of a play: the keys it has passed have left their piles.
        if (frame && frame.sweep !== null) {
          const [hx, hy] = polar(cx, cy, sw.outer + 2, frame.sweep);
          const [ix, iy] = polar(cx, cy, sw.rb - 6, frame.sweep);
          D.add('top', `<line class="sweep" x1="${r1(ix)}" y1="${r1(iy)}" x2="${r1(hx)}" y2="${r1(hy)}"/>`);
        }
        D.region('ring', { x: (two ? ringX : pad) - 4, y: ringY - 4, w: (two ? ringW : inner) + 8, h: ringH + 4 });

        // ----- The piles: what each node holds. A dot is a key; the hot key is one block as tall as its traffic, so a
        // pile's height is the node's load.
        const binsX = two ? pad + ringW + 20 : pad;
        const binsW = two ? inner - ringW - 20 : inner;
        // The gutter holds the row heads and the even label on one line ("even 33.3%"). A share loses its sign to the
        // row's head where "43.3%" would not keep 6 px from its neighbour.
        const gw0 = tw('even', 'small') + 4 + tw('33.3%', 'small') + 8;
        const bw0 = (binsW - gw0) / 6;
        const narrowPct = tw('43.3%', bw0 >= 40 ? 'mono' : 'small') + 6 > bw0;
        const heads = ['keys', narrowPct ? 'traffic %' : 'traffic', ...(ringMode ? [narrowPct ? 'of ring %' : 'of ring'] : []), 'in', 'out'];
        const gw = Math.max(gw0, ...['traffic %', 'of ring %'].map((t) => tw(t, 'small') + 8));
        const bw = (binsW - gw) / 6;
        // Beside the ring the piles take six dots a row at a larger pitch, so a play's keys are big enough to follow.
        const pile = two ? { c: 6, p: Math.min(6, (bw - 4) / 6), r: Math.min(2.5, ((bw - 4) / 6) * 0.42) } : bw >= 60 ? { c: 9, p: 6, r: 2.5 } : bw >= 48 ? { c: 8, p: 5.6, r: 2.35 } : bw >= 40 ? { c: 7, p: 4.8, r: 2 } : bw >= 34 ? { c: 7, p: 4.4, r: 1.85 } : { c: 7, p: 3.7, r: 1.5 };
        const rows = Math.ceil(MAX_SLOTS / pile.c);
        const PH = rows * pile.p + 26;
        const binsH = 36 + PH + 18 + 16 * 5 + 6;
        const binsY = two ? ringY + Math.max(0, ringH - binsH) : ringY + ringH + 14;
        const pileTop = binsY + 36;
        const by = pileTop + PH;
        const binX = (m) => binsX + gw + M.NAMES.indexOf(m) * bw;
        const pileX = (m) => binX(m) + (bw - pile.c * pile.p) / 2;
        const slotXY = (m, j) => [pileX(m) + ((j % pile.c) + 0.5) * pile.p, by - 2 - (Math.floor(j / pile.c) + 0.5) * pile.p];
        /** The height of a pile of `slots` key-heights: full rows plus the partial row's fraction (a unit chart's level). */
        const levelY = (slots) => by - 2 - (slots / pile.c) * pile.p;
        const scaleTop = levelY(MAX_SLOTS);
        D.text(binsX, binsY + 11, 'What each node holds', { role: 'label', owner: 'bins-title' });
        // The members drawn: the nodes now, and a node that went down keeps its place.
        const drawn = M.NAMES.filter((m) => sc.names.includes(m) || (c && c.left.includes(m)));
        const up = (m) => sc.now.members.includes(m);
        // A pile's keys in order: the ones that stayed by hash, then the ones that arrived, as they landed.
        const lists = {};
        const arrived = {};
        for (const m of drawn) {
          lists[m] = [];
          arrived[m] = new Set();
        }
        const order = Array.from({ length: K }, (_, i) => i).sort((a, b) => M.KEY_AT[a] - M.KEY_AT[b]);
        const flying = [];
        if (play) {
          for (const i of order) {
            const st = frame?.state.get(i);
            const mv = movedSet.get(i);
            if (!mv) lists[sc.now.owners[i]].push(i);
            else if (st && st.st === 'src') lists[mv.from]?.push(i);
          }
          for (const i of order) {
            const st = frame?.state.get(i);
            const mv = movedSet.get(i);
            if (!mv) continue;
            if (!st || st.st === 'dst') {
              lists[mv.to].push(i);
              arrived[mv.to].add(i);
            } else if (st.st === 'fly') flying.push(st);
          }
        } else for (const i of order) lists[sc.now.owners[i]].push(i);
        // The hot key's pieces on each pile: the pieces that stayed, then the ones that arrived in the last change.
        const hp = frame && !frame.done ? play.before : sc.now;
        const hotAt = {};
        const hotIn = {};
        for (const m of drawn) hotAt[m] = hotIn[m] = 0;
        if (s.hot) {
          const was = c && !(frame && !frame.done) ? c.before : null;
          if (s.split)
            hp.salts.forEach((o, j) => {
              if (!(o in hotAt)) return;
              hotAt[o]++;
              if (was && was.salts[j] !== o) hotIn[o]++;
            });
          else if (hp.hot in hotAt) {
            hotAt[hp.hot] = M.SALTS;
            if (was && was.hot !== hp.hot) hotIn[hp.hot] = M.SALTS;
          }
        }
        // The even share, in the pile's own unit: keys, or traffic once the hot key is on.
        const members = drawn.filter(up);
        const evenSlots = (K + (s.hot ? HOT_SLOTS : 0)) / members.length;
        const evenY = levelY(evenSlots);
        const evenX0 = binsX + gw - 2;
        const evenX1 = binX(drawn[drawn.length - 1]) + bw;
        // The piles' scale is the share of all traffic a pile's height stands for. A gridline within 17 px of the even
        // line gives way to it, line and label, so every line in the pile area carries its own label.
        const slotsPerPct = (K + (s.hot ? HOT_SLOTS : 0)) / 100;
        const gridX1 = binsX + binsW;
        D.meta.lines = [];
        for (const t of [25, 50, 75, 100]) {
          const slots = t * slotsPerPct;
          if (slots > MAX_SLOTS + 0.01) continue;
          const ty = levelY(slots);
          if (Math.abs(ty - evenY) < 19) continue;
          D.add('grid', `<line class="gridline" data-owner="axis" x1="${r1(evenX0)}" y1="${r1(ty)}" x2="${r1(gridX1)}" y2="${r1(ty)}"/>`);
          D.text(binsX + gw - 6, ty + 4, `${t}%`, { role: 'small', anchor: 'end', owner: 'axis', ground: true, data: ' data-gutter="1"' });
          D.meta.lines.push(ty);
        }
        D.add('grid', `<line class="evenline" data-owner="even" x1="${r1(evenX0)}" y1="${r1(evenY)}" x2="${r1(evenX1)}" y2="${r1(evenY)}"/>`);
        D.text(binsX + gw - 6, evenY + 4, [['even ', 'small'], [M.pctOf(100 / members.length), 'small', 'ink']], { anchor: 'end', owner: 'even', id: 'even', ground: true, data: ' data-gutter="1"' });
        D.meta.lines.push(evenY);
        D.text(binsX, binsY + 27, 'A pile’s height is its share of all traffic', { role: 'small', owner: 'axis-title' });
        D.meta.pile = { ...pile, by, pileTop, binX, bw, gw, binsX, evenSlots, evenY, lists, hotAt, levelY, scaleTop, slotsPerPct, area: { x0: binsX + gw, x1: binsX + binsW, y0: pileTop, y1: by }, tops: {} };
        for (const m of drawn) {
          const isUp = up(m);
          D.add('marks', `<line class="base ${isUp ? nodeCls(m) : 'gone'}" x1="${r1(pileX(m))}" y1="${by + 1.5}" x2="${r1(pileX(m) + pile.c * pile.p)}" y2="${by + 1.5}"/>`);
          // A node that is down: its letter beside the critical ×, under the base, where nothing else is drawn.
          const isDown = !isUp && m === sc.downNode;
          D.text(binX(m) + bw / 2 - (isDown ? 5 : 0), by + 18, m, { role: 'nameS', anchor: 'middle', owner: `bin${m}`, cls: isUp ? '' : 'muted' });
          if (isDown) xGlyph(D, binX(m) + bw / 2 + 7, by + 13.5, `bin${m}`, 3);
          lists[m].forEach((key, j) => {
            const [x, yy] = slotXY(m, j);
            const moved = showMoved && arrived[m].has(key);
            D.add('dots', `<circle class="dot key ${nodeCls(m)}${moved ? ' moved' : ''}" data-id="p${key}" data-owner="pile" cx="${r1(x)}" cy="${r1(yy)}" r="${moved ? pile.r - 0.5 : pile.r}"${moved ? ' data-moved="1"' : ''}/>`);
          });
          const n = lists[m].length;
          D.meta.pile.tops[m] = levelY(n);
          // The hot key, or its tenths, sit on the pile's level, filling the partial row's gap first (as water would),
          // so the stack's top is the node's whole load on the scale. One contiguous stack, a seam between tenths.
          if (hotAt[m]) {
            const each = HOT_SLOTS / M.SALTS;
            const total = s.split ? hotAt[m] * each : HOT_SLOTS;
            const x0 = pileX(m);
            const xR = x0 + pile.c * pile.p;
            const full = Math.floor(n / pile.c);
            const rem = n % pile.c;
            const notchEnd = rem ? (full + 1) * pile.c : n;
            const segPath = (a, b) => {
              const ya = (sl) => (sl <= notchEnd && rem ? by - 2 - full * pile.p - ((sl - n) / (pile.c - rem)) * pile.p : levelY(sl));
              if (rem && a < notchEnd) {
                const xn = x0 + rem * pile.p;
                const bNotch = Math.min(b, notchEnd);
                if (b <= notchEnd) return `M${r1(xn)} ${r1(ya(a))}H${r1(xR)}V${r1(ya(bNotch))}H${r1(xn)}Z`;
                return `M${r1(xn)} ${r1(ya(a))}H${r1(xR)}V${r1(levelY(b))}H${r1(x0)}V${r1(levelY(notchEnd))}H${r1(xn)}Z`;
              }
              return `M${r1(x0)} ${r1(levelY(a))}H${r1(xR)}V${r1(levelY(b))}H${r1(x0)}Z`;
            };
            const top = Math.min(n + total, MAX_SLOTS);
            const stayed = s.split ? (hotAt[m] - hotIn[m]) * each : hotIn[m] ? 0 : total;
            const parts = [
              [n, Math.min(n + stayed, top), false],
              [n + stayed, top, showMoved && hotIn[m] > 0],
            ];
            for (const [a, b, moved] of parts) {
              if (b - a < 0.01) continue;
              D.add('marks', `<path class="hot-block${moved ? ' moved' : ''}" data-owner="hot" data-node="${m}" d="${segPath(a, b)}"${moved ? ' data-moved="1"' : ''}${top < n + total ? ' data-cut="1"' : ''}/>`);
            }
            if (top > n) D.mark({ x0, x1: xR, y0: levelY(top), y1: levelY(n) }, 'hot');
            for (let q = 1; q < (s.split ? hotAt[m] : 1); q++) {
              const sl = n + q * each;
              if (sl < top) D.add('marks', `<line class="hot-seam" x1="${r1(x0 + 0.5)}" y1="${r1(levelY(sl))}" x2="${r1(xR - 0.5)}" y2="${r1(levelY(sl))}"/>`);
            }
            D.meta.pile.tops[m] = levelY(top);
            const h = levelY(n) - levelY(top);
            const xm = x0 + (pile.c * pile.p) / 2;
            if (top < n + total) {
              // Cut at the scale's end: the words say how much of the hot key's traffic the cut leaves out.
              const left = (M.HOT_PCT * (n + total - top)) / HOT_SLOTS;
              D.add('marks', `<path class="cut-mark" d="M${r1(xm - 4)} ${r1(levelY(top) - 2)}l4 -5l4 5z"/>`);
              const movedCut = showMoved && hotIn[m] > 0 && n + stayed >= top;
              D.text(xm, levelY(top) - 10, `hot +${M.pctOf(left)}`, { role: 'small', anchor: 'middle', owner: 'hot', cls: 'bad', id: 'hot-word', data: movedCut ? ' data-hot-moved="1"' : '' });
            } else if (!s.split && pile.c * pile.p >= 24 && levelY(Math.max(n, notchEnd)) - levelY(top) >= 14) {
              const moved = showMoved && hotIn[m] > 0;
              D.text(xm, (levelY(Math.max(n, notchEnd)) + levelY(top)) / 2 + 4, 'hot', { role: 'small', anchor: 'middle', owner: 'hot', cls: moved ? 'bad' : 'on-fill', textCls: 'on-block', id: 'hot-word', ground: true });
            }
          }
        }
        // Keys in flight: exactly the keys that are moving, each from its old pile to its new one. A flight lifts
        // straight off its pile, crosses well over every pile between and the even line, and drops onto its new pile.
        D.meta.flights = [];
        const colIdx = (m) => M.NAMES.indexOf(m);
        for (const st of flying) {
          const srcList = lists[st.from] ?? [];
          const [x0, y0] = slotXY(st.from, srcList.length);
          const [x1, y1] = slotXY(st.to, lists[st.to].length);
          const lo = Math.min(colIdx(st.from), colIdx(st.to));
          const hi = Math.max(colIdx(st.from), colIdx(st.to));
          const highest = Math.min(evenY, ...drawn.filter((m) => colIdx(m) >= lo && colIdx(m) <= hi).map((m) => D.meta.pile.tops[m]));
          const head = highest - (pileTop + 4);
          const apex = Math.max(pileTop + 4, highest - Math.max(48, 0.35 * Math.abs(x1 - x0), 0.4 * head));
          const u = st.u;
          const ease = (t) => 1 - (1 - t) * (1 - t);
          let x;
          let yy;
          if (u < 0.15) [x, yy] = [x0, y0 + (apex - y0) * ease(u / 0.15)];
          else if (u > 0.85) [x, yy] = [x1, apex + (y1 - apex) * (1 - ease(1 - (u - 0.85) / 0.15))];
          else {
            const t = (u - 0.15) / 0.7;
            x = x0 + (x1 - x0) * (t * t * (3 - 2 * t));
            yy = apex - Math.min(6, apex - pileTop - 2) * Math.sin(Math.PI * t);
          }
          D.add('fly', `<circle class="dot key fly ${nodeCls(st.to)}" data-id="f${st.key}" cx="${r1(x)}" cy="${r1(yy)}" r="${pile.r}"/>`);
          D.meta.flights.push({ x, y: yy, u, from: st.from, to: st.to });
        }
        // The table under the piles: a row a fact, the rows with nothing to say left out and their room kept at the foot.
        const cellRole = bw >= 40 ? 'mono' : 'small';
        const q = hid.numbers ? () => '?' : null;
        const pctCell = (tenths) => (narrowPct ? M.pctCol(tenths).replace('%', '') : M.pctCol(tenths));
        const counts = Object.fromEntries(drawn.map((m) => [m, lists[m].length]));
        const live = frame && !frame.done;
        // A key counts in and out when it lands; in flight it is in neither, and the headline says how many fly.
        const landedFrom = (m) => (c?.moves ?? []).filter((mv) => mv.from === m && (!live || frame.state.get(mv.key).st === 'dst')).length;
        const inNow = (m) => (live ? [...arrived[m]].length : c.into[m]);
        const outNow = (m) => (live ? landedFrom(m) : c.out[m]);
        const tableRows = [
          ['keys', (m) => (up(m) ? M.num(counts[m]) : m === sc.downNode ? 'down' : 'left'), 'keys'],
          [heads[1], (m) => (up(m) ? pctCell(live ? (s.hot ? Math.floor((7 * counts[m] + 60 * hotAt[m] + 1) / 2) : 5 * counts[m]) : (sc.traffic[m] ?? 0)) : ''), 'traffic'],
          ...(ringMode ? [[heads[2], (m) => (up(m) ? (narrowPct ? M.pctColOf(placed.ringShare[m] * 100).replace('%', '') : M.pctColOf(placed.ringShare[m] * 100)) : ''), 'ring']] : []),
          ...(c
            ? [
                ['in', (m) => (inNow(m) ? `+${M.num(inNow(m))}` : up(m) || c.left.includes(m) ? '0' : ''), 'in'],
                ['out', (m) => (outNow(m) ? `−${M.num(outNow(m))}` : up(m) ? '0' : ''), 'out'],
              ]
            : []),
        ];
        // Critical ink marks the busiest shard only while something is wrong: the hot key unsplit, or the challenge's
        // bound not yet met.
        const alarm = s.hot && !hid.numbers && (!s.split || (view.phase === 'challenge' && !view.met));
        tableRows.forEach(([head, cell, id], k) => {
          const ty = by + 18 + 16 * (k + 1);
          D.text(binsX + gw - 6, ty, head, { role: 'small', anchor: 'end', owner: `row-${id}` });
          for (const m of drawn) {
            const raw = cell(m);
            const down = raw === 'down';
            const left = raw === 'left';
            const txt = down ? (bw >= 34 ? 'down' : '') : left ? 'left' : q && raw !== '' ? q() : raw;
            if (!txt) continue;
            const busy = id === 'traffic' && alarm && m === sc.busiest;
            D.text(binX(m) + bw / 2, ty, txt, { role: cellRole, anchor: 'middle', owner: `cell-${id}-${m}`, cls: down || busy ? 'bad' : left ? 'muted' : '', id: down || left ? undefined : `cell-${id}-${m}` });
          }
        });
        D.region('bins', { x: binsX - 4, y: binsY - 4, w: binsW + 8, h: binsH + 4 });
        y = Math.max(ringY + (two ? ringH : 0), binsY + binsH) + 12;

        // ----- The last change, in the model's exact counts. The block holds only the lines it uses; the stage's spare
        // height collects once, at its foot.
        D.add('grid', `<line class="rule" x1="${pad}" y1="${y}" x2="${W - pad}" y2="${y}"/>`);
        const vY = y + 12;
        const res = reserves(inner, narrow);
        const labelText = c ? `Last change · ${M.changeLabel(c)}` : 'Last change · none yet';
        D.text(pad, vY + 11, labelText, { role: 'label', owner: 'verdict' });
        let headline;
        if (!c) headline = [['No node has joined or left', 'head', 'muted']];
        else if (hid.moved) headline = [['?', 'head'], [` of ${M.num(K)} keys moved`, 'head', 'muted', 6]];
        else if (live) headline = [[M.num(frame.landed), 'head'], [` of ${M.num(K)} keys moved so far`, 'head', 'muted']];
        else headline = [[M.num(c.moved), 'head'], [` of ${M.num(K)} keys moved`, 'head', 'muted']];
        const headForms = [headline, live && !hid.moved ? [[M.num(frame.landed), 'head'], [' moved so far', 'head', 'muted']] : !c ? [['No node joined or left', 'head', 'muted']] : headline];
        // The hidden count's dashed box sits inside the text column, 6 px before "of".
        const hb = D.text(pad + (c && hid.moved ? 4 : 0), vY + 37, pick(headForms, (h) => partsWidth(h) <= inner), { owner: 'verdict', id: 'moved-count' });
        if (c && hid.moved) D.add('marks', `<rect class="hidden-box" x="${r1(pad + 0.5)}" y="${r1(hb.y0 - 3)}" width="${tw('?', 'head') + 7}" height="22" rx="4"/>`);
        const { story: storyText, standing: standingText, reserve } = verdictWords(sc, view, hid, c, frame, narrow);
        const storyLines = storyText.flatMap((l) => wrap(l, 'cap', inner));
        storyLines.forEach((l, k) => D.text(pad, vY + 58 + 18 * k, l, { role: 'cap', owner: 'verdict', id: k === 0 ? 'story' : undefined }));
        const storyRoom = Math.max(storyLines.length, reserve ? reserve.story(inner) : 0);
        const standingLines = wrap(standingText, 'cap', inner).filter(Boolean);
        const sY = vY + 58 + 18 * storyRoom + 6;
        standingLines.forEach((l, k) => D.text(pad, sY + 18 * k, l, { role: 'cap', owner: 'verdict', id: k === 0 ? 'standing' : undefined }));
        const used = storyRoom + Math.max(standingLines.length, reserve ? reserve.standing(inner) : 0);
        const vH = 58 + 18 * used - 2 - (standingLines.length || reserve ? 0 : 6);
        D.region('verdict', { x: pad - 4, y: vY - 4, w: inner + 8, h: vH + 8 });
        y = vY + vH + 12;

        // ----- A closer look: the followed key's rule, and the stretch of ring around it, magnified.
        D.add('grid', `<line class="rule" x1="${pad}" y1="${y}" x2="${W - pad}" y2="${y}"/>`);
        const lY = y + 12;
        const lr = two ? 3 : 2.5;
        const keysHAll = Math.max(...M.POINTS.filter((p) => p > 1).map((p) => lensLanes(stripW, lr, p) * (2 * lr + 1)));
        const sx0 = pad + 4;
        const pct1 = (x) => `${x >= 0.1 ? Math.round(x * 100) : (x * 100).toFixed(1)}%`;
        const mag = Math.round(stripW / win.f / (TAU * sw.rb));
        const follow = M.KEYS[M.FOLLOW];
        // At least 9 keys in the remainder table at every width: the ids lose "user:" to the row's head.
        const gwM = Math.max(56, tw('hash mod 6', 'small') + 10);
        const nMod = Math.min(11, Math.max(9, Math.floor((stripW - gwM) / 26))) | 1;
        const lensTitle = ringMode
          ? win.f >= 1
            ? pick(['A closer look · the whole ring, laid flat from 0', 'The whole ring, laid flat'], (t) => tw(t, 'label') <= inner)
            : pick([`A closer look · ${pct1(win.f)} of the ring around ${follow}, magnified ${mag}×`, `${pct1(win.f)} of the ring around ${follow}, ${mag}×`, `${pct1(win.f)} of the ring, ${mag}×`], (t) => tw(t, 'label') <= inner)
          : pick([`A closer look · the ${nMod} keys nearest ${follow} by hash`, `The ${nMod} keys nearest ${follow}`], (t) => tw(t, 'label') <= inner);
        D.text(pad, lY + 11, lensTitle, { role: 'label', owner: 'lens-title' });
        if (ringMode && tw(lensTitle, 'label') + 16 + tw('clockwise →', 'small') <= inner) D.text(W - pad, lY + 11, 'clockwise →', { role: 'small', anchor: 'end', owner: 'cw2' });
        const ruleText = ruleWords(sc, hid, live || !!replay, inner, ringMode);
        const ruleLines = wrap(ruleText, 'cap', inner);
        ruleLines.forEach((l, k) => D.text(pad, lY + 32 + 18 * k, l, { role: 'cap', owner: 'rule', id: k === 0 ? 'rule' : undefined }));
        const stripTop = lY + 32 + 18 * ruleLines.length - 6;
        const keysH = keysHAll + 10;
        const bandY = stripTop + 18 + keysH + 6;
        const lensH = bandY + 8 + 22 - lY;
        if (ringMode) {
          const X = (a) => sx0 + (rel(a, win.start) / win.f) * stripW;
          const inWin = (a) => win.f >= 1 || rel(a, win.start) < win.f;
          const ring = lensPlaced.ring;
          // Arcs: each point owns the stretch that ends at it.
          const pts = ring.map((p) => ({ ...p, rp: rel(p.at / M.TURN, win.start) })).sort((a, b) => a.rp - b.rp);
          let prevX = sx0;
          const segs = [];
          const visible = pts.filter((p) => p.rp < win.f || win.f >= 1);
          for (const p of visible) {
            const x = sx0 + (p.rp / win.f) * stripW;
            segs.push({ x0: prevX, x1: x, node: p.node, point: p });
            prevX = x;
          }
          const after = pts.find((p) => p.rp >= win.f && win.f < 1) ?? pts[0];
          segs.push({ x0: prevX, x1: sx0 + stripW, node: after.node, point: null });
          const byNode = {};
          for (const g of segs) if (g.x1 - g.x0 > 0.01) (byNode[g.node] ??= []).push(`M${r1(g.x0)} ${bandY}H${r1(g.x1)}`);
          for (const m of Object.keys(byNode)) D.add('marks', `<path class="band ${nodeCls(m)}" data-lens="1" d="${byNode[m].join('')}"/>`);
          D.mark({ x0: sx0, x1: sx0 + stripW, y0: bandY - 4, y1: bandY + 4 }, 'lens-band');
          // Points: a tick where each arc ends, named where the names keep 6 px apart.
          const fresh = c && (!frame || frame.pointsIn) ? c.joined : [];
          let lastLabel = -Infinity;
          const whole = win.f >= 1;
          for (const g of segs) {
            if (!g.point) continue;
            const isNew = fresh.includes(g.node);
            D.add('marks', `<line class="pt-tick${isNew ? ' new' : ''}" data-owner="pt" x1="${r1(g.x1)}" y1="${bandY - 7}" x2="${r1(g.x1)}" y2="${bandY + 8}"/>`);
            const wl = tw(g.node, 'mono');
            const lx = Math.min(Math.max(g.x1, sx0 + wl / 2), sx0 + stripW - wl / 2);
            if (!whole && lx - wl / 2 - lastLabel >= 6) {
              D.text(lx, bandY + 20, g.node, { role: 'mono', anchor: 'middle', owner: 'pt', id: 'pt-name', data: ' data-xtick="1"' });
              lastLabel = lx + wl / 2;
            }
          }
          // A node down or gone keeps a struck grey tick at its point, as its chip on the ring does.
          if (whole)
            for (const m of c?.left ?? []) {
              const x = X(M.hash32(`${m}#0${M.POINT_SALT}`) / M.TURN);
              D.add('marks', `<line class="pt-tick gone-tick" data-owner="pt" x1="${r1(x)}" y1="${bandY - 7}" x2="${r1(x)}" y2="${bandY + 8}" style="stroke:var(--g-viz-discarded-ink)"/>`);
              D.add('marks', `<path class="xmark" data-owner="pt" stroke-width="1.4" d="M${r1(x - 3)} ${bandY - 3}l6 6M${r1(x + 3)} ${bandY - 3}l-6 6"/>`);
            }
          // The whole ring holds every key: its arcs say their counts, and only the followed key is drawn. One form for
          // the whole row, the longest that fits every arc that can carry a label.
          if (whole) {
            const longest = {};
            for (const g of segs) if (!longest[g.node] || g.x1 - g.x0 > longest[g.node].x1 - longest[g.node].x0) longest[g.node] = g;
            const arcsL = Object.entries(longest).sort((a, b) => a[1].x0 - b[1].x0);
            const formOf = (m, k) => {
              const n = hid.numbers ? '?' : M.num(lensPlaced.counts[m]);
              return [`${m}: ${n} ${lensPlaced.counts[m] === 1 && !hid.numbers ? 'key' : 'keys'}`, `${m}: ${n}`, m][k];
            };
            const layout = (k) => {
              let last = -Infinity;
              const out = [];
              for (const [m, g] of arcsL) {
                const t = formOf(m, k);
