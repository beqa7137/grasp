        const setupM = M.run(spec.setup);
        const changed = configKey(spec.setup) !== configKey(after);
        return {
          s,
          hide: phase === 'revealed' ? [] : spec.hide,
          exp: e,
          spec,
          phase,
          chosen: e.answer === 0 ? 1 : 0,
          focus: phase === 'revealed' ? spec.focus : [],
          setupRho: setupM.rho,
          configChanged: changed,
          rhoChanged: Math.abs(M.run(after).rho - setupM.rho) > 1e-9,
          ghost: phase !== 'asking' && changed ? spec.setup : null,
          ghostName: 'before',
          tau: phase === 'playing' ? Number(params.get('tau') ?? 180) : null,
        };
      }

      // ---------- The page around the stage.
      function controlsHtml(m, view) {
        const s = m.settings;
        const locked = view.phase === 'asking' || view.phase === 'playing';
        const dis = locked ? ' disabled' : '';
        const seg = (name, items, cur) =>
          items.map(([v, label]) => `<label class="segment"><input type="radio" name="${name}" ${v === cur ? 'checked' : ''}/><span>${label}</span></label>`).join('');
        return `<fieldset class="group servers-control"${dis}><legend class="control-label">Servers</legend><div class="segments">${seg(
          'servers',
          M.SERVERS.map((k) => [k, String(k)]),
          s.servers,
        )}</div></fieldset>
<fieldset class="group queue-control"${locked || s.servers === 1 ? ' disabled' : ''}><legend class="control-label">Queue</legend><div class="segments">${seg(
          'queue',
          [
            ['shared', 'One queue'],
            ['split', 'A queue each'],
          ],
          s.queue,
        )}</div></fieldset>
<fieldset class="group"${dis}><legend class="control-label">Conditions</legend><div class="toggles">
<label class="segment"><input type="checkbox" ${s.service === 'steady' ? 'checked' : ''}/><span>Steady work<small>${fms(M.SERVICE_MS)} each</small></span></label>
<label class="segment"><input type="checkbox" ${s.down ? 'checked' : ''}${s.servers === 1 ? ' disabled' : ''}/><span>A server down<small>its traffic moves</small></span></label></div></fieldset>
<p class="notice" aria-live="polite">${esc(noticeOf(m, view))}</p>`;
      }
      function noticeOf(m, view) {
        if (view.phase === 'asking') return 'Play and the settings this question is about wait for your answer.';
        if (view.phase === 'playing') return '';
        if (view.phase === 'challenge') return '';
        return 'Drag the load, or change the servers, the queue and the conditions; Play runs the sample.';
      }
      const ICON_RIGHT = '<svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--g-success-line)"/><path d="M6 10.2l2.6 2.6 5.2-5.6" fill="none" stroke="var(--g-surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const ICON_WRONG = '<svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--g-danger)"/><path d="M7 7l6 6M13 7l-6 6" fill="none" stroke="var(--g-surface)" stroke-width="2" stroke-linecap="round"/></svg>';
      function goalChecks(m) {
        const b = M.CHALLENGE_BOUNDS;
        const p99 = m.stable ? fdur(m.p99) : 'no steady state';
        return [
          { text: `p99 with one server down: ${p99}, under ${fms(b.p99)}`, met: m.stable && m.p99 < b.p99 },
          { text: `the fleet at ${m.settings.load}% busy with all up, at least ${b.load}%`, met: m.settings.load >= b.load },
        ];
      }
      function dockHtml(m, view) {
        const e = view.exp;
        if (!e) return '';
        if (view.phase === 'challenge') {
          const checks = goalChecks(m);
          const kept = M.goalMet({ all: [], keep: view.spec.goal.keep }, m.settings, m.metrics);
          const status = view.met ? 'Goal met:' : kept ? '' : 'The goal keeps a server down and random work.';
          return `<p class="legend">${esc(e.ask)}</p>${status ? `<p class="status-line${view.met ? ' met' : ''}" role="status">${view.met ? ICON_RIGHT : ''}${esc(status)}</p>` : ''}<ul class="status">${checks
            .map((c) => `<li class="${c.met ? 'met' : ''}"><span class="state" aria-hidden="true">${c.met ? '✓' : '·'}</span><span>${esc(c.text)}</span></li>`)
            .join('')}</ul>${view.met ? `<p class="reveal" aria-live="polite">${esc(e.reveal)}</p>` : ''}`;
        }
        if (view.phase === 'asking') {
          return `<fieldset style="border:0;padding:0;margin:0"><legend class="legend">${esc(e.ask)}</legend><div class="options">${e.choices.map((c) => `<button class="g-choice">${esc(c)}</button>`).join('')}</div></fieldset>`;
        }
        const marked = e.choices
          .map((c, i) => {
            const right = view.phase === 'revealed' && i === e.answer;
            const wrong = view.phase === 'revealed' && i === view.chosen && !right;
            const chosen = view.phase === 'playing' && i === view.chosen;
            return `<li class="g-choice${right ? ' right' : wrong ? ' wrong' : ''}"${chosen ? ' style="border-style:dashed"' : ''}><span>${esc(c)}${chosen ? ' <small>(your guess)</small>' : ''}</span>${right ? ICON_RIGHT : wrong ? ICON_WRONG : ''}</li>`;
          })
          .join('');
        if (view.phase === 'playing') return `<p class="legend">${esc(e.ask)}</p><ul class="options">${marked}</ul><p class="held">Watch the picture: the answer plays out on it.</p>`;

        document.body.dataset.ready = '1';
      });
    </script>
  </body>
