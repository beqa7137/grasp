<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reliability widget mockup</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url(fonts/inter-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        src: url(fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 800;
        font-display: block;
      }
      /* The app's tokens (apps/app/src/_theme.scss, styles.scss): light is the base, dark overrides. */
      :root {
        color-scheme: light;
        --g-bg: #f4f5f9;
        --g-surface: #ffffff;
        --g-raised: #ffffff;
        --g-sunken: #eef0f5;
        --g-line: #dfe2ea;
        --g-line-strong: #c6cbd6;
        --g-stroke: #707889;
        --g-text: #161a23;
        --g-text-rgb: 22, 26, 35;
        --g-muted: #4a5263;
        --g-faint: #5c6477;
        --g-on-fill: #ffffff;
        --g-warn-ink: #6e4200;
        --g-danger-ink: #9d1630;
        --g-found-ink: #02583f;
        --g-accent: #5846dc;
        --g-accent-rgb: 88, 70, 220;
        --g-accent-soft: rgba(88, 70, 220, 0.14);
        --g-found: #036b4c;
        --g-danger: #c3203d;
        --g-warn: #945800;
        --g-success-ink: var(--g-found-ink);
        --g-success-line: var(--g-found);
        --g-success-soft: rgba(3, 107, 76, 0.12);
        --g-danger-soft: rgba(195, 32, 61, 0.12);
        --g-warn-soft: rgba(148, 88, 0, 0.12);
        --g-viz-stage: #f7f8fb;
        --g-viz-current: #0b74ad;
        --g-viz-current-soft: rgba(11, 116, 173, 0.16);
        --g-viz-considering: #c77700;
        --g-viz-considering-soft: rgba(199, 119, 0, 0.14);
        --g-viz-final: #12925f;
        --g-viz-final-ink: var(--g-found-ink);
        --g-viz-discarded-ink: #687082;
        --g-viz-critical: #d42a49;
        --g-viz-track: #d3d7e0;
        --g-shadow: 0 1px 2px rgba(var(--g-text-rgb), 0.06), 0 3px 10px rgba(var(--g-text-rgb), 0.07);
        --g-shadow-raised: 0 1px 2px rgba(var(--g-text-rgb), 0.08);
        --g-radius-xs: 6px;
        --g-radius-sm: 10px;
        --g-radius-md: 14px;
        --g-radius-pill: 999px;
        --g-text-title-m: 1.0625rem;
        --g-text-title-s: 0.9375rem;
        --g-text-body: 0.875rem;
        --g-text-body-s: 0.8125rem;
        --g-text-label: 0.6875rem;
        --g-font: 'Inter Variable', system-ui, sans-serif;
        --g-font-mono: 'JetBrains Mono Variable', ui-monospace, monospace;
        --g-focus-ring: 2px solid var(--g-accent);
      }
      :root.dark {
        color-scheme: dark;
        --g-bg: #0b0d12;
        --g-surface: #141824;
        --g-raised: #1c2130;
        --g-sunken: #0f121a;
        --g-line: #252a37;
        --g-line-strong: #343b4d;
        --g-stroke: #6b7387;
        --g-text: #e9ebf2;
        --g-text-rgb: 233, 235, 242;
        --g-muted: #8b93a8;
        --g-faint: #828a9e;
        --g-on-fill: #0b0d12;
        --g-warn-ink: #f3e6b3;
        --g-danger-ink: #ffb3bd;
        --g-found-ink: #3ddc97;
        --g-accent: #9d8cff;
        --g-accent-rgb: 157, 140, 255;
        --g-accent-soft: rgba(157, 140, 255, 0.14);
        --g-found: #3ddc97;
        --g-danger: #ff5d73;
        --g-warn: #ffb547;
        --g-success-soft: rgba(61, 220, 151, 0.12);
        --g-danger-soft: rgba(255, 93, 115, 0.12);
        --g-warn-soft: rgba(255, 181, 71, 0.12);
        --g-viz-stage: #0e1118;
        --g-viz-current: #1f9fd0;
        --g-viz-current-soft: rgba(31, 159, 208, 0.16);
        --g-viz-considering: #c08420;
        --g-viz-considering-soft: rgba(192, 132, 32, 0.18);
        --g-viz-final: #22ad74;
        --g-viz-final-ink: var(--g-found);
        --g-viz-discarded-ink: var(--g-muted);
        --g-viz-critical: #e5485f;
        --g-viz-track: #2a3040;
        --g-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        --g-shadow-raised: var(--g-shadow);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--g-bg);
        color: var(--g-text);
        font: 400 var(--g-text-body) / 1.5 var(--g-font);
        font-variant-ligatures: none;
        -webkit-font-smoothing: antialiased;
        overflow-wrap: break-word;
      }
      button {
        font-size: 0.8333rem;
      }
      .page {
        max-width: 1048px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      .eyebrow {
        margin: 0;
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
      }
      h1 {
        margin: 4px 0 14px;
        font: 600 1.25rem/1.3 var(--g-font);
      }
      .panel {
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background: var(--g-surface);
        box-shadow: var(--g-shadow);
        padding: 16px;
      }
      /* Narrow: one column, the controls as the stage's first rows, then the stage, the question, Describe, the cards. */
      .widget {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }
      .main,
      .experiments {
        display: contents;
      }
      .controls {
        order: 1;
      }
      .stage {
        order: 2;
        min-width: 0;
      }
      .dock {
        order: 3;
      }
      .describe {
        order: 4;
      }
      .heading,
      .cards {
        order: 5;
      }
      .controls {
        padding: 12px 12px 0;
        border: 1px solid var(--g-line);
        border-bottom: 0;
        border-radius: var(--g-radius-md) var(--g-radius-md) 0 0;
        background: var(--g-viz-stage);
        display: grid;
        gap: 10px;
        min-width: 0;
      }
      .stage {
        margin-top: -12px;
      }
      .stage .well {
        border-top: 0;
        border-radius: 0 0 var(--g-radius-md) var(--g-radius-md);
      }
      @media (min-width: 1000px) {
        .widget {
          grid-template-columns: minmax(0, 1fr) 340px;
          grid-template-rows: auto 1fr;
          align-items: start;
          column-gap: 20px;
        }
        .main {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: 12px;
          grid-column: 1;
          grid-row: 1 / span 2;
          min-width: 0;
        }
        .controls {
          grid-column: 2;
          grid-row: 1;
          padding: 0;
          border: 0;
          background: none;
        }
        .experiments {
          display: block;
          grid-column: 2;
          grid-row: 2;
          min-width: 0;
        }
        .stage {
          margin-top: 0;
        }
        .stage .well {
          border-top: 1px solid var(--g-line);
          border-radius: var(--g-radius-md);
        }
        .dock {
          margin-top: 12px;
        }
      }
      .well {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background-color: var(--g-viz-stage);
        background-image: radial-gradient(circle, rgba(var(--g-text-rgb), 0.09) 1px, transparent 1.5px);
        background-size: 24px 24px;
        background-position: 11px 11px;
      }
      /* Every fieldset.group carries the same zero padding; a control's own class only adds to it (the R41 padding bug). */
      fieldset.group {
        margin: 0;
        padding: 0;
        border: 0;
        min-width: 0;
      }
      .control-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
        padding: 0;
        margin-bottom: 4px;
      }
      .segments {
        display: flex;
        gap: 4px;
      }
      .segment {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
      }
      .segment input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .segment span {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 6px;
        border-radius: var(--g-radius-sm);
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        font: 500 var(--g-text-body) / 1.15 var(--g-font);
        text-align: center;
      }
      .segment input:checked + span {
        background: var(--g-accent-soft);
        border-color: var(--g-accent);
        box-shadow: inset 0 0 0 1px var(--g-accent);
        font-weight: 600;
      }
      fieldset:disabled .segment span,
      .segment input:disabled + span {
        opacity: 0.55;
      }
      .control-label .why {
        font-weight: 500;
        letter-spacing: normal;
        text-transform: none;
      }
      .segment small {
        font: 500 var(--g-text-label) var(--g-font);
        color: var(--g-muted);
      }
      .toggles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .toggles .segment span {
        flex-direction: column;
        gap: 0;
        font-size: var(--g-text-body-s);
      }
      .notice {
        margin: 0;
        min-height: 2lh;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      /* Below wide the notice would sit over the stage and push it down as it speaks: read out only (_widget-controls.scss). */
      @media (max-width: 999px) {
        .notice {
          position: absolute;
          width: 1px;
          height: 1px;
          min-height: 0;
          overflow: hidden;
          clip-path: inset(50%);
        }
        .controls {
          padding-bottom: 12px;
        }
      }
      .caption {
        margin: 0;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      .play {
        position: absolute;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        z-index: 2;
      }
      .play svg {
        display: block;
        width: 36px;
        height: 36px;
        margin: 4px;
      }
      .play circle {
        fill: var(--g-raised);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .play path {
        fill: var(--g-accent);
      }
      .play:disabled {
        cursor: default;
        opacity: 0.55;
      }
      .handle {
        position: absolute;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        cursor: ew-resize;
        z-index: 2;
      }
      .handle .knob {
        width: 14px;
        height: 26px;
        border-radius: var(--g-radius-pill);
        background: var(--g-raised);
        border: 2px solid var(--g-accent);
        box-shadow: var(--g-shadow-raised);
      }
      .handle[aria-disabled='true'] {
        cursor: default;
      }
      .handle[aria-disabled='true'] .knob {
        opacity: 0.55;
      }
      /* Drawing roles: text sits on a stage-coloured halo; small text is measured as drawn (no tabular digits). */
      svg.draw {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        overflow: visible;
      }
      svg.draw text {
        paint-order: stroke;
        stroke: var(--g-viz-stage);
        stroke-width: 3px;
        stroke-linejoin: round;
      }
      svg.draw text.on-box {
        stroke: var(--g-raised);
      }
      svg.draw text.on-chip {
        stroke: none;
      }
      svg.draw text.on-sunken {
        stroke: var(--g-sunken);
      }
      .t-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: var(--g-muted);
      }
      .t-cap {
        font: 500 var(--g-text-body-s) var(--g-font);
        fill: var(--g-muted);
      }
      .t-capB {
        font: 600 var(--g-text-body-s) var(--g-font);
        fill: var(--g-text);
      }
      .t-small {
        font: 500 var(--g-text-label) var(--g-font);
        fill: var(--g-muted);
      }
      .t-smallB {
        font: 700 var(--g-text-label) var(--g-font);
        fill: var(--g-text);
      }
      .t-mono {
        font: 600 var(--g-text-label) var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-nameS {
        font: 600 13px var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-head {
        font: 600 var(--g-text-title-m) var(--g-font-mono);
        fill: var(--g-text);
      }
      .ink {
        fill: var(--g-text);
      }
      .muted {
        fill: var(--g-muted);
      }
      .bad {
        fill: var(--g-danger-ink);
      }
      .wait-ink {
        fill: var(--g-warn-ink);
      }
      .cur-ink {
        fill: var(--g-viz-current);
      }
      .crit-ink {
        fill: var(--g-viz-critical);
      }
      .rule {
        stroke: var(--g-line);
      }
      .t-unit {
        text-transform: none;
      }
      /* The chain: wires are structure (3:1 on the stage), the request's path is the current tone. */
      .wire {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1.25;
      }
      .wire.soft {
        stroke-opacity: 0.6;
      }
      .path {
        fill: none;
        stroke: var(--g-viz-current);
        stroke-width: 2.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .path-hidden {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1.25;
        stroke-dasharray: 4 3;
      }
      .box {
        fill: var(--g-raised);
        stroke: var(--g-line-strong);
        stroke-width: 1.25;
      }
      .box.serving {
        stroke: var(--g-viz-current);
        stroke-width: 2;
      }
      .box.next {
        fill: var(--g-viz-current-soft);
        stroke: var(--g-viz-current);
      }
      .box.down {
        fill: url(#hatch);
        stroke: var(--g-viz-discarded-ink);
        stroke-width: 1.25;
      }
      .hatch-fill {
        fill: var(--g-sunken);
      }
      .hatch-line {
        stroke: var(--g-viz-discarded-ink);
        stroke-opacity: 0.4;
        stroke-width: 1.5;
      }
      .xmark {
        stroke: var(--g-viz-critical);
        stroke-width: 2;
        stroke-linecap: round;
        fill: none;
      }
      .xground {
        fill: var(--g-viz-stage);
      }
      .stop {
        fill: var(--g-viz-critical);
        stroke: var(--g-viz-stage);
        stroke-width: 1.5;
        paint-order: stroke;
      }
      .xground.on-box {
        fill: var(--g-raised);
      }
      .ok-ring {
        fill: var(--g-viz-stage);
        stroke: var(--g-viz-final);
        stroke-width: 1.75;
      }
      .ok-mark {
        fill: none;
        stroke: var(--g-viz-final);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bad-ring {
        fill: var(--g-viz-stage);
        stroke: var(--g-viz-critical);
        stroke-width: 1.75;
      }
      .q-ring {
        fill: var(--g-viz-stage);
        stroke: var(--g-stroke);
        stroke-width: 1.25;
        stroke-dasharray: 3 2.5;
      }
      .start-dot {
        fill: var(--g-viz-current);
      }
      .start-dot.hidden {
        fill: var(--g-stroke);
      }
      /* The year: a copy's outage is a neutral tick; what reaches the request is critical. */
      .row-track {
        stroke: var(--g-line);
      }
      .strip-track {
        stroke: var(--g-line-strong);
      }
      .tick-copy {
        fill: var(--g-text);
        fill-opacity: 0.62;
      }
      .tick-fail {
        fill: var(--g-viz-critical);
      }
      .tick-bypassed {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1;
      }
      .req-hidden {
        fill: none;
        stroke: var(--g-stroke);
        stroke-dasharray: 4 3;
      }
      .req-band {
        fill: rgba(var(--g-text-rgb), 0.04);
      }
      .axis {
        stroke: var(--g-line-strong);
      }
      .gridline {
        stroke: var(--g-line);
      }
      .moment {
        stroke: var(--g-text);
        stroke-opacity: 0.4;
      }
      .moment-head {
        fill: var(--g-text);
        fill-opacity: 0.7;
      }
      .ring {
        fill: none;
        stroke: var(--g-text);
        stroke-width: 1.5;
      }
      .playhead {
        stroke: var(--g-text);
        stroke-width: 1.5;
      }
      /* The nines scale: a solid length is what the model gives; the soft length beyond it is the paper's promise. */
      .bar {
        fill: var(--g-viz-current);
      }
      /* What the paper promised: outlined in the current tone (its edge carries it, 3:1), the fill only a tint. */
      .bar.paper {
        fill: color-mix(in srgb, var(--g-viz-current) 22%, var(--g-viz-stage));
        stroke: var(--g-viz-current);
        stroke-width: 1;
      }
      .key-paper {
        fill: var(--g-viz-current);
        fill-opacity: 0.22;
        stroke: var(--g-viz-current);
        stroke-width: 1;
      }
      .key-solid {
        fill: var(--g-viz-current);
      }
      .goal-line {
        stroke: var(--g-muted);
        stroke-width: 1.5;
      }
      .goal-line.met {
        stroke: var(--g-viz-final);
      }
      .ghost-caret {
        fill: none;
        stroke: var(--g-text);
        stroke-width: 1.25;
        stroke-linejoin: round;
      }
      .n-ring {
        fill: var(--g-viz-stage);
        stroke: var(--g-stroke);
        stroke-width: 1.25;
      }
      .inuse {
        fill: var(--g-viz-current);
      }
      .tick-shared {
        fill: var(--g-text);
        fill-opacity: 0.62;
      }
      .split-shared {
        fill: var(--g-viz-critical);
      }
      .split-failover {
        fill: var(--g-viz-critical);
      }
      .split-chance {
        fill: var(--g-text);
      }
      .split-track {
        stroke: var(--g-line-strong);
      }
      .inset-down {
        fill: var(--g-text);
        fill-opacity: 0.62;
      }
      .inset-up {
        stroke: var(--g-viz-current);
        stroke-width: 2;
      }
      .inset-frame {
        fill: none;
        stroke: var(--g-line-strong);
      }
      .bar.optional {
        fill: var(--g-viz-discarded-ink);
        fill-opacity: 0.45;
      }
      .bar.request {
        fill: var(--g-text);
        fill-opacity: 0.82;
      }
      .bar-hidden {
        fill: none;
        stroke: var(--g-stroke);
        stroke-dasharray: 4 3;
      }
      .notch {
        fill: var(--g-viz-stage);
      }
      .capline {
        stroke: var(--g-viz-critical);
        stroke-width: 1.5;
      }
      .capend {
        fill: var(--g-viz-critical);
      }
      .ghost-tick {
        fill: var(--g-viz-stage);
        stroke: var(--g-stroke);
        stroke-width: 1.25;
      }
      .key-copy {
        fill: var(--g-text);
        fill-opacity: 0.62;
      }
      .key-fail {
        fill: var(--g-viz-critical);
      }
      .ok-ink {
        fill: var(--g-viz-final-ink);
      }
      /* Steppers and toggles (kit: g-stepper, the house toggle). */
      .steppers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 8px;
      }
      .stepper {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        align-items: center;
        border: 1px solid var(--g-line-strong);
        border-radius: var(--g-radius-sm);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
      }
      .stepper button {
        width: 44px;
        height: 44px;
        border: 0;
        background: none;
        color: var(--g-text);
        font: 500 1.125rem/1 var(--g-font);
        cursor: pointer;
      }
      .stepper button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .stepper output {
        display: grid;
        justify-items: center;
        line-height: 1.15;
        font: 600 var(--g-text-body) var(--g-font-mono);
      }
      .stepper output small {
        font: 500 var(--g-text-label) var(--g-font);
        color: var(--g-muted);
      }
      fieldset:disabled .stepper {
        opacity: 0.55;
      }
      .toggles3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
      }
      .toggles3 .segment span {
        flex-direction: column;
        gap: 0;
        min-height: 48px;
        font-size: var(--g-text-body-s);
        font-weight: 600;
      }

      /* A checked toggle keeps its weight and size: only its colours change, and a check glyph takes its reserved corner. */
      .toggles3 .segment span {

      /* The phone's readout of the request, inside the controls, so a press and its result share a screen. */
      .readout {

      /* The experiment dock and cards (experiment-dock.component.ts, widget-check.component.ts). */
      .dock {

    </style>
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">System design · Reliability</p>
      <h1>Try it</h1>
      <section class="panel widget" id="widget"></section>
    </main>
    <script src="model.js"></script>
    <script>
      'use strict';
      const M = window.ReliabilityModel;
      const params = new URLSearchParams(location.search);
      document.documentElement.classList.toggle('dark', params.get('theme') === 'dark');

      // ---------- Text measurement, with the fonts the app ships (no tabular digits: stage text is measured as drawn).
      // The label role is set in capitals, but a unit after a number keeps its case ("1 h", "5 min").
      const ROLE = {
        label: { css: '600 11px "Inter Variable"', size: 11, track: 0.12, upper: true },
        cap: { css: '500 13px "Inter Variable"', size: 13 },
        capB: { css: '600 13px "Inter Variable"', size: 13 },
        small: { css: '500 11px "Inter Variable"', size: 11 },
        smallB: { css: '700 11px "Inter Variable"', size: 11 },
        mono: { css: '600 11px "JetBrains Mono Variable"', size: 11 },
        nameS: { css: '600 13px "JetBrains Mono Variable"', size: 13 },
        head: { css: '600 17px "JetBrains Mono Variable"', size: 17 },
        look: { css: '600 11px "Inter Variable"', size: 11 },
      };
      const UNIT_AFTER_NUMBER = /(?<=\d )(min|h|s|d)\b/;
      const upperKeepUnits = (t) => t.toUpperCase().replace(/(?<=\d )(MIN|H|S|D)\b/g, (u) => u.toLowerCase());
      const ctx = document.createElement('canvas').getContext('2d');
      const widthCache = new Map();
      function tw(text, role) {
        const key = role + '|' + text;
        if (widthCache.has(key)) return widthCache.get(key);
        const f = ROLE[role];
        ctx.font = f.css;
        const s = f.upper ? upperKeepUnits(text) : text;
        const w = Math.ceil(ctx.measureText(s).width + (f.track ? f.track * f.size * s.length : 0)) + 1;
        widthCache.set(key, w);
        return w;
      }
      const partsWidth = (parts) => parts.reduce((s, [t, role, , dx = 0]) => s + tw(t, role) + dx, 0);
      /** Wraps at spaces, but never parts a number from its unit or "×" from its factor (g-code-text's rule). */
      const GLUE = /(\d[\d.,]*%?) (h|min|s|d|×|times|copies|copy|nines|weeks|outages|failovers)\b/g;
      /** A copy's name ("DB 2") and a week's number ("Week 44") stay whole too. */
      const NAMED = /\b(LB|App|DB|Recs|Week|week) (\d+)/g;
      function wrap(text, role, width) {
        const words = text
          .replace(GLUE, '$1\u0001$2')
          .replace(/(\d) × (\d)/g, '$1\u0001×\u0001$2')
          .replace(/ × (\d)/g, '\u0001×\u0001$1')
          .replace(NAMED, '$1\u0001$2')
          .split(' ');
        const lines = [];
        let line = '';
        for (const w of words) {
          const next = line ? line + ' ' + w : w;
          if (tw(next, role) <= width || !line) line = next;
          else {
            lines.push(line);
            line = w;
          }
        }
        if (line) lines.push(line);
        return lines.map((l) => l.replace(/\u0001/g, ' '));
      }
      const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const labelInner = (t) =>
        esc(t)
          .split(UNIT_AFTER_NUMBER)
          .map((p, i) => (i % 2 ? `<tspan class="t-unit">${p}</tspan>` : p))
          .join('');
      /** HTML text: a number stays with its unit on one line (the app's g-code-text). */
      const codeText = (t) =>
        esc(t)
          .replace(/(\d[\d.,]*) × (\d[\d.,]*) (h|min|s)\b/g, '<span class="nowrap">$1 × $2 $3</span>')
          .replace(/([a-z]+) × (\d[\d.,]*) (h|min|s)\b/g, '<span class="nowrap">$1 × $2 $3</span>')
          .replace(GLUE, '<span class="nowrap">$1 $2</span>')
          .replace(NAMED, '<span class="nowrap">$1 $2</span>');
      const fd = M.formatDown;
      const fa = M.formatAvail;
      const r1 = (v) => Math.round(v * 10) / 10;
      const plural = (n, one, many) => (n === 1 ? one : many);
      const pick = (forms, fits) => forms.find(fits) ?? forms[forms.length - 1];
      const listOf = (items) => (items.length <= 1 ? items.join('') : `${items.slice(0, -1).join(', ')} and ${items[items.length - 1]}`);
      const timesWord = (n) => (n === 1 ? 'once' : n === 2 ? 'twice' : `${n} times`);
      const cap1 = (t) => t.charAt(0).toUpperCase() + t.slice(1);

      // ---------- The drawing: SVG parts in layers, and the boxes placement checks against.
      class Draw {
        constructor(W) {
          this.W = W;
          this.layers = { back: [], grid: [], links: [], marks: [], dots: [], text: [], top: [] };
          this.texts = [];
          this.marks = [];
          this.links = [];
          this.hits = [];
          this.regions = {};
          this.missing = [];
          this.meta = {};
        }
        add(layer, s) {
          this.layers[layer].push(s);
        }
        textBox(x, y, w, role, anchor = 'start') {
          const fs = ROLE[role].size;
          const x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
          return { x0, x1: x0 + w, y0: y - 0.74 * fs, y1: y + 0.22 * fs };
        }
        text(x, y, parts, o = {}) {
          if (typeof parts === 'string') parts = [[parts, o.role ?? 'small', o.cls ?? '']];
          const anchor = o.anchor ?? 'start';
          const w = partsWidth(parts);
          const role = parts.reduce((a, p) => (ROLE[p[1]].size > ROLE[a].size ? p[1] : a), parts[0][1]);
          const box = this.textBox(x, y, w, role, anchor);
          box.owner = o.owner ?? '';
          box.s = parts.map((p) => p[0]).join('');
          this.texts.push(box);
          const spans = parts.map(([t, r, cls = '', dx = 0]) => `<tspan class="t-${r} ${cls}"${dx ? ` dx="${dx}"` : ''}>${r === 'label' ? labelInner(t) : esc(t)}</tspan>`).join('');
          const attrs = `x="${r1(x)}" y="${r1(y)}" text-anchor="${anchor}"${o.owner ? ` data-owner="${o.owner}"` : ''}${o.ground ? ' data-ground="1"' : ''}${o.id ? ` data-id="${o.id}"` : ''}${o.data ?? ''}`;
          this.add(o.layer ?? 'text', `<text class="${o.textCls ?? ''}" ${attrs}>${spans}</text>`);
          return box;
        }
        mark(box, owner = '') {
          this.marks.push({ ...box, owner });
        }
        link(points, owner = '') {
          this.links.push({ points, owner });
        }
        hit(kind, x, y, w, h, extra = {}) {
          this.hits.push({ kind, x, y, w, h, ...extra });
        }
        region(id, box) {
          (this.regions[id] ??= []).push(box);
        }
        free(box, ignoreOwner = '', margin = 2) {
          const b = { x0: box.x0 - margin, x1: box.x1 + margin, y0: box.y0 - margin, y1: box.y1 + margin };
          const hit = (o) => !(o.x1 <= b.x0 || o.x0 >= b.x1 || o.y1 <= b.y0 || o.y0 >= b.y1);
          const mine = (o) => ignoreOwner && o.owner && o.owner.split(' ').some((t) => ignoreOwner.split(' ').includes(t));
          if (this.texts.some((t) => hit(t) && !mine(t))) return false;
          if (this.marks.some((m) => hit(m) && !mine(m))) return false;
          if (this.hits.some((h) => hit({ x0: h.x, x1: h.x + h.w, y0: h.y, y1: h.y + h.h }))) return false;
          for (const l of this.links) {
            if (mine(l)) continue;
            if (l.points.some(([x, y]) => x > b.x0 && x < b.x1 && y > b.y0 && y < b.y1)) return false;
          }
          return b.x0 >= 2 && b.x1 <= this.W - 2;
        }
        /** Puts a text at the first candidate where it covers nothing; records it as missing when none is free. */
        place(cands, parts, o = {}) {
          for (const [x, y, anchor = 'start'] of cands) {
            const w = partsWidth(parts);
            const role = parts.reduce((a, p) => (ROLE[p[1]].size > ROLE[a].size ? p[1] : a), parts[0][1]);
            const box = this.textBox(x, y, w, role, anchor);
            if (box.y0 < (o.minY ?? 0) || box.y1 > (o.maxY ?? Infinity) || box.x0 < (o.minX ?? 2) || box.x1 > (o.maxX ?? this.W - 2)) continue;
            if (!this.free(box, o.ignore ?? '', o.margin ?? 2)) continue;
            return this.text(x, y, parts, { ...o, anchor });
          }
          if (!o.optional) this.missing.push(parts.map((p) => p[0]).join(''));
          return null;
        }
        line(x1, y1, x2, y2, cls, o = {}) {
          this.add(o.layer ?? 'links', `<line class="${cls}" x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}"${o.owner ? ` data-owner="${o.owner}"` : ''}${o.data ?? ''}/>`);
          if (o.solid !== false) this.link(sampleLine(x1, y1, x2, y2), o.owner ?? cls);
        }
        para(x, y, lines, role, lh, o = {}) {
          lines.forEach((l, i) => this.text(x, y + i * lh, [[l, role, o.cls ?? '']], { ...o, id: o.id && i === 0 ? o.id : undefined }));
        }
        svg(H, label) {
          const L = this.layers;
          return `<svg class="draw" width="${this.W}" height="${H}" viewBox="0 0 ${this.W} ${H}" role="img" aria-label="${esc(label)}">
<defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="hatch-fill"/><line class="hatch-line" x1="0" y1="0" x2="0" y2="6"/></pattern>
</defs>
<g>${L.back.join('')}</g><g>${L.grid.join('')}</g><g>${L.links.join('')}</g><g>${L.marks.join('')}</g><g>${L.dots.join('')}</g><g>${L.text.join('')}</g><g>${L.top.join('')}</g></svg>`;
        }
      }
      const sampleLine = (x1, y1, x2, y2, step = 3) => {
        const n = Math.max(2, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / step));
        return Array.from({ length: n + 1 }, (_, i) => [x1 + ((x2 - x1) * i) / n, y1 + ((y2 - y1) * i) / n]);
      };
      function xGlyph(D, cx, cy, owner, s = 4, ground = '') {
        D.add('dots', `<circle class="xground ${ground}" cx="${r1(cx)}" cy="${r1(cy)}" r="${s + 2.5}"/><path class="xmark" data-owner="${owner}" d="M${r1(cx - s)} ${r1(cy - s)}l${2 * s} ${2 * s}M${r1(cx + s)} ${r1(cy - s)}l${-2 * s} ${2 * s}"/>`);
        D.mark({ x0: cx - s - 2, x1: cx + s + 2, y0: cy - s - 2, y1: cy + s + 2 }, owner);
      }

      // ---------- What an open question hides, on every surface: one map (prevention 1). Each region is named in the
      // question's own `hide` list. `sample` hides the simulated year while the question asks (ticks, the request's row,
      // the band's moment, the year's sentence); `request` hides the model's numbers for the request while it asks and
      // plays (the headline, the request's bar, the weakest-link marks and the facts); `weakest` hides, while it asks and
      // plays, which part caps the chain (the cap line, its ends and words, the weakest parts' marked values and the
      // weakest-link sentence), for the question whose answer is that principle; `after` hides, during the answer's play,
      // what the model says at the act's new setting: all of `request`, and the bar and value of every part the act
      // changed. No ghost of an earlier setting shows while a question asks or plays, Describe waits, and Play and the
      // controls are disabled.
      function hiding(view) {
        const h = new Set(view.hide ?? []);
        const asking = view.phase === 'asking';
        const playing = view.phase === 'playing';
        const active = asking || playing;
        const after = h.has('after') && playing;
        return {
          sample: h.has('sample') && asking,
          weakest: (h.has('weakest') && active) || (h.has('request') && active) || after,
          request: (h.has('request') && active) || after,
          // The facts' second line (the paper rule, or what a set of copies is down from) is the principle every
          // question is built on: it waits while any question asks or plays, and its lines stay reserved.
          rule: active && view.leak !== 'rule',
          parts: after ? new Set(view.changed ?? []) : new Set(),
          ghost: active,
          waits: active,
          active,
        };
      }

      // ---------- Words. Every sentence is computed for its setting.
      const partById = (id) => M.PARTS.find((p) => p.id === id);
      const copyName = (id, i) => `${partById(id).short} ${i + 1}`;
      const SINGLE = { lb: 'The load balancer', app: 'The app server', db: 'The database', recs: 'The recommendations service' };
      const MANY = Object.fromEntries(M.PARTS.map((p) => [p.id, p.many]));
      const STAY = { lb: 'the load balancers stay up', app: 'the app servers stay up', db: 'the databases stay up', recs: 'recommendations stay up' };
      const countWord = (n) => (n === 2 ? 'both' : `all ${n}`);
      /** The band's moment in words. An absorbed outage claims only what is true of its part; with independent copies it
       * says why the strip under a set of copies stays empty (the other copy is itself down 0.1% of the time). */
      function captionOf(mo, n, s = {}) {
        const wk = `Week ${mo.week + 1}`;
        if (mo.kind === 'outage') return `${wk}: ${SINGLE[mo.part].toLowerCase()} is down for 1 h and has no other copy, so the request fails.`;
        if (mo.kind === 'shared') return `${wk}: a shared failure takes ${countWord(n)} ${MANY[mo.part]} down at once for 1 h, so the request fails.`;
        if (mo.kind === 'failover') return `${wk}: ${copyName(mo.part, 0)} dies. For 5 min requests still go to it and fail, then ${copyName(mo.part, 1)} carries them.`;

        }
        D.mark({ x0: endX - 9, x1: endX + 9, y0: ay - 9, y1: ay + 9 }, 'outcome');
        D.meta.outcomeX0 = endX - 8;
        // The bypass lane is always named: "optional", or "opt." where the word does not fit.
        const opt = m.parts.find((p) => p.optional);
        if (opt) {
          const i = m.parts.indexOf(opt);
          const cxm = colX(i) + cw / 2;
          const word = pick(['optional', 'opt.'], (t) => tw(t, 'small') <= cw - 4);
          D.text(cxm, laneY + 4, [[word, 'small']], { anchor: 'middle', owner: 'wire bypass', ground: true, id: 'lane-word' });
        }
        y = stackTop + stackH + 10;
        const capText = hid.sample ? CAPTION_HIDDEN : moment ? captionOf(moment, momentCopies(m, moment), s) : captionSweep(upTo);
        D.para(P, y + 12, wrap(capText, 'cap', W - 2 * P), 'cap', 18, { owner: 'caption', id: 'caption', cls: 'ink' });
        D.meta.caption = capText;
        y += R.caption * 18 + 4;
        D.region('chain', { x: P - 6, y: chainTop - 2, w: W - 2 * P + 12, h: y - chainTop });

        // ---- The year: its label and key, a row per copy, a strip per part, the request's row as their union.
        y += 10;
        const tlTop = y;
        const gut = wide ? 62 : 46;
        const tx0 = P + gut;
        const tx1 = W - P - 3;
        const ppw = (tx1 - tx0) / M.WEEKS;
        const wkX = (w) => tx0 + (w + 0.5) * ppw;
        const tlForms = ['One simulated year · a tick marks an outage, not its length', 'One simulated year · ticks are not to scale'];
        const tlLabel = tlForms.find((t) => tw(t, 'label') <= W - 2 * P - 8);
        if (tlLabel) D.text(P, y + 11, [[tlLabel, 'label']], { owner: 'tl-label' });
        else {
          D.text(P, y + 11, [['A simulated year', 'label']], { owner: 'tl-label' });
          D.text(W - P - 4, y + 11, [['ticks not to scale', 'small']], { anchor: 'end', owner: 'tl-label' });
        }
        y += 18;
        // The key, directly under the year's label, beside the marks it explains.
        const fullKey = keyRows(keyEntries(wide, true), P + 2, W - P, wide ? 16 : 12);
        const rows = keyRows(keyEntries(wide, !!s.shared), P + 2, W - P, wide ? 16 : 12);
        rows.forEach((row, r) => {
          const ky = y + 12 + r * 17;
          for (const [cls, words, kx] of row) {
            if (cls === 'shared') {
              D.add('marks', `<rect class="key-copy" x="${kx}" y="${ky - 10}" width="3" height="8" rx="0.5"/><rect class="key-fail" x="${kx}" y="${ky - 1}" width="3" height="3" rx="0.5"/>`);
            } else {
              const short = cls === 'short';
              D.add('marks', `<rect class="${cls === 'copy' ? 'key-copy' : 'key-fail'}" x="${kx}" y="${ky - (short ? 5 : 10)}" width="3" height="${short ? 6 : 11}" rx="0.5"/>`);
            }
            D.mark({ x0: kx, x1: kx + 3, y0: ky - 10, y1: ky + 2 }, 'key');
            D.text(kx + 9, ky, [[words, 'small']], { owner: 'key', data: ` data-key="${cls}"` });
          }
        });
        y += fullKey.length * 17 + 10;
        const tickW = Math.max(1.5, Math.min(3, ppw * 0.42));
        const areaH = 24;
        const stripH = 8;
        const groupH = areaH + 2 + stripH + 9;
        const shown = (week) => !hid.sample && week + 0.5 <= upTo + 1e-9;
        const rowsTop = y;
        const requestTicks = [];
        const reqY = rowsTop + 4 * groupH;
        const reqH = 18;
        m.parts.forEach((p, i) => {
          const sp = smp.parts[i];
          const gy = y;
          D.text(P, gy + areaH / 2 + 4, [[p.short, 'nameS', p.optional ? 'muted' : '']], { owner: `gut-${p.id}` });
          const rh = areaH / p.copies;
          const sy = gy + areaH + 2;
          if (!hid.sample) {
            const sharedWeeks = p.copies > 1 && s.shared ? sp.rows[0].filter((t) => t.shared && shown(t.week)).map((t) => t.week) : [];
            for (let k = 0; k < p.copies; k++) {
              const ry = gy + k * rh;
              D.line(tx0, ry + rh, tx1, ry + rh, 'row-track', { layer: 'grid', owner: 'grid', solid: false });
              const weeks = sp.rows[k].filter((t) => shown(t.week) && !(t.shared && sharedWeeks.includes(t.week))).map((t) => t.week);
              if (weeks.length) {
                const d = weeks.map((w) => `M${r1(wkX(w) - tickW / 2)} ${r1(ry + 1.5)}h${r1(tickW)}v${r1(rh - 2.5)}h${-r1(tickW)}z`).join('');
                D.add('marks', `<path class="tick-copy" data-row="${p.id}-${k}" data-weeks="${weeks.join(',')}" d="${d}"/>`);
              }
              if (wide && p.copies === 2) D.text(tx0 - 8, ry + rh / 2 + 4, [[String(k + 1), 'small']], { anchor: 'end', owner: `gut-${p.id}` });
            }
            // A shared outage is one joined mark through every copy's row and down to the strip: one cause.
            if (sharedWeeks.length) {
              const d = sharedWeeks.map((w) => `M${r1(wkX(w) - tickW / 2)} ${r1(gy + 1.5)}h${r1(tickW)}v${r1(sy - gy - 1.5)}h${-r1(tickW)}z`).join('');
              D.add('marks', `<path class="tick-shared" data-shared="${p.id}" data-weeks="${sharedWeeks.join(',')}" d="${d}"/>`);
            }
            // The copy in use: requests go to the first copy while it is up.
            if (p.copies > 1) D.add('marks', `<rect class="inuse" data-inuse="${p.id}" x="${r1(tx0 - 4)}" y="${r1(gy + 1.5)}" width="2" height="${r1(rh - 2.5)}"/>`);
            D.add('back', `<rect class="strip-band" x="${tx0}" y="${sy}" width="${r1(tx1 - tx0)}" height="${stripH}"/>`);
            if (wide) D.text(P, sy + stripH / 2 + 4, [['part', 'small']], { owner: `gut-${p.id}` });
            const ev = sp.events.filter((e) => shown(e.week));
            if (ev.length) {
              const d = ev
                .map((e) => {
                  const h = e.kind === 'failover' ? stripH / 2 : stripH;
                  return `M${r1(wkX(e.week) - tickW / 2)} ${r1(sy + stripH - h)}h${r1(tickW)}v${r1(h)}h${-r1(tickW)}z`;
                })
                .join('');
              D.add('marks', `<path class="${p.optional ? 'tick-bypassed' : 'tick-fail'}" data-strip="${p.id}" data-weeks="${ev.map((e) => e.week).join(',')}" d="${d}"/>`);
            }
            if (!p.optional) for (const e of ev) requestTicks.push(e);
          }
          y += groupH;
        });
        D.text(P, reqY + reqH / 2 + 4, [[pick(['Request', 'Req.'], (t) => tw(t, 'smallB') <= gut - 4), 'smallB']], { owner: 'gut-request' });
        if (hid.sample) {
          // One dashed box over every row: the whole year is hidden, not empty.
          D.add('marks', `<rect class="req-hidden" data-year-hidden="1" x="${tx0 + 0.5}" y="${r1(rowsTop + 0.5)}" width="${r1(tx1 - tx0 - 1)}" height="${r1(reqY + reqH - rowsTop - 1)}" rx="4"/>`);
          D.text((tx0 + tx1) / 2, (rowsTop + reqY + reqH) / 2 + 4, [[pick(['The year plays after your answer', 'plays after your answer'], (t) => tw(t, 'small') <= tx1 - tx0 - 16), 'small']], { anchor: 'middle', owner: 'req-hidden' });
        } else {
          D.add('back', `<rect class="req-band" x="${tx0}" y="${reqY}" width="${r1(tx1 - tx0)}" height="${reqH}"/>`);
          if (requestTicks.length) {
            requestTicks.sort((a, b) => a.week - b.week);
            const d = requestTicks
              .map((e) => {
                const h = e.kind === 'failover' ? 8 : reqH - 2;
                return `M${r1(wkX(e.week) - tickW / 2)} ${r1(reqY + reqH - 1 - h)}h${r1(tickW)}v${r1(h)}h${-r1(tickW)}z`;
              })
              .join('');
            D.add('marks', `<path class="tick-fail" data-request="1" data-weeks="${requestTicks.map((e) => e.week).join(',')}" data-kinds="${requestTicks.map((e) => e.kind[0]).join('')}" d="${d}"/>`);
          }
        }
        y = reqY + reqH;
        D.line(tx0, y, tx1, y, 'axis', { layer: 'grid', owner: 'grid', solid: false });
        // The moment: at rest a line through the rows and a ring; during a hold the playhead is the line and the ring
        // stands round the held tick the same way.
        if (moment) {
          const mx = wkX(moment.week);
          if (!playing) {
            D.line(mx, rowsTop - 3, mx, y + 3, 'moment', { layer: 'grid', owner: 'grid', solid: false });
            D.add('top', `<path class="moment-head" d="M${r1(mx - 4)} ${r1(rowsTop - 8)}h8l-4 6z"/>`);
          }
          const pi = m.parts.findIndex((p) => p.id === moment.part);
          const gy = rowsTop + pi * groupH;
          let ry0;
          let ry1;
          if (moment.fails) {
            ry0 = reqY + (moment.kind === 'failover' ? reqH - 9 : 1) - 3;
            ry1 = reqY + reqH + 2;
          } else if (moment.kind === 'bypassed') {
            ry0 = gy + areaH + 2 - 3;
            ry1 = gy + areaH + 2 + stripH + 3;
          } else {
            const rh = areaH / m.parts[pi].copies;
            ry0 = gy + moment.copy * rh + 1.5 - 3;
            ry1 = gy + (moment.copy + 1) * rh - 1 + 3;
          }
          D.add('top', `<rect class="ring" data-ring="${moment.kind}" data-week="${moment.week}" x="${r1(mx - tickW / 2 - 3)}" y="${r1(ry0)}" width="${r1(tickW + 6)}" height="${r1(ry1 - ry0)}" rx="3"/>`);
        }
        if (playing) {
          // The playhead stands clear of a held column's marks: at least half a tick and 2.5 px past its centre.
          let hx = tx0 + (upTo / M.WEEKS) * (tx1 - tx0);
          for (const h of plan.holds) if (h.week + 1 <= upTo + 1e-9) hx = Math.max(hx, wkX(h.week) + tickW / 2 + 2.5);
          D.line(hx, rowsTop - 3, hx, y + 3, 'playhead', { layer: 'top', owner: 'grid', solid: false, data: ' data-playhead="1"' });
          D.meta.playheadX = hx;
          if (held) D.meta.heldX = wkX(held.week);
          D.meta.tickW = tickW;
        }
        const weekTicks = [0, 13, 26, 39, 52];
        weekTicks.forEach((w, i) => {
          const x = tx0 + (w / M.WEEKS) * (tx1 - tx0);
          D.line(x, y, x, y + 4, 'axis', { layer: 'grid', owner: 'grid', solid: false });
          const last = i === weekTicks.length - 1;
          const t = last ? pick(['52 weeks', '52 wk'], (v) => tw(v, 'small') <= (13 / M.WEEKS) * (tx1 - tx0) - tw('39', 'small') / 2 - 6) : String(w);
          D.text(last ? tx1 + 3 : x, y + 16, [[t, 'small']], { anchor: last ? 'end' : i === 0 ? 'start' : 'middle', owner: 'weeks', data: ' data-xtick="weeks"', ground: true });
        });
        y += 22;
        // The year's own sentence: during an answer's play only where to look (its count is close to the answer).
        const yearText = hid.sample ? '' : hid.request ? view.exp?.watch ?? WATCHES[0] : yearSentence(smp.fails.filter((e) => shown(e.week)), playing);
        if (yearText) D.para(P, y + 12, wrap(yearText, 'cap', W - 2 * P), 'cap', 18, { owner: 'year', id: 'year' });
        D.meta.year = yearText;
        y += R.year * 18 + 4;
        // "That hour": an absorbed outage zoomed in, at the year's foot, once no question waits on it.
        const insetTop = y;
        if (moment && moment.kind === 'absorbed' && !s.shared && !hid.active) {
          const n = momentCopies(m, moment);
          const wx0 = P + (wide ? 46 : 44);
          const wx1 = wx0 + (wide ? 64 : 40);
          const order = [moment.copy, ...Array.from({ length: n }, (_, k) => k).filter((k) => k !== moment.copy)];
          D.add('back', `<rect class="inset-frame" x="${r1(wx0 - 0.5)}" y="${r1(y + 1.5)}" width="${r1(wx1 - wx0 + 1)}" height="${n * 12 - 3}" rx="2"/>`);
          order.forEach((k, j) => {
            const ry = y + 3 + j * 12;
            D.text(P, ry + 7, [[copyName(moment.part, k), 'mono', j ? '' : 'muted']], { owner: 'inset' });
            if (j === 0) D.add('marks', `<rect class="inset-down" data-inset="down" x="${r1(wx0 + 1)}" y="${r1(ry)}" width="${r1(wx1 - wx0 - 2)}" height="6"/>`);
            else D.add('marks', `<line class="inset-up" data-inset="up" x1="${r1(wx0 + 1)}" y1="${r1(ry + 3)}" x2="${r1(wx1 - 1)}" y2="${r1(ry + 3)}"/>`);
          });
          D.mark({ x0: wx0 - 1, x1: wx1 + 1, y0: y, y1: y + n * 12 }, 'inset');
          const words = insetWords(moment, n);
          D.para(P + insetLeft(wide), y + 10, wrap(words, 'small', R.insetLabelW), 'small', 14, { owner: 'inset', id: 'inset' });
          D.meta.inset = words;
        }
        y = insetTop + R.inset;
        D.region('timeline', { x: P - 6, y: tlTop - 4, w: W - 2 * P + 12, h: y - tlTop + 2 });

        // ---- The rule between the year and the model.
        y += 8;
        D.line(0, y, W, y, 'rule', { layer: 'grid', owner: 'grid', solid: false });
        y += 8;

        // ---- The model: the headline, the nines scale, the facts.
        const modelTop = y;
        const mTitle = pick(['Availability, exact from the model', 'Availability, from the model'], (t) => tw(t, 'capB') <= W - 2 * P);
        D.text(P, y + 16, [[mTitle, 'capB']], { owner: 'm-title' });
        y += 26;
        const cols = [
          ['Available', hid.request ? '?' : fa(m.u)],
          ['Down a year', hid.request ? '?' : fd(m.downH)],
          ['Down in 30 days', hid.request ? '?' : fd(m.monthH)],
        ];
        if (wide) {
          const colW = (W - 2 * P) / 3;
          cols.forEach(([lab, val], i) => {
            const x = P + i * colW;
            D.text(x, y + 11, [[lab, 'label']], { owner: 'headline' });
            D.text(x, y + 33, [[val, 'head', hid.request ? 'muted' : '']], { owner: 'headline', id: `stat-${i}`, data: ' data-stat="1"' });
          });
          y += 46;
        } else {
          cols.forEach(([lab, val], i) => {
            D.text(P, y + 16 + i * 24, [[lab, 'label']], { owner: 'headline' });
            D.text(W - P, y + 17 + i * 24, [[val, 'head', hid.request ? 'muted' : '']], { anchor: 'end', owner: 'headline', id: `stat-${i}`, data: ' data-stat="1"' });
          });
          y += 3 * 24 + 6;
        }
        // The nines scale; its value column is headed "down a year", so longer bars and smaller values read as one.
        const rulerTop = y;
        const NMAX = 9.3;
        const valW = Math.max(...['92 min', '0.03 s', '20.6 h', 'optional'].map((t) => tw(t, 'smallB'))) + 8;
        const rx0 = P + gut;
        const rx1 = W - P - valW;
        const ppn = (rx1 - rx0) / NMAX;
        const xn = (n) => rx0 + Math.min(NMAX, n) * ppn;
        const head = pick(['down a year', 'a year'], (t) => tw(t, 'label') <= valW + (wide ? 48 : 16));
        const rLabel = pick(['The nines scale · each step right is 10× less downtime', 'Nines · each step is 10× less downtime', 'Nines · a step is 10× less'], (t) => tw(t, 'label') + tw(head, 'label') + 14 <= W - 2 * P);
        D.text(P, y + 11, [[rLabel, 'label']], { owner: 'r-label' });
        D.text(W - P, y + 11, [[head, 'label']], { anchor: 'end', owner: 'r-label', id: 'val-head' });
        y += 20;
        // On phones the paper's outline is named once, under the label: the bars have no room for "on paper" beside them.
        if (!wide) {
          const shows = m.parts.some((p) => !p.optional && !hid.parts.has(p.id) && p.paperNines - p.nines > 0.05);
          if (shows) {
            const ky = y + 8;
            D.add('marks', `<rect class="key-solid" x="${P}" y="${ky - 8}" width="12" height="8"/><rect class="key-paper" x="${P + 70}" y="${ky - 8}" width="12" height="8"/>`);
            D.mark({ x0: P, x1: P + 12, y0: ky - 8, y1: ky }, 'pkey');
            D.mark({ x0: P + 70, x1: P + 82, y0: ky - 8, y1: ky }, 'pkey');
            D.text(P + 17, ky, [['the model', 'small']], { owner: 'pkey' });
            D.text(P + 87, ky, [['on paper', 'small']], { owner: 'pkey', data: ' data-key="paper"' });
          }
          y += 16;
        }
        const topForms = (k) => (k <= 4 ? fa(10 ** -k) : `${k} nines`);
        const fitsAll = (ks, f, role) => ks.every((k, i) => i === 0 || xn(k) - xn(ks[i - 1]) >= (tw(f(k), role) + tw(f(ks[i - 1]), role)) / 2 + 7);
        const every = [1, 2, 3, 4, 5, 6, 7, 8, 9];
        const third = [3, 6, 9];
        const topKs = fitsAll(every, topForms, 'small') ? every : third;
        const topF = [topForms, (k) => (k === 3 ? '99.9%' : k === 9 ? '9 nines' : String(k)), (k) => (k === 9 ? '9 nines' : String(k))].find((f) => fitsAll(topKs, f, 'small'));
        for (const k of topKs) D.text(xn(k), y + 9, [[topF(k), 'small']], { anchor: 'middle', owner: 'r-top', data: ' data-xtick="top"', ground: true });
        y += 14;
        const rowH = 24;
        const barH = 12;
        const rowsY = y;
        for (const k of every) D.line(xn(k), rowsY - 2, xn(k), rowsY + 5 * rowH + 2, 'gridline', { layer: 'grid', owner: 'grid', solid: false });
        D.line(rx0, rowsY - 2, rx0, rowsY + 5 * rowH + 2, 'axis', { layer: 'grid', owner: 'grid', solid: false });
        const barRect = (cls, n0, n1, by, data = '') => {
          if (n1 - n0 <= 1e-9) return;
          D.add('marks', `<rect class="${cls}" x="${r1(xn(n0))}" y="${r1(by)}" width="${r1(Math.max(0.75, xn(n1) - xn(n0)))}" height="${barH}"${data}/>`);
        };
        // A hidden bar is a dashed box of the row's height, so its words sit 3 px or more inside the dashes.
        const hiddenBar = (id, ry) => D.add('marks', `<rect class="bar-hidden" data-bar-hidden="${id}" x="${r1(rx0 + 0.5)}" y="${r1(ry + 3)}" width="${r1(rx1 - rx0 - 1)}" height="${rowH - 6}" rx="3"/>`);
        const capP = m.parts.find((p) => p.id === m.capPart);
        m.parts.forEach((p, i) => {
          const ry = rowsY + i * rowH;
          const by = ry + (rowH - barH) / 2;
          D.text(P, ry + rowH / 2 + 4, [[p.short, 'nameS', p.optional ? 'muted' : '']], { owner: `rgut-${p.id}` });
          if (hid.parts.has(p.id)) {
            hiddenBar(p.id, ry);
            D.text(W - P, ry + rowH / 2 + 4, [['?', 'smallB', 'muted']], { anchor: 'end', owner: `val-${p.id}`, id: `val-${p.id}` });
            return;
          }
          const real = p.nines;
          const paper = p.paperNines;
          for (let c = 0; c < p.copies; c++) {
            const a = 3 * c;
            const b = 3 * (c + 1);
            if (p.optional) barRect('bar optional', a, b, by);
            else {
              barRect('bar', a, Math.min(b, real), by, ` data-bar="${p.id}"`);
              barRect('bar paper', Math.max(a, real), b, by, ` data-paper="${p.id}"`);
            }
            if (c > 0) {
              D.add('marks', `<rect class="notch" x="${r1(xn(a) - 0.75)}" y="${r1(by - 0.5)}" width="1.5" height="${barH + 1}"/>`);
              D.mark({ x0: xn(a) - 1.5, x1: xn(a) + 1.5, y0: by, y1: by + barH }, `notch-${p.id}`);
            }
          }
          D.mark({ x0: rx0, x1: xn(paper), y0: by, y1: by + barH }, `bar-${p.id}`);
          D.meta[`end-${p.id}`] = xn(real);
          const val = p.optional ? pick(['optional', 'opt.'], (t) => tw(t, 'small') <= valW - 2) : fd(p.downH);
          const weakest = !p.optional && m.weakest.includes(p.id) && !hid.weakest;
          D.text(W - P, ry + rowH / 2 + 4, [[val, p.optional ? 'small' : weakest ? 'smallB' : 'small', weakest ? 'bad' : p.optional ? '' : 'ink']], { anchor: 'end', owner: `val-${p.id}`, id: `val-${p.id}` });
          // What the paper promised: beside the outlined length, else inside it after the solid end (or after a notch),
          // else "paper" alone; on phones the key under the label names the outline either way.
          if (!p.optional && paper - real > 0.05) {
            const words = [`on paper ${fd(p.paperDownH)}`, `paper ${fd(p.paperDownH)}`];
            const ty = ry + rowH / 2 + 4;
            const o = { optional: true, owner: `paper-${p.id}`, id: `paper-${p.id}`, data: ` data-paper-label="${p.id}"` };
            let placed = null;
            for (const t of words) {
              placed ??= D.place([[xn(paper) + 5, ty]], [[t, 'small']], { ...o, maxX: rx1 - 2, ground: true });
              const starts = [real, ...[3, 6].filter((k) => k > real && k < paper)];
              for (const st of starts) placed ??= D.place([[xn(st) + 4, ty - 0.5]], [[t, 'small', 'ink']], { ...o, owner: `paper-${p.id} bar-${p.id}`, maxX: xn(paper) - 3, ignore: `bar-${p.id}`, textCls: 'on-chip', margin: 1, ground: true });
            }
          }
        });
        const qy = rowsY + 4 * rowH;
        const qby = qy + (rowH - barH) / 2;
        D.text(P, qy + rowH / 2 + 4, [[pick(['Request', 'Req.'], (t) => tw(t, 'smallB') <= gut - 4), 'smallB']], { owner: 'rgut-request' });
        if (hid.request) {
          hiddenBar('request', qy);
          D.text((rx0 + rx1) / 2, qy + rowH / 2 + 4, [['after your answer', 'small']], { anchor: 'middle', owner: 'bar-request', ground: true });
          D.text(W - P, qy + rowH / 2 + 4, [['?', 'smallB', 'muted']], { anchor: 'end', owner: 'val-request', id: 'val-request' });
        } else {
          barRect('bar request', 0, m.nines, qby, ' data-bar="request"');
          D.mark({ x0: rx0, x1: xn(m.nines), y0: qby, y1: qby + barH }, 'bar-request');
          const reqEnd = xn(m.nines);
          D.meta['end-request'] = reqEnd;

        if (need !== well.querySelectorAll('rect.tag').length) window.__collisions.push(`${well.querySelectorAll('rect.tag').length} tags for ${need} outlines`);
        // Describe's table fits its box, or scrolls inside it; the page never scrolls sideways.
        const box = document.querySelector('.table-box');
        if (box && box.scrollWidth > box.clientWidth + 1 && getComputedStyle(box).overflowX === 'visible') window.__collisions.push('Describe overflows its box');
        document.body.dataset.ready = '1';
      });
    </script>
  </body>
</html>
