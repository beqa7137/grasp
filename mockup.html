<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CDNs &amp; Edge widget mockup</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url(fonts/inter-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        src: url(fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 800;
        font-display: block;
      }
      /* The app's tokens (apps/app/src/_theme.scss, styles.scss): light is the base, dark overrides. */
      :root {
        color-scheme: light;
        --g-bg: #f4f5f9;
        --g-surface: #ffffff;
        --g-raised: #ffffff;
        --g-sunken: #eef0f5;
        --g-line: #dfe2ea;
        --g-line-strong: #c6cbd6;
        --g-stroke: #707889;
        --g-text: #161a23;
        --g-text-rgb: 22, 26, 35;
        --g-muted: #4a5263;
        --g-faint: #5c6477;
        --g-on-fill: #ffffff;
        --g-warn-ink: #6e4200;
        --g-danger-ink: #9d1630;
        --g-found-ink: #02583f;
        --g-accent: #5846dc;
        --g-accent-rgb: 88, 70, 220;
        --g-accent-soft: rgba(88, 70, 220, 0.14);
        --g-found: #036b4c;
        --g-danger: #c3203d;
        --g-warn: #945800;
        --g-success-ink: var(--g-found-ink);
        --g-success-line: var(--g-found);
        --g-success-soft: rgba(3, 107, 76, 0.12);
        --g-danger-soft: rgba(195, 32, 61, 0.12);
        --g-warn-soft: rgba(148, 88, 0, 0.12);
        --g-viz-stage: #f7f8fb;
        --g-viz-current: #0b74ad;
        --g-viz-current-soft: rgba(11, 116, 173, 0.16);
        --g-viz-considering: #c77700;
        --g-viz-considering-soft: rgba(199, 119, 0, 0.14);
        --g-viz-final: #12925f;
        --g-viz-final-soft: rgba(18, 146, 95, 0.14);
        --g-viz-final-ink: var(--g-found-ink);
        --g-viz-discarded-ink: #687082;
        --g-viz-critical: #d42a49;
        --g-viz-track: #d3d7e0;
        --g-shadow: 0 1px 2px rgba(var(--g-text-rgb), 0.06), 0 3px 10px rgba(var(--g-text-rgb), 0.07);
        --g-shadow-raised: 0 1px 2px rgba(var(--g-text-rgb), 0.08);
        --g-radius-xs: 6px;
        --g-radius-sm: 10px;
        --g-radius-md: 14px;
        --g-radius-pill: 999px;
        --g-text-title-m: 1.0625rem;
        --g-text-title-s: 0.9375rem;
        --g-text-body: 0.875rem;
        --g-text-body-s: 0.8125rem;
        --g-text-label: 0.6875rem;
        --g-font: 'Inter Variable', system-ui, sans-serif;
        --g-font-mono: 'JetBrains Mono Variable', ui-monospace, monospace;
        --g-focus-ring: 2px solid var(--g-accent);
      }
      :root.dark {
        color-scheme: dark;
        --g-bg: #0b0d12;
        --g-surface: #141824;
        --g-raised: #1c2130;
        --g-sunken: #0f121a;
        --g-line: #252a37;
        --g-line-strong: #343b4d;
        --g-stroke: #6b7387;
        --g-text: #e9ebf2;
        --g-text-rgb: 233, 235, 242;
        --g-muted: #8b93a8;
        --g-faint: #828a9e;
        --g-on-fill: #0b0d12;
        --g-warn-ink: #f3e6b3;
        --g-danger-ink: #ffb3bd;
        --g-found-ink: #3ddc97;
        --g-accent: #9d8cff;
        --g-accent-rgb: 157, 140, 255;
        --g-accent-soft: rgba(157, 140, 255, 0.14);
        --g-found: #3ddc97;
        --g-danger: #ff5d73;
        --g-warn: #ffb547;
        --g-success-soft: rgba(61, 220, 151, 0.12);
        --g-danger-soft: rgba(255, 93, 115, 0.12);
        --g-warn-soft: rgba(255, 181, 71, 0.12);
        --g-viz-stage: #0e1118;
        --g-viz-current: #1f9fd0;
        --g-viz-current-soft: rgba(31, 159, 208, 0.16);
        --g-viz-considering: #c08420;
        --g-viz-considering-soft: rgba(192, 132, 32, 0.18);
        --g-viz-final: #22ad74;
        --g-viz-final-soft: rgba(34, 173, 116, 0.18);
        --g-viz-final-ink: var(--g-found);
        --g-viz-discarded-ink: var(--g-muted);
        --g-viz-critical: #e5485f;
        --g-viz-track: #2a3040;
        --g-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        --g-shadow-raised: var(--g-shadow);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--g-bg);
        color: var(--g-text);
        font: 400 var(--g-text-body) / 1.5 var(--g-font);
        font-variant-ligatures: none;
        -webkit-font-smoothing: antialiased;
        overflow-wrap: break-word;
      }
      button {
        font-size: 0.8333rem;
      }
      .page {
        max-width: 1048px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      .eyebrow {
        margin: 0;
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
      }
      h1 {
        margin: 4px 0 14px;
        font: 600 1.25rem/1.3 var(--g-font);
      }
      .panel {
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background: var(--g-surface);
        box-shadow: var(--g-shadow);
        padding: 16px;
      }
      /* Narrow: one column, the controls as the stage's first rows, then the stage, the question, Describe, the cards. */
      .widget {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }
      .main,
      .experiments {
        display: contents;
      }
      .controls {
        order: 1;
      }
      .stage {
        order: 2;
        min-width: 0;
      }
      .dock {
        order: 3;
      }
      .describe {
        order: 4;
      }
      .heading,
      .cards {
        order: 5;
      }
      .controls {
        padding: 12px 12px 0;
        border: 1px solid var(--g-line);
        border-bottom: 0;
        border-radius: var(--g-radius-md) var(--g-radius-md) 0 0;
        background: var(--g-viz-stage);
        display: grid;
        gap: 10px;
        min-width: 0;
      }
      .stage {
        margin-top: -12px;
      }
      .stage .well {
        border-top: 0;
        border-radius: 0 0 var(--g-radius-md) var(--g-radius-md);
      }
      @media (min-width: 1000px) {
        .widget {
          grid-template-columns: minmax(0, 1fr) 340px;
          grid-template-rows: auto 1fr;
          align-items: start;
          column-gap: 20px;
        }
        .main {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: 12px;
          grid-column: 1;
          grid-row: 1 / span 2;
          min-width: 0;
        }
        .controls {
          grid-column: 2;
          grid-row: 1;
          padding: 0;
          border: 0;
          background: none;
        }
        .experiments {
          display: block;
          grid-column: 2;
          grid-row: 2;
          min-width: 0;
        }
        .stage {
          margin-top: 0;
        }
        .stage .well {
          border-top: 1px solid var(--g-line);
          border-radius: var(--g-radius-md);
        }
        .dock {
          margin-top: 12px;
        }
      }
      .well {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background-color: var(--g-viz-stage);
        background-image: radial-gradient(circle, rgba(var(--g-text-rgb), 0.09) 1px, transparent 1.5px);
        background-size: 24px 24px;
        background-position: 11px 11px;
      }
      /* Every fieldset.group carries the same zero padding; a control's own class only adds to it (the R41 padding bug). */
      fieldset.group {
        margin: 0;
        padding: 0;
        border: 0;
        min-width: 0;
      }
      .control-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
        padding: 0;
        margin-bottom: 4px;
      }
      .segments {
        display: flex;
        gap: 4px;
      }
      .segment {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
      }
      .segment input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .segment span {
        white-space: nowrap;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 6px;
        border-radius: var(--g-radius-sm);
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        font: 500 var(--g-text-body) / 1.15 var(--g-font);
        text-align: center;
      }
      .segment input:checked + span {
        background: var(--g-accent-soft);
        border-color: var(--g-accent);
        box-shadow: inset 0 0 0 1px var(--g-accent);
        font-weight: 600;
      }
      fieldset:disabled .segment span,
      .segment input:disabled + span {
        opacity: 0.55;
      }
      .control-label .why {
        font-weight: 500;
        letter-spacing: normal;
        text-transform: none;
      }
      .segment small {
        font: 500 var(--g-text-label) var(--g-font);
        color: var(--g-muted);
      }
      .toggles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .toggles .segment span {
        flex-direction: column;
        gap: 0;
        font-size: var(--g-text-body-s);
      }
      .notice {
        margin: 0;
        min-height: 2lh;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      /* Below wide the notice would sit over the stage and push it down as it speaks: read out only (_widget-controls.scss). */
      /* "1,000 GB" keeps one line in a 74 px segment at a 320 px phone. */
      @media (max-width: 359px) {
        .controls .segment span {
          padding-inline: 3px;
        }
      }
      @media (max-width: 999px) {
        .notice {
          position: absolute;
          width: 1px;
          height: 1px;
          min-height: 0;
          overflow: hidden;
          clip-path: inset(50%);
        }
        .controls {
          padding-bottom: 12px;
        }
      }
      .caption {
        margin: 0;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      .play {
        position: absolute;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        z-index: 2;
      }
      .play svg {
        display: block;
        width: 36px;
        height: 36px;
        margin: 4px;
      }
      .play circle {
        fill: var(--g-raised);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .play path {
        fill: var(--g-accent);
      }
      .play:disabled {
        cursor: default;
        opacity: 0.55;
      }
      .handle {
        position: absolute;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        cursor: ew-resize;
        z-index: 2;
      }
      .handle .knob {
        width: 14px;
        height: 26px;
        border-radius: var(--g-radius-pill);
        background: var(--g-raised);
        border: 2px solid var(--g-accent);
        box-shadow: var(--g-shadow-raised);
      }
      .handle[aria-disabled='true'] {
        cursor: default;
      }
      .handle[aria-disabled='true'] .knob {
        opacity: 0.55;
      }
      /* Drawing roles: text sits on a stage-coloured halo; small text is measured as drawn (no tabular digits). */
      svg.draw {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        overflow: visible;
      }
      svg.draw text {
        paint-order: stroke;
        stroke: var(--g-viz-stage);
        stroke-width: 3px;
        stroke-linejoin: round;
      }
      svg.draw text.on-box {
        stroke: var(--g-raised);
      }
      svg.draw text.on-chip {
        stroke: none;
      }
      .t-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: var(--g-muted);
      }
      .t-cap {
        font: 500 var(--g-text-body-s) var(--g-font);
        fill: var(--g-muted);
      }
      .t-capB {
        font: 600 var(--g-text-body-s) var(--g-font);
        fill: var(--g-text);
      }
      .t-small {
        font: 500 var(--g-text-label) var(--g-font);
        fill: var(--g-muted);
      }
      .t-smallB {
        font: 700 var(--g-text-label) var(--g-font);
        fill: var(--g-text);
      }
      .t-mono {
        font: 600 var(--g-text-label) var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-nameS {
        font: 600 13px var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-head {
        font: 600 var(--g-text-title-m) var(--g-font-mono);
        fill: var(--g-text);
      }
      .ink {
        fill: var(--g-text);
      }
      .muted {
        fill: var(--g-muted);
      }
      .bad {
        fill: var(--g-danger-ink);
      }
      .wait-ink {
        fill: var(--g-warn-ink);
      }
      .cur-ink {
        fill: var(--g-viz-current);
      }
      .crit-ink {
        fill: var(--g-viz-critical);
      }
      /* A focus outline is solid: dashed means only "hidden until you answer" (prevention 17). */
      .focus-outline {
        fill: none;
        stroke: var(--g-accent);
        stroke-width: 2;
      }
      .tag {
        fill: var(--g-viz-stage);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .t-look {
        font: 600 var(--g-text-label) var(--g-font);
        fill: var(--g-accent);
      }
      /* The experiment dock and cards (experiment-dock.component.ts, widget-check.component.ts). */
      .dock {
        padding: 12px 16px;
        border-radius: var(--g-radius-md);
        border: 1px solid var(--g-line);
        border-left: 3px solid var(--g-accent);
        background: var(--g-surface);
      }
      .dock:empty {
        display: none;
      }
      .legend {
        margin: 0 0 4px;
        font-weight: 600;
        line-height: 1.45;
      }
      .options {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .g-choice {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        color: var(--g-text);
        font: 500 0.90625rem/1.45 var(--g-font);
        text-align: left;
      }
      button.g-choice {
        box-shadow: var(--g-shadow-raised);
        cursor: pointer;
      }
      .g-choice.right {
        border-color: var(--g-success-line);
        background: var(--g-success-soft);
      }
      .g-choice.wrong {
        border-color: var(--g-danger);
        background: var(--g-danger-soft);
      }
      .mark {
        flex: none;
        width: 20px;
        height: 20px;
      }
      .held {
        margin: 10px 0 0;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      .reveal {
        margin: 10px 0 0;
        line-height: 1.55;
        font-size: 0.90625rem;
      }
      .status-line {
        margin: 8px 0 4px;
        font: 600 var(--g-text-body) var(--g-font);
        color: var(--g-muted);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .status-line.met {
        color: var(--g-success-ink);
      }
      .status {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 4px;
        font: 600 var(--g-text-body-s) var(--g-font);
        font-variant-numeric: tabular-nums;
        color: var(--g-muted);
      }
      .status li {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .status li.met {
        color: var(--g-success-ink);
      }
      .status .state {
        flex: none;
        width: 16px;
      }
      .heading {
        display: flex;
        align-items: center;
        gap: 8px;
        font: 600 var(--g-text-title-s) var(--g-font);
        margin: 20px 0 8px;
      }
      .heading svg {
        color: var(--g-accent);
      }
      .cards {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 8px;
      }
      .card-btn {
        width: 100%;
        min-height: 48px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border: 1px solid var(--g-line-strong);
        border-radius: var(--g-radius-sm);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        font: 500 var(--g-text-body) var(--g-font);
        text-align: left;
      }
      .card-btn[aria-current] {
        border-color: var(--g-accent);
        box-shadow: inset 0 0 0 1px var(--g-accent);
        background: var(--g-accent-soft);
      }
      .card-btn .num {
        flex: none;
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: var(--g-radius-pill);
        background: var(--g-sunken);
        font: 600 var(--g-text-body-s) var(--g-font-mono);
        color: var(--g-muted);
      }
      /* Describe: a minmax(0, 1fr) grid, its table scrolling inside its own box; compact on narrow stages. */
      .describe {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
        justify-items: start;
      }
      .describe .muted-note {
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
        margin: 0;
      }
      .describe p.summary {
        margin: 0;
        font-size: var(--g-text-body-s);
      }
      .g-btn {
        appearance: none;
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        border-radius: var(--g-radius-sm);
        padding: 9px 14px;
        min-height: 44px;
        font: 500 var(--g-text-body) / 1 var(--g-font);
      }
      .g-btn:disabled {
        opacity: 0.55;
      }
      .table-box {
        justify-self: stretch;
        overflow: auto;
        border-top: 1px solid var(--g-line);
      }
      tbody tr {
        height: 28px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font: 500 var(--g-text-body-s) var(--g-font);
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: right;
        padding: 4px 8px;
        white-space: nowrap;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      th {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
        position: sticky;
        top: 0;
        background: var(--g-surface);
        vertical-align: bottom;
      }
      td {
        border-top: 1px solid var(--g-line);
      }
      tr.now td {
        background: var(--g-accent-soft);
        font-weight: 600;
      }
      .compact th,
      .compact td {
        padding-inline: 4px;
      }
      .compact th {
        letter-spacing: normal;
        white-space: normal;
      }
      th .unit {
        text-transform: none;
      }
      /* "Lookup, filters on" may take two lines rather than widen the table past its box. */
      th.wrap {
        white-space: normal;
      }
      tbody th {
        font: inherit;
        letter-spacing: normal;
        text-transform: none;
        color: inherit;
        position: static;
        background: none;
        border-top: 1px solid var(--g-line);
        font-weight: 500;
      }
      tr.now th {
        background: var(--g-accent-soft);
        font-weight: 600;
      }
      .well .segment {
        position: absolute;
        display: block;
        z-index: 2;
      }
      .well .segment span {
        height: 100%;
        min-height: 0;
      }
      .well .segment.toggle span {
        flex-direction: row;
        justify-content: flex-start;
        gap: 10px;
        padding: 0 12px;
        font-size: var(--g-text-body-s);
      }
      .well .segment.toggle .box {
        flex: none;
        width: 18px;
        height: 18px;
        border-radius: 5px;
        border: 1.5px solid var(--g-stroke);
        background: var(--g-raised);
        display: grid;
        place-items: center;
      }
      .well .segment.toggle input:checked + span .box {
        background: var(--g-accent);
        border-color: var(--g-accent);
      }
      .well .segment.toggle .box svg {
        width: 12px;
        height: 12px;
        visibility: hidden;
      }
      .well .segment.toggle input:checked + span .box svg {

// ---------- Text measurement, with the fonts the app ships (stage-text.ts's one module: no tabular digits, stage text
// is measured as drawn; the label role is set in capitals with its tracking).
const ROLE = {
  label: { css: '600 11px "Inter Variable"', size: 11, track: 0.12, upper: true },
  title: { css: '600 15px "Inter Variable"', size: 15 },
  cap: { css: '500 13px "Inter Variable"', size: 13 },
  capB: { css: '600 13px "Inter Variable"', size: 13 },
  small: { css: '500 11px "Inter Variable"', size: 11 },
  smallB: { css: '700 11px "Inter Variable"', size: 11 },
  mono: { css: '600 11px "JetBrains Mono Variable"', size: 11 },
  monoS: { css: '700 12px "JetBrains Mono Variable"', size: 12 },
  num: { css: '600 13px "JetBrains Mono Variable"', size: 13 },
  look: { css: '600 11px "Inter Variable"', size: 11 },

const LH = { cap: 17, capB: 17, small: 14, smallB: 14, title: 20, label: 14, mono: 14, monoS: 15, num: 17 };
const ctx = document.createElement('canvas').getContext('2d');
const widthCache = new Map();
function tw(text, role) {
  const key = role + '|' + text;

  ctx.font = f.css;
  const s = f.upper ? text.toUpperCase() : text;
  const w = Math.ceil(ctx.measureText(s).width + (f.track ? f.track * f.size * s.length : 0)) + 1;
  widthCache.set(key, w);

}
// A number never parts from its unit, nor a percentile from its value: they wrap as one word (stage-text.ts's keep
// rule, the same one g-code-text applies to HTML).
// Only a number with its unit is kept together, never the words before it ("of 20 locations" would strand "Each"); a
// ghost sentence ("It was 18.8 ms.") is one group.
const KEEP = /(\d[\d,.]*%?|\?%?) (ms|s|min|h|minutes?|seconds?|hours?|locations?|requests|URLs|times|a second|a minute|a location)\b/g;
const glue = (t) =>

    .replace(KEEP, '$1⁠$2')
    .replace(/It was /g, 'It⁠was⁠')
    .replace(/(\d[\d,.]*%?) (×) (\d)/g, '$1⁠$2⁠$3');
const unglue = (t) => t.replace(/⁠/g, ' ');
/** Lines of `text` in `role` within `width`, with the measurement's 1 px slack and the keep rule. */
function wrap(text, role, width) {
  const lines = [];
  let line = '';
  for (const w of glue(text).split(' ')) {
    const next = line ? line + ' ' + w : w;
    if (tw(unglue(next), role) <= width || !line) line = next;
    else {
      lines.push(line);
      line = w;
    }
  }
  if (line) lines.push(line);
  if (lines.length > 1 && !lines.at(-1).includes(' ') && !lines.at(-1).includes('⁠')) {
    const prev = lines.at(-2).split(' ');
    const moved = prev.length > 1 ? prev.at(-1) + ' ' + lines.at(-1) : null;
    if (moved && tw(unglue(moved), role) <= width) {
      lines[lines.length - 2] = prev.slice(0, -1).join(' ');
      lines[lines.length - 1] = moved;
    }
  }
  return lines.map(unglue);
}
const pick = (forms, fits) => forms.find(fits) ?? forms[forms.length - 1];
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const r1 = (v) => Math.round(v * 10) / 10;
// HTML learner text keeps a number with its unit on one line (g-code-text's rule), without a non-breaking space.
const KEEP_HTML = /(\(\?utm_source=…\)|\d[\d,.]*%?(?: (?:ms|s|min|h|minutes?|seconds?|hours?|locations?|requests|URLs|times|a second|a minute|a location))?|\?\/s|\? ms|\?%)/g;
const nb = (s) =>

    .split(KEEP_HTML)
    .map((p, i) => (i % 2 ? `<span class="nb">${p}</span>` : p))
    .join('');

// ---------- The drawing: SVG parts in layers, and the boxes the checks measure against.
class Draw {
  constructor(W) {
    this.W = W;
    this.layers = { back: [], grid: [], links: [], marks: [], dots: [], text: [], top: [] };
    this.texts = [];
    this.marks = [];
    this.hits = [];
    this.regions = {};
    this.missing = [];
    this.orphans = [];
    this.meta = {};
  }
  add(layer, s) {
    this.layers[layer].push(s);
  }
  text(x, y, parts, o = {}) {
    if (typeof parts === 'string') parts = [[parts, o.role ?? 'small', o.cls ?? 'muted']];
    const anchor = o.anchor ?? 'start';
    const w = parts.reduce((s, [t, role]) => s + tw(t, role), 0);
    const role = parts.reduce((a, p) => (ROLE[p[1]].size > ROLE[a].size ? p[1] : a), parts[0][1]);
    const fs = ROLE[role].size;
    const x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
    const box = { x0, x1: x0 + w, y0: y - 0.74 * fs, y1: y + 0.22 * fs, owner: o.owner ?? '', s: parts.map((p) => p[0]).join('') };
    this.texts.push(box);
    const spans = parts.map(([t, r, cls = '']) => `<tspan class="t-${r} ${cls}">${esc(r === 'label' ? t.toUpperCase() : t)}</tspan>`).join('');
    const attrs = `x="${r1(x)}" y="${r1(y)}" text-anchor="${anchor}"${o.owner ? ` data-owner="${o.owner}"` : ''}${o.id ? ` data-id="${o.id}"` : ''}${o.xtick ? ' data-xtick="1"' : ''}${o.data ?? ''}`;
    this.add(o.layer ?? 'text', `<text ${attrs}>${spans}</text>`);

  }
  /** Wrapped muted lines from y (a baseline); returns the baseline after the last line. */
  para(x, y, text, width, o = {}) {
    const role = o.role ?? 'cap';
    const lines = wrap(text, role, width);
    if (lines.length > 1) for (const l of lines) if (!l.includes(' ')) this.orphans.push(`${l} (in "${text.slice(0, 40)}")`);
    for (const l of lines) {
      this.text(x, y, [[l, role, o.cls ?? 'muted']], o);
      y += LH[role];
    }
    return y;
  }
  mark(box, owner = '') {
    this.marks.push({ ...box, owner });
  }
  region(id, box) {
    (this.regions[id] ??= []).push(box);
  }
  svg(H, label) {
    const L = this.layers;
    return `<svg class="draw" width="${this.W}" height="${H}" viewBox="0 0 ${this.W} ${H}" role="img" aria-label="${esc(label)}">
<defs>
<pattern id="dense" width="3" height="10" patternUnits="userSpaceOnUse"><line class="dense-line" x1="1" y1="0" x2="1" y2="10"/></pattern>
<pattern id="dense-other" width="4" height="10" patternUnits="userSpaceOnUse"><line class="dense-other-line" x1="1" y1="0" x2="1" y2="10"/></pattern>
</defs>
<g>${L.back.join('')}</g><g>${L.grid.join('')}</g><g>${L.links.join('')}</g><g>${L.marks.join('')}</g><g>${L.dots.join('')}</g><g>${L.text.join('')}</g><g>${L.top.join('')}</g></svg>`;
  }
}
/**
 * Axis labels, evenly spaced: all of them when every pair keeps 6 px; otherwise every other one, counted from `from`
 * ('start' or 'end'), plus the label at the other end only where it keeps 6 px. Labels in `fixed` (already placed, such
 * as a ring's rank) are kept first, and any tick label within 6 px of one is dropped.
 */
function placeTicks(D, ticks, y, owner, { from = 'start', fixed = [] } = {}) {
  const box = (t) => {
    const w = tw(t.text, t.role ?? 'small');
    const x0 = t.anchor === 'middle' ? t.x - w / 2 : t.anchor === 'end' ? t.x - w : t.x;
    return { x0, x1: x0 + w };

  const clear = (a, b) => { const p = box(a); const q = box(b); return p.x1 + 6 <= q.x0 || q.x1 + 6 <= p.x0; };
  const fits = (set) => set.every((a, i) => set.every((b, j) => j <= i || clear(a, b)));
  let kept = ticks;
  if (!fits(kept)) {
    const n = ticks.length - 1;
    kept = ticks.filter((_, i) => (from === 'start' ? i : n - i) % 2 === 0);
    const other = from === 'start' ? ticks[n] : ticks[0];
    if (!kept.includes(other) && kept.every((k) => clear(k, other))) kept.push(other);
  }

function dot(D, cx, cy, r, cls, owner, id) {
  D.add('dots', `<circle class="dot ${cls}" cx="${r1(cx)}" cy="${r1(cy)}" r="${r}" data-owner="${owner}"${id ? ` data-id="${id}"` : ''}/>`);
}
const rect = (cls, x, y, w, h, rx = 0, extra = '') => `<rect class="${cls}" x="${r1(x)}" y="${r1(y)}" width="${r1(Math.max(0, w))}" height="${r1(Math.max(0, h))}"${rx ? ` rx="${rx}"` : ''}${extra}/>`;
const line = (cls, x1, y1, x2, y2, extra = '') => `<line class="${cls}" x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}"${extra}/>`;

// ---------- What an open question hides, on every surface: one map (prevention 1). Each region is named in the
// question's own `hide` list. `curve` (E1) hides which objects hit: while the question asks, the square's bands and
// half-hit ranks, the lanes' hit shares and the outcome of every sampled request (ticks drawn as plain arrivals, no
// copies); while its answer plays the marks land as the play reaches them, and the numbers stay "?". `outcome` (E2 to
// E5) hides, while the answer plays at the act's setting, where requests are answered: every share and rate below the
// users, the streams and fills that would draw them, the square's bands, the half-hit ranks, the lanes' hit shares and
// the mean response. No ghost shows while a question is open: a card's setup is a new start.
function hiding(view) {
  const h = new Set(view.hide ?? []);
  const asking = view.phase === 'asking';
  const playing = view.phase === 'playing';
  const open = asking || playing;
  const curve = h.has('curve') && open;
  const outcome = h.has('outcome') && playing;
  const map = {
    open,
    curveNumbers: curve || outcome,
    curveBands: curve || outcome,
    laneHits: curve || outcome,
    laneMarks: h.has('curve') && asking,
    tierNumbers: outcome,
    tierFlows: outcome,
    mean: outcome,
    ghost: open,
    note: open,
  };
  for (const k of view.leak ?? []) map[k] = false;

}
const NOTHING = hiding({ phase: 'free' });

// ---------- Words. Every figure is a model value through model.js's formatting.
const locs = (n) => `${n} ${n === 1 ? 'location' : 'locations'}`;
const urls = (s) => (s.variants > 1 ? ` A tracking parameter gives each image ${s.variants} URLs, each cached on its own.` : '');
const windowWords = (s) => {
  const w = M.WINDOW_TTLS * s.ttl;
  return { 25: '25 seconds', 300: '5 minutes', 1500: '25 minutes', 18000: '5 hours' }[w];
};
function titleOf(s) {
  return `A CDN of ${locs(s.pops)} serving ${F.group(s.rps)} requests a second`;
}
function subOf(s) {
  return `The site serves 100,000 images, popularity on a Zipf curve. Each location keeps a copy for ${F.ttlWords(s.ttl)} after a miss.${urls(s)}`;
}
/** The tiers' words; `narrow` (a stage under 420 px) gives each body its short form. */
function tierWords(sc, hid, ghost, narrow = false) {
  const s = sc.s;
  const q = (v) => (hid.tierNumbers ? '?%' : v);
  const ghostWords = !hid.tierNumbers && ghost && !hid.ghost && F.rate(ghost.originRps) !== F.rate(sc.originRps) ? ` It was ${F.rate(ghost.originRps)}.` : '';
  const hop = s.shield ? 'the edge, the shield, then a round trip to the origin' : 'the edge, then a round trip to the origin';
  return {
    users: { fig: F.rate(s.rps), head: 'requests', body: narrow ? 'Each to its nearest location.' : 'From users, each sent to its nearest location (anycast or DNS).' },
    edge: {
      fig: hid.tierNumbers ? '?/s' : F.rate(sc.edgeRps),
      head: 'answered at the edge',
      body: narrow
        ? `In ${F.ms(sc.paths.edge)}, ${q(F.pct(sc.edgeShare))} of requests, ${s.pops === 1 ? 'at one location' : `at ${F.rate(sc.perPopRps)} a location`}.`
        : `In ${F.ms(sc.paths.edge)}, for ${q(F.pct(sc.edgeShare))} of requests. ${s.pops === 1 ? 'The one location takes' : `Each of ${locs(s.pops)}, one cell each, takes`} ${F.rate(sc.perPopRps)} and keeps its own copies.`,
    },
    shield: s.shield && s.pops === 1
      ? { fig: null, head: null, body: narrow ? 'With 1 location the shield never hits; it adds 30 ms to a miss.' : 'With 1 location the shield never hits: its copy expires with the edge’s. It adds 30 ms to every miss.' }
      : s.shield
      ? {
          fig: hid.tierNumbers ? '?/s' : F.rate(sc.shieldRps),
          head: 'answered by the shield',
          body: narrow ? `In ${F.ms(sc.paths.shield)}, ${q(F.pct(sc.shieldShare))} of requests.` : `In ${F.ms(sc.paths.shield)}, for ${q(F.pct(sc.shieldShare))} of requests. It sees every location’s misses.`,
        }
      : { fig: null, head: null, body: narrow ? 'No shield: misses go on to the origin.' : 'No shield: every miss goes on to the origin.' },
    origin: {
      fig: hid.tierNumbers ? '?/s' : F.rate(sc.originRps),
      head: 'reach the origin',
      body: (narrow ? `In ${F.ms(sc.paths.origin)}, ${q(F.pct(sc.originShare))} of ${F.rate(s.rps)}.` : `In ${F.ms(sc.paths.origin)} (${hop}), for ${q(F.pct(sc.originShare))} of ${F.rate(s.rps)}.`) + ghostWords,
    },

      ? 'Mean response: shows after your answer.'

          [sc.edgeShare, sc.paths.edge],

          .filter(([sh], i) => i !== 1 || s.shield)
          .map(([sh, p]) => `${F.pct(sh)} × ${F.ms(p)}`)

    const mt = `mean ${F.mean(sc.meanMs)}`;
    const w = tw(mt, 'smallB');
    D.text(Math.min(bx1 - w, Math.max(bx, mx - w / 2)), my, [[mt, 'smallB', '']], { owner: 'paths', id: 'mean-label' });
  } else D.text(bx, my, [['mean: after your answer', 'small', 'muted']], { owner: 'paths' });
  y += 3 * 16 + 18;
  D.para(g.x0, y + 12, t.mean, g.iw, { owner: 'mean', cls: '', id: 'mean' });
  y += r.mean * 17 + 6;
  D.region('tiers', { x0: g.x0 - 8, x1: g.x1 + 8, y0: top - 6, y1: y });
  return y + 34;
}

// The outlined location over five TTLs: three objects' requests, their copies, and with a shield what the shield held.
function timeline(D, y, sc, view, hid, sample) {
  const g = geometry(D.W);
  const r = reserve(D.W);
  const s = sc.s;
  const top = y;
  const W = M.WINDOW_TTLS * s.ttl;
  // One line where a form fits beside Play, else two lines (both fit in Play's 44 px row).
  const forms = [`The outlined location, ${windowWords(s)} · one sample`, `Outlined location, ${windowWords(s)} · sample`, 'Outlined location · sample'];
  const one = forms.find((f) => tw(f, 'label') <= g.iw - 56);
  const labelLines = one ? [one] : wrap(forms.find((f) => linesOf(f, 'label', g.iw - 56) <= 2) ?? forms[2], 'label', g.iw - 56);
  labelLines.forEach((l, i) => D.text(g.x0, y + (labelLines.length === 1 ? 26 : 19 + i * 15), [[l, 'label', 'muted']], { owner: 'timeline' }));
  D.hits.push({ kind: 'play', x: g.x1 - 44, y, w: 44, h: 44 });
  y += 48;
  const frac = view.frac ?? (view.reduced && view.played ? 1 : null);
  const tNow = frac == null ? null : frac * W;
  const playing = tNow != null && frac < 1 && !view.reduced;
  const step = view.reduced && view.played ? 'Played below the picture: motion is reduced.' : playing ? stepWords(sc, sample, tNow, hid) : restStep(sc);
  D.para(g.x0, y + 12, step, g.iw, { owner: 'step', cls: playing ? '' : 'muted', id: 'step' });
  y += r.step * 17 + 6;
  const xOf = (t) => g.x0 + (g.iw * Math.max(0, Math.min(W, t))) / W;
  const show = (t) => tNow == null || t <= tNow;
  const ev = events(sample, s);
  const laneTop = [];
  for (let i = 0; i < 3; i++) {
    const w = laneWords(sc, i, hid);
    const one = `${w.who} ${w.asked} · ${w.hits}`;
    let b = y + 12;
    if (tw(one, 'cap') <= g.iw) {
      D.text(g.x0, b, [[w.who, 'capB', ''], [` ${w.asked} · `, 'cap', 'muted'], [w.hits, 'capB', hid.laneHits ? 'muted' : '']], { owner: `lane-${i}`, id: `lane-words-${i}` });
    } else {
      const a = wrap(`${w.who} ${w.asked}`, 'cap', g.iw);
      a.forEach((l, k) => {
        if (k === 0) D.text(g.x0, b, [[w.who, 'capB', ''], [l.slice(w.who.length), 'cap', 'muted']], { owner: `lane-${i}` });
        else D.text(g.x0, b, [[l, 'cap', 'muted']], { owner: `lane-${i}` });
        b += 17;
      });
      wrap(w.hits, 'smallB', g.iw).forEach((l) => {
        D.text(g.x0, b - 2, [[l, 'smallB', hid.laneHits ? 'muted' : '']], { owner: `lane-${i}`, id: `lane-hits-${i}` });
        b += 14;
      });
    }
    y += r.lane[i] * 17 + 2;
    const ty = y;
    laneTop.push(ty);
    const L = sample.lanes[i];
    D.add('grid', line('track', g.x0, ty + 13, g.x1, ty + 13));
    if (!hid.laneMarks) {
      for (const c of L.copies) {
        if (!show(Math.max(0, c.from))) continue;
        const to = tNow == null ? c.to : Math.min(c.to, tNow);
        const x0 = xOf(c.from);
        const x1 = xOf(to);
        if (x1 - x0 < 0.5) continue;
        D.add('marks', rect('copy', x0, ty + 3, x1 - x0, 10, 1.5, ` data-copy="${i}"`));
        if (L.dense) D.add('marks', rect('dense', x0 + 1, ty + 4, Math.max(0, x1 - x0 - 2), 8, 0, ` data-dense="${i}"`));
      }
    }
    if (hid.laneMarks && L.dense) D.add('marks', rect('dense-other', g.x0, ty + 4, ((tNow == null ? W : tNow) / W) * g.iw, 9));
    const shY = ty + 24;
    const originY = ty + 31;
    for (const e of ev.filter((q) => q.lane === i)) {
      if (!show(e.at)) continue;
      const x = xOf(e.at);
      if (hid.laneMarks) {
        if (!L.dense) D.add('marks', line('tick-req', x, ty + 4, x, ty + 13));
        continue;
      }
      if (e.hit) D.add('marks', line('tick-hit', x, ty + 4, x, ty + 13, ` data-req="${i}"`));
      else if (e.where === 'shield') {
        // A miss the shield answered stops at the shield track, in a square there.
        D.add('marks', line('tick-miss', x, ty + 1, x, shY, ` data-req="${i}"`));
        D.add('dots', `<rect class="dot ans-shield" x="${r1(x - 3)}" y="${r1(shY - 3)}" width="6" height="6" data-cx="${r1(x)}" data-cy="${r1(shY)}" data-r="3" data-owner="lane-${i}"/>`);
      } else {
        // A miss the origin answered runs past the shield track to a dot below it.
        D.add('marks', line('tick-miss', x, ty + 1, x, originY, ` data-req="${i}"`));
        dot(D, x, originY, 2.5, 'ans-origin', `lane-${i}`, `miss-${i}-${e.at.toFixed(3)}`);
      }
    }
    if (s.shield) {
      D.add('grid', line('track', g.x0, shY, g.x1, shY));
      if (!hid.laneMarks && L.shield) {
        for (const c of L.shield.copies) {
          if (!show(Math.max(0, c.from))) continue;
          const to = tNow == null ? c.to : Math.min(c.to, tNow);
          if (xOf(to) - xOf(c.from) < 0.5) continue;
          D.add('marks', rect('copy shield', xOf(c.from), shY - 5, xOf(to) - xOf(c.from), 5, 1, ` data-scopy="${i}"`));
        }
        if (L.shield.dense) {
          const to = tNow == null ? W : tNow;
          D.add('marks', rect('dense-other', g.x0, shY, xOf(to) - g.x0, 4));
        } else for (const a of L.shield.arrivals) if (!a.own && show(a.at)) D.add('marks', line('tick-other', xOf(a.at), shY, xOf(a.at), shY + 4));
      }
    }
    y = ty + 38;
  }
  // The axis: TTL marks across the window.
  D.add('grid', line('axis', g.x0, y, g.x1, y));
  const tt = [];
  for (let k = 0; k <= M.WINDOW_TTLS; k++) {
    const x = xOf(k * s.ttl);
    D.add('grid', line('tickmark', x, y, x, y + 4));
    tt.push({ x, text: F.clock(k * s.ttl), anchor: k === 0 ? 'start' : k === M.WINDOW_TTLS ? 'end' : 'middle' });
  }
  placeTicks(D, tt, y + 16, 'taxis', { from: 'start' });
  if (playing) {
    // One accent hairline across each lane's tracks (never through the lane words) and a cap on the axis.
    const x = xOf(tNow);
    for (const ty of laneTop) D.add('top', line('playhead', x, ty - 1, x, ty + 35));
    D.add('top', line('playhead', x, y - 3, x, y));
    D.add('top', `<path class="playhead-cap" d="M${r1(x - 3.5)},${r1(y + 5)} L${r1(x + 3.5)},${r1(y + 5)} L${r1(x)},${r1(y)} Z"/>`);
  }
  y += 24;
  D.para(g.x0, y + 10, keyOf(s, hid, g.iw), g.iw, { role: 'small', owner: 'key' });
  y += r.key * 14 + 4;
  D.region('timeline', { x0: g.x0 - 8, x1: g.x1 + 8, y0: top - 6, y1: y });
  return y + 34;
}

// The square: every request, objects ordered by popularity, each as wide as its share of requests; the height of a
// column is where its requests are answered. Each band's area is its share, exactly (model.js's columns()).
function square(D, y, sc, view, hid) {
  const g = geometry(D.W);
  const r = reserve(D.W);
  const s = sc.s;
  const top = y;
  D.text(g.x0, y + 11, [[pick(['Every request, most popular objects first · the model', 'Every request, popular first · model', 'Every request · model'], (f) => tw(f, 'label') <= g.iw), 'label', 'muted']], { owner: 'square' });
  y += 22;
  const rows = legendRows(legendItems(sc, hid), g.iw);
  rows.forEach((row, k) => {
    for (const it of row) {
      D.add('marks', rect(`swatch-${it.cls}`, g.x0 + it.dx, y + k * 18 + 3, 10, 10, 2));
      D.text(g.x0 + it.dx + 14, y + k * 18 + 12, [[it.t, 'cap', '']], { owner: 'legend', id: `legend-${it.cls}` });
    }
  });
  y += r.legend * 18 + 4;
  const yAxisW = 32;
  const px0 = g.x0 + yAxisW;
  const px1 = g.x1;
  const pw = px1 - px0;
  const X = (share) => px0 + pw * share;
  const tailX0 = X(M.cumShare(10000));
  const tailForms = [`the 90,000 least popular: ${F.pct(1 - M.cumShare(10000))} of requests`, `90,000 least popular: ${F.pct(1 - M.cumShare(10000))}`, `the tail: ${F.pct(1 - M.cumShare(10000))}`];
  D.text(px1, y + 9, [[pick(tailForms, (f) => tw(f, 'small') <= g.iw - 4), 'small', 'muted']], { anchor: 'end', owner: 'tail' });
  D.add('grid', `<path class="bracket" d="M${r1(tailX0)},${r1(y + 18)} V${r1(y + 14)} H${r1(px1)} V${r1(y + 18)}"/>`);
  y += 22;
  const marks = sc.lanes.map((l) => ({ rank: l.rank, x: X((M.cumShare(l.rank - 1) + M.cumShare(l.rank)) / 2), t: `#${F.group(l.rank)}` }));
  let prevEnd = -Infinity;
  const placed = marks.map((m) => {
    const w = tw(m.t, 'mono');
    let x0 = Math.max(px0 - yAxisW + 2, m.x - w / 2);
    x0 = Math.max(x0, prevEnd + 6);
    x0 = Math.min(x0, px1 - w);
    prevEnd = x0 + w;
    return { ...m, x0, w };
  });
  for (let i = placed.length - 2; i >= 0; i--) if (placed[i].x0 + placed[i].w + 6 > placed[i + 1].x0) placed[i].x0 = placed[i + 1].x0 - 6 - placed[i].w;
  for (const m of placed) {
    D.text(m.x0, y + 9, [[m.t, 'mono', '']], { owner: `lanemark`, id: `lanemark-${m.rank}` });
    D.add('grid', `<path class="lane-mark" d="M${r1(m.x - 3)},${r1(y + 12)} L${r1(m.x + 3)},${r1(y + 12)} L${r1(m.x)},${r1(y + 16)} Z"/>`);
  }
  y += 18;
  const ph = D.W < 420 ? 112 : 140;
  const py0 = y;
  const py1 = y + ph;
  const Y = (v) => py1 - ph * v;
  const rings = [];
  if (!hid.curveBands) {
    const n = Math.max(40, Math.round(pw));
    const cols = M.columns(sc, n);
    const ptsE = cols.map((c, i) => [X((i + 0.5) / n), Y(c.edge)]);
    const ptsS = cols.map((c, i) => [X((i + 0.5) / n), Y(c.edge + c.shield)]);
    const path = (pts) => pts.map(([x, yy]) => `${r1(x)},${r1(yy)}`).join(' L');
    D.add('marks', `<path class="band-origin" d="M${r1(px0)},${r1(py0)} H${r1(px1)} V${r1(py1)} H${r1(px0)} Z"/>`);
    if (s.shield) {
      D.add('marks', `<path class="band-shield" data-band="sq-shield" d="M${r1(px0)},${r1(py1)} L${r1(px0)},${r1(ptsS[0][1])} L${path(ptsS)} L${r1(px1)},${r1(ptsS.at(-1)[1])} V${r1(py1)} Z"/>`);
      // A stage-coloured hairline parts the shield's band from the origin's (their colours alone are too close).
      D.add('marks', `<path class="band-sep" d="M${r1(px0)},${r1(ptsS[0][1])} L${path(ptsS)} L${r1(px1)},${r1(ptsS.at(-1)[1])}"/>`);
    }
    D.add('marks', `<path class="band-edge" data-band="sq-edge" d="M${r1(px0)},${r1(py1)} L${r1(px0)},${r1(ptsE[0][1])} L${path(ptsE)} L${r1(px1)},${r1(ptsE.at(-1)[1])} V${r1(py1)} Z"/>`);
    D.add('grid', line('gridline', px0, Y(0.5), px1, Y(0.5)));
    const ring = (rank, yv, kind) => {
      if (!(rank >= 1 && rank <= M.OBJECTS)) return;
      const x = X(M.xOfRank(rank));
      D.add('top', line(`knee-line${kind === 'shield' ? ' shield' : ''}`, x, Y(yv) + 4, x, py1 + 4, ` data-ring="${kind}"`));
      D.add('top', `<circle class="knee${kind === 'shield' ? ' shield' : ''}" cx="${r1(x)}" cy="${r1(Y(yv))}" r="4" data-id="knee-${kind}"/>`);
      rings.push({ kind, x, text: F.ord(rank) });
    };
    ring(sc.edgeKnee, 0.5, 'edge');
    if (s.shield && sc.shieldKnee > 0) {
      const q = M.key(s, Math.round(sc.shieldKnee));
      ring(sc.shieldKnee, q.edge + (1 - q.edge) * 0.5, 'shield');
    }
  } else {
    D.add('marks', rect('hidden-box', px0, py0, pw, ph, 3, ' data-id="square-hidden"'));
    D.text((px0 + px1) / 2, (py0 + py1) / 2 + 4, [[pick(['Which objects hit shows after your answer', 'shows after your answer', 'after your answer'], (f) => tw(f, 'small') <= pw - 12), 'small', 'muted']], { anchor: 'middle', owner: 'sqhidden' });
  }
  D.add('grid', line('axis', px0, py1, px1, py1));
  D.add('grid', line('axis', px0, py0, px0, py1));
  for (const [v, t] of [[1, '100%'], [0.5, '50%'], [0, '0%']]) D.text(px0 - 5, Y(v) + 4, [[t, 'small', 'muted']], { anchor: 'end', owner: 'yaxis' });
  // The axis row: each ring's rank centred on its hairline (nudged apart to keep 6 px while each still spans its
  // hairline), then the rank boundaries centred on their ticks, evenly dropped where they crowd.
  const ringLabels = rings.map((rg) => {
    const w = tw(rg.text, 'smallB');
    return { ...rg, w, x0: Math.min(g.x1 - w, Math.max(g.x0, rg.x - w / 2)) };
  });
  if (ringLabels.length === 2) {
    const [a, b] = ringLabels[0].x <= ringLabels[1].x ? ringLabels : [ringLabels[1], ringLabels[0]];
    const short = a.x0 + a.w + 6 - b.x0;
    if (short > 0) {
      a.x0 -= short / 2;
      b.x0 += short / 2;
      a.x0 = Math.max(g.x0, a.x0);
      b.x0 = Math.min(g.x1 - b.w, Math.max(b.x0, a.x0 + a.w + 6));
      a.x0 = Math.min(a.x0, b.x0 - 6 - a.w);
    }
  }
  for (const rl of ringLabels) D.text(rl.x0, py1 + 16, [[rl.text, 'smallB', rl.kind === 'shield' ? 'shield-ink' : '']], { owner: 'xaxis', id: `ring-label-${rl.kind}`, data: ` data-ring-x="${r1(rl.x)}"` });
  const xt = [];
  for (const rank of [10, 100, 1000, 10000, 100000]) {
    const x = X(M.cumShare(rank));
    D.add('grid', line('tickmark', x, py1, x, py1 + 4));
    xt.push({ x, text: F.group(rank), anchor: rank === 100000 ? 'end' : 'middle' });
  }
  placeTicks(D, xt, py1 + 16, 'xaxis', { from: 'end', fixed: ringLabels.map((rl) => ({ x: rl.x0, text: rl.text, anchor: 'start', role: 'smallB' })) });
  y = py1 + 20;
  D.text(g.x0, y + 10, [[pick(AXIS_TITLES, (f) => tw(f, 'small') <= g.iw), 'small', 'muted']], { owner: 'xtitle' });
  y += 18;
  const kw = kneeWords(sc, hid);
  const kneeRow = (text, kind, owner) => {
    D.add('top', `<circle class="knee knee-key${kind === 'shield' ? ' shield' : ''}" cx="${r1(g.x0 + 4)}" cy="${r1(y + 6)}" r="4" data-id="knee-${kind}-key"/>`);
    D.para(g.x0 + 14, y + 10, text, g.iw - 14, { role: 'small', owner, cls: '', id: `knee-${kind}-words` });
  };
  kneeRow(kw.edge, 'edge', 'knee');
  y += r.knee * 14 + 2;
  if (kw.shield) kneeRow(kw.shield, 'shield', 'kneeS');
  y += r.kneeS * 14 + 4;
  D.region('square', { x0: g.x0 - 8, x1: g.x1 + 8, y0: top - 6, y1: y });
  return y + 26;
}

// While a play runs, the newest miss at the outlined location rides its own drawn stream: column 0's centre line into
// the merged band, then (if the shield had no copy) across the shield box to the trunk and down it to the origin. It
// is the play's one moving particle and moves only along drawn marks.
function routePoints(route, where) {
  const { a, c1, c2, b } = route.stream;
  const pts = [];
  for (let i = 0; i <= 24; i++) {
    const t = i / 24;
    const u = 1 - t;
    pts.push([u * u * u * a[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * b[0], u * u * u * a[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * b[1]]);
  }
  if (route.shield) {
    pts.push([b[0], route.shieldY]);
    if (where === 'origin') pts.push([route.originX, route.shieldY], [route.originX, route.originY]);
  } else pts.push([b[0], route.originY]);
  return pts;
}
function alongRoute(pts, f) {
  const seg = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]));
  let d = f * seg.reduce((x, y) => x + y, 0);
  for (let i = 0; i < seg.length; i++) {
    if (d <= seg[i] || i === seg.length - 1) {
      const k = seg[i] ? Math.min(1, d / seg[i]) : 0;
      return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k];
    }
    d -= seg[i];
  }
  return pts.at(-1);
}
function pulse(D, sc, view, sample) {
  const route = D.meta.route;
  if (!route || view.frac == null || view.frac >= 1 || view.reduced) return;
  const W = M.WINDOW_TTLS * sc.s.ttl;
  const t = view.frac * W;
  const span = W * 0.06;
  const last = events(sample, sc.s).filter((e) => !e.hit && e.at <= t && t - e.at < span).at(-1);
  if (!last) return;
  const [x, y] = alongRoute(routePoints(route, last.where), (t - last.at) / span);
  dot(D, x, y, 3.5, 'key', 'pulse', 'pulse');
}
function buildStage(W, view) {
  const D = new Draw(W);
  const g = geometry(W);
  const r = reserve(W);
  const sc = M.scenario(view.s);
  const hid = hiding(view);
  const sample = M.sample(sc);
  D.meta.sample = sample;
  let y = 14;
  D.para(g.x0, y + 15, titleOf(view.s), g.iw, { role: 'title', cls: '', owner: 'title' });
  y += r.title * 20 + 2;
  D.para(g.x0, y + 13, subOf(view.s), g.iw, { role: 'cap', owner: 'sub' });
  y += r.sub * 17 + 14;
  D.add('grid', line('rule', g.x0, y - 7, g.x1, y - 7));
  y = tiers(D, y, sc, view, hid);
  D.add('grid', line('rule', g.x0, y - 9, g.x1, y - 9));
  y = timeline(D, y, sc, view, hid, sample);
  D.add('grid', line('rule', g.x0, y - 9, g.x1, y - 9));
  y = square(D, y, sc, view, hid);
  pulse(D, sc, view, sample);
  const H = Math.round(y - 2);
  D.label = summary(sc, hid);
  return { D, H, sc, hid, sample };
}
// A reveal's regions get an outline (stroke only, around the whole region) and the house "Look here" tag on the
// outline's foot, in the space every block keeps there (6 px clear of the next block's outline).
function focusOutlines(D, ids) {
  for (const id of ids) {
    const b = D.regions[id]?.[0];
    if (!b) {
      D.missingTags = (D.missingTags ?? 0) + 1;
      continue;
    }
    D.add('top', rect('focus-outline', b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0 + 12, 8, ` data-focus="${id}"`));
    const t = 'Look here';
    const w = tw(t, 'look') + 14;
    D.add('top', rect('tag', b.x1 - w - 14, b.y1 + 12 - 9, w, 18, 9, ` data-tag="${id}"`));
    D.text(b.x1 - 14 - w / 2, b.y1 + 12 + 4, [[t, 'look', 't-look']], { anchor: 'middle', owner: 'look', layer: 'top' });
  }
}

// ---------- Views from the URL. Free states: default, shield, many, few, short, long, busy, quiet, utm, playing
// (&frac=), describe, reduced (&played=1). Questions: ask&exp=n (&phase=playing&frac=), reveal&exp=n. The challenge:
// challenge (&start=1 for its opening state).
const FREE = {
  default: {},
  shield: { shield: 1 },
  many: { pops: 100 },
  few: { pops: 1 },
  short: { ttl: 5 },
  long: { ttl: 3600, shield: 1 },
  busy: { rps: 100000 },
  quiet: { rps: 1000, pops: 5 },
  utm: { variants: 10, shield: 1 },
  ghost: { pops: 100 },
};
function expView(spec, phase, frac) {
  const s = phase === 'asking' ? { ...spec.setup } : { ...spec.setup, ...(spec.act.set ?? {}) };
  return { s, phase, exp: spec, hide: spec.hide, frac: phase === 'playing' ? frac : null, focus: phase === 'revealed' ? spec.focus : null };
}
function viewOf(p) {
  const name = p.get('state') ?? 'default';
  const reduced = name === 'reduced' || p.get('reduced') === '1';
  if (name === 'ask' || name === 'reveal') {
    const spec = M.EXPERIMENTS[Number(p.get('exp') ?? 1) - 1];
    const phase = name === 'reveal' ? 'revealed' : p.get('phase') === 'playing' ? 'playing' : 'asking';

// ---------- HTML around the stage: controls, the dock, the cards, Describe.

    fieldset('ttl', 'TTL', M.TTLS, s.ttl, F.ttlShort, dis),

${gc.met ? `<p class="reveal">${nb(M.fill(M.CHALLENGE.reveal, v))}</p>` : ''}`;

// ---------- Render.
const root = document.getElementById('widget');
function render(view) {

<div class="main"><div class="stage" role="group" aria-roledescription="visualization" aria-label="CDNs and edge: where requests are answered, one location's copies, and every request by popularity"><div class="well" id="well"></div></div>
${view.reduced && view.played && !hiding(view).open ? `<p class="caption" role="status" aria-atomic="true">${nb(story(sc, M.sample(sc), hiding(view)))}</p>` : ''}<p class="model-note guide">${nb(guideOf(view))}</p><p class="model-note">${nb(noteOf(view))}</p><div class="describe" id="describe"></div></div>

// ---------- Collisions, measured from the rendered DOM.
function collisions(well) {
  const svg = well.querySelector('svg.draw');
  const W = Number(svg.getAttribute('width'));
  const H = Number(svg.getAttribute('height'));
  const owner = (el) => el.getAttribute?.('data-owner') ?? '';
  const texts = [...svg.querySelectorAll('text')]
    .filter((t) => t.textContent.trim())
    .map((t) => {
      const b = t.getBBox();
      return { el: t, s: t.textContent, owner: owner(t), x0: b.x + 0.5, x1: b.x + b.width - 0.5, y0: b.y + b.height * 0.2, y1: b.y + b.height * 0.95 };
    });
  const out = [];
  const ov = (a, b, m = 0) => Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0) > m && Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0) > m;
  for (let i = 0; i < texts.length; i++) {
    const a = texts[i];
    if (a.x0 < -0.5 || a.x1 > W + 0.5 || a.y0 < 0 || a.y1 > H) out.push(`off-stage: "${a.s}"`);
    for (let j = i + 1; j < texts.length; j++) {
      const b = texts[j];
      if (ov(a, b, 0.5)) out.push(`text on text: "${a.s}" / "${b.s}"`);
      else {
        const rowShared = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0) > 2;
        const gap = Math.max(a.x0, b.x0) - Math.min(a.x1, b.x1);
        if (rowShared && gap < 6 && gap > -0.5) out.push(`labels closer than 6 px: "${a.s}" / "${b.s}"`);
      }
    }
  }
  const inside = (p, t) => p.x > t.x0 + 0.5 && p.x < t.x1 - 0.5 && p.y > t.y0 + 0.5 && p.y < t.y1 - 0.5;
  // Lines and marks never run through text (the text's own marks and stage-ground halos aside).
  const markEls = [...svg.querySelectorAll('rect, path, line, circle')].filter((el) => !el.closest('defs') && !el.matches('.focus-outline, .tag, .rule, .hidden-box'));
  for (const el of markEls) {
    const b = el.getBBox();
    if (b.width === 0 && b.height === 0) continue;
    const box = { x0: b.x, x1: b.x + b.width, y0: b.y, y1: b.y + b.height };
    if (box.x0 < -0.5 || box.x1 > W + 0.5 || box.y0 < -0.5 || box.y1 > H + 0.5) out.push(`mark off-stage: ${el.getAttribute('class')}`);
    for (const t of texts) {
      if (t.owner === 'look' && el.matches('.tag')) continue;
      if (ov(box, t, 0.5)) out.push(`mark under text: ${el.getAttribute('class')} / "${t.s}"`);
    }
  }
  // Dots never sit on dots.
  const dots = [...svg.querySelectorAll('circle.dot:not(.user), circle.knee, rect.dot')].map((c) => ({ id: c.dataset.id ?? c.getAttribute('class'), x: +(c.getAttribute('cx') ?? c.dataset.cx), y: +(c.getAttribute('cy') ?? c.dataset.cy), r: +(c.getAttribute('r') ?? c.dataset.r) }));
  let dd = 0;
  for (let i = 0; i < dots.length; i++) for (let j = i + 1; j < dots.length; j++) if (Math.hypot(dots[i].x - dots[j].x, dots[i].y - dots[j].y) < dots[i].r + dots[j].r - 1.5) dd++;
  if (dd) out.push(`${dd} dots on dots`);
  // X ticks keep 6 px from each other.
  for (const owner of ['taxis', 'xaxis']) {
    const xt = texts.filter((t) => t.owner === owner).sort((a, b) => a.x0 - b.x0);
    for (let i = 1; i < xt.length; i++) if (xt[i].x0 - xt[i - 1].x1 < 6) out.push(`x ticks "${xt[i - 1].s}" and "${xt[i].s}" ${(xt[i].x0 - xt[i - 1].x1).toFixed(1)} px apart`);
  }
  // Outlines: text inside keeps 6 px from the stroke, and no tag sits on text.
  for (const o of svg.querySelectorAll('rect.focus-outline')) {
    const [x, y, w, h] = ['x', 'y', 'width', 'height'].map((a) => +o.getAttribute(a));
    for (const t of texts) {
      if (t.owner === 'look') continue;
      const inner = t.x0 >= x + 5.5 && t.x1 <= x + w - 5.5 && t.y0 >= y + 5.5 && t.y1 <= y + h - 5.5;
      const clear = t.x1 <= x - 3 || t.x0 >= x + w + 3 || t.y1 <= y - 3 || t.y0 >= y + h + 3;
      if (!inner && !clear) out.push(`text at an outline's stroke: "${t.s}"`);
    }
  }
  // A tag keeps 6 px from every other block's outline.
  for (const tg of svg.querySelectorAll('rect.tag')) {
    const [x, y, w, h] = ['x', 'y', 'width', 'height'].map((a) => +tg.getAttribute(a));
    for (const o of svg.querySelectorAll('rect.focus-outline')) {
      if (o.dataset.focus === tg.dataset.tag) continue;
      const [ox, oy, ow, oh] = ['x', 'y', 'width', 'height'].map((a) => +o.getAttribute(a));
      const gap = Math.max(ox - (x + w), x - (ox + ow), oy - (y + h), y - (oy + oh));
      if (gap < 6) out.push(`a tag ${gap.toFixed(1)} px from another outline`);
    }
  }
  // A ring's hairline never lands under another axis label (a learner would read that label as the ring's rank).
  for (const kl of svg.querySelectorAll('line.knee-line')) {
    const x = +kl.getAttribute('x1');
    for (const t of texts.filter((t) => t.owner === 'xaxis')) {
      const own = t.el.dataset.id === `ring-label-${kl.dataset.ring}`;
      if (own ? !(t.x0 - 0.5 <= x && x <= t.x1 + 0.5) : t.x0 - 3 < x && x < t.x1 + 3) out.push(`ring ${kl.dataset.ring} at ${x.toFixed(0)} ${own ? 'outside its own label' : `under "${t.s}"`}`);
    }
  }
  for (const tg of svg.querySelectorAll('rect.tag')) {
    const [x, y, w, h] = ['x', 'y', 'width', 'height'].map((a) => +tg.getAttribute(a));
    for (const t of texts) if (t.owner !== 'look' && ov({ x0: x, x1: x + w, y0: y, y1: y + h }, t, 0)) out.push(`a tag on "${t.s}"`);
    if (x < 0 || x + w > W || y < 0 || y + h > H) out.push('a tag off the stage');
  }
  // Hit boxes: 44 px, inside the stage, never on each other or on text.
  const wb = well.getBoundingClientRect();
  const hits = [...well.querySelectorAll('.hit')].map((h) => {
    const b = h.getBoundingClientRect();
    return { o: h.dataset.owner, x0: b.left - wb.left - 1, x1: b.right - wb.left - 1, y0: b.top - wb.top - 1, y1: b.bottom - wb.top - 1 };
  });
  for (let i = 0; i < hits.length; i++) {
    const a = hits[i];
    if (a.x0 < -0.5 || a.x1 > W + 0.5 || a.y0 < -0.5 || a.y1 > H + 0.5) out.push(`hit box off-stage: ${a.o}`);
    if (a.x1 - a.x0 < 43.5 || a.y1 - a.y0 < 43.5) out.push(`target under 44 px: ${a.o}`);
    for (let j = i + 1; j < hits.length; j++) if (ov(a, hits[j])) out.push(`hit on hit: ${a.o} / ${hits[j].o}`);
    for (const t of texts) if (ov(a, t, 0.5)) out.push(`a control on "${t.s}"`);
  }
  for (const sp of well.querySelectorAll('.switch > span')) if (sp.scrollWidth > sp.clientWidth + 1) out.push('the shield switch overflows');
  return out;
}
// What must hold beyond collisions: no false claims, areas as numbers, dashes only while hidden, counts bounded.
const FALSE_CLAIMS = [/from the [\d,]+(st|nd|rd|th) down/, /beyond the 100,000th/, /\? of /, /99\.9%\+/, /NaN|undefined|Infinity|null/, /(^|[^\d.,])1 (locations|requests|URLs|times|minutes)\b/, /\b([2-9]|\d{2,}) (location|minute|second|hour)\b(?!s)/, /(^|[^\d.,])0\/s/, /\?\?/, /\u2014|\u00a0/, /\d{4,}(?![\d,])/];
function assertions(r) {
  const { well, D, sc, hid, view } = r;
  const out = [];
  const svg = well.querySelector('svg.draw');
  const text = [...svg.querySelectorAll('text')].map((t) => t.textContent).join(' | ') + ' | ' + D.label;
  for (const g of FALSE_CLAIMS) if (g.test(text)) out.push(`false claim ${g}: "${text.match(g)[0]}"`);
  // A box's green part is the edge share of its width; the merged miss band, the shield's and the origin's are their shares of the full band.
  if (!hid.tierFlows) {
    const f = D.meta.flows;
    const want = { missW: D.meta.band * (1 - sc.edgeShare), shieldW: D.meta.band * sc.shieldShare, originW: D.meta.band * sc.originShare };
    for (const k of Object.keys(want)) if (Math.abs(f[k] - want[k]) > 0.05) out.push(`flow ${k} ${f[k]} for ${want[k]}`);
    const o = svg.querySelector('[data-band="origin"]');
    if (Math.abs(+o.getAttribute('width') - r1(want.originW)) > 0.11) out.push('origin fill off its share');
  } else if (svg.querySelector('[data-band], [data-stream]')) out.push('a flow drawn while hidden');
  if (hid.curveBands && svg.querySelector('[data-band^="sq-"], .knee:not(.knee-key)')) out.push('the square drawn while hidden');
  if (!hid.curveBands && !svg.querySelector('[data-band="sq-edge"]')) out.push('no square');
  // Dashed only while a question hides something.
  if (svg.querySelector('.hidden-box') && !hid.open) out.push('a dashed mark with no question open');
  // A ghost is said in words: "It was" only after a change, never while a question is open.
  if (hid.open && /It was|\(was/.test(text)) out.push('a ghost while a question is open');
  // The sample: marks never beyond the playhead; requests and copies as the sample has them.
  if (view.frac != null && view.frac < 1) {
    const ph = svg.querySelector('.playhead');
    const x = +ph.getAttribute('x1');
    for (const el of svg.querySelectorAll('[data-req]')) if (+el.getAttribute('x1') > x + 0.11) out.push('a request drawn before its moment');
    for (const el of svg.querySelectorAll('[data-copy]')) if (+el.getAttribute('x') + +el.getAttribute('width') > x + 0.2) out.push('a copy drawn past the playhead');
  }
  // Every location is its own cell, and the outlined one is exactly one cell.
  const cells = svg.querySelector('[data-cells]');
  if (+cells?.dataset.cells !== sc.s.pops) out.push(`${cells?.dataset.cells} cells for ${sc.s.pops} locations`);
  const wt = svg.querySelector('.pop.watched');
  if (Math.abs(+wt.getAttribute('width') - r1(D.meta.cell.w + 4)) > 0.11 || Math.abs(+wt.getAttribute('height') - r1(D.meta.cell.h)) > 0.11) out.push('the outlined box is not one cell');
  // Users stand as far from the locations as the nearest location is: shorter hairlines with more locations.
  if (Math.abs(D.meta.userGap - (USER_GAP(sc.s.pops) - 0)) > 0.6) out.push(`users ${D.meta.userGap.toFixed(1)} px away for ${USER_GAP(sc.s.pops).toFixed(1)}`);
  // The playhead never looks like a miss tick: not ink, thinner.
  for (const ph of svg.querySelectorAll('.playhead')) {
    const cs = getComputedStyle(ph);
    if (cs.stroke === getComputedStyle(document.body).color || parseFloat(cs.strokeWidth) >= 1.5) out.push('the playhead is drawn like a miss tick');
  }
  // The particle rides a drawn mark: its own stream, the shield box, the trunk or the origin box.
  const pd = svg.querySelector('[data-id="pulse"]');
  if (pd) {
    const p = new DOMPoint(+pd.getAttribute('cx'), +pd.getAttribute('cy'));
    const on = [...svg.querySelectorAll('[data-stream="0"], [data-id="shield-box"], [data-id="trunk"], [data-id="origin-box"]')].some((el) => {
      if (el.tagName === 'path') return el.isPointInFill(p) || el.isPointInStroke(p);
      const b = el.getBBox();
      return p.x >= b.x - 0.6 && p.x <= b.x + b.width + 0.6 && p.y >= b.y - 0.6 && p.y <= b.y + b.height + 0.6;
    });
    if (!on) out.push(`the particle at ${p.x.toFixed(1)},${p.y.toFixed(1)} is off its path`);
  }
  for (const o of D.orphans) out.push(`a one-word line: ${o}`);
  // Element counts are bounded by the stage, never by the data.
  const count = svg.querySelectorAll('*').length;
  window.__maxElements = Math.max(window.__maxElements ?? 0, count);
  if (count > 900) out.push(`${count} SVG elements`);
  if (D.missingTags) out.push(`${D.missingTags} focus tags without a place`);

// The no-answer sweep: every question asking and playing (five moments), with motion off and on, against its answer's

function answerTokens(spec) {

  }
  const a = M.scenario(spec.setup);
  const b = M.scenario(s2);
  const forms = (x) => [F.rate(x.originRps), `${F.sig2(x.originRps)}/s`, F.pct(x.edgeShare), F.pct(x.originShare), F.mean(x.meanMs), F.ord(x.edgeKnee), ...(x.s.shield ? [F.pct(x.shieldShare)] : [])];

// HTML learner text as the browser breaks it: no line ends on "(?", "can take" or holds a lone "Each", and no line but

window.htmlLines = function () {
  const out = [];
  for (const el of root.querySelectorAll('.legend, .reveal, .status li > span:last-child, .model-note, .caption, .held, .g-choice > span:first-child')) {
    const words = [];
    const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    for (let n = walk.nextNode(); n; n = walk.nextNode()) {
      const re = /\S+/g;
      let m;
      while ((m = re.exec(n.data))) {
        const rg = document.createRange();
        rg.setStart(n, m.index);
        rg.setEnd(n, m.index + m[0].length);
        const b = rg.getClientRects()[0];
        if (b) words.push({ w: m[0], top: Math.round(b.top) });
      }
    }
    const lines = [];
    for (const w of words) {
      if (!lines.length || Math.abs(w.top - lines.at(-1).top) > 4) lines.push({ top: w.top, words: [] });
      lines.at(-1).words.push(w.w);
    }
    lines.forEach((l, i) => {
      const t = l.words.join(' ');
      if (/\(\?$/.test(t) || /can take$/.test(t) || t === 'Each') out.push(`"${t}" in "${el.textContent.slice(0, 40)}"`);
