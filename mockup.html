<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backups and Recovery widget mockup</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url(fonts/inter-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        src: url(fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 800;
        font-display: block;
      }
      /* The app's tokens (apps/app/src/_theme.scss, styles.scss): light is the base, dark overrides. */
      :root {
        color-scheme: light;
        --g-bg: #f4f5f9;
        --g-surface: #ffffff;
        --g-raised: #ffffff;
        --g-sunken: #eef0f5;
        --g-line: #dfe2ea;
        --g-line-strong: #c6cbd6;
        --g-stroke: #707889;
        --g-text: #161a23;
        --g-text-rgb: 22, 26, 35;
        --g-muted: #4a5263;
        --g-faint: #5c6477;
        --g-on-fill: #ffffff;
        --g-warn-ink: #6e4200;
        --g-danger-ink: #9d1630;
        --g-found-ink: #02583f;
        --g-accent: #5846dc;
        --g-accent-rgb: 88, 70, 220;
        --g-accent-soft: rgba(88, 70, 220, 0.14);
        --g-found: #036b4c;
        --g-danger: #c3203d;
        --g-warn: #945800;
        --g-success-ink: var(--g-found-ink);
        --g-success-line: var(--g-found);
        --g-success-soft: rgba(3, 107, 76, 0.12);
        --g-danger-soft: rgba(195, 32, 61, 0.12);
        --g-warn-soft: rgba(148, 88, 0, 0.12);
        --g-viz-stage: #f7f8fb;
        --g-viz-current: #0b74ad;
        --g-viz-current-soft: rgba(11, 116, 173, 0.16);
        --g-viz-considering: #c77700;
        --g-viz-considering-soft: rgba(199, 119, 0, 0.14);
        --g-viz-final: #12925f;
        --g-viz-final-ink: var(--g-found-ink);
        --g-viz-discarded-ink: #687082;
        --g-viz-critical: #d42a49;
        --g-viz-track: #d3d7e0;
        --g-shadow: 0 1px 2px rgba(var(--g-text-rgb), 0.06), 0 3px 10px rgba(var(--g-text-rgb), 0.07);
        --g-shadow-raised: 0 1px 2px rgba(var(--g-text-rgb), 0.08);
        --g-radius-xs: 6px;
        --g-radius-sm: 10px;
        --g-radius-md: 14px;
        --g-radius-pill: 999px;
        --g-text-title-m: 1.0625rem;
        --g-text-title-s: 0.9375rem;
        --g-text-body: 0.875rem;
        --g-text-body-s: 0.8125rem;
        --g-text-label: 0.6875rem;
        --g-font: 'Inter Variable', system-ui, sans-serif;
        --g-font-mono: 'JetBrains Mono Variable', ui-monospace, monospace;
        --g-focus-ring: 2px solid var(--g-accent);
      }
      :root.dark {
        color-scheme: dark;
        --g-bg: #0b0d12;
        --g-surface: #141824;
        --g-raised: #1c2130;
        --g-sunken: #0f121a;
        --g-line: #252a37;
        --g-line-strong: #343b4d;
        --g-stroke: #6b7387;
        --g-text: #e9ebf2;
        --g-text-rgb: 233, 235, 242;
        --g-muted: #8b93a8;
        --g-faint: #828a9e;
        --g-on-fill: #0b0d12;
        --g-warn-ink: #f3e6b3;
        --g-danger-ink: #ffb3bd;
        --g-found-ink: #3ddc97;
        --g-accent: #9d8cff;
        --g-accent-rgb: 157, 140, 255;
        --g-accent-soft: rgba(157, 140, 255, 0.14);
        --g-found: #3ddc97;
        --g-danger: #ff5d73;
        --g-warn: #ffb547;
        --g-success-soft: rgba(61, 220, 151, 0.12);
        --g-danger-soft: rgba(255, 93, 115, 0.12);
        --g-warn-soft: rgba(255, 181, 71, 0.12);
        --g-viz-stage: #0e1118;
        --g-viz-current: #1f9fd0;
        --g-viz-current-soft: rgba(31, 159, 208, 0.16);
        --g-viz-considering: #c08420;
        --g-viz-considering-soft: rgba(192, 132, 32, 0.18);
        --g-viz-final: #22ad74;
        --g-viz-final-ink: var(--g-found);
        --g-viz-discarded-ink: var(--g-muted);
        --g-viz-critical: #e5485f;
        --g-viz-track: #2a3040;
        --g-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        --g-shadow-raised: var(--g-shadow);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--g-bg);
        color: var(--g-text);
        font: 400 var(--g-text-body) / 1.5 var(--g-font);
        font-variant-ligatures: none;
        -webkit-font-smoothing: antialiased;
        overflow-wrap: break-word;
      }
      button {
        font-size: 0.8333rem;
      }
      .page {
        max-width: 1048px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      .eyebrow {
        margin: 0;
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
      }
      h1 {
        margin: 4px 0 14px;
        font: 600 1.25rem/1.3 var(--g-font);
      }
      .panel {
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background: var(--g-surface);
        box-shadow: var(--g-shadow);
        padding: 16px;
      }
      /* Narrow: one column, the controls as the stage's first rows, then the stage, the question, Describe, the cards. */
      .widget {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }
      .main,
      .experiments {
        display: contents;
      }
      .controls {
        order: 1;
      }
      .stage {
        order: 2;
        min-width: 0;
      }
      .dock {
        order: 3;
      }
      .describe {
        order: 4;
      }
      .heading,
      .cards {
        order: 5;
      }
      .controls {
        padding: 12px 12px 0;
        border: 1px solid var(--g-line);
        border-bottom: 0;
        border-radius: var(--g-radius-md) var(--g-radius-md) 0 0;
        background: var(--g-viz-stage);
        display: grid;
        gap: 10px;
        min-width: 0;
      }
      .stage {
        margin-top: -12px;
      }
      .stage .well {
        border-top: 0;
        border-radius: 0 0 var(--g-radius-md) var(--g-radius-md);
      }
      @media (min-width: 1000px) {
        .widget {
          grid-template-columns: minmax(0, 1fr) 340px;
          grid-template-rows: auto 1fr;
          align-items: start;
          column-gap: 20px;
        }
        .main {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: 12px;
          grid-column: 1;
          grid-row: 1 / span 2;
          min-width: 0;
        }
        .controls {
          grid-column: 2;
          grid-row: 1;
          padding: 0;
          border: 0;
          background: none;
        }
        .experiments {
          display: block;
          grid-column: 2;
          grid-row: 2;
          min-width: 0;
        }
        .stage {
          margin-top: 0;
        }
        .stage .well {
          border-top: 1px solid var(--g-line);
          border-radius: var(--g-radius-md);
        }
        .dock {
          margin-top: 12px;
        }
      }
      .well {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background-color: var(--g-viz-stage);
        background-image: radial-gradient(circle, rgba(var(--g-text-rgb), 0.09) 1px, transparent 1.5px);
        background-size: 24px 24px;
        background-position: 11px 11px;
      }
      /* Every fieldset.group carries the same zero padding; a control's own class only adds to it (the R41 padding bug). */
      fieldset.group {
        margin: 0;
        padding: 0;
        border: 0;
        min-width: 0;
      }
      .control-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
        padding: 0;
        margin-bottom: 4px;
      }
      .segments {
        display: flex;
        gap: 4px;
      }
      .segment {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
      }
      .segment input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .segment span {
        white-space: nowrap;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 6px;
        border-radius: var(--g-radius-sm);
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        font: 500 var(--g-text-body) / 1.15 var(--g-font);
        text-align: center;
      }
      .segment input:checked + span {
        background: var(--g-accent-soft);
        border-color: var(--g-accent);
        box-shadow: inset 0 0 0 1px var(--g-accent);
        font-weight: 600;
      }
      fieldset:disabled .segment span,
      .segment input:disabled + span {
        opacity: 0.55;
      }
      .control-label .why {
        font-weight: 500;
        letter-spacing: normal;
        text-transform: none;
      }
      .segment small {
        font: 500 var(--g-text-label) var(--g-font);
        color: var(--g-muted);
      }
      .toggles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .toggles .segment span {
        flex-direction: column;
        gap: 0;
        font-size: var(--g-text-body-s);
      }
      .notice {
        margin: 0;
        min-height: 2lh;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      /* Below wide the notice would sit over the stage and push it down as it speaks: read out only (_widget-controls.scss). */
      /* "1,000 GB" keeps one line in a 74 px segment at a 320 px phone. */
      @media (max-width: 359px) {
        .controls .segment span {
          padding-inline: 3px;
        }
      }
      @media (max-width: 999px) {
        .notice {
          position: absolute;
          width: 1px;
          height: 1px;
          min-height: 0;
          overflow: hidden;
          clip-path: inset(50%);
        }
        .controls {
          padding-bottom: 12px;
        }
      }
      .caption {
        margin: 0;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      .play {
        position: absolute;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        z-index: 2;
      }
      .play svg {
        display: block;
        width: 36px;
        height: 36px;
        margin: 4px;
      }
      .play circle {
        fill: var(--g-raised);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .play path {
        fill: var(--g-accent);
      }
      .play:disabled {
        cursor: default;
        opacity: 0.55;
      }
      svg.draw {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        overflow: visible;
      }
      svg.draw text {
        paint-order: stroke;
        stroke: var(--g-viz-stage);
        stroke-width: 3px;
        stroke-linejoin: round;
      }
      svg.draw text.on-box {
        stroke: var(--g-raised);
      }
      svg.draw text.on-chip {
        stroke: none;
      }
      .t-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: var(--g-muted);
      }
      .t-cap {
        font: 500 var(--g-text-body-s) var(--g-font);
        fill: var(--g-muted);
      }
      .t-capB {
        font: 600 var(--g-text-body-s) var(--g-font);
        fill: var(--g-text);
      }
      .t-small {
        font: 500 var(--g-text-label) var(--g-font);
        fill: var(--g-muted);
      }
      .t-smallB {
        font: 700 var(--g-text-label) var(--g-font);
        fill: var(--g-text);
      }
      .t-mono {
        font: 600 var(--g-text-label) var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-nameS {
        font: 600 13px var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-head {
        font: 600 var(--g-text-title-m) var(--g-font-mono);
        fill: var(--g-text);
      }
      .focus-outline {
        fill: none;
        stroke: var(--g-accent);
        stroke-width: 2;
      }
      .tag {
        fill: var(--g-viz-stage);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .t-look {
        font: 600 var(--g-text-label) var(--g-font);
        fill: var(--g-accent);
      }
      /* The experiment dock and cards (experiment-dock.component.ts, widget-check.component.ts). */
      .dock {
        padding: 12px 16px;
        border-radius: var(--g-radius-md);
        border: 1px solid var(--g-line);
        border-left: 3px solid var(--g-accent);
        background: var(--g-surface);
      }
      .dock:empty {
        display: none;
      }
      .legend {
        margin: 0 0 4px;
        font-weight: 600;
        line-height: 1.45;
      }
      .options {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .g-choice {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        color: var(--g-text);
        font: 500 0.90625rem/1.45 var(--g-font);
        text-align: left;
      }
      button.g-choice {
        box-shadow: var(--g-shadow-raised);
        cursor: pointer;
      }
      .g-choice.right {
        border-color: var(--g-success-line);
        background: var(--g-success-soft);
      }
      .g-choice.wrong {
        border-color: var(--g-danger);
        background: var(--g-danger-soft);
      }
      .mark {
        flex: none;
        width: 20px;
        height: 20px;
      }
      .held {
        margin: 10px 0 0;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      .reveal {
        margin: 10px 0 0;
        line-height: 1.55;
        font-size: 0.90625rem;
      }
      .status-line {
        margin: 8px 0 4px;
        font: 600 var(--g-text-body) var(--g-font);
        color: var(--g-muted);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .status-line.met {
        color: var(--g-success-ink);
      }
      .status {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 4px;
        font: 600 var(--g-text-body-s) var(--g-font);
        font-variant-numeric: tabular-nums;
        color: var(--g-muted);
      }
      .status li {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .status li.met {
        color: var(--g-success-ink);
      }
      .status .state {
        flex: none;
        width: 16px;
      }
      .heading {
        display: flex;
        align-items: center;
        gap: 8px;
        font: 600 var(--g-text-title-s) var(--g-font);
        margin: 20px 0 8px;
      }
      .heading svg {
        color: var(--g-accent);
      }
      .cards {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 8px;
      }
      .card-btn {
        width: 100%;
        min-height: 48px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border: 1px solid var(--g-line-strong);
        border-radius: var(--g-radius-sm);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        font: 500 var(--g-text-body) var(--g-font);
        text-align: left;
      }
      .card-btn[aria-current] {
        border-color: var(--g-accent);
        box-shadow: inset 0 0 0 1px var(--g-accent);
        background: var(--g-accent-soft);
      }
      .card-btn .num {
        flex: none;
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: var(--g-radius-pill);
        background: var(--g-sunken);
        font: 600 var(--g-text-body-s) var(--g-font-mono);
        color: var(--g-muted);
      }
      /* Describe: a minmax(0, 1fr) grid, its table scrolling inside its own box; compact on narrow stages. */
      .describe {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
        justify-items: start;
      }
      .describe .muted-note {
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
        margin: 0;
      }
      .describe p.summary {
        margin: 0;
        font-size: var(--g-text-body-s);
      }
      .g-btn {
        appearance: none;
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        border-radius: var(--g-radius-sm);
        padding: 9px 14px;
        min-height: 44px;
        font: 500 var(--g-text-body) / 1 var(--g-font);
      }
      .g-btn:disabled {
        opacity: 0.55;
      }
      .table-box {
        justify-self: stretch;
        overflow: auto;
        border-top: 1px solid var(--g-line);
      }
      tbody tr {
        height: 28px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font: 500 var(--g-text-body-s) var(--g-font);
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: right;
        padding: 4px 8px;
        white-space: nowrap;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      th {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
        position: sticky;
        top: 0;
        background: var(--g-surface);
        vertical-align: bottom;
      }
      td {
        border-top: 1px solid var(--g-line);
      }
      tr.now td {
        background: var(--g-accent-soft);
        font-weight: 600;
      }
      .compact th,
      .compact td {
        padding-inline: 4px;
      }
      .compact th {
        letter-spacing: normal;
        white-space: normal;
      }
      th .unit {
        text-transform: none;
      }
      /* "Lookup, filters on" may take two lines rather than widen the table past its box. */
      th.wrap {
        white-space: normal;
      }
      tbody th {
        font: inherit;
        letter-spacing: normal;
        text-transform: none;
        color: inherit;
        position: static;
        background: none;
        border-top: 1px solid var(--g-line);
        font-weight: 500;
      }
      tr.now th {
        background: var(--g-accent-soft);
        font-weight: 600;
      }
      .well .segment {
        position: absolute;
        display: block;
        z-index: 2;
      }
      .well .segment span {
        height: 100%;
        min-height: 0;
      }
      .well .segment.toggle span {
        flex-direction: row;
        justify-content: flex-start;
        gap: 10px;
        padding: 0 12px;
        font-size: var(--g-text-body-s);
      }
      .well .segment.toggle .box {
        flex: none;
        width: 18px;
        height: 18px;
        border-radius: 5px;
        border: 1.5px solid var(--g-stroke);
        background: var(--g-raised);
        display: grid;
        place-items: center;
      }
      .well .segment.toggle input:checked + span .box {
        background: var(--g-accent);
        border-color: var(--g-accent);
      }
      .well .segment.toggle .box svg {
        width: 12px;
        height: 12px;
        visibility: hidden;
      }
      .well .segment.toggle input:checked + span .box svg {
        visibility: visible;
      }
      .well .segment.toggle .words {
        display: grid;
        text-align: left;
        line-height: 1.25;
        font-style: normal;
        white-space: nowrap;
      }
      .well .segment.toggle .words b {
        font-weight: 500;
      }
      /* A checked segment keeps its weight, so its label never re-wraps (prevention 20). */
      .segment input:checked + span {
        font-weight: 500;
      }
      /* ---- The Backups & Recovery stage. Blue is a copy of the data (a backup, a replica's applied rows, a restore),
         amber the log (archived segments, a replica's received log, a replay), green a promotion and serving again,
         the critical hatch writes lost, the critical line the disaster. Dashed is only ever "hidden until you answer". */
      .focus-outline {
        stroke-dasharray: none;
      }
      .t-title {
        font: 600 var(--g-text-title-s) var(--g-font);
        fill: var(--g-text);
      }
      .t-num {
        font: 600 13px var(--g-font-mono);
        fill: var(--g-text);
      }
      .lost-ink {
        fill: var(--g-danger-ink);
      }
      .final-ink {
        fill: var(--g-viz-final-ink);
      }
      .amber-ink {
        fill: var(--g-warn-ink);
      }
      .accent-ink {
        fill: var(--g-accent);
      }
      .track {
        fill: none;
        stroke: var(--g-line);
      }
      .grid {
        stroke: var(--g-line);
        stroke-width: 1;
      }
      .grid.kink {
        stroke: var(--g-line-strong);
      }
      .goal-line {
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .axis {
        stroke: var(--g-line-strong);
      }
      .rule {
        stroke: var(--g-line);
      }
      .copy {
        fill: var(--g-viz-current-soft);
        stroke: var(--g-viz-current);
        stroke-width: 1;
      }
      .primary-band {
        fill: rgba(var(--g-text-rgb), 0.1);
        stroke: var(--g-stroke);
        stroke-width: 1;
      }
      .full-box {
        fill: var(--g-viz-current);
      }
      .log-band {
        fill: var(--g-viz-considering-soft);
        stroke: var(--g-viz-considering);
        stroke-width: 1;
      }
      .comb {
        stroke: var(--g-viz-considering);
        stroke-width: 1.25;
        fill: none;
      }
      .lost {
        fill: url(#lost);
        stroke: var(--g-viz-critical);
        stroke-width: 1;
      }
      .lost-fill {

      .lost-line {

      .strike-line {

      .xmark {

        stroke-linecap: round;
      }
      .drop-tick {
        fill: var(--g-viz-critical);
      }
      .ring {
        fill: var(--g-viz-stage);
        stroke: var(--g-text);
        stroke-width: 2;
      }
      .seg-restore {
        fill: var(--g-viz-current);
      }
      .seg-replay {
        fill: var(--g-viz-considering);
      }
      .seg-promote {
        fill: var(--g-viz-final);
      }
      .serve {
        fill: var(--g-viz-final);
        stroke: var(--g-viz-stage);
        stroke-width: 1.5;
      }
      .never {
        stroke: var(--g-line-strong);
        stroke-width: 1;
      }
      .playhead {
        stroke: var(--g-text);
        stroke-width: 1.5;

      .cursor {
        stroke: var(--g-text);
        stroke-width: 1.5;

      .ghost-tick {

        stroke-width: 2;
      }
      .hidden-box {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1.25;
        stroke-dasharray: 4 3;
      }
      .hatch-fill {
        fill: var(--g-danger-soft);
      }
      .hatch-line {
        stroke: var(--g-viz-critical);
        stroke-width: 1.25;
        stroke-opacity: 0.7;
      }
      .well .segment span {
        font-size: var(--g-text-body-s);
        padding: 0 4px;
      }
      .model-note,
      .caption {
        order: 2;
      }
      .caption {
        margin: 0;
        font-size: var(--g-text-body-s);
        color: var(--g-text);
      }
      .model-note {
        margin: 0;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
        text-wrap: pretty;

        white-space: nowrap;

      }
    </style>
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">System design · Backups &amp; Recovery</p>
      <h1>Try it</h1>
      <section class="panel widget" id="widget"></section>
    </main>
    <script src="model.js"></script>
    <script>
      'use strict';
      const M = window.RecoveryModel;
      const params = new URLSearchParams(location.search);
      document.documentElement.classList.toggle('dark', params.get('theme') === 'dark');
      const DROP = M.DROP;

      // ---------- Text measurement, with the fonts the app ships (no tabular digits: stage text is measured as drawn).
      // The label role is set in capitals, but a unit keeps its case ("10 GB/min", "1 min", "24 h").
      const ROLE = {
        title: { css: '600 15px "Inter Variable"', size: 15 },
        label: { css: '600 11px "Inter Variable"', size: 11, track: 0.12, upper: true },
        cap: { css: '500 13px "Inter Variable"', size: 13 },
        capB: { css: '600 13px "Inter Variable"', size: 13 },
        small: { css: '500 11px "Inter Variable"', size: 11 },
        smallB: { css: '700 11px "Inter Variable"', size: 11 },
        num: { css: '600 13px "JetBrains Mono Variable"', size: 13 },
        look: { css: '600 11px "Inter Variable"', size: 11 },
      };
      const UNIT = /(GB\/min|\d+ (?:min|h|s)\b)/;
      const upperKeepUnits = (t) => t.toUpperCase().replace(/GB\/MIN/g, 'GB/min').replace(/(\d) (MIN|H|S)\b/g, (_, d, u) => `${d} ${u.toLowerCase()}`);
      const ctx = document.createElement('canvas').getContext('2d');
      const widthCache = new Map();
      function tw(text, role) {
        const key = role + '|' + text;
        if (widthCache.has(key)) return widthCache.get(key);
        const f = ROLE[role];
        ctx.font = f.css;
        const s = f.upper ? upperKeepUnits(text) : text;
        const w = Math.ceil(ctx.measureText(s).width + (f.track ? f.track * f.size * s.length : 0)) + 1;
        widthCache.set(key, w);
        return w;
      }
      const partsWidth = (parts) => parts.reduce((s, [t, role, , dx = 0]) => s + tw(t, role) + dx, 0);
      // A number never parts from its unit, nor "at 10×" from its "at": they wrap as one word (stage-text.ts's rule).
      const KEEP = /(\d[\d,.]*(?:×)?) (s|min|h|GB|TB|GB\/min)\b/g;
      const glue = (t) =>
        t
          .replace(KEEP, '$1 $2')
          .replace(/(at|every|in|of|up to|loses|back) (\d)/g, '$1 $2')
          .replace(/"[^"]*"/g, (q) => q.replace(/ /g, ' '));
      // The wrap measures with the glue spaces as real spaces, and never leaves one short word alone on a last line.
      const unglue = (t) => t.replace(/ /g, ' ');
      function wrap(text, role, width) {
        const lines = [];
        let line = '';
        for (const w of glue(text).split(' ')) {
          const next = line ? line + ' ' + w : w;
          if (tw(unglue(next), role) <= width || !line) line = next;
          else {
            lines.push(line);
            line = w;
          }
        }
        if (line) lines.push(line);
        if (lines.length > 1 && !lines.at(-1).includes(' ') && !lines.at(-1).includes(' ')) {
          const prev = lines.at(-2).split(' ');
          const moved = prev.length > 1 ? prev.at(-1) + ' ' + lines.at(-1) : null;
          if (moved && tw(unglue(moved), role) <= width) {
            lines[lines.length - 2] = prev.slice(0, -1).join(' ');
            lines[lines.length - 1] = moved;
          }
        }
        return lines.map(unglue);
      }
      const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const labelInner = (t) =>
        esc(upperKeepUnits(t))
          .split(UNIT)
          .map((p, i) => (i % 2 ? `<tspan class="t-unit">${p}</tspan>` : p))
          .join('');
      const r1 = (v) => Math.round(v * 10) / 10;
      const span = M.formatSpan;
      const rtoSpan = (min) => span(min * 60);
      const fMin = M.formatMin;
      const fSize = M.formatSize;
      const fSpeed = M.formatSpeed;
      const fTimes = M.formatTimes;
      // HTML learner text keeps a number with its unit on one line (g-code-text's rule), without a non-breaking space.
      const KEEP_HTML = /((?:(?:up to|under|at least|at most|every|at|in) )?\d[\d,.]*(?:×| (?:s|min|h|GB\/min|GB|TB|times))|RPO|RTO|"[^"]*")/g;
      const nb = (s) =>
        esc(s)
          .split(KEEP_HTML)
          .map((p, i) => (i % 2 ? `<span class="nb">${p}</span>` : p))
          .join('');

      // ---------- The drawing: SVG parts in layers, and the boxes placement checks against.
      class Draw {
        constructor(W) {
          this.W = W;
          this.layers = { back: [], grid: [], marks: [], dots: [], text: [], top: [] };
          this.texts = [];
          this.marks = [];
          this.links = [];
          this.hits = [];
          this.regions = {};
          this.missing = [];
          this.meta = { rows: {} };
        }
        add(layer, s) {
          this.layers[layer].push(s);
        }
        textBox(x, y, w, role, anchor = 'start') {
          const fs = ROLE[role].size;
          const x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
          return { x0, x1: x0 + w, y0: y - 0.74 * fs, y1: y + 0.22 * fs };
        }
        text(x, y, parts, o = {}) {
          if (typeof parts === 'string') parts = [[parts, o.role ?? 'small', o.cls ?? 'muted']];
          const anchor = o.anchor ?? 'start';
          const w = partsWidth(parts);
          const role = parts.reduce((a, p) => (ROLE[p[1]].size > ROLE[a].size ? p[1] : a), parts[0][1]);
          const box = this.textBox(x, y, w, role, anchor);
          box.owner = o.owner ?? '';
          box.s = parts.map((p) => p[0]).join('');
          this.texts.push(box);
          const spans = parts.map(([t, r, cls = '', dx = 0]) => `<tspan class="t-${r} ${cls}"${dx ? ` dx="${dx}"` : ''}>${r === 'label' ? labelInner(t) : esc(t)}</tspan>`).join('');
          const attrs = `x="${r1(x)}" y="${r1(y)}" text-anchor="${anchor}"${o.owner ? ` data-owner="${o.owner}"` : ''}${o.id ? ` data-id="${o.id}"` : ''}${o.data ?? ''}`;
          this.add(o.layer ?? 'text', `<text class="${o.textCls ?? ''}" ${attrs}>${spans}</text>`);
          return box;
        }
        mark(box, owner = '') {
          this.marks.push({ ...box, owner });
        }
        hit(kind, x, y, w, h, extra = {}) {
          this.hits.push({ kind, x, y, w, h, ...extra });
          this.mark({ x0: x, x1: x + w, y0: y, y1: y + h }, extra.owner ?? kind);
        }
        region(id, box) {
          (this.regions[id] ??= []).push(box);
        }
        free(box, ignoreOwner = '', margin = 2, mx = margin) {
          const b = { x0: box.x0 - mx, x1: box.x1 + mx, y0: box.y0 - margin, y1: box.y1 + margin };
          const hit = (o) => !(o.x1 <= b.x0 || o.x0 >= b.x1 || o.y1 <= b.y0 || o.y0 >= b.y1);
          const mine = (o) => ignoreOwner && o.owner && o.owner.split(' ').some((t) => ignoreOwner.split(' ').includes(t));
          if (this.texts.some((t) => hit(t) && !mine(t))) return false;
          if (this.marks.some((m) => hit(m) && !mine(m))) return false;
          return b.x0 >= 2 && b.x1 <= this.W - 2;
        }
        svg(H, label) {
          const L = this.layers;
          return `<svg class="draw" width="${this.W}" height="${H}" viewBox="0 0 ${this.W} ${H}" role="img" aria-label="${esc(label)}">
<defs>
<pattern id="lost" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" class="hatch-fill"/><line class="hatch-line" x1="0" y1="0" x2="0" y2="5"/></pattern>
</defs>
<g>${L.back.join('')}</g><g>${L.grid.join('')}</g><g>${L.marks.join('')}</g><g>${L.dots.join('')}</g><g>${L.text.join('')}</g><g>${L.top.join('')}</g></svg>`;
        }
      }
      const rect = (cls, x, y, w, h, extra = '') => `<rect class="${cls}" x="${r1(x)}" y="${r1(y)}" width="${r1(Math.max(0, w))}" height="${r1(Math.max(0, h))}"${extra}/>`;
      const line = (cls, x1, y1, x2, y2, extra = '') => `<line class="${cls}" x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}"${extra}/>`;

      // ---------- What an open question hides, on every surface: one map (prevention 1). Each region is named in the
      // question's own `hide` list. `replicasDrop` (E1) and `delayedOutcome` (E5) hide what replicas can bring back
      // after a drop: their words and numbers while the question asks and while its answer plays, and the marks that
      // would draw the answer (the drop landing on them, their recovery points, their bars) while it asks; the
      // answer's play then draws those marks at their moments. `pitrTime` (E2) hides point-in-time recovery's time to
      // serve; `pitrAfter` (E3) both its numbers at the act's setting while the answer plays; `rtoAfter` (E4) every
      // plan's time to serve there. No ghost of an earlier setting shows while a question is open.
      function hiding(view) {
        const h = new Set(view.hide ?? []);
        const asking = view.phase === 'asking';
        const playing = view.phase === 'playing';
        const open = asking || playing;
        const map = {
          standbyWords: h.has('replicasDrop') && open,
          standbyMarks: h.has('replicasDrop') && asking,
          delayedWords: (h.has('replicasDrop') || h.has('delayedOutcome')) && open,
          delayedMarks: (h.has('replicasDrop') || h.has('delayedOutcome')) && asking,
          pitrRto: (h.has('pitrTime') && open) || ((h.has('pitrAfter') || h.has('rtoAfter')) && playing),
          pitrRpo: h.has('pitrAfter') && playing,
          pitrRtoMarks: h.has('pitrTime') && asking,
          allRto: h.has('rtoAfter') && playing,
          // A hidden bar's dashed box spans the whole axis, never the hidden time.
          boxFull: true,
          ghost: open,
          locked: open,
        };
        for (const flag of view.leak ?? []) map[flag] = false;
        return map;
      }
      const NOTHING_HIDDEN = hiding({ phase: 'rest' });
      const rtoHidden = (hid, p) => hid.allRto || (p === 'pitr' && hid.pitrRto) || (p === 'standby' && hid.standbyWords) || (p === 'delayed' && hid.delayedWords);
      const rpoHidden = (hid, p) => (p === 'pitr' && hid.pitrRpo) || (p === 'standby' && hid.standbyWords) || (p === 'delayed' && hid.delayedWords);
      const marksHidden = (hid, p) => (p === 'standby' && hid.standbyMarks) || (p === 'delayed' && hid.delayedMarks);
      const anyTimeHidden = (hid) => M.PLANS.some((p) => rtoHidden(hid, p));

      // ---------- The words: plan names, what each plan loses and when it serves, its note and its ledger.
      const NAMES = {
        primary: () => ['Primary'],
        full: () => ['Full backups', 'Full backups'],
        pitr: () => ['Point-in-time recovery', 'Point-in-time'],
        standby: (s) => (s.sync ? ['Standby, synchronous', 'Sync standby', 'Standby'] : ['Standby, asynchronous', 'Async standby', 'Standby']),
        delayed: () => [`Delayed replica, ${span(M.DELAY_H * 3600)} behind`, 'Delayed replica'],
      };
      const lossWords = (p) => (!p.recovers ? 'cannot bring it back' : p.rpoS === 0 ? 'loses nothing' : `loses ${span(p.rpoS)}`);
      const serveWords = (p) => (!p.recovers ? 'never' : `back in ${rtoSpan(p.rtoMin)}`);
      function aNote(key, m, hid) {
        const s = m.settings;
        const drop = s.disaster === DROP;
        const lag = span(M.LAG_S);
        switch (key) {
          case 'primary':
            return [drop ? 'takes writes all day; a table is dropped at the worst moment' : 'takes writes all day; its disks fail at the worst moment', drop ? 'a table is dropped at the worst moment' : 'its disks fail at the worst moment'];
          case 'full':
            return [`a full copy every ${span(s.base * 3600)}, in another account`, `a full copy every ${span(s.base * 3600)}`];
          case 'pitr':
            return [`the base backup, then the log archived every ${span(s.archive)}`, `base backup, log every ${span(s.archive)}`];
          case 'standby': {
            if (drop && !hid.standbyWords) return s.sync ? ['applies every change with the primary: the drop too', 'applies the drop too'] : [`applies every change ${lag} after the primary: the drop too`, 'applies the drop too'];
            return s.sync ? ['the primary waits for it on every commit', 'confirms every commit'] : [`applies every change ${lag} after the primary`, `${lag} behind the primary`];
          }
          case 'delayed': {
            if (drop && !hid.delayedWords) return [`the drop waits in its log for ${span(M.DELAY_H * 3600)} before it applies`, `the drop waits ${span(M.DELAY_H * 3600)} in its log`];
            return [`receives the log ${lag} after the primary, applies it ${span(M.DELAY_H * 3600)} later`, `log in ${lag}, applied ${span(M.DELAY_H * 3600)} later`];
          }
        }
      }
      function bLedger(key, m) {
        const s = m.settings;
        const p = m.plans[key];
        const drop = s.disaster === DROP;
        const to = drop ? ' to just before the drop' : '';
        switch (key) {
          case 'full':
            return `restore ${fSize(s.size)} at ${fSpeed(s.restore)}: ${fMin(m.restoreMin)}`;
          case 'pitr':
            return `restore: ${fMin(m.restoreMin)}; replay ${span(s.base * 3600)} of log${to} at ${fTimes(s.replay)}: ${fMin(m.replayMin)}; ${fMin(p.rtoMin)} in all`;
          case 'standby':
            return p.recovers ? `promote it: ${fMin(M.PROMOTE_MIN)}` : 'it has applied the drop too: no copy without it';
          case 'delayed':
            return `replay its ${span(M.DELAY_H * 3600)} of log${to} at ${fTimes(s.replay)}: ${fMin(m.delayedReplayMin)}; promote it: ${fMin(M.PROMOTE_MIN)}`;
        }
      }
      const HIDDEN_TIME = 'Its time to serve again shows after your answer.';
      const HIDDEN_OUTCOME = 'What it can bring back shows after your answer.';
      const workload = (s) =>
        s.disaster === DROP
          ? `A ${fSize(s.size)} database takes writes all day. At the worst moment, just before the next full backup, someone drops a table.`
          : `A ${fSize(s.size)} database takes writes all day. Its disks fail at the worst moment: just before the next full backup and the next log archive.`;
      const REST_STEP = 'Each plan is judged by two numbers: the writes it loses (RPO) and the time until it serves again (RTO).';

      // ---------- The play: one clock (0 to 1). A mark shows once the clock has reached its moment, so nothing is
      // drawn for an event before it happens (prevention 6). The history sweeps the day before the disaster, right to
      // left in age (left to right on the stage), the disaster strikes, each plan's recovery point lands, then the
      // recovery clock runs on the after axis until the last plan serves.
      const PLAN = { historyEnd: 0.2, strike: 0.24, points: [0.3, 0.33, 0.36, 0.39], recoverStart: 0.44, recoverEnd: 0.96 };
      const SECONDS = 7.5;
      function stepOf(m, frac, hid) {
        const s = m.settings;
        if (frac === null) return REST_STEP;
        if (frac < PLAN.historyEnd) return 'The day before: full backups, the archived log and both replicas copy every write.';
        if (frac < PLAN.points[0]) return s.disaster === DROP ? 'A table is dropped, and every copy that applies the change loses it too.' : 'The disks fail: everything on the primary is gone.';
        if (frac < PLAN.recoverStart) return "Each plan's recovery point: the newest moment it can bring back.";
        const at = recoverMinAt(m, frac);
        if (frac < PLAN.recoverEnd) return anyTimeHidden(hid) ? 'Recovering, on the clock after the disaster.' : `Recovering: ${rtoSpan(Math.round(at))} after the disaster.`;
        if (anyTimeHidden(hid)) return 'The recovery is over.';
        const last = M.PLANS.filter((p) => m.plans[p].recovers).reduce((a, p) => (m.plans[p].rtoMin > m.plans[a].rtoMin ? p : a), 'standby' in m.plans && m.plans.standby.recovers ? 'standby' : 'delayed');
        return `${NAMES[last](s)[0].split(',')[0]} serves last, ${rtoSpan(m.plans[last].rtoMin)} after the disaster.`;
      }
      /** Minutes after the disaster that the playhead stands at: x-uniform across the after axis, up to the last plan. */
      function recoverX(frac, bx0, bx1, m) {
        const end = M.afterX(m.lastRtoMin, bx0, bx1);
        const f = Math.min(1, Math.max(0, (frac - PLAN.recoverStart) / (PLAN.recoverEnd - PLAN.recoverStart)));
        return bx0 + f * (end - bx0);
      }
      function recoverMinAt(m, frac) {
        const x = recoverX(frac, 0, 1000, m);
        return x <= M.zoomShare * 1000 ? (x / (M.zoomShare * 1000)) * 60 : 60 + ((x - M.zoomShare * 1000) / (1000 - M.zoomShare * 1000)) * 23 * 60;
      }

      // ---------- The sentences off the stage.
      function story(m, hid = NOTHING_HIDDEN) {
        const s = m.settings;
        const P = m.plans;
        const out = [];
        const drop = s.disaster === DROP;
        out.push(drop ? `A table is dropped just before the next full backup of this ${fSize(s.size)} database.` : `The disks of this ${fSize(s.size)} database fail just before the next full backup and the next log archive.`);
        out.push(`Full backups lose up to ${span(P.full.rpoS)} of writes and serve again in ${rtoSpan(P.full.rtoMin)}, restoring ${fSize(s.size)} at ${fSpeed(s.restore)}.`);
        const pitrLoss = hid.pitrRpo ? 'loses what its last archive missed' : drop ? 'replays to just before the drop and loses nothing' : `loses up to ${span(P.pitr.rpoS)}, the log not yet archived`;
        out.push(hid.pitrRto ? `Point-in-time recovery ${pitrLoss}; it restores the same base backup, then replays the log since it.` : `Point-in-time recovery ${pitrLoss}; it restores the same base backup, then replays ${span(s.base * 3600)} of log at ${fTimes(s.replay)}, and serves in ${rtoSpan(P.pitr.rtoMin)}.`);
        if (hid.standbyWords) out.push('What the standby can bring back shows after your answer.');
        else if (!P.standby.recovers) out.push(`The standby applies the drop ${s.sync ? 'with the primary' : `${span(M.LAG_S)} after it`} and cannot bring the table back.`);
        else out.push(hid.allRto ? `The standby loses ${P.standby.rpoS ? span(P.standby.rpoS) : 'nothing'} and is promoted.` : `The standby loses ${P.standby.rpoS ? `its ${span(P.standby.rpoS)} of lag` : 'nothing'} and is promoted in ${fMin(M.PROMOTE_MIN)}.`);
        if (hid.delayedWords) out.push('What the delayed replica can bring back shows after your answer.');
        else if (drop) out.push(hid.allRto ? `The delayed replica holds the drop in its log for ${span(M.DELAY_H * 3600)}: stopped in time, it loses nothing.` : `The delayed replica holds the drop in its log for ${span(M.DELAY_H * 3600)}: stopped in time, it loses nothing and serves in ${rtoSpan(P.delayed.rtoMin)}.`);
        else out.push(hid.allRto ? `The delayed replica loses the same ${span(P.delayed.rpoS)} once it has applied the hour it holds.` : `The delayed replica loses the same ${span(P.delayed.rpoS)} and serves in ${rtoSpan(P.delayed.rtoMin)}, once it has applied the hour it holds.`);
        return out.join(' ');
      }
      function settingSentence(m, hid = NOTHING_HIDDEN) {
        const s = m.settings;
        const P = m.plans;
        // "Full backups" is plural: its verbs agree.
        const one = (key, name, many = false) => {
          const p = P[key];
          if (!p.recovers) return `${name} cannot bring the table back`;

        }
        if (hide.has('rtoAfter') && playing) for (const k of M.PLANS) if (!/\?/.test(tx(`b-${k}-value`) ?? '?') || /\d/.test(tx(`b-${k}-ledger`) ?? '')) out.push(`${k}'s new time shown while the answer plays`);
        if (/\d/.test(tx('step') ?? '') && (hide.has('pitrTime') || hide.has('rtoAfter') || hide.has('pitrAfter') || hide.has('replicasDrop') || hide.has('delayedOutcome'))) out.push(`the step counts: "${tx('step')}"`);
        return out;
      }
      function giveaways(well, spec, phase, extraText = '') {
        const text = stageText(well) + ' | ' + extraText;
        const g = GIVEAWAYS[spec.id] ?? {};
        const out = [];
        for (const w of [...(g.both ?? []), ...(g[phase] ?? []), ...FALSE_CLAIMS]) if (typeof w === 'string' ? text.includes(w) : w.test(text)) out.push(`"${w}"${typeof w === 'string' ? '' : ` in "${text.match(w)[0]}"`}`);
        return out;
      }
      const FROMS = [...M.EXPERIMENTS.filter((e) => e.act?.set).map(actSettings), { ...B, ...M.CHALLENGE_SOLUTION }, { ...B, disaster: DROP, sync: 1 }, { ...B, size: 500, base: 1, archive: 300 }];
      function probe(well, W, spec, phase, view) {
        const m = M.run(view.s);
        drawInto(well, W, m, view);
        const hid = hiding(view);
        const notice = noticeOf(m, view);
        const words = [notice, summary(m, hid), noteOf(view), view.phase === 'playing' ? stepOf(m, view.play.frac, hid) : ''].join(' | ');
        return [...giveaways(well, spec, phase, words), ...structural(well, spec, phase, view), ...(notice ? [] : ['the notice is blank'])];
      }
      window.noAnswer = function (widths) {
        const well = document.getElementById('well');
        const out = [];
        let renders = 0;
        for (const W of widths) {
          well.style.width = W + 2 + 'px';
          for (const spec of M.EXPERIMENTS.filter((e) => !e.goal)) {
            const runs = [...[null, ...FROMS].map((f) => ['asking', null, f]), ...[0, 0.22, 0.35, 0.6, 0.8, 0.97, 1].map((f) => ['playing', f, null])];
            for (const [phase, frac, from] of runs) {
              const view = expView(spec, phase, frac ?? 0.6, from);
              renders++;
              const where = `W${W} ${spec.id} ${phase}${frac !== null ? ` ${frac}` : ''}${from ? ` from ${show(from)}` : ''}`;
              for (const g of probe(well, W, spec, phase, view)) out.push(`${where}: ${g}`);
            }
          }
        }
        well.style.width = '';
        return { renders, out };
      };
      // Plants a leak on each flag of the hiding map, on copies of the views, to prove the sweep catches every one.
      window.plantedLeaks = function (W) {
        const well = document.getElementById('well');
        well.style.width = W + 2 + 'px';
        const caught = {};
        const tryLeak = (name, id, phase, flags, frac = 1, from = null) => {
          const spec = M.EXPERIMENTS.find((e) => e.id === id);
          const clean = probe(well, W, spec, phase, expView(spec, phase, frac, from));
          const dirty = probe(well, W, spec, phase, { ...expView(spec, phase, frac, from), leak: flags });
          caught[name] = clean.length === 0 && dirty.length > 0 ? 'caught' : `MISSED (clean ${clean.length}: ${clean[0] ?? ''})`;
        };
        tryLeak("E1 asked, the standby's words shown", 'replica-drop', 'asking', ['standbyWords']);
        tryLeak("E1 asked, the standby's outcome drawn", 'replica-drop', 'asking', ['standbyMarks']);
        tryLeak("E1 played, the standby's words shown", 'replica-drop', 'playing', ['standbyWords']);
        tryLeak("E1 asked, the delayed replica's words shown", 'replica-drop', 'asking', ['delayedWords']);
        tryLeak("E1 asked, the delayed replica's outcome drawn", 'replica-drop', 'asking', ['delayedMarks']);
        tryLeak("E2 asked, PITR's time shown", 'pitr-time', 'asking', ['pitrRto']);
        tryLeak("E2 asked, PITR's bar drawn", 'pitr-time', 'asking', ['pitrRtoMarks']);
        tryLeak("E2 played, PITR's time shown", 'pitr-time', 'playing', ['pitrRto']);
        tryLeak('E2 asked, the hidden box sized by the hidden time', 'pitr-time', 'asking', ['boxFull']);
        tryLeak("E3 played, PITR's new loss shown", 'archive', 'playing', ['pitrRpo']);
        tryLeak("E3 played, PITR's new time shown", 'archive', 'playing', ['pitrRto']);
        tryLeak('E4 played, the new times shown', 'growth', 'playing', ['allRto', 'pitrRto']);
        tryLeak("E5 asked, the delayed replica's words shown", 'delayed', 'asking', ['delayedWords']);
        tryLeak("E5 played, the delayed replica's words shown", 'delayed', 'playing', ['delayedWords']);
        tryLeak("E5 asked, the delayed replica's outcome drawn", 'delayed', 'asking', ['delayedMarks']);
        tryLeak('E3 asked with the ghost of the setting before it', 'archive', 'asking', ['ghost'], 1, { ...B, size: 10000 });
        tryLeak("E1 asked, the settings live and the model's note shown", 'replica-drop', 'asking', ['locked']);
        tryLeak('E4 played, the step counting the clock', 'growth', 'playing', ['allRto', 'pitrRto'], 0.6);
        well.style.width = '';
        return caught;
      };
      // The stage a learner sees on load (the default, at rest) never prints an answer.
      const ASKED = () => [
        'cannot bring it back',
        `back in ${M.formatSlot(M.EXPERIMENTS[1].slots().answer)}`,
        `loses ${M.formatSlot(M.EXPERIMENTS[2].slots().rpoAfter)}`,
        `back in ${M.formatSlot(M.EXPERIMENTS[3].slots().fullAfter)}`,
        `back in ${M.formatSlot(M.EXPERIMENTS[3].slots().pitrAfter)}`,
        `back in ${M.formatSlot(M.EXPERIMENTS[4].slots().answer)}`,
        'the drop too',
      ];
      window.restLeaks = function (widths) {
        const well = document.getElementById('well');
        const out = [];
        const asked = ASKED();
        for (const W of widths) {
          well.style.width = W + 2 + 'px';
          const m = M.run(B);
          const view = restView(B);
          drawInto(well, W, m, view);
          const text = [stageText(well), summary(m, NOTHING_HIDDEN), noteOf(view), noticeOf(m, view)].join(' | ');
          for (const a of asked) if (text.includes(a)) out.push(`W${W}: "${a}" on the stage at load`);
        }
        well.style.width = '';
        return { asked, out };
      };
      window.heights = function (widths) {
        const out = {};
        for (const W of widths) {
          const hs = new Set();
          for (const s of ALL) hs.add(buildStage(W, M.run(s), restView(s)).H);
          for (const s of ALL.filter((_, i) => i % 17 === 0)) hs.add(buildStage(W, M.run(s), restView(s, { play: { frac: 0.5 } })).H);
          for (const spec of M.EXPERIMENTS)
            for (const phase of spec.goal ? ['challenge', 'start'] : ['asking', 'playing', 'revealed']) {
              const v = expView(spec, phase);
              hs.add(buildStage(W, M.run(v.s), v).H);
            }
          out[W] = [...hs];
        }
        return out;
      };
      window.widgetHeight = () => document.getElementById('widget').getBoundingClientRect().height;
      // Every sentence any setting prints off the stage, for the false-claim rules and the prose rules.
      const PROSE = [/(^|[.?!] )\d/, /\d{4,}/, /  /, / ,| \./, /\b(\w+) \1\b/, /\bbackups (loses|serves|is|has)\b/i];
      window.pageWords = function () {
        const out = [];
        for (const s of ALL) {
          const m = M.run(s);
          const sentences = [summary(m, NOTHING_HIDDEN), settingSentence(m), story(m), ...goalChecks(m).map((g) => g.text)];
          const tables = [true, false].map((c) => JSON.stringify(describeRows(m, c)));
          const words = [...sentences, ...tables].join(' | ');
          for (const g of FALSE_CLAIMS) if (g.test(words)) out.push(`${show(s)}: ${g} in "${words.match(g)[0]}"`);
          for (const t of [...sentences, describeRows(m, false).note]) {
            for (const g of PROSE) if (g.test(t)) out.push(`${show(s)}: ${g} in "${t.slice(Math.max(0, t.search(g) - 20), t.search(g) + 30)}"`);
            if (!/[.!?:]$/.test(t) && !/: (met|not yet)$/.test(t)) out.push(`${show(s)}: not a sentence: "${t.slice(-40)}"`);
          }
        }
        for (const g of [PROSE[0], PROSE[1]]) if (g.test(MODEL_NOTE)) out.push(`model note: ${g}`);
        return out;
      };
      window.wordsOf = (s) => {
        const m = M.run(s);
        return { summary: summary(m, NOTHING_HIDDEN), notice: settingSentence(m), story: story(m), checks: goalChecks(m).map((g) => g.text), describe: describeRows(m, false), compact: describeRows(m, true) };
      };

      const stateName = params.get('state') ?? 'default';
      Promise.all([
        document.fonts.load('600 15px "Inter Variable"'),
        document.fonts.load('600 11px "Inter Variable"'),
        document.fonts.load('500 13px "Inter Variable"'),
        document.fonts.load('600 13px "Inter Variable"'),
        document.fonts.load('700 11px "Inter Variable"'),
        document.fonts.load('600 13px "JetBrains Mono Variable"'),
      ]).then(() => {
        const first = render(stateName);
        const well = document.getElementById('well');
        const issues = check(well, first.D, first.m, first.view);
        render(stateName);
        window.__collisions = issues;
        document.body.dataset.ready = '1';
      });
    </script>
  </body>
