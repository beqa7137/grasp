              placeLabel(d.x, d.y, [`returned ${fmt(read.ms)} (+${fmt(read.repairMs).replace(' ms', '')} repair)`, `returned ${fmt(read.ms)}`, `+${fmt(read.repairMs)} repair`, fmt(read.ms)], 8, 'returned', 'good', xe + 2);
            } else if (hid.repair) placeLabel(d.x, d.y, [`${ord} answer ${fmt(read.rthMs)}`, fmt(read.rthMs)], 8, d.owner);
            else placeLabel(d.x, d.y, [`returned ${fmt(read.ms)}`, fmt(read.ms)], 8, d.owner);
          }
          nameStacks(placed, L2, ringedName);
        }
        y = axisY + 24;
        D.region('latency', { x: Math.max(3, pad - 8), y: latTop + 4, w: W - 2 * Math.max(3, pad - 8), h: y - latTop - 4 });
        const H = Math.ceil(y + 4);

        D.label = summary(m, hid);
        return { D, H };
      }

      // ---------- The stage's one-sentence description, which hides what the open question hides.
      function summary(m, hid) {
        const { n, w, r } = m.settings;
        const parts = [`${n} replicas, W ${M.levelName(w, n) ?? w}, R ${M.levelName(r, n) ?? r}.`];
        if (hid.write) parts.push("The write's outcome shows after your answer.");
        else if (hid.writeTime) parts.push("The write's time shows after your answer.");
        else if (m.write.outcome === 'acked') parts.push(`The write is acked in ${fmt(m.write.ms)} by ${nameList(m.write.acked.map((id) => m.all[id].name))}.`);
        else if (m.write.outcome === 'refused') parts.push(`The write is refused: ${m.write.live} live, ${m.write.needed} needed.`);
        else parts.push('The write times out.');
        if (hid.read) parts.push('The read runs after your answer.');
        else if (hid.verdict) parts.push('What the read returns shows after your answer.');
        else parts.push(pillOf(m, hid).text + '.');
        if (!hid.count) parts.push(`${m.staleSets} of ${m.readSets} read sets can miss v8.`);
        return parts.join(' ');
      }

      // ---------- Focus outlines with their "Look here" tag on the first free place.
      function focusOutlines(D, ids, H) {
        const TAG = { w: 72, h: 16 };
        for (const id of ids) {
          for (const b of D.regions[id] ?? []) {
            const x = Math.max(3, b.x);
            const y0 = Math.max(3, b.y);
            const w = Math.min(D.W - 3, b.x + b.w) - x;
            const h = Math.min(H - 3, b.y + b.h) - y0;
            D.add('top', `<rect class="focus-outline" x="${x}" y="${y0}" width="${w}" height="${h}" rx="10"/>`);
            // Frame edges first (16px off the corners), then just inside, then the gutter outside.
            const across = [];
            for (let ax = x + w - TAG.w - 16; ax >= x + 16; ax -= 8) across.push(ax);
            const xs = [x + w - TAG.w - 16, x + 16, ...across];
            const ys = [y0 - TAG.h / 2, y0 + h - TAG.h / 2, y0 + 4, y0 + h - TAG.h - 4, y0 - TAG.h - 2, y0 + h + 2];
            const cands = ys.flatMap((ty) => xs.map((tx) => [tx, ty]));
            for (const ty of [y0 + 4, y0 + h / 2 - TAG.h / 2]) cands.push([x + w + 4, ty], [x - TAG.w - 4, ty]);
            let placed = false;
            for (const [tx, ty] of cands) {
              {
                const box = { x0: tx, x1: tx + TAG.w, y0: ty, y1: ty + TAG.h };
                if (tx < 3 || tx + TAG.w > D.W - 3 || ty < 3 || ty + TAG.h > H - 3) continue;
                if (!D.free(box, '', 1)) continue;
                D.add('top', `<rect class="tag" x="${tx}" y="${ty}" width="${TAG.w}" height="${TAG.h}" rx="8"/>`);
                D.add('top', `<text x="${tx + TAG.w / 2}" y="${ty + 12}" text-anchor="middle" data-owner="look" data-ground="1"><tspan class="t-look">LOOK HERE</tspan></text>`);
                D.mark(box, 'look');
                placed = true;
                break;
              }
              if (placed) break;
            }
            if (!placed) D.missingTags = (D.missingTags ?? 0) + 1;
          }
        }
      }

      // ---------- Mockup states.
      const UP = (n) => Array(n).fill('up');
      const STATES = {
        default: { s: M.BASE },
        stale: { s: { ...M.BASE, w: 1, r: 1 } },
        down: { s: { ...M.BASE, states: ['up', 'up', 'down'] }, hint: 2 },
        refused: { s: { ...M.BASE, w: 3, r: 1, states: ['up', 'up', 'down'] } },
        timeout: { s: { ...M.BASE, w: 3, r: 2, states: ['up', 'up', 'mid'] } },
        sloppy: { s: { ...M.BASE, states: ['up', 'back', 'back'], sloppy: 1 } },
        standin: { s: { ...M.BASE, r: 3, states: ['up', 'up', 'down'], sloppy: 1 } },
        sloppy5: { s: { n: 5, w: 3, r: 5, states: ['up', 'up', 'down', 'down', 'up'], stall: 0, sloppy: 1 } },
        readtimeout: { s: { ...M.BASE, states: ['up', 'mid', 'mid'] } },
        nocopy: { s: { ...M.BASE, w: 3, r: 1, states: ['down', 'down', 'down'], sloppy: 1 } },
        slow: { s: { n: 5, w: 3, r: 3, states: UP(5), stall: 1, sloppy: 0 } },
        ask: { exp: 4, phase: 'asking' },
        reveal: { exp: 0, phase: 'revealed', chosen: 1 },
        challenge: { exp: 5, phase: 'challenge', s: { n: 5, w: 4, r: 2, states: UP(5), stall: 1, sloppy: 0 } },
      };
      function viewOf(name) {
        const st = STATES[name] ?? STATES.default;
        const expParam = params.get('exp');
        const expIdx = expParam !== null && st.exp !== undefined ? Number(expParam) - 1 : st.exp;
        if (expIdx === undefined) return { s: st.s, hide: [], exp: null, phase: 'rest', hint: st.hint };
        const spec = M.EXPERIMENTS[expIdx];
        const e = M.renderExperiment(spec);
        const isChallenge = !!spec.goal;
        const phase = isChallenge ? 'challenge' : st.phase;
        const s = isChallenge ? (name === 'challenge' && expParam === null ? st.s : spec.setup) : spec.setup;
        return {
          s,
          hide: phase === 'asking' ? spec.hide : [],
          exp: e,
          spec,
          phase,
          chosen: st.chosen ?? (e.answer === 0 ? 1 : 0),
          focus: phase === 'revealed' || (isChallenge && M.goalMet(spec.goal, { ...s }, M.run(s).metrics)) ? spec.focus : [],
        };
      }

      // ---------- The page around the stage.
      function controlsHtml(m, view) {
        const { n } = m.settings;
        const locked = view.phase === 'asking';
        const stallName = `R${M.stalledIndex(n) + 1} pauses`;
        return `<fieldset class="group n-control"${locked ? ' disabled' : ''}><legend class="control-label">Replicas (N)</legend><div class="segments">
${[3, 5].map((k) => `<label class="segment"><input type="radio" name="n" ${k === n ? 'checked' : ''}/><span>${k} replicas</span></label>`).join('')}</div></fieldset>
<fieldset class="group"${locked ? ' disabled' : ''}><legend class="control-label">Conditions</legend><div class="toggles">
<label class="segment"><input type="checkbox" ${m.settings.stall ? 'checked' : ''}/><span>${stallName}<small>${fmt(M.STALL_MS)} GC pause</small></span></label>
<label class="segment"><input type="checkbox" ${m.settings.sloppy ? 'checked' : ''}/><span>Sloppy quorum<small>stand-ins H1, H2</small></span></label></div></fieldset>
<p class="notice" aria-live="polite">${locked ? 'Play and the settings this question is about wait for your answer.' : 'Tap a replica to change its state; drag W and R on the drawing.'}</p>`;
      }
      const ICON_RIGHT = '<svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--g-success-line)"/><path d="M6 10.2l2.6 2.6 5.2-5.6" fill="none" stroke="var(--g-surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const ICON_WRONG = '<svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--g-danger)"/><path d="M7 7l6 6M13 7l-6 6" fill="none" stroke="var(--g-surface)" stroke-width="2" stroke-linecap="round"/></svg>';
      function dockHtml(m, view) {
        const e = view.exp;
        if (!e) return '';
        if (view.phase === 'challenge') {
          const met = M.goalMet(view.spec.goal, m.settings.stall !== undefined ? { ...view.s } : view.s, m.metrics);
          const status = M.goalStatus(m);
          const oks = [m.metrics.canMiss < 1, m.metrics.readMs < 5, m.metrics.writeMs < 50, m.survives.write >= 1];
          return `<p class="legend">${esc(e.ask)}</p><ul class="status" role="status">${status
            .map((s, i) => `<li class="${oks[i] ? 'met' : ''}"><span class="state">${oks[i] ? '✓' : '·'}</span><span>${esc(s)}</span></li>`)
            .join('')}</ul>${met ? `<p class="reveal">${esc(e.reveal)}</p>` : ''}`;
        }
        if (view.phase === 'asking') {
          return `<fieldset style="border:0;padding:0;margin:0"><legend class="legend">${esc(e.ask)}</legend><div class="options">${e.choices.map((c) => `<button class="g-choice">${esc(c)}</button>`).join('')}</div></fieldset>`;
        }
        return `<p class="legend">${esc(e.ask)}</p><ul class="options">${e.choices
          .map((c, i) => {
            const right = i === e.answer;
            const wrong = i === view.chosen && !right;
            return `<li class="g-choice${right ? ' right' : wrong ? ' wrong' : ''}"><span>${esc(c)}</span>${right ? ICON_RIGHT : wrong ? ICON_WRONG : ''}</li>`;
          })
          .join('')}</ul><p class="reveal" aria-live="polite">${esc(e.reveal)}</p>`;
      }
      function cardsHtml(view) {
        return `<h3 class="heading"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg>Experiments</h3>
<ol class="cards">${M.EXPERIMENTS.map(
          (s, i) =>
            `<li><button class="card-btn"${view.exp && view.exp.id === s.id ? ' aria-current="step"' : ''}><span class="num">${s.goal ? '⚑' : i + 1}</span><span>${esc(M.fillTemplate(s.title, {}))}</span></button></li>`,
        ).join('')}</ol>`;
      }
      function describeHtml(m, open, compact) {
        const btn = `<button class="g-btn" aria-expanded="${open}">${open ? 'Hide the description' : 'Describe'}</button>`;
        if (!open) return btn;
        const head = compact ? ['Rep.', 'State', 'Write rtt', 'Has v8 at', 'Read at', 'Got'] : ['Replica', 'State', 'Write round trip', 'Has v8 at', 'Read reaches it', 'Answered'];
        const rows = m.all.map((x) => {
          const a = m.read.answers.find((q) => q.id === x.id);
          const has = m.write.applied.includes(x.id) ? fmt(x.landAt) : '–';
          const name = compact ? x.name : `${x.name} (DC ${x.dc})`;
          const forR = `R${x.standsFor + 1}`;
          const state = !x.home ? (compact ? `for ${forR}` : `stand-in for ${forR}`) : compact ? { up: 'up', down: 'down', mid: 'stopped', back: 'back' }[x.state] : M.STATE_NAMES[x.state];
          const value = a ? (a.value === null ? 'no copy' : `v${a.value}`) : '';
          const answered = a ? `${value}${m.read.repairs.includes(x.id) ? (compact ? ', fixed' : ', repaired') : ''}` : '–';
          return [name, state, x.knownDown ? '–' : fmt(x.writeRtt), has, a ? fmt(a.readAt) : '–', answered];
        });
        return `${btn}<div class="table-box${compact ? ' compact' : ''}" tabindex="0" role="region" aria-label="Each replica in this scenario"><table><thead><tr>${head.map((h) => `<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows
          .map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`)
          .join('')}</tbody></table></div>`;
      }

      // Play waits while a question asks: the answer's own play is the first play. The cards are one toolbar (a single
      // Tab stop; arrows, Home and End move).
      function overlaysHtml(D, view, W) {
        const asking = view.phase === 'asking';
        const play = D.hits
          .filter((h) => h.kind === 'play')
          .map(
            (h) =>
              `<button class="play hit" data-owner="play" style="left:${h.x}px;top:${h.y}px" aria-label="${asking ? 'Play the write, then the read, after your answer' : 'Play the write, then the read'}"${asking ? ' disabled' : ''}><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16"/><path d="M14 11v14l11-7z"/></svg></button>`,
          );
        const cards = D.hits
          .filter((h) => h.kind === 'card')
          .map(
            (h, i) =>
              `<button class="card-hit hit" data-owner="${h.owner}" tabindex="${i === 0 ? 0 : -1}"${asking ? ' aria-disabled="true"' : ''} style="left:${h.x}px;top:${h.y}px;width:${h.w}px;height:${h.h}px" aria-label="${esc(h.label)}"></button>`,
          );
        const handles = D.hits
          .filter((h) => h.kind === 'handle')
          .map((h) => `<div class="handle hit" role="slider" tabindex="0" data-owner="${h.owner}" aria-label="${esc(h.label)}" style="left:${h.x}px;top:${h.y}px"><span class="knob"></span></div>`);
        return `${play.join('')}<div class="replicas" role="toolbar" aria-label="Replicas">${cards.join('')}</div>${handles.join('')}`;
      }

      function render(name) {
        const view = viewOf(name);
        const m = M.run(view.s);
        const root = document.getElementById('widget');
        const wideCols = window.innerWidth >= 1000;
        root.innerHTML = `<div class="controls">${controlsHtml(m, view)}</div>
<div class="main"><div class="stage" role="group" aria-roledescription="visualization" aria-label="Consistency and quorums: one write, then one read"><div class="well" id="well"></div></div>
<div class="describe">${describeHtml(m, params.get('describe') === '1', window.innerWidth < 560)}</div></div>
<div class="experiments"><section class="dock" aria-label="Experiment">${dockHtml(m, view)}</section>${cardsHtml(view)}</div>`;
        const well = document.getElementById('well');
        const W = well.clientWidth;
        const { D, H } = buildStage(W, m, view);
        if (view.focus?.length) focusOutlines(D, view.focus, H);
        well.style.height = H + 'px';
        well.innerHTML = D.svg(H) + overlaysHtml(D, view, W);
        if (view.hint !== undefined) {
          const h = D.hits.find((x) => x.owner === `R${view.hint + 1}`);
          const st = m.replicas[view.hint].state;
          const tip = document.createElement('div');
          tip.className = 'hint';
          tip.dataset.transient = '1';
          tip.textContent = `${W >= 520 ? 'Enter' : 'Tap'}: ${NEXT_PHRASE[NEXT[st]].replace('it', `R${view.hint + 1}`)}`;
          well.appendChild(tip);
          const tw0 = tip.offsetWidth;
          const th = tip.offsetHeight;
          const left = Math.max(4, Math.min(W - tw0 - 4, h.x + h.w / 2 - tw0 / 2));
          const covers = (top) => D.texts.some((t) => !(t.x1 <= left || t.x0 >= left + tw0 || t.y1 <= top || t.y0 >= top + th));
          const above = h.y - th - 26;
          tip.style.left = left + 'px';
          tip.style.top = (covers(above) ? h.y + h.h + 26 : above) + 'px';
          well.querySelector(`.card-hit[data-owner="R${view.hint + 1}"]`).style.outline = 'var(--g-focus-ring)';
          well.querySelector(`.card-hit[data-owner="R${view.hint + 1}"]`).style.outlineOffset = '3px';
        }
        window.__stage = { W, H, missingTags: D.missingTags ?? 0, summary: D.label };
        return { W, H };
      }

      // ---------- Collisions, measured from the rendered DOM: text on text, lines and marks through text, off-stage,
      // and hit boxes on hit boxes.
      function collisions(well) {
        const svg = well.querySelector('svg.draw');
        const W = Number(svg.getAttribute('width'));
        const H = Number(svg.getAttribute('height'));
        const owners = (el) => (el.dataset?.owner ?? el.getAttribute?.('data-owner') ?? '').split(' ').filter(Boolean);
        const share = (a, b) => a.some((t) => b.includes(t));
        const texts = [...svg.querySelectorAll('text')].map((t) => {
          const b = t.getBBox();
          return { s: t.textContent, owner: owners(t), ground: t.hasAttribute('data-ground'), x0: b.x + 0.5, x1: b.x + b.width - 0.5, y0: b.y + b.height * 0.2, y1: b.y + b.height * 0.95 };
        });
        const out = [];
        const ov = (a, b, m = 0) => Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0) > m && Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0) > m;
        for (let i = 0; i < texts.length; i++) {
          const a = texts[i];
          if (a.x0 < -0.5 || a.x1 > W + 0.5 || a.y0 < 0 || a.y1 > H) out.push(`off-stage: "${a.s}"`);
          for (let j = i + 1; j < texts.length; j++) if (ov(a, texts[j], 0.5)) out.push(`text on text: "${a.s}" / "${texts[j].s}"`);
        }
        const inside = (p, t) => p.x > t.x0 + 0.5 && p.x < t.x1 - 0.5 && p.y > t.y0 + 0.5 && p.y < t.y1 - 0.5;
        for (const el of svg.querySelectorAll('.link, .gridline, .lane, .axis, .rule')) {
          const grid = !el.classList.contains('link');
          const o = owners(el);
          const pts = [];
          if (el.tagName === 'line') {
            const [x1, y1, x2, y2] = ['x1', 'y1', 'x2', 'y2'].map((a) => Number(el.getAttribute(a)));
            for (const [x, y] of sampleLine(x1, y1, x2, y2, 2)) pts.push({ x, y });
          } else {
            const len = el.getTotalLength();
            for (let d = 0; d <= len; d += 2) pts.push(el.getPointAtLength(d));
          }
          for (const t of texts) {
            if (grid && t.ground) continue;
            if (pts.some((p) => inside(p, t))) out.push(`${grid ? 'grid' : 'line'} through "${t.s}"`);
          }
          if (!grid)
            for (const mk of svg.querySelectorAll('[data-mark]')) {
              if (share(o, owners(mk))) continue;
              const b = mk.getBBox();
              if (pts.some((p) => p.x > b.x + 1 && p.x < b.x + b.width - 1 && p.y > b.y + 1 && p.y < b.y + b.height - 1)) out.push(`line through mark ${mk.getAttribute('data-mark')}`);
            }
        }
        for (const mk of svg.querySelectorAll('[data-mark]')) {
          const b = mk.getBBox();
          const box = { x0: b.x, x1: b.x + b.width, y0: b.y, y1: b.y + b.height };
          for (const t of texts) if (!share(t.owner, owners(mk)) && ov(box, t, 0.5)) out.push(`text on mark ${mk.getAttribute('data-mark')}: "${t.s}"`);
        }
        // Dots on dots, dots without a name, chips closer than 3 px, and glyphs on chips.
        const dots = [...svg.querySelectorAll('circle.dot')].map((c) => ({ name: c.dataset.dot, x: Number(c.getAttribute('cx')), y: Number(c.getAttribute('cy')), r: Number(c.getAttribute('r')) }));
        for (let i = 0; i < dots.length; i++)
          for (let j = i + 1; j < dots.length; j++)
            if (Math.hypot(dots[i].x - dots[j].x, dots[i].y - dots[j].y) < dots[i].r + dots[j].r) out.push(`dot on dot: ${dots[i].name} / ${dots[j].name}`);
        const named = new Set([...svg.querySelectorAll('text[data-names]')].flatMap((t) => t.dataset.names.split(' ')));
        for (const d of dots) if (!named.has(d.name)) out.push(`dot without a name: ${d.name}`);
        const box = (el) => {
          const b = el.getBBox();
          return { x0: b.x, x1: b.x + b.width, y0: b.y, y1: b.y + b.height };
        };
        const chips = [...svg.querySelectorAll('rect.chip')].map(box);
        for (let i = 0; i < chips.length; i++)
          for (let j = i + 1; j < chips.length; j++) {
            const [a, b] = [chips[i], chips[j]];
            const yOverlap = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0) > 1;
            const gapX = Math.max(a.x0, b.x0) - Math.min(a.x1, b.x1);
            if (yOverlap && gapX < 3) out.push(`chips ${gapX < 0 ? 'overlap' : `${r1(gapX)} px apart`} at y ${r1(a.y0)}`);
          }
        for (const g of svg.querySelectorAll('.pause, .repair-glyph')) {
          const gb = box(g);
          if (chips.some((c) => ov(gb, c, 0))) out.push(`glyph on a chip at x ${r1(gb.x0)}`);
        }
        const wb = well.getBoundingClientRect();
        const hits = [...well.querySelectorAll('.hit')].map((h) => {
          const b = h.getBoundingClientRect();
          return { o: h.dataset.owner, x0: b.left - wb.left - 1, x1: b.right - wb.left - 1, y0: b.top - wb.top - 1, y1: b.bottom - wb.top - 1 };
        });
        for (let i = 0; i < hits.length; i++) {
          const a = hits[i];
          if (a.x0 < -0.5 || a.x1 > W + 0.5 || a.y0 < -0.5 || a.y1 > H + 0.5) out.push(`hit box off-stage: ${a.o}`);
          for (let j = i + 1; j < hits.length; j++) if (ov(a, hits[j], 0)) out.push(`hit on hit: ${a.o} / ${hits[j].o}`);
        }
        return out;
      }

      // Marks for the checker: rendered rects and circles that carry text owners get a data-mark from the layout's list.
      function tagMarks(well, D) {
        const svg = well.querySelector('svg.draw');
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('opacity', '0');
        for (const mk of D.marks) {
          const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          r.setAttribute('x', mk.x0);
          r.setAttribute('y', mk.y0);
          r.setAttribute('width', Math.max(0.1, mk.x1 - mk.x0));
          r.setAttribute('height', Math.max(0.1, mk.y1 - mk.y0));
          r.setAttribute('data-mark', mk.owner || 'mark');
          r.setAttribute('data-owner', mk.owner || 'mark');
          g.appendChild(r);
        }
        svg.appendChild(g);
      }

      // Owners for rendered links, taken from the layout's list in order.
      function ownLinks(well, D) {
        const els = [...well.querySelectorAll('svg.draw .link')];
        const owned = D.links.slice();
        els.forEach((el) => {
          if (el.classList.contains('legend-line')) return;
          const l = owned.shift();
          if (l) el.setAttribute('data-owner', l.owner);
        });
      }

      function renderChecked(name) {
        const view = viewOf(name);
        const m = M.run(view.s);
        render(name);
        const well = document.getElementById('well');
        const { D } = buildStage(well.clientWidth, m, view);
        if (view.focus?.length) focusOutlines(D, view.focus, window.__stage.H);
        tagMarks(well, D);
        ownLinks(well, D);
        const out = [...collisions(well), ...unplaced(D)];
        well.querySelectorAll('[data-mark]').forEach((e) => e.parentNode.remove());
        return out;
      }

      const unplaced = (D) => [...(D.missingTags ? [`${D.missingTags} focus tag(s) without a place`] : []), ...(D.missingNames ?? []).map((t) => `no room for "${t}"`)];

      // A sweep over settings and widths, drawing only the stage, for the layout's own check.
      window.sweep = function (widths, settingsList) {
        const well = document.getElementById('well');
        const results = { renders: 0, failures: [] };
        for (const W of widths) {
          well.style.width = W + 2 + 'px';
          for (const s of settingsList) {
            const m = M.run(s);
            for (const view of [{ hide: [], phase: 'rest' }]) {
              const { D, H } = buildStage(W, m, view);
              well.style.height = H + 'px';
              well.innerHTML = D.svg(H) + overlaysHtml(D, view, W);
              tagMarks(well, D);
              ownLinks(well, D);
              const out = [...collisions(well), ...unplaced(D)];
              results.renders++;
              if (out.length) results.failures.push({ W, s: `N${s.n} W${s.w} R${s.r} ${s.states.join('/')} stall${s.stall} sloppy${s.sloppy}`, out: out.slice(0, 4) });
            }
          }
        }
        well.style.width = '';
        return results;
      };
      window.sweepExperiments = function (widths) {
        const well = document.getElementById('well');
        const results = { renders: 0, failures: [] };
        for (const W of widths) {
          well.style.width = W + 2 + 'px';
          M.EXPERIMENTS.forEach((spec, k) => {
            for (const phase of ['asking', 'revealed']) {
              const s = spec.goal ? { ...spec.setup, ...spec.solution, states: UP(spec.solution.n) } : spec.setup;
              const m = M.run(s);
              const view = { hide: phase === 'asking' ? spec.hide : [], phase, focus: phase === 'revealed' ? spec.focus : [] };
              const { D, H } = buildStage(W, m, view);
              if (view.focus.length) focusOutlines(D, view.focus, H);
              well.style.height = H + 'px';
              well.innerHTML = D.svg(H) + overlaysHtml(D, view, W);
              tagMarks(well, D);
              ownLinks(well, D);
              const out = [...collisions(well), ...unplaced(D)];
              results.renders++;
              if (out.length) results.failures.push({ W, exp: k + 1, phase, out: out.slice(0, 4) });
            }
          });
        }
        well.style.width = '';
        return results;
      };
      // While a question asks, no rendered text or accessible name may hold its answer or a false claim (known.md bug 1).
      const GIVEAWAYS = {
        'r-plus-w-equals-n': ['1 of 10', 'share no replica', 'can miss all', 'at 2 ms'],
        'all-one-down': ['refused', 'timed out', 'Nothing was written', 'not sent', 'none written', 'live, 3 needed', '97.03', '99.9999'],
        stall: ['acked in 40', 'acked 40', 'returned 40', 'fresh', 'sent at 40', 'by R1 and R3', 'R1 and R3'],
        'missed-write': ['repaired', 'repair', '6 ms', 'fixed'],
        sloppy: ['1 of 3', 'returns v7', 'stale', 'can miss it', 'only 1 home', 'R2 v7', 'R3 v7'],
      };
      const FALSE_CLAIMS = ['meet any', 'can fit in N without sharing', 'write is sent', 'never asks'];
      const BY_REGION = {
        verdict: ['returns v', 'fresh', 'stale', 'both acked'],
        repair: ['repair', 'fixed', 'v8 at'],
        write: ['acked in', 'refused', 'timed out', 'sent at'],
        'write-time': ['acked in 4', 'acked 4', 'sent at'],
        read: ['sent at', 'returned'],
      };
      // The structural giveaways no word list catches, for one question asking in the rendered well.
      function hiddenMarks(well, spec, m) {
        const out = [];
        const hide = new Set(spec.hide);
        const svg = well.querySelector('svg.draw');
        const summaryText = svg.getAttribute('aria-label');
        if (!well.querySelector('.play')?.disabled) out.push('Play is enabled while asking');
        if (hide.has('write') || hide.has('write-time')) {
          const styles = new Set([...svg.querySelectorAll('.link[data-write]')].map((l) => l.getAttribute('class')));
          if (styles.size > 1) out.push(`write lines in ${styles.size} styles`);
          if (svg.querySelector('.cell.acked')) out.push('an acked strip cell');
          for (const id of m.write.acked) if (summaryText.includes(m.all[id].name)) out.push(`the summary names ${m.all[id].name}`);
        }
        // A word like "v8 at 20 ms" or "at 20 ms" on a replica the write never reached is false.
        for (const t of svg.querySelectorAll('text[data-owner]')) {
          const id = Number((t.dataset.owner.match(/^R(\d)$/) ?? [])[1]) - 1;
          if (id >= 0 && !m.write.applied.includes(id) && /\bat \d/.test(t.textContent)) out.push(`"${t.textContent}" on R${id + 1}, which the write never reached`);
        }
        if (hide.has('read')) {
          const mark = svg.querySelector('.link.read:not(.legend-line), .link.dead, .chip.asked, [data-answer], .dot.read');
          if (mark) out.push(`a read mark while the read waits: ${mark.getAttribute('class')}`);
          if ([...svg.querySelectorAll('.this-ring')].length) out.push('a this-read ring while the read waits');
        }
        return out;
      }
      window.noAnswer = function (widths) {
        const well = document.getElementById('well');
        const out = [];
        let renders = 0;
        for (const W of widths) {
          well.style.width = W + 2 + 'px';
          for (const spec of M.EXPERIMENTS.filter((e) => !e.goal)) {
            const m = M.run(spec.setup);
            const view = { hide: spec.hide, phase: 'asking', focus: [] };
            const { D, H } = buildStage(W, m, view);
            well.style.height = H + 'px';
            well.innerHTML = D.svg(H) + overlaysHtml(D, view, W);
            renders++;
            const text = [...well.querySelectorAll('text')].map((t) => t.textContent).join(' | ') + ' | ' + [...well.querySelectorAll('[aria-label]')].map((e) => e.getAttribute('aria-label')).join(' | ');
            const words = [...GIVEAWAYS[spec.id], ...FALSE_CLAIMS, ...spec.hide.flatMap((h) => BY_REGION[h] ?? [])];
            for (const g of words) if (text.includes(g)) out.push(`W${W} ${spec.id}: "${g}"`);
            for (const g of hiddenMarks(well, spec, m)) out.push(`W${W} ${spec.id}: ${g}`);
            const hidesRepair = spec.hide.includes('repair') || spec.hide.includes('verdict');
            if (hidesRepair && well.querySelector('.link.repair, .repair-glyph, .repair-bar')) out.push(`W${W} ${spec.id}: a repair mark while asking`);
            if (spec.hide.includes('verdict') && well.querySelector('.both-ring, .card.both')) out.push(`W${W} ${spec.id}: a BOTH ring while asking`);
          }
        }
        well.style.width = '';
        return { renders, out };
      };
      window.heights = function (widths) {
        const well = document.getElementById('well');
        const out = {};
        for (const W of widths)
          for (const n of [3, 5]) {
            const hs = new Set();
            for (const s of [
              { ...M.BASE, n, w: 1, r: 1, states: UP(n) },
              { ...M.BASE, n, w: n, r: n, states: UP(n), sloppy: 1 },
              { ...M.BASE, n, w: n, r: 1, states: ['up', 'mid', ...UP(n - 2)] },
              { ...M.BASE, n, w: 2, r: n, states: ['down', 'back', ...UP(n - 2)], sloppy: 1, stall: 1 },
              { ...M.BASE, n, w: n, r: n, states: ['up', 'down', 'down', ...UP(n - 3)], sloppy: 1 },
              { ...M.BASE, n, w: 1, r: n, states: ['up', 'mid', 'mid', ...UP(n - 3)] },
              { ...M.BASE, n, w: n, r: 1, states: Array(n).fill('down'), sloppy: 1 },
            ])
              hs.add(buildStage(W, M.run(s), { hide: [], phase: 'rest' }).H);
            for (const spec of M.EXPERIMENTS.filter((e) => !e.goal && e.setup.n === n)) hs.add(buildStage(W, M.run(spec.setup), { hide: spec.hide, phase: 'asking' }).H);
            out[`${W}/N${n}`] = [...hs];
          }
        return out;
      };

      const stateName = params.get('state') ?? 'default';
      Promise.all([
        document.fonts.load('600 11px "Inter Variable"'),
        document.fonts.load('500 13px "Inter Variable"'),
        document.fonts.load('700 11px "Inter Variable"'),
        document.fonts.load('600 11px "JetBrains Mono Variable"'),
      ]).then(() => {
        const issues = renderChecked(stateName);
        render(stateName);
        window.__collisions = issues;
        document.body.dataset.ready = '1';
      });
    </script>
  </body>
</html>
