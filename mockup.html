<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capacity widget mockup</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url(fonts/inter-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        src: url(fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 800;
        font-display: block;
      }
      /* The app's tokens (apps/app/src/_theme.scss, styles.scss): light is the base, dark overrides. */
      :root {
        color-scheme: light;
        --g-bg: #f4f5f9;
        --g-surface: #ffffff;
        --g-raised: #ffffff;
        --g-sunken: #eef0f5;
        --g-line: #dfe2ea;
        --g-line-strong: #c6cbd6;
        --g-stroke: #707889;
        --g-text: #161a23;
        --g-text-rgb: 22, 26, 35;
        --g-muted: #4a5263;
        --g-faint: #5c6477;
        --g-on-fill: #ffffff;
        --g-warn-ink: #6e4200;
        --g-danger-ink: #9d1630;
        --g-found-ink: #02583f;
        --g-accent: #5846dc;
        --g-accent-rgb: 88, 70, 220;
        --g-accent-soft: rgba(88, 70, 220, 0.14);
        --g-found: #036b4c;
        --g-danger: #c3203d;
        --g-warn: #945800;
        --g-success-ink: var(--g-found-ink);
        --g-success-line: var(--g-found);
        --g-success-soft: rgba(3, 107, 76, 0.12);
        --g-danger-soft: rgba(195, 32, 61, 0.12);
        --g-warn-soft: rgba(148, 88, 0, 0.12);
        --g-viz-stage: #f7f8fb;
        --g-viz-current: #0b74ad;
        --g-viz-current-soft: rgba(11, 116, 173, 0.16);
        --g-viz-considering: #c77700;
        --g-viz-considering-soft: rgba(199, 119, 0, 0.14);
        --g-viz-final: #12925f;
        --g-viz-final-ink: var(--g-found-ink);
        --g-viz-discarded-ink: #687082;
        --g-viz-critical: #d42a49;
        --g-viz-track: #d3d7e0;
        --g-shadow: 0 1px 2px rgba(var(--g-text-rgb), 0.06), 0 3px 10px rgba(var(--g-text-rgb), 0.07);
        --g-shadow-raised: 0 1px 2px rgba(var(--g-text-rgb), 0.08);
        --g-radius-xs: 6px;
        --g-radius-sm: 10px;
        --g-radius-md: 14px;
        --g-radius-pill: 999px;
        --g-text-title-m: 1.0625rem;
        --g-text-title-s: 0.9375rem;
        --g-text-body: 0.875rem;
        --g-text-body-s: 0.8125rem;
        --g-text-label: 0.6875rem;
        --g-font: 'Inter Variable', system-ui, sans-serif;
        --g-font-mono: 'JetBrains Mono Variable', ui-monospace, monospace;
        --g-focus-ring: 2px solid var(--g-accent);
      }
      :root.dark {
        color-scheme: dark;
        --g-bg: #0b0d12;
        --g-surface: #141824;
        --g-raised: #1c2130;
        --g-sunken: #0f121a;
        --g-line: #252a37;
        --g-line-strong: #343b4d;
        --g-stroke: #6b7387;
        --g-text: #e9ebf2;
        --g-text-rgb: 233, 235, 242;
        --g-muted: #8b93a8;
        --g-faint: #828a9e;
        --g-on-fill: #0b0d12;
        --g-warn-ink: #f3e6b3;
        --g-danger-ink: #ffb3bd;
        --g-found-ink: #3ddc97;
        --g-accent: #9d8cff;
        --g-accent-rgb: 157, 140, 255;
        --g-accent-soft: rgba(157, 140, 255, 0.14);
        --g-found: #3ddc97;
        --g-danger: #ff5d73;
        --g-warn: #ffb547;
        --g-success-soft: rgba(61, 220, 151, 0.12);
        --g-danger-soft: rgba(255, 93, 115, 0.12);
        --g-warn-soft: rgba(255, 181, 71, 0.12);
        --g-viz-stage: #0e1118;
        --g-viz-current: #1f9fd0;
        --g-viz-current-soft: rgba(31, 159, 208, 0.16);
        --g-viz-considering: #c08420;
        --g-viz-considering-soft: rgba(192, 132, 32, 0.18);
        --g-viz-final: #22ad74;
        --g-viz-final-ink: var(--g-found);
        --g-viz-discarded-ink: var(--g-muted);
        --g-viz-critical: #e5485f;
        --g-viz-track: #2a3040;
        --g-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        --g-shadow-raised: var(--g-shadow);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--g-bg);
        color: var(--g-text);
        font: 400 var(--g-text-body) / 1.5 var(--g-font);
        font-variant-ligatures: none;
        -webkit-font-smoothing: antialiased;
        overflow-wrap: break-word;
      }
      button {
        font-size: 0.8333rem;
      }
      .page {
        max-width: 1048px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      .eyebrow {
        margin: 0;
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
      }
      h1 {
        margin: 4px 0 14px;
        font: 600 1.25rem/1.3 var(--g-font);
      }
      .panel {
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background: var(--g-surface);
        box-shadow: var(--g-shadow);
        padding: 16px;
      }
      /* Narrow: one column, the controls as the stage's first rows, then the stage, the question, Describe, the cards. */
      .widget {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }
      .main,
      .experiments {
        display: contents;
      }
      .controls {
        order: 1;
      }
      .stage {
        order: 2;
        min-width: 0;
      }
      .dock {
        order: 3;
      }
      .describe {
        order: 4;
      }
      .heading,
      .cards {
        order: 5;
      }
      .controls {
        padding: 12px 12px 0;
        border: 1px solid var(--g-line);
        border-bottom: 0;
        border-radius: var(--g-radius-md) var(--g-radius-md) 0 0;
        background: var(--g-viz-stage);
        display: grid;
        gap: 10px;
        min-width: 0;
      }
      .stage {
        margin-top: -12px;
      }
      .stage .well {
        border-top: 0;
        border-radius: 0 0 var(--g-radius-md) var(--g-radius-md);
      }
      @media (min-width: 1000px) {
        .widget {
          grid-template-columns: minmax(0, 1fr) 340px;
          grid-template-rows: auto 1fr;
          align-items: start;
          column-gap: 20px;
        }
        .main {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: 12px;
          grid-column: 1;
          grid-row: 1 / span 2;
          min-width: 0;
        }
        .controls {
          grid-column: 2;
          grid-row: 1;
          padding: 0;
          border: 0;
          background: none;
        }
        .experiments {
          display: block;
          grid-column: 2;
          grid-row: 2;
          min-width: 0;
        }
        .stage {
          margin-top: 0;
        }
        .stage .well {
          border-top: 1px solid var(--g-line);
          border-radius: var(--g-radius-md);
        }
        .dock {
          margin-top: 12px;
        }
      }
      .well {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background-color: var(--g-viz-stage);
        background-image: radial-gradient(circle, rgba(var(--g-text-rgb), 0.09) 1px, transparent 1.5px);
        background-size: 24px 24px;
        background-position: 11px 11px;
      }
      /* Every fieldset.group carries the same zero padding; a control's own class only adds to it (the R41 padding bug). */
      fieldset.group {
        margin: 0;
        padding: 0;
        border: 0;
        min-width: 0;
      }
      .control-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
        padding: 0;
        margin-bottom: 4px;
      }
      .segments {
        display: flex;
        gap: 4px;
      }
      .segment {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
      }
      .segment input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .segment span {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 6px;
        border-radius: var(--g-radius-sm);
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        font: 500 var(--g-text-body) / 1.15 var(--g-font);
        text-align: center;
      }
      .segment input:checked + span {
        background: var(--g-accent-soft);
        border-color: var(--g-accent);
        box-shadow: inset 0 0 0 1px var(--g-accent);
      }
      .segment .chk {
        margin-right: 4px;
        color: var(--g-accent);
        font-weight: 700;
      }
      .segment input:not(:checked) + span .chk {
        visibility: hidden;
      }
      fieldset:disabled .segment span,
      .segment input:disabled + span {
        opacity: 0.55;
      }
      .control-label .why {
        font-weight: 500;
        letter-spacing: normal;
        text-transform: none;
      }
      .segment small {
        font: 500 var(--g-text-label) var(--g-font);
        color: var(--g-muted);
      }
      .toggles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .toggles .segment span {
        display: block;
        height: 100%;
        padding: 6px 6px;
        font-size: var(--g-text-body-s);
        text-align: center;
        align-content: center;
      }
      .toggles .segment small {
        display: block;
      }
      .hint-long,
      .hint-short {
        font-style: normal;
      }
      .hint-short {
        display: none;
      }
      @media (max-width: 420px) {
        .hint-long {
          display: none;
        }
        .hint-short {
          display: inline;
        }
      }
      .notice {
        margin: 0;
        min-height: 2lh;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      /* Below wide the notice would sit over the stage and push it down as it speaks: read out only (_widget-controls.scss). */
      @media (max-width: 999px) {
        .notice {
          position: absolute;
          width: 1px;
          height: 1px;
          min-height: 0;
          overflow: hidden;
          clip-path: inset(50%);
        }
        .controls {
          padding-bottom: 12px;
        }
      }
      /* Heat for load (3.6): darker with load on light, brighter on dark; length and % are its second encoding. */
      :root {
        --g-viz-heat-1: #c97a22;
        --g-viz-heat-2: #9c5a0c;
        --g-viz-heat-3: #7a4508;
        --g-viz-final-soft: rgba(18, 146, 95, 0.14);
        --g-viz-critical-soft: rgba(212, 42, 73, 0.12);
        --g-viz-current-rgb: 11, 116, 173;
      }
      :root.dark {
        --g-viz-heat-1: #9a6418;
        --g-viz-heat-2: #c98a2e;
        --g-viz-heat-3: #f0b25a;
        --g-viz-final-soft: rgba(34, 173, 116, 0.18);
        --g-viz-critical-soft: rgba(229, 72, 95, 0.16);
        --g-viz-current-rgb: 31, 159, 208;
      }
      .play {
        position: absolute;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        z-index: 2;
      }
      .play svg {
        display: block;
        width: 36px;
        height: 36px;
        margin: 4px;
      }
      .play circle {
        fill: var(--g-raised);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .play path,
      .play rect {
        fill: var(--g-accent);
      }
      .play:disabled {
        cursor: default;
        opacity: 0.55;
      }
      /* A tier's stepper: a 44 px target around a 32 px key. */
      .step {
        position: absolute;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        z-index: 2;
        display: grid;
        place-items: center;
      }
      .step span {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: var(--g-radius-xs);
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        font: 600 17px/1 var(--g-font);
      }
      .step:disabled {
        cursor: default;
      }
      .step:disabled span {
        opacity: 0.45;
      }
      .handle {
        position: absolute;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        cursor: ew-resize;
        z-index: 2;
      }
      .handle .knob {
        width: 14px;
        height: 26px;
        border-radius: var(--g-radius-pill);
        background: var(--g-raised);
        border: 2px solid var(--g-accent);
        box-shadow: var(--g-shadow-raised);
      }
      .handle[aria-disabled='true'] {
        cursor: default;
      }
      .handle[aria-disabled='true'] .knob {
        opacity: 0.55;
      }
      /* Drawing roles: text sits on a halo of its ground; small text is measured as drawn (no tabular digits). */
      svg.draw {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        overflow: visible;
      }
      svg.draw text {
        paint-order: stroke;
        stroke: var(--g-viz-stage);
        stroke-width: 3px;
        stroke-linejoin: round;
      }
      svg.draw text.on-box {
        stroke: var(--g-raised);
      }
      .t-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: var(--g-muted);
      }
      .t-cap {
        font: 500 var(--g-text-body-s) var(--g-font);
        fill: var(--g-muted);
      }
      .t-capB {
        font: 600 var(--g-text-body-s) var(--g-font);
        fill: var(--g-text);
      }
      .t-small {
        font: 500 var(--g-text-label) var(--g-font);
        fill: var(--g-muted);
      }
      .t-smallB {
        font: 700 var(--g-text-label) var(--g-font);
        fill: var(--g-text);
      }
      .t-head {
        font: 600 var(--g-text-title-m) var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-look {
        font: 600 var(--g-text-label) var(--g-font);
        fill: var(--g-accent);
      }
      .t-unit {
        text-transform: none;
      }
      .crit-ink {
        fill: var(--g-danger-ink);
      }
      .final-ink {
        fill: var(--g-viz-final-ink);
      }
      .ink {
        fill: var(--g-text);
      }
      .muted {
        fill: var(--g-muted);
      }
      .gridline {
        fill: none;
        stroke: var(--g-line);
        stroke-dasharray: 2 3;
      }
      .rail {
        stroke: var(--g-viz-track);
        stroke-width: 4;
        stroke-linecap: round;
      }
      .rail-fill {
        stroke: var(--g-accent);
        stroke-width: 4;
        stroke-linecap: round;
      }
      .stop {
        fill: var(--g-line-strong);
      }
      .axis {
        stroke: var(--g-line-strong);
      }
      /* The request stream between tiers: its width is the rate on the shared axis. */
      .band {
        fill: rgba(var(--g-viz-current-rgb), 0.2);
      }
      :root.dark .band {
        fill: rgba(var(--g-viz-current-rgb), 0.3);
      }
      .strand {
        stroke: var(--g-viz-stage);
        stroke-opacity: 0.7;
        stroke-width: 1;
      }
      .band-edge {
        stroke: var(--g-viz-current);
        stroke-opacity: 0.8;
        stroke-width: 1.5;
      }
      .band-shed {
        fill: var(--g-viz-critical-soft);
      }
      .band-shed-edge {
        stroke: var(--g-viz-critical);
        stroke-width: 2;
      }
      .band-hidden {
        fill: none;
        stroke: var(--g-stroke);
        stroke-dasharray: 3 3;
      }
      .divider {
        stroke: var(--g-line);
      }
      .band.stub {
        fill: rgba(var(--g-viz-current-rgb), 0.3);
      }
      .tier-box {
        fill: var(--g-raised);
        stroke: var(--g-line);
      }
      .tier-box.bottleneck {
        stroke: var(--g-viz-critical);
        stroke-width: 1.5;
      }
      .tier-accent {
        fill: var(--g-viz-critical);
      }
      .seg {
        fill: var(--g-sunken);
        stroke: var(--g-line-strong);
      }
      .seg.lost {
        fill: url(#hatch);
        stroke: var(--g-stroke);
        stroke-width: 0.75;
      }
      /* A lane's end, its limit: a cap in the stroke ink, 3:1 against the box in both themes. */
      .lane-cap {
        stroke: var(--g-stroke);
        stroke-width: 1.5;
      }
      .lane-none {
        stroke: var(--g-line-strong);
        stroke-width: 1;
      }
      /* The 70% mark in every segment, so headroom reads as a mark and not only as a colour step. */
      .target {
        stroke: var(--g-stroke);
        stroke-width: 1.25;
        fill: none;
      }
      .target-under {
        stroke: var(--g-raised);
        stroke-width: 3;
        fill: none;
      }
      .zone-line {
        stroke: var(--g-stroke);
        stroke-width: 1;
      }
      .zone-tick {
        stroke: var(--g-viz-critical);
        stroke-width: 2;
        stroke-dasharray: 4 2;
      }
      .split-hidden {
        fill: url(#split);
      }
      .split-dot {
        fill: var(--g-raised);
        fill-opacity: 0.75;
      }
      .writes-key {
        fill: url(#writes-key);
      }
      .writes-key-fill {
        fill: var(--g-viz-discarded-ink);
        fill-opacity: 0.45;
      }
      .writes-key-line {
        stroke: var(--g-raised);
        stroke-width: 1.25;
      }
      .xfer,
      .xfer-tail {
        stroke: var(--g-stroke);
        stroke-width: 1.25;
      }
      .xfer-head {
        fill: var(--g-stroke);
      }
      .fill.lo {
        fill: var(--g-viz-current);
      }
      .fill.h1 {
        fill: var(--g-viz-heat-1);
      }
      .fill.h2 {
        fill: var(--g-viz-heat-2);
      }
      .fill.h3 {
        fill: var(--g-viz-heat-3);
      }
      .fill.full {
        fill: var(--g-viz-critical);
      }
      .writes-hatch {
        fill: url(#writes);
      }
      .swatch-track {
        fill: var(--g-sunken);
        stroke: var(--g-line-strong);
      }
      .lane-hidden {
        fill: none;
        stroke: var(--g-stroke);
        stroke-opacity: 0.7;
        stroke-dasharray: 3 3;
      }
      .shed-block {
        fill: url(#shedhatch);
        stroke: var(--g-viz-critical);
        stroke-width: 1.25;
      }
      .break {
        fill: none;
        stroke: var(--g-raised);
        stroke-width: 3;
      }
      .break-line {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1.25;
      }
      .ghost-tick {
        stroke: var(--g-text);
        stroke-opacity: 0.8;
        stroke-width: 1.5;
        stroke-dasharray: 2 2;
      }
      .ghost-under {
        stroke: var(--g-raised);
        stroke-width: 4.5;
      }
      .meter-cell {
        fill: var(--g-sunken);
        stroke: var(--g-line-strong);
      }
      .sink {
        fill: var(--g-viz-final);
      }
      .sink-track {
        fill: var(--g-sunken);
      }
      .hatch-fill {
        fill: var(--g-sunken);
      }
      .hatch-line {
        stroke: var(--g-viz-discarded-ink);
        stroke-opacity: 0.4;
        stroke-width: 1.5;
      }
      .writes-line {
        stroke: var(--g-raised);
        stroke-opacity: 0.85;
        stroke-width: 1.25;
      }
      .shed-fill {
        fill: var(--g-viz-critical-soft);
      }
      .shed-line {
        stroke: var(--g-viz-critical);
        stroke-opacity: 0.6;
        stroke-width: 1.25;
      }
      .xmark {
        stroke: var(--g-viz-critical);
        stroke-width: 2;
        stroke-linecap: round;
        fill: none;
      }
      .xground {
        fill: var(--g-viz-stage);
      }
      .xground.on-box {
        fill: var(--g-raised);
      }
      .dot.req {
        fill: var(--g-viz-current);
      }
      .dot.doomed {
        fill: var(--g-viz-critical);
      }
      /* The climax ring: stroke only, around the gap's ×, so it covers no mark it points at. */
      .landing {
        fill: none;
        stroke: var(--g-viz-critical);
        stroke-width: 2;
      }
      .focus-outline {
        fill: none;
        stroke: var(--g-accent);
        stroke-width: 2;
        stroke-dasharray: 6 4;
      }
      .tag {
        fill: var(--g-viz-stage);
        stroke: var(--g-accent);

  <body>
    <main class="page">
      <p class="eyebrow">System design · Capacity &amp; Scaling</p>
      <h1>Try it</h1>
      <section class="panel widget" id="widget"></section>
    </main>
    <script src="model.js"></script>
    <script>
      'use strict';
      const M = window.CapacityModel;
      const params = new URLSearchParams(location.search);
      document.documentElement.classList.toggle('dark', params.get('theme') === 'dark');
      /** A switch for the planted-fault proofs: each names one rule's bug, and its rule must catch it. */
      const FAULT = { name: null };

      // ---------- Text measurement, with the fonts the app ships (no tabular digits: stage text is measured as drawn).
      const ROLE = {
        label: { css: '600 11px "Inter Variable"', size: 11, track: 0.12, upper: true },
        cap: { css: '500 13px "Inter Variable"', size: 13 },
        capB: { css: '600 13px "Inter Variable"', size: 13 },
        small: { css: '500 11px "Inter Variable"', size: 11 },
        smallB: { css: '700 11px "Inter Variable"', size: 11 },
        head: { css: '600 17px "JetBrains Mono Variable"', size: 17 },
        look: { css: '600 11px "Inter Variable"', size: 11 },
      };
      const ctx = document.createElement('canvas').getContext('2d');
      const widthCache = new Map();
      function tw(text, role) {
        const key = role + '|' + text;
        if (widthCache.has(key)) return widthCache.get(key);
        const f = ROLE[role];
        ctx.font = f.css;
        const s = f.upper ? text.toUpperCase() : text;
        const w = Math.ceil(ctx.measureText(s).width + (f.track ? f.track * f.size * s.length : 0)) + 1;
        widthCache.set(key, w);
        return w;
      }
      const partsWidth = (parts) => parts.reduce((s, [t, role, , dx = 0]) => s + tw(t, role) + dx, 0);
      // A space may break a line, except: between a number and its unit ("50 ms", "8,000 queries/s", "1,000 a second",
      // "4 of 6 up", "2,000/s shed"), after an operator or "(" ("÷ 2", "× 5,000/s"), after "of" and "in" ("of 8,000/s",
      // "in zone A"), before "each", and after "·" (it opens the run after it), as stage-text.ts and g-code-text keep them.
      // Runs are joined first, so the rule holds across them.
      const BREAK = /(?<![×÷=+(·])(?<!\b(?:of|in)) (?!each\b)(?!(?<=\d )(?:ms|s|queries|requests|reads|writes|replayed|workers|a|of|left|up)\b)(?!(?<=\/s )(?:shed|spare)\b)/g;
      /** Lays runs of styled words into lines no wider than `width` (the first no wider than `first`): each line a list of
       * [text, role, cls] parts. */
      function flow(parts, width, first = width) {
        let full = '';
        const style = [];
        for (const [text, role, cls = ''] of parts) {
          for (let i = 0; i < text.length; i++) style.push([role, cls]);
          full += text;
        }
        const words = [];
        let from = 0;
        let spaced = false;
        BREAK.lastIndex = 0;
        for (let m; (m = BREAK.exec(full)); ) {
          if (m.index > from) words.push({ s: from, e: m.index, space: spaced && words.length > 0 });
          spaced = true;
          from = m.index + 1;
        }
        if (full.length > from) words.push({ s: from, e: full.length, space: spaced && words.length > 0 });
        const runs = (s, e) => {
          const out = [];
          for (let i = s; i < e; i++) {
            const last = out[out.length - 1];
            if (last && last[1] === style[i][0] && last[2] === style[i][1]) last[0] += full[i];
            else out.push([full[i], style[i][0], style[i][1]]);
          }
          return out;
        };
        const widthOf = (s, e) => runs(s, e).reduce((a, [t, role]) => a + tw(t, role), 0);
        for (const w of words) {
          w.w = widthOf(w.s, w.e);
          w.lead = w.space ? tw(' ', style[w.s - 1][0]) : 0;
        }
        const lines = [];
        let line = [];
        let lw = 0;
        for (const w of words) {
          if (line.length && w.space && lw + w.lead + w.w > (lines.length ? width : first)) {
            lines.push(line);
            line = [w];
            lw = w.w;
          } else {
            lw += (line.length ? w.lead : 0) + w.w;
            line.push(w);
          }
        }
        if (line.length) lines.push(line);
        // No single-word last line: carry the previous line's last word down when both still fit (prevention 14). A glued
        // run ("· 2,000/s spare") is not one word, so it stays as it is.
        const lone = (w) => !/ /.test(full.slice(w.s, w.e));
        if (lines.length > 1 && lines[lines.length - 1].length === 1 && lone(lines[lines.length - 1][0]) && lines[lines.length - 2].length > 2) {
          const prev = lines[lines.length - 2];
          const lastW = lines[lines.length - 1][0];
          const moved = prev[prev.length - 1];
          if (lastW.space && moved.space && moved.w + lastW.lead + lastW.w <= (lines.length > 2 ? width : first)) {
            lines.splice(lines.length - 2, 2, prev.slice(0, -1), [moved, lastW]);
          }
        }
        return lines.map((ln) => runs(ln[0].s, ln[ln.length - 1].e));
      }
      const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const r1 = (v) => Math.round(v * 10) / 10;
      const pick = (forms, fits) => forms.find(fits) ?? forms[forms.length - 1];
      const fq = (v) => M.formatQps(v);
      const fp = (u) => M.formatPct(u * 100);
      const fn = (v) => M.group(v);
      /** A share of a request's queries: up to three decimals, so 0.18 split four ways reads 0.045. */
      const f3 = (v) => String(Number(v.toFixed(3)));
      const ONE_DECIMAL = new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 });
      const f1 = (v) => ONE_DECIMAL.format(v);

      // ---------- The drawing: SVG parts in layers, and the boxes placement checks against.
      class Draw {
        constructor(W) {
          this.W = W;
          this.layers = { back: [], grid: [], band: [], boxes: [], lanes: [], fills: [], marks: [], dots: [], text: [], top: [] };
          this.texts = [];
          this.marks = [];
          this.links = [];
          this.hits = [];
          this.regions = {};
          this.missing = [];
          this.meta = { gaps: [], lanes: {}, ghosts: [], rows: {} };
        }
        add(layer, s) {
          this.layers[layer].push(s);
        }
        textBox(x, y, w, role, anchor = 'start') {
          const fs = ROLE[role].size;
          const x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
          return { x0, x1: x0 + w, y0: y - 0.74 * fs, y1: y + 0.22 * fs };
        }
        text(x, y, parts, o = {}) {
          if (typeof parts === 'string') parts = [[parts, o.role ?? 'small', o.cls ?? '']];
          const anchor = o.anchor ?? 'start';
          const w = partsWidth(parts);
          const role = parts.reduce((a, p) => (ROLE[p[1]].size > ROLE[a].size ? p[1] : a), parts[0][1]);
          const box = this.textBox(x, y, w, role, anchor);
          box.owner = o.owner ?? '';
          box.s = parts.map((p) => p[0]).join('');
          this.texts.push(box);
          if (o.row) (this.meta.rows[o.row] ??= []).push(y);
          const spans = parts.map(([t, r, cls = '', dx = 0]) => `<tspan class="t-${r} ${cls}"${dx ? ` dx="${dx}"` : ''}>${esc(t)}</tspan>`).join('');
          const attrs = `x="${r1(x)}" y="${r1(y)}" text-anchor="${anchor}"${o.owner ? ` data-owner="${o.owner}"` : ''}${o.ground ? ' data-ground="1"' : ''}${o.id ? ` data-id="${o.id}"` : ''}${o.data ?? ''}`;
          this.add(o.layer ?? 'text', `<text class="${o.textCls ?? ''}" ${attrs}>${spans}</text>`);
          return box;
        }
        mark(box, owner = '') {
          this.marks.push({ ...box, owner });
        }
        link(points, owner = '') {
          this.links.push({ points, owner });
        }
        hit(kind, x, y, w, h, extra = {}) {
          this.hits.push({ kind, x, y, w, h, ...extra });
        }
        region(id, box) {
          (this.regions[id] ??= []).push(box);
        }
        free(box, ignoreOwner = '', margin = 2) {
          const b = { x0: box.x0 - margin, x1: box.x1 + margin, y0: box.y0 - margin, y1: box.y1 + margin };
          const hit = (o) => !(o.x1 <= b.x0 || o.x0 >= b.x1 || o.y1 <= b.y0 || o.y0 >= b.y1);
          const mine = (o) => ignoreOwner && o.owner && o.owner.split(' ').some((t) => ignoreOwner.split(' ').includes(t));
          if (this.texts.some((t) => hit(t) && !mine(t))) return false;
          if (this.marks.some((m) => hit(m) && !mine(m))) return false;
          for (const l of this.links) {
            if (mine(l)) continue;
            if (l.points.some(([x, y]) => x > b.x0 && x < b.x1 && y > b.y0 && y < b.y1)) return false;
          }
          return b.x0 >= 2 && b.x1 <= this.W - 2;
        }
        svg(H, label) {
          const L = this.layers;
          return `<svg class="draw" width="${this.W}" height="${H}" viewBox="0 0 ${this.W} ${H}" role="img" aria-label="${esc(label)}">
<defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="hatch-fill"/><line class="hatch-line" x1="0" y1="0" x2="0" y2="6"/></pattern>
<pattern id="writes" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="writes-line" x1="0" y1="0" x2="0" y2="5"/></pattern>
<pattern id="writes-key" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" class="writes-key-fill"/><line class="writes-key-line" x1="0" y1="0" x2="0" y2="5"/></pattern>
<pattern id="split" width="6" height="6" patternUnits="userSpaceOnUse"><circle class="split-dot" cx="3" cy="3" r="1"/></pattern>
<pattern id="shedhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" class="shed-fill"/><line class="shed-line" x1="0" y1="0" x2="0" y2="6"/></pattern>
<marker id="xfer-head" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L6 3L0 6z" class="xfer-head"/></marker>
</defs>
<g>${L.back.join('')}</g><g>${L.grid.join('')}</g><g>${L.band.join('')}</g><g>${L.dots.join('')}</g><g>${L.boxes.join('')}</g><g>${L.lanes.join('')}</g><g>${L.fills.join('')}</g><g>${L.marks.join('')}</g><g>${L.text.join('')}</g><g>${L.top.join('')}</g></svg>`;
        }
      }
      function xGlyph(D, cx, cy, owner, s = 4, ground = 'xground', layer = 'marks') {
        D.add(layer, `<circle class="${ground}" cx="${r1(cx)}" cy="${r1(cy)}" r="${s + 3}"/><path class="xmark" data-owner="${owner}" data-x="${owner}" d="M${r1(cx - s)} ${r1(cy - s)}l${2 * s} ${2 * s}M${r1(cx + s)} ${r1(cy - s)}l${-2 * s} ${2 * s}"/>`);
        D.mark({ x0: cx - s - 2, x1: cx + s + 2, y0: cy - s - 2, y1: cy + s + 2 }, owner);
      }
      const rect = (x, y, w, h, cls, extra = '') => `<rect class="${cls}" x="${r1(x)}" y="${r1(y)}" width="${r1(Math.max(0, w))}" height="${r1(h)}"${extra}/>`;

      // ---------- What an open question hides, on every surface: one map (prevention 1). Each region is named in the
      // question's own `hide` list. `db` (E1, asking and its play) hides the database's lanes, statuses and conversions;
      // `after` (a play) hides the lanes its act changes; while lanes hide, no tier is named the bottleneck. `totals`
      // hide in a play only when its act changes what is served or shed; the served bar stays, since it is the stream's
      // end and the stream is the mechanism the play shows. `replay` (E3 asking) hides what a replica does beyond its
      // reads. `zones` (E4 asking) hides the zone groups and the "if zone A fails" ticks. The fleets, the per-request
      // costs the ask states, the cache line and the traffic are the question's premise and stay. No ghost of an
      // earlier setting shows while a question asks.
      function hiding(view) {
        const h = new Set(view.hide ?? []);
        const asking = view.phase === 'asking';
        const playing = view.phase === 'playing';
        const lanes = new Set();
        if (h.has('db') && (asking || playing)) for (const id of ['primary', 'replicas']) lanes.add(id);
        if (h.has('after') && playing) for (const id of view.changed ?? []) lanes.add(id);
        const totals = playing && !!view.totalsChange && (h.has('db') || h.has('after'));
        return {
          lanes,
          totals,
          replay: h.has('replay') && asking,
          zones: h.has('zones') && asking,
          ghost: asking && !view.leakGhost,
          zoneTicks: view.phase === 'rest' || view.phase === 'challenge',
          any: lanes.size > 0 || totals,
        };
      }
      const NO_HIDE = { lanes: new Set(), totals: false, replay: false, zones: false, ghost: false, zoneTicks: true, any: false };
      const ALL_HIDE = { lanes: new Set(['lb', 'app', 'primary', 'replicas', 'workers']), totals: true, replay: true, zones: true, ghost: true, zoneTicks: false, any: true };

      // ---------- Words.
      const NOUN = { lb: ['load balancer', 'load balancers'], app: ['app server', 'app servers'], replicas: ['read replica', 'read replicas'] };
      const tierWord = (r, id) => (id === 'replicas' && r.replicas.up === 1 && !FAULT.name?.startsWith('eachOne') ? 'the read replica' : { lb: 'the load balancers', app: 'the app servers', primary: 'the database primary', replicas: 'the read replicas' }[id]);
      const verb = (r, id, v = ['is', 'are']) => (id === 'primary' || (id === 'replicas' && r.replicas.up === 1 && FAULT.name !== 'eachOne') ? v[0] : v[1]);
      const eachOf = (r, id) => (id === 'replicas' && (r.replicas.up >= 2 || FAULT.name === 'eachOne') ? ' each' : '');
      const cap1 = (t) => t[0].toUpperCase() + t.slice(1);
      const joinAnd = (xs) => (xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} and ${xs[xs.length - 1]}`);
      /** What reaches a tier: the load balancers and app servers count what arrives; the database what it admitted. */
      const loadOf = (r, id) => (id === 'primary' || id === 'replicas' ? r.served : r[id].arriving);
      const NAMES = { lb: ['Load balancers'], app: ['App servers'], primary: ['Database primary', 'Primary'], replicas: ['Read replicas'] };
      const NAME = { lb: 'Load balancers', app: 'App servers', primary: 'Primary', replicas: 'Read replicas' };
      /** A block's fleet: instances times what each takes; it wraps rather than drop a count, a promotion or a unit. */
      function fleetText(r, id, hid) {
        const t = r[id];
        if (id === 'lb' || id === 'app') {

        for (const e of M.EXPERIMENTS) out.push(e.setup, { ...e.setup, ...(e.act?.set ?? {}) });
        out.push({ ...M.EXPERIMENTS[5].setup, ...M.CHALLENGE_SOLUTION });
        return out;
      })();
      const reserveCache = new Map();
      /** Every setting one stepper press or one toggle away. */
      function neighbours(s) {
        const out = [];
        const add = (k, v, lo, hi) => v >= lo && v <= hi && out.push({ ...s, [k]: v });
        add('lb', s.lb - 1, 1, M.LB_MAX);
        add('lb', s.lb + 1, 1, M.LB_MAX);
        add('app', s.app - 1, 1, M.APP_MAX);
        add('app', s.app + 1, 1, M.APP_MAX);
        add('replicas', s.replicas - 1, 0, M.REP_MAX);
        add('replicas', s.replicas + 1, 0, M.REP_MAX);
        out.push({ ...s, size: s.size === M.SIZES[0] ? M.SIZES[1] : M.SIZES[0] }, { ...s, cache: 1 - s.cache }, { ...s, zone: 1 - s.zone }, { ...s, slow: 1 - s.slow });
        return out;
      }
      function reserve(W) {
        if (reserveCache.has(W)) return reserveCache.get(W);
        const fault = FAULT.name;
        FAULT.name = null;
        const g = geometry(W);
        const n = { lb: 0, app: 0, db: 0, sink: 0 };
        const take = (P) => {
          for (const k of Object.keys(n)) n[k] = Math.max(n[k], P.content[k]);
        };
        for (const s of RESERVE_SET) {
          const r = M.run(s);
          for (const hid of [NO_HIDE, ALL_HIDE, { ...ALL_HIDE, replay: false }]) take(planStage(g, r, hid, null));
          // A ghost is the setting before one change: words move into a status only where a lane's labels find no room.
          const plain = ['lb', 'app', 'primary', 'replicas'].map((id) => laneInfo(g, r, id, NO_HIDE, null));
          for (const before of neighbours(s)) {
            const gr = M.run(before);
            const moved = ['lb', 'app', 'primary', 'replicas'].some((id, i) => {
              const L = laneInfo(g, r, id, NO_HIDE, gr);
              return L.wasInStatus !== null || L.limitInStatus !== plain[i].limitInStatus;
            });
            if (moved) take(planStage(g, r, NO_HIDE, gr));
          }
        }
        FAULT.name = fault;
        reserveCache.set(W, n);
        return n;
      }

      // ---------- The legend: what each mark means, in balanced rows beside the title or under it.
      const LEGEND = [
        ['band', 'requests', 14],
        ['busy', 'busy: under 50 · 70 · 85% · full', 30],
        ['track', 'spare, 70% mark', 20],
        ['writes', 'writes', 14],
        ['lost', 'lost', 14],
        ['shed', 'shed', 14],
        ['zone', 'if zone A fails', 8],
      ];
      const itemWidth = ([, t, sw]) => sw + 4 + tw(t, 'small');
      /** Splits the legend, in order, into the fewest rows that fit, then the most even of those. */
      function legendRows(maxW) {
        const n = LEGEND.length;
        const rowW = (a, b) => LEGEND.slice(a, b).reduce((s, it, i) => s + itemWidth(it) + (i ? 12 : 0), 0);
        for (let k = 1; k <= n; k++) {
          let best = null;
          const cuts = (start, left, acc) => {
            if (left === 1) {
              const rows = [...acc, [start, n]];
              const widths = rows.map(([a, b]) => rowW(a, b));
              if (widths.every((w) => w <= maxW) && (!best || Math.max(...widths) < best.max)) best = { rows, max: Math.max(...widths) };
              return;
            }
            for (let c = start + 1; c <= n - left + 1; c++) cuts(c, left - 1, [...acc, [start, c]]);
          };
          cuts(0, k, []);
          if (best) return best.rows;
        }
        return LEGEND.map((_, i) => [i, i + 1]);
      }
      function legendSwatch(D, kind, x, y) {
        if (kind === 'band') {
          D.add('marks', rect(x, y - 8, 14, 9, 'band') + `<circle class="dot req" cx="${x + 4}" cy="${y - 3.5}" r="2"/><circle class="dot req" cx="${x + 10}" cy="${y - 3.5}" r="2"/>`);
        } else if (kind === 'busy') D.add('marks', ['lo', 'h1', 'h2', 'h3', 'full'].map((h, i) => rect(x + i * 6, y - 8, 6, 9, `fill ${h}`)).join(''));
        else if (kind === 'track') D.add('marks', rect(x + 0.5, y - 7.5, 19, 8, 'swatch-track') + `<line class="target-under" x1="${x + 14}" y1="${y - 8}" x2="${x + 14}" y2="${y + 1}"/><line class="target" x1="${x + 14}" y1="${y - 8}" x2="${x + 14}" y2="${y + 1}"/>`);
        else if (kind === 'writes') D.add('marks', rect(x, y - 8, 14, 9, 'writes-key'));
        else if (kind === 'lost') D.add('marks', rect(x + 0.5, y - 7.5, 13, 8, 'seg lost'));
        else if (kind === 'zone') D.add('marks', `<line class="zone-tick" x1="${x + 4}" y1="${y - 10}" x2="${x + 4}" y2="${y + 2}"/>`);
        else xGlyph(D, x + 7, y - 3.5, 'legend', 3.5);
        D.mark({ x0: x, x1: x + 14, y0: y - 9, y1: y + 1 }, 'legend');
      }
      function drawLegend(D, x0, y, maxW) {
        const rows = legendRows(maxW);
        rows.forEach(([a, b], ri) => {
          let x = x0;
          for (const it of LEGEND.slice(a, b)) {
            legendSwatch(D, it[0], x, y + ri * 18);
            D.text(x + it[2] + 4, y + ri * 18, [[it[1], 'small']], { owner: 'legend' });
            x += itemWidth(it) + 12;
          }
        });
        return y + (rows.length - 1) * 18;
      }

      const heatOf = (u, shed) => (shed ? 'full' : u < 0.5 ? 'lo' : u < 0.7 ? 'h1' : u < 0.85 ? 'h2' : 'h3');

      /** A row of instance segments on the axis: each as wide as its share of the limit, filled to how busy it is,
       * with a 70% notch; then its shed, its limit and its ghost in the row's empty track. */
      function drawLane(D, g, id, y, L, r, hid, view, zr) {
        const t = r[id];
        const owner = `lane-${id}`;
        const h = LANE_H;
        D.meta.lanes[id] = { kind: L.kind, y, h, x1: g.xa, segs: 0 };
        if (L.kind === 'hidden') {
          D.add('lanes', rect(g.xa, y, g.xb - g.xa, h, 'lane-hidden', ' rx="3"'));
          D.mark({ x0: g.xa, x1: g.xb, y0: y, y1: y + h }, owner);
          D.text((g.xa + g.xb) / 2, y + h / 2 + 4, [['after your answer', 'small']], { anchor: 'middle', owner, textCls: 'on-box' });
          return;
        }
        if (L.kind === 'none') {
          // No replicas: an empty track as a solid hairline; dashes mean "hidden" and nothing else.
          if (FAULT.name === 'dashedNone') D.add('lanes', rect(g.xa, y, Math.min(90, g.xb - g.xa), h, 'lane-hidden', ' rx="3"'));
          else D.add('lanes', `<line class="lane-none" x1="${g.xa}" y1="${y + h / 2}" x2="${g.xb}" y2="${y + h / 2}"/>`);
          D.mark({ x0: g.xa, x1: g.xb, y0: y + h / 2 - 1, y1: y + h / 2 + 1 }, owner);
          return;
        }
        if (L.kind === 'lostAll') {
          const w = Math.min(90, g.xb - g.xa);
          D.add('lanes', rect(g.xa, y, w, h, 'seg lost', ' rx="2" data-lost-all="1"'));
          xGlyph(D, g.xa + w / 2, y + h / 2, owner, 4, 'xground on-box');
          D.mark({ x0: g.xa, x1: g.xa + w, y0: y, y1: y + h }, owner);
          return;
        }
        // The axis's gridlines run through the lane's row, behind its instances, and break around a word in its track.
        const words = [L.limitLabel?.place === 'row' && [L.limitLabel.x, L.limitLabel.x + tw(L.limitLabel.text, 'small')], L.ghost?.label?.place === 'row' && (L.ghost.label.anchor === 'end' ? [L.ghost.label.x - tw(L.ghost.label.text, 'small'), L.ghost.label.x] : [L.ghost.label.x, L.ghost.label.x + tw(L.ghost.label.text, 'small')])].filter(Boolean);
        for (const v of TICKS.slice(1, -1)) {
          const gx = r1(g.x(v));
          const cut = words.some(([a, b]) => gx > a - 3 && gx < b + 3);
          const d = cut ? `M${gx} ${y - 3}V${y + 5}M${gx} ${y + h - 3}V${y + h + 3}` : `M${gx} ${y - 3}V${y + h + 3}`;
          D.add('lanes', `<path class="gridline" d="${d}"/>`);
          D.link(cut ? [[gx, y - 3], [gx, y + 5], [gx, y + h - 3], [gx, y + h + 3]] : [[gx, y - 3], [gx, y + h / 2], [gx, y + h + 3]], 'grid');
        }
        const count = id === 'primary' ? 1 : t.up;
        const segW = t.ceiling / count;
        const shed = t.shed > 1e-9;
        const heat = heatOf(t.util, shed);
        const writesU = id === 'primary' ? t.writesUtil : id === 'replicas' ? t.replayUtil : 0;
        const ids = id === 'primary' ? ['primary'] : M.zoneLane(id, t.n, !!r.settings.zone).up.map((x) => x.id);
        const fills = [];
        const drawn = FAULT.name === 'segments' ? count - 1 : count;
        for (let i = 0; i < drawn; i++) {
          const x0 = g.x(i * segW);
          const x1 = g.x((i + 1) * segW) - (count > 1 ? 1 : 0);
          const w = x1 - x0;
          const u = Math.min(1, t.util);
          const fillW = w * u * (FAULT.name === 'fillRatio' ? 0.8 : 1);
          D.add('lanes', rect(x0, y, w, h, 'seg', `${w > 6 ? ' rx="2"' : ''} data-seg="${id}" data-inst="${ids[i]}"`));

          fills.push([x0, fillW]);

            // claim it replays nothing.
            if (fillW > 0.2) D.add('fills', rect(x0, y, fillW, h, 'split-hidden', ` data-split="${id}"`));
          } else if (writesU > 1e-9 && u > 0) {
            const ww = fillW * Math.min(1, writesU / u);
            if (ww > 0.2) D.add('fills', rect(x0, y, ww, h, 'writes-hatch', ` data-writes="${id}"`));
          }
          if (w >= 6) {
            const tx = r1(x0 + 0.7 * w);
            D.add('fills', `<path class="target-under" d="M${tx} ${y}v5M${tx} ${y + h - 5}v5"/><path class="target" data-target="${id}" d="M${tx} ${y}v5M${tx} ${y + h - 5}v5"/>`);
          }
        }
        const end = g.x(t.ceiling);
        D.add('fills', `<line class="lane-cap" x1="${r1(end)}" y1="${y - 2}" x2="${r1(end)}" y2="${y + h + 2}" data-cap="${id}"/>`);
        D.mark({ x0: g.xa, x1: end, y0: y, y1: y + h }, owner);
        Object.assign(D.meta.lanes[id], { x1: end, segs: drawn, count, fills, util: t.util });
        if (L.shed) {
          D.add('lanes', rect(L.shed.x0, y + 1, L.shed.x1 - L.shed.x0, h - 2, 'shed-block', ` data-shed="${id}"`));
          D.mark({ x0: L.shed.x0, x1: L.shed.x1, y0: y, y1: y + h }, owner);
          xGlyph(D, L.shed.xMark, y + h / 2, owner, 4, 'xground on-box');
        }
        if (L.limitLabel) D.text(L.limitLabel.x, L.limitLabel.place === 'strip' ? y + h + 15 : y + h / 2 + 4, [[L.limitLabel.text, 'small']], { owner, textCls: 'on-box', id: `limit-${id}` });
        // Where this tier's limit falls if zone A fails: a dashed critical tick, at rest and in the challenge.
        if (zr && hid.zoneTicks && !hid.zones) {
          const z = zr[id];
          const zl = id === 'primary' ? (z.outage ? null : z.ceiling) : z.up > 0 ? z.ceiling : null;
          if (zl !== null && zl < t.ceiling - 0.5) {
            const zx = r1(g.x(zl));
            D.add('marks', `<line class="zone-tick" data-zonetick="${id}" x1="${zx}" y1="${y - 4}" x2="${zx}" y2="${y + h + 3}"/>`);
            D.link([[zx, y - 4], [zx, y + h / 2], [zx, y + h + 3]], 'zone');
          }
        }
        if (L.ghost) {
          const x = r1(L.ghost.x);
          if (L.ghost.tick) {

            D.link([[x, y - 4], [x, y + h / 2], [x, y + h + 2]], `ghost-${id}`);
          } else D.add('top', `<g data-ghost="${id}"></g>`);
          if (L.ghost.label) D.text(L.ghost.label.x, L.ghost.label.place === 'strip' ? y + h + 15 : y + h / 2 + 4, [[L.ghost.label.text, 'small']], { owner: `ghost-${id}`, anchor: L.ghost.label.anchor, textCls: 'on-box', id: `ghost-label-${id}` });
          D.meta.ghosts.push({ id, labelled: !!L.ghost.label || L.wasInStatus !== null, old: L.ghost.old });

      }

      /** Under a lane: its instances' zones (each zone's group underlined and lettered, zone A's last, so where its
       * group starts is the limit that survives zone A; a lost group hatched at its old place), or under the primary,
       * the step from its machine's queries to its limit in requests. */
      function drawStrip(D, g, id, y, L, r, hid) {
        const t = r[id];
        const s = r.settings;
        if (id === 'primary') {
          if (L.kind !== 'normal') return;
          const xs = g.x(s.size);
          const xe = g.x(t.ceiling);
          const ay = y + 6;
          D.add('marks', `<line class="xfer-tail" x1="${r1(xs)}" y1="${y + 2}" x2="${r1(xs)}" y2="${y + 10}"/><line class="xfer" data-xfer="1" x1="${r1(xs)}" y1="${ay}" x2="${r1(xe + (xe > xs ? -1 : 1))}" y2="${ay}" marker-end="url(#xfer-head)"/>`);
          D.mark({ x0: Math.min(xs, xe) - 1, x1: Math.max(xs, xe) + 1, y0: y + 2, y1: y + 10 }, 'xfer');
          if (L.xfer) D.text(L.xfer.x, y + 11, [[L.xfer.text, 'small']], { owner: 'xfer', textCls: 'on-box', anchor: L.xfer.anchor, id: 'xfer-label' });
          return;
        }
        if (hid.zones || L.kind === 'hidden' || L.kind === 'lostAll' || !t.n) return;
        const zl = M.zoneLane(id, t.n, !!s.zone);
        const before = s.zone ? M.run({ ...s, zone: 0 })[id] : t;
        const segW = t.up > 0 ? t.ceiling / t.up : 0;
        const segW0 = before.ceiling / before.up;
        const groups = [];
        zl.up.forEach((x, i) => {
          const last = groups[groups.length - 1];
          const a = g.x(i * segW);
          const b = g.x((i + 1) * segW);
          if (last && last.zone === x.zone && !last.lost) last.x1 = b;
          else groups.push({ zone: x.zone, x0: a, x1: b, lost: false });
        });
        for (const x of zl.lost) {
          const j = zl.order.findIndex((o) => o.id === x.id);
          const a = g.x(j * segW0);
          const b = g.x((j + 1) * segW0);
          D.add('lanes', rect(a, y + 1, b - a - 1, 5, 'seg lost', ` data-lost="${id}" data-inst="${x.id}"`));
          const last = groups[groups.length - 1];
          if (last && last.lost) last.x1 = b;
          else groups.push({ zone: 'A', x0: a, x1: b, lost: true });
        }
        let prevEnd = -Infinity;
        for (const gr of groups) {
          if (!gr.lost) D.add('lanes', `<line class="zone-line" x1="${r1(gr.x0 + 1)}" y1="${y + 2.5}" x2="${r1(gr.x1 - 2)}" y2="${y + 2.5}"/>`);
          D.mark({ x0: gr.x0, x1: gr.x1, y0: y + 1, y1: y + 6 }, `zone-${id}`);
          const cx = (gr.x0 + gr.x1) / 2;
          const w = tw(gr.zone, 'small');
          if (cx - w / 2 < prevEnd + 3 || cx + w / 2 > g.xb + 6) continue;
          D.text(cx, y + 15, [[gr.zone, 'small']], { anchor: 'middle', owner: `zone-${id}`, textCls: 'on-box', data: ` data-zone="${gr.zone}"` });
          prevEnd = cx + w / 2;
        }
        D.meta.lanes[id].zones = groups.map((gr) => ({ zone: gr.zone, x0: gr.x0, lost: gr.lost }));
      }

      function drawHeader(D, g, top, hd, steps, owner) {
        if (hd.one) {
          D.text(g.xa, top + 27, [[hd.name, 'label']], { owner, textCls: 'on-box' });
          D.text(g.xa + tw(hd.name, 'label') + 10, top + 27, hd.fleet[0], { owner, textCls: 'on-box', id: `fleet-${owner}` });
        } else {
          D.text(g.xa, top + 19, [[hd.name, 'label']], { owner, textCls: 'on-box' });
          // Lines under the first clear the steppers' 44 px targets by 2 px more.
          hd.fleet.forEach((ln, i) => D.text(g.xa, top + 36 + i * LINE + (i ? 2 : 0), ln, { owner, textCls: 'on-box', id: i ? `fleet-${owner}-${i}` : `fleet-${owner}` }));
        }
        steps.forEach((st, i) => {
          const x = g.stepX + i * 44;
          D.hit('step', x, top, 44, 44, { owner: `step-${st.id}-${i}`, label: st.label, glyph: i ? '+' : '−', disabled: st.disabled, describedby: `tier-${owner}` });
          D.mark({ x0: x + 6, x1: x + 38, y0: top + 6, y1: top + 38 }, `step-${st.id}`);
        });
      }
      function drawLines(D, x, y, lines, owner, o = {}) {
        lines.forEach((ln, i) => D.text(x, y + i * LINE, ln, { owner, textCls: o.cls ?? 'on-box', id: o.id ? `${o.id}-${i}` : undefined, row: o.row }));
      }

      function buildStage(W, r, view) {
        const g = geometry(W);
        const D = new Draw(W);
        const hid = hiding(view);
        const res = reserve(W);
        const s = r.settings;
        const lw = g.xb - g.xa;
        const locked = view.phase === 'asking' || view.phase === 'playing';
        const ghostRun = view.ghost ? M.run(view.ghost) : null;
        const zr = s.zone ? null : M.run({ ...s, zone: 1 });
        const P = planStage(g, r, hid, ghostRun);
        D.label = summary(r, hid);
        D.meta.hid = hid;
        D.meta.plan = P;

        // Header: Play, the title and the legend.
        D.hit('play', g.pad - 4, 4, 44, 44, { owner: 'play' });
        D.mark({ x0: g.pad, x1: g.pad + 36, y0: 8, y1: 44 }, 'play');
        const titleX = g.pad + 46;
        const title = pick(['Requests through the tiers', 'Through the tiers'], (t) => titleX + tw(t, 'capB') <= W - g.pad);
        D.text(titleX, 31, [[title, 'capB']], { owner: 'title' });
        const oneRow = LEGEND.reduce((a, it, i) => a + itemWidth(it) + (i ? 12 : 0), 0);
        let headerBottom;
        if (titleX + tw(title, 'capB') + 20 + oneRow <= W - g.pad) {
          drawLegend(D, W - g.pad - oneRow, 31, oneRow);
          headerBottom = 46;
        } else headerBottom = drawLegend(D, g.pad, 66, W - 2 * g.pad) + 8;

        // Traffic: the handle sets the offered rate on the shared axis; the stream starts at its width.
        const yL = headerBottom + 20;
        D.text(g.xa, yL, [['Traffic', 'label']], { owner: 'traffic' });
        const valueX = g.xa + tw('Traffic', 'label') + 8;
        const unit = pick([' requests a second', ' requests/s', '/s'], (u) => valueX + tw(fn(s.traffic) + u, 'capB') <= W - g.pad);
        D.text(valueX, yL, [[fn(s.traffic) + unit, 'capB']], { owner: 'traffic', id: 'traffic-value' });
        const yT = yL + 30;
        const tMax = M.TRAFFIC[M.TRAFFIC.length - 1];
        D.add('marks', `<line class="rail" x1="${g.x(0)}" y1="${yT}" x2="${r1(g.x(tMax))}" y2="${yT}"/><line class="rail-fill" x1="${g.x(0)}" y1="${yT}" x2="${r1(g.x(s.traffic))}" y2="${yT}"/>`);
        for (const t of M.TRAFFIC) if (t !== s.traffic) D.add('marks', `<circle class="stop" cx="${r1(g.x(t))}" cy="${yT}" r="1.5"/>`);
        D.hit('handle', r1(g.x(s.traffic) - 22), yT - 22, 44, 44, { owner: 'handle', label: 'Traffic, requests a second' });
        D.mark({ x0: g.x(0) - 2, x1: g.x(tMax) + 2, y0: yT - 3, y1: yT + 3 }, 'handle');
        const yTick = yT + 33;
        for (const v of TICKS) D.text(g.x(v), yTick, [[fn(v), 'small']], { anchor: v ? 'middle' : 'start', owner: 'axis', data: ' data-xtick="1"' });
        D.region('traffic', { x: g.pad, y: yL - 16, w: W - 2 * g.pad, h: yTick + 6 - (yL - 16) });

        // The boxes, top to bottom, with the stream in the gaps between them. Each block's lane sits at its top, where
        // the stream pours in; its zones, name, steppers and words follow, packed top-down, the slack at the box's foot.
        let y = yTick + 10;
        const boxes = [];
        const gaps = [];
        const stubs = [];
        const block = (id, top, steps, stub) => {
          const b = P[id];
          const laneY = top + LANE_Y;
          drawLane(D, g, id, laneY, b.L, r, hid, view, zr);
          if (stub !== null) stubs.push({ y0: top, y1: laneY, id });
          drawStrip(D, g, id, laneY + LANE_H, b.L, r, hid);
          const hTop = laneY + LANE_H + STRIP_H;
          drawHeader(D, g, hTop, b.header, steps, id);
          const base = hTop + b.header.h + 13;
          drawLines(D, g.xa, base, b.status, id, { id: `cap-${id}`, row: id });
          let last = base + (b.status.length - 1) * LINE;
          if (b.conv.length) {
            drawLines(D, g.xa, last + LINE, b.conv, id, { id: `conv-${id}`, row: id });
            last += b.conv.length * LINE;
          }
          return last;
        };
        const boxRegion = (id, top, bottom) => D.region(id, { x: g.pad - 4, y: top - 4, w: W - 2 * g.pad + 8, h: bottom - top + 8 });

        // Load balancers.
        const lbTop = y + g.gap;
        gaps.push({ y0: y, y1: lbTop, flow: r.offered, shedNext: r.lb.shed, nextId: 'lb' });
        block('lb', lbTop, [
          { id: 'lb', label: 'Fewer load balancers', disabled: locked || s.lb <= 1 },
          { id: 'lb', label: 'More load balancers', disabled: locked || s.lb >= M.LB_MAX },
        ], true);
        const lbBottom = lbTop + res.lb + PAD_BOTTOM;
        boxes.push({ id: 'lb', top: lbTop, bottom: lbBottom });

        // App servers, with one server's worker pool.
        const appTop = lbBottom + g.gap;
        gaps.push({ y0: lbBottom, y1: appTop, flow: r.lb.passed, shedNext: r.app.shed, nextId: 'app' });
        let yy = block('app', appTop, [
          { id: 'app', label: 'Fewer app servers', disabled: locked || s.app <= 1 },
          { id: 'app', label: 'More app servers', disabled: locked || s.app >= M.APP_MAX },
        ], true);
        // The pool: 100 workers on one server, in ten blocks of ten, named beside it (or above it where that does not
        // fit); Little's law under it.
        const mw = meterWidth(g);
        yy += LINE + 6;
        if (!P.poolBeside) {
          D.text(g.xa, yy, [[POOL_LABEL[1], 'label']], { owner: 'workers', textCls: 'on-box', row: 'app' });
          yy += 15;
        }
        const wTop = yy - 9;
        const hideW = hid.lanes.has('workers') || hid.lanes.has('app');
        const filled = r.app.up && !hideW ? Math.round((r.app.inFlight / M.WORKERS) * 100) : 0;
        const cellW = (mw - 9 * 2) / 10;
        const critical = poolBinds(r) || (FAULT.name === 'meterCritical' && r.app.need > M.WORKERS + 1e-9);
        const meterHeat = critical ? 'full' : heatOf(r.app.inFlight / M.WORKERS, false);
        for (let b = 0; b < 10; b++) {
          const bx = g.xa + b * (cellW + 2);
          D.add('lanes', rect(bx, wTop, cellW, 10, hideW ? 'lane-hidden' : 'meter-cell'));
          const f = Math.max(0, Math.min(10, filled - b * 10)) / 10;
          if (f > 0) D.add('fills', rect(bx, wTop, cellW * f, 10, `fill ${meterHeat}`, ' data-workers="1"'));
        }
        D.mark({ x0: g.xa, x1: g.xa + mw, y0: wTop, y1: wTop + 10 }, 'workers');
        if (P.poolBeside) D.text(g.xa + mw + 10, yy, [[POOL_LABEL[0], 'label']], { owner: 'workers', textCls: 'on-box', row: 'app' });
        yy += LINE + 2;
        drawLines(D, g.xa, yy, P.pool, 'workers', { id: 'workers', row: 'app' });
        D.region('workers', { x: g.xa - 6, y: wTop - 6 - (P.poolBeside ? 0 : 15), w: lw + 12, h: yy + (P.pool.length - 1) * LINE + 6 - (wTop - 6 - (P.poolBeside ? 0 : 15)) });
        const appBottom = appTop + res.app + PAD_BOTTOM;
        boxes.push({ id: 'app', top: appTop, bottom: appBottom });

        // The database: the primary (machine size) and the replicas, one admission, then the cache line.
        const dbTop = appBottom + g.gap;

        yy = block('primary', dbTop, [
          { id: 'size', label: 'A smaller database machine', disabled: locked || s.size <= M.SIZES[0] },
          { id: 'size', label: 'A bigger database machine', disabled: locked || s.size >= M.SIZES[M.SIZES.length - 1] },
        ], true);
        D.region('primary', { x: g.pad + 6, y: dbTop + 4, w: W - 2 * g.pad - 12, h: yy + 8 - dbTop - 4 });
        const repTop = yy + DIVIDER_GAP;
        D.add('lanes', `<line class="divider" x1="${g.xa}" y1="${repTop}" x2="${g.xb}" y2="${repTop}"/>`);

          { id: 'replicas', label: 'Fewer read replicas', disabled: locked || s.replicas <= 0 },

          D.meta.gaps.push({ y0: gp.y0, y1: gp.y1, x0: g.xa, x1, xPass, nextId: gp.nextId, xMark: gp.xMark });

        for (const st of stubs) for (const [x0, w] of D.meta.lanes[st.id]?.fills ?? []) if (w > 0.2) D.add('lanes', rect(x0, st.y0 + 0.5, w, st.y1 - st.y0 - 0.5, 'band stub', ` data-tooth="${st.id}"`));
        if (view.particles) drawParticles(D, g, gaps, view);

        // nothing shed, in the gap above the busiest lane's end.
        if (view.climax) {

          const cy = FAULT.name === 'ringOver' && lane ? lane.y + lane.h / 2 : gp ? gp.y1 - 11 : null;
          if (cx !== undefined && cx !== null && cy !== null) D.add('top', `<circle class="landing" data-ring="${FAULT.name === 'ringOver' ? 'lane' : 'gap'}" cx="${r1(cx)}" cy="${r1(cy)}" r="9"/>`);
        }

        return { D, H, g };
      }

      /** Seeded so a frame always draws the same dots. */
      function mulberry32(a) {

            const across = [];

            const xs = [x + w - TAG.w - 16, x + 16, ...across, x + w - TAG.w, D.W - 3 - TAG.w];

              const box = { x0: tx, x1: tx + TAG.w, y0: ty, y1: ty + TAG.h };
              if (tx < 3 || tx + TAG.w > D.W - 3 || ty < 3 || ty + TAG.h > H - 3) continue;

              D.add('top', `<text x="${r1(tx + TAG.w / 2)}" y="${r1(ty + 12)}" text-anchor="middle" data-owner="look" data-ground="1"><tspan class="t-look">LOOK HERE</tspan></text>`);
              D.mark(box, 'look');

      // ---------- Mockup states.

      const SOL = { ...M.EXPERIMENTS[5].setup, ...M.CHALLENGE_SOLUTION };
      const STATES = {
        default: { s: B },
        calm: { s: { ...B, traffic: 2000 } },
        cached: { s: { ...B, cache: 1 }, ghost: B },
        scaled: { s: SOL },
        zone: { s: { ...SOL, zone: 1 }, ghost: SOL },
        slow: { s: { ...M.SETUP.slow, slow: 1 }, ghost: M.SETUP.slow },
        overload: { s: { ...B, traffic: 20000 } },
        outage: { s: { traffic: 6000, lb: 1, app: 4, size: 4000, replicas: 0, cache: 0, zone: 1, slow: 0 } },
        replicas: { s: { traffic: 14000, lb: 4, app: 12, size: 8000, replicas: 6, cache: 0, zone: 0, slow: 0 }, ghost: { traffic: 14000, lb: 4, app: 12, size: 8000, replicas: 5, cache: 0, zone: 0, slow: 0 } },
        playing: { s: B, ramp: { from: 1000, at: 7000 } },
        describe: { s: B, describe: true },
        reduced: { s: B, reduced: true },
        ask: { exp: 0, phase: 'asking' },
        reveal: { exp: 1, phase: 'revealed' },
        challenge: { exp: 5, phase: 'challenge' },
      };
      const actSettings = (spec) => ({ ...spec.setup, ...(spec.act?.set ?? {}) });
      /** The lanes an act changes: their limit, load, instances or shed differ between the setup and the act. */
      function changedLanes(a, b) {

          const y = b[id];
          if (Math.abs(x.ceiling - y.ceiling) > 1e-6 || Math.abs(x.util - y.util) > 1e-9 || x.up !== y.up || x.shed !== y.shed) out.push(id);
        }
        if (Math.abs(a.app.inFlight - b.app.inFlight) > 1e-9 || a.app.need !== b.app.need) out.push('workers');
        return out;
      }
      /** The climax of a ramp: the tier that is first full, at the stop where it fills. */
      function rampClimax(s, from, at) {
        const plan = M.rampPlan(s, from, at);
        return plan.climax >= 0 && plan.stops[plan.climax] === at ? plan.full : null;
      }
      /** Reduced motion's ring: the first tier to shed on the way up, or the busiest when none does. */
      function restRing(s) {
        const plan = M.rampPlan(s, M.TRAFFIC[0], s.traffic);
        return plan.full ?? busiestOf(M.run(s))[0]?.id ?? null;
      }
      function viewOf(name) {
        const st = STATES[name] ?? STATES.default;
        const expParam = params.get('exp');
        const expIdx = expParam !== null && st.exp !== undefined ? Number(expParam) - 1 : st.exp;
        if (expIdx === undefined) {
          const v = { s: st.s, hide: [], phase: 'rest', ghost: st.ghost ?? null, describe: !!st.describe, reduced: !!st.reduced };
          if (st.reduced) Object.assign(v, { climax: restRing(st.s), ringAtRest: true });
          if (st.ramp) return { ...v, s: { ...st.s, traffic: st.ramp.at }, particles: true, climax: rampClimax(st.s, st.ramp.from, st.ramp.at), rampTo: st.s.traffic };
          return v;
        }
        const spec = M.EXPERIMENTS[expIdx];
        if (spec.goal) return expView(spec, params.get('start') === '1' ? 'start' : 'challenge');
        const phase = params.get('phase') === 'playing' && st.phase === 'asking' ? 'playing' : st.phase;

      }

      const PLAY_ANCHOR = { tenfold: 'lb', cache: 'db', replay: 'db', zone: 'lb', slow: 'app' };
      /** The reveal's anchor: its topmost focus region. */
      const revealAnchor = (D, focus) => focus.reduce((a, id) => (!a || (D.regions[id]?.[0]?.y ?? Infinity) < D.regions[a][0].y ? id : a), null);
      /** One experiment's view: asking (from whatever setting came before, which must leave no trace), the answer's play

        }

      function controlsHtml(r, view) {

${toggle(s.cache, 'Cache reads', HINTS.cache())}
${toggle(s.zone, 'Zone A down', HINTS.zone())}
${toggle(s.slow, 'Slow queries', HINTS.slow())}</div></fieldset>

      }
      function noticeOf(r, view) {

        if (view.reduced) return rampStory(r.settings, M.TRAFFIC[0]);
        if (view.phase === 'rest' && view.ghost) {

      }
      const ICON_RIGHT = '<svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--g-success-line)"/><path d="M6 10.2l2.6 2.6 5.2-5.6" fill="none" stroke="var(--g-surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

            if (v > 1e-9 && !(line.includes(fq(v)) && line.includes({ lb: 'balancer', app: 'server', replicas: 'replica', primary: 'primary' }[id]))) out.push(`the zone line leaves out ${id}'s ${fq(v)}: "${line}"`);
        }
        return out;
      }
      window.pageWords = function (stride = 7) {
        const out = [];
        for (let i = 0; i < ALL.length; i += stride) for (const f of wordFindings(ALL[i])) out.push(`${show(ALL[i])}: ${f}`);
        return out;
      };
      /** Each new rule against its own planted bug: the rule must report it. */
      window.plantedFaults = function (W = 252) {
        const well = document.getElementById('well');
        const out = [];
        const fresh = (name, run) => {
          const before = run();
          FAULT.name = name;
          const after = run();
          FAULT.name = null;
          const added = after.filter((f) => !before.includes(f));
          out.push([name, added.length > 0, added[0] ?? '']);
        };
        const layout = (name, view) =>
          fresh(name, () => {
            well.style.width = W + 2 + 'px';
            const r = M.run(view.s);
            const { D } = drawInto(well, W, r, view);
            const found = check(well, D, r, view);
            well.style.width = '';
            return found;
          });
        const words = (name, s) => fresh(name, () => wordFindings(s));
        const rest = (s, extra = {}) => ({ s, hide: [], phase: 'rest', ...extra });
        layout('segments', rest(B));
        layout('fillRatio', rest(B));
        layout('meterCritical', rest({ ...B, traffic: 20000 }));
        layout('primaryReads', rest(STATES.outage.s));
        layout('fleetEach', rest({ ...M.SETUP.slow, slow: 1 }));
        layout('unitless', rest(B));
        layout('dashedNone', rest({ ...B, replicas: 0 }));
        layout('ringOver', rest(B, { climax: restRing(B), ringAtRest: true }));
        layout('ghostLabel', rest({ ...B, cache: 1 }, { ghost: B }));
        words('eachOne', { ...B, replicas: 1 });
        words('atZero', { traffic: 6000, lb: 1, app: 4, size: 8000, replicas: 2, cache: 0, zone: 1, slow: 0 });
        words('fullBusy', B);
        words('fromTo', { ...B, traffic: 1000 });
        words('zoneSum', { ...M.SETUP.challenge, lb: 2, app: 1, size: 8000, replicas: 2 });
        words('tie', { traffic: 10000, lb: 3, app: 10, size: 8000, replicas: 2, cache: 1, zone: 0, slow: 0 });
        words('noTier100', { traffic: 1000, lb: 1, app: 5, size: 8000, replicas: 2, cache: 1, zone: 0, slow: 1 });
        words('primaryReads', STATES.outage.s);
        fresh('toggleHint', () => {
          renderView(viewOf('default'));
          return htmlFindings();
        });
        renderView(viewOf(params.get('state') ?? 'default'));
        return out;
      };
      window.heights = function (widths, stride = 97) {
        const out = {};
        for (const W of widths) {
          const hs = new Set();
          for (let i = 0; i < ALL.length; i += stride) hs.add(buildStage(W, M.run(ALL[i]), { s: ALL[i], hide: [], phase: 'rest' }).H);
          for (const s of RESERVE_SET) hs.add(buildStage(W, M.run(s), { s, hide: [], phase: 'rest' }).H);
          for (const spec of M.EXPERIMENTS)
            for (const phase of spec.goal ? ['challenge', 'start'] : ['asking', 'playing', 'revealed']) {
              const v = expView(spec, phase);
              hs.add(buildStage(W, M.run(v.s), v).H);
            }
          out[W] = [...hs];
        }
        return out;
      };
      window.stageHeight = (W, s = B) => buildStage(W, M.run(s), { s, hide: [], phase: 'rest' }).H;
      /** The stage height at every pixel of width, as the steps where it changes (the height is a function of width). */
      window.heightSteps = function (from = 248, to = 760) {
        const out = [];
        let last = null;
        for (let W = from; W <= to; W++) {
          const H = window.stageHeight(W);
          if (H !== last) out.push([W, H]);
          last = H;
        }
        return out;
      };
      window.widgetHeight = () => document.getElementById('widget').getBoundingClientRect().height;
      /** The stage's top for every combination of the three conditions: one value, so a toggle never moves the picture. */
      window.conditionTops = function () {
        const tops = new Set();
        for (const cache of [0, 1])
          for (const zone of [0, 1])
            for (const slow of [0, 1]) {
              renderView({ s: { ...B, cache, zone, slow }, hide: [], phase: 'rest' });
              tops.add(Math.round(document.querySelector('.stage').getBoundingClientRect().top * 10) / 10);
            }
        renderView(viewOf(params.get('state') ?? 'default'));
        return [...tops];
      };
      /** Describe's table scrolls inside its box only when it must: at phone widths it fits. */
      window.describeFits = function () {
        renderView({ s: STATES.zone.s, hide: [], phase: 'rest', describe: true });
        const box = document.querySelector('.table-box');
        const fits = box ? box.scrollWidth <= box.clientWidth + 0.5 : true;
        renderView(viewOf(params.get('state') ?? 'default'));
        return fits;
      };
      window.renderState = (name) => renderView(viewOf(name));
      /** The page scroll that brings the current play's or reveal's anchor, with the stream gap above it, 8 px under a
       * 56 px app header (the one-column layout's move when a choice starts a play, and at the reveal). */
      window.anchorScroll = () => {
        const { D, view } = window.__last;
        const g = geometry(D.W);
        let top;
        if (view.phase === 'playing') top = D.meta.boxes.find((b) => b.id === view.anchor).top - g.gap;
        else if (view.phase === 'revealed') top = D.regions[revealAnchor(D, view.focus)][0].y;
        else return 0;
        const well = document.getElementById('well').getBoundingClientRect().top + window.scrollY;
        return Math.max(0, Math.round(well + top - 64));
      };

      const stateName = params.get('state') ?? 'default';
      Promise.all([
        document.fonts.load('600 11px "Inter Variable"'),
        document.fonts.load('500 13px "Inter Variable"'),
        document.fonts.load('600 13px "Inter Variable"'),
        document.fonts.load('500 11px "Inter Variable"'),
        document.fonts.load('700 11px "Inter Variable"'),
        document.fonts.load('600 17px "JetBrains Mono Variable"'),
      ]).then(() => {
        const first = render(stateName);
        const well = document.getElementById('well');
        const issues = [...check(well, first.D, first.r, first.view), ...htmlFindings()];
        render(stateName);
        window.__collisions = issues;
        document.body.dataset.ready = '1';
      });
    </script>
  </body>
</html>
