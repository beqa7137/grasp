<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quorum widget mockup</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url(fonts/inter-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        src: url(fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 800;
        font-display: block;
      }
      /* The app's tokens (apps/app/src/_theme.scss, styles.scss): light is the base, dark overrides. */
      :root {
        color-scheme: light;
        --g-bg: #f4f5f9;
        --g-surface: #ffffff;
        --g-raised: #ffffff;
        --g-sunken: #eef0f5;
        --g-line: #dfe2ea;
        --g-line-strong: #c6cbd6;
        --g-stroke: #707889;
        --g-text: #161a23;
        --g-text-rgb: 22, 26, 35;
        --g-muted: #4a5263;
        --g-faint: #5c6477;
        --g-on-fill: #ffffff;
        --g-warn-ink: #6e4200;
        --g-danger-ink: #9d1630;
        --g-found-ink: #02583f;
        --g-accent: #5846dc;
        --g-accent-rgb: 88, 70, 220;
        --g-accent-soft: rgba(88, 70, 220, 0.14);
        --g-found: #036b4c;
        --g-danger: #c3203d;
        --g-danger-rgb: 195, 32, 61;
        --g-warn: #945800;
        --g-warn-rgb: 148, 88, 0;
        --g-success-ink: var(--g-found-ink);
        --g-success-line: var(--g-found);
        --g-success-soft: rgba(3, 107, 76, 0.12);
        --g-danger-soft: rgba(195, 32, 61, 0.12);
        --g-warn-soft: rgba(148, 88, 0, 0.12);
        --g-viz-stage: #f7f8fb;
        --g-viz-current: #0b74ad;
        --g-viz-current-soft: rgba(11, 116, 173, 0.16);
        --g-viz-considering: #c77700;
        --g-viz-considering-soft: rgba(199, 119, 0, 0.14);
        --g-viz-final: #12925f;
        --g-viz-final-soft: rgba(18, 146, 95, 0.14);
        --g-viz-final-ink: var(--g-found-ink);
        --g-viz-discarded-ink: #687082;
        --g-viz-critical: #d42a49;
        --g-viz-track: #d3d7e0;
        --g-shadow: 0 1px 2px rgba(var(--g-text-rgb), 0.06), 0 3px 10px rgba(var(--g-text-rgb), 0.07);
        --g-shadow-raised: 0 1px 2px rgba(var(--g-text-rgb), 0.08);
        --g-radius-xs: 6px;
        --g-radius-sm: 10px;
        --g-radius-md: 14px;
        --g-radius-pill: 999px;
        --g-text-title-m: 1.0625rem;
        --g-text-title-s: 0.9375rem;
        --g-text-body: 0.875rem;
        --g-text-body-s: 0.8125rem;
        --g-text-label: 0.6875rem;
        --g-font: 'Inter Variable', system-ui, sans-serif;
        --g-font-mono: 'JetBrains Mono Variable', ui-monospace, monospace;
        --g-focus-ring: 2px solid var(--g-accent);
      }
      :root.dark {
        color-scheme: dark;
        --g-bg: #0b0d12;
        --g-surface: #141824;
        --g-raised: #1c2130;
        --g-sunken: #0f121a;
        --g-line: #252a37;
        --g-line-strong: #343b4d;
        --g-stroke: #6b7387;
        --g-text: #e9ebf2;
        --g-text-rgb: 233, 235, 242;
        --g-muted: #8b93a8;
        --g-faint: #828a9e;
        --g-on-fill: #0b0d12;
        --g-warn-ink: #f3e6b3;
        --g-danger-ink: #ffb3bd;
        --g-found-ink: #3ddc97;
        --g-accent: #9d8cff;
        --g-accent-rgb: 157, 140, 255;
        --g-accent-soft: rgba(157, 140, 255, 0.14);
        --g-found: #3ddc97;
        --g-danger: #ff5d73;
        --g-danger-rgb: 255, 93, 115;
        --g-warn: #ffb547;
        --g-warn-rgb: 255, 181, 71;
        --g-success-soft: rgba(61, 220, 151, 0.12);
        --g-danger-soft: rgba(255, 93, 115, 0.12);
        --g-warn-soft: rgba(255, 181, 71, 0.12);
        --g-viz-stage: #0e1118;
        --g-viz-current: #1f9fd0;
        --g-viz-current-soft: rgba(31, 159, 208, 0.16);
        --g-viz-considering: #c08420;
        --g-viz-considering-soft: rgba(192, 132, 32, 0.18);
        --g-viz-final: #22ad74;
        --g-viz-final-soft: rgba(34, 173, 116, 0.18);
        --g-viz-final-ink: var(--g-found);
        --g-viz-discarded-ink: var(--g-muted);
        --g-viz-critical: #e5485f;
        --g-viz-track: #2a3040;
        --g-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        --g-shadow-raised: var(--g-shadow);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--g-bg);
        color: var(--g-text);
        font: 400 var(--g-text-body) / 1.5 var(--g-font);
        font-variant-ligatures: none;
        -webkit-font-smoothing: antialiased;
        overflow-wrap: break-word;
      }
      button {
        font-size: 0.8333rem;
      }
      .page {
        max-width: 1048px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      .eyebrow {
        margin: 0;
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
      }
      h1 {
        margin: 4px 0 14px;
        font: 600 1.25rem/1.3 var(--g-font);
      }
      .panel {
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background: var(--g-surface);
        box-shadow: var(--g-shadow);
        padding: 16px;
      }
      .widget {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }
      .main,
      .experiments {
        display: contents;
      }
      .controls {
        order: 1;
      }
      .stage {
        order: 2;
        min-width: 0;
      }
      .dock {
        order: 3;
      }
      .describe {
        order: 4;
      }
      .heading,
      .cards {
        order: 5;
      }
      /* Narrow: the controls are the stage's first rows. */
      .controls {
        padding: 12px 12px 0;
        border: 1px solid var(--g-line);
        border-bottom: 0;
        border-radius: var(--g-radius-md) var(--g-radius-md) 0 0;
        background: var(--g-viz-stage);
        display: grid;
        gap: 10px;
      }
      .stage {
        margin-top: -12px;
      }
      .stage .well {
        border-top: 0;
        border-radius: 0 0 var(--g-radius-md) var(--g-radius-md);
      }
      @media (min-width: 1000px) {
        .widget {
          grid-template-columns: minmax(0, 1fr) 340px;
          grid-template-rows: auto 1fr;
          align-items: start;
          column-gap: 20px;
        }
        .main {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: 12px;
          grid-column: 1;
          grid-row: 1 / span 2;
          min-width: 0;
        }
        .controls {
          grid-column: 2;
          grid-row: 1;
          padding: 0;
          border: 0;
          background: none;
        }
        .experiments {
          display: block;
          grid-column: 2;
          grid-row: 2;
          min-width: 0;
        }
        .stage {
          margin-top: 0;
        }
        .stage .well {
          border-top: 1px solid var(--g-line);
          border-radius: var(--g-radius-md);
        }
        .dock {
          margin-top: 12px;
        }
      }
      .well {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background-color: var(--g-viz-stage);
        background-image: radial-gradient(circle, rgba(var(--g-text-rgb), 0.09) 1px, transparent 1.5px);
        background-size: 24px 24px;
        background-position: 11px 11px;
      }
      fieldset.group {
        margin: 0;
        padding: 0;
        border: 0;
        min-width: 0;
      }
      fieldset.group.n-control {
        padding: 0;
      }
      .control-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
        padding: 0;
        margin-bottom: 4px;
      }
      .segments {
        display: flex;
        gap: 4px;
      }
      .segment {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
      }
      .segment input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .segment span {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 6px;
        border-radius: var(--g-radius-sm);
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        font: 500 var(--g-text-body) / 1.15 var(--g-font);
        text-align: center;
      }
      .segment input:checked + span {
        background: var(--g-accent-soft);
        border-color: var(--g-accent);
        box-shadow: inset 0 0 0 1px var(--g-accent);
        font-weight: 600;
      }
      .segment small {
        font: 500 var(--g-text-label) var(--g-font);
        color: var(--g-muted);
      }
      .toggles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .toggles .segment span {
        flex-direction: column;
        gap: 0;
        font-size: var(--g-text-body-s);
      }
      .notice {
        margin: 0;
        min-height: 2lh;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      .play {
        position: absolute;
        top: 2px;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        z-index: 2;
      }
      .play svg {
        display: block;
        width: 36px;
        height: 36px;
        margin: 4px;
      }
      .play circle {
        fill: var(--g-raised);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .play path {
        fill: var(--g-accent);
      }
      .play:disabled {
        cursor: default;
        opacity: 0.55;
      }
      .replicas {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .replicas > * {
        pointer-events: auto;
      }
      .card-hit {
        position: absolute;
        padding: 0;
        border: 0;
        background: transparent;
        border-radius: 8px;
        cursor: pointer;
        z-index: 1;
      }
      .card-hit:focus-visible {
        outline: var(--g-focus-ring);
        outline-offset: 3px;
      }
      .card-hit[aria-disabled='true'] {
        cursor: default;
      }
      .handle {
        position: absolute;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        cursor: ew-resize;
        z-index: 2;
      }
      .handle .knob {
        width: 14px;
        height: 30px;
        border-radius: var(--g-radius-pill);
        background: var(--g-raised);
        border: 2px solid var(--g-accent);
        box-shadow: var(--g-shadow-raised);
      }
      .hint {
        position: absolute;
        z-index: 3;
        padding: 4px 8px;
        border-radius: var(--g-radius-xs);
        background: var(--g-text);
        color: var(--g-viz-stage);
        font: 500 var(--g-text-label) / 1.3 var(--g-font);
        white-space: nowrap;
        pointer-events: none;
      }
      /* Drawing roles (feed-stage.scss): text sits on a stage-coloured halo. */
      svg.draw {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        overflow: visible;
      }
      svg.draw text {
        paint-order: stroke;
        stroke: var(--g-viz-stage);
        stroke-width: 3px;
        stroke-linejoin: round;
      }
      svg.draw text.on-card {
        stroke: var(--g-raised);
      }
      svg.draw text.on-chip {
        stroke: none;
      }
      .t-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: var(--g-muted);
      }
      .t-cap {
        font: 500 var(--g-text-body-s) var(--g-font);
        fill: var(--g-muted);
      }
      .t-capB {
        font: 600 var(--g-text-body-s) var(--g-font);
        fill: var(--g-text);
      }
      .t-small {
        font: 500 var(--g-text-label) var(--g-font);
        font-variant-numeric: tabular-nums;
        fill: var(--g-muted);
      }
      .t-smallB {
        font: 700 var(--g-text-label) var(--g-font);
        font-variant-numeric: tabular-nums;
        fill: var(--g-text);
      }
      .t-mono {
        font: 600 var(--g-text-label) var(--g-font-mono);
        font-variant-numeric: tabular-nums;
        fill: var(--g-text);
      }
      .t-name {
        font: 600 15px var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-nameS {
        font: 600 13px var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-head {
        font: 600 var(--g-text-title-m) var(--g-font-mono);
        font-variant-numeric: tabular-nums;
        fill: var(--g-text);
      }
      .t-pill {
        font: 600 var(--g-text-body-s) var(--g-font);
        fill: var(--g-text);
      }
      .ink {
        fill: var(--g-text);
      }
      .muted {
        fill: var(--g-muted);
      }
      .good {
        fill: var(--g-viz-final-ink);
      }
      .bad {
        fill: var(--g-danger-ink);
      }
      .warn {
        fill: var(--g-warn-ink);
      }
      .accent {
        fill: var(--g-accent);
      }
      .regular {
        font-weight: 500;
      }
      .rule {
        stroke: var(--g-line);
      }
      .box {
        fill: var(--g-raised);
        stroke: var(--g-line-strong);
      }
      .box.dashed {
        stroke-dasharray: 4 3;
      }
      .box.idle {
        fill: none;
        stroke: var(--g-line-strong);
        stroke-dasharray: 3 3;
      }
      .box.asked {
        stroke: var(--g-viz-considering);
        stroke-width: 1.5;
      }
      .box.both {
        stroke: var(--g-viz-final);
        stroke-width: 2.5;
      }
      .card {
        fill: var(--g-raised);
        stroke: var(--g-line-strong);
        stroke-width: 1;
      }
      .card.down {
        fill: url(#hatch);
        stroke-dasharray: 4 3;
      }
      .card.mid {
        stroke: var(--g-viz-critical);
        stroke-dasharray: 4 3;
      }
      .card.both {
        stroke: var(--g-viz-final);
        stroke-width: 2.5;
      }
      .both-ring {
        fill: none;
        stroke: var(--g-viz-final);
        stroke-width: 1.5;
        stroke-opacity: 0.55;
      }
      .card-fill-down {
        fill: var(--g-sunken);
      }
      .hatch-line {
        stroke: var(--g-viz-discarded-ink);
        stroke-opacity: 0.35;
        stroke-width: 1.5;
      }
      .chip {
        fill: var(--g-raised);
        stroke: var(--g-line-strong);
      }
      .chip.new {
        fill: var(--g-viz-final-soft);
        stroke: var(--g-viz-final);
      }
      .chip.old {
        fill: var(--g-sunken);
        stroke: var(--g-line-strong);
      }
      .chip.unknown {
        fill: var(--g-viz-stage);
        stroke: var(--g-line-strong);
        stroke-dasharray: 3 2;
      }
      .chip.asked {
        fill: var(--g-viz-stage);
        stroke: var(--g-viz-considering);
        stroke-width: 1.5;
      }
      .chip.sent {
        fill: var(--g-viz-stage);
        stroke: var(--g-viz-current);
        stroke-opacity: 0.6;
      }
      .chip.wth {
        stroke: var(--g-viz-current);
        stroke-opacity: 1;
        stroke-width: 2;
      }
      .chip.quiet {
        fill: var(--g-viz-stage);
        stroke: var(--g-line);
      }
      .chip-new-ink {
        fill: var(--g-viz-final-ink);
      }
      .link {
        fill: none;
        stroke-linecap: round;
      }
      .link.write {
        stroke: var(--g-viz-current);
        stroke-width: 2;
      }
      .link.write.weak {
        stroke-width: 1.25;
        stroke-opacity: 0.45;
      }
      .link.pending {
        stroke: var(--g-stroke);
        stroke-width: 1.25;
        stroke-dasharray: 5 4;
      }
      .link.unsent {
        stroke: var(--g-line-strong);
        stroke-width: 1.25;
        stroke-dasharray: 1 4;
      }
      .link.read {
        stroke: var(--g-viz-considering);
        stroke-width: 2;
      }
      .link.read.weak {
        stroke-width: 1.25;
        stroke-opacity: 0.4;
      }
      .link.dead {
        stroke: var(--g-line-strong);
        stroke-width: 1.25;
        stroke-dasharray: 4 4;
      }
      .link.repair {
        stroke: var(--g-viz-final);
        stroke-width: 1.75;
        stroke-dasharray: 5 3;
      }
      .xmark {
        stroke: var(--g-viz-critical);
        stroke-width: 2;
        stroke-linecap: round;
        fill: none;
      }
      .xground {
        fill: var(--g-viz-stage);
      }
      .pip {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1.25;
      }
      .next-pip {
        fill: none;
        stroke: var(--g-accent);
        stroke-width: 1.5;
        stroke-dasharray: 2 2;
      }
      .pip.on {
        fill: var(--g-text);
        stroke: var(--g-text);
      }
      .pause {
        fill: var(--g-warn);
      }
      .repair-glyph {
        fill: none;
        stroke: var(--g-viz-final);
        stroke-width: 1.5;
        stroke-linecap: round;
      }
      .rail {
        stroke: var(--g-viz-track);
        stroke-width: 4;
        stroke-linecap: round;
      }
      .fill {
        stroke: var(--g-accent);
        stroke-width: 4;
        stroke-linecap: round;
      }
      .stop {
        fill: var(--g-line-strong);
      }
      .pill {
        stroke-width: 1.5;
      }
      .pill.final {
        fill: var(--g-viz-final-soft);
        stroke: var(--g-viz-final);
      }
      .pill.critical {
        fill: var(--g-danger-soft);
        stroke: var(--g-viz-critical);
      }
      .pill.warn {
        fill: var(--g-warn-soft);
        stroke: var(--g-warn);
      }
      .pill.neutral {
        fill: var(--g-raised);
        stroke: var(--g-line-strong);
      }
      .pill.hidden {
        fill: var(--g-viz-stage);
        stroke: var(--g-stroke);
        stroke-dasharray: 4 3;
      }
      .glyph {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .glyph.final {
        stroke: var(--g-viz-final);
      }
      .glyph.critical {
        stroke: var(--g-viz-critical);
      }
      .glyph.warn {
        stroke: var(--g-warn);
      }
      .glyph.neutral,
      .glyph.hidden {
        stroke: var(--g-stroke);
      }
      .cell {
        fill: none;
        stroke: var(--g-viz-track);
      }
      .cell.member {
        fill: var(--g-viz-considering-soft);
        stroke: var(--g-viz-considering);
      }
      .cell.acked {
        fill: var(--g-viz-final);
        stroke: var(--g-viz-final);
      }
      .this-ring {
        fill: none;
        stroke: var(--g-text);
        stroke-width: 1.75;
      }
      .gridline {
        stroke: var(--g-line);
      }
      .lane {
        stroke: var(--g-viz-track);
        stroke-width: 1.5;
      }
      .axis {
        stroke: var(--g-line-strong);
      }
      .ground {
        fill: var(--g-viz-stage);
      }
      .dot.write {
        fill: var(--g-viz-current);
      }
      .dot.standin {
        fill: var(--g-viz-stage);
        stroke: var(--g-viz-current);
        stroke-width: 1.5;
      }
      .dot.read {
        fill: var(--g-viz-considering);
      }
      .dot.read.standin {
        fill: var(--g-viz-stage);
        stroke: var(--g-viz-considering);
        stroke-width: 1.5;
      }
      .ring {
        fill: none;
        stroke: var(--g-text);
        stroke-width: 1.75;
      }
      .repair-bar {
        stroke: var(--g-viz-final);
        stroke-width: 2.5;
        stroke-linecap: round;
      }
      .end-tick {
        stroke: var(--g-viz-final);
        stroke-width: 2;
      }
      .chevron {
        fill: none;
        stroke: var(--g-warn);
        stroke-width: 2;
      }
      .focus-outline {
        fill: none;
        stroke: var(--g-accent);
        stroke-width: 2;
        stroke-dasharray: 6 4;
      }
      .tag {
        fill: var(--g-viz-stage);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .t-look {

      .legend-line {

      }
      /* The experiment dock and cards (experiment-dock.component.ts, widget-check.component.ts). */
      .dock {

        display: grid;

      .g-btn {
        appearance: none;
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        border-radius: var(--g-radius-sm);
        padding: 9px 14px;

    </style>
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">System design · Consistency &amp; Quorums</p>
      <h1>Try it</h1>
      <section class="panel widget" id="widget"></section>
    </main>
    <script src="model.js"></script>
    <script>
      'use strict';
      const M = window.QuorumModel;
      const params = new URLSearchParams(location.search);
      document.documentElement.classList.toggle('dark', params.get('theme') === 'dark');

      // ---------- Text measurement, with the fonts the app ships.
      const ROLE = {
        label: { css: '600 11px "Inter Variable"', size: 11, track: 0.12, upper: true },
        cap: { css: '500 13px "Inter Variable"', size: 13 },
        capB: { css: '600 13px "Inter Variable"', size: 13 },
        small: { css: '500 11px "Inter Variable"', size: 11 },
        smallB: { css: '700 11px "Inter Variable"', size: 11 },
        mono: { css: '600 11px "JetBrains Mono Variable"', size: 11 },
        name: { css: '600 15px "JetBrains Mono Variable"', size: 15 },
        nameS: { css: '600 13px "JetBrains Mono Variable"', size: 13 },
        head: { css: '600 17px "JetBrains Mono Variable"', size: 17 },
        pill: { css: '600 13px "Inter Variable"', size: 13 },
        look: { css: '600 11px "Inter Variable"', size: 11 },
      };
      const ctx = document.createElement('canvas').getContext('2d');
      const widthCache = new Map();
      function tw(text, role) {
        const key = role + '|' + text;
        if (widthCache.has(key)) return widthCache.get(key);
        const f = ROLE[role];
        ctx.font = f.css;
        const s = f.upper ? text.toUpperCase() : text;
        const w = Math.ceil(ctx.measureText(s).width + (f.track ? f.track * f.size * s.length : 0)) + 1;
        widthCache.set(key, w);
        return w;
      }
      const partsWidth = (parts) => parts.reduce((s, [t, role, , dx = 0]) => s + tw(t, role) + dx, 0);
      function wrap(text, role, width) {
        const words = text.split(' ');
        const lines = [];
        let line = '';
        for (const w of words) {
          const next = line ? line + ' ' + w : w;
          if (tw(next, role) <= width || !line) line = next;
          else {
            lines.push(line);
            line = w;
          }
        }
        if (line) lines.push(line);
        return lines;
      }
      const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const fmt = M.formatMs;
      const tf = (v) => (v >= 1000 ? M.formatDuration(v) : fmt(v));

      // ---------- The drawing: SVG parts in layers, and the boxes placement checks against.
      class Draw {
        constructor(W) {
          this.W = W;
          this.layers = { back: [], grid: [], links: [], marks: [], text: [], top: [] };
          this.texts = [];
          this.marks = [];
          this.links = [];
          this.hits = [];
          this.regions = {};
        }
        add(layer, s) {
          this.layers[layer].push(s);
        }
        textBox(x, y, w, role, anchor = 'start') {
          const fs = ROLE[role].size;
          const x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
          return { x0, x1: x0 + w, y0: y - 0.74 * fs, y1: y + 0.22 * fs };
        }
        text(x, y, parts, o = {}) {
          if (typeof parts === 'string') parts = [[parts, o.role ?? 'small', o.cls ?? '']];
          const anchor = o.anchor ?? 'start';
          const w = partsWidth(parts);
          const role = parts.reduce((a, p) => (ROLE[p[1]].size > ROLE[a].size ? p[1] : a), parts[0][1]);
          const box = this.textBox(x, y, w, role, anchor);
          box.owner = o.owner ?? '';
          box.ground = !!o.ground;
          box.s = parts.map((p) => p[0]).join('');
          this.texts.push(box);
          const spans = parts
            .map(([t, r, cls = '', dx = 0], i) => `<tspan class="t-${r} ${cls}"${dx ? ` dx="${dx}"` : ''}>${esc(t)}</tspan>`)
            .join('');
          const attrs = `x="${x}" y="${y}" text-anchor="${anchor}"${o.owner ? ` data-owner="${o.owner}"` : ''}${o.ground ? ' data-ground="1"' : ''}${o.names ? ` data-names="${o.names}"` : ''}`;
          this.add(o.layer ?? 'text', `<text class="${o.textCls ?? ''}" ${attrs}>${spans}</text>`);
          return box;
        }
        mark(box, owner = '') {
          this.marks.push({ ...box, owner });
        }
        link(points, owner = '') {
          this.links.push({ points, owner });
        }
        hit(kind, x, y, w, h, extra = {}) {
          this.hits.push({ kind, x, y, w, h, ...extra });
        }
        region(id, box) {
          (this.regions[id] ??= []).push(box);
        }
        free(box, ignoreOwner = '', margin = 2) {
          const b = { x0: box.x0 - margin, x1: box.x1 + margin, y0: box.y0 - margin, y1: box.y1 + margin };
          const hit = (o) => !(o.x1 <= b.x0 || o.x0 >= b.x1 || o.y1 <= b.y0 || o.y0 >= b.y1);
          const mine = (o) => ignoreOwner && o.owner && o.owner.split(' ').some((t) => ignoreOwner.split(' ').includes(t));
          if (this.texts.some((t) => hit(t) && !mine(t))) return false;
          if (this.marks.some((m) => hit(m) && !mine(m))) return false;
          for (const l of this.links) {
            if (mine(l)) continue;
            if (l.points.some(([x, y]) => x > b.x0 && x < b.x1 && y > b.y0 && y < b.y1)) return false;
          }
          return b.x0 >= 2 && b.x1 <= this.W - 2;
        }
        svg(H) {
          const L = this.layers;
          return `<svg class="draw" width="${this.W}" height="${H}" viewBox="0 0 ${this.W} ${H}" role="img" aria-label="${esc(this.label ?? '')}">
<defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="card-fill-down"/><line class="hatch-line" x1="0" y1="0" x2="0" y2="6"/></pattern>
<marker id="arrow-repair" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--g-viz-final)"/></marker>
</defs>
<g>${L.back.join('')}</g><g>${L.grid.join('')}</g><g>${L.links.join('')}</g><g>${L.marks.join('')}</g><g>${L.text.join('')}</g><g>${L.top.join('')}</g></svg>`;
        }
      }
      const sampleLine = (x1, y1, x2, y2, step = 3) => {
        const n = Math.max(2, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / step));
        return Array.from({ length: n + 1 }, (_, i) => [x1 + ((x2 - x1) * i) / n, y1 + ((y2 - y1) * i) / n]);
      };
      const quad = (p0, c, p1, t) => [
        (1 - t) ** 2 * p0[0] + 2 * (1 - t) * t * c[0] + t ** 2 * p1[0],
        (1 - t) ** 2 * p0[1] + 2 * (1 - t) * t * c[1] + t ** 2 * p1[1],
      ];
      const r1 = (v) => Math.round(v * 10) / 10;

      // ---------- What the open question hides, on every surface (one map: known.md bug 1).
      function hiding(view) {
        const h = new Set(view.hide);
        const read = h.has('read');
        const verdict = h.has('verdict') || read;
        const write = h.has('write');
        const writeTime = write || h.has('write-time');
        const count = h.has('count') || write;
        return {
          count,
          verdict,
          write,
          writeTime,
          // Which replicas acked, as the strip colours them (the fan's split follows writeTime).
          ackers: count || writeTime,
          avail: h.has('availability'),
          repair: h.has('repair') || verdict,
          readTime: h.has('repair') || verdict,
          read,
        };
      }

      const STATE_WORD = { up: 'up', down: 'down', mid: 'stopped', back: 'missed v8' };
      const STATE_SHORT = { up: null, down: 'down', mid: 'stopped', back: 'missed' };
      const NEXT = { up: 'down', down: 'mid', mid: 'back', back: 'up' };
      const NEXT_PHRASE = {
        down: 'take it down',
        mid: 'make it stop mid-write',
        back: 'bring it back, having missed the write',
        up: 'bring it up',
      };
      const nameList = (names) => (names.length > 1 ? `${names.slice(0, -1).join(', ')} and ${names.at(-1)}` : names[0]);

      function pillOf(m, hid) {
        const r = m.read;
        if (hid.verdict) return { tone: 'hidden', text: 'returns ? · after your answer' };
        const time = hid.readTime ? '? ms' : tf(r.ms ?? 0);
        switch (m.verdict) {
          case 'fresh':
            return { tone: 'final', text: `returns v8 · fresh · ${time}` };
          case 'stale':
            return { tone: 'critical', text: `returns v7 · stale · ${time}` };
          case 'refused':
            return r.outcome === 'no-copy' ? { tone: 'critical', text: `write refused · read finds no copy · ${time}` } : { tone: 'neutral', text: `write refused · read ${time}` };
          case 'timed-out':
            return { tone: 'warn', text: `write timed out · returns v8 · ${time}` };
          case 'old':
            return { tone: 'neutral', text: `write timed out · read ${time}` };
          case 'failed-write':
            return { tone: 'neutral', text: `write timed out, applied nowhere · read ${time}` };
          default:
            return r.outcome === 'timed-out'
              ? { tone: 'critical', text: `read times out · ${r.reachable} answered, ${r.needed} needed` }
              : { tone: 'critical', text: `read fails · ${r.reachable} reachable, ${r.needed} needed` };
        }
      }

      function glyph(tone, x, y) {
        const c = `glyph ${tone}`;
        if (tone === 'final') return `<path class="${c}" d="M${x - 5} ${y}l3.5 3.5l6.5 -7"/>`;
        if (tone === 'critical') return `<path class="${c}" d="M${x - 4} ${y - 4}l8 8M${x + 4} ${y - 4}l-8 8"/>`;
        if (tone === 'warn') return `<circle class="${c}" cx="${x}" cy="${y}" r="5.5"/><path class="${c}" d="M${x} ${y - 3}v3l2 1.5"/>`;
        if (tone === 'hidden') return `<path class="${c}" d="M${x - 3} ${y - 3}a3 3 0 1 1 3 3v1.5M${x} ${y + 4.5}v0.1"/>`;
        return `<path class="${c}" d="M${x - 4} ${y}h8"/>`;
      }
      function xGlyph(D, cx, cy, owner, s = 4) {
        D.add('marks', `<circle class="xground" cx="${cx}" cy="${cy}" r="${s + 3}"/><path class="xmark" d="M${cx - s} ${cy - s}l${2 * s} ${2 * s}M${cx + s} ${cy - s}l${-2 * s} ${2 * s}"/>`);
        D.mark({ x0: cx - s - 2, x1: cx + s + 2, y0: cy - s - 2, y1: cy + s + 2 }, owner);
      }
      const pauseGlyph = (px, py) => `<rect class="pause" x="${px}" y="${py}" width="3" height="10" rx="1"/><rect class="pause" x="${px + 5}" y="${py}" width="3" height="10" rx="1"/>`;

      // ---------- A W or R handle block: the track with its stops, the level names and the availability caption.
      function handleBlock(D, o) {
        const { id, x, y, w, k, n, hid, letter, what, survives, succeed, verb } = o;
        D.text(x, y + 14, [[letter, 'name', 'accent'], [what, 'small', 'muted', 6]], { owner: id });
        const tx0 = x + 22;
        const tx1 = x + w - 22;
        const ty = y + 38;
        const pos = (j) => tx0 + ((j - 1) * (tx1 - tx0)) / (n - 1);
        D.add('marks', `<line class="rail" x1="${tx0}" y1="${ty}" x2="${tx1}" y2="${ty}"/><line class="fill" x1="${tx0}" y1="${ty}" x2="${pos(k)}" y2="${ty}"/>`);
        for (let j = 1; j <= n; j++) D.add('marks', `<circle class="stop" cx="${pos(j)}" cy="${ty}" r="2.5"/>`);
        for (let j = 1; j <= n; j++) {
          const name = M.levelName(j, n) ?? String(j);
          D.text(pos(j), y + 62, [[name, j === k ? 'smallB' : 'small', j === k ? 'ink' : 'muted']], { anchor: 'middle', owner: id });
        }
        const pct = M.formatNines(succeed);
        const forms = hid
          ? [`survives ? down · ${verb} succeed ?`, `survives ? down · ${verb} ?`]
          : [`survives ${survives} down · ${verb} succeed ${pct}`, `survives ${survives} down · ${verb} ${pct}`, `survives ${survives} down · ${pct}`];
        const cap = forms.find((t) => tw(t, 'small') <= w) ?? forms.at(-1);
        D.text(x, y + 81, [[cap, 'small', 'muted']], { owner: id });
        D.hit('handle', pos(k) - 22, ty - 22, 44, 44, { owner: id, label: `${letter} ${M.levelName(k, n) ?? k}` });
        D.region('handles', { x: x - 4, y: y - 2, w: w + 8, h: 90 });
      }

      // Every round trip a lane can show at this N, for reserving room for the tallest stack of dots.
      function possibleRtts(n) {
        const ow = M.ONE_WAY[n];
        const s = M.stalledIndex(n);
        const write = [...ow.map((d) => 2 * d), 2 * ow[s] + M.STALL_MS, ...M.STAND_IN_ONE_WAY.map((d) => 2 * d)];
        const back = [...ow].reverse();
        const read = [...back.map((d) => 2 * d), 2 * back[s] + M.STALL_MS, ...M.STAND_IN_ONE_WAY.map((d) => 2 * (M.CROSS_DC_ONE_WAY + d))];
        return { write, read };
      }
      const DOT_R = 4.5;
      const STACK_GAP = 2 * DOT_R + 2;
      const STACK_STEP = 10;
      // Dots closer than a dot and a gap stack upwards in time order: the earliest sits on the lane.
      function stackDots(items) {
        const sorted = [...items].sort((a, b) => a.t - b.t || a.order - b.order);
        let prev = null;
        for (const d of sorted) {
          d.k = prev && d.x - prev.x < STACK_GAP ? prev.k + 1 : 0;
          d.base = d.k ? prev.base : d;
          prev = d;
        }
        return sorted;
      }
      const tallestStack = (values, X) => Math.max(1, ...stackDots(values.map((t, i) => ({ t, x: X(t), order: i }))).map((d) => d.k + 1));

      // ---------- The stage.
      function buildStage(W, m, view) {
        const D = new Draw(W);
        const hid = hiding(view);
        const wide = W >= 520;
        const pad = wide ? 16 : 8;
        const { n, w, r } = m.settings;
        const reps = m.replicas;
        const write = m.write;
        const read = m.read;
        const readDone = read.set.length > 0;
        // Five cards under about 300 px: chips drop the unit, which the key, the axis and Describe carry.
        const unitless = !wide && n === 5 && W < 300;
        const chipMs = (v) => (unitless ? fmt(v).replace(' ms', '') : fmt(v));

        // Header: Play, the label and the line key (beside the label when wide, its own row when narrow).
        D.hit('play', pad - 6, 2, 44, 44, { owner: 'play' });
        D.text(pad + 42, 29, 'One write, then one read', { role: 'label' });
        const keyItems = [['write', 'link write'], ['read', 'link read'], ...(hid.repair ? [] : [['repair', 'link repair']])];
        let y = 48;
        if (wide) {
          let lx = W - pad;
          for (const [name, cls] of [...keyItems].reverse()) {
            D.text(lx, 29, [[name, 'small', 'muted']], { anchor: 'end' });
            lx -= tw(name, 'small') + 6;
            D.add('marks', `<line class="${cls} legend-line" x1="${lx - 16}" y1="25" x2="${lx}" y2="25"/>`);
            lx -= 30;
          }
        } else {
          let lx = pad;
          const ky = y + 8;
          for (const [name, cls] of keyItems) {
            D.add('marks', `<line class="${cls} legend-line" x1="${lx}" y1="${ky - 4}" x2="${lx + 14}" y2="${ky - 4}"/>`);
            D.text(lx + 19, ky, [[name, 'small', 'muted']]);
            lx += 19 + tw(name, 'small') + 12;
          }
          const unitNote = 'times in ms';
          const keyEnd = pad + 19 * 3 + 12 * 2 + tw('write', 'small') + tw('read', 'small') + tw('repair', 'small');
          if (unitless && W - pad - tw(unitNote, 'small') >= keyEnd + 8) D.text(W - pad, ky, [[unitNote, 'small', 'muted']], { anchor: 'end' });
          y += 16;
        }

        // Card columns.
        const gapMin = wide ? 12 : n === 5 ? 3 : 8;
        const cw = Math.min(wide ? 132 : 96, Math.floor((W - 2 * pad - (n - 1) * gapMin) / n));
        const gap = n > 1 ? (W - 2 * pad - n * cw) / (n - 1) : 0;
        const cx = (i) => r1(pad + i * (cw + gap) + cw / 2);
        const cardH = wide ? 80 : 72;
        // Narrow cards carry a short state word in the name row when there is room for one (not five on a phone).
        const cardWords = wide || cw >= 68;

        // Writer row, with the W handle beside it (wide) or above it (narrow). The status breaks only between its parts.
        const standGap = 14;
        const longest = Math.max(tw(`refused: ${M.SIZES.at(-1) - 1} live, ${M.SIZES.at(-1)} needed`, 'capB'), tw('outcome after your answer', 'capB'));
        const longestPart = Math.max(tw(`${M.SIZES.at(-1) - 1} live, ${M.SIZES.at(-1)} needed`, 'capB'), tw('after your answer', 'capB'));
        const oneLineW = longest + 24;
        const writerOneLine = wide && W - pad - (pad + oneLineW + standGap + 112 + 24) >= 200;
        const writerW = writerOneLine ? oneLineW : wide ? 156 : Math.round(Math.min((W - 2 * pad) * 0.6, Math.max(124, (W - 2 * pad) * 0.5, longestPart + 24)));
        const writerH = writerOneLine ? 84 : wide ? 92 : 88;
        let writerY;
        const wHandle = { id: 'whandle', k: w, n, hid: hid.avail, letter: 'W', what: 'acks a write waits for', survives: m.survives.write, succeed: m.avail.write, verb: 'writes' };
        if (wide) {
          writerY = y + 4;
          const hx = pad + writerW + standGap + 112 + 24;
          handleBlock(D, { ...wHandle, x: hx, y: writerY, w: W - pad - hx });
          y = writerY + writerH;
        } else {
          handleBlock(D, { ...wHandle, x: pad, y: y, w: W - 2 * pad });
          writerY = y + 92;
          y = writerY + writerH;
        }
        const wx = pad;
        D.add('marks', `<rect class="box" x="${wx}" y="${writerY}" width="${writerW}" height="${writerH}" rx="10"/>`);
        D.mark({ x0: wx, x1: wx + writerW, y0: writerY, y1: writerY + writerH }, 'writer');
        const wlabel = tw('Writer · DC A', 'label') <= writerW - 20 ? 'Writer · DC A' : 'Writer';
        D.text(wx + 12, writerY + 20, [[wlabel, 'label']], { owner: 'writer', textCls: 'on-card' });
        D.text(wx + 12, writerY + 43, [['v8', wide ? 'name' : 'nameS', 'ink'], ['Artemis', 'cap', 'muted', 6]], { owner: 'writer', textCls: 'on-card' });
        let status;
        if (hid.write) status = [['outcome', 'after your answer'], 'muted'];
        else if (write.outcome === 'acked') status = [[hid.writeTime ? 'acked in ?' : `acked in ${fmt(write.ms)}`], 'good'];
        else if (write.outcome === 'refused') status = [['refused:', `${write.live} live, ${write.needed} needed`], 'bad'];
        else status = [[`timed out at ${M.formatDuration(M.TIMEOUT_MS)}`], 'warn'];
        const oneLine = status[0].join(' ');
        const statusLines = tw(oneLine, 'capB') <= writerW - 22 ? [oneLine] : status[0];
        statusLines.forEach((line, i) => D.text(wx + 12, writerY + 64 + i * 16, [[line, 'capB', status[1]]], { owner: 'writer', textCls: 'on-card' }));
        D.region('writer', { x: wx - 2, y: writerY - 2, w: writerW + 4, h: writerH + 4 });

        // How a write line is drawn: neutral while the write hides, one style while which replicas acked hides.
        const writeCls = (id) => {
          if (hid.write) return 'pending';
          if (write.outcome === 'refused') return 'unsent';
          if (hid.writeTime) return 'write';
          const solid = write.outcome === 'timed-out' ? write.applied : write.acked;
          return solid.includes(id) ? 'write' : 'write weak';
        };
        const both = hid.verdict ? [] : m.both;

        // Stand-ins beside the writer (sloppy only).
        if (m.settings.sloppy) {
          const sx = wx + writerW + standGap;
          const sw = wide ? 112 : W - pad - sx;
          const sh = (writerH - 8) / 2;
          for (let j = 0; j < 2; j++) {
            const s = m.standIns[j];
            const sy = writerY + j * (sh + 8);
            const owner = `H${j + 1}`;
            const asked = s && !hid.read && read.set.includes(s.id);
            const boxCls = !s ? 'idle' : both.includes(s.id) ? 'both' : asked ? 'asked' : 'dashed';
            D.add('marks', `<rect class="box ${boxCls}" x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="8"/>`);
            D.mark({ x0: sx, x1: sx + sw, y0: sy, y1: sy + sh }, owner);
            D.add('links', `<line class="link ${s ? writeCls(s.id) : 'unsent'}" x1="${wx + writerW}" y1="${sy + sh / 2}" x2="${sx}" y2="${sy + sh / 2}"/>`);
            D.link(sampleLine(wx + writerW, sy + sh / 2, sx, sy + sh / 2), `writer ${owner}`);
            D.text(sx + 8, sy + sh / 2 + 5, [[owner, 'nameS', s ? 'ink' : 'muted']], { owner, textCls: 'on-card' });
            if (s) {
              const has = write.applied.includes(s.id);
              const chipT = hid.write ? '?' : has ? 'v8' : '–';
              const chx = sx + 34;
              D.add('marks', `<rect class="chip ${hid.write ? 'unknown' : has ? 'new' : 'old'}" x="${chx}" y="${sy + sh / 2 - 9}" width="26" height="18" rx="5"/>`);
              D.text(chx + 13, sy + sh / 2 + 4, [[chipT, 'mono', has && !hid.write ? 'chip-new-ink' : 'muted']], { anchor: 'middle', owner, textCls: 'on-chip' });
              const forT = `for R${s.standsFor + 1}`;
              if (sx + 66 + tw(forT, 'small') <= sx + sw - 6) D.text(sx + 66, sy + sh / 2 + 4, [[forT, 'small', 'muted']], { owner, textCls: 'on-card' });
            } else {
              const idle = 'standing by';
              if (sx + 34 + tw(idle, 'small') <= sx + sw - 6) D.text(sx + 34, sy + sh / 2 + 4, [[idle, 'small', 'muted']], { owner, textCls: 'on-card' });
            }
          }
          D.region('standins', { x: sx - 2, y: writerY - 2, w: sw + 4, h: writerH + 4 });
        }

        // The write fan.
        const fanH = wide ? 69 : 66;
        const chipH = 16;
        const wChipY = y + fanH;
        const cardY = wChipY + chipH + 4;
        const wApex = [Math.min(Math.max(cx(0), wx + 18), wx + writerW - 18), writerY + writerH];
        const wthId = write.outcome === 'acked' ? write.acked[write.acked.length - 1] : null;
        reps.forEach((rep, i) => {
          const owner = `R${i + 1}`;
          if (rep.knownDown) return;
          const end = [cx(i), wChipY];
          D.add('links', `<line class="link ${writeCls(i)}" data-write="${i}" x1="${wApex[0]}" y1="${wApex[1]}" x2="${end[0]}" y2="${end[1]}"/>`);
          D.link(sampleLine(wApex[0], wApex[1], end[0], end[1]), `writer ${owner}`);
          let t;
          let chipCls = 'sent';
          let ink = 'ink';
          if (hid.write) {
            t = '?';
            chipCls = 'unknown';
            ink = 'muted';
          } else if (write.outcome === 'refused') {
            t = wide ? 'not sent' : '–';
            chipCls = 'quiet';
            ink = 'muted';
          } else if (rep.state === 'mid') {
            t = wide ? 'no ack' : '×';
            chipCls = 'quiet';
            ink = 'bad';
          } else t = chipMs(rep.writeRtt);
          if (i === wthId && !hid.writeTime) chipCls += ' wth';
          const cwid = Math.max(26, tw(t, 'mono') + 10);
          D.add('marks', `<rect class="chip ${chipCls}" x="${end[0] - cwid / 2}" y="${wChipY}" width="${cwid}" height="${chipH}" rx="8"/>`);
          D.mark({ x0: end[0] - cwid / 2, x1: end[0] + cwid / 2, y0: wChipY, y1: wChipY + chipH }, owner);
          D.text(end[0], wChipY + 12, [[t, 'mono', ink]], { anchor: 'middle', owner, textCls: 'on-chip' });
        });

        // What each card shows at rest, after what the open question hides.
        const shown = reps.map((rep, i) => {
          if (hid.write && rep.state !== 'down' && rep.state !== 'mid') return '?';
          if (hid.repair && read.repairs.includes(i) && !write.applied.includes(i)) return 7;
          return m.holds[i];
        });
        const quietRead = hid.verdict || hid.write;
        const answerOf = (i) => read.answers.find((a) => a.id === i);
        // The stale race: v8 reached the replica after the read did. Its lucky counterpart: a read set no ack covers that
        // heard v8 anyway.
        const race = reps.map((rep, i) => {
          const a = answerOf(i);
          return !quietRead && !!a && a.value === 7 && write.applied.includes(i) && rep.landAt > a.readAt;
        });
        const lucky = reps.map((rep, i) => {
          const a = answerOf(i);
          return !quietRead && !hid.count && !!a && m.thisReadUnsure && a.value === 8;
        });

        // Replica cards.
        reps.forEach((rep, i) => {
          const owner = `R${i + 1}`;
          const x = r1(cx(i) - cw / 2);
          const st = rep.state;
          let cls = 'card';
          if (st === 'down') cls += ' down';
          if (st === 'mid') cls += ' mid';
          if (both.includes(i)) cls += ' both';
          if (both.includes(i) && gap >= 8) D.add('back', `<rect class="both-ring" x="${x - 4}" y="${cardY - 4}" width="${cw + 8}" height="${cardH + 8}" rx="12"/>`);
          D.add('marks', `<rect class="${cls}" x="${x}" y="${cardY}" width="${cw}" height="${cardH}" rx="8"/>`);
          D.mark({ x0: x, x1: x + cw, y0: cardY, y1: cardY + cardH }, owner);
          const ix = wide ? 10 : 5;
          const nameY = cardY + (wide ? 22 : 18);
          D.text(x + ix, nameY, [[owner, wide ? 'name' : 'nameS', st === 'down' ? 'muted' : 'ink']], { owner, textCls: 'on-card' });
          const repaired = read.repairs.includes(i) && !hid.repair;
          // The state word: repaired first (a repair lands before a raced v8 does), then the race and its lucky
          // counterpart, paused and the state.
          let word = null;
          if (repaired) word = { full: 'repaired', short: 'repaired', cls: 'good' };
          else if (race[i]) word = { full: `v8 at ${fmt(rep.landAt)}`, short: `at ${fmt(rep.landAt)}`, cls: 'warn' };
          else if (lucky[i]) word = { full: `v8 at ${fmt(rep.landAt)}`, short: `at ${fmt(rep.landAt)}`, cls: 'good' };
          else if (rep.pause && st === 'up') word = { full: 'paused', short: 'paused', cls: 'warn' };
          else if (st === 'back' && hid.write) word = { full: 'back', short: 'back', cls: 'muted' };
          else word = { full: STATE_WORD[st], short: STATE_SHORT[st], cls: 'muted' };
          const pipY = cardY + cardH - (wide ? 14 : 12);
          const pr = wide ? 3.5 : 2.5;
          const pg = wide ? 11 : 8;
          const nameRoom = cw - 2 * ix - tw(owner, wide ? 'name' : 'nameS') - 6;
          let nameSlot = null;
          let pipWord = null;
          if (wide && tw(word.full, 'small') <= cw - (ix + 3 * pg + 2 * pr + 6) - 6) pipWord = word;
          else if (cardWords && word.short && tw(word.short, 'small') <= nameRoom) nameSlot = { t: word.short, cls: word.cls };
          const chipY = cardY + (wide ? 32 : 26);
          const pauseInName = !cardWords && rep.pause;
          if (nameSlot) D.text(x + cw - ix, nameY, [[nameSlot.t, 'small', nameSlot.cls]], { anchor: 'end', owner, textCls: 'on-card' });
          else if (pauseInName) D.add('marks', pauseGlyph(x + cw - ix - 8, nameY - 9));
          else {
            const dc = wide ? `DC ${rep.dc}` : rep.dc;
            if (tw(dc, 'small') <= nameRoom) D.text(x + cw - ix, nameY, [[dc, 'small', 'muted']], { anchor: 'end', owner, textCls: 'on-card' });
          }
          // The value the replica holds once the scenario has run.
          const value = shown[i];
          if (st === 'mid' && !hid.write) {
            xGlyph(D, x + ix + 8, chipY + 9, owner, 4);
          } else if (value !== null) {
            const label = value === '?' ? '?' : `v${value}`;
            const name = wide && value === 8 && cw >= 100 ? 'Artemis' : wide && value === 7 && cw >= 100 ? 'Apollo' : '';
            // A race with no room for its word says it in the chip: it held v7 when the read came, then v8 landed.
            const arrow = race[i] && !nameSlot && !pipWord && tw('v7→v8', 'mono') + 12 <= cw - 2 * ix;
            const parts = arrow
              ? [['v7→', 'mono', 'warn'], ['v8', 'mono', 'chip-new-ink']]
              : name
                ? [[label, 'mono', value === 8 ? 'chip-new-ink' : 'muted'], [name, 'small', 'muted', 5]]
                : [[label, 'mono', value === 8 ? 'chip-new-ink' : 'muted']];
            const chw = partsWidth(parts) + 12;
            const ccls = value === '?' ? 'unknown' : value === 8 ? 'new' : 'old';
            D.add('marks', `<rect class="chip ${ccls}" x="${x + ix}" y="${chipY}" width="${chw}" height="18" rx="5"/>`);
            D.text(x + ix + 6, chipY + 13, parts, { owner, textCls: 'on-chip' });
            if (repaired) {
              const gx = x + ix + chw + 9;
              if (gx + 6 <= x + cw - 3)
                D.add('marks', `<path class="repair-glyph" d="M${gx + 4} ${chipY + 5}a4.5 4.5 0 1 0 1 5"/><path class="repair-glyph" d="M${gx + 5} ${chipY + 2}v3.5h-3.5"/>`);
            }
          }
          if (rep.pause && !pauseInName) D.add('marks', pauseGlyph(x + cw - ix - 8, chipY + 4));
          // State pips: up, down, stops mid-write, back.
          M.STATES.forEach((s, j) => D.add('marks', `<circle class="pip${s === st ? ' on' : ''}" cx="${x + ix + pr + j * pg}" cy="${pipY}" r="${pr}"/>`));
          if (view.hint === i) {
            const j = M.STATES.indexOf(NEXT[st]);
            D.add('marks', `<circle class="next-pip" cx="${x + ix + pr + j * pg}" cy="${pipY}" r="${pr + 2.5}"/>`);
          }
          if (pipWord) D.text(x + ix + 3 * pg + 2 * pr + 6, pipY + 4, [[pipWord.full, 'small', pipWord.cls]], { owner, textCls: 'on-card' });
          D.hit('card', x, cardY, cw, cardH, {
            owner,
            label: `${owner}, ${M.STATE_NAMES[st]}${rep.pause ? ', paused' : ''}. Activate to ${NEXT_PHRASE[NEXT[st]]}.`,
          });
        });
        // Chips fill both edges of the card band, so its frame reaches up to the writer and takes the write fan.
        const cardsTop = writerY + writerH + 3;
        D.region('cards', { x: pad - 4, y: cardsTop, w: W - 2 * pad + 8, h: cardY + cardH + 4 + chipH + 4 - cardsTop });

        // Read chips under the cards, then the read fan (not drawn at all while the read itself waits for the answer).
        const rChipY = cardY + cardH + 4;
        const readerY = rChipY + chipH + fanH;
        const readerRows = (() => {
          if (wide) return 1;
          const chipW = tw('R5 v8', 'mono') + 14;
          const per = Math.max(1, Math.floor((W - 2 * pad - 24 + 6) / (chipW + 6)));
          return Math.ceil(n / per);
        })();
        const readerH = wide ? 62 : 20 + 12 + readerRows * 26;
        const shownAnswers = hid.read ? [] : read.answers;
        const chipList = shownAnswers.map((a) => ({ ...a })).sort((a, b) => (b.value ?? 0) - (a.value ?? 0) || a.rtt - b.rtt);
        const answerText = (a) => (hid.verdict ? '?' : a.value === null ? '–' : `v${a.value}`);
        const chipW = (a) => tw(`${m.all[a.id].name} ${answerText(a)}`, 'mono') + 14;
        const sentT = hid.read ? 'read sent after your answer' : hid.writeTime ? 'sent when the write returns' : write.outcome === 'refused' ? 'sent at once' : `sent at ${tf(read.sentAt)}`;
        const readerLabel = 'Reader · DC C';
        let rw;
        if (wide) {
          const chipsW = chipList.reduce((s, a) => s + chipW(a) + 6, 0) - 6;
          const need = Math.max(tw(readerLabel, 'label') + 16 + tw('sent when the write returns', 'small'), chipsW, 230) + 24;
          rw = Math.min(Math.round(W * 0.56), Math.ceil(need));
        } else rw = W - 2 * pad;
        const rx = W - pad - rw;
        const rApex = [Math.min(Math.max(cx(n - 1), rx + 18), rx + rw - 18), readerY];
        const repairs = hid.repair ? [] : read.repairs;
        const arcs = [];
        for (const id of repairs) {
          const start = rApex;
          const end = [cx(id) - 10, rChipY + chipH + 1];
          const mid = [(start[0] + end[0]) / 2, (start[1] + end[1]) / 2];
          const dx = end[0] - start[0];
          const dy = end[1] - start[1];
          const len = Math.hypot(dx, dy) || 1;
          let nx = -dy / len;
          let ny = dx / len;
          if (nx > 0) {
            nx = -nx;
            ny = -ny;
          }
          const bulge = Math.min(34, len * 0.3);
          const c = [mid[0] + nx * bulge, mid[1] + ny * bulge];
          const pts = Array.from({ length: 31 }, (_, k) => quad(start, c, end, k / 30));
          arcs.push({ id, start, c, end, pts });
          D.add('links', `<path class="link repair" d="M${r1(start[0])} ${r1(start[1])}Q${r1(c[0])} ${r1(c[1])} ${r1(end[0])} ${r1(end[1])}" marker-end="url(#arrow-repair)"/>`);
          D.link(pts, `reader R${id + 1} repair${id + 1}`);
        }
        const readDeadXs = [];
        if (!hid.read)
          reps.forEach((rep, i) => {
            const owner = `R${i + 1}`;
            if (!rep.reachable) {
              const top = cardY + cardH;
              const s = [cx(i), rChipY + chipH];
              D.add('links', `<path class="link dead" d="M${s[0]} ${top}V${s[1]}L${rApex[0]} ${rApex[1]}"/>`);
              D.link([...sampleLine(s[0], top, s[0], s[1]), ...sampleLine(s[0], s[1], rApex[0], rApex[1])], `reader ${owner} dead${i + 1}`);
              readDeadXs.push({ i, s });
              return;
            }
            const inSet = read.set.includes(i);
            const answer = answerOf(i);
            const s = [cx(i), rChipY + chipH];
            D.add('links', `<line class="link read${inSet ? '' : ' weak'}" x1="${s[0]}" y1="${s[1]}" x2="${rApex[0]}" y2="${rApex[1]}"/>`);
            D.link(sampleLine(s[0], s[1], rApex[0], rApex[1]), `reader ${owner}`);
            const time = chipMs(rep.readRtt);
            let parts;
            if (inSet) {
              const v = hid.verdict ? '?' : `v${answer.value}`;
              // An answer that differs from what the card holds at rest is the point of the drawing: warn ink.
              const differs = !hid.verdict && answer.value !== shown[i];
              const vInk = differs ? 'warn' : 'ink';
              const sep = tw(' ', 'mono') - 1;
              // Where value and time do not both fit, a read-set chip keeps the answer; the latency lane keeps the time.
              if (wide || partsWidth([[v, 'mono'], [`· ${time}`, 'mono', '', sep]]) + 10 <= cw) parts = [[v, 'mono', vInk], [`· ${time}`, 'mono', 'ink', sep]];
              else if (!hid.verdict) parts = [[v, 'mono', differs ? 'warn' : lucky[i] ? 'good' : 'ink']];
              else parts = [[time, 'mono', 'ink']];
            } else parts = [[time, 'mono', 'muted']];
            const cwid = Math.max(26, partsWidth(parts) + 10);
            D.add('marks', `<rect class="chip ${inSet ? 'asked' : 'quiet'}" x="${s[0] - cwid / 2}" y="${rChipY}" width="${cwid}" height="${chipH}" rx="8"/>`);
            D.mark({ x0: s[0] - cwid / 2, x1: s[0] + cwid / 2, y0: rChipY, y1: rChipY + chipH }, owner);
            D.text(s[0], rChipY + 12, parts, { anchor: 'middle', owner, textCls: 'on-chip' });
          });
        // An unreachable replica's x sits where no repair arc or other line passes.
        for (const { i, s } of readDeadXs) {
          const owner = `R${i + 1}`;
          for (const t of [0.5, 0.42, 0.58, 0.34, 0.66, 0.26, 0.74, 0.2]) {
            const p = [s[0] + (rApex[0] - s[0]) * t, s[1] + (rApex[1] - s[1]) * t];
            const box = { x0: p[0] - 6, x1: p[0] + 6, y0: p[1] - 6, y1: p[1] + 6 };
            if (D.free(box, `dead${i + 1}`, 2)) {
              xGlyph(D, r1(p[0]), r1(p[1]), owner, 4);
              break;
            }
          }
        }
        for (const a of arcs) {
          const apex = quad(a.start, a.c, a.end, 0.5);
          const left = apex[0] < (a.start[0] + a.end[0]) / 2;
          const cand = [
            [apex[0] - 6, apex[1] + 4, 'end'],
            [apex[0] + 6, apex[1] + 4, 'start'],
            [apex[0], apex[1] - 8, 'middle'],
          ];
          for (const [x, yy, anchor] of left ? cand : [cand[1], cand[0], cand[2]]) {
            const box = D.textBox(x, yy, tw('repair', 'small'), 'small', anchor);
            if (D.free(box, '')) {
              D.text(x, yy, [['repair', 'small', 'good']], { anchor, owner: `repair${a.id + 1}` });
              break;
            }
          }
        }

        // Reader box, and the R handle beside it (wide) or under the pill (narrow).
        D.add('marks', `<rect class="box" x="${rx}" y="${readerY}" width="${rw}" height="${readerH}" rx="10"/>`);
        D.mark({ x0: rx, x1: rx + rw, y0: readerY, y1: readerY + readerH }, 'reader');
        D.text(rx + 12, readerY + 20, [[readerLabel, 'label']], { owner: 'reader', textCls: 'on-card' });
        const sentFits = rx + 12 + tw(readerLabel, 'label') + 12 + tw(sentT, 'small') <= rx + rw - 12;
        if (sentFits) D.text(rx + rw - 12, readerY + 20, [[sentT, 'small', 'muted']], { anchor: 'end', owner: 'reader', textCls: 'on-card' });
        if (hid.read) {
          if (!sentFits) D.text(rx + 12, readerY + 44, [[sentT, 'small', 'muted']], { owner: 'reader', textCls: 'on-card' });
        } else if (!readDone) {
          const t = read.outcome === 'timed-out' ? `timed out: ${read.reachable} answered, ${read.needed} needed` : `no answer: ${read.reachable} reachable, ${read.needed} needed`;
          D.text(rx + 12, readerY + 44, [[t, 'small', 'bad']], { owner: 'reader', textCls: 'on-card' });
        } else {
          let ccx = rx + 12;
          let ccy = readerY + 30;
          for (const a of chipList) {
            const wdt = chipW(a);
            if (ccx + wdt > rx + rw - 12) {
              ccx = rx + 12;
              ccy += 26;
            }
            const ccls = hid.verdict ? 'unknown' : a.value === 8 ? 'new' : 'old';
            D.add('marks', `<rect class="chip ${ccls}" data-answer="${a.id}" x="${ccx}" y="${ccy}" width="${wdt}" height="20" rx="6"/>`);
            D.text(ccx + 7, ccy + 14, [[m.all[a.id].name, 'mono', 'muted'], [answerText(a), 'mono', a.value === 8 && !hid.verdict ? 'chip-new-ink' : 'muted', 5]], { owner: 'reader', textCls: 'on-chip' });
            ccx += wdt + 6;
          }
        }
        const rHandle = { id: 'rhandle', k: r, n, hid: hid.avail, letter: 'R', what: 'answers a read waits for', survives: m.survives.read, succeed: m.avail.read, verb: 'reads' };
        y = readerY + readerH;
        if (wide) handleBlock(D, { ...rHandle, x: pad, y: readerY, w: rx - 24 - pad });
        const handleBottom = readerY + 84;

        // The verdict pill: the heaviest mark.
        const pill = pillOf(m, hid);
        const pillMax = W - 2 * pad;
        let pillLines = [pill.text];
        if (tw(pill.text, 'pill') + 44 > pillMax) {
          const k = pill.text.lastIndexOf(' · ');
          pillLines = [pill.text.slice(0, k), pill.text.slice(k + 3)];
        }
        const pw = Math.max(...pillLines.map((l) => tw(l, 'pill'))) + 44;
        const ph = pillLines.length === 1 ? 32 : 48;
        const pillY = y + 10;
        const px = W - pad - pw;
        D.add('marks', `<rect class="pill ${pill.tone}" x="${px}" y="${pillY}" width="${pw}" height="${ph}" rx="16"/>`);
        D.mark({ x0: px, x1: px + pw, y0: pillY, y1: pillY + ph }, 'pill');
        D.add('text', glyph(pill.tone, px + 18, pillY + 16));
        pillLines.forEach((line, i) => D.text(px + 32, pillY + 21 + i * 16, [[line, 'pill', pill.tone === 'hidden' ? 'muted' : 'ink']], { owner: 'pill', textCls: 'on-chip' }));
        const pillReserve = wide ? 32 : 48;
        let readerBottom = pillY + ph;
        let readerLeft = Math.min(rx, px);
        if (both.length && !hid.count) {
          const names = both.map((id) => m.all[id].name);
          const t = `${nameList(names)} both acked and answered`;
          const role = tw(t, 'cap') <= W - 2 * pad ? 'cap' : 'small';
          const box = D.text(W - pad, pillY + ph + 18, [[tw(t, role) <= W - 2 * pad ? t : `${names.join(', ')} acked and answered`, role, 'good']], { anchor: 'end' });
          readerBottom = box.y1;
          readerLeft = Math.min(readerLeft, box.x0);
        }
        D.region('reader', { x: readerLeft - 4, y: readerY - 3, w: W - pad - readerLeft + 7, h: readerBottom - readerY + 7 });
        y = Math.max(pillY + pillReserve + 26, wide ? handleBottom : 0);
        if (!wide) {
          handleBlock(D, { ...rHandle, x: pad, y: y + 4, w: W - 2 * pad });
          y += 4 + 84;
        }

        // The read-set strip: the guarantee over home read sets, apart from what this read happened to see.
        y += 14;
        D.add('grid', `<line class="rule" x1="${pad}" y1="${y}" x2="${W - pad}" y2="${y}"/>`);
        const stripTop = y;
        const stripLabel = `Read sets of ${r} ${r === 1 ? 'replica' : 'replicas'}`;
        D.text(pad, y + 26, [[stripLabel, 'label']]);
        const refused = write.outcome === 'refused' && !hid.count;
        const head = hid.count ? [`? of ${m.readSets}`, ' can miss v8'] : refused ? ['none', ' written to miss'] : [`${m.staleSets} of ${m.readSets}`, ' can miss v8'];
        const headTone = hid.count || write.outcome !== 'acked' ? 'muted' : m.staleSets > 0 ? 'bad' : 'good';
        const cell = wide ? 14 : 12;
        const cgap = 2;
        const setGap = wide ? 8 : 5;
        const headCol = wide ? 28 : 20;
        const gx0 = pad + headCol;
        const gridW = m.sets.length * (cell + setGap) - setGap;
        const gridWMost = M.choose(n, Math.floor(n / 2)) * (cell + setGap) - setGap;
        const sideX = pad + Math.max(headCol + gridWMost, 236) + 28;
        const side = wide && W - pad - sideX >= 220;
        // The headline sits in the label's row unless its longest form cannot, so every state at a width draws it alike.
        const longestHead = Math.max(tw('none', 'head') + tw(' written to miss', 'cap'), tw('10 of 10', 'head') + tw(' can miss v8', 'cap'));
        const headStacked = !side && pad + tw('Read sets of 5 replicas', 'label') + 16 + longestHead > W - pad;
        if (side) D.text(sideX, y + 27, [[head[0], 'head', headTone], [head[1], 'cap', 'muted']]);
        else if (headStacked) D.text(pad, y + 50, [[head[0], 'head', headTone], [head[1], 'cap', 'muted']]);
        else D.text(W - pad, y + 27, [[head[0], 'head', headTone], [head[1], 'cap', 'muted']], { anchor: 'end' });
        y += headStacked ? 64 : 42;
        const gridTop = y;
        for (let i = 0; i < n; i++) {
          const acked = !hid.ackers && m.ackedHomes.includes(i);
          D.text(pad, gridTop + i * (cell + cgap) + cell - 2, [[`R${i + 1}`, 'mono', acked ? 'good' : 'muted']]);
        }
        m.sets.forEach((s, k) => {
          const x = gx0 + k * (cell + setGap);
          for (let i = 0; i < n; i++) {
            const member = s.members.includes(i);
            const acked = member && !hid.ackers && m.ackedHomes.includes(i);
            D.add('marks', `<rect class="cell${member ? (acked ? ' acked' : ' member') : ''}" x="${x + 0.5}" y="${gridTop + i * (cell + cgap) + 0.5}" width="${cell - 1}" height="${cell - 1}" rx="2"/>`);
          }
          const xY = gridTop + n * (cell + cgap) + 7;
          if (s.canMiss && !hid.count && !refused) xGlyph(D, x + cell / 2, xY, `set${k}`, 3.5);
          if (s.isThis && !hid.read) D.add('marks', `<rect class="this-ring" x="${x - 3}" y="${gridTop - 3}" width="${cell + 6}" height="${n * (cell + cgap) - cgap + 6}" rx="4"/>`);
        });
        const gridBottom = gridTop + n * (cell + cgap) - cgap;
        D.mark({ x0: gx0 - 3, x1: gx0 + gridW + 3, y0: gridTop - 3, y1: gridBottom + 14 }, 'strip-grid');
        // Legend under the grid.
        // Five rows get two more pixels before the legend, so N 5 sits 34px below N 3 as the first build measured.
        let ly = gridBottom + 30 + (n === 5 ? 2 : 0);
        const fullLegend = [
          ['acked', 'acked v8'],
          ['member', 'in the read set'],
          ['x', 'can miss'],
          ['ring', 'this read'],
        ];
        const legend = fullLegend
          .map(([k, t]) => [k, k === 'acked' && write.outcome === 'timed-out' ? 'has v8' : t])
          .filter(([k]) => !((k === 'acked' && hid.ackers) || (k === 'x' && hid.count) || (k === 'ring' && hid.read)));
        let lx = pad;
        const legendW = wide ? 236 : W - 2 * pad;
        const legendRows = (() => {
          let rows = 1;
          let x0 = pad;
          for (const [, t] of fullLegend) {
            const iw = 12 + 5 + tw(t, 'small');
            if (x0 + iw > pad + legendW) {
              rows++;
              x0 = pad;
            }
            x0 += iw + 14;
          }
          return rows;
        })();
        const legendTop = ly;
        for (const [k, t] of legend) {
          const iw = 12 + 5 + tw(t, 'small');
          if (lx + iw > pad + legendW) {
            lx = pad;
            ly += 16;
          }
          if (k === 'acked' || k === 'member') D.add('marks', `<rect class="cell ${k}" x="${lx + 0.5}" y="${ly - 9.5}" width="10" height="10" rx="2"/>`);
          if (k === 'x') D.add('marks', `<path class="xmark" d="M${lx + 2} ${ly - 8}l7 7M${lx + 9} ${ly - 8}l-7 7"/>`);
          if (k === 'ring') D.add('marks', `<rect class="this-ring" x="${lx + 0.5}" y="${ly - 10.5}" width="10" height="12" rx="3"/>`);
          D.text(lx + 17, ly, [[t, 'small', 'muted']]);
          lx += iw + 14;
        }
        // The sentence about overlap, and the one about its limit.
        const viaStandIns = !hid.read && m.readStandIns.length > 0;
        const standInNames = nameList(m.readStandIns.map((id) => m.all[id].name));
        const s1 = (() => {
          if (hid.write) return 'Which reads can miss v8 depends on how the write ends: after your answer.';
          if (hid.count) return `Does every read of ${r} meet the ${w} that acked?`;
          if (write.outcome === 'refused')
            return viaStandIns ? `Nothing was written, and ${standInNames} ${m.readStandIns.length > 1 ? 'hold' : 'holds'} no copy of the key.` : 'Nothing was written, so there is nothing to miss.';
          if (write.outcome === 'timed-out') {
            if (!m.h) return 'The write timed out and applied nowhere: every read returns v7.';
            const who = m.h > 2 ? `${m.h} replicas` : nameList(m.ackedHomes.map((i) => `R${i + 1}`));
            return m.staleSets === 0
              ? `The write timed out, yet every read of ${r} meets a replica that applied it.`
              : `The write timed out, but ${who} applied it: a read of ${r} that misses ${m.h > 1 ? 'them' : 'it'} returns v7.`;
          }
          if (viaStandIns)
            return `This read asked ${standInNames} for the down ${nameList(m.readStandIns.map((id) => `R${m.all[id].standsFor + 1}`))}; the sets count home replicas only.`;
          if (m.settings.sloppy && m.h < w && m.staleSets > 0)
            return m.h === 0
              ? `Only stand-ins acked, and the read goes to the home replicas: every read of ${r} can miss v8.`
              : `The read goes to the home replicas, not the stand-ins holding the write: only ${m.h} home replica${m.h === 1 ? '' : 's'} acked, so a read of ${r} can miss ${m.h === 1 ? 'it' : 'them'}.`;
          if (m.staleSets === 0) return `Every read of ${r} shares a replica with the ${m.h} that acked.`;
          return `${r} + ${w} is not above ${n}: a read of ${r} can miss ${m.h === 1 ? 'the replica' : `all ${m.h}`} that acked.`;
        })();
        const s2 = 'R + W > N alone is not linearizable: reads racing a write can disagree, and concurrent writes settled by last-write-wins can drop one.';
        ly = legendTop + (legendRows - 1) * 16;
        const sentW = side ? W - pad - sideX : W - 2 * pad;
        const l1 = wrap(s1, 'cap', sentW);
        const l2 = wrap(s2, 'cap', sentW);
        const sx0 = side ? sideX : pad;
        // Beside the grid the headline is the column's first line and the sentences start 6 px under it.
        const sentTop = side ? stripTop + 27 + 6 + 14 : ly + 26;
        let sy0 = sentTop;
        l1.forEach((line, i) => D.text(sx0, sy0 + i * 18, [[line, 'cap', 'ink']]));
        sy0 += l1.length * 18 + 4;
        l2.forEach((line, i) => D.text(sx0, sy0 + i * 18, [[line, 'cap', 'muted']]));
        // Reserve the most lines any overlap sentence takes at this width, so the height depends only on width and N.
        const reserveS1 = Math.max(
          ...[
            'Does every read of 5 meet the 5 that acked?',
            'Which reads can miss v8 depends on how the write ends: after your answer.',
            'The write timed out, but 3 replicas applied it: a read of 2 that misses them returns v7.',
            'The read goes to the home replicas, not the stand-ins holding the write: only 1 home replica acked, so a read of 5 can miss it.',
            'Only stand-ins acked, and the read goes to the home replicas: every read of 5 can miss v8.',
            'This read asked H1 and H2 for the down R1 and R2; the sets count home replicas only.',
            'Nothing was written, and H1 and H2 hold no copy of the key.',
            'Every read of 5 shares a replica with the 5 that acked.',
          ].map((t) => wrap(t, 'cap', sentW).length),
        );
        const sentReserve = sentTop + (reserveS1 * 18 + 4) + l2.length * 18 - 10;
        y = (side ? Math.max(ly, sentReserve) : sentReserve) + 8;
        D.region('strip', { x: Math.max(3, pad - 8), y: stripTop + 4, w: W - 2 * Math.max(3, pad - 8), h: y - stripTop - 4 });

        // Latency, log scale 1 to 200 ms, each request timed from its own start.
        y += 10;
        D.add('grid', `<line class="rule" x1="${pad}" y1="${y}" x2="${W - pad}" y2="${y}"/>`);
        const latTop = y;
        D.text(pad, y + 26, [['Latency', 'label'], ['from each request · log scale', 'small', 'muted', 8]]);
        const rowLabelW = wide ? 104 : 0;
        const px0 = pad + rowLabelW + 8;
        const px1 = W - pad - (wide ? 18 : 12);
        const span = Math.log10(200);
        const X = (t) => r1(px0 + (Math.log10(Math.min(200, Math.max(1, t))) / span) * (px1 - px0));
        // Room above each lane for the tallest stack of dots this width and N can draw, so heights stay put.
        const possible = possibleRtts(n);
        const tallR = tallestStack(possible.read, X);
        // Phone lanes carry their names above them, with room for a ring label between name and dots.
        const L1 = wide ? y + 60 : y + 74;
        const L2 = L1 + Math.max(wide ? 44 : 66, 34 + (tallR - 1) * STACK_STEP);
        const axisY = L2 + (wide ? 24 : 30);
        const ticks = [1, 2, 5, 10, 20, 50, 100, 200];
        for (const t of ticks) D.add('grid', `<line class="gridline" x1="${X(t)}" y1="${L1 - (wide ? 18 : 22)}" x2="${X(t)}" y2="${axisY}"/>`);
        for (const L of [L1, L2]) D.add('grid', `<line class="lane" x1="${px0}" y1="${L}" x2="${px1}" y2="${L}"/>`);
        D.add('grid', `<line class="axis" x1="${px0}" y1="${axisY}" x2="${px1}" y2="${axisY}"/>`);
        const unitLabel = '200 ms';
        const unitLeft = X(200) + 4 - tw(unitLabel, 'small');
        let lastTick = -Infinity;
        ticks.forEach((t, i) => {
          const last = i === ticks.length - 1;
          const label = last ? unitLabel : String(t);
          const anchor = last ? 'end' : 'middle';
          const x = last ? X(t) + 4 : X(t);
          const w0 = tw(label, 'small');
          const left = anchor === 'end' ? x - w0 : x - w0 / 2;
          if (!last && (left < lastTick + 6 || left + w0 > unitLeft - 6)) return;
          D.add('grid', `<line class="axis" x1="${X(t)}" y1="${axisY}" x2="${X(t)}" y2="${axisY + 4}"/>`);
          D.text(x, axisY + 17, [[label, 'small', 'muted']], { anchor });
          lastTick = left + w0;
        });
        if (wide) {
          D.text(pad, L1 + 4, [['Write acks', 'cap', 'ink']]);
          D.text(pad, L2 + 4, [['Read answers', 'cap', 'ink']]);
        } else {
          for (const [t, L] of [['Write acks', L1], ['Read answers', L2]]) {
            D.add('grid', `<rect class="ground" x="${pad - 2}" y="${L - 40}" width="${tw(t, 'small') + 6}" height="14" rx="3"/>`);
            D.text(pad, L - 30, [[t, 'small', 'ink']], { ground: true });
          }
        }
        // A stack's names join under its lowest dot; a name that finds no room is reported by the checks.
        const placeName = (x, L, names, owner, ringed) => {
          const t = names.join(', ');
          const yy = L + (ringed ? 19 : 17);
          const w0 = tw(t, 'small');
          for (const dx of [0, w0 / 2 - 4, -w0 / 2 + 4]) {
            const box = D.textBox(x + dx, yy, w0, 'small', 'middle');
            if (box.x0 < pad - 2 || box.x1 > W - pad + 2 || !D.free(box, owner, 1)) continue;
            D.add('grid', `<rect class="ground" x="${box.x0 - 2}" y="${box.y0 - 1}" width="${box.x1 - box.x0 + 4}" height="${box.y1 - box.y0 + 2}" rx="2"/>`);
            D.text(x + dx, yy, [[t, 'small', 'muted']], { anchor: 'middle', owner, ground: true, names: names.join(' ') });
            return;
          }
          D.missingNames = [...(D.missingNames ?? []), t];
        };
        // A ring's label goes beside the ring (and its repair bar, which ends at xEnd), level or raised, then above it.
        const placeLabel = (x, L, texts, ringR, owner, tone = 'ink', xEnd = x + ringR) => {
          const xl = x - ringR;
          const xr = Math.max(x + ringR, xEnd);
          for (const t of texts) {
            const w0 = tw(t, 'smallB');
            const cands = [
              [xr + 6, L + 4, 'start'],
              [xl - 6, L + 4, 'end'],
              [xr + 6, L - 1, 'start'],
              [xl - 6, L - 1, 'end'],
              [(xl + xr) / 2, L - ringR - 7, 'middle'],
              [xl, L - ringR - 7, 'start'],
              [xr, L - ringR - 7, 'end'],
              [xr + 16, L + 4, 'start'],
              [xl - 16, L + 4, 'end'],
              [xr + 6, L - 12, 'start'],
              [xl - 6, L - 12, 'end'],
            ];
            for (const [cx0, cy0, anchor] of cands) {
              const box = D.textBox(cx0, cy0, w0, 'smallB', anchor);
              if (box.x0 < px0 - (wide ? 0 : 4) || box.x1 > W - pad) continue;
              if (!D.free(box, '', 2)) continue;
              D.add('grid', `<rect class="ground" x="${box.x0 - 3}" y="${box.y0 - 2}" width="${box.x1 - box.x0 + 6}" height="${box.y1 - box.y0 + 4}" rx="3"/>`);
              D.text(cx0, cy0, [[t, 'smallB', tone]], { anchor, owner: owner + '-label', ground: true });
              return true;
            }
          }
          D.missingNames = [...(D.missingNames ?? []), texts[0]];
          return false;
        };
        const laneNote = (L, t, tone = 'muted') => {
          D.add('grid', `<rect class="ground" x="${px0}" y="${L - 8}" width="${tw(t, 'small') + 8}" height="14"/>`);
          D.text(px0 + 4, L + 4, [[t, 'small', tone]], { ground: true });
        };
        // Draws a lane's dots, stacked where they would touch, and returns where each one landed.
        const drawLane = (L, items) => {
          const placed = stackDots(items.map((d, order) => ({ ...d, x: X(d.t), order })));
          for (const d of placed) {
            d.y = L - d.k * STACK_STEP;
            D.add('marks', `<circle class="dot ${d.cls}" data-dot="${d.name}" cx="${d.x}" cy="${d.y}" r="${DOT_R}"/>`);
            D.mark({ x0: d.x - 5, x1: d.x + 5, y0: d.y - 5, y1: d.y + 5 }, d.owner);
          }
          return placed;
        };
        // Names go under each stack; stacks whose names would touch share one label, in order, under their middle.
        const nameStacks = (placed, L, ringedName) => {
          const groups = [];
          for (const base of placed.filter((d) => d.k === 0)) {
            const members = placed.filter((d) => d.base === base);
            const g = { xs: [base.x], members, ringed: base.name === ringedName };
            const last = groups.at(-1);
            const width = (ms) => tw(ms.map((d) => d.name).join(', '), 'small');
            if (last && base.x - last.xs.at(-1) < (width(last.members) + width(members)) / 2 + 4) {
              last.xs.push(base.x);
              last.members.push(...members);
              last.ringed ||= g.ringed;
            } else groups.push(g);
          }
          for (const g of groups) {
            const x = (Math.min(...g.xs) + Math.max(...g.xs)) / 2;
            placeName(x, L, g.members.map((d) => d.name), g.members.map((d) => d.owner).join(' '), g.ringed);
          }
        };
        // Write acks.
        if (hid.write) laneNote(L1, 'acks after your answer');
        else if (write.outcome === 'refused') laneNote(L1, 'none: the write was refused');
        else {
          const acks = write.ackOrder.map((id) => ({ t: m.all[id].writeRtt, name: m.all[id].name, cls: m.all[id].home ? 'write' : 'standin', owner: `lat-${m.all[id].name}` }));
          const placed = drawLane(L1, acks);
          let ringedName = null;
          if (write.outcome === 'timed-out') {
            D.add('marks', `<path class="chevron" d="M${px1 - 2} ${L1 - 6}l6 6l-6 6"/>`);
            D.mark({ x0: px1 - 4, x1: px1 + 6, y0: L1 - 7, y1: L1 + 7 }, 'timeout');
            const t = `timed out at ${M.formatDuration(M.TIMEOUT_MS)}`;
            const box = D.textBox(px1 - 8, L1 + 4, tw(t, 'smallB'), 'smallB', 'end');
            if (D.free(box, 'timeout')) {
              D.add('grid', `<rect class="ground" x="${box.x0 - 3}" y="${box.y0 - 2}" width="${box.x1 - box.x0 + 6}" height="${box.y1 - box.y0 + 4}" rx="3"/>`);
              D.text(px1 - 8, L1 + 4, [[t, 'smallB', 'warn']], { anchor: 'end', owner: 'timeout', ground: true });
            } else placeLabel(px1 + 2, L1, [t, 'timed out'], 6, 'timeout', 'warn');
          } else if (!hid.writeTime) {
            const d = placed.find((p) => p.name === m.all[wthId].name);
            ringedName = d.k === 0 ? d.name : null;
            D.add('marks', `<circle class="ring" cx="${d.x}" cy="${d.y}" r="8"/>`);
            D.mark({ x0: d.x - 9, x1: d.x + 9, y0: d.y - 9, y1: d.y + 9 }, d.owner);
            placeLabel(d.x, d.y, [`acked ${fmt(write.ms)}`, fmt(write.ms)], 8, d.owner);
          }
          nameStacks(placed, L1, ringedName);
        }
        // Read answers.
        if (hid.read) laneNote(L2, 'the read runs after your answer');
        else if (!readDone) laneNote(L2, read.outcome === 'timed-out' ? `timed out: ${read.reachable} answered, ${read.needed} needed` : `none: ${read.reachable} reachable, ${read.needed} needed`, 'bad');
        else {
          const answers = read.answers.map((a) => ({ t: a.rtt, name: m.all[a.id].name, cls: m.all[a.id].home ? 'read' : 'read standin', owner: `latr-${m.all[a.id].name}` }));
          const placed = drawLane(L2, answers);
          let ringedName = null;
          if (!hid.verdict) {
            const rth = read.answers.filter((a) => a.rtt === read.rthMs).at(-1);
            const d = placed.find((p) => p.name === m.all[rth.id].name);
            ringedName = d.k === 0 ? d.name : null;
            D.add('marks', `<circle class="ring" cx="${d.x}" cy="${d.y}" r="8"/>`);
            D.mark({ x0: d.x - 9, x1: d.x + 9, y0: d.y - 9, y1: d.y + 9 }, d.owner);
            const ord = M.formatOrdinal(r);
            if (repairs.length) {
              const xe = Math.max(d.x + 9, X(read.ms));
              D.add('marks', `<line class="repair-bar" x1="${d.x + 8}" y1="${d.y}" x2="${xe}" y2="${d.y}"/><line class="end-tick" x1="${xe}" y1="${d.y - 6}" x2="${xe}" y2="${d.y + 6}"/>`);
              D.mark({ x0: d.x + 8, x1: xe + 2, y0: d.y - 6, y1: d.y + 6 }, 'returned');
