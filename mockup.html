              D.add('links', `<line class="ghost-arrow" x1="${r1(ax0)}" y1="${r1(ay0)}" x2="${r1(ax1)}" y2="${r1(ay1)}"/><path class="ghost-head" d="M${r1(hx - uy * 3.5)} ${r1(hy + ux * 3.5)}L${r1(ax1)} ${r1(ay1)}L${r1(hx + uy * 3.5)} ${r1(hy - ux * 3.5)}"/>`);
              D.link(sampleLine(ax0, ay0, ax1, ay1, 2), 'ghost');
            }
          }
          const cands = (yy) => {
            const out = [];
            for (const dx of [8, 18, 30])
              for (const dy of [-8, 15, -18, 25]) out.push([gx - dx, yy + dy, 'end'], [gx + dx, yy + dy, 'start']);
            return out;
          };
          ['before: ' + fdur(gm.p99), fdur(gm.p99)].some((t) => D.place(cands(g99), [[t, 'small', 'muted']], { owner: 'ghost', ground: true, minX: pad, maxX: MX0 - 4, minY: py0, maxY: py1 - 2, margin: 1, optional: true, id: 'ghost-p99' }));
          D.place(cands(g50), [[fdur(gm.p50), 'small', 'muted']], { owner: 'ghost', ground: true, minX: pad, maxX: MX0 - 4, minY: py0, maxY: py1 - 2, margin: 1, optional: true, id: 'ghost-p50' });
        }
        // The marginal: 100 requests at the model's quantiles. Rows are anchored at the ticks: the 50 below p50 sit wholly
        // under its tick, the 49 between sit between the ticks, and the 100th sits wholly over the p99 tick; each tick keeps
        // a 1 px gap of stage colour to the dots beside it. The dot size is the largest whose fullest row fits the column.
        D.add('grid', `<line class="axis" x1="${MX0}" y1="${py1}" x2="${MX1}" y2="${py1}"/>`);
        if (m.stable && !hid.numbers) {
          const y50 = Yt(m.p50);
          const y99t = Yt(m.p99);
          const equal = Math.abs(m.p99 - m.p50) < 1e-6;
          const atomOf = (i) => s.service === 'steady' && Math.abs(m.dots[i] - M.SERVICE_MS) < 1e-6;
          const T = 1.75;
          const layout = (r) => {
            const p = 2 * r + 1;
            const y99 = equal ? y50 : Math.min(y99t, y50 - (2 * T + p));
            const rows = new Map();
            const put = (zone, k, cy, i) => {
              const key = `${zone}${k}`;
              if (!rows.has(key)) rows.set(key, { zone, cy, list: [] });
              rows.get(key).list.push(i);
            };
            const kA = Math.max(0, Math.floor((py1 - 0.5 - 2 * r - (y50 + T)) / p));
            const kC = Math.max(0, Math.floor((y99 - T - 2 * r - (py0 + 0.5)) / p));
            const HB = y50 - y99 - 2 * T;
            const nB = Math.max(1, Math.floor(HB / p));
            const hB = HB / nB;
            m.dots.forEach((t, i) => {
              const yy = Yt(t);
              if (i < 50) {
                const k = Math.min(kA, Math.max(0, Math.floor((yy - y50 - T) / p)));
                put('A', k, y50 + T + r + k * p, i);
              } else if (i < 99 && !equal) {
                const k = Math.min(nB - 1, Math.max(0, Math.floor((y50 - T - yy) / hB)));
                put('B', k, y50 - T - hB * (k + 0.5), i);
              } else {
                const k = Math.min(kC, Math.max(0, Math.floor((y99 - T - yy) / p)));
                put('C', k, y99 - T - r - k * p, i);
              }
            });
            const capN = Math.floor((MX1 - MX0 + 1) / p);
            const worst = Math.max(0, ...[...rows.values()].filter((l) => !l.list.some(atomOf)).map((l) => l.list.length));
            return { r, p, y99, rows, capN, fits: worst <= capN };
          };
          const options = (wide ? [2.5, 2, 1.75, 1.5] : [2, 1.75, 1.5, 1.25]).map(layout);
          const L = options.find((o) => o.fits) ?? options.at(-1);
          const { r, p, rows, capN } = L;
          const y99 = L.y99;
          D.meta.marginal = { y50, y99, r, equal, rows: [] };
          D.add('grid', `<line class="mtick p50" data-tick="p50" x1="${MX0 - 3}" y1="${r1(y50)}" x2="${MX1}" y2="${r1(y50)}"/>`);
          D.add('grid', `<line class="mtick p99${equal ? ' over50' : ''}" data-tick="p99" x1="${MX0 - 3}" y1="${r1(y99)}" x2="${MX1}" y2="${r1(y99)}"/>`);
          if (cursor) {
            // Leaders from the cursor's dots to their ticks; where the marginal opened a row between close ticks, the p99
            // leader steps to its tick at the column's edge.
            for (const [yy, ty, cls] of [
              [cursor.y50, y50, 'p50'],
              [cursor.y99, y99, 'p99'],
            ]) {
              if (cls === 'p99' && equal) continue;
              D.add('links', `<path class="leader" d="M${r1(cursor.x + 5)} ${r1(yy)}L${MX0 - 3} ${r1(yy)}L${MX0 - 3} ${r1(ty)}"/>`);
              D.link(sampleLine(cursor.x + 5, yy, MX0 - 3, yy), `lead-${cls}`);
            }
          }
          const atoms = m.dots.filter((t, i) => atomOf(i)).length;
          let atomRowCy = null;
          for (const row of rows.values()) {
            // In a row holding steady work's no-wait requests, the others are drawn first: the ones left out are then
            // all no-wait requests, which the count in words covers.
            const list = [...row.list.filter((i) => !atomOf(i)), ...row.list.filter(atomOf)];
            const shown = Math.min(list.length, capN);
            list.slice(0, shown).forEach((i, k) => dot(D, MX0 + r + k * p, row.cy, r, `req${atomOf(i) ? ' nowait' : ''}`, 'marg', `q${i}`, ` data-zone="${row.zone}"`));
            const hidden = list.length - shown;
            D.meta.marginal.rows.push({ zone: row.zone, cy: row.cy, n: list.length });
            if (list.some(atomOf)) {
              atomRowCy = Math.max(atomRowCy ?? -Infinity, row.cy);
              continue;
            }
            if (hidden > 0) D.place([[MX0, row.cy + 13], [MX0, row.cy + 24], [MX0, row.cy - 8]], [[`+${hidden}`, 'smallB', 'ink']], { owner: 'marg-more', ground: true });
          }
          // Steady work's requests that never wait all take exactly 10 ms: their count, always in words, under their row.
          if (atoms) {
            const forms = [`${atoms} at exactly ${fms(M.SERVICE_MS)}`, `${atoms} at ${fms(M.SERVICE_MS)}`];
            forms.some((t, i) => D.place([[MX1, atomRowCy + r + 13, 'end'], [MX1, atomRowCy + r + 24, 'end']], [[t, 'smallB', 'cur-ink']], { owner: 'marg-more', ground: true, minX: MX0 - 10, optional: i < forms.length - 1 }));
          }
          const under = m.dots.filter((t) => t < 1).length;
          if (under) {
            const bottom = [...rows.values()].filter((row) => row.zone === 'A').sort((a, b) => b.cy - a.cy);
            const cands = bottom.slice(0, 3).map((row) => [MX0 + Math.min(row.list.length, capN) * p + 3, row.cy + 4, 'start']);
            const forms = wide ? [`${under} under 1 ms`, `${under} < 1 ms`] : [`${under} < 1 ms`];
            const ok = forms.some((t) => D.place(cands, [[t, 'small', 'muted']], { owner: 'marg-note', ground: true, maxX: MX1, optional: true }));
            if (!ok) D.text(MX1, py1 + 16, [[`${under} < 1 ms`, 'small', 'muted']], { owner: 'marg-note', anchor: 'end' });
          }
        } else if (!m.stable && !hid.numbers) {
          // Past 100% there are no 100 requests to draw: the marginal says why, under the chevron.
          if (!hid.utilization) wrap(`${M.formatPct(m.rho * 100)} of capacity`, 'smallB', MX1 - MX0).forEach((t, i) => D.text(MX0, py0 + 12 + i * 14, [[t, 'smallB', 'bad']], { owner: 'over' }));
          const n = hid.utilization ? 0 : wrap(`${M.formatPct(m.rho * 100)} of capacity`, 'smallB', MX1 - MX0).length;
          wrap('no steady state', 'small', MX1 - MX0).forEach((t, i) => D.text(MX0, py0 + 12 + (n + i) * 14, [[t, 'small', 'bad']], { owner: 'over' }));
        } else {
          wrap('after your answer', 'small', MX1 - MX0).forEach((t, i) => D.text(MX0, (py0 + py1) / 2 + i * 14, [[t, 'small', 'muted']], { owner: 'marg' }));
        }
        D.region('chart', { x: pad - 8, y: chartTop - 4, w: W - 2 * pad + 16, h: py1 + 24 - chartTop + 4 });
        D.region('marginal', { x: MX0 - 6, y: chartTop - 4, w: MX1 - MX0 + 12, h: py1 + 24 - chartTop + 4 });
        y = py1 + 26;
        // Fan-out, at wide stages: one model line on what the p99 tick means for a page that calls many of these.
        if (wide) {
          if (!hid.numbers) {
            const share = M.formatPct((1 - 0.99 ** 50) * 100);
            const t = pick([`Fan-out: a page that calls 50 of these meets at least one slower than p99 on ${share} of loads.`, `A page calling 50 of these meets one past p99 on ${share} of loads.`], (f) => tw(f, 'small') <= W - 2 * pad);
            if (t) D.text(pad, y + 10, [[t, 'small', 'muted']], { owner: 'fanout' });
            else D.missing.push('fan-out');
          }
          y += 18;
        }
        D.label = summary(m, hid);
        D.view = view;
        return { D, H: y };
      }

      // ---------- The summary every surface shares: full sentences, obeying hiding().
      function summary(m, hid) {
        const s = m.settings;
        const who =
          s.servers === 1
            ? `One server, ${s.load}% busy`
            : `${serverWord(s.servers)} with ${s.queue === 'split' ? 'a queue each' : 'one shared queue'}${s.down ? `, one of them down` : ''}, ${s.load}% busy with all up`;
        const work = s.service === 'steady' ? `every request taking exactly ${fms(M.SERVICE_MS)}` : `requests taking ${fms(M.SERVICE_MS)} on average`;
        const parts = [`${who}, ${work}.`];
        const left = m.up === 1 ? 'the server left' : 'the servers left';
        if (hid.numbers) parts.push("The model's numbers show after your answer.");
        else if (critical(m)) parts.push(`There is no steady state: ${M.formatQps(m.ratePerS)} arrive, exactly what ${left} can serve, so the queue wanders without a bound and the waits keep growing.`);
        else if (!m.stable) parts.push(`There is no steady state: ${M.formatQps(m.ratePerS)} arrive and ${left} serve${m.up === 1 ? 's' : ''} ${M.formatQps(m.capacityPerS)}, so the queue grows by ${M.formatQps(m.growthPerS).replace('/s', '')} requests a second.`);
        else parts.push(`The model gives p50 ${fdur(m.p50)}, p99 ${fdur(m.p99)} and a mean of ${fdur(m.mean)}, of which ${fwait(m.meanWait)} is waiting.`);
        if (hid.sample) parts.push('The sample of requests plays after your answer.');
        return parts.join(' ');
      }

      // ---------- Focus outlines with their "Look here" tag on the first free place (prevention 5). An outline takes in
      // every text its region holds with 6 px to spare, so its stroke never runs along a text.
      function focusOutlines(D, ids, H) {
        const TAG = { w: 72, h: 16 };
        for (const id of ids) {
          for (const b of D.regions[id] ?? []) {
            let x0 = b.x;
            let y0 = b.y;
            let x1 = b.x + b.w;
            let y1 = b.y + b.h;
            for (const t of D.texts) {
              const cx = (t.x0 + t.x1) / 2;
              const cy = (t.y0 + t.y1) / 2;
              if (cx < b.x || cx > b.x + b.w || cy < b.y || cy > b.y + b.h) continue;
              x0 = Math.min(x0, t.x0 - 6);
              y0 = Math.min(y0, t.y0 - 6);
              x1 = Math.max(x1, t.x1 + 6);
              y1 = Math.max(y1, t.y1 + 6);
            }
            const x = Math.max(3, x0);
            const yy = Math.max(3, y0);
            const w = Math.min(D.W - 3, x1) - x;
            const h = Math.min(H - 3, y1) - yy;
            D.add('top', `<rect class="focus-outline" x="${r1(x)}" y="${r1(yy)}" width="${r1(w)}" height="${r1(h)}" rx="10"/>`);
            const across = [];
            for (let ax = x + w - TAG.w - 16; ax >= x + 16; ax -= 8) across.push(ax);
            const xs = [x + w - TAG.w - 16, x + 16, ...across];
            // On the outline's edge first (the house's place), then just inside, then inside rows, outside last.
            const ys = [yy - TAG.h / 2, yy + h - TAG.h / 2, yy + 4, yy + h - TAG.h - 4, yy + 24, yy + 44, yy - TAG.h - 2, yy + h + 2];
            let placed = false;
            for (const [tx, ty] of ys.flatMap((t) => xs.map((sx) => [sx, t]))) {
              const box = { x0: tx, x1: tx + TAG.w, y0: ty, y1: ty + TAG.h };
              if (tx < 3 || tx + TAG.w > D.W - 3 || ty < 3 || ty + TAG.h > H - 3) continue;
              if (!D.free(box, '', 1)) continue;
              D.add('top', `<rect class="tag" x="${r1(tx)}" y="${r1(ty)}" width="${TAG.w}" height="${TAG.h}" rx="8"/>`);
              D.add('top', `<text x="${r1(tx + TAG.w / 2)}" y="${r1(ty + 12)}" text-anchor="middle" data-owner="look" data-ground="1"><tspan class="t-look">LOOK HERE</tspan></text>`);
              D.mark(box, 'look');
              placed = true;
              break;
            }
            if (!placed) D.missingTags = (D.missingTags ?? 0) + 1;
          }
        }
      }

      // ---------- Mockup states.
      const B = M.BASE;
      const ALL = [];
      for (const servers of M.SERVERS)
        for (const queue of M.QUEUES)
          for (const service of M.SERVICES)
            for (const down of [0, 1])
              for (const load of M.LOADS) {
                if (servers === 1 && (queue === 'split' || down)) continue;
                ALL.push({ load, servers, queue, service, down });
              }
      window.ALL_SETTINGS = ALL;
      const CONFIGS = [];
      for (const servers of M.SERVERS)
        for (const queue of M.QUEUES)
          for (const service of M.SERVICES)
            for (const down of [0, 1]) if (!(servers === 1 && (queue === 'split' || down))) CONFIGS.push({ servers, queue, service, down });
      const freePlay = (s, frac) => {
        const play = M.playPlan(M.sample(s), false);
        return { play, tau: play.from + frac * (play.to - play.from) };
      };
      const STATES = {
        default: { s: B },
        quiet: { s: { ...B, load: 30 } },
        busy: { s: { ...B, load: 90 } },
        split: { s: { ...B, servers: 4, queue: 'split', load: 80 } },
        pool: { s: { ...B, servers: 4, queue: 'shared', load: 80 }, ghost: { ...B, servers: 4, queue: 'split', load: 80 } },
        steady: { s: { ...B, load: 90, service: 'steady' }, ghost: { ...B, load: 90 } },
        calm: { s: { ...B, servers: 4, load: 30, service: 'steady' } },
        down: { s: { ...B, servers: 3, load: 60, down: 1 }, ghost: { ...B, servers: 3, load: 60 } },
        overload: { s: { ...B, servers: 3, load: 70, down: 1 } },
        critical: { s: { ...B, servers: 2, load: 50, down: 1 } },
        playing: { s: B, frac: 0.59 },
        describe: { s: B, describe: true },
        reduced: { s: B, reduced: true },
        ask: { exp: 0, phase: 'asking' },
        reveal: { exp: 1, phase: 'revealed' },
        challenge: { exp: 5, phase: 'challenge' },
      };
      const actSettings = (spec) => ({ ...spec.setup, ...(spec.act?.set ?? {}) });
      const sameConfig = (a, b) => JSON.stringify(configOf(a)) === JSON.stringify(configOf(b));
      function viewOf(name) {
        const st = STATES[name] ?? STATES.default;
        const expParam = params.get('exp');
        const expIdx = expParam !== null && st.exp !== undefined ? Number(expParam) - 1 : st.exp;
        if (expIdx === undefined) {
          const fp = st.frac !== undefined ? freePlay(st.s, st.frac) : { play: null, tau: null };
          return { s: st.s, hide: [], phase: 'rest', ghost: st.ghost ?? null, ...fp, describe: !!st.describe, reduced: !!st.reduced };
        }
        const spec = M.EXPERIMENTS[expIdx];
        if (spec.goal) return expView(spec, params.get('start') === '1' ? 'start' : 'challenge');
        const phase = params.get('phase') === 'playing' && st.phase === 'asking' ? 'playing' : st.phase;
        return expView(spec, phase, Number(params.get('frac') ?? 0.6));
      }
      /** One experiment's view: asking (from whatever setting came before, which must leave no trace), the answer's play at
       * a fraction of its clock, revealed, or the challenge met or at its start. */
      function expView(spec, phase, frac = 0.6, from = null) {
        const e = M.renderExperiment(spec);
        if (spec.goal) {
          const s = phase === 'start' ? spec.setup : { ...spec.setup, ...M.CHALLENGE_SOLUTION };
          const m = M.run(s);
          const met = M.goalMet(spec.goal, m.settings, m.metrics);
          return { s, hide: [], exp: e, spec, phase: 'challenge', met, focus: met ? spec.focus : [], ghost: null, tau: null };
        }
        const after = actSettings(spec);
        const setupM = M.run(spec.setup);
        const moved = !sameConfig(spec.setup, after) || Math.abs(M.run(after).rho - setupM.rho) > 1e-9;
        const play = phase === 'playing' ? M.playPlan(M.sample(after), true) : null;
        const sampleShown = !spec.hide.includes('sample');
        return {
          s: phase === 'asking' ? spec.setup : after,
          hide: phase === 'revealed' ? [] : spec.hide,
          exp: e,
          spec,
          phase,
          chosen: e.answer === 0 ? 1 : 0,
          focus: phase === 'revealed' ? spec.focus : [],
          setupRho: setupM.rho,
          configChanged: !sameConfig(spec.setup, after),
          ghost: phase === 'asking' ? from : moved ? spec.setup : null,
          play,
          tau: play ? play.from + frac * (play.to - play.from) : null,
          qFloor: phase !== 'asking' && sampleShown ? scaleOf(M.sample(spec.setup), setupM, true) : null,
        };
      }
      window.expView = expView;

      // ---------- The page around the stage.
      function controlsHtml(m, view) {
        const s = m.settings;
        const locked = view.phase === 'asking' || view.phase === 'playing';
        const dis = locked ? ' disabled' : '';
        const one = s.servers === 1;
        const seg = (name, items, cur, disabledAll = false) =>
          items.map(([v, label]) => `<label class="segment"><input type="radio" name="${name}" ${v === cur ? 'checked' : ''}${disabledAll ? ' disabled' : ''}/><span>${label}</span></label>`).join('');
        return `<fieldset class="group servers-control"${dis}><legend class="control-label">Servers</legend><div class="segments">${seg(
          'servers',
          M.SERVERS.map((k) => [k, String(k)]),
          s.servers,
        )}</div></fieldset>
<fieldset class="group queue-control"${locked ? ' disabled' : ''}><legend class="control-label">Queue${one ? '<span class="why"> · one server has one queue</span>' : ''}</legend><div class="segments">${seg(
          'queue',
          [
            ['shared', 'One queue'],
            ['split', 'A queue each'],
          ],
          s.queue,
          one,
        )}</div></fieldset>
<fieldset class="group"${dis}><legend class="control-label">Conditions</legend><div class="toggles">
<label class="segment"><input type="checkbox" ${s.service === 'steady' ? 'checked' : ''}/><span>Steady work<small>${fms(M.SERVICE_MS)} each</small></span></label>
<label class="segment"><input type="checkbox" ${s.down ? 'checked' : ''}${one ? ' disabled' : ''}/><span>A server down<small>${one ? 'needs two or more' : 'its traffic moves'}</small></span></label></div></fieldset>
<p class="notice" aria-live="polite">${esc(noticeOf(m, view))}</p>`;
      }
      function noticeOf(m, view) {
        if (view.phase === 'asking') return 'Play and the settings this question is about wait for your answer.';
        if (view.phase === 'playing' || view.phase === 'challenge') return '';
        if (view.reduced) return sampleStory(m, M.sample(m.settings));
        return 'Drag the load, or change the servers, the queue and the conditions; Play runs the sample.';
      }
      /** What the sample did, in order, for the notice and the Reduced-motion caption: every number is written. */
      function sampleStory(m, smp) {
        const arrivals = smp.reqs.filter((r) => r.arrive >= 0).length;
        const span = `${smp.stable ? 'the last' : 'the first'} ${fdur(smp.window)}`;
        const end = M.linesAt(smp, smp.window - 1e-6).total;
        const endWords = end ? `${end} ${plural(end, 'was', 'were')} waiting at the end` : 'nobody was waiting at the end';
        const r = smp.rest;
        const at = fdur(Math.round(r.t));
        const first = `In this sample, ${arrivals} ${plural(arrivals, 'request', 'requests')} arrived in ${span}.`;
        if (r.kind === 'none') return `${first} None had to wait.`;
        if (r.kind === 'idle') return `${first} At ${at}, S${r.idle + 1} sat idle while ${r.n} waited in S${r.line + 1}'s line; ${endWords}.`;
        if (r.kind === 'most') return `${first} The most were waiting at ${at}: ${r.n} across the ${smp.up} lines; ${endWords}.`;
        return `${first} The line grew to ${r.n} waiting at ${at}; ${endWords}.`;
      }
      const ICON_RIGHT = '<svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--g-success-line)"/><path d="M6 10.2l2.6 2.6 5.2-5.6" fill="none" stroke="var(--g-surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const ICON_WRONG = '<svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--g-danger)"/><path d="M7 7l6 6M13 7l-6 6" fill="none" stroke="var(--g-surface)" stroke-width="2" stroke-linecap="round"/></svg>';
      /** The challenge's status, each bound in the ask's own terms and its state in words (the house goalParts). */
      function goalChecks(m) {
        const b = M.CHALLENGE_BOUNDS;
        const said = (met) => (met ? 'met' : 'not yet');
        const p99met = m.stable && m.p99 < b.p99;
        const loadMet = m.settings.load >= b.load;
        return [
          { met: p99met, text: m.stable ? `p99 with one server down: ${fdur(m.p99)}, under ${fms(b.p99)}: ${said(p99met)}` : `p99 with one server down: grows without bound, needs under ${fms(b.p99)}: ${said(false)}` },
          { met: loadMet, text: `the fleet at ${m.settings.load}% busy with all up, at least ${b.load}%: ${said(loadMet)}` },
        ];
      }
      function dockHtml(m, view) {
        const e = view.exp;
        if (!e) return '';
        if (view.phase === 'challenge') {
          const checks = goalChecks(m);
          const kept = M.goalMet({ all: [], keep: view.spec.goal.keep }, m.settings, m.metrics);
          const status = view.met ? 'Goal met:' : kept ? '' : 'The goal keeps a server down and random work.';
          return `<p class="legend">${esc(e.ask)}</p>${status ? `<p class="status-line${view.met ? ' met' : ''}" role="status">${view.met ? ICON_RIGHT : ''}${esc(status)}</p>` : ''}<ul class="status">${checks
            .map((c) => `<li class="${c.met ? 'met' : ''}"><span class="state" aria-hidden="true">${c.met ? '✓' : '·'}</span><span>${esc(c.text)}</span></li>`)
            .join('')}</ul>${view.met ? `<p class="reveal" aria-live="polite">${esc(e.reveal)}</p>` : ''}`;
        }
        if (view.phase === 'asking') {
          return `<fieldset style="border:0;padding:0;margin:0"><legend class="legend">${esc(e.ask)}</legend><div class="options">${e.choices.map((c) => `<button class="g-choice">${esc(c)}</button>`).join('')}</div></fieldset>`;
        }
        const marked = e.choices
          .map((c, i) => {
            const right = view.phase === 'revealed' && i === e.answer;
            const wrong = view.phase === 'revealed' && i === view.chosen && !right;
            const chosen = view.phase === 'playing' && i === view.chosen;
            return `<li class="g-choice${right ? ' right' : wrong ? ' wrong' : ''}"${chosen ? ' style="border-style:dashed"' : ''}><span>${esc(c)}${chosen ? ' <small>(your guess)</small>' : ''}</span>${right ? ICON_RIGHT : wrong ? ICON_WRONG : ''}</li>`;
          })
          .join('');
        if (view.phase === 'playing') return `<p class="legend">${esc(e.ask)}</p><ul class="options">${marked}</ul><p class="held">Watch the picture: the answer plays out on it.</p>`;
        return `<p class="legend">${esc(e.ask)}</p><ul class="options">${marked}</ul><p class="reveal" aria-live="polite">${esc(e.reveal)}</p>`;
      }
      function cardsHtml(view) {

        return check(well, D, m);
      };

      // ---------- The no-answer sweep: while a question asks and while its answer plays, no rendered text, accessible
      // name or structure may hold its answer or a false claim (prevention 1 and 2). Each question is entered from the
      // settings every act leads to (and, at two widths, from every configuration), so nothing a learner did before
      // can carry an answer in.
      const e5After = M.run(actSettings(M.EXPERIMENTS[4]));
      const GIVEAWAYS = {
        'idle-yet-waiting': ['of requests wait', 'waiting now', 'waiting at', '20 ms', '10 ms waiting', 'longest', 'idle', 'first in line', 'Last to leave', 'nobody wait', 'Nobody wait'],
        knee: ['90 ms waiting', '461 ms', '69 ms', '3×'],
        pool: ['7.46', '7.5 ms', '59.6%', '57.4%', '69 ms', '17 ms', 'shared queue hands'],
        steady: ['45 ms', '229 ms', '55 ms', '40 ms'],
        'lose-one': ['No steady state', 'no steady state', 'of capacity', M.formatPct(e5After.rho * 100), 'grows', 'without bound', '200/s', 'starting empty', 'from empty', 'first 4 s', 'First 4 s', '× slower', 'real time', 'model:'],
      };
      // A sample's words are its payoff during the answer's play, so E1's play may show them.
      const PLAY_ALLOWS = { 'idle-yet-waiting': ['waiting now', 'waiting at', 'idle', 'first in line', 'longest', 'nobody wait', 'Nobody wait'] };
      function structural(well, spec, phase) {
        const out = [];
        const svg = well.querySelector('svg.draw');
        const hide = new Set(spec.hide);
        const text = svg.textContent;
        if (!well.querySelector('.play')?.disabled) out.push('Play is enabled');
        if (well.querySelector('.handle')?.getAttribute('aria-disabled') !== 'true') out.push('the load handle is enabled');
        if (hide.has('sample') && phase === 'asking') {
          if (svg.querySelector('.dot.wait, .dot.serve, .tick-arr, .busy, .area-wait, .peak, .ring-arc')) out.push('a sample mark while the sample waits');
          if (svg.querySelector('.lane:not(.hidden), .ring-track:not(.hidden)')) out.push('a solid lane or ring track while the sample waits');
        }
        const numbersHidden = hide.has('numbers') || (hide.has('after') && phase === 'playing');
        const modelMark = svg.querySelector('.dot.req, .dot.p50, .dot.p99, .bar-work, .bar-wait, .leader, .mtick, .chevron, .drift');
        if (numbersHidden && modelMark) out.push(`a model mark while the numbers wait: ${modelMark.getAttribute('class')}`);
        if (hide.has('numbers') && svg.querySelector('.curve.p50, .curve.p99')) out.push('a curve while the numbers wait');
        if (numbersHidden) for (const t of svg.querySelectorAll('text[data-id^="stat-"]')) if (t.textContent !== '?') out.push(`${t.dataset.id} reads "${t.textContent}"`);
        if (hide.has('utilization') && phase === 'playing') {
          if (!/up · (each )?\?%/.test(text)) out.push('the servers label shows the new load');
          if (svg.querySelector('.srv.over, .xmark[data-owner="slabel"]')) out.push('an over-capacity mark while the load waits');
        }
        if (hide.has('stability') && phase === 'playing' && svg.querySelector('.drift, [data-id="rate-note"]')) out.push("the drift or the play's speed while stability waits");
        if (hide.has('after') && phase === 'playing' && svg.querySelector('.cursor')) out.push('the cursor at the new setting while the answer plays');
        if (phase === 'asking' && svg.querySelector('.curve.ghost, .ghost-dot, .ghost-arrow, text[data-owner~="ghost"]')) out.push('a ghost of an earlier setting while the question asks');
        if (hide.has('ahead')) {
          const cut = svg.querySelector('.cut');
          for (const p of svg.querySelectorAll('.curve.p50, .curve.p99')) {
            const box = p.getBBox();
            if (cut && box.x + box.width > Number(cut.getAttribute('x1')) + 0.6) out.push('a curve past the cut');
          }
        }
        return out;
      }
      function giveaways(well, spec, phase) {
        const text = stageText(well);
        const allow = phase === 'playing' ? (PLAY_ALLOWS[spec.id] ?? []) : [];
        const out = [];
        for (const g of [...(GIVEAWAYS[spec.id] ?? []), ...FALSE_CLAIMS]) {
          if (allow.includes(g)) continue;
          if (typeof g === 'string' ? text.includes(g) : g.test(text)) out.push(`"${g}"`);
        }
        return out;
      }
      const ACT_TARGETS = [...M.EXPERIMENTS.filter((e) => e.act).map(actSettings), { ...M.EXPERIMENTS[5].setup, ...M.CHALLENGE_SOLUTION }];
      window.noAnswer = function (widths, allConfigsAt = []) {
        const well = document.getElementById('well');
        const out = [];
        let renders = 0;
        for (const W of widths) {
          well.style.width = W + 2 + 'px';
          for (const spec of M.EXPERIMENTS.filter((e) => !e.goal)) {
            const froms = [null, ...ACT_TARGETS, ...(allConfigsAt.includes(W) ? CONFIGS.map((c) => ({ ...c, load: 70 })) : [])];
            const runs = [...froms.map((f) => ['asking', null, f]), ...[0, 0.15, 0.45, 0.8, 1].map((f) => ['playing', f, null])];
            for (const [phase, frac, from] of runs) {
              const view = expView(spec, phase, frac ?? 0.6, from);
              drawInto(well, W, M.run(view.s), view);
              renders++;
              const where = `W${W} ${spec.id} ${phase}${frac !== null ? ` ${frac}` : ''}${from ? ` from ${show({ ...from })}` : ''}`;
              for (const g of [...giveaways(well, spec, phase), ...structural(well, spec, phase)]) out.push(`${where}: ${g}`);
            }
          }
        }
        well.style.width = '';
        return { renders, out };
      };
      // Plants leaks on copies of views to prove the sweep catches each: E2 played without `after`, E1 asked without
      // `sample`, E5 played without `stability` (its timeline says the window starts empty), and E3 asked with the ghost
      // of the setting before it.
      window.plantedLeaks = function (W) {
        const well = document.getElementById('well');
        well.style.width = W + 2 + 'px';
        const caught = [];
        const tryLeak = (id, phase, patch, from = null) => {
          const spec = M.EXPERIMENTS.find((e) => e.id === id);
          const view = { ...expView(spec, phase, 0.6, from), ...patch };
          drawInto(well, W, M.run(view.s), view);
          caught.push(giveaways(well, spec, phase).length + structural(well, spec, phase).length > 0);
        };
        tryLeak('knee', 'playing', { hide: ['ahead'] });
        tryLeak('idle-yet-waiting', 'asking', { hide: ['numbers'] });
        tryLeak('lose-one', 'playing', { hide: ['after', 'utilization'] });
        tryLeak('pool', 'asking', { leakGhost: true }, { ...B, servers: 4, queue: 'shared', load: 80 });
        well.style.width = '';
        return caught;
      };
      window.heights = function (widths) {
        const out = {};
        for (const W of widths) {
          const hs = new Set();
          for (const s of ALL) hs.add(buildStage(W, M.run(s), { hide: [], phase: 'rest', tau: null }).H);
          for (const s of ALL.filter((_, i) => i % 7 === 0)) hs.add(buildStage(W, M.run(s), { hide: [], phase: 'rest', ...freePlay(s, 0.5) }).H);
          for (const spec of M.EXPERIMENTS)
            for (const phase of spec.goal ? ['challenge', 'start'] : ['asking', 'playing', 'revealed']) {
              const v = expView(spec, phase);
              hs.add(buildStage(W, M.run(v.s), v).H);
            }
          out[W] = [...hs];
        }
        return out;
      };
      window.stageHeight = (W, s = M.BASE) => buildStage(W, M.run(s), { hide: [], phase: 'rest', tau: null }).H;
      window.widgetHeight = () => document.getElementById('widget').getBoundingClientRect().height;
      // Every Describe, summary and notice any setting prints, for the false-claim regexes.
      window.pageWords = function () {
        const out = [];
        for (const s of ALL) {
          const m = M.run(s);
          const smp = M.sample(s);
          const words = [summary(m, {}), sampleStory(m, smp), ...[true, false].map((c) => JSON.stringify(describeRows(m, c))), ...goalChecks(m).map((g) => g.text)].join(' | ');
          for (const g of FALSE_CLAIMS) if (g.test(words)) out.push(`${show(s)}: ${g} in "${words.match(g)[0]}"`);
        }
        return out;
      };

      const stateName = params.get('state') ?? 'default';
      Promise.all([
        document.fonts.load('600 11px "Inter Variable"'),
        document.fonts.load('500 13px "Inter Variable"'),
        document.fonts.load('600 13px "Inter Variable"'),
        document.fonts.load('700 11px "Inter Variable"'),
        document.fonts.load('600 11px "JetBrains Mono Variable"'),
      ]).then(() => {
        const first = render(stateName);
        const well = document.getElementById('well');
        const issues = check(well, first.D, first.m);
        render(stateName);
        window.__collisions = issues;
        document.body.dataset.ready = '1';
      });
    </script>
  </body>
</html>
