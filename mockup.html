<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unique IDs widget mockup</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url(fonts/inter-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        src: url(fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 800;
        font-display: block;
      }
      /* The app's tokens (apps/app/src/_theme.scss, styles.scss): light is the base, dark overrides. */
      :root {
        color-scheme: light;
        --g-bg: #f4f5f9;
        --g-surface: #ffffff;
        --g-raised: #ffffff;
        --g-sunken: #eef0f5;
        --g-line: #dfe2ea;
        --g-line-strong: #c6cbd6;
        --g-stroke: #707889;
        --g-text: #161a23;
        --g-text-rgb: 22, 26, 35;
        --g-muted: #4a5263;
        --g-faint: #5c6477;
        --g-on-fill: #ffffff;
        --g-warn-ink: #6e4200;
        --g-danger-ink: #9d1630;
        --g-found-ink: #02583f;
        --g-accent: #5846dc;
        --g-accent-rgb: 88, 70, 220;
        --g-accent-soft: rgba(88, 70, 220, 0.14);
        --g-found: #036b4c;
        --g-danger: #c3203d;
        --g-warn: #945800;
        --g-success-ink: var(--g-found-ink);
        --g-success-line: var(--g-found);
        --g-success-soft: rgba(3, 107, 76, 0.12);
        --g-danger-soft: rgba(195, 32, 61, 0.12);
        --g-warn-soft: rgba(148, 88, 0, 0.12);
        --g-viz-stage: #f7f8fb;
        --g-viz-current: #0b74ad;
        --g-viz-current-soft: rgba(11, 116, 173, 0.16);
        --g-viz-considering: #c77700;
        --g-viz-considering-soft: rgba(199, 119, 0, 0.14);
        --g-viz-final: #12925f;
        --g-viz-final-ink: var(--g-found-ink);
        --g-viz-discarded-ink: #687082;
        --g-viz-critical: #d42a49;
        --g-viz-track: #d3d7e0;
        --g-shadow: 0 1px 2px rgba(var(--g-text-rgb), 0.06), 0 3px 10px rgba(var(--g-text-rgb), 0.07);
        --g-shadow-raised: 0 1px 2px rgba(var(--g-text-rgb), 0.08);
        --g-radius-xs: 6px;
        --g-radius-sm: 10px;
        --g-radius-md: 14px;
        --g-radius-pill: 999px;
        --g-text-title-m: 1.0625rem;
        --g-text-title-s: 0.9375rem;
        --g-text-body: 0.875rem;
        --g-text-body-s: 0.8125rem;
        --g-text-label: 0.6875rem;
        --g-font: 'Inter Variable', system-ui, sans-serif;
        --g-font-mono: 'JetBrains Mono Variable', ui-monospace, monospace;
        --g-focus-ring: 2px solid var(--g-accent);
      }
      :root.dark {
        color-scheme: dark;
        --g-bg: #0b0d12;
        --g-surface: #141824;
        --g-raised: #1c2130;
        --g-sunken: #0f121a;
        --g-line: #252a37;
        --g-line-strong: #343b4d;
        --g-stroke: #6b7387;
        --g-text: #e9ebf2;
        --g-text-rgb: 233, 235, 242;
        --g-muted: #8b93a8;
        --g-faint: #828a9e;
        --g-on-fill: #0b0d12;
        --g-warn-ink: #f3e6b3;
        --g-danger-ink: #ffb3bd;
        --g-found-ink: #3ddc97;
        --g-accent: #9d8cff;
        --g-accent-rgb: 157, 140, 255;
        --g-accent-soft: rgba(157, 140, 255, 0.14);
        --g-found: #3ddc97;
        --g-danger: #ff5d73;
        --g-warn: #ffb547;
        --g-success-soft: rgba(61, 220, 151, 0.12);
        --g-danger-soft: rgba(255, 93, 115, 0.12);
        --g-warn-soft: rgba(255, 181, 71, 0.12);
        --g-viz-stage: #0e1118;
        --g-viz-current: #1f9fd0;
        --g-viz-current-soft: rgba(31, 159, 208, 0.16);
        --g-viz-considering: #c08420;
        --g-viz-considering-soft: rgba(192, 132, 32, 0.18);
        --g-viz-final: #22ad74;
        --g-viz-final-ink: var(--g-found);
        --g-viz-discarded-ink: var(--g-muted);
        --g-viz-critical: #e5485f;
        --g-viz-track: #2a3040;
        --g-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        --g-shadow-raised: var(--g-shadow);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--g-bg);
        color: var(--g-text);
        font: 400 var(--g-text-body) / 1.5 var(--g-font);
        font-variant-ligatures: none;
        -webkit-font-smoothing: antialiased;
        overflow-wrap: break-word;
      }
      .page {
        max-width: 1048px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      .eyebrow {
        margin: 0;
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
      }
      h1 {
        margin: 4px 0 14px;
        font: 600 1.25rem/1.3 var(--g-font);
      }
      /* Narrow: one column: the stage, the question, the controls, Describe, the cards. */
      .widget {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }
      .main,
      .side {
        display: contents;
      }
      .stage {
        order: 1;
        min-width: 0;
      }
      .dock {
        order: 2;
      }
      .controls {
        order: 3;
      }
      .describe {
        order: 4;
      }
      .heading,
      .cards {
        order: 5;
      }
      @media (min-width: 1000px) {
        .widget {
          grid-template-columns: minmax(0, 1fr) 320px;
          align-items: start;
          column-gap: 20px;
        }
        .main {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: 12px;
          grid-column: 1;
          min-width: 0;
        }
        .side {
          display: grid;
          gap: 12px;
          grid-column: 2;
          grid-row: 1;
          min-width: 0;
          position: sticky;
          top: 12px;
        }
        .heading {
          margin-top: 8px;
        }
      }
      .well {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background-color: var(--g-viz-stage);
      }
      fieldset.group {
        margin: 0;
        padding: 0;
        border: 0;
        min-width: 0;
      }
      .controls {
        display: grid;
        gap: 14px;
        min-width: 0;
        padding: 14px;
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background: var(--g-surface);
      }
      .controls h2 {
        margin: 0;
        font: 600 var(--g-text-title-s) var(--g-font);
      }
      .control-label {
        display: block;
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
        padding: 0;
        margin-bottom: 6px;
      }
      .control-label .why {
        font-weight: 500;
        letter-spacing: normal;
        text-transform: none;
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .segments {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 4px;
      }
      .segments.two-by-two {
        grid-auto-flow: row;
        grid-template-columns: 1fr 1fr;
      }
      .segment {
        position: relative;
        min-width: 0;
      }
      .segment input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      /* A checked segment changes colour only, never weight, so its label keeps its width (rule 20). */
      .segment > span {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 6px;
        border-radius: var(--g-radius-sm);
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        font: 500 var(--g-text-body-s) / 1.2 var(--g-font);
        text-align: center;
      }
      .segment input:checked + span {
        background: var(--g-accent-soft);
        border-color: var(--g-accent);
        box-shadow: inset 0 0 0 1px var(--g-accent);
      }
      .segment input:focus-visible + span,
      .stepper button:focus-visible,
      .g-btn:focus-visible,
      .card-btn:focus-visible,
      .g-choice:focus-visible {
        outline: var(--g-focus-ring);
        outline-offset: 2px;
      }
      fieldset:disabled .segment span,
      fieldset:disabled .stepper {
        opacity: 0.55;
      }
      .stepper {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        align-items: center;
        border: 1px solid var(--g-line-strong);
        border-radius: var(--g-radius-sm);
        background: var(--g-raised);
        min-height: 44px;
      }
      .stepper button {
        width: 44px;
        height: 44px;
        border: 0;
        background: none;
        color: var(--g-accent);
        font: 600 1.125rem var(--g-font);
        cursor: pointer;
      }
      .stepper output {
        text-align: center;
        font: 600 var(--g-text-body) var(--g-font-mono);
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        font: 500 var(--g-text-body-s) var(--g-font);
      }
      .toggle input {
        width: 20px;
        height: 20px;
        margin: 12px;
        accent-color: var(--g-accent);
      }
      .range {
        display: grid;
        gap: 2px;
      }
      .range input {
        width: 100%;
        height: 44px;
        margin: 0;
        accent-color: var(--g-accent);
      }
      .range output {
        font: 500 var(--g-text-body-s) var(--g-font);
        color: var(--g-muted);
      }
      .notice {
        margin: 0;
        min-height: 3lh;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      .caption {
        margin: 8px 2px 0;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      .play {
        position: absolute;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        z-index: 2;
      }
      .play svg {
        display: block;
        width: 34px;
        height: 34px;
        margin: 5px;
      }
      .play circle {
        fill: var(--g-raised);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .play path {
        fill: var(--g-accent);
      }
      .play:disabled {
        cursor: default;
        opacity: 0.45;
      }
      svg.draw {
        display: block;
        overflow: visible;
      }
      svg.draw text {
        paint-order: stroke;
        stroke: var(--g-viz-stage);
        stroke-width: 3px;
        stroke-linejoin: round;
      }
      svg.draw text.on-fill {
        stroke: none;
      }
      .t-label {
        font: 600 11px var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: var(--g-muted);
      }
      .t-cap {
        font: 500 13px var(--g-font);
        fill: var(--g-text);
      }
      .t-capM {
        font: 500 13px var(--g-font);
        fill: var(--g-muted);
      }
      .t-capB {
        font: 600 13px var(--g-font);
        fill: var(--g-text);
      }
      .t-small {
        font: 500 11px var(--g-font);
        fill: var(--g-muted);
      }
      .t-smallB {
        font: 700 11px var(--g-font);
        fill: var(--g-text);
      }
      .t-mono {
        font: 600 11px var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-monoR {
        font: 500 11px var(--g-font-mono);
        fill: var(--g-muted);
      }
      .t-monoL {
        font: 600 13px var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-bit {
        font: 600 10px var(--g-font-mono);
      }
      .ink {
        fill: var(--g-text);
      }
      .muted {
        fill: var(--g-muted);
      }
      .bad {
        fill: var(--g-danger-ink);
      }
      .warn {
        fill: var(--g-warn-ink);
      }
      .acc {
        fill: var(--g-accent);
      }
      /* Each field: its colour, its tint, its ink (text at 4.5:1 or more on the tint) and its filled cell (on-fill digits at 4.5:1 or more). */
      .f-time {
        --f: var(--g-viz-current);
        --fs: var(--g-viz-current-soft);
        --fi: #065a87;
        --f1: #065a87;
      }
      .f-gen {
        --f: var(--g-viz-considering);
        --fs: var(--g-viz-considering-soft);
        --fi: #7f4a00;
        --f1: #7f4a00;
      }
      .f-seq {
        --f: var(--g-viz-final);
        --fs: rgba(18, 146, 95, 0.15);
        --fi: #02583f;
        --f1: #02583f;
      }
      .f-sign {
        --f: var(--g-stroke);
        --fs: rgba(var(--g-text-rgb), 0.06);
        --fi: var(--g-muted);
        --f1: var(--g-muted);
      }
      :root.dark .f-time {
        --fi: #6cc6ee;
        --f1: var(--g-viz-current);
      }
      :root.dark .f-gen {
        --fi: #f0b860;
        --f1: var(--g-viz-considering);
      }
      :root.dark .f-seq {
        --fi: #3ddc97;
        --f1: var(--g-viz-final);
      }
      :root.dark .f-sign {
        --fi: #a3aabb;
        --f1: var(--g-stroke);
      }
      .cell1 {
        fill: var(--f1);
      }
      .cellE {
        fill: var(--fs);
        stroke: var(--f);
        stroke-opacity: 0.35;
        stroke-width: 1;
        stroke-dasharray: 0;
      }
      .field-ink {
        fill: var(--fi);
      }
      .field-bracket {
        fill: none;
        stroke: var(--f);
        stroke-width: 1.25;
      }
      .cell0 {
        fill: var(--fs);
        stroke: var(--f);
        stroke-opacity: 0.35;
        stroke-width: 1;
      }
      .bit1 {
        fill: var(--g-on-fill);
        stroke: none;
      }
      .bit0 {
        fill: var(--fi);
        stroke: none;
      }
      .chip {
        fill: var(--f);
      }
      .field-tone {
        fill: var(--f);
      }
      .rule {
        stroke: var(--g-line);
        stroke-width: 1;
      }
      .rule-strong {
        stroke: var(--g-line-strong);
        stroke-width: 1;
      }
      .axis {
        stroke: var(--g-stroke);
        stroke-width: 1;
      }
      .grid {
        stroke: var(--g-line);
        stroke-width: 1;
      }
      .lane-bg {
        fill: rgba(var(--g-text-rgb), 0.025);
      }
      .tick-band {
        fill: rgba(var(--g-text-rgb), 0.035);
      }
      .dot {
        fill: var(--g-text);
      }
      .dot.inspect {
        fill: var(--g-accent);
      }
      .dot.repeat {
        fill: var(--g-viz-critical);
      }
      .dot.late {
        fill: var(--g-viz-stage);
        stroke: var(--g-viz-considering);
        stroke-width: 1.75;
      }
      .dot.first {
        fill: var(--g-viz-stage);
        stroke: var(--g-viz-critical);
        stroke-width: 1.75;
      }
      .ghost {
        fill: var(--g-viz-stage);
        stroke: var(--g-muted);
        stroke-width: 1.5;
      }
      .ghost-arrow {
        fill: none;
        stroke: var(--g-muted);
        stroke-width: 1.25;
      }
      .goal {
        stroke: var(--g-warn);
        stroke-width: 2;
      }
      .twin-arc {
        fill: none;
        stroke: var(--g-viz-critical);
        stroke-width: 1;
      }
      .clock-step {
        stroke: var(--g-viz-critical);
        stroke-width: 1.5;
      }
      .own-tick {
        stroke: var(--g-warn);
        stroke-width: 1;
      }
      .ring {
        fill: none;
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .ring.bad {
        stroke: var(--g-viz-critical);
        fill: none;
      }
      .wait-line {
        stroke: var(--g-viz-considering);
        stroke-width: 2;
        stroke-linecap: round;
      }
      .arrival {
        fill: none;
        stroke: var(--g-viz-considering);
        stroke-width: 1.5;
      }
      .gauge-bg {
        fill: rgba(var(--g-text-rgb), 0.05);
        stroke: var(--g-line-strong);
        stroke-width: 1;
      }
      .gauge {
        fill: var(--g-viz-final);
      }
      .bracket {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1;
      }
      .bracket.bad {
        stroke: var(--g-viz-critical);
        stroke-width: 1.5;
      }
      .now-line {
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .order-line {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1;
        stroke-opacity: 0.6;
      }
      .curve {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1.5;
      }
      .curve.cur {
        stroke: var(--g-accent);
        stroke-width: 2.5;
      }
      .tri {
        fill: none;
        stroke: var(--g-muted);
        stroke-width: 1;
      }
      .ruler-step {
        stroke: var(--g-stroke);
        stroke-width: 1;
      }
      .marker {
        fill: var(--g-accent);
      }
      .marker.bad {
        fill: var(--g-viz-critical);
      }
      .now-mark {
        fill: var(--g-text);
      }
      .page-box {
        fill: var(--g-raised);
        stroke: var(--g-line-strong);
        stroke-width: 1;
      }
      .page-box.hot {
        fill: var(--g-viz-current-soft);
        stroke: var(--g-viz-current);
      }
      .insert {
        stroke: var(--g-viz-current);
        stroke-width: 2;
      }
      /* Opaque: a hidden box sits over every grid, lane and now line, so none crosses its words. */
      .hidden-box {
        fill: var(--g-viz-stage);
        stroke: var(--g-stroke);
        stroke-width: 1.5;
        stroke-dasharray: 5 4;
      }
      .focus-outline {
        fill: none;
        stroke: var(--g-accent);
        stroke-width: 2;
      }
      .tag {
        fill: var(--g-viz-stage);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .t-look {
        font: 600 11px var(--g-font);
        fill: var(--g-accent);
      }
      .bar-fill {
        fill: var(--g-viz-final);
        opacity: 0.35;
      }
      /* The experiment dock and cards (experiment-dock.component.ts, widget-check.component.ts). */
      .dock {
        padding: 12px 16px;
        border-radius: var(--g-radius-md);
        border: 1px solid var(--g-line);
        border-left: 3px solid var(--g-accent);
        background: var(--g-surface);
      }
      .dock:empty {
        display: none;
      }
      .dock .eyebrow {
        margin-bottom: 4px;
      }
      .legend {
        margin: 0 0 4px;
        font-weight: 600;
        line-height: 1.45;
      }
      .options {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: grid;
        gap: 14px;
      }
      .g-choice {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 44px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        color: var(--g-text);
        font: 500 0.90625rem/1.45 var(--g-font);
        text-align: left;
        box-shadow: var(--g-shadow-raised);
        cursor: pointer;
      }
      .g-choice.right {
        border-color: var(--g-success-line);
        background: var(--g-success-soft);
      }
      .g-choice.wrong {
        border-color: var(--g-danger);
        background: var(--g-danger-soft);
      }
      .g-choice[disabled] {
        cursor: default;
      }
      /* The tag sits on the choice's top border, out of the text's flow, so a choice keeps its size when tagged. */
      .mark {
        position: absolute;
        top: -9px;
        right: 12px;
        padding: 0 6px;
        border-radius: var(--g-radius-pill);
        background: var(--g-surface);
        font: 600 0.75rem / 16px var(--g-font);
        color: var(--g-muted);
      }
      .g-choice.right .mark {
        color: var(--g-success-ink);
      }
      .g-choice.wrong .mark {
        color: var(--g-danger-ink);
      }
      .held {
        margin: 10px 0 0;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      .reveal {
        margin: 10px 0 0;
        line-height: 1.55;
        font-size: 0.90625rem;
      }

// The stage.

  // Notes beside a row: placed where they cross no line, dot or word.
  const note = (r, s, cls) => {
    const xx = X(r.x.issued);
    const yy = ry(r.i);
    for (const [lx, anchor] of [[xx + 10, 'start'], [xx - 10, 'end'], [xx + 22, 'start'], [xx - 22, 'end'], [X(0) + 4, 'start'], [W - pad, 'end']]) {
      const b = textBox('small', lx, yy, s, anchor);
      if (b.x0 < X(0) - 2 || b.x1 > W - pad) continue;
      if (clearBox(b, 2)) {
        text('small', lx, yy, s, { anchor, cls, kind: 'note' });
        return true;
      }
    }
    return false;
  };
  for (const r of rowsMade) {
    if (!(r.x.repeatOf && !H.repeats)) continue;
    const above = rowsMade.find((o) => o.i === r.i - 1);
    reg.notes.push({ ok: !!above && above.x.id === r.x.id, key: r.x.key });
    note(r, 'same id as the row above', 'bad') || note(r, 'same id as above', 'bad') || note(r, 'repeat', 'bad');
  }
  if (view.pair) {
    const g1 = rowsMade.find((r) => r.x.key === view.pair[0]);
    const g2 = rowsMade.find((r) => r.x.key === view.pair[1]);
    if (g1 && g2) note(g1, `made ${F.ms(g1.x.issued - g2.x.issued)} later, sorts first`, 'acc') || note(g1, 'sorts first', 'acc');
  }
  if (!all.length) text('small', pad, top + 12, L.fits ? 'No id yet.' : 'No id: every generator refuses.');
  if (H.burstAfter) {
    const hy = top + all.length * ROW_H + 4;
    hiddenBox(pad - 2, hy, W - 2 * pad + 4, top + slotsH - hy, 'burstAfter', "G0's later ids are hidden until the reveal");
  }
  // The foot: reserved lines for the legend and the count past 8 ms, inside the band's region.
  let fy = axY + 24 + 12;
  if (m.lateByTick.some((x) => x.issued <= t && x.issued < M.WINDOW_US) && !H.repeats)
    wrap('small', legend, W - 2 * pad).forEach((ln, i) => text('small', pad, fy + i * 15, ln, { cls: 'warn' }));
  fy += legendLines * 15;
  if (m.after && view.phase !== 'playing' && !H.burstAfter) text('small', pad, fy, `${F.int(m.after)} more ${m.after === 1 ? 'id' : 'ids'} made after 8 ms ${m.after === 1 ? 'is' : 'are'} not drawn`, { cls: 'warn' });
  return bottom;
}

// --- Band E: random ids, the birthday bound and its pairs. --------------------------------------------------------

function drawRandom(c, y) {
  const { W, pad, narrow, H, s } = c;
  text('label', pad, y + 9, 'Random ids beside them');
  const headTop = y;
  y += 24;
  const side = !narrow && W >= 620;
  const chartW = side ? Math.round((W - 2 * pad) * 0.6) : W - 2 * pad;
  const px0 = pad + 40;
  const px1 = pad + chartW - 4;
  const ptop = y + 18;
  const ph = narrow ? 150 : 170;
  const pb = ptop + ph;
  text('small', pad, y + 6, 'Chance of any repeat, by the birthday bound');
  const xs = (e) => px0 + ((e - 3) / 12) * (px1 - px0);
  const ys = (lp) => ptop + (-lp / 24) * ph;
  for (const e of [0, -6, -12, -18, -24]) {
    line(px0, ys(e), px1, ys(e), e === -24 ? 'axis' : 'grid', { kind: 'grid' });
    text('small', px0 - 6, ys(e) + 4, e === 0 ? '1' : `10${F.sup(e)}`, { anchor: 'end' });
  }
  for (const e of [3, 6, 9, 12, 15]) {
    line(xs(e), pb, xs(e), pb + 4, 'axis', { check: false });
    text('small', xs(e), pb + 16, `10${F.sup(e)}`, { anchor: e === 15 ? 'end' : 'middle' });
  }
  text('small', (px0 + px1) / 2, pb + 31, 'ids made', { anchor: 'middle' });
  // The chain under the chart: pairs, each pair's chance, the repeats expected, the chance.
  const chainTop = pb + 50;
  const chainLines = reserve('pairs', W, () => Math.max(...M.RANDOM_BITS.flatMap((bits) => Array.from({ length: 13 }, (_, k) => wrapSegments('small', M.pairsChain({ ...M.BASE, bits, count: k + 3 }), chartW, '  ').length))));
  const chartBottom = chainTop + chainLines * 15;
  reg.regions.chart = { x0: pad, y0: headTop - 12, x1: pad + chartW, y1: chartBottom };
  if (H.chance) {
    hiddenBox(px0 + 1, ptop - 4, px1 - px0 - 2, ph + 2, 'chance', 'The curves are hidden until you answer', ys(-9) + 4);
    hiddenBox(pad, chainTop - 12, chartW, chainLines * 15 + 6, 'chance', 'Why is hidden until you answer');
  } else {
    for (const bits of [122, 64]) {
      const pts = [];
      for (let e = 3; e <= 15.0001; e += 0.05) {
        const p = M.birthday(bits, 10 ** e);
        const lp = Math.max(Math.log10(Math.max(p, 1e-300)), -24.5);
        if (lp < -24) continue;
        pts.push([xs(e), ys(lp)]);
      }
      path('M' + pts.map((p) => p.map((v) => v.toFixed(1)).join(' ')).join(' L'), `curve ${bits === s.bits ? 'cur' : ''}`, { points: pts, region: 'chart' });
    }
    const n = 10 ** s.count;
    // E5's reveal slides the marker up from the 122-bit chance to the 64-bit one (Reduced motion draws the end).
    const slide = view.exp === 5 && expState() === 'reveal' && view.frac < 1 && !REDUCED;
    const p = slide ? 10 ** (Math.log10(M.birthday(122, n)) * (1 - view.frac) + Math.log10(M.birthday(64, n)) * view.frac) : M.birthday(s.bits, n);
    const lp = Math.max(Math.log10(p), -24);
    const cx = xs(s.count);
    const cy = ys(lp);
    line(cx, ptop, cx, pb, 'now-line', { kind: 'marker' });
    // The square law as a drawn transform: back from the marker when that leg is on the chart, else forward from it.
    const pBack = M.birthday(s.bits, n / 1000);
    const pFwd = M.birthday(s.bits, n * 1000);
    if (!slide && s.count >= 6 && p < 0.05 && pBack >= 1e-24 && ys(Math.log10(pBack)) + 18 < pb) {
      const tx0 = xs(s.count - 3);
      const tx1 = cx - 4;
      const ty0 = ys(Math.log10(pBack));
      const ty1 = ys(Math.log10(p)) + 6;
      path(`M${tx0.toFixed(1)} ${ty0.toFixed(1)} H${tx1.toFixed(1)} V${ty1.toFixed(1)}`, 'tri', { segments: [[[tx0, ty0], [tx1, ty0]], [[tx1, ty0], [tx1, ty1]]] });
      triLabels((tx0 + tx1) / 2, ty0 + 14, tx1 - 5, (ty0 + ty1) / 2 + 4);
    } else if (!slide && s.count <= 12 && pFwd < 0.1 && p >= 1e-24) {
      const tx0 = cx + 7;
      const tx1 = xs(s.count + 3);
      const ty0 = cy;
      const ty1 = ys(Math.log10(pFwd)) + 6;
      path(`M${tx0.toFixed(1)} ${ty0.toFixed(1)} H${tx1.toFixed(1)} V${ty1.toFixed(1)}`, 'tri', { segments: [[[tx0, ty0], [tx1, ty0]], [[tx1, ty0], [tx1, ty1]]] });
      triLabels((tx0 + tx1) / 2, ty0 + 14, tx1 + 5, (ty0 + ty1) / 2 + 4, 'start');
    }
    function triLabels(ax, ay, ux, uy, upAnchor = 'end') {
      const along = '× 1,000 ids';
      const up = '× 10⁶';
      for (const dy of [0, 4, -18]) {
        const b = textBox('small', ax, ay + dy, along, 'middle');
        if (clearBox(b, 2)) {
          text('small', ax, ay + dy, along, { anchor: 'middle' });
          break;
        }
      }
      for (const dy of [0, 8, -8, 16, -16]) {
        const b = textBox('small', ux, uy + dy, up, upAnchor);
        if (clearBox(b, 2)) {
          text('small', ux, uy + dy, up, { anchor: upAnchor });
          break;
        }
      }
    }
    const below = lp <= -24 && p < 1e-24;
    if (below) {
      el('path', { d: `M${(cx - 6).toFixed(1)} ${(pb - 9).toFixed(1)} h12 l-6 8 z`, class: 'marker' });
      reg.marks.push({ x0: cx - 6, y0: pb - 9, x1: cx + 6, y1: pb - 1, cls: 'cut' });
    } else dot(cx, cy, 5.5, 'marker', { key: 'current' });
    if (!slide) {
      const val = F.chance(p);
      const wv = measure('smallB', val);
      const cands = [
        ...(below ? [[px1 - wv - 4, pb - 20]] : []),
        ...[16, -10, 30, -24, 46, 62].flatMap((dy) => [[cx + 10, cy + dy], [cx - 10 - wv, cy + dy]]),
        [cx + 10, pb - 8],
        [cx - 10 - wv, pb - 8],
        [px0 + 4, ptop + 12],
      ].map(([lx, ly]) => [Math.min(Math.max(lx, px0 + 4), px1 - wv), Math.min(Math.max(ly, ptop + 12), pb - 8)]);
      const at = cands.find(([lx, ly]) => clearBox(textBox('smallB', lx, ly, val), 3)) ?? cands[0];
      text('smallB', at[0], at[1], val, { cls: 'acc' });
      if (below) {
        const b = textBox('small', px1 - 4, pb - 8, 'below the chart', 'end');
        if (clearBox(b, 2)) text('small', px1 - 4, pb - 8, 'below the chart', { anchor: 'end' });
      }
    }
    // Curve names: off every curve, grid line, dot and word.
    const name122 = narrow ? '122 bits' : '122 bits, UUIDv4';
    const w122 = measure('smallB', name122);
    const c122 = [];
    for (let e = 14.5; e >= 8; e -= 0.25) {
      const yc = ys(Math.log10(M.birthday(122, 10 ** e)));
      c122.push([xs(e) - w122 - 4, yc - 6], [xs(e) + 6, yc + 14]);
    }
    const p122 = c122.find(([lx, ly]) => lx >= px0 + 2 && lx + w122 <= px1 && ly - 9 > ptop && ly < pb - 4 && clearBox(textBox('smallB', lx, ly, name122), 3)) ?? c122[0];
    text('smallB', p122[0], p122[1], name122, { cls: s.bits === 122 ? 'acc' : 'muted' });
    const w64 = measure('smallB', '64 bits');
    const c64 = [];
    for (let e = 14.6; e >= 9; e -= 0.4) c64.push([xs(e) - w64, ys(0) + 14], [xs(e) - w64, ys(0) + 28]);
    const p64 = c64.find(([lx, ly]) => lx >= px0 + 2 && clearBox(textBox('smallB', lx, ly, '64 bits'), 3)) ?? c64[0];
    text('smallB', p64[0], p64[1], '64 bits', { cls: s.bits === 64 ? 'acc' : 'muted' });
    if (!slide) wrapSegments('small', M.pairsChain(s), chartW, '  ').forEach((ln, i) => text('small', pad, chainTop + i * 15, ln, { region: 'pairs' }));
  }
  const iy = side ? y : chartBottom + 18;
  const ix0 = side ? pad + chartW + 24 : pad;
  const iw = side ? W - pad - ix0 : W - 2 * pad;
  const iEnd = drawIndex(ix0, iy, iw);
  return Math.max(side ? chartBottom : 0, iEnd);
}

/** Where 24 new ids land in a key index of 12 leaf pages: an illustration, drawn from a seeded generator. */
function drawIndex(x0, y, w) {
  text('small', x0, y + 6, 'Where 24 new ids land in the index');
  y += 20;
  const pages = 12;
  const gap = 3;
  const pw = (w - gap * (pages - 1)) / pages;
  const rowsY = [y + 16, y + 84];
  text('smallB', x0, rowsY[0] - 6, 'Time-ordered ids: the last page');
  text('smallB', x0, rowsY[1] - 6, 'Random ids: any page');
  let seed = 7;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const hits = Array(pages).fill(0);
  for (let i = 0; i < 24; i++) hits[Math.floor(rnd() * pages)]++;
  for (let r = 0; r < 2; r++)
    for (let p = 0; p < pages; p++) {
      const px = x0 + p * (pw + gap);
      const hot = r === 0 ? p === pages - 1 : hits[p] > 0;
      rect(px, rowsY[r], pw, 22, `page-box ${hot ? 'hot' : ''}`, { rx: 2, mark: true });
      const n = r === 0 ? (p === pages - 1 ? 24 : 0) : hits[p];
      for (let k = 0; k < Math.min(n, 6); k++) line(px + 3, rowsY[r] + 4 + k * 3, px + pw - 3, rowsY[r] + 4 + k * 3, 'insert', { check: false });
    }
  const touched = hits.filter((h) => h > 0).length;
  text('small', x0, rowsY[0] + 36, 'all 24 in 1 page, which stays in memory');
  const lines = wrap('small', `24 inserts touch ${touched} of ${pages} pages, each read from disk once the index outgrows memory`, w);
  lines.forEach((ln, i) => text('small', x0, rowsY[1] + 36 + i * 14, ln));
  return rowsY[1] + 36 + lines.length * 14 + 4;
}

/**
 * Focus outlines (solid, 6 px clear of their region's words on every side) and a "Look here" tag at the first place,
 * inside or outside the outline, that covers no word, dot, line or mark of any band.
 */
function drawFocus(W, Hh) {
  for (const f of view.focus) {
    const r = reg.regions[f];
    if (!r) continue;
    const e = r.exact ? 0 : 8;
    const x0 = Math.max(r.x0 - e, 2);
    const x1 = Math.min(r.x1 + e, W - 2);
    const y0 = r.y0 - e;
    const y1 = r.y1 + e;
    rect(x0, y0, x1 - x0, y1 - y0, 'focus-outline', { rx: 10, region: `focus-${f}` });
    reg.outlines.push({ x0, y0, x1, y1, f });
  }
  for (const o of reg.outlines) {
    const tw = measure('look', 'Look here') + 14;
    const cands = [];
    for (let cx = o.x1 - tw - 10; cx >= o.x0 + 8; cx -= 24) cands.push([cx, o.y0 - 22], [cx, o.y1 + 4], [cx, o.y0 + 4], [cx, o.y1 - 22]);
    for (let cy = o.y0 + 4; cy < o.y1 - 22; cy += 12) cands.push([o.x1 - tw - 4, cy], [o.x0 + 4, cy]);
    const fits = ([cx, cy]) => {
      const b = { x0: cx, x1: cx + tw, y0: cy, y1: cy + 18 };
      if (cy < 2 || cy + 18 > Hh - 2 || cx < 2 || cx + tw > W - 2) return false;
      if (!clearBox(b, 3)) return false;
      // Not on any outline's stroke (its own or another's).
      return !reg.outlines.some((q) => strokeHits(q, b, 3));
    };
    const [cx, cy] = cands.find(fits) ?? cands[0];
    rect(cx, cy, tw, 18, 'tag', { rx: 9 });
    reg.marks.push({ x0: cx, y0: cy, x1: cx + tw, y1: cy + 18, cls: 'tag', region: `tag-${o.f}` });
    text('look', cx + 7, cy + 13, 'Look here', { kind: 'tag', region: `tag-${o.f}` });
    reg.tags = (reg.tags ?? 0) + 1;
  }
}
/** Whether box b comes within `gap` of outline o's stroke (its four edges). */
function strokeHits(o, b, gap) {
  const outer = { x0: o.x0 - gap, x1: o.x1 + gap, y0: o.y0 - gap, y1: o.y1 + gap };
  const innerR = { x0: o.x0 + gap, x1: o.x1 - gap, y0: o.y0 + gap, y1: o.y1 - gap };
  const inOuter = b.x0 < outer.x1 && b.x1 > outer.x0 && b.y0 < outer.y1 && b.y1 > outer.y0;
  const inInner = b.x0 >= innerR.x0 && b.x1 <= innerR.x1 && b.y0 >= innerR.y0 && b.y1 <= innerR.y1;
  return inOuter && !inInner;
}

// ------------------------------------------------------------------------------------------------------------------
// The words: summary, notice, story, the dock and Describe, from the same state and the same hiding map.

function summaryText() {
  const H = hiding();
  const s = view.s;
  let lay = M.layoutSentence(s);
  if (H.lifetime) lay = lay.replace(/The timestamp counts.*?\.(?= There)/, 'How long the timestamp lasts is hidden until you answer.');
  const rnd = H.chance ? 'The chance of a repeat among random ids is hidden until you answer.' : M.randomSentence(s);
  return `${lay} ${mintWords()} ${rnd}`;
}

/** The mint's sentences with the hidden ones replaced: the summary and the reduced-motion story both read this. */
function mintWords() {
  const H = hiding();
  const sent = M.mintSentence(view.s).split(/(?<=\.) /);
  const keep = sent.filter((x) => {
    if (H.repeats && /repeat|stepped back|sort after|sorts after/.test(x)) return false;
    if (H.order && /sort by|sorts? after|sort after/.test(x)) return false;
    if (H.burstAfter && /burst/.test(x)) return false;
    return true;
  });
  if (H.repeats) keep.push('Whether G1 makes any id twice is hidden until you answer.');
  else if (H.order) keep.push('The order the ids sort in is hidden until you answer.');
  if (H.burstAfter) keep.push("How long G0's burst waits is hidden until you answer.");
  return keep.join(' ');
}

/** The live notice: only what changed, never the whole summary (that is the stage's name and Describe). */
function noticeText() {
  const H = hiding();
  const st = expState();
  if (view.exp && st === 'ask') return `Experiment ${view.exp}: ${EXPS[view.exp - 1].title}. Make your guess${anyHidden(H) ? '; the part it is about is hidden until you answer' : ''}.`;
  if (view.exp && st === 'play') return 'Playing your guess. The answer shows when it ends.';
  if (view.exp && st === 'reveal') return EXPS[view.exp - 1].reveal;
  if (view.challenge) {
    const s = M.challengeStatus(view.s);
    return s.met ? `Goal met. ${M.changeSentence('gen', view.s)}` : `Challenge: ${M.CHALLENGE.ask}`;
  }
  if (view.phase === 'playing') return 'Playing the mint: 8 ms of the clock, slowed down.';
  if (view.lastChange) return M.changeSentence(view.lastChange, view.s);
  return M.changeSentence('gen', view.s);
}

function storyText() {
  if (!REDUCED) return null;
  return `Reduced motion: the mint is drawn at its end. ${mintWords()}`;
}

const keepNeeds = (str) => str.replace(/\(need [^)]+\)/g, (m) => `<span class="keep">${m}</span>`);
function renderDock() {
  const dock = document.getElementById('dock');
  document.querySelector('.widget').classList.toggle('dock-first', !!(view.exp || view.challenge));
  if (view.challenge) {
    const st = M.challengeStatus(view.s);
    dock.innerHTML = `<p class="eyebrow">Challenge</p><p class="legend">${M.CHALLENGE.ask}</p>
      <p class="status-line ${st.met ? 'met' : ''}">${st.met ? 'Goal met' : `${st.items.filter((i) => i.met).length} of 3 met`}</p>
      <ul class="status">${st.items.map((i) => `<li class="${i.met ? 'met' : ''}"><span class="state">${i.met ? '✓' : '·'}</span><span>${keepNeeds(i.text)}</span></li>`).join('')}</ul>`;
    return;
  }
  if (!view.exp) {
    dock.innerHTML = '';
    return;
  }
  const e = EXPS[view.exp - 1];
  const truth = e.choices.findIndex((c) => c.value === e.truth);
  const st = expState();
  const opts = e.choices
    .map((c, i) => {
      let cls = '';
      let mark = '';
      if (st === 'reveal') {
        if (i === truth) {
          cls = 'right';
          mark = i === view.picked ? 'Your guess · right' : 'Right';
        } else if (i === view.picked) {
          cls = 'wrong';
          mark = 'Your guess';
        }
      } else if (st === 'play' && i === view.picked) mark = 'Your guess';
      return `<li><button type="button" class="g-choice ${cls}" ${st === 'ask' ? '' : 'disabled'}><span>${c.text}</span>${mark ? `<span class="mark">${mark}</span>` : ''}</button></li>`;
    })
    .join('');
  dock.innerHTML = `<p class="eyebrow">Experiment ${view.exp} of 5 · ${e.title}</p><p class="legend">${e.ask}</p><ul class="options">${opts}</ul>
    ${st === 'play' ? '<p class="held">Your guess is held while the mint plays.</p>' : ''}
    ${st === 'reveal' ? `<p class="reveal">${e.reveal}</p>` : ''}`;
}

function renderCards() {
  const items = [...EXPS.map((e, i) => ({ n: i + 1, title: e.title })), { n: 6, title: `Challenge: ${M.CHALLENGE.title.toLowerCase()}` }];
  document.getElementById('cards').innerHTML = items
    .map((c) => `<li><button class="card-btn" type="button" ${view.exp === c.n || (view.challenge && c.n === 6) ? 'aria-current="true"' : ''}><span class="num">${c.n}</span>${c.title}</button></li>`)
    .join('');
}

function renderDescribe(stageW) {
  const box = document.getElementById('describe');
  const H = hiding();
  const m = M.mint(view.s);
  const disabled = H.describe;
  let html = `<button class="g-btn" type="button" id="desc-btn" ${disabled ? 'disabled' : ''} aria-expanded="${view.describeOpen && !disabled}">Describe the ids</button>`;
  if (disabled) html += '<p class="muted-note">Describe opens after you answer.</p>';
  if (view.describeOpen && !disabled) {
    const compact = stageW < 520;
    const head = compact ? ['#', 'timestamp · G · seq', 'made', 'note'] : ['#', 'id', 'made by', 'made at', 'timestamp', 'generator', 'sequence', 'waited', 'note'];
    const rows = m.sorted.slice(0, 40).map((x, i) => {
      const note = x.repeatOf ? 'same id as the row above' : x.issued >= M.WINDOW_US ? 'after 8 ms' : m.lateByTick.includes(x) ? 'made before ids above it' : '';
      const cells = compact
        ? [i + 1, `${M.tsShort(x)} · ${x.number} · ${x.seq}`, F.ms(x.issued), note]
        : [i + 1, F.int(x.id), `G${x.lane}`, F.ms(x.issued), F.int(x.ts), x.number, x.seq, x.wait ? F.ms(x.wait) : '', note];
      return `<tr class="${x.repeatOf ? 'bad' : ''}">${cells.map((c, j) => `<td class="${!compact && (j === 1 || j === 4) ? 'mono' : ''}">${c}</td>`).join('')}</tr>`;
    });
    const more = m.sorted.length > 40 ? `<p class="muted-note">The first 40 of ${F.int(m.sorted.length)} ids in id order.</p>` : '';
    html += `<p class="summary">${summaryText()}</p><div class="table-box"><table><caption class="sr-only">The ids in id order, with each id's fields</caption><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>${more}`;
  }
  box.innerHTML = html;
}

function renderControls() {
  const s = view.s;
  const f = document.getElementById('controls');
  document.getElementById('gen-v').textContent = s.gen;
  document.getElementById('seq-v').textContent = s.seq;
  for (const k of ['tick', 'epoch', 'load', 'fault', 'bits']) for (const inp of f.querySelectorAll(`input[name=${k}]`)) inp.checked = Number(inp.value) === s[k];
  document.getElementById('guard').checked = !!s.guard;
  const c = document.getElementById('count');
  c.value = s.count;
  document.getElementById('count-v').textContent = `${F.count(10 ** s.count).replace(/^a /, 'A ')} ids (${F.countFigure(10 ** s.count)})`;
  const locked = expState() === 'ask' || expState() === 'play';
  for (const fs of f.querySelectorAll('fieldset')) fs.disabled = locked;
  const play = document.getElementById('play');
  play.disabled = locked;
  const playing = view.phase === 'playing' && !view.exp;
  play.setAttribute('aria-label', playing ? 'Pause the mint' : 'Play the mint: 8 ms of the clock, slowed down');
  document.getElementById('play-glyph').setAttribute('d', playing ? 'M12 10 h3.5 v14 h-3.5 z M18.5 10 h3.5 v14 h-3.5 z' : 'M13 10.5 L24 17 L13 23.5 Z');
  document.getElementById('notice').textContent = noticeText();
}

// ------------------------------------------------------------------------------------------------------------------
// Render, report, and the play.

function placeControls(W) {
  const form = document.getElementById('controls');
  const well = document.getElementById('well');
  const narrow = innerWidth < 1000;
  if (narrow && form.parentElement !== well) {
    well.appendChild(form);
    form.classList.add('in-stage');
  } else if (!narrow && form.parentElement === well) {
    document.querySelector('.side').insertBefore(form, document.querySelector('.side .heading'));
    form.classList.remove('in-stage');
  }
  if (!narrow) {
    for (const g of form.querySelectorAll('.cg')) g.removeAttribute('style');
    return null;
  }
  const pad = W < 560 ? 12 : 20;
  const slots = {};
  for (const g of form.querySelectorAll('.cg')) {
    g.style.left = `${pad}px`;
    g.style.width = `${W - 2 * pad}px`;
    slots[g.dataset.slot] = Math.ceil(g.offsetHeight);
  }
  return slots;
}

function render() {
  const well = document.getElementById('well');
  const W = Math.floor(well.clientWidth);
  const slots = placeControls(W);
  const b = build(W, slots);
  const svg = document.getElementById('svg');
  svg.setAttribute('width', W);
  svg.setAttribute('height', b.H);
  svg.setAttribute('viewBox', `0 0 ${W} ${b.H}`);
  svg.innerHTML = `<title id="svg-title">${esc(summaryText())}</title>${b.svg}`;
  const play = document.getElementById('play');
  play.style.left = `${playPos.x}px`;
  play.style.top = `${playPos.y}px`;
  const nav = document.getElementById('nav');
  nav.style.left = `${navPos.x}px`;
  nav.style.top = `${navPos.y}px`;
  nav.style.width = `${navPos.w}px`;
  const narrow = W < 560;
  document.getElementById('older').textContent = narrow ? '‹' : '‹ Older id';
  document.getElementById('newer').textContent = narrow ? '›' : 'Newer id ›';
  const H = hiding();
  const vis = visibleIds(M.mint(view.s), H, view.phase === 'playing' ? view.t : Infinity);
  const at = view.inspected ? vis.findIndex((x) => x.key === view.inspected.key) : -1;
  document.getElementById('older').disabled = H.inspect || at <= 0;
  document.getElementById('newer').disabled = H.inspect || at < 0 || at >= vis.length - 1;
  if (slots) for (const g of document.querySelectorAll('#controls .cg')) g.style.top = `${slotPos[g.dataset.slot].y}px`;
  const story = document.getElementById('story');
  const st = storyText();
  story.hidden = !st;
  story.textContent = st ?? '';
  renderControls();
  renderDock();
  renderCards();
  renderDescribe(W);
  window.__report = report(b.reg, W, b.H);
  window.__state = { W, H: b.H, summary: summaryText(), notice: noticeText(), hide: [...view.hide], focus: view.focus, tags: b.reg.tags ?? 0 };
}

function overlap(a, b, pad = 0) {
  return a.x0 < b.x1 + pad && b.x0 < a.x1 + pad && a.y0 < b.y1 && b.y0 < a.y1;
}
function segHitsBox(l, b) {
  const x0 = b.x0 + 1;
  const x1 = b.x1 - 1;
  const y0 = b.y0 + 1;
  const y1 = b.y1 - 1;
  const steps = Math.max(24, Math.ceil(Math.hypot(l.x2 - l.x1, l.y2 - l.y1) / 2));
  for (let i = 0; i <= steps; i++) {
    const x = l.x1 + ((l.x2 - l.x1) * i) / steps;
    const y = l.y1 + ((l.y2 - l.y1) * i) / steps;
    if (x > x0 && x < x1 && y > y0 && y < y1) return true;
  }
  return false;
}
/**
 * The collision report: text on text, labels under 6 px apart on a row, lines (lane, grid, order, now, arcs, the
 * triangle, a fault's step) and curves through text, marks off the stage, dots on dots, dots and marks under text,
 * the play and nav buttons over text, focus outlines within 6 px of any word or dot, tags on anything, words under a
 * hidden box that is not theirs, and a repeat's note whose row above is not its twin.
 */
function report(r, W, H) {
  const c = [];
  const T = r.texts.filter((t) => t.kind !== 'bit');
  const hiddenText = (t) => t.kind === 'hidden';
  for (let i = 0; i < T.length; i++)
    for (let j = i + 1; j < T.length; j++) {
      const a = T[i];
      const b = T[j];
      if (overlap(a, b)) c.push(`text on text: "${a.str}" / "${b.str}"`);
      else if (a.y0 < b.y1 && b.y0 < a.y1 && overlap(a, b, 6)) c.push(`labels under 6 px apart: "${a.str}" / "${b.str}"`);
    }
  // Words in a hidden box sit on its opaque ground, above every line painted before it.
  for (const l of r.lines) for (const t of T) if (!hiddenText(t) && segHitsBox(l, t)) c.push(`${l.kind} line through "${t.str}"`);
  for (const cv of r.curves)
    for (const t of T)
      for (let k = 1; k < cv.points.length; k++) {
        const [x1, y1] = cv.points[k - 1];
        const [x2, y2] = cv.points[k];
        if (segHitsBox({ x1, y1, x2, y2 }, t)) {
          c.push(`curve through "${t.str}"`);
          break;
        }
      }
  for (const t of [...T, ...r.marks]) if (t.x0 < 0 || t.x1 > W || t.y0 < 0 || t.y1 > H) c.push(`off stage: ${t.str ?? t.cls}`);
  for (let i = 0; i < r.dots.length; i++)
    for (let j = i + 1; j < r.dots.length; j++) {
      const a = r.dots[i];
      const b = r.dots[j];
      if (Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r + 1) c.push(`dot on dot: ${a.key} / ${b.key}`);
    }
  for (const d of r.dots) for (const t of T) if (d.x + d.r > t.x0 && d.x - d.r < t.x1 && d.y + d.r > t.y0 && d.y - d.r < t.y1) c.push(`dot under "${t.str}" (${d.key})`);
  for (const mk of r.marks)
    for (const t of T) {
      if (mk.cls === 'tag' && t.kind === 'tag' && mk.region === t.region) continue;
      if (mk.cls === 'controls') {
        if (overlap(mk, t)) c.push(`control group over "${t.str}"`);
        continue;
      }
      if (overlap(mk, t) && !t.onFill) c.push(`mark (${mk.cls}) under "${t.str}"`);
    }
  for (const mk of r.marks.filter((m) => m.cls === 'tag')) {
    for (const d of r.dots) if (d.x + d.r > mk.x0 - 2 && d.x - d.r < mk.x1 + 2 && d.y + d.r > mk.y0 - 2 && d.y - d.r < mk.y1 + 2) c.push(`tag on dot ${d.key}`);
    for (const l of r.lines) if (segHitsBox(l, { x0: mk.x0 - 2, x1: mk.x1 + 2, y0: mk.y0 - 2, y1: mk.y1 + 2 })) c.push(`tag on a ${l.kind} line`);
    for (const m2 of r.marks) if (m2 !== mk && m2.cls !== 'tag' && overlap(m2, mk)) c.push(`tag on mark ${m2.cls}`);
  }
  for (const o of r.outlines) {
    for (const t of T) if (!(t.kind === 'tag') && strokeHits(o, t, 6)) c.push(`outline within 6 px of "${t.str}"`);
    for (const d of r.dots) if (strokeHits(o, { x0: d.x - d.r, x1: d.x + d.r, y0: d.y - d.r, y1: d.y + d.r }, 4)) c.push(`outline on dot ${d.key}`);
  }
  for (const h of r.hidden) {
    for (const t of T) if (t.region !== `hidden-${h.region}` && overlap(h, t)) c.push(`hidden box (${h.region}) over "${t.str}"`);
    for (const d of r.dots) if (d.x + d.r > h.x0 && d.x - d.r < h.x1 && d.y + d.r > h.y0 && d.y - d.r < h.y1) c.push(`hidden box over dot ${d.key}`);
  }
  for (const n of r.notes) if (!n.ok) c.push(`repeat note on ${n.key} names a row above that is not its twin`);
  return { collisions: [...new Set(c)], texts: T.length, dots: r.dots.length, nodes: out.length, tags: r.tags ?? 0 };
}

let raf = 0;
function playMint() {
  if (view.phase === 'playing') {
    cancelAnimationFrame(raf);
    view.phase = 'rest';
    view.t = M.WINDOW_US;
    render();
    return;
  }
  if (REDUCED) {
    view.phase = 'rest';
    render();
    return;
  }
  view.phase = 'playing';
  view.inspectKey = null;
  const start = performance.now();
  const dur = 8000;
  const step = (now) => {
    view.t = Math.min(((now - start) / dur) * M.WINDOW_US, M.WINDOW_US);
    render();
    if (view.t < M.WINDOW_US && !document.hidden) raf = requestAnimationFrame(step);
    else {
      view.phase = 'rest';
      view.t = M.WINDOW_US;
      view.lastChange = 'load';
      render();
    }
  };
  raf = requestAnimationFrame(step);
}

function wire() {
  const f = document.getElementById('controls');
  f.addEventListener('change', (ev) => {
    const tgt = ev.target;
    if (tgt.name in M.BASE) view.s[tgt.name] = Number(tgt.value);
    if (tgt.id === 'guard') view.s.guard = tgt.checked ? 1 : 0;
    view.lastChange = tgt.id === 'guard' ? 'guard' : tgt.name;
    view.ghost = null;
    render();
  });
  document.getElementById('count').addEventListener('input', (ev) => {
    view.s.count = Number(ev.target.value);
    view.lastChange = 'count';
    render();
  });
  for (const b of f.querySelectorAll('[data-step]'))
    b.addEventListener('click', () => {
      const k = b.dataset.step;
      const before = { ...view.s };
      view.s[k] = Math.min(Math.max(view.s[k] + Number(b.dataset.d), 0), M.BITS_MAX);
      view.ghost = before;
      view.lastChange = k;
      render();
    });
  document.getElementById('play').addEventListener('click', playMint);
  for (const [id, d] of [['older', -1], ['newer', 1]])
    document.getElementById(id).addEventListener('click', () => {
      const vis = visibleIds(M.mint(view.s), hiding(), view.phase === 'playing' ? view.t : Infinity);
      const at = vis.findIndex((x) => x.key === view.inspected?.key);
      const next = vis[Math.min(Math.max(at + d, 0), vis.length - 1)];
      if (next) view.inspectKey = next.key;
      render();
    });
  document.getElementById('describe').addEventListener('click', (ev) => {
    if (ev.target.id === 'desc-btn') {
      view.describeOpen = !view.describeOpen;
      render();
    }
  });
  addEventListener('resize', render);
}

Promise.all(Object.values(ROLES).map((r) => document.fonts.load(r.font)))
  .then(() => document.fonts.ready)
  .then(() => {
    wire();
    render();
    document.body.dataset.ready = '1';
  });
</script>
  </body>
