<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Durability widget mockup</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url(fonts/inter-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        src: url(fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 800;
        font-display: block;
      }
      /* The app's tokens (apps/app/src/_theme.scss, styles.scss): light is the base, dark overrides. */
      :root {
        color-scheme: light;
        --g-bg: #f4f5f9;
        --g-surface: #ffffff;
        --g-raised: #ffffff;
        --g-sunken: #eef0f5;
        --g-line: #dfe2ea;
        --g-line-strong: #c6cbd6;
        --g-stroke: #707889;
        --g-text: #161a23;
        --g-text-rgb: 22, 26, 35;
        --g-muted: #4a5263;
        --g-faint: #5c6477;
        --g-on-fill: #ffffff;
        --g-warn-ink: #6e4200;
        --g-danger-ink: #9d1630;
        --g-found-ink: #02583f;
        --g-accent: #5846dc;
        --g-accent-rgb: 88, 70, 220;
        --g-accent-soft: rgba(88, 70, 220, 0.14);
        --g-found: #036b4c;
        --g-danger: #c3203d;
        --g-warn: #945800;
        --g-success-ink: var(--g-found-ink);
        --g-success-line: var(--g-found);
        --g-success-soft: rgba(3, 107, 76, 0.12);
        --g-danger-soft: rgba(195, 32, 61, 0.12);
        --g-warn-soft: rgba(148, 88, 0, 0.12);
        --g-viz-stage: #f7f8fb;
        --g-viz-current: #0b74ad;
        --g-viz-current-soft: rgba(11, 116, 173, 0.16);
        --g-viz-considering: #c77700;
        --g-viz-considering-soft: rgba(199, 119, 0, 0.14);
        --g-viz-final-soft: rgba(18, 146, 95, 0.14);
        --g-viz-final: #12925f;
        --g-viz-final-ink: var(--g-found-ink);
        --g-viz-discarded-ink: #687082;
        --g-viz-critical: #d42a49;
        --g-viz-track: #d3d7e0;
        --g-shadow: 0 1px 2px rgba(var(--g-text-rgb), 0.06), 0 3px 10px rgba(var(--g-text-rgb), 0.07);
        --g-shadow-raised: 0 1px 2px rgba(var(--g-text-rgb), 0.08);
        --g-radius-xs: 6px;
        --g-radius-sm: 10px;
        --g-radius-md: 14px;
        --g-radius-pill: 999px;
        --g-text-title-m: 1.0625rem;
        --g-text-title-s: 0.9375rem;
        --g-text-body: 0.875rem;
        --g-text-body-s: 0.8125rem;
        --g-text-label: 0.6875rem;
        --g-font: 'Inter Variable', system-ui, sans-serif;
        --g-font-mono: 'JetBrains Mono Variable', ui-monospace, monospace;
        --g-focus-ring: 2px solid var(--g-accent);
      }
      :root.dark {
        color-scheme: dark;
        --g-bg: #0b0d12;
        --g-surface: #141824;
        --g-raised: #1c2130;
        --g-sunken: #0f121a;
        --g-line: #252a37;
        --g-line-strong: #343b4d;
        --g-stroke: #6b7387;
        --g-text: #e9ebf2;
        --g-text-rgb: 233, 235, 242;
        --g-muted: #8b93a8;
        --g-faint: #828a9e;
        --g-on-fill: #0b0d12;
        --g-warn-ink: #f3e6b3;
        --g-danger-ink: #ffb3bd;
        --g-found-ink: #3ddc97;
        --g-accent: #9d8cff;
        --g-accent-rgb: 157, 140, 255;
        --g-accent-soft: rgba(157, 140, 255, 0.14);
        --g-found: #3ddc97;
        --g-danger: #ff5d73;
        --g-warn: #ffb547;
        --g-success-soft: rgba(61, 220, 151, 0.12);
        --g-danger-soft: rgba(255, 93, 115, 0.12);
        --g-warn-soft: rgba(255, 181, 71, 0.12);
        --g-viz-stage: #0e1118;
        --g-viz-current: #1f9fd0;
        --g-viz-current-soft: rgba(31, 159, 208, 0.16);
        --g-viz-considering: #c08420;
        --g-viz-considering-soft: rgba(192, 132, 32, 0.18);
        --g-viz-final-soft: rgba(34, 173, 116, 0.18);
        --g-viz-final: #22ad74;
        --g-viz-final-ink: var(--g-found);
        --g-viz-discarded-ink: var(--g-muted);
        --g-viz-critical: #e5485f;
        --g-viz-track: #2a3040;
        --g-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        --g-shadow-raised: var(--g-shadow);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--g-bg);
        color: var(--g-text);
        font: 400 var(--g-text-body) / 1.5 var(--g-font);
        font-variant-ligatures: none;
        -webkit-font-smoothing: antialiased;
        overflow-wrap: break-word;
      }
      button {
        font-size: 0.8333rem;
      }
      .page {
        max-width: 1048px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      .eyebrow {
        margin: 0;
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
      }
      h1 {
        margin: 4px 0 14px;
        font: 600 1.25rem/1.3 var(--g-font);
      }
      .panel {
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background: var(--g-surface);
        box-shadow: var(--g-shadow);
        padding: 16px;
      }
      /* Narrow: one column, the controls as the stage's first rows, then the stage, the question, Describe, the cards. */
      .widget {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }
      .main,
      .experiments {
        display: contents;
      }
      .controls {
        order: 1;
      }
      .stage {
        order: 2;
        min-width: 0;
      }
      .dock {
        order: 3;
      }
      .describe {
        order: 4;
      }
      .heading,
      .cards {
        order: 5;
      }
      .controls {
        padding: 12px 12px 0;
        border: 1px solid var(--g-line);
        border-bottom: 0;
        border-radius: var(--g-radius-md) var(--g-radius-md) 0 0;
        background: var(--g-viz-stage);
        display: grid;
        gap: 10px;
        min-width: 0;
      }
      .stage {
        margin-top: -12px;
      }
      .stage .well {
        border-top: 0;
        border-radius: 0 0 var(--g-radius-md) var(--g-radius-md);
      }
      @media (min-width: 1000px) {
        .widget {
          grid-template-columns: minmax(0, 1fr) 340px;
          grid-template-rows: auto 1fr;
          align-items: start;
          column-gap: 20px;
        }
        .main {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: 12px;
          grid-column: 1;
          grid-row: 1 / span 2;
          min-width: 0;
        }
        .controls {
          grid-column: 2;
          grid-row: 1;
          padding: 0;
          border: 0;
          background: none;
        }
        .experiments {
          display: block;
          grid-column: 2;
          grid-row: 2;
          min-width: 0;
        }
        .stage {
          margin-top: 0;
        }
        .stage .well {
          border-top: 1px solid var(--g-line);
          border-radius: var(--g-radius-md);
        }
        .dock {
          margin-top: 12px;
        }
      }
      .well {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background-color: var(--g-viz-stage);
        background-image: radial-gradient(circle, rgba(var(--g-text-rgb), 0.09) 1px, transparent 1.5px);
        background-size: 24px 24px;
        background-position: 11px 11px;
      }
      /* Every fieldset.group carries the same zero padding; a control's own class only adds to it (the R41 padding bug). */
      fieldset.group {
        margin: 0;
        padding: 0;
        border: 0;
        min-width: 0;
      }
      .control-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
        padding: 0;
        margin-bottom: 4px;
      }
      .segments {
        display: flex;
        gap: 4px;
      }
      .segment {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
      }
      .segment input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .segment span {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 6px;
        border-radius: var(--g-radius-sm);
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        font: 500 var(--g-text-body) / 1.15 var(--g-font);
        text-align: center;
      }
      .segment input:checked + span {
        background: var(--g-accent-soft);
        border-color: var(--g-accent);
        box-shadow: inset 0 0 0 1px var(--g-accent);
        font-weight: 600;
      }
      fieldset:disabled .segment span,
      .segment input:disabled + span {
        opacity: 0.55;
      }
      .control-label .why {
        font-weight: 500;
        letter-spacing: normal;
        text-transform: none;
      }
      .segment small {
        font: 500 var(--g-text-label) var(--g-font);
        color: var(--g-muted);
      }
      .toggles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .toggles .segment span {
        flex-direction: column;
        gap: 0;
        font-size: var(--g-text-body-s);
      }
      .notice {
        margin: 0;
        min-height: 2lh;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      /* Below wide the notice would sit over the stage and push it down as it speaks: read out only (_widget-controls.scss). */
      @media (max-width: 999px) {
        .notice {
          position: absolute;
          width: 1px;
          height: 1px;
          min-height: 0;
          overflow: hidden;
          clip-path: inset(50%);
        }
        .controls {
          padding-bottom: 12px;
        }
      }
      .caption {
        margin: 0;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      .play {
        position: absolute;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        z-index: 2;
      }
      .play svg {
        display: block;
        width: 36px;
        height: 36px;
        margin: 4px;
      }
      .play circle {
        fill: var(--g-raised);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .play path {
        fill: var(--g-accent);
      }
      .play:disabled {
        cursor: default;
        opacity: 0.55;
      }
      .handle {
        position: absolute;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        cursor: ew-resize;
        z-index: 2;
      }
      .handle .knob {
        width: 14px;
        height: 26px;
        border-radius: var(--g-radius-pill);
        background: var(--g-raised);
        border: 2px solid var(--g-accent);
        box-shadow: var(--g-shadow-raised);
      }
      .handle[aria-disabled='true'] {
        cursor: default;
      }
      .handle[aria-disabled='true'] .knob {
        opacity: 0.55;
      }
      /* Drawing roles: text sits on a stage-coloured halo; small text is measured as drawn (no tabular digits). */
      svg.draw {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        overflow: visible;
      }
      svg.draw text {
        paint-order: stroke;
        stroke: var(--g-viz-stage);
        stroke-width: 3px;
        stroke-linejoin: round;
      }
      svg.draw text.on-box {
        stroke: var(--g-raised);
      }
      svg.draw text.on-chip {
        stroke: none;
      }
      svg.draw text.on-sunken {
        stroke: var(--g-sunken);
      }
      .t-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: var(--g-muted);
      }
      .t-cap {
        font: 500 var(--g-text-body-s) var(--g-font);
        fill: var(--g-muted);
      }
      .t-capB {
        font: 600 var(--g-text-body-s) var(--g-font);
        fill: var(--g-text);
      }
      .t-small {
        font: 500 var(--g-text-label) var(--g-font);
        fill: var(--g-muted);
      }
      .t-smallB {
        font: 700 var(--g-text-label) var(--g-font);
        fill: var(--g-text);
      }
      .t-mono {
        font: 600 var(--g-text-label) var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-nameS {
        font: 600 13px var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-head {
        font: 600 var(--g-text-title-m) var(--g-font-mono);
        fill: var(--g-text);
      }
      .ink {
        fill: var(--g-text);
      }
      .muted {
        fill: var(--g-muted);
      }
      .bad {
        fill: var(--g-danger-ink);
      }
      .wait-ink {
        fill: var(--g-warn-ink);
      }
      .cur-ink {
        fill: var(--g-viz-current);
      }
      .crit-ink {
        fill: var(--g-viz-critical);
      }
      .rule {
        stroke: var(--g-line);
      }
      .t-unit {
        text-transform: none;
      }
      /* The chain: wires are structure (3:1 on the stage), the request's path is the current tone. */
      .wire {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1.25;
      }
      .wire.soft {
        stroke-opacity: 0.6;
      }
      .path {
        fill: none;
        stroke: var(--g-viz-current);
        stroke-width: 2.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .path-hidden {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1.25;
        stroke-dasharray: 4 3;
      }
      .box {
        fill: var(--g-raised);
        stroke: var(--g-line-strong);
        stroke-width: 1.25;
      }
      .box.serving {
        stroke: var(--g-viz-current);
        stroke-width: 2;
      }
      .box.next {
        fill: var(--g-viz-current-soft);
        stroke: var(--g-viz-current);
      }
      .box.down {
        fill: url(#hatch);
        stroke: var(--g-viz-discarded-ink);
        stroke-width: 1.25;
      }
      .hatch-fill {
        fill: var(--g-sunken);
      }
      .hatch-line {
        stroke: var(--g-viz-discarded-ink);
        stroke-opacity: 0.4;
        stroke-width: 1.5;
      }
      .xmark {
        stroke: var(--g-viz-critical);
        stroke-width: 2;
        stroke-linecap: round;
        fill: none;
      }
      .xground {
        fill: var(--g-viz-stage);
      }
      .stop {
        fill: var(--g-viz-critical);
        stroke: var(--g-viz-stage);
        stroke-width: 1.5;
        paint-order: stroke;
      }
      .xground.on-box {
        fill: var(--g-raised);
      }
      .ok-ring {
        fill: var(--g-viz-stage);
        stroke: var(--g-viz-final);
        stroke-width: 1.75;
      }
      .ok-mark {
        fill: none;
        stroke: var(--g-viz-final);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bad-ring {
        fill: var(--g-viz-stage);
        stroke: var(--g-viz-critical);
        stroke-width: 1.75;
      }
      .q-ring {
        fill: var(--g-viz-stage);
        stroke: var(--g-stroke);
        stroke-width: 1.25;
        stroke-dasharray: 3 2.5;
      }
      .start-dot {
        fill: var(--g-viz-current);
      }
      .start-dot.hidden {
        fill: var(--g-stroke);
      }
      /* The year: a copy's outage is a neutral tick; what reaches the request is critical. */
      .row-track {
        stroke: var(--g-line);
      }
      .strip-track {
        stroke: var(--g-line-strong);
      }
      .tick-copy {
        fill: var(--g-text);
        fill-opacity: 0.62;
      }
      .tick-fail {
        fill: var(--g-viz-critical);
      }
      .tick-bypassed {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1;
      }
      .req-hidden {
        fill: none;
        stroke: var(--g-stroke);
        stroke-dasharray: 4 3;
      }
      .req-band {
        fill: rgba(var(--g-text-rgb), 0.04);
      }
      .axis {
        stroke: var(--g-line-strong);
      }
      .gridline {
        stroke: var(--g-line);
      }
      .moment {
        stroke: var(--g-text);
        stroke-opacity: 0.4;
      }
      .moment-head {
        fill: var(--g-text);
        fill-opacity: 0.7;
      }
      .ring {
        fill: none;
        stroke: var(--g-text);
        stroke-width: 1.5;
      }
      .playhead {
        stroke: var(--g-text);
        stroke-width: 1.5;
      }
      /* The nines scale: a solid length is what the model gives; the soft length beyond it is the paper's promise. */
      .bar {
        fill: var(--g-viz-current);
      }
      /* What the paper promised: outlined in the current tone (its edge carries it, 3:1), the fill only a tint. */
      .bar.paper {
        fill: color-mix(in srgb, var(--g-viz-current) 22%, var(--g-viz-stage));
        stroke: var(--g-viz-current);
        stroke-width: 1;
      }
      .key-paper {
        fill: var(--g-viz-current);
        fill-opacity: 0.22;
        stroke: var(--g-viz-current);
        stroke-width: 1;
      }
      .key-solid {
        fill: var(--g-viz-current);
      }
      .goal-line {
        stroke: var(--g-muted);
        stroke-width: 1.5;
      }
      .goal-line.met {
        stroke: var(--g-viz-final);
      }
      .ghost-caret {
        fill: none;
        stroke: var(--g-text);
        stroke-width: 1.25;
        stroke-linejoin: round;
      }
      .n-ring {
        fill: var(--g-viz-stage);
        stroke: var(--g-stroke);
        stroke-width: 1.25;
      }
      .inuse {
        fill: var(--g-viz-current);
      }
      .tick-shared {
        fill: var(--g-text);
        fill-opacity: 0.62;
      }
      .split-shared {
        fill: var(--g-viz-critical);
      }
      .split-failover {
        fill: var(--g-viz-critical);
      }
      .split-chance {
        fill: var(--g-text);
      }
      .split-track {
        stroke: var(--g-line-strong);
      }
      .inset-down {
        fill: var(--g-text);
        fill-opacity: 0.62;
      }
      .inset-up {
        stroke: var(--g-viz-current);
        stroke-width: 2;
      }
      .inset-frame {
        fill: none;
        stroke: var(--g-line-strong);
      }
      .bar.optional {
        fill: var(--g-viz-discarded-ink);
        fill-opacity: 0.45;
      }
      .bar.request {
        fill: var(--g-text);
        fill-opacity: 0.82;
      }
      .bar-hidden {
        fill: none;
        stroke: var(--g-stroke);
        stroke-dasharray: 4 3;
      }
      .notch {
        fill: var(--g-viz-stage);
      }
      .capline {
        stroke: var(--g-viz-critical);
        stroke-width: 1.5;
      }
      .capend {
        fill: var(--g-viz-critical);
      }
      .ghost-tick {
        fill: var(--g-viz-stage);
        stroke: var(--g-stroke);
        stroke-width: 1.25;
      }
      .key-copy {
        fill: var(--g-text);
        fill-opacity: 0.62;
      }
      .key-fail {
        fill: var(--g-viz-critical);
      }
      .ok-ink {
        fill: var(--g-viz-final-ink);
      }
      /* Steppers and toggles (kit: g-stepper, the house toggle). */
      .steppers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 8px;
      }
      .stepper {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        align-items: center;
        border: 1px solid var(--g-line-strong);
        border-radius: var(--g-radius-sm);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
      }
      .stepper button {
        width: 44px;
        height: 44px;
        border: 0;
        background: none;
        color: var(--g-text);
        font: 500 1.125rem/1 var(--g-font);
        cursor: pointer;
      }
      .stepper button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .stepper output {
        display: grid;
        justify-items: center;
        line-height: 1.15;
        font: 600 var(--g-text-body) var(--g-font-mono);
      }
      .stepper output small {
        font: 500 var(--g-text-label) var(--g-font);
        color: var(--g-muted);
      }
      fieldset:disabled .stepper {
        opacity: 0.55;
      }
      .toggles3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
      }
      .toggles3 .segment span {
        flex-direction: column;

// The label role is set in capitals, but a unit after a number keeps its case ("24 h", "20 TB").
const ROLE = {
  label: { css: '600 11px "Inter Variable"', size: 11, track: 0.12, upper: true },
  cap: { css: '500 13px "Inter Variable"', size: 13 },
  capB: { css: '600 13px "Inter Variable"', size: 13 },
  small: { css: '500 11px "Inter Variable"', size: 11 },
  smallB: { css: '700 11px "Inter Variable"', size: 11 },
  mono: { css: '600 11px "JetBrains Mono Variable"', size: 11 },
  tiny: { css: '600 10px "JetBrains Mono Variable"', size: 10 },
  head: { css: '600 17px "JetBrains Mono Variable"', size: 17 },
  look: { css: '600 11px "Inter Variable"', size: 11 },

const UNIT_AFTER_NUMBER = /(?<=\d )(h|TB|PB|MB|Gb\/s)\b/;
const upperKeepUnits = (t) => t.toUpperCase().replace(/(?<=\d )(H|TB|PB|MB|GB\/S)\b/g, (u) => (u === 'H' ? 'h' : u === 'GB/S' ? 'Gb/s' : u));

  if (widthCache.has(key)) return widthCache.get(key);

  ctx.font = f.css;
  const s = f.upper ? upperKeepUnits(text) : text;
  const w = Math.ceil(ctx.measureText(s).width + (f.track ? f.track * f.size * s.length : 0)) + 1;
  widthCache.set(key, w);

  [/(\d+) \+ (\d+)/g, '$1\u0001+\u0001$2'],
  [/(\d[\d.,]*%?) (h|TB|PB|MB|Gb\/s|nines|copies|copy|pieces|piece|years|disks|ways|million|billion|trillion)\b/g, '$1\u0001$2'],

  [/(\d) ×/g, '$1\u0001×'],

    if (tw(next.replace(/\u0001/g, ' '), role) <= width || !line) line = next;
    else {

// ---------- Focus outlines and their "Look here" tags (the house rule: one tag per outline, on its edge first).
function focusOutlines(D, ids, H) {
  const TAG = { w: 72, h: 16 };
  const boxes = ids.flatMap((id) => (D.regions[id] ?? []).map((b) => ({ ids: [id], x0: b.x, y0: b.y, x1: b.x + b.w, y1: b.y + b.h })));
  boxes.sort((a, b) => a.y0 - b.y0);
  const groups = [];
  for (const b of boxes) {
    const g = groups[groups.length - 1];
    if (g && b.y0 - g.y1 < TAG.h + 4) Object.assign(g, { ids: [...g.ids, ...b.ids], x0: Math.min(g.x0, b.x0), x1: Math.max(g.x1, b.x1), y1: Math.max(g.y1, b.y1) });
    else groups.push({ ...b });
  }
  D.focusGroups = groups.length;
  for (const g of groups) {
    const x = Math.max(3, g.x0);
    const yy = Math.max(3, g.y0);
    const w = Math.min(D.W - 3, g.x1) - x;
    const h = Math.min(H - 3, g.y1) - yy;
    const own = `focus-${g.ids.join('-')}`;
    D.add('top', `<rect class="focus-outline" data-focus="${g.ids.join(' ')}" x="${r1(x)}" y="${r1(yy)}" width="${r1(w)}" height="${r1(h)}" rx="10"/>`);
    D.link([...sampleLine(x, yy, x + w, yy), ...sampleLine(x + w, yy, x + w, yy + h), ...sampleLine(x, yy + h, x + w, yy + h), ...sampleLine(x, yy, x, yy + h)], own);
    const across = [];
    for (let ax = x + w - TAG.w - 16; ax >= x + 16; ax -= 8) across.push(ax);
    const xs = [x + w - TAG.w - 16, x + 16, ...across];
    const ys = [yy - TAG.h / 2, yy + h - TAG.h / 2, yy + 4, yy + h - TAG.h - 4, yy + 22, yy + h - TAG.h - 22, yy + 40];
    let placed = false;
    for (const [tx, ty] of ys.flatMap((t) => xs.map((sx) => [sx, t]))) {
      const tb = { x0: tx, x1: tx + TAG.w, y0: ty, y1: ty + TAG.h };
      if (tx < 3 || tx + TAG.w > D.W - 3 || ty < 3 || ty + TAG.h > H - 3) continue;
      if (!D.free(tb, own, 1)) continue;
      D.add('top', `<rect class="tag" data-tag="${own}" x="${r1(tx)}" y="${r1(ty)}" width="${TAG.w}" height="${TAG.h}" rx="8"/>`);
      D.add('top', `<text x="${r1(tx + TAG.w / 2)}" y="${r1(ty + 12)}" text-anchor="middle" data-owner="look" data-ground="1"><tspan class="t-look">LOOK HERE</tspan></text>`);
      D.mark(tb, 'look');
      placed = true;
      break;
    }
    if (!placed) D.missingTags = (D.missingTags ?? 0) + 1;
  }
}

function giveawaysOf(spec) {

    reads: [sl.readAfter, sl.gbpsAfter, '10 pieces'],
    batch: [sl.after + ' nines', M.oneIn(M.run(actSettings(spec)).loss), 'And a fourth', `× ${M.oneIn(M.run(spec.setup).p)}`],
    rack: [sl.after + ' nines', '0.1% a year', 'Or a rack event'],
