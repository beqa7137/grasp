<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quorum widget mockup</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url(fonts/inter-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        src: url(fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 800;
        font-display: block;
      }
      /* The app's tokens (apps/app/src/_theme.scss, styles.scss): light is the base, dark overrides. */
      :root {
        color-scheme: light;
        --g-bg: #f4f5f9;
        --g-surface: #ffffff;
        --g-raised: #ffffff;
        --g-sunken: #eef0f5;
        --g-line: #dfe2ea;
        --g-line-strong: #c6cbd6;
        --g-stroke: #707889;
        --g-text: #161a23;
        --g-text-rgb: 22, 26, 35;
        --g-muted: #4a5263;
        --g-faint: #5c6477;
        --g-on-fill: #ffffff;
        --g-warn-ink: #6e4200;
        --g-danger-ink: #9d1630;
        --g-found-ink: #02583f;
        --g-accent: #5846dc;
        --g-accent-rgb: 88, 70, 220;
        --g-accent-soft: rgba(88, 70, 220, 0.14);
        --g-found: #036b4c;
        --g-danger: #c3203d;
        --g-danger-rgb: 195, 32, 61;
        --g-warn: #945800;
        --g-warn-rgb: 148, 88, 0;
        --g-success-ink: var(--g-found-ink);
        --g-success-line: var(--g-found);
        --g-success-soft: rgba(3, 107, 76, 0.12);
        --g-danger-soft: rgba(195, 32, 61, 0.12);
        --g-warn-soft: rgba(148, 88, 0, 0.12);
        --g-viz-stage: #f7f8fb;
        --g-viz-current: #0b74ad;
        --g-viz-current-soft: rgba(11, 116, 173, 0.16);
        --g-viz-considering: #c77700;
        --g-viz-considering-soft: rgba(199, 119, 0, 0.14);
        --g-viz-final: #12925f;
        --g-viz-final-soft: rgba(18, 146, 95, 0.14);
        --g-viz-final-ink: var(--g-found-ink);
        --g-viz-discarded-ink: #687082;
        --g-viz-critical: #d42a49;
        --g-viz-track: #d3d7e0;
        --g-shadow: 0 1px 2px rgba(var(--g-text-rgb), 0.06), 0 3px 10px rgba(var(--g-text-rgb), 0.07);
        --g-shadow-raised: 0 1px 2px rgba(var(--g-text-rgb), 0.08);
        --g-radius-xs: 6px;
        --g-radius-sm: 10px;
        --g-radius-md: 14px;
        --g-radius-pill: 999px;
        --g-text-title-m: 1.0625rem;
        --g-text-title-s: 0.9375rem;
        --g-text-body: 0.875rem;
        --g-text-body-s: 0.8125rem;
        --g-text-label: 0.6875rem;
        --g-font: 'Inter Variable', system-ui, sans-serif;
        --g-font-mono: 'JetBrains Mono Variable', ui-monospace, monospace;
        --g-focus-ring: 2px solid var(--g-accent);
      }
      :root.dark {
        color-scheme: dark;
        --g-bg: #0b0d12;
        --g-surface: #141824;
        --g-raised: #1c2130;
        --g-sunken: #0f121a;
        --g-line: #252a37;
        --g-line-strong: #343b4d;
        --g-stroke: #6b7387;
        --g-text: #e9ebf2;
        --g-text-rgb: 233, 235, 242;
        --g-muted: #8b93a8;
        --g-faint: #828a9e;
        --g-on-fill: #0b0d12;
        --g-warn-ink: #f3e6b3;
        --g-danger-ink: #ffb3bd;
        --g-found-ink: #3ddc97;
        --g-accent: #9d8cff;
        --g-accent-rgb: 157, 140, 255;
        --g-accent-soft: rgba(157, 140, 255, 0.14);
        --g-found: #3ddc97;
        --g-danger: #ff5d73;
        --g-danger-rgb: 255, 93, 115;
        --g-warn: #ffb547;
        --g-warn-rgb: 255, 181, 71;
        --g-success-soft: rgba(61, 220, 151, 0.12);
        --g-danger-soft: rgba(255, 93, 115, 0.12);
        --g-warn-soft: rgba(255, 181, 71, 0.12);
        --g-viz-stage: #0e1118;
        --g-viz-current: #1f9fd0;
        --g-viz-current-soft: rgba(31, 159, 208, 0.16);
        --g-viz-considering: #c08420;
        --g-viz-considering-soft: rgba(192, 132, 32, 0.18);
        --g-viz-final: #22ad74;
        --g-viz-final-soft: rgba(34, 173, 116, 0.18);
        --g-viz-final-ink: var(--g-found);
        --g-viz-discarded-ink: var(--g-muted);
        --g-viz-critical: #e5485f;
        --g-viz-track: #2a3040;
        --g-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        --g-shadow-raised: var(--g-shadow);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--g-bg);
        color: var(--g-text);
        font: 400 var(--g-text-body) / 1.5 var(--g-font);
        font-variant-ligatures: none;
        -webkit-font-smoothing: antialiased;
        overflow-wrap: break-word;
      }
      button {
        font-size: 0.8333rem;
      }
      .page {
        max-width: 1048px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      .eyebrow {
        margin: 0;
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
      }
      h1 {
        margin: 4px 0 14px;
        font: 600 1.25rem/1.3 var(--g-font);
      }
      .panel {
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background: var(--g-surface);
        box-shadow: var(--g-shadow);
        padding: 16px;
      }
      .widget {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }
      .main,
      .experiments {
        display: contents;
      }
      .controls {
        order: 1;
      }
      .stage {
        order: 2;
        min-width: 0;
      }
      .dock {
        order: 3;
      }
      .describe {
        order: 4;
      }
      .heading,
      .cards {
        order: 5;
      }
      /* Narrow: the controls are the stage's first rows. */
      .controls {
        padding: 12px 12px 0;
        border: 1px solid var(--g-line);
        border-bottom: 0;
        border-radius: var(--g-radius-md) var(--g-radius-md) 0 0;
        background: var(--g-viz-stage);
        display: grid;
        gap: 10px;
      }
      .stage {
        margin-top: -12px;
      }
      .stage .well {
        border-top: 0;
        border-radius: 0 0 var(--g-radius-md) var(--g-radius-md);
      }
      @media (min-width: 1000px) {
        .widget {
          grid-template-columns: minmax(0, 1fr) 340px;
          grid-template-rows: auto 1fr;
          align-items: start;
          column-gap: 20px;
        }
        .main {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: 12px;
          grid-column: 1;
          grid-row: 1 / span 2;
          min-width: 0;
        }
        .controls {
          grid-column: 2;
          grid-row: 1;
          padding: 0;
          border: 0;
          background: none;
        }
        .experiments {
          display: block;
          grid-column: 2;
          grid-row: 2;
          min-width: 0;
        }
        .stage {
          margin-top: 0;
        }
        .stage .well {
          border-top: 1px solid var(--g-line);
          border-radius: var(--g-radius-md);
        }
        .dock {
          margin-top: 12px;
        }
      }
      .well {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background-color: var(--g-viz-stage);
        background-image: radial-gradient(circle, rgba(var(--g-text-rgb), 0.09) 1px, transparent 1.5px);
        background-size: 24px 24px;
        background-position: 11px 11px;
      }
      fieldset.group {
        margin: 0;
        padding: 0;
        border: 0;
        min-width: 0;
      }
      fieldset.group.n-control {
        padding: 0;
      }
      .control-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
        padding: 0;
        margin-bottom: 4px;
      }
      .segments {
        display: flex;
        gap: 4px;
      }
      .segment {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
      }
      .segment input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .segment span {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 6px;
        border-radius: var(--g-radius-sm);
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        font: 500 var(--g-text-body) / 1.15 var(--g-font);
        text-align: center;
      }
      .segment input:checked + span {
        background: var(--g-accent-soft);
        border-color: var(--g-accent);
        box-shadow: inset 0 0 0 1px var(--g-accent);
        font-weight: 600;
      }
      .segment small {
        font: 500 var(--g-text-label) var(--g-font);
        color: var(--g-muted);
      }
      .toggles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .toggles .segment span {
        flex-direction: column;
        gap: 0;
        font-size: var(--g-text-body-s);
      }
      .notice {
        margin: 0;
        min-height: 2lh;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      .play {
        position: absolute;
        top: 2px;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        z-index: 2;
      }
      .play svg {
        display: block;
        width: 36px;
        height: 36px;
        margin: 4px;
      }
      .play circle {
        fill: var(--g-raised);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .play path {
        fill: var(--g-accent);
      }
      .card-hit {
        position: absolute;
        padding: 0;
        border: 0;
        background: transparent;
        border-radius: 8px;
        cursor: pointer;
        z-index: 1;
      }
      .card-hit:focus-visible {
        outline: var(--g-focus-ring);
        outline-offset: 3px;
      }
      .handle {
        position: absolute;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        cursor: ew-resize;
        z-index: 2;
      }
      .handle .knob {
        width: 14px;
        height: 30px;
        border-radius: var(--g-radius-pill);
        background: var(--g-raised);
        border: 2px solid var(--g-accent);
        box-shadow: var(--g-shadow-raised);
      }
      .hint {
        position: absolute;
        z-index: 3;
        padding: 4px 8px;
        border-radius: var(--g-radius-xs);
        background: var(--g-text);
        color: var(--g-viz-stage);
        font: 500 var(--g-text-label) / 1.3 var(--g-font);
        white-space: nowrap;
        pointer-events: none;
      }
      /* Drawing roles (feed-stage.scss): text sits on a stage-coloured halo. */
      svg.draw {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        overflow: visible;
      }
      svg.draw text {
        paint-order: stroke;
        stroke: var(--g-viz-stage);
        stroke-width: 3px;
        stroke-linejoin: round;
      }
      svg.draw text.on-card {
        stroke: var(--g-raised);
      }
      svg.draw text.on-chip {
        stroke: none;
      }
      .t-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: var(--g-muted);
      }
      .t-cap {
        font: 500 var(--g-text-body-s) var(--g-font);
        fill: var(--g-muted);
      }
      .t-capB {
        font: 600 var(--g-text-body-s) var(--g-font);
        fill: var(--g-text);
      }
      .t-small {
        font: 500 var(--g-text-label) var(--g-font);
        font-variant-numeric: tabular-nums;
        fill: var(--g-muted);
      }
      .t-smallB {
        font: 700 var(--g-text-label) var(--g-font);
        font-variant-numeric: tabular-nums;
        fill: var(--g-text);
      }
      .t-mono {
        font: 600 var(--g-text-label) var(--g-font-mono);
        font-variant-numeric: tabular-nums;
        fill: var(--g-text);
      }
      .t-name {
        font: 600 15px var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-nameS {
        font: 600 13px var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-head {
        font: 600 var(--g-text-title-m) var(--g-font-mono);
        font-variant-numeric: tabular-nums;
        fill: var(--g-text);
      }
      .t-pill {
        font: 600 var(--g-text-body-s) var(--g-font);
        fill: var(--g-text);
      }
      .ink {
        fill: var(--g-text);
      }
      .muted {
        fill: var(--g-muted);
      }
      .good {
        fill: var(--g-viz-final-ink);
      }
      .bad {
        fill: var(--g-danger-ink);
      }
      .warn {
        fill: var(--g-warn-ink);
      }
      .accent {
        fill: var(--g-accent);
      }
      .regular {
        font-weight: 500;
      }
      .rule {
        stroke: var(--g-line);
      }
      .box {
        fill: var(--g-raised);
        stroke: var(--g-line-strong);
      }
      .box.dashed {
        stroke-dasharray: 4 3;
      }
      .box.idle {
        fill: none;
        stroke: var(--g-line-strong);
        stroke-dasharray: 3 3;
      }
      .card {
        fill: var(--g-raised);
        stroke: var(--g-line-strong);
        stroke-width: 1;
      }
      .card.down {
        fill: url(#hatch);
        stroke-dasharray: 4 3;
      }
      .card.mid {
        stroke: var(--g-viz-critical);
        stroke-dasharray: 4 3;
      }
      .card.both {
        stroke: var(--g-viz-final);
        stroke-width: 2.5;
      }
      .both-ring {
        fill: none;
        stroke: var(--g-viz-final);
        stroke-width: 1.5;
        stroke-opacity: 0.55;
      }
      .card-fill-down {
        fill: var(--g-sunken);
      }
      .hatch-line {
        stroke: var(--g-viz-discarded-ink);
        stroke-opacity: 0.35;
        stroke-width: 1.5;
      }
      .chip {
        fill: var(--g-raised);
        stroke: var(--g-line-strong);
      }
      .chip.new {
        fill: var(--g-viz-final-soft);
        stroke: var(--g-viz-final);
      }
      .chip.old {
        fill: var(--g-sunken);
        stroke: var(--g-line-strong);
      }
      .chip.unknown {
        fill: var(--g-viz-stage);
        stroke: var(--g-line-strong);
        stroke-dasharray: 3 2;
      }
      .chip.asked {
        fill: var(--g-viz-stage);
        stroke: var(--g-viz-considering);
        stroke-width: 1.5;
      }
      .chip.sent {
        fill: var(--g-viz-stage);
        stroke: var(--g-viz-current);
        stroke-opacity: 0.6;
      }
      .chip.wth {
        stroke: var(--g-viz-current);
        stroke-opacity: 1;
        stroke-width: 2;
      }
      .chip.quiet {
        fill: var(--g-viz-stage);
        stroke: var(--g-line);
      }
      .chip-new-ink {
        fill: var(--g-viz-final-ink);
      }
      .link {
        fill: none;
        stroke-linecap: round;
      }
      .link.write {
        stroke: var(--g-viz-current);
        stroke-width: 2;
      }
      .link.write.weak {
        stroke-width: 1.25;
        stroke-opacity: 0.45;
      }
      .link.pending {
        stroke: var(--g-stroke);
        stroke-width: 1.25;
        stroke-dasharray: 5 4;
      }
      .link.unsent {
        stroke: var(--g-line-strong);
        stroke-width: 1.25;
        stroke-dasharray: 1 4;
      }
      .link.read {
        stroke: var(--g-viz-considering);
        stroke-width: 2;
      }
      .link.read.weak {
        stroke-width: 1.25;
        stroke-opacity: 0.4;
      }
      .link.dead {
        stroke: var(--g-line-strong);
        stroke-width: 1.25;
        stroke-dasharray: 4 4;
      }
      .link.repair {
        stroke: var(--g-viz-final);
        stroke-width: 1.75;
        stroke-dasharray: 5 3;
      }
      .xmark {
        stroke: var(--g-viz-critical);
        stroke-width: 2;
        stroke-linecap: round;
        fill: none;
      }
      .xground {
        fill: var(--g-viz-stage);
      }
      .pip {
        fill: none;
        stroke: var(--g-line-strong);
        stroke-width: 1.25;
      }
      .next-pip {
        fill: none;
        stroke: var(--g-accent);
        stroke-width: 1.5;
        stroke-dasharray: 2 2;
      }
      .pip.on {
        fill: var(--g-text);
        stroke: var(--g-text);
      }
      .pause {
        fill: var(--g-warn);
      }
      .repair-glyph {
        fill: none;
        stroke: var(--g-viz-final);
        stroke-width: 1.5;
        stroke-linecap: round;
      }
      .rail {
        stroke: var(--g-viz-track);
        stroke-width: 4;
        stroke-linecap: round;
      }
      .fill {
        stroke: var(--g-accent);
        stroke-width: 4;
        stroke-linecap: round;
      }
      .stop {
        fill: var(--g-line-strong);
      }
      .pill {
        stroke-width: 1.5;
      }
      .pill.final {
        fill: var(--g-viz-final-soft);
        stroke: var(--g-viz-final);
      }
      .pill.critical {
        fill: var(--g-danger-soft);
        stroke: var(--g-viz-critical);
      }
      .pill.warn {
        fill: var(--g-warn-soft);
        stroke: var(--g-warn);
      }
      .pill.neutral {
        fill: var(--g-raised);
        stroke: var(--g-line-strong);
      }
      .pill.hidden {
        fill: var(--g-viz-stage);
        stroke: var(--g-stroke);
        stroke-dasharray: 4 3;
      }
      .glyph {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .glyph.final {
        stroke: var(--g-viz-final);
      }
      .glyph.critical {
        stroke: var(--g-viz-critical);
      }
      .glyph.warn {
        stroke: var(--g-warn);
      }
      .glyph.neutral,
      .glyph.hidden {
        stroke: var(--g-stroke);
      }
      .cell {
        fill: none;
        stroke: var(--g-viz-track);
      }
      .cell.member {
        fill: var(--g-viz-considering-soft);
        stroke: var(--g-viz-considering);
      }
      .cell.acked {
        fill: var(--g-viz-final);
        stroke: var(--g-viz-final);
      }
      .this-ring {
        fill: none;
        stroke: var(--g-text);
        stroke-width: 1.75;
      }
      .gridline {
        stroke: var(--g-line);
      }
      .lane {
        stroke: var(--g-viz-track);
        stroke-width: 1.5;
      }
      .axis {
        stroke: var(--g-line-strong);
      }
      .ground {
        fill: var(--g-viz-stage);
      }
      .dot.write {
        fill: var(--g-viz-current);
      }
      .dot.standin {
        fill: var(--g-viz-stage);
        stroke: var(--g-viz-current);
        stroke-width: 1.5;
      }
      .dot.read {
        fill: var(--g-viz-considering);
      }
      .ring {
        fill: none;
        stroke: var(--g-text);
        stroke-width: 1.75;
      }
      .repair-bar {
        stroke: var(--g-viz-final);
        stroke-width: 2.5;
        stroke-linecap: round;
      }
      .end-tick {
        stroke: var(--g-viz-final);
        stroke-width: 2;
      }
      .chevron {
        fill: none;
        stroke: var(--g-warn);
        stroke-width: 2;
      }
      .focus-outline {
        fill: none;
        stroke: var(--g-accent);
        stroke-width: 2;
        stroke-dasharray: 6 4;
      }
      .tag {
        fill: var(--g-viz-stage);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .t-look {
        font: 600 var(--g-text-label) var(--g-font);
        fill: var(--g-accent);
      }
      .legend-line {
        stroke-width: 2;
        stroke-linecap: round;
      }
      /* The experiment dock and cards (experiment-dock.component.ts, widget-check.component.ts). */
      .dock {
        padding: 12px 16px;
        border-radius: var(--g-radius-md);
        border: 1px solid var(--g-line);
        border-left: 3px solid var(--g-accent);
        background: var(--g-surface);
      }
      .dock:empty {
        display: none;
      }
      .legend {
        margin: 0 0 4px;
        font-weight: 600;
        line-height: 1.45;
      }
      .options {

      .heading {

      .card-btn .num {

      }

        display: grid;

      .g-btn {
        appearance: none;
        border: 1px solid var(--g-line-strong);
