    </style>
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">System design · Consistency &amp; Quorums</p>
      <h1>Try it</h1>
      <section class="panel widget" id="widget"></section>
    </main>
    <script src="model.js"></script>
    <script>
      'use strict';
      const M = window.QuorumModel;
      const params = new URLSearchParams(location.search);
      document.documentElement.classList.toggle('dark', params.get('theme') === 'dark');

      // ---------- Text measurement, with the fonts the app ships.
      const ROLE = {
        label: { css: '600 11px "Inter Variable"', size: 11, track: 0.12, upper: true },
        cap: { css: '500 13px "Inter Variable"', size: 13 },
        capB: { css: '600 13px "Inter Variable"', size: 13 },
        small: { css: '500 11px "Inter Variable"', size: 11 },
        smallB: { css: '700 11px "Inter Variable"', size: 11 },
        mono: { css: '600 11px "JetBrains Mono Variable"', size: 11 },
        name: { css: '600 15px "JetBrains Mono Variable"', size: 15 },
        nameS: { css: '600 13px "JetBrains Mono Variable"', size: 13 },
        head: { css: '600 17px "JetBrains Mono Variable"', size: 17 },
        pill: { css: '600 13px "Inter Variable"', size: 13 },
        look: { css: '600 11px "Inter Variable"', size: 11 },
      };
      const ctx = document.createElement('canvas').getContext('2d');
      const widthCache = new Map();
      function tw(text, role) {
        const key = role + '|' + text;
        if (widthCache.has(key)) return widthCache.get(key);
        const f = ROLE[role];
        ctx.font = f.css;
        const s = f.upper ? text.toUpperCase() : text;
        const w = Math.ceil(ctx.measureText(s).width + (f.track ? f.track * f.size * s.length : 0)) + 1;
        widthCache.set(key, w);
        return w;
      }
      const partsWidth = (parts) => parts.reduce((s, [t, role, , dx = 0]) => s + tw(t, role) + dx, 0);
      function wrap(text, role, width) {
        const words = text.split(' ');
        const lines = [];
        let line = '';
        for (const w of words) {
          const next = line ? line + ' ' + w : w;
          if (tw(next, role) <= width || !line) line = next;
          else {
            lines.push(line);
            line = w;
          }
        }
        if (line) lines.push(line);
        return lines;
      }
      const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const fmt = M.formatMs;
      const tf = (v) => (v >= 1000 ? M.formatDuration(v) : fmt(v));

      // ---------- The drawing: SVG parts in layers, and the boxes placement checks against.
      class Draw {
        constructor(W) {
          this.W = W;
          this.layers = { back: [], grid: [], links: [], marks: [], text: [], top: [] };
          this.texts = [];
          this.marks = [];
          this.links = [];
          this.hits = [];
          this.regions = {};
        }
        add(layer, s) {
          this.layers[layer].push(s);
        }
        textBox(x, y, w, role, anchor = 'start') {
          const fs = ROLE[role].size;
          const x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
          return { x0, x1: x0 + w, y0: y - 0.74 * fs, y1: y + 0.22 * fs };
        }
        text(x, y, parts, o = {}) {
          if (typeof parts === 'string') parts = [[parts, o.role ?? 'small', o.cls ?? '']];
          const anchor = o.anchor ?? 'start';
          const w = partsWidth(parts);
          const role = parts.reduce((a, p) => (ROLE[p[1]].size > ROLE[a].size ? p[1] : a), parts[0][1]);
          const box = this.textBox(x, y, w, role, anchor);
          box.owner = o.owner ?? '';
          box.ground = !!o.ground;
          box.s = parts.map((p) => p[0]).join('');
          this.texts.push(box);
          const spans = parts
            .map(([t, r, cls = '', dx = 0], i) => `<tspan class="t-${r} ${cls}"${dx ? ` dx="${dx}"` : ''}>${esc(t)}</tspan>`)
            .join('');
          const attrs = `x="${x}" y="${y}" text-anchor="${anchor}"${o.owner ? ` data-owner="${o.owner}"` : ''}${o.ground ? ' data-ground="1"' : ''}`;
          this.add(o.layer ?? 'text', `<text class="${o.textCls ?? ''}" ${attrs}>${spans}</text>`);
          return box;
        }
        mark(box, owner = '') {
          this.marks.push({ ...box, owner });
        }
        link(points, owner = '') {
          this.links.push({ points, owner });
        }
        hit(kind, x, y, w, h, extra = {}) {
          this.hits.push({ kind, x, y, w, h, ...extra });
        }
        region(id, box) {
          (this.regions[id] ??= []).push(box);
        }
        free(box, ignoreOwner = '', margin = 2) {
          const b = { x0: box.x0 - margin, x1: box.x1 + margin, y0: box.y0 - margin, y1: box.y1 + margin };
          const hit = (o) => !(o.x1 <= b.x0 || o.x0 >= b.x1 || o.y1 <= b.y0 || o.y0 >= b.y1);
          const mine = (o) => ignoreOwner && o.owner && o.owner.split(' ').some((t) => ignoreOwner.split(' ').includes(t));
          if (this.texts.some((t) => hit(t) && !mine(t))) return false;
          if (this.marks.some((m) => hit(m) && !mine(m))) return false;
          for (const l of this.links) {
            if (mine(l)) continue;
            if (l.points.some(([x, y]) => x > b.x0 && x < b.x1 && y > b.y0 && y < b.y1)) return false;
          }
          return b.x0 >= 2 && b.x1 <= this.W - 2;
        }
        svg(H) {
          const L = this.layers;
          return `<svg class="draw" width="${this.W}" height="${H}" viewBox="0 0 ${this.W} ${H}" role="img" aria-label="${esc(this.label ?? '')}">
<defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="card-fill-down"/><line class="hatch-line" x1="0" y1="0" x2="0" y2="6"/></pattern>
<marker id="arrow-repair" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--g-viz-final)"/></marker>
</defs>
<g>${L.back.join('')}</g><g>${L.grid.join('')}</g><g>${L.links.join('')}</g><g>${L.marks.join('')}</g><g>${L.text.join('')}</g><g>${L.top.join('')}</g></svg>`;
        }
      }
      const sampleLine = (x1, y1, x2, y2, step = 3) => {
        const n = Math.max(2, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / step));
        return Array.from({ length: n + 1 }, (_, i) => [x1 + ((x2 - x1) * i) / n, y1 + ((y2 - y1) * i) / n]);
      };
      const quad = (p0, c, p1, t) => [
        (1 - t) ** 2 * p0[0] + 2 * (1 - t) * t * c[0] + t ** 2 * p1[0],
        (1 - t) ** 2 * p0[1] + 2 * (1 - t) * t * c[1] + t ** 2 * p1[1],
      ];
      const r1 = (v) => Math.round(v * 10) / 10;

      // ---------- What the open question hides, on every surface (one map: known.md bug 1).
      function hiding(view) {
        const h = new Set(view.hide);
        return {
          count: h.has('count'),
          verdict: h.has('verdict'),
          write: h.has('write'),
          writeTime: h.has('write') || h.has('write-time'),
          avail: h.has('availability'),
          repair: h.has('repair') || h.has('verdict'),
          readTime: h.has('repair') || h.has('verdict'),
        };
      }

      const STATE_WORD = { up: 'up', down: 'down', mid: 'stopped', back: 'missed v8' };
      const NEXT = { up: 'down', down: 'mid', mid: 'back', back: 'up' };
      const NEXT_PHRASE = {
        down: 'take it down',
        mid: 'make it stop mid-write',
        back: 'bring it back, having missed the write',
        up: 'bring it up',
      };

      function pillOf(m, hid) {
        const r = m.read;
        if (hid.verdict) return { tone: 'hidden', text: 'returns ? · after your answer' };
        const time = hid.readTime ? '? ms' : tf(r.ms ?? 0);
        switch (m.verdict) {
          case 'fresh':
            return { tone: 'final', text: `returns v8 · fresh · ${time}` };
          case 'stale':
            return { tone: 'critical', text: `returns v7 · stale · ${time}` };
          case 'refused':
            return { tone: 'neutral', text: `write refused · read ${time}` };
          case 'timed-out':
            return { tone: 'warn', text: `write timed out · returns v8 · ${time}` };
          case 'old':
            return { tone: 'neutral', text: `write timed out · read ${time}` };
          case 'failed-write':
            return { tone: 'neutral', text: `write timed out, applied nowhere · read ${time}` };
          default:
            return { tone: 'critical', text: `read fails · ${r.reachable} reachable, ${r.needed} needed` };
        }
      }

      function glyph(tone, x, y) {
        const c = `glyph ${tone}`;
        if (tone === 'final') return `<path class="${c}" d="M${x - 5} ${y}l3.5 3.5l6.5 -7"/>`;
        if (tone === 'critical') return `<path class="${c}" d="M${x - 4} ${y - 4}l8 8M${x + 4} ${y - 4}l-8 8"/>`;
        if (tone === 'warn') return `<circle class="${c}" cx="${x}" cy="${y}" r="5.5"/><path class="${c}" d="M${x} ${y - 3}v3l2 1.5"/>`;
        if (tone === 'hidden') return `<path class="${c}" d="M${x - 3} ${y - 3}a3 3 0 1 1 3 3v1.5M${x} ${y + 4.5}v0.1"/>`;
        return `<path class="${c}" d="M${x - 4} ${y}h8"/>`;
      }
      function xGlyph(D, cx, cy, owner, s = 4) {
        D.add('marks', `<circle class="xground" cx="${cx}" cy="${cy}" r="${s + 3}"/><path class="xmark" d="M${cx - s} ${cy - s}l${2 * s} ${2 * s}M${cx + s} ${cy - s}l${-2 * s} ${2 * s}"/>`);
        D.mark({ x0: cx - s - 2, x1: cx + s + 2, y0: cy - s - 2, y1: cy + s + 2 }, owner);
      }

      // ---------- A W or R handle block: the track with its stops, the level names and the availability caption.
      function handleBlock(D, o) {
        const { id, x, y, w, k, n, hid, letter, what, survives, succeed, verb } = o;
        D.text(x, y + 14, [[letter, 'name', 'accent'], [what, 'small', 'muted', 6]], { owner: id });
        const tx0 = x + 22;
        const tx1 = x + w - 22;
        const ty = y + 38;
        const pos = (j) => tx0 + ((j - 1) * (tx1 - tx0)) / (n - 1);
        D.add('marks', `<line class="rail" x1="${tx0}" y1="${ty}" x2="${tx1}" y2="${ty}"/><line class="fill" x1="${tx0}" y1="${ty}" x2="${pos(k)}" y2="${ty}"/>`);
        for (let j = 1; j <= n; j++) D.add('marks', `<circle class="stop" cx="${pos(j)}" cy="${ty}" r="2.5"/>`);
        for (let j = 1; j <= n; j++) {
          const name = M.levelName(j, n) ?? String(j);
          const anchor = 'middle';
          D.text(pos(j), y + 62, [[name, j === k ? 'smallB' : 'small', j === k ? 'ink' : 'muted']], { anchor, owner: id });
        }
        const pct = M.formatNines(succeed);
        const full = hid ? `survives ? down · ${verb} succeed ?` : `survives ${survives} down · ${verb} succeed ${pct}`;
        const short = hid ? 'survives ? · succeeds ?' : `survives ${survives} down · ${pct}`;
        const cap = tw(full, 'small') <= w ? full : short;
        D.text(x, y + 81, [[cap, 'small', 'muted']], { owner: id });
        D.hit('handle', pos(k) - 22, ty - 22, 44, 44, { owner: id, label: `${letter} ${M.levelName(k, n) ?? k}` });
        D.region('handles', { x: x - 4, y: y - 2, w: w + 8, h: 90 });
      }

      // ---------- The stage.
      function buildStage(W, m, view) {
        const D = new Draw(W);
        const hid = hiding(view);
        const wide = W >= 520;
        const pad = wide ? 16 : 8;
        const { n, w, r } = m.settings;
        const reps = m.replicas;
        const write = m.write;
        const read = m.read;

        // Header.
        D.hit('play', pad - 6, 2, 44, 44, { owner: 'play' });
        D.text(pad + 42, 29, 'One write, then one read', { role: 'label' });
        if (wide) {
          let lx = W - pad;
          for (const [name, cls] of [
            ['repair', 'link repair'],
            ['read', 'link read'],
            ['write', 'link write'],
          ]) {
            const tw0 = tw(name, 'small');
            D.text(lx, 29, [[name, 'small', 'muted']], { anchor: 'end' });
            lx -= tw0 + 6;
            D.add('marks', `<line class="${cls} legend-line" x1="${lx - 16}" y1="25" x2="${lx}" y2="25"/>`);
            lx -= 30;
          }
        }

        // Card columns.
        const gapMin = wide ? 12 : n === 5 ? 3 : 8;
        const cw = Math.min(wide ? 132 : 96, Math.floor((W - 2 * pad - (n - 1) * gapMin) / n));
        const gap = n > 1 ? (W - 2 * pad - n * cw) / (n - 1) : 0;
        const cx = (i) => r1(pad + i * (cw + gap) + cw / 2);
        const cardH = wide ? 80 : 72;

        // Writer row, with the W handle beside it (wide) or above it (narrow).
        const writerW = wide ? 156 : Math.round(Math.min(150, Math.max(124, (W - 2 * pad) * 0.5)));
        const standGap = 14;
        let y = 48;
        const writerH = wide ? 84 : 88;
        let writerY;
        const wHandle = {
          id: 'whandle',
          k: w,
          n,
          hid: hid.avail,
          letter: 'W',
          what: wide ? 'acks a write waits for' : 'acks a write waits for',
          survives: m.survives.write,
          succeed: m.avail.write,
          verb: 'writes',
        };
        if (wide) {
          writerY = y + 4;
          const hx = pad + writerW + standGap + 112 + 24;
          handleBlock(D, { ...wHandle, x: hx, y: writerY, w: W - pad - hx });
          y = writerY + writerH;
        } else {
          handleBlock(D, { ...wHandle, x: pad, y: y, w: W - 2 * pad });
          writerY = y + 92;
          y = writerY + writerH;
        }
        const wx = pad;
        D.add('marks', `<rect class="box" x="${wx}" y="${writerY}" width="${writerW}" height="${writerH}" rx="10"/>`);
        D.mark({ x0: wx, x1: wx + writerW, y0: writerY, y1: writerY + writerH }, 'writer');
        const wlabel = tw('Writer · zone A', 'label') <= writerW - 20 ? 'Writer · zone A' : 'Writer';
        D.text(wx + 12, writerY + 20, [[wlabel, 'label']], { owner: 'writer', textCls: 'on-card' });
        D.text(wx + 12, writerY + 43, [['v8', wide ? 'name' : 'nameS', 'ink'], ['Artemis', 'cap', 'muted', 6]], { owner: 'writer', textCls: 'on-card' });
        let status;
        if (hid.write) status = ['outcome after your answer', 'muted'];
        else if (write.outcome === 'acked') status = [hid.writeTime ? 'acked in ?' : `acked in ${fmt(write.ms)}`, 'good'];
        else if (write.outcome === 'refused') status = [`refused: ${write.live} live, ${write.needed} needed`, 'bad'];
        else status = [`timed out at ${M.formatDuration(M.TIMEOUT_MS)}`, 'warn'];
        const statusLines = wrap(status[0], 'capB', writerW - 22);
        statusLines.forEach((line, i) => D.text(wx + 12, writerY + 64 + i * 16, [[line, 'capB', status[1]]], { owner: 'writer', textCls: 'on-card' }));
        D.region('writer', { x: wx - 2, y: writerY - 2, w: writerW + 4, h: writerH + 4 });

        // Stand-ins beside the writer (sloppy only).
        if (m.settings.sloppy) {
          const sx = wx + writerW + standGap;
          const sw = wide ? 112 : W - pad - sx;
          const sh = (writerH - 8) / 2;
          for (let j = 0; j < 2; j++) {
            const s = m.standIns[j];
            const sy = writerY + j * (sh + 8);
            const owner = `H${j + 1}`;
            D.add('marks', `<rect class="box ${s ? 'dashed' : 'idle'}" x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="8"/>`);
            D.mark({ x0: sx, x1: sx + sw, y0: sy, y1: sy + sh }, owner);
            D.add('links', `<line class="link ${s ? 'write' : 'unsent'}" x1="${wx + writerW}" y1="${sy + sh / 2}" x2="${sx}" y2="${sy + sh / 2}"/>`);
            D.link(sampleLine(wx + writerW, sy + sh / 2, sx, sy + sh / 2), `writer ${owner}`);
            D.text(sx + 8, sy + sh / 2 + 5, [[owner, 'nameS', s ? 'ink' : 'muted']], { owner, textCls: 'on-card' });
            if (s) {
              const has = write.applied.includes(s.id);
              const chipT = hid.write ? '?' : has ? 'v8' : '–';
              const chx = sx + 34;
              D.add('marks', `<rect class="chip ${hid.write ? 'unknown' : has ? 'new' : 'old'}" x="${chx}" y="${sy + sh / 2 - 9}" width="26" height="18" rx="5"/>`);
              D.text(chx + 13, sy + sh / 2 + 4, [[chipT, 'mono', has && !hid.write ? 'chip-new-ink' : 'muted']], { anchor: 'middle', owner, textCls: 'on-chip' });
              const forT = `for R${s.standsFor + 1}`;
              if (sx + 66 + tw(forT, 'small') <= sx + sw - 6) D.text(sx + 66, sy + sh / 2 + 4, [[forT, 'small', 'muted']], { owner, textCls: 'on-card' });
            } else {
              const idle = 'standing by';
              if (sx + 34 + tw(idle, 'small') <= sx + sw - 6) D.text(sx + 34, sy + sh / 2 + 4, [[idle, 'small', 'muted']], { owner, textCls: 'on-card' });
            }
          }
          D.region('standins', { x: sx - 2, y: writerY - 2, w: sw + 4, h: writerH + 4 });
        }

        // The write fan.
        const fanH = wide ? 69 : 66;
        const chipH = 16;
        const wChipY = y + fanH;
        const cardY = wChipY + chipH + 4;
        const wApex = [Math.min(Math.max(cx(0), wx + 18), wx + writerW - 18), writerY + writerH];
        const wthId = write.outcome === 'acked' ? write.acked[write.acked.length - 1] : null;
        reps.forEach((rep, i) => {
          const owner = `R${i + 1}`;
          if (rep.knownDown) return;
          const end = [cx(i), wChipY];
          let cls;
          if (hid.write) cls = 'pending';
          else if (write.outcome === 'refused') cls = 'unsent';
          else if (write.acked.includes(i) && write.outcome === 'acked') cls = 'write';
          else cls = 'write weak';
          D.add('links', `<line class="link ${cls}" x1="${wApex[0]}" y1="${wApex[1]}" x2="${end[0]}" y2="${end[1]}"/>`);
          D.link(sampleLine(wApex[0], wApex[1], end[0], end[1]), `writer ${owner}`);
          let t;
          let chipCls = 'sent';
          let ink = 'ink';
          if (write.outcome === 'refused' && !hid.write) {
            t = wide ? 'not sent' : '–';
            chipCls = 'quiet';
            ink = 'muted';
          } else if (rep.state === 'mid' && !hid.write) {
            t = wide ? 'no ack' : '×';
            chipCls = 'quiet';
            ink = 'bad';
          } else t = fmt(rep.writeRtt);
          if (i === wthId && !hid.writeTime) chipCls += ' wth';
          const cwid = Math.max(26, tw(t, 'mono') + 10);
          D.add('marks', `<rect class="chip ${chipCls}" x="${end[0] - cwid / 2}" y="${wChipY}" width="${cwid}" height="${chipH}" rx="8"/>`);
          D.mark({ x0: end[0] - cwid / 2, x1: end[0] + cwid / 2, y0: wChipY, y1: wChipY + chipH }, owner);
          D.text(end[0], wChipY + 12, [[t, 'mono', ink]], { anchor: 'middle', owner, textCls: 'on-chip' });
        });

        // Replica cards.
        const both = hid.verdict ? [] : m.both;
        reps.forEach((rep, i) => {
          const owner = `R${i + 1}`;
          const x = r1(cx(i) - cw / 2);
          const st = rep.state;
          let cls = 'card';
          if (st === 'down') cls += ' down';
          if (st === 'mid') cls += ' mid';
          if (both.includes(i)) cls += ' both';
          if (both.includes(i) && gap >= 8) D.add('back', `<rect class="both-ring" x="${x - 4}" y="${cardY - 4}" width="${cw + 8}" height="${cardH + 8}" rx="12"/>`);
          D.add('marks', `<rect class="${cls}" x="${x}" y="${cardY}" width="${cw}" height="${cardH}" rx="8"/>`);
          D.mark({ x0: x, x1: x + cw, y0: cardY, y1: cardY + cardH }, owner);
          const ix = wide ? 10 : 5;
          D.text(x + ix, cardY + (wide ? 22 : 18), [[owner, wide ? 'name' : 'nameS', st === 'down' ? 'muted' : 'ink']], { owner, textCls: 'on-card' });
          const zone = wide ? `zone ${rep.zone}` : rep.zone;
          D.text(x + cw - ix, cardY + (wide ? 22 : 18), [[zone, 'small', 'muted']], { anchor: 'end', owner, textCls: 'on-card' });
          // The value the replica holds once the scenario has run.
          const holds = m.holds[i];
          const repaired = read.repairs.includes(i) && !hid.repair;
          let shown = holds;
          if (read.repairs.includes(i) && hid.repair) shown = 7;
          if (hid.write && st !== 'down' && st !== 'mid') shown = '?';
          const chipY = cardY + (wide ? 32 : 26);
          if (st === 'mid' && !hid.write) {
            xGlyph(D, x + ix + 8, chipY + 9, owner, 4);
          } else if (shown !== null) {
            const label = shown === '?' ? '?' : `v${shown}`;
            const word = wide && shown === 8 && cw >= 100 ? 'Artemis' : wide && shown === 7 && cw >= 100 ? 'Apollo' : '';
            const chw = tw(label, 'mono') + (word ? tw(word, 'small') + 5 : 0) + 12;
            const ccls = shown === '?' ? 'unknown' : shown === 8 ? 'new' : 'old';
            D.add('marks', `<rect class="chip ${ccls}" x="${x + ix}" y="${chipY}" width="${chw}" height="18" rx="5"/>`);
            D.text(x + ix + 6, chipY + 13, word ? [[label, 'mono', shown === 8 ? 'chip-new-ink' : 'muted'], [word, 'small', 'muted', 5]] : [[label, 'mono', shown === 8 ? 'chip-new-ink' : shown === 7 ? 'muted' : 'muted']], {
              owner,
              textCls: 'on-chip',
            });
            if (repaired) {
              const gx = x + ix + chw + 9;
              if (gx + 6 <= x + cw - 3)
                D.add('marks', `<path class="repair-glyph" d="M${gx + 4} ${chipY + 5}a4.5 4.5 0 1 0 1 5"/><path class="repair-glyph" d="M${gx + 5} ${chipY + 2}v3.5h-3.5"/>`);
            }
          }
          if (rep.pause) {
            const px = x + cw - ix - 8;
            const py = chipY + 4;
            D.add('marks', `<rect class="pause" x="${px}" y="${py}" width="3" height="10" rx="1"/><rect class="pause" x="${px + 5}" y="${py}" width="3" height="10" rx="1"/>`);
          }
          // State pips: up, down, stops mid-write, back.
          const pipY = cardY + cardH - (wide ? 14 : 12);
          const pr = wide ? 3.5 : 2.5;
          const pg = wide ? 11 : 8;
          M.STATES.forEach((s, j) => D.add('marks', `<circle class="pip${s === st ? ' on' : ''}" cx="${x + ix + pr + j * pg}" cy="${pipY}" r="${pr}"/>`));
          if (view.hint === i) {
            const j = M.STATES.indexOf(NEXT[st]);
            D.add('marks', `<circle class="next-pip" cx="${x + ix + pr + j * pg}" cy="${pipY}" r="${pr + 2.5}"/>`);
          }
          if (wide) {
            let word = STATE_WORD[st];
            let wcls = 'muted';
            const answered = read.answers.find((a) => a.id === i);
            if (repaired) {
              word = 'repaired';
              wcls = 'good';
            } else if (answered && answered.value === 7 && holds === 8 && !hid.verdict && !hid.write) {
              word = `v8 at ${fmt(rep.landAt)}`;
              wcls = 'warn';
            } else if (rep.pause && st === 'up') {
              word = 'paused';
              wcls = 'warn';
            } else if (st === 'back' && hid.write) word = 'back';
            const wx0 = x + ix + 3 * pg + 2 * pr + 6;
            if (wx0 + tw(word, 'small') <= x + cw - 6) D.text(wx0, pipY + 4, [[word, 'small', wcls]], { owner, textCls: 'on-card' });
          }
          D.hit('card', x, cardY, cw, cardH, {
            owner,
            label: `${owner}, ${M.STATE_NAMES[st]}${rep.pause ? ', paused' : ''}. Activate to ${NEXT_PHRASE[NEXT[st]]}.`,
          });
        });
        D.region('cards', { x: pad - 4, y: wChipY - 4, w: W - 2 * pad + 8, h: cardH + chipH + 4 + 8 + chipH + 4 });

        // Read chips under the cards, then the read fan.
        const rChipY = cardY + cardH + 4;
        const readerY = rChipY + chipH + fanH;
        const readerRows = (() => {
          if (wide) return 1;
          const chipW = tw('R5 v8', 'mono') + 14;
          const per = Math.max(1, Math.floor((W - 2 * pad - 24 + 6) / (chipW + 6)));
          return Math.ceil(n / per);
        })();
        const readerH = wide ? 62 : 20 + 12 + readerRows * 26;
        const chipList = read.answers
          .map((a) => ({ ...a }))
          .sort((a, b) => b.value - a.value || a.rtt - b.rtt);
        const chipW = (a) => tw(`R${a.id + 1} ${hid.verdict ? '?' : 'v' + a.value}`, 'mono') + 14;
        const sentT = hid.write ? 'sent when the write returns' : write.outcome === 'refused' ? 'sent at once' : `sent at ${tf(read.sentAt)}`;
        const readerLabel = 'Reader · zone C';
        let rw;
        if (wide) {
          const chipsW = chipList.reduce((s, a) => s + chipW(a) + 6, 0) - 6;
          const need = Math.max(tw(readerLabel, 'label') + 16 + tw('sent when the write returns', 'small'), chipsW, 230) + 24;
          rw = Math.min(Math.round(W * 0.56), Math.ceil(need));
        } else rw = W - 2 * pad;
        const rx = W - pad - rw;
        const rApex = [Math.min(Math.max(cx(n - 1), rx + 18), rx + rw - 18), readerY];
        const repairs = hid.repair ? [] : read.repairs;
        const arcs = [];
        for (const id of repairs) {
          const start = rApex;
          const end = [cx(id) - 10, rChipY + chipH + 1];
          const mid = [(start[0] + end[0]) / 2, (start[1] + end[1]) / 2];
          const dx = end[0] - start[0];
          const dy = end[1] - start[1];
          const len = Math.hypot(dx, dy) || 1;
          let nx = -dy / len;
          let ny = dx / len;
          if (nx > 0) {
            nx = -nx;
            ny = -ny;
          }
          const bulge = Math.min(34, len * 0.3);
          const c = [mid[0] + nx * bulge, mid[1] + ny * bulge];
          const pts = Array.from({ length: 31 }, (_, k) => quad(start, c, end, k / 30));
          arcs.push({ id, start, c, end, pts });
          D.add('links', `<path class="link repair" d="M${r1(start[0])} ${r1(start[1])}Q${r1(c[0])} ${r1(c[1])} ${r1(end[0])} ${r1(end[1])}" marker-end="url(#arrow-repair)"/>`);
          D.link(pts, `reader R${id + 1} repair${id + 1}`);
        }
        const readDeadXs = [];
        reps.forEach((rep, i) => {
          const owner = `R${i + 1}`;
          if (!rep.reachable) {
            const top = cardY + cardH;
            const s = [cx(i), rChipY + chipH];
            D.add('links', `<path class="link dead" d="M${s[0]} ${top}V${s[1]}L${rApex[0]} ${rApex[1]}"/>`);
            D.link([...sampleLine(s[0], top, s[0], s[1]), ...sampleLine(s[0], s[1], rApex[0], rApex[1])], `reader ${owner} dead${i + 1}`);
            readDeadXs.push({ i, s });
            return;
          }
          const inSet = read.set.includes(i);
          const answer = read.answers.find((a) => a.id === i);
          const s = [cx(i), rChipY + chipH];
          D.add('links', `<line class="link read${inSet ? '' : ' weak'}" x1="${s[0]}" y1="${s[1]}" x2="${rApex[0]}" y2="${rApex[1]}"/>`);
          D.link(sampleLine(s[0], s[1], rApex[0], rApex[1]), `reader ${owner}`);
          let t = fmt(rep.readRtt);
          if (inSet && wide) t = `${hid.verdict ? '?' : 'v' + answer.value} · ${t}`;
          const cwid = Math.max(26, tw(t, 'mono') + 10);
          D.add('marks', `<rect class="chip ${inSet ? 'asked' : 'quiet'}" x="${s[0] - cwid / 2}" y="${rChipY}" width="${cwid}" height="${chipH}" rx="8"/>`);
          D.mark({ x0: s[0] - cwid / 2, x1: s[0] + cwid / 2, y0: rChipY, y1: rChipY + chipH }, owner);
          D.text(s[0], rChipY + 12, [[t, 'mono', inSet ? 'ink' : 'muted']], { anchor: 'middle', owner, textCls: 'on-chip' });
        });
        // An unreachable replica's x sits where no repair arc or other line passes.
        for (const { i, s } of readDeadXs) {
          const owner = `R${i + 1}`;
          for (const t of [0.5, 0.42, 0.58, 0.34, 0.66, 0.26, 0.74, 0.2]) {
            const p = [s[0] + (rApex[0] - s[0]) * t, s[1] + (rApex[1] - s[1]) * t];
            const box = { x0: p[0] - 6, x1: p[0] + 6, y0: p[1] - 6, y1: p[1] + 6 };
            if (D.free(box, `dead${i + 1}`, 2)) {
              xGlyph(D, r1(p[0]), r1(p[1]), owner, 4);
              break;
            }
          }
        }
        for (const a of arcs) {
          const apex = quad(a.start, a.c, a.end, 0.5);
          const left = apex[0] < (a.start[0] + a.end[0]) / 2;
          const cand = [
            [apex[0] - 6, apex[1] + 4, 'end'],
            [apex[0] + 6, apex[1] + 4, 'start'],
            [apex[0], apex[1] - 8, 'middle'],
          ];
          for (const [x, yy, anchor] of left ? cand : [cand[1], cand[0], cand[2]]) {
            const box = D.textBox(x, yy, tw('repair', 'small'), 'small', anchor);
            if (D.free(box, '')) {
              D.text(x, yy, [['repair', 'small', 'good']], { anchor, owner: `repair${a.id + 1}` });
              break;
            }
          }
        }

        // Reader box, and the R handle beside it (wide) or under the pill (narrow).
        D.add('marks', `<rect class="box" x="${rx}" y="${readerY}" width="${rw}" height="${readerH}" rx="10"/>`);
        D.mark({ x0: rx, x1: rx + rw, y0: readerY, y1: readerY + readerH }, 'reader');
        D.text(rx + 12, readerY + 20, [[readerLabel, 'label']], { owner: 'reader', textCls: 'on-card' });
        if (rx + 12 + tw(readerLabel, 'label') + 12 + tw(sentT, 'small') <= rx + rw - 12)
          D.text(rx + rw - 12, readerY + 20, [[sentT, 'small', 'muted']], { anchor: 'end', owner: 'reader', textCls: 'on-card' });
        if (read.outcome === 'fails') {
          D.text(rx + 12, readerY + 44, [[`no answer: ${read.reachable} reachable, ${read.needed} needed`, 'small', 'bad']], { owner: 'reader', textCls: 'on-card' });
        } else {
          let ccx = rx + 12;
          let ccy = readerY + 30;
          for (const a of chipList) {
            const wdt = chipW(a);
            if (ccx + wdt > rx + rw - 12) {
              ccx = rx + 12;
              ccy += 26;
            }
            const v = hid.verdict ? '?' : `v${a.value}`;
            const ccls = hid.verdict ? 'unknown' : a.value === 8 ? 'new' : 'old';
            D.add('marks', `<rect class="chip ${ccls}" x="${ccx}" y="${ccy}" width="${wdt}" height="20" rx="6"/>`);
            D.text(ccx + 7, ccy + 14, [[`R${a.id + 1}`, 'mono', 'muted'], [v, 'mono', a.value === 8 && !hid.verdict ? 'chip-new-ink' : 'muted', 5]], { owner: 'reader', textCls: 'on-chip' });
            ccx += wdt + 6;
          }
        }
        const rHandle = {
          id: 'rhandle',
          k: r,
          n,
          hid: hid.avail,
          letter: 'R',
          what: 'answers a read waits for',
          survives: m.survives.read,
          succeed: m.avail.read,
          verb: 'reads',
        };
        y = readerY + readerH;
        if (wide) handleBlock(D, { ...rHandle, x: pad, y: readerY, w: rx - 24 - pad });
        const handleBottom = readerY + 84;

        // The verdict pill: the heaviest mark.
        const pill = pillOf(m, hid);
        const pillMax = W - 2 * pad;
        let pillLines = [pill.text];
        const pillW1 = tw(pill.text, 'pill') + 44;
        if (pillW1 > pillMax) {
          const k = pill.text.lastIndexOf(' · ');
          pillLines = [pill.text.slice(0, k), pill.text.slice(k + 3)];
        }
        const pw = Math.max(...pillLines.map((l) => tw(l, 'pill'))) + 44;
        const ph = pillLines.length === 1 ? 32 : 48;
        const pillY = y + 10;
        const px = W - pad - pw;
        D.add('marks', `<rect class="pill ${pill.tone}" x="${px}" y="${pillY}" width="${pw}" height="${ph}" rx="16"/>`);
        D.mark({ x0: px, x1: px + pw, y0: pillY, y1: pillY + ph }, 'pill');
        D.add('text', glyph(pill.tone, px + 18, pillY + 16));
        pillLines.forEach((line, i) => D.text(px + 32, pillY + 21 + i * 16, [[line, 'pill', pill.tone === 'hidden' ? 'muted' : 'ink']], { owner: 'pill', textCls: 'on-chip' }));
        const pillReserve = wide ? 32 : 48;
        let readerBottom = pillY + ph;
        let readerLeft = Math.min(rx, px);
        if (both.length && !hid.count) {
          const names = both.map((i) => `R${i + 1}`);
          const t = `${names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names.at(-1) : names[0]} both acked and answered`;
          const role = tw(t, 'cap') <= W - 2 * pad ? 'cap' : 'small';
          const box = D.text(W - pad, pillY + ph + 18, [[tw(t, role) <= W - 2 * pad ? t : `${names.join(', ')} acked and answered`, role, 'good']], { anchor: 'end' });
          readerBottom = box.y1;
          readerLeft = Math.min(readerLeft, box.x0);
        }
        D.region('reader', { x: readerLeft - 4, y: readerY - 3, w: W - pad - readerLeft + 7, h: readerBottom - readerY + 7 });
        y = Math.max(pillY + pillReserve + 26, wide ? handleBottom : 0);
        if (!wide) {
          handleBlock(D, { ...rHandle, x: pad, y: y + 4, w: W - 2 * pad });
          y += 4 + 84;
        }

        // The read-set strip: the guarantee, apart from what this read happened to see.
        y += 14;
        D.add('grid', `<line class="rule" x1="${pad}" y1="${y}" x2="${W - pad}" y2="${y}"/>`);
        const stripTop = y;
        const stripLabel = `Read sets of ${r}`;
        D.text(pad, y + 26, [[stripLabel, 'label']]);
        const refused = write.outcome === 'refused' && !hid.write;
        const head = hid.count ? [`? of ${m.readSets}`, ' can miss v8'] : refused ? ['none', ' written to miss'] : [`${m.staleSets} of ${m.readSets}`, ' can miss v8'];
        const headW = tw(head[0], 'head') + tw(head[1], 'cap');
        const headInline = pad + tw(stripLabel, 'label') + 16 + headW <= W - pad;
        const headTone = hid.count || write.outcome !== 'acked' ? 'muted' : m.staleSets > 0 ? 'bad' : 'good';
        if (headInline) {
          D.text(W - pad, y + 27, [[head[0], 'head', headTone], [head[1], 'cap', 'muted']], { anchor: 'end' });
          y += 42;
        } else {
          D.text(pad, y + 50, [[head[0], 'head', headTone], [head[1], 'cap', 'muted']]);
          y += 64;
        }
        const cell = wide ? 14 : 12;
        const cgap = 2;
        const setGap = wide ? 8 : 5;
        const headCol = wide ? 28 : 0;
        const gx0 = pad + headCol;
        const gridTop = y;
        if (wide)
          for (let i = 0; i < n; i++) {
            const acked = !hid.count && m.ackedHomes.includes(i);
            D.text(pad, gridTop + i * (cell + cgap) + cell - 2, [[`R${i + 1}`, 'mono', acked ? 'good' : 'muted']]);
          }
        m.sets.forEach((s, k) => {
          const x = gx0 + k * (cell + setGap);
          for (let i = 0; i < n; i++) {
            const member = s.members.includes(i);
            const acked = member && !hid.count && m.ackedHomes.includes(i);
            D.add('marks', `<rect class="cell${member ? (acked ? ' acked' : ' member') : ''}" x="${x + 0.5}" y="${gridTop + i * (cell + cgap) + 0.5}" width="${cell - 1}" height="${cell - 1}" rx="2"/>`);
          }
          const xY = gridTop + n * (cell + cgap) + 7;
          if (s.canMiss && !hid.count && !refused) xGlyph(D, x + cell / 2, xY, `set${k}`, 3.5);
          if (s.isThis) {
            D.add('marks', `<rect class="this-ring" x="${x - 3}" y="${gridTop - 3}" width="${cell + 6}" height="${n * (cell + cgap) - cgap + 6}" rx="4"/>`);
          }
        });
        const gridW = m.sets.length * (cell + setGap) - setGap;
        const gridBottom = gridTop + n * (cell + cgap) - cgap;
        D.mark({ x0: gx0 - 3, x1: gx0 + gridW + 3, y0: gridTop - 3, y1: gridBottom + 14 }, 'strip-grid');
        // Legend under the grid.
        // Five rows get two more pixels before the legend, so N 5 sits 34px below N 3 as the first build measured.
        let ly = gridBottom + 30 + (n === 5 ? 2 : 0);
        const fullLegend = [
          ['acked', 'acked v8'],
          ['member', 'in the read set'],
          ['x', 'can miss'],
          ['ring', 'this read'],
        ];
        const legend = fullLegend.filter(([k]) => !(hid.count && (k === 'acked' || k === 'x')));
        let lx = pad;
        const legendW = wide ? 236 : W - 2 * pad;
        const legendRows = (() => {
          let rows = 1;
          let x0 = pad;
          for (const [, t] of fullLegend) {
            const iw = 12 + 5 + tw(t, 'small');
            if (x0 + iw > pad + legendW) {
              rows++;
              x0 = pad;
            }
            x0 += iw + 14;
          }
          return rows;
        })();
        const legendTop = ly;
        for (const [k, t] of legend) {
          const iw = 12 + 5 + tw(t, 'small');
          if (lx + iw > pad + legendW) {
            lx = pad;
            ly += 16;
          }
          if (k === 'acked' || k === 'member') D.add('marks', `<rect class="cell ${k}" x="${lx + 0.5}" y="${ly - 9.5}" width="10" height="10" rx="2"/>`);
          if (k === 'x') D.add('marks', `<path class="xmark" d="M${lx + 2} ${ly - 8}l7 7M${lx + 9} ${ly - 8}l-7 7"/>`);
          if (k === 'ring') D.add('marks', `<rect class="this-ring" x="${lx + 0.5}" y="${ly - 10.5}" width="10" height="12" rx="3"/>`);
          D.text(lx + 17, ly, [[t, 'small', 'muted']]);
          lx += iw + 14;
        }
        // The sentence about overlap, and the one about its limit.
        const s1 = (() => {
          if (hid.count) return `Does every read of ${r} meet the ${w} that acked?`;
          if (write.outcome === 'refused') return 'Nothing was written, so there is nothing to miss.';
          if (write.outcome === 'timed-out') {
            if (!m.h) return 'The write timed out and applied nowhere: every read returns v7.';
            const who = m.h > 2 ? `${m.h} replicas` : m.ackedHomes.map((i) => `R${i + 1}`).join(' and ');
            return m.staleSets === 0
              ? `The write timed out, yet every read of ${r} meets a replica that applied it.`
              : `The write timed out, but ${who} applied it: a read of ${r} that misses ${m.h > 1 ? 'them' : 'it'} returns v7.`;
          }
          if (m.settings.sloppy && m.h < w)
            return `A read never asks the stand-ins: only ${m.h} home replica${m.h === 1 ? '' : 's'} acked, so a read of ${r} can miss ${m.h === 1 ? 'it' : 'them'}.`;
          if (m.staleSets === 0) return `Every read of ${r} shares a replica with the ${m.h} that acked.`;
          return `${r} + ${w} is not above ${n}: a read of ${r} can miss all ${m.h} that acked.`;
        })();
        const s2 = 'Even then, R + W > N alone is not linearizable: reads racing a write can disagree, and concurrent writes settled by last-write-wins can drop one.';
        const sideX = pad + Math.max(headCol + gridW, 236) + 28;
        const side = wide && W - pad - sideX >= 220;
        ly = legendTop + (legendRows - 1) * 16;
        const sentW = side ? W - pad - sideX : W - 2 * pad;
        const l1 = wrap(s1, 'cap', sentW);
        const l2 = wrap(s2, 'cap', sentW);
        const sx0 = side ? sideX : pad;
        let sy0 = side ? gridTop + 2 : ly + 26;
        l1.forEach((line, i) => D.text(sx0, sy0 + i * 18, [[line, 'cap', 'ink']]));
        sy0 += l1.length * 18 + 4;
        l2.forEach((line, i) => D.text(sx0, sy0 + i * 18, [[line, 'cap', 'muted']]));
        const sentBottom = sy0 + l2.length * 18 - 10;
        // Reserve the most lines any overlap sentence takes at this width, so the height depends only on width and N.
        const reserveS1 = Math.max(
          ...[`Does every read of 5 meet the 5 that acked?`, `The write timed out, but 3 replicas applied it: a read of 2 that misses them returns v7.`, `A read never asks the stand-ins: only 1 home replica acked, so a read of 5 can miss it.`, `Every read of 5 shares a replica with the 5 that acked.`].map(
            (t) => wrap(t, 'cap', sentW).length,
          ),
        );
        const sentReserve = (side ? gridTop + 2 : ly + 26) + (reserveS1 * 18 + 4) + l2.length * 18 - 10;
        y = Math.max(ly + (wide ? 16 : 16) * (side ? 0 : 0), side ? Math.max(ly, sentReserve) : sentReserve) + 8;
        D.region('strip', { x: Math.max(3, pad - 8), y: stripTop + 4, w: W - 2 * Math.max(3, pad - 8), h: y - stripTop - 4 });

        // Latency, log scale 1 to 200 ms.
        y += 10;
        D.add('grid', `<line class="rule" x1="${pad}" y1="${y}" x2="${W - pad}" y2="${y}"/>`);
        const latTop = y;
        D.text(pad, y + 26, [['Latency', 'label'], ['log scale', 'small', 'muted', 8]]);
        const rowLabelW = wide ? 104 : 0;
        const px0 = pad + rowLabelW + 8;
        const px1 = W - pad - (wide ? 18 : 12);
        const lx0 = Math.log10(1);
        const span = Math.log10(200) - lx0;
        const X = (t) => r1(px0 + ((Math.log10(Math.min(200, Math.max(1, t))) - lx0) / span) * (px1 - px0));
        const L1 = wide ? y + 60 : y + 70;
        const L2 = wide ? L1 + 44 : L1 + 62;
        const axisY = L2 + (wide ? 24 : 30);
        const ticks = [1, 2, 5, 10, 20, 50, 100, 200];
        for (const t of ticks) D.add('grid', `<line class="gridline" x1="${X(t)}" y1="${L1 - (wide ? 18 : 22)}" x2="${X(t)}" y2="${axisY}"/>`);
        for (const L of [L1, L2]) D.add('grid', `<line class="lane" x1="${px0}" y1="${L}" x2="${px1}" y2="${L}"/>`);
        D.add('grid', `<line class="axis" x1="${px0}" y1="${axisY}" x2="${px1}" y2="${axisY}"/>`);
        const unitLabel = '200 ms';
        const unitLeft = X(200) + 4 - tw(unitLabel, 'small');
        let lastTick = -Infinity;
        ticks.forEach((t, i) => {
          const last = i === ticks.length - 1;
          const label = last ? unitLabel : String(t);
          const anchor = last ? 'end' : 'middle';
          const x = last ? X(t) + 4 : X(t);
          const w0 = tw(label, 'small');
          const left = anchor === 'end' ? x - w0 : x - w0 / 2;
          if (!last && (left < lastTick + 6 || left + w0 > unitLeft - 6)) return;
          D.add('grid', `<line class="axis" x1="${X(t)}" y1="${axisY}" x2="${X(t)}" y2="${axisY + 4}"/>`);
          D.text(x, axisY + 17, [[label, 'small', 'muted']], { anchor });
          lastTick = left + w0;
        });
        if (wide) {
          D.text(pad, L1 + 4, [['Write acks', 'cap', 'ink']]);
          D.text(pad, L2 + 4, [['Read answers', 'cap', 'ink']]);
        } else {
          for (const [t, L] of [['Write acks', L1], ['Read answers', L2]]) {
            D.add('grid', `<rect class="ground" x="${pad - 2}" y="${L - 36}" width="${tw(t, 'small') + 6}" height="14" rx="3"/>`);
            D.text(pad, L - 26, [[t, 'small', 'ink']], { ground: true });
          }
        }
        const placeName = (x, L, name, owner, ringed) => {
          const yy = L + (ringed ? 19 : 17);
          const box = D.textBox(x, yy, tw(name, 'small'), 'small', 'middle');
          if (!D.free(box, owner, 1)) return;
          D.add('grid', `<rect class="ground" x="${box.x0 - 2}" y="${box.y0 - 1}" width="${box.x1 - box.x0 + 4}" height="${box.y1 - box.y0 + 2}" rx="2"/>`);
          D.text(x, yy, [[name, 'small', 'muted']], { anchor: 'middle', owner, ground: true });
        };
        const placeLabel = (x, L, texts, ringR, owner, tone = 'ink') => {
          for (const t of texts) {
            const w0 = tw(t, 'smallB');
            const cands = [
              [x + ringR + 6, L + 4, 'start'],
              [x - ringR - 6, L + 4, 'end'],
              [x, L - ringR - 7, 'middle'],
              [x + ringR + 2, L - ringR - 7, 'start'],
              [x - ringR - 2, L - ringR - 7, 'end'],
            ];
            for (const [cx0, cy0, anchor] of cands) {
              const box = D.textBox(cx0, cy0, w0, 'smallB', anchor);
              if (box.x0 < px0 - (wide ? 0 : 4) || box.x1 > W - pad) continue;
              if (!D.free(box, '', 2)) continue;
              D.add('grid', `<rect class="ground" x="${box.x0 - 3}" y="${box.y0 - 2}" width="${box.x1 - box.x0 + 6}" height="${box.y1 - box.y0 + 4}" rx="3"/>`);
              D.text(cx0, cy0, [[t, 'smallB', tone]], { anchor, owner: owner + '-label', ground: true });
              return true;
            }
          }
          return false;
        };
        // Write acks.
        const dots = [];
        if (hid.write) {
          D.text(px0 + 4, L1 + 4, [['acks after your answer', 'small', 'muted']], { ground: true });
          D.add('grid', `<rect class="ground" x="${px0}" y="${L1 - 8}" width="${tw('acks after your answer', 'small') + 8}" height="14"/>`);
        } else if (write.outcome === 'refused') {
          D.add('grid', `<rect class="ground" x="${px0}" y="${L1 - 8}" width="${tw('none: the write was refused', 'small') + 8}" height="14"/>`);
          D.text(px0 + 4, L1 + 4, [['none: the write was refused', 'small', 'muted']], { ground: true });
        } else {
          for (const id of write.ackOrder) {
            const x = X(m.all[id].writeRtt);
            const stand = !m.all[id].home;
            D.add('marks', `<circle class="dot ${stand ? 'standin' : 'write'}" cx="${x}" cy="${L1}" r="4.5"/>`);
            D.mark({ x0: x - 5, x1: x + 5, y0: L1 - 5, y1: L1 + 5 }, `lat-${m.all[id].name}`);
            dots.push({ x, L: L1, name: m.all[id].name });
          }
          if (write.outcome === 'timed-out') {
            D.add('marks', `<path class="chevron" d="M${px1 - 2} ${L1 - 6}l6 6l-6 6"/>`);
            D.mark({ x0: px1 - 4, x1: px1 + 6, y0: L1 - 7, y1: L1 + 7 }, 'timeout');
            const t = `timed out at ${M.formatDuration(M.TIMEOUT_MS)}`;
            const box = D.textBox(px1 - 8, L1 + 4, tw(t, 'smallB'), 'smallB', 'end');
            if (D.free(box, 'timeout')) {
              D.add('grid', `<rect class="ground" x="${box.x0 - 3}" y="${box.y0 - 2}" width="${box.x1 - box.x0 + 6}" height="${box.y1 - box.y0 + 4}" rx="3"/>`);
              D.text(px1 - 8, L1 + 4, [[t, 'smallB', 'warn']], { anchor: 'end', owner: 'timeout', ground: true });
            } else placeLabel(px1, L1, [t, 'timed out'], 6, 'timeout', 'warn');
          } else if (!hid.writeTime) {
            const x = X(write.ms);
            dots.forEach((d) => d.L === L1 && d.name === m.all[wthId].name && (d.ringed = true));
            D.add('marks', `<circle class="ring" cx="${x}" cy="${L1}" r="8"/>`);
            D.mark({ x0: x - 9, x1: x + 9, y0: L1 - 9, y1: L1 + 9 }, `lat-${m.all[wthId].name}`);
            placeLabel(x, L1, [`acked ${fmt(write.ms)}`, fmt(write.ms)], 8, `lat-${m.all[wthId].name}`);
          }
        }
        // Read answers.
        if (read.outcome === 'fails') {
          const t = `none: ${read.reachable} reachable, ${read.needed} needed`;
          D.add('grid', `<rect class="ground" x="${px0}" y="${L2 - 8}" width="${tw(t, 'small') + 8}" height="14"/>`);
          D.text(px0 + 4, L2 + 4, [[t, 'small', 'bad']], { ground: true });
        } else {
          for (const a of read.answers) {
            const x = X(a.rtt);
            D.add('marks', `<circle class="dot read" cx="${x}" cy="${L2}" r="4.5"/>`);
            D.mark({ x0: x - 5, x1: x + 5, y0: L2 - 5, y1: L2 + 5 }, `latr-R${a.id + 1}`);
            dots.push({ x, L: L2, name: `R${a.id + 1}`, read: true });
          }
          if (!hid.verdict) {
            const x = X(read.rthMs);
            const rthId = read.answers.find((a) => a.rtt === read.rthMs).id;
            dots.forEach((d) => d.L === L2 && d.name === `R${rthId + 1}` && (d.ringed = true));
            D.add('marks', `<circle class="ring" cx="${x}" cy="${L2}" r="8"/>`);
            D.mark({ x0: x - 9, x1: x + 9, y0: L2 - 9, y1: L2 + 9 }, `latr-R${rthId + 1}`);
            const ord = M.formatOrdinal(r);
            if (repairs.length) {
              const xe = X(read.ms);
              D.add('marks', `<line class="repair-bar" x1="${x + 8}" y1="${L2}" x2="${Math.max(x + 9, xe)}" y2="${L2}"/><line class="end-tick" x1="${Math.max(x + 9, xe)}" y1="${L2 - 6}" x2="${Math.max(x + 9, xe)}" y2="${L2 + 6}"/>`);
              D.mark({ x0: x + 8, x1: Math.max(x + 9, xe) + 2, y0: L2 - 6, y1: L2 + 6 }, 'returned');
              placeLabel(Math.max(x + 9, xe), L2, [`returned ${fmt(read.ms)} (+${fmt(read.repairMs).replace(' ms', '')} repair)`, `returned ${fmt(read.ms)}`, `+${fmt(read.repairMs)} repair`], 2, 'returned', 'good');
            } else if (hid.repair) placeLabel(x, L2, [`${ord} answer ${fmt(read.rthMs)}`, fmt(read.rthMs)], 8, `latr-R${rthId + 1}`);
            else placeLabel(x, L2, [`returned ${fmt(read.ms)}`, fmt(read.ms)], 8, `latr-R${rthId + 1}`);
          }
        }
        for (const d of dots) placeName(d.x, d.L, d.name, d.read ? `latr-${d.name}` : `lat-${d.name}`, d.ringed);
        y = axisY + 24;
        D.region('latency', { x: Math.max(3, pad - 8), y: latTop + 4, w: W - 2 * Math.max(3, pad - 8), h: y - latTop - 4 });
        const H = Math.ceil(y + 4);

        D.label = summary(m, hid);
        return { D, H };
      }

      // ---------- The stage's one-sentence description, which hides what the open question hides.
      function summary(m, hid) {
        const { n, w, r } = m.settings;
        const parts = [`${n} replicas, W ${M.levelName(w, n) ?? w}, R ${M.levelName(r, n) ?? r}.`];
        if (hid.write) parts.push('The write is sent; its outcome shows after your answer.');
        else if (m.write.outcome === 'acked') parts.push(`The write is acked${hid.writeTime ? '' : ` in ${fmt(m.write.ms)}`} by ${m.write.acked.map((id) => m.all[id].name).join(' and ')}.`);
        else if (m.write.outcome === 'refused') parts.push(`The write is refused: ${m.write.live} live, ${m.write.needed} needed.`);
        else parts.push('The write times out.');
        if (hid.verdict) parts.push('What the read returns shows after your answer.');
        else parts.push(pillOf(m, hid).text + '.');
        if (!hid.count) parts.push(`${m.staleSets} of ${m.readSets} read sets can miss v8.`);
        return parts.join(' ');
      }

      // ---------- Focus outlines with their "Look here" tag on the first free place.
      function focusOutlines(D, ids, H) {
        const TAG = { w: 72, h: 16 };
        for (const id of ids) {
          for (const b of D.regions[id] ?? []) {
            const x = Math.max(3, b.x);
            const y0 = Math.max(3, b.y);
            const w = Math.min(D.W - 3, b.x + b.w) - x;
            const h = Math.min(H - 3, b.y + b.h) - y0;
            D.add('top', `<rect class="focus-outline" x="${x}" y="${y0}" width="${w}" height="${h}" rx="10"/>`);
            // Frame edges first (16px off the corners), then just inside, then the gutter outside.
            const across = [];
            for (let ax = x + w - TAG.w - 16; ax >= x + 16; ax -= 8) across.push(ax);
            const xs = [x + w - TAG.w - 16, x + 16, ...across];
            const ys = [y0 - TAG.h / 2, y0 + h - TAG.h / 2, y0 + 4, y0 + h - TAG.h - 4, y0 - TAG.h - 2, y0 + h + 2];
            const cands = ys.flatMap((ty) => xs.map((tx) => [tx, ty]));
            for (const ty of [y0 + 4, y0 + h / 2 - TAG.h / 2]) cands.push([x + w + 4, ty], [x - TAG.w - 4, ty]);
            let placed = false;
            for (const [tx, ty] of cands) {
              {
                const box = { x0: tx, x1: tx + TAG.w, y0: ty, y1: ty + TAG.h };
                if (tx < 3 || tx + TAG.w > D.W - 3 || ty < 3 || ty + TAG.h > H - 3) continue;
                if (!D.free(box, '', 1)) continue;
                D.add('top', `<rect class="tag" x="${tx}" y="${ty}" width="${TAG.w}" height="${TAG.h}" rx="8"/>`);
                D.add('top', `<text x="${tx + TAG.w / 2}" y="${ty + 12}" text-anchor="middle" data-owner="look" data-ground="1"><tspan class="t-look">LOOK HERE</tspan></text>`);
                D.mark(box, 'look');
                placed = true;
                break;
              }
              if (placed) break;
            }
            if (!placed) D.missingTags = (D.missingTags ?? 0) + 1;
          }
        }
      }

      // ---------- Mockup states.
      const UP = (n) => Array(n).fill('up');
      const STATES = {
        default: { s: M.BASE },
        stale: { s: { ...M.BASE, w: 1, r: 1 } },
        down: { s: { ...M.BASE, states: ['up', 'up', 'down'] }, hint: 2 },
        refused: { s: { ...M.BASE, w: 3, r: 1, states: ['up', 'up', 'down'] } },
        timeout: { s: { ...M.BASE, w: 3, r: 2, states: ['up', 'up', 'mid'] } },
        sloppy: { s: { ...M.BASE, states: ['up', 'back', 'back'], sloppy: 1 } },
        slow: { s: { n: 5, w: 3, r: 3, states: UP(5), stall: 1, sloppy: 0 } },
        ask: { exp: 4, phase: 'asking' },
        reveal: { exp: 0, phase: 'revealed', chosen: 1 },
        challenge: { exp: 5, phase: 'challenge', s: { n: 5, w: 4, r: 2, states: UP(5), stall: 1, sloppy: 0 } },
      };
      function viewOf(name) {
        const st = STATES[name] ?? STATES.default;
        const expParam = params.get('exp');
        const expIdx = expParam !== null && st.exp !== undefined ? Number(expParam) - 1 : st.exp;
        if (expIdx === undefined) return { s: st.s, hide: [], exp: null, phase: 'rest', hint: st.hint };
        const spec = M.EXPERIMENTS[expIdx];
        const e = M.renderExperiment(spec);
        const isChallenge = !!spec.goal;
        const phase = isChallenge ? 'challenge' : st.phase;
        const s = isChallenge ? (name === 'challenge' && expParam === null ? st.s : spec.setup) : spec.setup;
        return {
          s,
          hide: phase === 'asking' ? spec.hide : [],
          exp: e,
          spec,
          phase,
          chosen: st.chosen ?? (e.answer === 0 ? 1 : 0),
          focus: phase === 'revealed' || (isChallenge && M.goalMet(spec.goal, { ...s }, M.run(s).metrics)) ? spec.focus : [],
        };
      }

      // ---------- The page around the stage.
      function controlsHtml(m, view) {
        const { n } = m.settings;
        const locked = view.phase === 'asking';
        const stallName = `R${M.stalledIndex(n) + 1} pauses`;
        return `<fieldset class="group n-control"${locked ? ' disabled' : ''}><legend class="control-label">Replicas (N)</legend><div class="segments">
${[3, 5].map((k) => `<label class="segment"><input type="radio" name="n" ${k === n ? 'checked' : ''}/><span>${k} replicas</span></label>`).join('')}</div></fieldset>
<fieldset class="group"${locked ? ' disabled' : ''}><legend class="control-label">Conditions</legend><div class="toggles">
<label class="segment"><input type="checkbox" ${m.settings.stall ? 'checked' : ''}/><span>${stallName}<small>${fmt(M.STALL_MS)} GC pause</small></span></label>
<label class="segment"><input type="checkbox" ${m.settings.sloppy ? 'checked' : ''}/><span>Sloppy quorum<small>stand-ins H1, H2</small></span></label></div></fieldset>
<p class="notice" aria-live="polite">${locked ? 'The settings this question is about are locked until you answer.' : 'Tap a replica to change its state; drag W and R on the drawing.'}</p>`;
      }
      const ICON_RIGHT = '<svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--g-success-line)"/><path d="M6 10.2l2.6 2.6 5.2-5.6" fill="none" stroke="var(--g-surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const ICON_WRONG = '<svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--g-danger)"/><path d="M7 7l6 6M13 7l-6 6" fill="none" stroke="var(--g-surface)" stroke-width="2" stroke-linecap="round"/></svg>';
      function dockHtml(m, view) {
        const e = view.exp;
        if (!e) return '';
        if (view.phase === 'challenge') {
          const met = M.goalMet(view.spec.goal, m.settings.stall !== undefined ? { ...view.s } : view.s, m.metrics);
          const status = M.goalStatus(m);
          const oks = [m.metrics.canMiss < 1, m.metrics.readMs < 5, m.metrics.writeMs < 50, m.survives.write >= 1];
          return `<p class="legend">${esc(e.ask)}</p><ul class="status" role="status">${status
            .map((s, i) => `<li class="${oks[i] ? 'met' : ''}"><span class="state">${oks[i] ? '✓' : '·'}</span><span>${esc(s)}</span></li>`)
            .join('')}</ul>${met ? `<p class="reveal">${esc(e.reveal)}</p>` : ''}`;
        }
        if (view.phase === 'asking') {
          return `<fieldset style="border:0;padding:0;margin:0"><legend class="legend">${esc(e.ask)}</legend><div class="options">${e.choices.map((c) => `<button class="g-choice">${esc(c)}</button>`).join('')}</div></fieldset>`;
        }
        return `<p class="legend">${esc(e.ask)}</p><ul class="options">${e.choices
          .map((c, i) => {
            const right = i === e.answer;
            const wrong = i === view.chosen && !right;
            return `<li class="g-choice${right ? ' right' : wrong ? ' wrong' : ''}"><span>${esc(c)}</span>${right ? ICON_RIGHT : wrong ? ICON_WRONG : ''}</li>`;
          })
          .join('')}</ul><p class="reveal" aria-live="polite">${esc(e.reveal)}</p>`;
      }
      function cardsHtml(view) {
        return `<h3 class="heading"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg>Experiments</h3>
<ol class="cards">${M.EXPERIMENTS.map(
          (s, i) =>
            `<li><button class="card-btn"${view.exp && view.exp.id === s.id ? ' aria-current="step"' : ''}><span class="num">${s.goal ? '⚑' : i + 1}</span><span>${esc(M.fillTemplate(s.title, {}))}</span></button></li>`,
        ).join('')}</ol>`;
      }
      function describeHtml(m, open, compact) {
        const btn = `<button class="g-btn" aria-expanded="${open}">${open ? 'Hide the description' : 'Describe'}</button>`;
        if (!open) return btn;
        const head = compact ? ['Rep.', 'State', 'Write rtt', 'Has v8 at', 'Read at', 'Got'] : ['Replica', 'State', 'Write round trip', 'Has v8 at', 'Read reaches it', 'Answered'];
        const rows = m.replicas.map((x) => {
          const a = m.read.answers.find((q) => q.id === x.id);
          const has = m.write.applied.includes(x.id) ? fmt(x.landAt) : '–';
          const name = compact ? x.name : `${x.name} (zone ${x.zone})`;
          const state = compact ? { up: 'up', down: 'down', mid: 'stopped', back: 'back' }[x.state] : M.STATE_NAMES[x.state];
          const answered = a ? `v${a.value}${m.read.repairs.includes(x.id) ? (compact ? ', fixed' : ', repaired') : ''}` : '–';
          return [name, state, x.knownDown ? '–' : fmt(x.writeRtt), has, a ? fmt(a.readAt) : '–', answered];
        });
        return `${btn}<div class="table-box${compact ? ' compact' : ''}" tabindex="0" role="region" aria-label="Each replica in this scenario"><table><thead><tr>${head.map((h) => `<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows
          .map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`)
          .join('')}</tbody></table></div>`;
      }

      function overlaysHtml(D, view, W) {
        return D.hits
          .map((h) => {
            if (h.kind === 'play')
              return `<button class="play hit" data-owner="play" style="left:${h.x}px;top:${h.y}px" aria-label="Play the write, then the read"${view.phase === 'asking' ? ' disabled' : ''}><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16"/><path d="M14 11v14l11-7z"/></svg></button>`;
            if (h.kind === 'card') return `<button class="card-hit hit" data-owner="${h.owner}" style="left:${h.x}px;top:${h.y}px;width:${h.w}px;height:${h.h}px" aria-label="${esc(h.label)}"></button>`;
            return `<div class="handle hit" role="slider" tabindex="0" data-owner="${h.owner}" aria-label="${esc(h.label)}" style="left:${h.x}px;top:${h.y}px"><span class="knob"></span></div>`;
          })
          .join('');
      }

      function render(name) {
        const view = viewOf(name);
        const m = M.run(view.s);
        const root = document.getElementById('widget');
        const wideCols = window.innerWidth >= 1000;
        root.innerHTML = `<div class="controls">${controlsHtml(m, view)}</div>
<div class="main"><div class="stage" role="group" aria-roledescription="visualization" aria-label="Consistency and quorums: one write, then one read"><div class="well" id="well"></div></div>
<div class="describe">${describeHtml(m, params.get('describe') === '1', window.innerWidth < 560)}</div></div>
<div class="experiments"><section class="dock" aria-label="Experiment">${dockHtml(m, view)}</section>${cardsHtml(view)}</div>`;
        const well = document.getElementById('well');
        const W = well.clientWidth;
        const { D, H } = buildStage(W, m, view);
        if (view.focus?.length) focusOutlines(D, view.focus, H);
        well.style.height = H + 'px';
        well.innerHTML = D.svg(H) + overlaysHtml(D, view, W);
        if (view.hint !== undefined) {
          const h = D.hits.find((x) => x.owner === `R${view.hint + 1}`);
          const st = m.replicas[view.hint].state;
          const tip = document.createElement('div');
          tip.className = 'hint';
          tip.dataset.transient = '1';
          tip.textContent = `Tap: ${NEXT_PHRASE[NEXT[st]].replace('it', `R${view.hint + 1}`)}`;
          well.appendChild(tip);
          const tw0 = tip.offsetWidth;
          const th = tip.offsetHeight;
          const left = Math.max(4, Math.min(W - tw0 - 4, h.x + h.w / 2 - tw0 / 2));
          const covers = (top) => D.texts.some((t) => !(t.x1 <= left || t.x0 >= left + tw0 || t.y1 <= top || t.y0 >= top + th));
          const above = h.y - th - 26;
          tip.style.left = left + 'px';
          tip.style.top = (covers(above) ? h.y + h.h + 26 : above) + 'px';
          well.querySelector(`.card-hit[data-owner="R${view.hint + 1}"]`).style.outline = 'var(--g-focus-ring)';
          well.querySelector(`.card-hit[data-owner="R${view.hint + 1}"]`).style.outlineOffset = '3px';
        }
        window.__stage = { W, H, missingTags: D.missingTags ?? 0, summary: D.label };
        return { W, H };
      }

      // ---------- Collisions, measured from the rendered DOM: text on text, lines and marks through text, off-stage,
      // and hit boxes on hit boxes.
      function collisions(well) {
        const svg = well.querySelector('svg.draw');
        const W = Number(svg.getAttribute('width'));
        const H = Number(svg.getAttribute('height'));
        const owners = (el) => (el.dataset?.owner ?? el.getAttribute?.('data-owner') ?? '').split(' ').filter(Boolean);
        const share = (a, b) => a.some((t) => b.includes(t));
        const texts = [...svg.querySelectorAll('text')].map((t) => {
          const b = t.getBBox();
          return { s: t.textContent, owner: owners(t), ground: t.hasAttribute('data-ground'), x0: b.x + 0.5, x1: b.x + b.width - 0.5, y0: b.y + b.height * 0.2, y1: b.y + b.height * 0.95 };
        });
        const out = [];
        const ov = (a, b, m = 0) => Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0) > m && Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0) > m;
        for (let i = 0; i < texts.length; i++) {
          const a = texts[i];
          if (a.x0 < -0.5 || a.x1 > W + 0.5 || a.y0 < 0 || a.y1 > H) out.push(`off-stage: "${a.s}"`);
          for (let j = i + 1; j < texts.length; j++) if (ov(a, texts[j], 0.5)) out.push(`text on text: "${a.s}" / "${texts[j].s}"`);
        }
        const inside = (p, t) => p.x > t.x0 + 0.5 && p.x < t.x1 - 0.5 && p.y > t.y0 + 0.5 && p.y < t.y1 - 0.5;
        for (const el of svg.querySelectorAll('.link, .gridline, .lane, .axis, .rule')) {
          const grid = !el.classList.contains('link');
          const o = owners(el);
          const pts = [];
          if (el.tagName === 'line') {
            const [x1, y1, x2, y2] = ['x1', 'y1', 'x2', 'y2'].map((a) => Number(el.getAttribute(a)));
            for (const [x, y] of sampleLine(x1, y1, x2, y2, 2)) pts.push({ x, y });
          } else {
            const len = el.getTotalLength();
            for (let d = 0; d <= len; d += 2) pts.push(el.getPointAtLength(d));
          }
          for (const t of texts) {
            if (grid && t.ground) continue;
            if (pts.some((p) => inside(p, t))) out.push(`${grid ? 'grid' : 'line'} through "${t.s}"`);
          }
          if (!grid)
            for (const mk of svg.querySelectorAll('[data-mark]')) {
              if (share(o, owners(mk))) continue;
              const b = mk.getBBox();
              if (pts.some((p) => p.x > b.x + 1 && p.x < b.x + b.width - 1 && p.y > b.y + 1 && p.y < b.y + b.height - 1)) out.push(`line through mark ${mk.getAttribute('data-mark')}`);
            }
        }
        for (const mk of svg.querySelectorAll('[data-mark]')) {
          const b = mk.getBBox();
          const box = { x0: b.x, x1: b.x + b.width, y0: b.y, y1: b.y + b.height };
          for (const t of texts) if (!share(t.owner, owners(mk)) && ov(box, t, 0.5)) out.push(`text on mark ${mk.getAttribute('data-mark')}: "${t.s}"`);
        }
        const wb = well.getBoundingClientRect();
        const hits = [...well.querySelectorAll('.hit')].map((h) => {
          const b = h.getBoundingClientRect();
          return { o: h.dataset.owner, x0: b.left - wb.left - 1, x1: b.right - wb.left - 1, y0: b.top - wb.top - 1, y1: b.bottom - wb.top - 1 };
        });
        for (let i = 0; i < hits.length; i++) {
          const a = hits[i];
          if (a.x0 < -0.5 || a.x1 > W + 0.5 || a.y0 < -0.5 || a.y1 > H + 0.5) out.push(`hit box off-stage: ${a.o}`);
          for (let j = i + 1; j < hits.length; j++) if (ov(a, hits[j], 0)) out.push(`hit on hit: ${a.o} / ${hits[j].o}`);
        }
        return out;
      }

      // Marks for the checker: rendered rects and circles that carry text owners get a data-mark from the layout's list.
      function tagMarks(well, D) {
        const svg = well.querySelector('svg.draw');
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('opacity', '0');
        for (const mk of D.marks) {
          const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          r.setAttribute('x', mk.x0);
          r.setAttribute('y', mk.y0);
          r.setAttribute('width', Math.max(0.1, mk.x1 - mk.x0));
          r.setAttribute('height', Math.max(0.1, mk.y1 - mk.y0));
          r.setAttribute('data-mark', mk.owner || 'mark');
          r.setAttribute('data-owner', mk.owner || 'mark');
          g.appendChild(r);
        }
        svg.appendChild(g);
      }

      // Owners for rendered links, taken from the layout's list in order.
      function ownLinks(well, D) {
        const els = [...well.querySelectorAll('svg.draw .link')];
        const owned = D.links.slice();
        els.forEach((el) => {
          if (el.classList.contains('legend-line')) return;
          const l = owned.shift();
          if (l) el.setAttribute('data-owner', l.owner);
        });
      }

      function renderChecked(name) {
        const view = viewOf(name);
        const m = M.run(view.s);
        render(name);
        const well = document.getElementById('well');
        const { D } = buildStage(well.clientWidth, m, view);
        if (view.focus?.length) focusOutlines(D, view.focus, window.__stage.H);
        tagMarks(well, D);
        ownLinks(well, D);
        const out = collisions(well);
        if (D.missingTags) out.push(`${D.missingTags} focus tag(s) without a place`);
        well.querySelectorAll('[data-mark]').forEach((e) => e.parentNode.remove());
        return out;
      }

      // A sweep over settings and widths, drawing only the stage, for the layout's own check.
      window.sweep = function (widths, settingsList) {
        const well = document.getElementById('well');
        const results = { renders: 0, failures: [] };
        for (const W of widths) {
          well.style.width = W + 2 + 'px';
          for (const s of settingsList) {
            const m = M.run(s);
            for (const view of [{ hide: [], phase: 'rest' }]) {
              const { D, H } = buildStage(W, m, view);
              well.style.height = H + 'px';
              well.innerHTML = D.svg(H) + overlaysHtml(D, view, W);
              tagMarks(well, D);
              ownLinks(well, D);
              const out = collisions(well);
              results.renders++;
              if (out.length) results.failures.push({ W, s: `N${s.n} W${s.w} R${s.r} ${s.states.join('/')} stall${s.stall} sloppy${s.sloppy}`, out: out.slice(0, 4) });
            }
          }
        }
        well.style.width = '';
        return results;
      };
      window.sweepExperiments = function (widths) {
        const well = document.getElementById('well');
        const results = { renders: 0, failures: [] };
        for (const W of widths) {
          well.style.width = W + 2 + 'px';
          M.EXPERIMENTS.forEach((spec, k) => {
            for (const phase of ['asking', 'revealed']) {
              const s = spec.goal ? { ...spec.setup, ...spec.solution, states: UP(spec.solution.n) } : spec.setup;
              const m = M.run(s);
              const view = { hide: phase === 'asking' ? spec.hide : [], phase, focus: phase === 'revealed' ? spec.focus : [] };
              const { D, H } = buildStage(W, m, view);
              if (view.focus.length) focusOutlines(D, view.focus, H);
              well.style.height = H + 'px';
              well.innerHTML = D.svg(H) + overlaysHtml(D, view, W);
              tagMarks(well, D);
              ownLinks(well, D);
              const out = collisions(well);
              if (D.missingTags) out.push(`${D.missingTags} focus tag(s) without a place`);
              results.renders++;
              if (out.length) results.failures.push({ W, exp: k + 1, phase, out: out.slice(0, 4) });
            }
          });
        }
        well.style.width = '';
        return results;
      };
      window.heights = function (widths) {
        const well = document.getElementById('well');
        const out = {};
        for (const W of widths)
          for (const n of [3, 5]) {
            const hs = new Set();
            for (const s of [
              { ...M.BASE, n, w: 1, r: 1, states: UP(n) },
              { ...M.BASE, n, w: n, r: n, states: UP(n), sloppy: 1 },
              { ...M.BASE, n, w: n, r: 1, states: ['up', 'mid', ...UP(n - 2)] },
              { ...M.BASE, n, w: 2, r: n, states: ['down', 'back', ...UP(n - 2)], sloppy: 1, stall: 1 },
            ])
              hs.add(buildStage(W, M.run(s), { hide: [], phase: 'rest' }).H);
            out[`${W}/N${n}`] = [...hs];
          }
        return out;
      };

      const stateName = params.get('state') ?? 'default';
      Promise.all([
        document.fonts.load('600 11px "Inter Variable"'),
        document.fonts.load('500 13px "Inter Variable"'),
        document.fonts.load('700 11px "Inter Variable"'),
        document.fonts.load('600 11px "JetBrains Mono Variable"'),
      ]).then(() => {
        const issues = renderChecked(stateName);
        render(stateName);
        window.__collisions = issues;
        document.body.dataset.ready = '1';
      });
    </script>
  </body>
</html>
