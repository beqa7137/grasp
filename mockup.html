                const wdt = tw(t, 'mono');
                const mid = Math.min(Math.max((g.x0 + g.x1) / 2, sx0 + wdt / 2), sx0 + stripW - wdt / 2);
                const fitsArc = wdt <= g.x1 - g.x0 - 6;
                const letterFits = tw(m, 'mono') <= Math.max(g.x1 - g.x0 + 4, 8) && mid - wdt / 2 - last >= 6;
                if (!letterFits) continue;
                if (!fitsArc && k < 2) return null;
                if (mid - wdt / 2 - last < 6) return null;
                out.push([m, t, mid]);
                last = mid + wdt / 2;
              }
              return out;
            };
            const row = layout(0) ?? layout(1) ?? layout(2) ?? [];
            for (const [m, t, mid] of row) D.text(mid, bandY + 20, t, { role: 'mono', anchor: 'middle', owner: 'pt', id: `arc-${m}`, data: ' data-xtick="1"' });
          }
          // The row of point names is occupied as a whole, so no tag is placed among the names.
          D.mark({ x0: sx0, x1: sx0 + stripW, y0: bandY + 10, y1: bandY + 23 }, 'pt');
          // Keys in the window, each over its hash. The followed key takes the first lane under its caret; keys that
          // would touch it stack above.
          const ids = [...Array.from({ length: K }, (_, i) => i), ...hotIds].filter((i) => (whole ? i === M.FOLLOW : inWin(posOf(i))));
          const stack = stripStack(ids.map((i) => [i, X(posOf(i)) - sx0]), lr, M.FOLLOW);
          const laneY = (lane) => bandY - 13.5 - lr - lane * (2 * lr + 1);
          for (const i of ids) {
            const x = X(posOf(i));
            const yy = laneY(stack.lane.get(i));
            const hot = i >= K;
            const moved = !hot && showMoved && landedKey(i);
            D.add('dots', `<circle class="dot ${hot ? 'hot' : `key ${nodeCls(ownerNow(i))}${moved ? ' moved' : ''}`}" data-id="l${i}" data-owner="lens-keys" cx="${r1(x)}" cy="${r1(yy)}" r="${moved ? lr - 0.5 : lr}"${moved ? ' data-moved="1"' : ''}/>`);
          }
          // The followed key: an ink ring, a caret over its column, and its walk clockwise to the point that owns it.
          const fx = X(fa);
          const fy = laneY(0);
          D.add('dots', `<circle class="follow-ring" data-owner="follow2" cx="${r1(fx)}" cy="${r1(fy)}" r="${r1(lr + 1.6)}"/>`);
          const topLane = Math.max(0, ...ids.filter((i) => Math.abs(X(posOf(i)) - fx) < 2 * lr + 1).map((i) => stack.lane.get(i)));
          const cyTop = laneY(topLane) - lr - 2.5;
          D.add('marks', `<path class="caret" data-owner="follow2" data-x="${r1(fx)}" d="M${r1(fx)} ${r1(cyTop)}l-4 -7h8z"/>`);
          D.meta.strip = { fx, fy, r: lr, bandY };
          const wn = tw(follow, 'mono');
          // Its name sits on the caret, or over any taller column of keys the name would cross.
          const nx = Math.min(Math.max(fx, sx0 + wn / 2), sx0 + stripW - wn / 2);
          const under = ids.filter((i) => Math.abs(X(posOf(i)) - nx) < wn / 2 + lr + 1).map((i) => stack.lane.get(i));
          const dotsTop = laneY(Math.max(0, ...under)) - lr;
          D.text(nx, Math.min(cyTop - 11, dotsTop - 5), follow, { role: 'mono', anchor: 'middle', owner: 'follow2' });
          if (!hid.rule) {
            const owner = M.pointFor(lensPlaced.ring, M.KEY_AT[M.FOLLOW]);
            const orp = rel(owner.at / M.TURN, win.start);
            const inside = win.f >= 1 ? owner.at >= M.KEY_AT[M.FOLLOW] : orp < win.f && orp >= rel(fa, win.start);
            const ex = inside ? X(owner.at / M.TURN) : sx0 + stripW;
            // The walk runs under the dots, between them and the band, from the followed dot to its point.
            const wy = bandY - 8;
            if (ex - fx > 6) D.add('top', `<path class="walk" data-owner="walk" data-x0="${r1(fx)}" d="M${r1(fx)} ${r1(fy + lr + 2)}V${wy}H${r1(ex - 1.5)}M${r1(ex - 4.5)} ${wy - 2.5}l3 2.5l-3 2.5"/>`);
          }
        } else {
          // hash mod N: the keys nearest the followed key by hash, each with its remainder and the node it picks. A
          // play fills the table on its clock: the new modulus's rows come with the new points, a column's new cells
          // when the hand passes that key's hash, its hollow mark when the key lands.
          const byHash = Array.from({ length: K }, (_, i) => i).sort((a, b) => M.KEY_AT[a] - M.KEY_AT[b]);
          const at = byHash.indexOf(M.FOLLOW);
          const half = (nMod - 1) / 2;
          const shown = Array.from({ length: nMod }, (_, k) => byHash[(at - half + k + K) % K]);
          const nNow = sc.now.members.length;
          const pre = live && !frame.pointsIn;
          const before = c && !hid.moved && !pre ? c.before : null;
          const passed = (i) => !live || frame.frac >= M.takeoff(i);
          const landedHere = (i) => !live || !movedSet.has(i) || frame.state.get(i).st === 'dst';
          const modNow = hid.rule || pre ? (c ? c.before.members.length : nNow) : nNow;
          const ownerOf = (i) => (hid.rule || pre ? (c ? c.before.owners[i] : sc.now.owners[i]) : sc.now.owners[i]);
          // Narrow columns take short row heads ("mod 4", "was", "now") and ids in the small face.
          const tight = (stripW - gwM) / nMod < 24;
          const modHead = (n) => (tight ? `mod ${n}` : `hash mod ${n}`);
          const idRole = tight ? 'small' : 'mono';
          const rowsM = [
            ['user:', (i) => String(i), idRole, ''],
            ...(before ? [[modHead(before.members.length), (i) => String(M.KEY_AT[i] % before.members.length), idRole, 'muted'], [tight ? 'was' : 'was on', (i) => before.owners[i], idRole, 'muted']] : []),
            [modHead(modNow), (i) => (before && !passed(i) ? '…' : String(M.KEY_AT[i] % modNow)), idRole, ''],
            [before ? (tight ? 'now' : 'now on') : 'node', (i) => (before && !passed(i) ? '…' : ownerOf(i)), 'nameS', ''],
          ];
          const gwT = tight ? Math.max(...['mod 6', 'user:', 'node'].map((t) => tw(t, 'small'))) + 8 : gwM;
          const cw = (stripW - gwT) / nMod;
          const nodeRole = cw >= 30 ? 'nameS' : 'mono';
          D.meta.table = [];
          rowsM.forEach(([head, cell, role, cls], k) => {
            const ty = stripTop + 14 + 17 * k;
            D.text(sx0 + gwT - 8, ty, head, { role: 'small', anchor: 'end', owner: `m${k}` });
            shown.forEach((i, j) => {
              const x = sx0 + gwT + (j + 0.5) * cw;
              const last = k === rowsM.length - 1;
              const v = cell(i);
              const pending = v === '…';
              const moved = last && before && !pending && before.owners[i] !== sc.now.owners[i] && landedHere(i);
              if (last && !pending) {
                D.add('marks', `<circle class="key ${nodeCls(v)}${moved ? ' moved' : ''}" data-owner="table" data-col="${i}"${moved ? ' data-moved="1"' : ''} cx="${r1(x - 7)}" cy="${ty - 4}" r="${moved ? 2.5 : 3}"/>`);
                D.text(x + 3, ty, v, { role: nodeRole, anchor: 'middle', owner: `m${k}`, cls, id: i === M.FOLLOW ? 'mod-node' : undefined, data: ` data-col="${i}"` });
              } else D.text(x, ty, v, { role: last && pending ? 'mono' : role, anchor: 'middle', owner: `m${k}`, cls: i === M.FOLLOW && k === 0 ? 'ink' : pending ? 'muted' : cls, data: pending ? ` data-pending="${i}"` : '' });
              if (last) D.meta.table.push({ key: i, pending, moved });
            });
          });
          const fj = shown.indexOf(M.FOLLOW);
          const fx = sx0 + gwT + (fj + 0.5) * cw;
          D.add('back', `<rect class="follow-col" x="${r1(fx - cw / 2 + 1)}" y="${stripTop + 1}" width="${r1(cw - 2)}" height="${17 * rowsM.length + 4}" rx="6"/>`);
        }
        D.region('lens', { x: pad - 4, y: lY - 4, w: inner + 8, h: lensH + 6 });
        // The stage's height depends only on its width: the most lines the blocks above can take, the spare at the foot.
        const H = Math.round(vY + (58 + 18 * res.verdict - 2) + 12 + 12 + (lensH - 18 * ruleLines.length + 18 * res.rule) + 10);
        D.label = summaryOf(sc, hid, view);
        return { D, H };
      }

      /** The stage's accessible summary, under the same hiding as its marks. */
      function summaryOf(sc, hid, view) {
        if (hid.after) return `${M.summary(M.scenario(view.spec.setup))} The answer is playing; its counts show at the reveal.`;
        if (hid.ghost) return M.summary(M.scenario(sc.settings));
        return M.summary(sc);
      }

      // ---------- Focus outlines with the house "Look here" tag (stroke only, solid: dashes mean hidden and nothing else).
      function focusOutlines(D, ids, H) {
        const TAG = { w: 72, h: 16 };
        for (const id of ids) {
          for (const b of D.regions[id] ?? []) {
            const inside = new Set(
              D.texts.filter((t) => {
                const cx = (t.x0 + t.x1) / 2;
                const cy = (t.y0 + t.y1) / 2;
                return t.owner !== 'look' && cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h;
              }),
            );
            const grow = (a, t, d) => ({ x0: Math.min(a.x0, t.x0 - d), y0: Math.min(a.y0, t.y0 - d), x1: Math.max(a.x1, t.x1 + d), y1: Math.max(a.y1, t.y1 + d) });
            let box = { x0: b.x, y0: b.y, x1: b.x + b.w, y1: b.y + b.h };
            for (const t of inside) box = grow(box, t, 6);
            const x = Math.max(3, box.x0);
            const yy = Math.max(3, box.y0);
            const w = Math.min(D.W - 3, box.x1) - x;
            const h = Math.min(H - 3, box.y1) - yy;
            D.add('top', `<rect class="focus-outline" data-focus="${id}" x="${r1(x)}" y="${r1(yy)}" width="${r1(w)}" height="${r1(h)}" rx="10"/>`);
            const across = [];
            for (let ax = x + w - TAG.w - 16; ax >= x + 16; ax -= 8) across.push(ax);
            const xs = [x + w - TAG.w - 16, x + 16, ...across];
            const ys = [yy - TAG.h / 2, yy + h - TAG.h / 2, yy + 4, yy + h - TAG.h - 4, yy + 24, yy + 44, yy - TAG.h - 2, yy + h + 2];
            let placed = false;
            for (const [tx, ty] of ys.flatMap((t) => xs.map((sx) => [sx, t]))) {
              const tb = { x0: tx, x1: tx + TAG.w, y0: ty, y1: ty + TAG.h };
              if (tx < 3 || tx + TAG.w > D.W - 3 || ty < 3 || ty + TAG.h > H - 3) continue;
              if (!D.free(tb, 'pile-area', 1)) continue;
              if ((D.meta.dotBoxes ?? []).some((d) => !(d.x1 <= tb.x0 || d.x0 >= tb.x1 || d.y1 <= tb.y0 || d.y0 >= tb.y1))) continue;
              D.add('top', `<rect class="tag" x="${r1(tx)}" y="${r1(ty)}" width="${TAG.w}" height="${TAG.h}" rx="8"/>`);
              D.add('top', `<text x="${r1(tx + TAG.w / 2)}" y="${r1(ty + 12)}" text-anchor="middle" data-owner="look" data-ground="1"><tspan class="t-look">LOOK HERE</tspan></text>`);
              D.mark(tb, 'look');
              placed = true;
              break;
            }
            if (!placed) D.missingTags = (D.missingTags ?? 0) + 1;
          }
        }
      }

      // ---------- Mockup states.
      const B = M.BASE;
      const ABCD = M.NAMES.slice(0, 4);
      const STATES = {
        default: { s: B },
        one: { s: { ...B, points: 1 } },
        ten: { s: { ...B, points: 10 } },
        mod: { s: M.SETUP.mod },
        joined: { s: { ...B, nodes: 5 }, from: ABCD },
        onejoined: { s: { ...B, points: 1, nodes: 5 }, from: ABCD },
        modjoined: { s: { ...M.SETUP.mod, nodes: 5 }, from: ABCD },
        left: { s: { ...B, nodes: 3 }, from: ABCD },
        down: { s: { ...B, down: 1 } },
        onedown: { s: { ...B, points: 1, down: 1 } },
        moddown: { s: { ...M.SETUP.mod, down: 1 } },
        hot: { s: M.SETUP.hot },
        hotsix: { s: { ...M.SETUP.hot, nodes: 6 }, from: ABCD },
        split: { s: { ...M.SETUP.hot, split: 1 } },
        hotdown: { s: { ...M.SETUP.hot, down: 1 } },
        six: { s: { ...B, nodes: 6 } },
        tallest: { s: { scheme: 0, points: 1, nodes: 3, hot: 1, split: 0, down: 1 } },
        playing: { s: { ...B, nodes: 5 }, from: ABCD, frac: 0.55 },
        modplaying: { s: { ...M.SETUP.mod, nodes: 5 }, from: ABCD, frac: 0.55 },
        replaying: { s: { ...B, points: 1 }, replace: { points: 100 }, frac: 0.55 },
        describe: { s: { ...B, nodes: 5 }, from: ABCD, describe: true },
        reduced: { s: { ...B, nodes: 5 }, from: ABCD, reduced: true },
        ask: { exp: 0, phase: 'asking' },
        reveal: { exp: 0, phase: 'revealed' },
        challenge: { exp: 5, phase: 'challenge' },
      };
      function viewOf(name) {
        const st = STATES[name] ?? STATES.default;
        const expParam = params.get('exp');
        const expIdx = expParam !== null && st.exp !== undefined ? Number(expParam) - 1 : st.exp;
        const frac = params.get('frac') !== null && st.frac !== undefined ? Number(params.get('frac')) : (st.frac ?? null);
        if (expIdx === undefined) return { s: st.s, from: st.from ?? null, replace: st.replace ?? null, hide: [], phase: 'rest', frac, describe: !!st.describe, reduced: !!st.reduced };
        const spec = M.EXPERIMENTS[expIdx];
        if (spec.goal) return expView(spec, params.get('start') === '1' ? 'start' : 'challenge');
        const phase = params.get('phase') === 'playing' && st.phase === 'asking' ? 'playing' : st.phase;
        return expView(spec, phase, Number(params.get('frac') ?? 0.6));
      }
      /** One experiment's view: asking (whatever came before leaves no trace), the answer's play at a fraction of its
       * clock, revealed, or the challenge met or at its start. */
      function expView(spec, phase, frac = 0.6, enteredFrom = null) {
        const e = M.renderExperiment(spec);
        if (spec.goal) {
          const s = phase === 'start' ? spec.setup : { ...spec.setup, ...M.CHALLENGE_SOLUTION };
          const sc = M.scenario(s);
          const met = M.goalMet(spec.goal, sc.settings, sc.metrics);
          return { s, from: null, hide: [], exp: e, spec, phase: 'challenge', met, focus: met ? spec.focus : [], frac: null };
        }
        const set = spec.act.set;
        const after = { ...spec.setup, ...set };
        const moves = 'nodes' in set;
        if (phase === 'asking') return { s: spec.setup, from: enteredFrom, hide: spec.hide, exp: e, spec, phase, focus: [], frac: null };
        return {
          s: after,
          from: moves ? M.NAMES.slice(0, spec.setup.nodes) : null,
          // A change of points plays its re-placement once and leaves no last change.
          replace: 'points' in set && phase === 'playing' ? { points: spec.setup.points } : null,
          hide: phase === 'revealed' ? [] : spec.hide,
          exp: e,
          spec,
          phase,
          chosen: e.answer === 0 ? 1 : 0,
          focus: phase === 'revealed' ? spec.focus : [],
          frac: phase === 'playing' ? frac : null,
        };
      }
      window.expView = expView;

      // ---------- The page around the stage.
      function controlsHtml(sc, view) {
        const s = sc.settings;
        const locked = view.phase === 'asking' || view.phase === 'playing';
        const dis = locked ? ' disabled' : '';
        const mod = s.scheme === 1;
        const seg = (name, items, cur, disabledAll = false) =>
          items.map(([v, label]) => `<label class="segment"><input type="radio" name="${name}" ${v === cur ? 'checked' : ''}${disabledAll ? ' disabled' : ''}/><span>${label}</span></label>`).join('');
        const downNode = sc.downNode ?? M.busiestOf(sc.up, s.hot, s.split);
        // The caption goes through the hiding map: while a question asks or plays it names no node.
        const downCaption = locked && !view.leakCaption ? (s.down ? 'The busiest node is down' : 'The busiest node would fail') : s.down ? `${downNode} is down: its keys moved` : `${downNode} would fail: its keys must move`;
        return `<fieldset class="group placement-control"${dis}><legend class="control-label">Placement</legend><div class="segments">${seg(
          'scheme',
          [
            [0, 'Consistent hashing'],
            [1, 'hash mod N'],
          ],
          s.scheme,
        )}</div></fieldset>
<fieldset class="group points-control"${dis}><legend class="control-label">Points per node <span class="why">(virtual nodes)</span>${mod ? '<span class="why"> · hash mod N has no ring</span>' : ''}</legend><div class="segments">${seg(
          'points',
          M.POINTS.map((p) => [p, M.num(p)]),
          s.points,
          mod,
        )}</div></fieldset>
<fieldset class="group nodes-control"${dis}><legend class="control-label">Nodes</legend><div class="segments">${seg(
          'nodes',
          M.NODE_COUNTS.map((n) => [n, `${n}<small aria-label="${M.NAMES[0]} to ${M.NAMES[n - 1]}">${M.NAMES[0]}–${M.NAMES[n - 1]}</small>`]),
          s.nodes,
        )}</div></fieldset>
<fieldset class="group conditions-control"${dis}><legend class="control-label">Conditions</legend><div class="toggles">
<label class="segment"><input type="checkbox" ${s.hot ? 'checked' : ''}/><span>A hot key<small>${M.HOT_PCT}% of the traffic</small></span></label>
<label class="segment"><input type="checkbox" aria-label="Split the hot key" ${s.split ? 'checked' : ''}${s.hot ? '' : ' disabled'}/><span><span class="split-long">Split the hot key</span><span class="split-short">Split the key</span><small>${s.hot ? `into ${M.SALTS} salted keys` : 'needs the hot key'}</small></span></label>
<label class="segment wide"><input type="checkbox" ${s.down ? 'checked' : ''}/><span>Busiest node down<small class="down-caption">${downCaption}</small></span></label></div></fieldset>
<p class="notice" aria-live="polite" aria-atomic="true">${esc(noticeOf(sc, view))}</p>${goalMini(sc, view)}`;
      }
      /** On a narrow layout the challenge's checklist is far below the controls that change it: a compact copy sits
       * under them (aria-hidden: the dock stays the source). */
      function goalMini(sc, view) {
        if (view.phase !== 'challenge') return '';
        const checks = M.goalChecks(sc);
        const met = checks.filter((c) => c.met).length;
        const short = ['busiest shard', 'keys moved', 'nodes'];
        return `<p class="goal-mini${met === checks.length ? ' met' : ''}" aria-hidden="true">${met} of ${checks.length} met: ${checks.map((c, i) => `${short[i]} ${c.met ? 'met' : 'not yet'}`).join(' · ')}</p>`;
      }
      function noticeOf(sc, view) {
        if (view.phase === 'asking') return 'Replay and the settings wait for your answer.';
        if (view.phase === 'playing') return 'The answer is playing on the picture.';
        if (view.phase === 'challenge') return M.summary(sc);
        if (view.phase === 'revealed') return M.story(sc);
        if (view.frac !== null && view.frac !== undefined) return 'The keys that change node are moving.';
        return sc.change ? M.story(sc) : 'Change the placement, the points, the nodes or the conditions. Replay shows the last change again.';
      }
      const SIMPLIFIED = `The model: ${M.num(K)} keys of equal size, each hashed once. Every key gets the same traffic unless the hot key is on, and a move is counted, not timed. A failed node's keys are drawn moving to their new owners; in a real cluster those owners already hold copies or reload them.`;
      const ICON_RIGHT = '<svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--g-success-line)"/><path d="M6 10.2l2.6 2.6 5.2-5.6" fill="none" stroke="var(--g-surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const ICON_WRONG = '<svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--g-danger)"/><path d="M7 7l6 6M13 7l-6 6" fill="none" stroke="var(--g-surface)" stroke-width="2" stroke-linecap="round"/></svg>';
      // Learner text in HTML keeps a number with its unit on one line (the app's g-code-text does the same).
      // A number with its unit, an equation, "hash mod 5", a fraction ("200 / 5"), a named formula ("N / (N + 1)") and a
      // short bracketed expression each form one unit no line parts.
      const NOWRAP_UNITS = /(N \/ \(N \+ 1\)|K \/ \(N \+ 1\)|\(\d[\d,.]* \/ \d+\)|\(\d+ × \d+ \/ \d+\)|\d[\d,.]* \/ \d+|[\d,.]+%? (?:keys?|nodes?|points?|shards?)|[\d,]+ mod \d+ = \d+|hash mod (?:\d+|N)|\d+ of the \d+|\d+ of \d+|\([^()]{1,24}\))/g;
      const htmlText = (t) => esc(t).replace(NOWRAP_UNITS, '<span class="nowrap">$1</span>');
      function dockHtml(sc, view) {
        const e = view.exp;
        if (!e) return '';
        if (view.phase === 'challenge') {
          const checks = M.goalChecks(sc);
          const kept = M.goalMet({ all: [], keep: view.spec.goal.keep }, sc.settings, sc.metrics);
          const status = view.met ? 'Goal met:' : kept ? '' : 'The goal keeps the hot key and the node down.';
          return `<p class="legend">${htmlText(e.ask)}</p>${status ? `<p class="status-line${view.met ? ' met' : ''}" role="status">${view.met ? ICON_RIGHT : ''}${esc(status)}</p>` : ''}<ul class="status">${checks
            .map((c) => `<li class="${c.met ? 'met' : ''}"><span class="state" aria-hidden="true">${c.met ? '✓' : '·'}</span><span>${htmlText(c.text)}</span></li>`)
            .join('')}</ul>${view.met ? `<p class="reveal" aria-live="polite" aria-atomic="true">${htmlText(e.reveal)}</p>` : ''}`;
        }
        if (view.phase === 'asking') {
          return `<fieldset style="border:0;padding:0;margin:0"><legend class="legend">${htmlText(e.ask)}</legend><div class="options">${e.choices.map((c) => `<button class="g-choice"><span class="choice-text">${htmlText(c)}</span></button>`).join('')}</div></fieldset>`;
        }
        const marked = e.choices
          .map((c, i) => {
            const right = view.phase === 'revealed' && i === e.answer;
            const wrong = view.phase === 'revealed' && i === view.chosen && !right;
            const chosen = view.phase === 'playing' && i === view.chosen;
            return `<li class="g-choice${right ? ' right' : wrong ? ' wrong' : ''}"><span>${htmlText(c)}${chosen ? ' <small>(your guess)</small>' : ''}</span>${right ? ICON_RIGHT : wrong ? ICON_WRONG : ''}</li>`;
          })
          .join('');
        if (view.phase === 'playing') return `<p class="legend">${htmlText(e.ask)}</p><ul class="options">${marked}</ul><p class="held">Watch the picture: the answer plays out on it.</p>`;
        return `<p class="legend">${htmlText(e.ask)}</p><ul class="options">${marked}</ul><p class="reveal" aria-live="polite" aria-atomic="true">${htmlText(e.reveal)}</p>`;
      }
      function cardsHtml(view) {
        return `<h3 class="heading"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg>Experiments</h3>
<ol class="cards">${M.EXPERIMENTS.map((s, i) => `<li><button class="card-btn"${view.exp && view.exp.id === s.id ? ' aria-current="step"' : ''}><span class="num">${s.goal ? '⚑' : i + 1}</span><span>${esc(M.renderExperiment(s).title)}</span></button></li>`).join('')}</ol>`;
      }
      // Describe: the summary, then a row a node; compact under a 560 px stage.
      function describeHtml(sc, view, compact) {
        const waits = view.phase === 'asking' || view.phase === 'playing' || (view.phase === 'challenge' && !view.met);
        const open = !!view.describe && !waits;
        const btn = `<button class="g-btn" aria-expanded="${open}"${waits ? ' disabled' : ''}>${open ? 'Hide the description' : 'Describe'}</button>`;
        if (waits) return `${btn}<p class="muted-note">${view.phase === 'challenge' ? 'Describe waits until you meet the goal.' : 'Describe waits for your answer.'}</p>`;

              const { D, H } = drawInto(well, W, sc, view);
              const out = check(well, D, sc);
              // Every reveal and the met challenge carry a visible "Look here" tag on each focus region.
              if (view.focus?.length) {
                const tags = well.querySelectorAll('rect.tag').length;
                if (tags !== view.focus.length) out.push(`${tags} look-here tags for ${view.focus.length} focus regions`);
              }
              res.renders++;
              (res.heights[W] ??= []).includes(H) || res.heights[W].push(H);
              if (out.length) res.failures.push({ W, exp: k + 1, phase: `${phase}${frac !== undefined ? ` ${frac}` : ''}`, out: out.slice(0, 4) });
            }
          });
        }
        well.style.width = '';
        return res;
      };
      window.debugDraw = function (W, which, phase, frac = null, from = null) {
        const well = document.getElementById('well');
        well.style.width = W + 2 + 'px';
        const view = typeof which === 'object' ? { s: which, from, hide: [], phase: 'rest', frac } : expView(M.EXPERIMENTS[which - 1], phase, frac ?? 0.6);
        const sc = M.scenario(view.s, view.from);
        const { D } = drawInto(well, W, sc, view);
        return check(well, D, sc);
      };

      // ---------- The no-answer sweep: while a question asks and while its answer plays, no rendered text, accessible
      // name or structure may hold its answer or a false claim (prevention 1 and 2). Each question is entered from the
      // node set every other state could leave behind, so nothing a learner did before can carry an answer in.
      function answerWords(spec) {
        const e = M.renderExperiment(spec);
        const sl = e.slots;
        const by = {
          'mod-join': [`${sl.moved} of`, `${sl.moved} keys`, sl.movedPct, `+${sl.toNew}`, `${sl.toNew} of them`, `other ${sl.between}`, 'places every key again', 'so far'],
          'ring-join': [`${sl.moved} of`, `All ${sl.moved}`, `+${sl.moved}`, sl.froms, 'moved to E', 'E holds it', "E's (was"],
          'one-point': [`${sl.one} keys`, ` ${sl.one} `, sl.arc, `| ${sl.one} |`],
          'lost-node': [`${sl.after} keys`, `to ${sl.after}`, `| ${sl.after} |`, `+${sl.held}`, `all to ${sl.next}`, `${sl.next} holds it`, `${sl.next} is the fullest`, 'next point clockwise.'],
          'hot-key': [sl.now, sl.splitBusiest],
        };
        return by[spec.id] ?? [];
      }
      function structural(well, spec, phase, root) {
        const out = [];
        const svg = well.querySelector('svg.draw');
        if (!well.querySelector('.play')?.disabled) out.push('Replay is enabled');
        // A control's caption goes through the hiding map: no node named while a question waits.
        const caption = root?.querySelector('.down-caption')?.textContent ?? '';
        if (/^[A-F] /.test(caption)) out.push(`the toggle's caption names a node: "${caption}"`);
        // The free line's invitation is false while every control waits.
        if (svg.textContent.includes(NO_CHANGE[0].slice(0, 30))) out.push('the free invitation to change the nodes while the controls wait');
        if (phase === 'asking') {
          if (svg.querySelector('[data-moved]')) out.push('a moved mark while the question asks');
          if (svg.querySelector('.fly, .sweep')) out.push('a play mark while the question asks');
          if (svg.querySelector('[data-id^="cell-in-"], [data-id^="cell-out-"]')) out.push('an in or out row while the question asks');
          if (!/none yet/i.test(svg.textContent)) out.push('a last change while the question asks');
        }
        if (phase === 'playing') {
          if (svg.querySelector('[data-moved]')) out.push('a moved mark before the reveal');
          for (const t of svg.querySelectorAll('[data-id^="cell-"]')) if (!/^(\?|down|×)$/.test(t.textContent)) out.push(`cell ${t.dataset.id} reads "${t.textContent}"`);
          const head = svg.querySelector('[data-id="moved-count"]')?.textContent ?? '';
          if (/^\d/.test(head)) out.push(`the headline reads "${head}"`);
          if (svg.querySelector('[data-id="hot-word"]') === null && spec.id === 'hot-key') out.push('the hot key lost its word');
          if (svg.querySelector('.climax')) out.push('a climax ring before the reveal');
        }
        return out;
      }
      function giveaways(root, well, spec, phase) {
        const text = `${stageText(well)} | ${root.querySelector('.notice')?.textContent ?? ''} | ${root.querySelector('.describe')?.textContent ?? ''} | ${[...root.querySelectorAll('.controls small')].map((e) => e.textContent).join(' | ')}`;
        const out = [];
        for (const w of answerWords(spec)) if (text.includes(w)) out.push(`"${w}" shows`);
        for (const g of FALSE_CLAIMS) if (g.test(text)) out.push(`false claim ${g}`);
        return [...out, ...structural(well, spec, phase, root)];
      }
      window.noAnswer = function (widths, leak = null) {
        const root = document.getElementById('widget');
        const well = document.getElementById('well');
        const res = { renders: 0, out: [] };
        const entries = [null, M.NAMES.slice(0, 3), M.NAMES.slice(0, 5), M.NAMES.slice(0, 6), ['A', 'B', 'D'], ['A', 'C', 'D']];
        for (const W of widths) {
          well.style.width = W + 2 + 'px';
          M.EXPERIMENTS.forEach((spec, k) => {
            if (spec.goal) return;
            const runs = [...entries.map((from) => ['asking', undefined, from]), ...[0.02, 0.2, 0.45, 0.7, 0.99].map((f) => ['playing', f, null])];
            for (const [phase, frac, from] of runs) {
              let view = expView(spec, phase, frac, from);
              if (leak) view = leak(view, k) ?? view;
              const sc = M.scenario(view.s, view.from);
              root.querySelector('.controls').innerHTML = controlsHtml(sc, view);
              drawInto(well, W, sc, view);
              root.querySelector('#describe').innerHTML = describeHtml(sc, view, W < 560);
              const out = giveaways(root, well, spec, phase);
              res.renders++;
              for (const o of out) res.out.push(`W${W} E${k + 1} ${phase}${frac !== undefined ? ` ${frac}` : ''}${from ? ` from ${from.join('')}` : ''}: ${o}`);
            }
          });
        }
        well.style.width = '';
        return res;
      };
      // Leaks planted on the hiding map: the sweep must catch every one.
      window.plantedLeaks = function (W) {
        const leaks = [
          // E1's play with nothing hidden: the count, the rows and the marks show.
          (view, k) => (k === 0 && view.phase === 'playing' ? { ...view, hide: [] } : null),
          // E2 asked with the ghost of the learner's last change left on the stage.
          (view, k) => (k === 1 && view.phase === 'asking' && view.from ? { ...view, leakGhost: true } : null),
          // E3's play with the table shown.
          (view, k) => (k === 2 && view.phase === 'playing' ? { ...view, hide: [] } : null),
          // E4's play with the hiding released early.
          (view, k) => (k === 3 && view.phase === 'playing' ? { ...view, hide: [{ region: 'after', when: 'asking' }] } : null),
          // E5's play with the traffic row shown.
          (view, k) => (k === 4 && view.phase === 'playing' ? { ...view, hide: [] } : null),
          // E1's play with the toggle's caption taken from the after-act setting.
          (view, k) => (k === 0 && view.phase === 'playing' ? { ...view, leakCaption: true } : null),
        ];
        return leaks.map((leak) => window.noAnswer([W], leak).out.length > 0);
      };
      // The heaviest stages: how many SVG elements each draws, and how many of them are the strip's ticks.
      window.elementCount = function (widths) {
        const well = document.getElementById('well');
        const out = [];
        const heavy = [
          [{ scheme: 0, points: 1, nodes: 6, hot: 1, split: 1, down: 0 }, M.NAMES.slice(0, 3)],
          [{ scheme: 0, points: 100, nodes: 6, hot: 1, split: 1, down: 0 }, M.NAMES.slice(0, 5)],
          [{ scheme: 1, points: 100, nodes: 6, hot: 1, split: 1, down: 0 }, M.NAMES.slice(0, 5)],
          [{ scheme: 0, points: 10, nodes: 6, hot: 1, split: 1, down: 0 }, M.NAMES.slice(0, 5)],
        ];
        for (const W of widths) {
          well.style.width = W + 2 + 'px';
          for (const [s, from] of heavy) {
            drawInto(well, W, M.scenario(s, from), { s, from, hide: [], phase: 'rest', frac: null });
            const svg = well.querySelector('svg.draw');
            out.push({ W, s: show(s, from), elements: svg.querySelectorAll('*').length, ticks: svg.querySelectorAll('.pt-tick').length, bands: svg.querySelectorAll('.band').length });
          }
        }
        well.style.width = '';
        return out;
      };
      window.heights = function (widths) {
        const out = {};
        const list = allScenarios();
        const well = document.getElementById('well');
        for (const W of widths) {
          well.style.width = W + 2 + 'px';
          const hs = new Set();
          for (let k = 0; k < list.length; k += 7) {
            const { s, from } = list[k];
            hs.add(drawInto(well, W, M.scenario(s, from), { s, from, hide: [], phase: 'rest', frac: null }).H);
          }
          for (const spec of M.EXPERIMENTS) {
            const v = spec.goal ? expView(spec, 'start') : expView(spec, 'playing', 0.5);
            hs.add(drawInto(well, W, M.scenario(v.s, v.from), v).H);
          }
          out[W] = [...hs];
        }
        well.style.width = '';
        return out;
      };
      // The page around the stage: no toggle's text within 4 px of its border, every choice one label child.
      window.pageChecks = function () {
        const out = [];
        for (const lab of document.querySelectorAll('.toggles .segment > span')) {
          const box = lab.getBoundingClientRect();
          for (const el of lab.querySelectorAll('small, span')) {
            if (getComputedStyle(el).display === 'none') continue;
            const r = document.createRange();
            r.selectNodeContents(el);
            for (const t of r.getClientRects()) if (t.width && (t.top - box.top < 4 || box.bottom - t.bottom < 4 || t.left - box.left < 4 || box.right - t.right < 4)) out.push(`a toggle's text "${el.textContent}" within 4 px of its border`);
          }
        }
        for (const b of document.querySelectorAll('button.g-choice')) if (b.children.length !== 1) out.push(`a choice with ${b.children.length} children`);
        return out;
      };
      // Every learner sentence: a formula, a fraction, an equation or a short bracket stays one nowrap unit.
      window.nowrapUnits = function () {
        const out = [];
        const sentences = [];
        for (const spec of M.EXPERIMENTS) {
          const e = M.renderExperiment(spec);
          sentences.push(e.ask, e.reveal, ...e.choices);
        }
        for (const { s, from } of allScenarios()) {
          const sc = M.scenario(s, from);
          sentences.push(M.summary(sc), M.story(sc), M.standing(sc), M.rule(sc), M.rule(sc, true), ...M.goalChecks(sc).map((c) => c.text));
        }
        sentences.push(SIMPLIFIED);
        const UNIT = [/N \/ \(N \+ 1\)/g, /\([^()]{1,24}\)/g, /\d[\d,.]* \/ \d+/g, /[\d,]+ mod \d+ = \d+/g];
        const host = document.createElement('div');
        for (const t of new Set(sentences)) {
          host.innerHTML = htmlText(t);
          const kept = [...host.querySelectorAll('.nowrap')].map((n) => n.textContent);
          for (const re of UNIT) for (const m of t.matchAll(re)) if (!kept.some((k) => k.includes(m[0]))) out.push(`"${m[0]}" can break in "${t.slice(0, 60)}"`);
        }
        return [...new Set(out)];
      };
      // Every page sentence of every scenario against the false claims (the stage's own text is swept as drawn).
      window.pageWords = function () {
        const out = [];
        for (const { s, from } of allScenarios()) {
          const sc = M.scenario(s, from);
          const texts = [M.summary(sc), M.story(sc), M.standing(sc), M.rule(sc), M.rule(sc, true), ...M.goalChecks(sc).map((c) => c.text), ...M.describeRows(sc).map((r) => Object.values(r).join(' | '))];
          for (const t of texts) for (const g of FALSE_CLAIMS) if (g.test(t)) out.push(`${show(s, from)}: ${g} in "${t}"`);
        }
        return out;
      };

      document.fonts.ready.then(async () => {
        await Promise.all([document.fonts.load('600 13px "Inter Variable"'), document.fonts.load('600 13px "JetBrains Mono Variable"')]);
        const { D, sc } = render(params.get('state') ?? 'default');
        const well = document.getElementById('well');
        window.__collisions = check(well, D, sc);
        document.body.dataset.ready = '1';
      });
    </script>
  </body>
</html>
