<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storage Engines widget mockup</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url(fonts/inter-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        src: url(fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 800;
        font-display: block;
      }
      /* The app's tokens (apps/app/src/_theme.scss, styles.scss): light is the base, dark overrides. */
      :root {
        color-scheme: light;
        --g-bg: #f4f5f9;
        --g-surface: #ffffff;
        --g-raised: #ffffff;
        --g-sunken: #eef0f5;
        --g-line: #dfe2ea;
        --g-line-strong: #c6cbd6;
        --g-stroke: #707889;
        --g-text: #161a23;
        --g-text-rgb: 22, 26, 35;
        --g-muted: #4a5263;
        --g-faint: #5c6477;
        --g-on-fill: #ffffff;
        --g-warn-ink: #6e4200;
        --g-danger-ink: #9d1630;
        --g-found-ink: #02583f;
        --g-accent: #5846dc;
        --g-accent-rgb: 88, 70, 220;
        --g-accent-soft: rgba(88, 70, 220, 0.14);
        --g-found: #036b4c;
        --g-danger: #c3203d;
        --g-warn: #945800;
        --g-success-ink: var(--g-found-ink);
        --g-success-line: var(--g-found);
        --g-success-soft: rgba(3, 107, 76, 0.12);
        --g-danger-soft: rgba(195, 32, 61, 0.12);
        --g-warn-soft: rgba(148, 88, 0, 0.12);
        --g-viz-stage: #f7f8fb;
        --g-viz-current: #0b74ad;
        --g-viz-current-soft: rgba(11, 116, 173, 0.16);
        --g-viz-considering: #c77700;
        --g-viz-considering-soft: rgba(199, 119, 0, 0.14);
        --g-viz-final: #12925f;
        --g-viz-final-ink: var(--g-found-ink);
        --g-viz-discarded-ink: #687082;
        --g-viz-critical: #d42a49;
        --g-viz-track: #d3d7e0;
        --g-shadow: 0 1px 2px rgba(var(--g-text-rgb), 0.06), 0 3px 10px rgba(var(--g-text-rgb), 0.07);
        --g-shadow-raised: 0 1px 2px rgba(var(--g-text-rgb), 0.08);
        --g-radius-xs: 6px;
        --g-radius-sm: 10px;
        --g-radius-md: 14px;
        --g-radius-pill: 999px;
        --g-text-title-m: 1.0625rem;
        --g-text-title-s: 0.9375rem;
        --g-text-body: 0.875rem;
        --g-text-body-s: 0.8125rem;
        --g-text-label: 0.6875rem;
        --g-font: 'Inter Variable', system-ui, sans-serif;
        --g-font-mono: 'JetBrains Mono Variable', ui-monospace, monospace;
        --g-focus-ring: 2px solid var(--g-accent);
      }
      :root.dark {
        color-scheme: dark;
        --g-bg: #0b0d12;
        --g-surface: #141824;
        --g-raised: #1c2130;
        --g-sunken: #0f121a;
        --g-line: #252a37;
        --g-line-strong: #343b4d;
        --g-stroke: #6b7387;
        --g-text: #e9ebf2;
        --g-text-rgb: 233, 235, 242;
        --g-muted: #8b93a8;
        --g-faint: #828a9e;
        --g-on-fill: #0b0d12;
        --g-warn-ink: #f3e6b3;
        --g-danger-ink: #ffb3bd;
        --g-found-ink: #3ddc97;
        --g-accent: #9d8cff;
        --g-accent-rgb: 157, 140, 255;
        --g-accent-soft: rgba(157, 140, 255, 0.14);
        --g-found: #3ddc97;
        --g-danger: #ff5d73;
        --g-warn: #ffb547;
        --g-success-soft: rgba(61, 220, 151, 0.12);
        --g-danger-soft: rgba(255, 93, 115, 0.12);
        --g-warn-soft: rgba(255, 181, 71, 0.12);
        --g-viz-stage: #0e1118;
        --g-viz-current: #1f9fd0;
        --g-viz-current-soft: rgba(31, 159, 208, 0.16);
        --g-viz-considering: #c08420;
        --g-viz-considering-soft: rgba(192, 132, 32, 0.18);
        --g-viz-final: #22ad74;
        --g-viz-final-ink: var(--g-found);
        --g-viz-discarded-ink: var(--g-muted);
        --g-viz-critical: #e5485f;
        --g-viz-track: #2a3040;
        --g-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        --g-shadow-raised: var(--g-shadow);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--g-bg);
        color: var(--g-text);
        font: 400 var(--g-text-body) / 1.5 var(--g-font);
        font-variant-ligatures: none;
        -webkit-font-smoothing: antialiased;
        overflow-wrap: break-word;
      }
      button {
        font-size: 0.8333rem;
      }
      .page {
        max-width: 1048px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      .eyebrow {
        margin: 0;
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
      }
      h1 {
        margin: 4px 0 14px;
        font: 600 1.25rem/1.3 var(--g-font);
      }
      .panel {
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background: var(--g-surface);
        box-shadow: var(--g-shadow);
        padding: 16px;
      }
      /* Narrow: one column, the controls as the stage's first rows, then the stage, the question, Describe, the cards. */
      .widget {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }
      .main,
      .experiments {
        display: contents;
      }
      .controls {
        order: 1;
      }
      .stage {
        order: 2;
        min-width: 0;
      }
      .dock {
        order: 3;
      }
      .describe {
        order: 4;
      }
      .heading,
      .cards {
        order: 5;
      }
      .controls {
        padding: 12px 12px 0;
        border: 1px solid var(--g-line);
        border-bottom: 0;
        border-radius: var(--g-radius-md) var(--g-radius-md) 0 0;
        background: var(--g-viz-stage);
        display: grid;
        gap: 10px;
        min-width: 0;
      }
      .stage {
        margin-top: -12px;
      }
      .stage .well {
        border-top: 0;
        border-radius: 0 0 var(--g-radius-md) var(--g-radius-md);
      }
      @media (min-width: 1000px) {
        .widget {
          grid-template-columns: minmax(0, 1fr) 340px;
          grid-template-rows: auto 1fr;
          align-items: start;
          column-gap: 20px;
        }
        .main {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: 12px;
          grid-column: 1;
          grid-row: 1 / span 2;
          min-width: 0;
        }
        .controls {
          grid-column: 2;
          grid-row: 1;
          padding: 0;
          border: 0;
          background: none;
        }
        .experiments {
          display: block;
          grid-column: 2;
          grid-row: 2;
          min-width: 0;
        }
        .stage {
          margin-top: 0;
        }
        .stage .well {
          border-top: 1px solid var(--g-line);
          border-radius: var(--g-radius-md);
        }
        .dock {
          margin-top: 12px;
        }
      }
      .well {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background-color: var(--g-viz-stage);
        background-image: radial-gradient(circle, rgba(var(--g-text-rgb), 0.09) 1px, transparent 1.5px);
        background-size: 24px 24px;
        background-position: 11px 11px;
      }
      /* Every fieldset.group carries the same zero padding; a control's own class only adds to it (the R41 padding bug). */
      fieldset.group {
        margin: 0;
        padding: 0;
        border: 0;
        min-width: 0;
      }
      .control-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
        padding: 0;
        margin-bottom: 4px;
      }
      .segments {
        display: flex;
        gap: 4px;
      }
      .segment {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
      }
      .segment input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .segment span {
        white-space: nowrap;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 6px;
        border-radius: var(--g-radius-sm);
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        font: 500 var(--g-text-body) / 1.15 var(--g-font);
        text-align: center;
      }
      .segment input:checked + span {
        background: var(--g-accent-soft);
        border-color: var(--g-accent);
        box-shadow: inset 0 0 0 1px var(--g-accent);
        font-weight: 600;
      }
      fieldset:disabled .segment span,
      .segment input:disabled + span {
        opacity: 0.55;
      }
      .control-label .why {
        font-weight: 500;
        letter-spacing: normal;
        text-transform: none;
      }
      .segment small {
        font: 500 var(--g-text-label) var(--g-font);
        color: var(--g-muted);
      }
      .toggles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .toggles .segment span {
        flex-direction: column;
        gap: 0;
        font-size: var(--g-text-body-s);
      }
      .notice {
        margin: 0;
        min-height: 2lh;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      /* Below wide the notice would sit over the stage and push it down as it speaks: read out only (_widget-controls.scss). */
      /* "1,000 GB" keeps one line in a 74 px segment at a 320 px phone. */
      @media (max-width: 359px) {
        .controls .segment span {
          padding-inline: 3px;
        }
      }
      @media (max-width: 999px) {
        .notice {
          position: absolute;
          width: 1px;
          height: 1px;
          min-height: 0;
          overflow: hidden;
          clip-path: inset(50%);
        }
        .controls {
          padding-bottom: 12px;
        }
      }
      .caption {
        margin: 0;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      .play {
        position: absolute;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        z-index: 2;
      }
      .play svg {
        display: block;
        width: 36px;
        height: 36px;
        margin: 4px;
      }
      .play circle {
        fill: var(--g-raised);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .play path {
        fill: var(--g-accent);
      }
      .play:disabled {
        cursor: default;
        opacity: 0.55;
      }
      .handle {
        position: absolute;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        cursor: ew-resize;
        z-index: 2;
      }
      .handle .knob {
        width: 14px;
        height: 26px;
        border-radius: var(--g-radius-pill);
        background: var(--g-raised);
        border: 2px solid var(--g-accent);
        box-shadow: var(--g-shadow-raised);
      }
      .handle[aria-disabled='true'] {
        cursor: default;
      }
      .handle[aria-disabled='true'] .knob {
        opacity: 0.55;
      }
      /* Drawing roles: text sits on a stage-coloured halo; small text is measured as drawn (no tabular digits). */
      svg.draw {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        overflow: visible;
      }
      svg.draw text {
        paint-order: stroke;
        stroke: var(--g-viz-stage);
        stroke-width: 3px;
        stroke-linejoin: round;
      }
      svg.draw text.on-box {
        stroke: var(--g-raised);
      }
      svg.draw text.on-chip {
        stroke: none;
      }
      .t-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: var(--g-muted);
      }
      .t-cap {
        font: 500 var(--g-text-body-s) var(--g-font);
        fill: var(--g-muted);
      }
      .t-capB {
        font: 600 var(--g-text-body-s) var(--g-font);
        fill: var(--g-text);
      }
      .t-small {
        font: 500 var(--g-text-label) var(--g-font);
        fill: var(--g-muted);
      }
      .t-smallB {
        font: 700 var(--g-text-label) var(--g-font);
        fill: var(--g-text);
      }
      .t-mono {
        font: 600 var(--g-text-label) var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-nameS {
        font: 600 13px var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-head {
        font: 600 var(--g-text-title-m) var(--g-font-mono);
        fill: var(--g-text);
      }
      .ink {
        fill: var(--g-text);
      }
      .muted {
        fill: var(--g-muted);
      }
      .bad {
        fill: var(--g-danger-ink);
      }
      .wait-ink {
        fill: var(--g-warn-ink);
      }
      .cur-ink {
        fill: var(--g-viz-current);
      }
      .crit-ink {
        fill: var(--g-viz-critical);
      }
      .rule {
        stroke: var(--g-line);
      }
      .rail {
        stroke: var(--g-viz-track);
        stroke-width: 4;
        stroke-linecap: round;
      }
      .fill {
        stroke: var(--g-accent);
        stroke-width: 4;
        stroke-linecap: round;
      }
      .stop {
        fill: var(--g-line-strong);
      }
      .t-unit {
        text-transform: none;
      }
      .lane {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1.25;
      }
      .lane.down {
        stroke-dasharray: 3 3;
      }
      .lane.hidden {
        stroke-dasharray: 3 3;
        stroke-opacity: 0.55;
      }
      .ring-track.hidden {
        stroke: var(--g-stroke);
        stroke-opacity: 0.55;
        stroke-width: 1.25;
        stroke-dasharray: 2 3;
      }
      .chip.hidden-chip {
        fill: var(--g-viz-stage);
        stroke: var(--g-stroke);
        stroke-dasharray: 3 2;
      }
      .notch {
        fill: var(--g-viz-stage);
      }
      .qgrid {
        stroke: var(--g-line-strong);
        stroke-dasharray: 2 3;
      }
      .drift {
        stroke: var(--g-text);
        stroke-opacity: 0.75;
        stroke-width: 1.25;
        stroke-dasharray: 5 3;
      }
      .ghost-dot {
        fill: var(--g-viz-stage);
        stroke: var(--g-stroke);
        stroke-width: 1.5;
      }
      .ghost-arrow {
        stroke: var(--g-stroke);
        stroke-width: 1.25;
        stroke-dasharray: 2 3;
      }
      .ghost-head {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1.25;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .mtick.over50 {
        stroke-dasharray: 3 3;
      }
      path.leader {
        fill: none;
      }
      .router {
        fill: var(--g-raised);
        stroke: var(--g-stroke);
        stroke-width: 1.25;
      }
      .srv {
        fill: var(--g-raised);
        stroke: var(--g-line-strong);
      }
      .srv.down {
        fill: url(#hatch);
        stroke-dasharray: 4 3;
      }
      .srv.over {
        stroke: var(--g-viz-critical);
        stroke-width: 1.5;
      }
      .hatch-fill {
        fill: var(--g-sunken);
      }
      .hatch-line {
        stroke: var(--g-viz-discarded-ink);
        stroke-opacity: 0.35;
        stroke-width: 1.5;
      }
      .ring-track {
        fill: none;
        stroke: var(--g-viz-track);
        stroke-width: 2.5;
      }
      .ring-arc {
        fill: none;
        stroke: var(--g-viz-current);
        stroke-width: 2.5;
        stroke-linecap: round;
      }
      .dot.wait {
        fill: var(--g-viz-considering);
      }
      .dot.serve {
        fill: var(--g-viz-current);
      }
      .dot.p50 {
        fill: var(--g-viz-current);
        stroke: var(--g-viz-stage);
        stroke-width: 1.5;
      }
      .dot.p99 {
        fill: var(--g-viz-critical);
        stroke: var(--g-viz-stage);
        stroke-width: 1.5;
      }
      .dot.req {
        fill: var(--g-stroke);
      }
      .dot.req.nowait {
        fill: var(--g-viz-current);
      }
      .ring99 {
        fill: none;
        stroke: var(--g-viz-critical);
        stroke-width: 1.75;
      }
      .key-dot.wait {
        fill: var(--g-viz-considering);
      }
      .key-dot.serve {
        fill: var(--g-viz-current);
      }
      .chip {
        fill: var(--g-raised);
        stroke: var(--g-line-strong);
      }
      .tick-arr {
        fill: var(--g-muted);
      }
      .tick-arr.dense {
        fill-opacity: 0.3;
      }
      .area-wait {
        fill: var(--g-viz-considering-soft);
      }
      .area-edge {
        fill: none;
        stroke: var(--g-viz-considering);
        stroke-width: 1.5;
      }
      .row-track {
        fill: none;
        stroke: var(--g-line);
      }
      .busy {
        fill: var(--g-viz-current);
      }
      .busy-down {
        fill: url(#hatch);
      }
      .axis {
        stroke: var(--g-line-strong);
      }
      .gridline {
        stroke: var(--g-line);
      }
      .playhead {
        stroke: var(--g-text);
        stroke-width: 1.5;
      }
      .moment {
        stroke: var(--g-text);
        stroke-opacity: 0.55;
        stroke-dasharray: 2 2;
      }
      .peak {
        fill: none;
        stroke: var(--g-text);
        stroke-width: 1.5;
      }
      .bar-work {
        fill: var(--g-viz-current);
      }
      .bar-wait {
        fill: var(--g-viz-considering);
      }
      .bar-hidden {
        fill: none;
        stroke: var(--g-stroke);
        stroke-dasharray: 4 3;
      }
      .curve {
        fill: none;
        stroke-width: 2;
        stroke-linejoin: round;
      }
      .curve.p50 {
        stroke: var(--g-viz-current);
      }
      .curve.p99 {
        stroke: var(--g-viz-critical);
        stroke-dasharray: 6 4;
      }
      .curve.ghost {
        stroke: var(--g-stroke);
        stroke-width: 1.5;
        stroke-dasharray: 2 3;
      }
      .cursor {
        stroke: var(--g-text);
        stroke-opacity: 0.45;
        stroke-dasharray: 3 3;
      }
      .cut {
        stroke: var(--g-stroke);
        stroke-dasharray: 2 3;
      }
      .leader {
        stroke: var(--g-stroke);
        stroke-dasharray: 2 3;
      }
      .mtick.p50 {
        stroke: var(--g-viz-current);
        stroke-width: 1.5;
      }
      .mtick.p99 {
        stroke: var(--g-viz-critical);
        stroke-width: 1.5;
      }
      .legend-line {
        stroke-width: 2;
        stroke-linecap: round;
      }
      .legend-line.p50 {
        stroke: var(--g-viz-current);
      }
      .legend-line.p99 {
        stroke: var(--g-viz-critical);
        stroke-dasharray: 4 3;
      }
      .xmark {
        stroke: var(--g-viz-critical);
        stroke-width: 2;
        stroke-linecap: round;
        fill: none;
      }
      .xground {
        fill: var(--g-viz-stage);
      }
      .chevron {
        fill: none;
        stroke: var(--g-viz-critical);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .focus-outline {
        fill: none;
        stroke: var(--g-accent);
        stroke-width: 2;
        stroke-dasharray: 6 4;
      }
      .tag {
        fill: var(--g-viz-stage);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .t-look {
        font: 600 var(--g-text-label) var(--g-font);
        fill: var(--g-accent);
      }
      /* The experiment dock and cards (experiment-dock.component.ts, widget-check.component.ts). */
      .dock {
        padding: 12px 16px;
        border-radius: var(--g-radius-md);
        border: 1px solid var(--g-line);
        border-left: 3px solid var(--g-accent);
        background: var(--g-surface);
      }
      .dock:empty {
        display: none;
      }
      .legend {
        margin: 0 0 4px;
        font-weight: 600;
        line-height: 1.45;
      }
      .options {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .g-choice {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        color: var(--g-text);
        font: 500 0.90625rem/1.45 var(--g-font);
        text-align: left;

      /* ---- The Storage Engines stage. Amber is a byte written to disk, blue a page or run read, green the key found,

  <body>
    <main class="page">
      <p class="eyebrow">System design · Storage Engines</p>
      <h1>Try it</h1>
      <section class="panel widget" id="widget"></section>
    </main>
    <script src="model.js"></script>
    <script>
      'use strict';
      const M = window.StorageModel;
      const params = new URLSearchParams(location.search);
      document.documentElement.classList.toggle('dark', params.get('theme') === 'dark');
      const WRITE = M.OP_WRITE;

      // ---------- Text measurement, with the fonts the app ships (no tabular digits: stage text is measured as drawn).
      // The label role is set in capitals, but a unit keeps its case ("10 MB/s").
      const ROLE = {
        label: { css: '600 11px "Inter Variable"', size: 11, track: 0.12, upper: true },
        cap: { css: '500 13px "Inter Variable"', size: 13 },
        capB: { css: '600 13px "Inter Variable"', size: 13 },
        small: { css: '500 11px "Inter Variable"', size: 11 },
        smallB: { css: '700 11px "Inter Variable"', size: 11 },
        mono: { css: '600 11px "JetBrains Mono Variable"', size: 11 },
        num: { css: '600 13px "JetBrains Mono Variable"', size: 13 },
        head: { css: '600 17px "JetBrains Mono Variable"', size: 17 },
        look: { css: '600 11px "Inter Variable"', size: 11 },
      };
      const UNIT = /(MB\/s)/;
      const upperKeepUnits = (t) => t.toUpperCase().replace(/MB\/S/g, 'MB/s');
      const ctx = document.createElement('canvas').getContext('2d');
      const widthCache = new Map();
      function tw(text, role) {
        const key = role + '|' + text;
        if (widthCache.has(key)) return widthCache.get(key);
        const f = ROLE[role];
        ctx.font = f.css;
        const s = f.upper ? upperKeepUnits(text) : text;
        const w = Math.ceil(ctx.measureText(s).width + (f.track ? f.track * f.size * s.length : 0)) + 1;
        widthCache.set(key, w);
        return w;
      }
      const partsWidth = (parts) => parts.reduce((s, [t, role, , dx = 0]) => s + tw(t, role) + dx, 0);
      // A number never parts from its unit: the two wrap as one word (stage-text.ts's rule).
      const KEEP = /(\d[\d,.]*(?:×)?) (B|KB|MB|GB|MB\/s|bits|levels?|runs?|parts|merges|pages?|records|disk)\b/g;
      const glue = (t) =>
        t
          .replace(KEEP, '$1 $2')
          .replace(/(about|in|of|k|under|least) (\d)/g, '$1 $2')
          .replace(/"[^"]*"/g, (q) => q.replace(/ /g, ' '));
      function wrap(text, role, width) {
        const lines = [];
        let line = '';
        for (const w of glue(text).split(' ')) {
          const next = line ? line + ' ' + w : w;
          if (tw(next.replace(/ /g, ' '), role) <= width || !line) line = next;
          else {
            lines.push(line);
            line = w;
          }
        }
        if (line) lines.push(line);
        // Balance: a short last word never stands alone on its line.
        if (lines.length > 1 && !lines.at(-1).includes(' ')) {
          const prev = lines.at(-2).split(' ');
          const moved = prev.length > 1 ? prev.at(-1) + ' ' + lines.at(-1) : null;
          if (moved && tw(moved.replace(/ /g, ' '), role) <= width) {
            lines[lines.length - 2] = prev.slice(0, -1).join(' ');
            lines[lines.length - 1] = moved;
          }
        }
        return lines.map((l) => l.replace(/ /g, ' '));
      }
      const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const labelInner = (t) =>
        esc(t)
          .split(UNIT)
          .map((p, i) => (i % 2 ? `<tspan class="t-unit">${p}</tspan>` : p))
          .join('');
      const r1 = (v) => Math.round(v * 10) / 10;
      const plural = M.plural;
      const pick = (forms, fits) => forms.find(fits) ?? forms[forms.length - 1];
      const fB = M.formatB;
      const fAmp = M.formatAmp;
      const fSize = M.formatSize;
      // HTML learner text keeps a number with its unit on one line (g-code-text's rule), without a non-breaking space.
      const KEEP_HTML = /((?:(?:under|at least|about) )?\d[\d,.]*×?(?: (?:bytes|B|KB|MB\/s|MB|GB|bits|levels?|runs?|pages?|disk reads?|times))|ratio \d+|"[^"]*")/g;
      const nb = (s) =>
        esc(s)
          .split(KEEP_HTML)
          .map((p, i) => (i % 2 ? `<span class="nb">${p}</span>` : p))
          .join('');

      // ---------- The drawing: SVG parts in layers, and the boxes placement checks against.
      class Draw {
        constructor(W) {
          this.W = W;
          this.layers = { back: [], grid: [], links: [], marks: [], dots: [], text: [], top: [] };
          this.texts = [];
          this.marks = [];
          this.links = [];
          this.hits = [];
          this.regions = {};
          this.missing = [];
          this.meta = {};
        }
        add(layer, s) {
          this.layers[layer].push(s);
        }
        textBox(x, y, w, role, anchor = 'start') {
          const fs = ROLE[role].size;
          const x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
          return { x0, x1: x0 + w, y0: y - 0.74 * fs, y1: y + 0.22 * fs };
        }
        text(x, y, parts, o = {}) {
          if (typeof parts === 'string') parts = [[parts, o.role ?? 'small', o.cls ?? 'muted']];
          const anchor = o.anchor ?? 'start';
          const w = partsWidth(parts);
          const role = parts.reduce((a, p) => (ROLE[p[1]].size > ROLE[a].size ? p[1] : a), parts[0][1]);
          const box = this.textBox(x, y, w, role, anchor);
          box.owner = o.owner ?? '';
          box.s = parts.map((p) => p[0]).join('');
          this.texts.push(box);
          const spans = parts.map(([t, r, cls = '', dx = 0]) => `<tspan class="t-${r} ${cls}"${dx ? ` dx="${dx}"` : ''}>${r === 'label' ? labelInner(t) : esc(t)}</tspan>`).join('');
          const attrs = `x="${r1(x)}" y="${r1(y)}" text-anchor="${anchor}"${o.owner ? ` data-owner="${o.owner}"` : ''}${o.ground ? ' data-ground="1"' : ''}${o.id ? ` data-id="${o.id}"` : ''}${o.data ?? ''}`;
          this.add(o.layer ?? 'text', `<text class="${o.textCls ?? ''}" ${attrs}>${spans}</text>`);
          return box;
        }
        mark(box, owner = '') {
          this.marks.push({ ...box, owner });
        }
        link(points, owner = '') {
          this.links.push({ points, owner });
        }
        hit(kind, x, y, w, h, extra = {}) {
          this.hits.push({ kind, x, y, w, h, ...extra });
          this.mark({ x0: x, x1: x + w, y0: y, y1: y + h }, extra.owner ?? kind);
        }
        region(id, box) {
          (this.regions[id] ??= []).push(box);
        }
        free(box, ignoreOwner = '', margin = 2, mx = margin) {
          const b = { x0: box.x0 - mx, x1: box.x1 + mx, y0: box.y0 - margin, y1: box.y1 + margin };
          const hit = (o) => !(o.x1 <= b.x0 || o.x0 >= b.x1 || o.y1 <= b.y0 || o.y0 >= b.y1);
          const mine = (o) => ignoreOwner && o.owner && o.owner.split(' ').some((t) => ignoreOwner.split(' ').includes(t));
          if (this.texts.some((t) => hit(t) && !mine(t))) return false;
          if (this.marks.some((m) => hit(m) && !mine(m))) return false;
          for (const l of this.links) {
            if (mine(l)) continue;
            if (l.points.some(([x, y]) => x > b.x0 && x < b.x1 && y > b.y0 && y < b.y1)) return false;
          }
          return b.x0 >= 2 && b.x1 <= this.W - 2;
        }
        svg(H, label) {
          const L = this.layers;
          return `<svg class="draw" width="${this.W}" height="${H}" viewBox="0 0 ${this.W} ${H}" role="img" aria-label="${esc(label)}">
<defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="hatch-fill"/><line class="hatch-line" x1="0" y1="0" x2="0" y2="6"/></pattern>
</defs>
<g>${L.back.join('')}</g><g>${L.grid.join('')}</g><g>${L.links.join('')}</g><g>${L.marks.join('')}</g><g>${L.dots.join('')}</g><g>${L.text.join('')}</g><g>${L.top.join('')}</g></svg>`;
        }
      }
      const sampleLine = (x1, y1, x2, y2, step = 3) => {
        const n = Math.max(2, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / step));
        return Array.from({ length: n + 1 }, (_, i) => [x1 + ((x2 - x1) * i) / n, y1 + ((y2 - y1) * i) / n]);
      };
      function dot(D, cx, cy, r, cls, owner, id, data = '') {
        D.add('dots', `<circle class="dot ${cls}" cx="${r1(cx)}" cy="${r1(cy)}" r="${r}"${id !== undefined ? ` data-id="${id}"` : ''} data-owner="${owner}"${data}/>`);
        D.mark({ x0: cx - r, x1: cx + r, y0: cy - r, y1: cy + r }, owner);
      }
      const rect = (cls, x, y, w, h, rx = 0, extra = '') => `<rect class="${cls}" x="${r1(x)}" y="${r1(y)}" width="${r1(Math.max(0, w))}" height="${r1(Math.max(0, h))}"${rx ? ` rx="${rx}"` : ''}${extra}/>`;
      const line = (cls, x1, y1, x2, y2, extra = '') => `<line class="${cls}" x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}"${extra}/>`;

      // ---------- What an open question hides, on every surface: one map (prevention 1). Each region is named in the
      // question's own `hide` list. `btreeWrite` and `lsmWrite` hide one engine's write cost: its numbers while the
      // question asks and while its answer plays, and the marks that would draw the answer (the page written back, the

      // during the answer's play, both engines' write numbers at the act's new setting; `readsAfter` the LSM tree's

      function hiding(view) {

        const asking = view.phase === 'asking';

        const open = asking || playing;
        const writesAfter = h.has('writesAfter') && playing;
        const map = {
          btNumbers: (h.has('btreeWrite') && open) || writesAfter,
          btMarks: h.has('btreeWrite') && asking,
          lsmNumbers: (h.has('lsmWrite') && open) || writesAfter,
          lsmMarks: h.has('lsmWrite') && asking,
          readNumbers: h.has('readsAfter') && playing,
          readWhy: h.has('readsWhy') && asking,
          // A hidden read row's dashed box spans the row's whole scale (8 pips), never the hidden count.
          pipBox: true,
          ghost: open,
          locked: open,
        };
        // The sweep's planted leaks switch one flag off on a copy of a view, to prove the sweep catches it.
        for (const flag of view.leak ?? []) map[flag] = false;

      }
      const NOTHING_HIDDEN = hiding({ phase: 'rest' });

      // ---------- Each play's steps as moments of its one clock (0 to 1). A mark shows once the clock has reached its
      // moment, so nothing is drawn for an event before it happens (prevention 6). A write is answered at its log
      // append; every step after it is "later".
      /** The merge (1-based) that brings the followed record into the staircase's level: the middle one. */
      const recordMerge = (T) => Math.floor(T / 2) + 1;
      function planOf(engine, m) {
        const write = m.settings.op === WRITE;
        const P = {};
        if (engine === 'btree') {
          const h = m.btree.height;
          for (let k = 0; k < h; k++) P[`walk${k}`] = (k / (h - 1)) * 0.42;
          if (write) Object.assign(P, { strip: 0.5, slice: 0.58, log: 0.7, page: 0.84, ledger: 0.97 });

          P.seconds = write ? 4 : 2.6;

          const L = m.lsm.levels;

            // level's ratio merges), then the descent goes on.
            Object.assign(P, { log: 0.02, mem: 0.07, run0: 0.16, run1: 0.26, run2: 0.36, stair0: 0.4, stair1: 0.64, ledger: 0.97 });

            P.seconds = 6 + 0.5 * L;
          } else {
            Object.assign(P, { mem: 0.06, ledger: 0.96 });
            for (let j = 0; j <= L; j++) P[`run${j}`] = 0.16 + (j * 0.68) / L;

      }
      const shown = (view, engine, at) => !view.play || view.play.engine !== engine || view.play.frac >= at - 1e-9;
      /**
       * What a play is doing at its clock's moment, longest form first: it stands under the engine's name while the play
       * runs, and is read out. It obeys hiding(): no form carries a number the question hides.
       */
      function stepCaption(engine, m, frac, hid) {
        const s = m.settings;
        const P = planOf(engine, m);
        const write = s.op === WRITE;
        const steps = [];
        if (engine === 'btree') {
          const h = m.btree.height;
          for (let k = 0; k < h - 1; k++) steps.push([P[`walk${k}`], k === 0 ? ['at the root, in memory'] : [`level ${k + 1} of ${h}, in memory`, `level ${k + 1}, in memory`]]);
          steps.push([P[`walk${h - 1}`], write ? ['its leaf, read from disk', 'leaf read from disk'] : ['the leaf, read from disk']]);
          if (write) {
            steps.push([P.slice, hid.btNumbers ? ['its record changed'] : [`its record changed, ${fB(s.record)}`, 'its record changed']]);
            steps.push([P.log, ['a log record appended: the write is safe and answered', 'log appended: answered']]);
            steps.push([P.page, ['later, the whole page written back', 'later, the page written back']]);
          } else steps.push([P.slice, ['the record found in the page']]);
        } else {
          const L = m.lsm.levels;
          if (write) {
            const T = s.ratio;
            steps.push([P.log, ['appended to the log: no read first', 'appended to the log']]);
            steps.push([P.mem, ['in the memtable too: safe and answered', 'in the memtable: answered']]);
            steps.push([P.run0, [`later, memtable full after ${M.formatCount(Math.round(m.lsm.recordsPerMemtable))} writes: flushed`, 'later, memtable full: flushed']]);
            for (let j = 1; j <= L; j++) steps.push([P[`run${j}`], hid.lsmNumbers ? [`later, merged down into L${j}`] : [`later, merged into L${j}, ≈${M.formatNum(m.lsm.rewritesPerLevel)}× there on average`, `later, merged into L${j}`]]);
            steps.push([P.stair0, [`L2 fills over ${T} merges; the record is rewritten in each one after it arrives`, `L2 fills over ${T} merges`]]);
            steps.sort((a, b) => a[0] - b[0]);
          } else {
            steps.push([P.mem, ['the memtable: not here']]);
            for (let j = 0; j <= L; j++) steps.push([P[`run${j}`], s.bloom && j < L ? [`L${j}: its filter says "not here"`, `L${j}: skipped`] : [`L${j}: read from disk`]]);

          }
        }
        return steps.filter(([at]) => frac >= at - 1e-9).at(-1)?.[1] ?? [write ? 'a write arrives' : 'a lookup arrives'];
      }

      // ---------- Words the stage and the page share.
      const opWord = (s) => (s.op === WRITE ? 'write' : 'lookup');
      const recordWords = (s) => `records of ${M.formatBytes(s.record)}`;
      const ENGINE = { btree: 'B-tree', lsm: 'LSM tree' };
      /** Where each family runs, as it runs there: Postgres's tables are not updated in place (only its indexes are B-trees), and Cassandra levels only with leveled compaction. */
      const ALSO = { btree: ['InnoDB, SQLite, Postgres indexes', 'InnoDB, SQLite'], lsm: ['RocksDB; Cassandra with leveled compaction', 'RocksDB, LevelDB'] };
      function premise(s) {
        const base = `${M.formatGb(s.data)} of records, ${M.formatBytes(s.record)} each`;
        return s.op === WRITE
          ? [`${base}, rewritten at random at ${M.formatRate(M.WRITE_MBPS)}. Follow one write.`]
          : [`${base}. Follow one lookup, for a key last written long ago.`, `${base}. Follow one lookup of an old key.`];
      }
      const allPremises = () => M.ALL_SETTINGS.filter((s) => s.page === 4 && s.ratio === 10 && s.bloom).map(premise);

      /** What a play did, in order: the notice after a play and the Reduced-motion caption. Every number is written. */
      function story(engine, m, hid = NOTHING_HIDDEN) {
        const s = m.settings;
        const b = m.btree;
        const l = m.lsm;
        if (engine === 'btree') {
          const walk = `walks ${b.height} pages from the root to a leaf, ${b.memoryHops} of them in memory`;
          if (s.op !== WRITE) return `The lookup ${walk}, and reads the leaf from disk: ${M.formatReads(b.lookupReads)}.`;
          if (hid.btNumbers) return `The write ${walk}, reads its leaf from disk, changes its record there and appends a log record: the write is safe and answered. Later the page goes back to disk. The bytes show at the reveal.`;
          return `The write ${walk}, reads its leaf from disk, changes ${M.formatBytes(s.record)} there and appends ${M.formatBytes(b.logBytes)} to the log: the write is safe and answered. Later the whole page goes back to disk, ${M.formatBytes(b.pageB)}: ${M.formatBytes(b.writeBytes)} written for ${M.formatBytes(s.record)} of data, ${fAmp(b.writeAmp)}.`;
        }
        if (s.op !== WRITE) {
          if (hid.readNumbers) return `The lookup checks the memtable, then goes down the runs on disk. The count shows at the reveal.`;
          if (hid.readWhy) return `The lookup checks the memtable, then asks the bloom filter of each run on disk, and reads the last level: ${M.formatReads(l.lookupReads)}.`;
          return s.bloom
            ? `The lookup checks the memtable, then asks the bloom filter of each run, in memory: ${l.skipped} runs say "not here", and only the last level is read from disk: ${M.formatReads(l.lookupReads)}.`
            : `The lookup checks the memtable, then reads every run on disk in turn, the flushed run and ${M.formatLevels(l.levels)}, until the last level turns the key up: ${M.formatReads(l.lookupReads)}.`;
        }
        const answered = 'The write is appended to the log and kept in the memtable, with no read first: it is safe and answered.';
        if (hid.lsmNumbers) return `${answered} Later it is flushed to disk when the memtable fills, then merged down through ${M.formatLevels(l.levels)}. The count shows at the reveal.`;
        return `${answered} Later, when the memtable's ${fSize(l.memtableBytes)} fill, it is flushed to disk as one sorted run, and compaction merges the record down through ${M.formatLevels(l.levels)}, rewriting it about ${M.formatNum(l.rewritesPerLevel)} times at each on average: ${fAmp(l.writeAmp)} the data in all.`;
      }
      /** One sentence for a setting, for the notice after a change, after a reveal and when the challenge opens. */
      function settingSentence(m, hid = NOTHING_HIDDEN) {
        const s = m.settings;
        const b = m.btree;
        const l = m.lsm;
        const bt = hid.btNumbers ? `The B-tree has ${M.formatKb(s.page)} pages` : `The B-tree, with ${M.formatKb(s.page)} pages, writes ${fAmp(b.writeAmp)} the data, and a lookup reads ${b.lookupReads} ${plural(b.lookupReads, 'page', 'pages')} from disk`;
        const ls = hid.lsmNumbers || hid.readNumbers ? `the LSM tree has ${M.formatLevels(l.levels)} at ratio ${s.ratio}, bloom filters ${s.bloom ? 'on' : 'off'}` : `the LSM tree, with ${M.formatLevels(l.levels)} at ratio ${s.ratio} and bloom filters ${s.bloom ? 'on' : 'off'}, writes ${fAmp(l.writeAmp)}, and a lookup reads ${l.lookupReads} ${plural(l.lookupReads, 'run', 'runs')}`;
        return `${bt}; ${ls}.`;
      }
      /** The stage's summary: full sentences, obeying hiding(). */
      function summary(m, hid) {
        const s = m.settings;
        const b = m.btree;
        const l = m.lsm;
        const out = [`A B-tree and an LSM tree each hold ${M.formatGb(s.data)} of data in ${recordWords(s)}; the stage follows one ${opWord(s)} through both.`];
        out.push(`B-tree, ${M.formatKb(s.page)} pages: each page points to about ${b.fanout} children, so ${b.height} levels hold the data, ${b.memoryHops} of them cached in memory.`);
        out.push(hid.btNumbers ? `Its write cost shows after your answer.` : `An update writes its whole page and a log record, ${M.formatBytes(b.writeBytes)} for ${M.formatBytes(s.record)}: ${fAmp(b.writeAmp)} the data. A lookup costs ${M.formatReads(b.lookupReads)}.`);
        out.push(`LSM tree, size ratio ${s.ratio}, bloom filters ${s.bloom ? 'on' : 'off'}: a flushed run and ${M.formatLevels(l.levels)} on disk.`);
        if (hid.lsmNumbers) out.push(`Its write cost shows after your answer.`);
        else out.push(`A record is written once to the log, once at the flush and about ${M.formatNum(l.rewritesPerLevel)} times at each level on average: ${fAmp(l.writeAmp)} the data.`);
        if (hid.readNumbers) out.push(`Its lookup's cost shows at the reveal.`);
        else out.push(`A lookup costs ${M.formatReads(l.lookupReads)}.`);
        out.push(`Disk used: about ${M.formatSpace(b.spaceAmp)} the live data for the B-tree, at most ${M.formatSpace(l.spaceAmp)} for the LSM tree.`);

      }
      /** The note under the stage states the model's assumptions, two of which are answers: it waits while a question is open. */
      const noteOf = (view) => (hiding(view).locked ? 'A rough model. Its assumptions show after your answer.' : MODEL_NOTE);
      const MODEL_NOTE = `A rough model. B-tree: every update writes its whole page back alone, plus a log record (its leaf is read from disk first when it is not in memory; that read is not counted); InnoDB's doublewrite buffer and Postgres's full-page log images can write a page twice, and the model counts it once; pages are about ${Math.round(M.PAGE_FILL * 100)}% full; every level above the leaves stays in memory. LSM tree: a ${M.MEMTABLE_MB} MB memtable; one log write, one flush, then about (ratio + 1) / 2 rewrites at each level as it fills, on average (a real tree spends fewer at its small top level and more at its always-full last one, and the totals come out close); bloom filters take ${M.BLOOM_BITS} bits a key, and their false positives, about 1 lookup in ${Math.round(1 / M.BLOOM_FALSE_POSITIVE)} for each run, are left out; each run's block index stays in memory, as the B-tree's upper levels do, and is not drawn. The level bars share one log scale. New data arrives at ${M.formatRate(M.WRITE_MBPS)}.`;

      // ---------- The stage. One panel a engine, the same shape at every width (224 px and up), side by side from a
      // 500 px stage; under them, what each engine pays. Heights depend on the stage's width only.

      /** The level bars' one log scale, shared by every setting: the memtable's 64 MB to the largest data size. */
      const SCALE_LO = M.MEMTABLE_MB * M.MB;
      const SCALE_HI = Math.max(...M.DATA_GB) * M.GB;
      const logShare = (bytes) => Math.log(bytes / SCALE_LO) / Math.log(SCALE_HI / SCALE_LO);

      function panelHead(D, x, y, pw, engine, sub, also, view) {
        D.hit('play', x, y, 44, 44, { owner: `play-${engine}`, engine });
        const forms = [
          ...also.map((a) => [
            [ENGINE[engine], 'capB', 'ink'],
            [` · ${a}`, 'small', 'muted'],
          ]),
          [[ENGINE[engine], 'capB', 'ink']],

        D.text(x + 52, y + 19, pick(forms, (f) => partsWidth(f) <= pw - 52), { owner: `title-${engine}` });

      function segments(D, x, y, pw, group, values, current, labelOf, legend) {

        const sw = (pw - 4 * (values.length - 1)) / values.length;
        values.forEach((v, i) => D.hit('seg', x + i * (sw + 4), y + 18, sw, 44, { owner: `${group}-${v}`, group, value: v, label: labelOf(v), checked: v === current, legend }));
      }

      function btreePanel(D, x, y, pw, m, view, hid, treeExtra) {
        const s = m.settings;
        const b = m.btree;
        const write = s.op === WRITE;
        const P = planOf('btree', m);
        const on = (k) => shown(view, 'btree', P[k]);
        const h = b.height;
        let cy = y;
        panelHead(D, x, y, pw, 'btree', 'sorted pages, updated in place', ALSO.btree, view);
        cy += PANEL.head + 6;
        segments(D, x, cy, pw, 'page', M.PAGE_KB, s.page, (v) => M.formatKb(v), 'Page size');
        cy += PANEL.knob + 10;

        // The tree: one row a level, the levels above the leaves in a band (memory), the leaves under it (disk).
        const treeTop = cy;
        const memory = fSize(b.memoryBytes);
        const labelA = pick([`Cached in memory · ${b.memoryHops} levels, ${memory} · ${b.fanout} children a page`, `Cached in memory · ${b.memoryHops} levels, ${memory}`, `In memory · ${b.memoryHops} levels, ${memory}`, `In memory · ${memory}`], (t) => tw(t, 'label') <= pw);
        D.text(x, cy + 11, [[labelA, 'label', '']], { textCls: 'muted', owner: 'bt-label' });
        const bandY = cy + 18;
        const UB = PANEL.tree - 18 - 10 - 16 - 4 - 14 + treeExtra;
        D.add('back', rect('band', x, bandY, pw, UB, 8));
        const countW = Math.max(...b.pages.slice(0, -1).map((n) => tw(M.formatPages(n), 'small')));
        const BW = 16;
        const BH = 12;
        const BG = 5;
        const zone = (x0, x1) => ({ x0, x1, cx: (x0 + x1) / 2, max: Math.max(2, Math.floor((x1 - x0 - 14) / (BW + BG))) });

          const leaf = k === h - 1;

        const labelB = pick([`On disk · ${M.formatCount(b.leaves)} leaf pages`, `On disk · ${M.formatCount(b.leaves)} leaves`], (t) => tw(t, 'label') <= pw);
        D.text(x, labelBY + 11, [[labelB, 'label', '']], { textCls: 'muted', owner: 'bt-label', id: 'bt-leaf-caption' });

        rows.forEach((r, k) => {

            const px = r.cx(r.idx);
            for (let i = 0; i < next.drawn; i++) {
              const walked = i === next.idx && on(`walk${k + 1}`);
              const pts = [px, r.cy + BH / 2, next.cx(i), next.cy - BH / 2];
              D.add('links', line(walked ? 'walk' : 'fan', ...pts, ` data-owner="bt-tree"`));
              D.link(sampleLine(...pts), 'bt-tree');
            }
            // The key in flight between two pages, while its play runs.
            if (view.play?.engine === 'btree' && view.play.frac > P[`walk${k}`] && view.play.frac < P[`walk${k + 1}`]) {
              const t = (view.play.frac - P[`walk${k}`]) / (P[`walk${k + 1}`] - P[`walk${k}`]);
              D.add('top', `<circle class="dot key" cx="${r1(px + (next.cx(next.idx) - px) * t)}" cy="${r1(r.cy + BH / 2 + (next.cy - BH - r.cy) * t)}" r="3.5" data-owner="bt-tree"/>`);
            }
          }
          for (let i = 0; i < r.drawn; i++) {
            let cls = 'pg';

              if (r.leaf && !write) cls = 'pg disk-read';
              if (r.leaf && write && !hid.btMarks) cls = pageWritten ? 'pg written' : 'pg disk-read';
            }

          }
          D.mark({ x0: r.x0 - 2, x1: r.x0 + r.total + 2, y0: r.cy - BH / 2 - 2, y1: r.cy + BH / 2 + 2 }, 'bt-tree');

        if (leafReached && !hid.btMarks) {
          const action = !write ? [M.formatReads(b.lookupReads), 'cur-ink'] : pageWritten ? ['written back', 'amber-ink'] : view.play?.engine === 'btree' ? ['read first', 'cur-ink'] : null;

        D.region('bt-tree', { x: x - 6, y: treeTop - 4, w: pw + 12, h: PANEL.tree + treeExtra + 6 });
        cy = treeTop + PANEL.tree + treeExtra + 14;

        // The leaf page, to scale: what one write changes against what it writes (or what a lookup reads). Whole

        const tY = cy;
        const nRec = Math.max(1, Math.round(b.recordsPerLeaf));
        const stripShown = on('strip');
        const labelT = pick([`The leaf page · ${fB(b.pageB)}, about ${nRec} records`, `Leaf page · ${fB(b.pageB)}, about ${nRec} records`, `The leaf page · ${fB(b.pageB)}`], (t) => tw(t, 'label') <= pw);
        if (stripShown) D.text(x, tY + 11, [[labelT, 'label', '']], { textCls: 'muted', owner: 'bt-strip' });
        const sy = tY + 18;
        const sh = 20;
        const recPx = (s.record / b.pageB) * pw;
        const fillEdge = x + Math.min(pw, nRec * recPx);
        const recW = Math.max(3, recPx);
        const recX = x + Math.floor((0.16 * pw) / recPx) * recPx;
        if (stripShown) {
          const cls = write ? (hid.btMarks ? 'strip hidden' : pageWritten ? 'strip rewritten' : 'strip') : 'strip read';
          D.add('marks', rect(cls, x + 0.75, sy, pw - 1.5, sh, 3, ` data-owner="bt-strip" data-id="page-strip"`));
          if (recPx >= 5 && !hid.btMarks) {
            let d = '';
            for (let i = 1; i < nRec; i++) d += `M${r1(x + i * recPx)} ${sy + 4}v${sh - 8}`;
            D.add('marks', `<path class="rec-ticks" d="${d}"/>`);
          }
          if (!hid.btMarks && fillEdge < x + pw - 2) D.add('marks', line('free-edge', fillEdge, sy + 1.5, fillEdge, sy + sh - 1.5, ` data-id="free-edge" data-x0="${x}" data-recpx="${recPx}"`));
          if (!hid.btMarks && x + pw - fillEdge >= tw('free', 'small') + 12) D.text((fillEdge + x + pw) / 2, sy + 14, [['free', 'small', 'muted']], { anchor: 'middle', textCls: 'on-chip', owner: 'bt-strip' });
          D.mark({ x0: x, x1: x + pw, y0: sy, y1: sy + sh }, 'bt-strip');
          // Inside the outline's stroke, so the slice never paints over it; new bytes amber, a changed record not yet
          // written ink, a found record green.
          if (on('slice')) {
            const sx0 = Math.max(recX, x + 1.5);
            D.add('marks', rect(`slice ${write ? (pageWritten ? 'new' : 'changed') : 'found'}`, sx0, sy + 1.5, Math.min(recW, x + pw - 1.5 - sx0), sh - 3, 1, ` data-owner="bt-strip" data-id="record-slice"`));
          }
          // Under the strip: what changed, at its record; what was written again unchanged, at the page's right end.
          const noteY = sy + sh + 14;
          const leftForms = write ? [`${fB(s.record)} changed`, `${fB(s.record)}`] : [`the record, ${fB(s.record)}`, `${fB(s.record)}`];
          let rightForms = [];
          const rightCls = write ? 'amber-ink' : 'cur-ink';
          if (!write) rightForms = [`${fB(b.pageB)} read from disk`, `${fB(b.pageB)} read`];
          else if (!pageWritten) rightForms = [];
          else if (hid.btNumbers) rightForms = ['? B rewritten unchanged', '? B written back', '? B written'];
          else rightForms = [`${fB(b.pageB - s.record)} rewritten unchanged`, `${fB(b.pageB)} written back whole`, `${fB(b.pageB)} written back`, `${fB(b.pageB)} written`];
          const fits = (lf, rf) => recX + tw(lf, 'small') + 10 <= x + pw - (rf ? tw(rf, 'small') : 0);
          let lf = leftForms[0];
          let rf = rightForms[0] ?? null;
          const cands = rightForms.length ? rightForms.flatMap((r, ri) => leftForms.map((l, li) => [l, r, ri + li])).sort((a, b) => a[2] - b[2]) : leftForms.map((l) => [l, null]);
          for (const cand of cands) {
            [lf, rf] = cand;
            if (fits(lf, rf)) break;
          }
          if (on('slice')) D.text(recX, noteY, [[lf, 'small', write ? (pageWritten ? 'amber-ink' : 'ink') : 'final-ink']], { owner: 'bt-note', id: 'record-note' });
          if (rf) D.text(x + pw, noteY, [[rf, 'small', rightCls]], { anchor: 'end', owner: 'bt-note', id: 'page-note' });
        }
        // The log (a write), drawn on the page strip's own scale: the write is answered once its record is here; the
        // pages walked (a lookup).
        const rowY = sy + sh + 22;
        if (write) {
          if (on('log') || hid.btMarks) {
            D.text(x, rowY + 11, [['Log', 'label', '']], { textCls: 'muted', owner: 'bt-log' });
            const tx = x + tw('Log', 'label') + 8;
            const trackW = Math.max(recW + 30, Math.min(0.38 * pw, 110));
            const end = tx + trackW + 8;
            if (hid.btMarks) {
              D.add('marks', rect('hidden-box', tx, rowY + 3, trackW, 9, 2));
              D.text(end, rowY + 11, [[pick(['shows after your answer', 'after your answer'], (t) => end + tw(t, 'small') <= x + pw), 'small', 'muted']], { owner: 'bt-log', id: 'log-note' });
            } else {
              D.add('marks', rect('logtrack', tx, rowY + 3, trackW, 9, 2, ' data-owner="bt-log"'));
              D.add('marks', rect('slice logged', tx + trackW - recW, rowY + 3, recW, 9, 1, ' data-owner="bt-log" data-id="log-slice"'));
              const added = hid.btNumbers ? '+? B' : `+${fB(b.logBytes)}`;
              const logForms = [
                [
                  [`${added} appended`, 'small', 'amber-ink'],
                  [' · answered', 'small', 'final-ink'],
                ],
                [
                  [added, 'small', 'amber-ink'],
                  [' · answered', 'small', 'final-ink'],
                ],
                [[added, 'small', 'amber-ink']],
              ];
              D.text(end, rowY + 11, pick(logForms, (f) => end + partsWidth(f) <= x + pw), { owner: 'bt-log', id: 'log-note' });
            }
            D.mark({ x0: tx, x1: tx + trackW, y0: rowY + 3, y1: rowY + 12 }, 'bt-log');
          }
        } else if (on('log')) {
          D.text(x, rowY + 11, [['Walk', 'label', '']], { textCls: 'muted', owner: 'bt-log' });
          const tx = x + tw('Walk', 'label') + 8;
          for (let k = 0; k < h; k++) D.add('marks', rect(`pwalk${k === h - 1 ? ' disk' : ''}`, tx + k * 13, rowY + 3, 9, 9, 2, ' data-owner="bt-log"'));
          D.mark({ x0: tx, x1: tx + h * 13, y0: rowY + 3, y1: rowY + 12 }, 'bt-log');
          const walkForms = [`${b.memoryHops} in memory, ${b.lookupReads} from disk`, `${b.memoryHops} cached, ${b.lookupReads} read`];
          D.text(tx + h * 13 + 6, rowY + 11, [[pick(walkForms, (t) => tx + h * 13 + 6 + tw(t, 'small') <= x + pw), 'small', 'muted']], { owner: 'bt-log' });
        }
        if (on('ledger')) {
          const l1 = write
            ? hid.btNumbers
              ? ['? B + ? B = ? B written']
              : [`${fB(b.pageB)} + ${fB(b.logBytes)} = ${fB(b.writeBytes)} written`, `= ${fB(b.writeBytes)} written`]
            : [`${b.height} pages walked − ${b.memoryHops} in memory = ${b.lookupReads} read`, `${b.height} pages − ${b.memoryHops} cached = ${b.lookupReads} read`];
          D.text(x, tY + 89, [[pick(l1, (t) => tw(t, 'mono') <= pw), 'mono', 'ink']], { owner: 'bt-ledger', id: 'bt-ledger' });
          const l2 = write
            ? [
                [hid.btNumbers ? '?×' : fAmp(b.writeAmp), 'head', hid.btNumbers ? 'muted' : 'amber-ink'],
                [' the data', 'cap', 'ink', 5],
              ]
            : [
                [String(b.lookupReads), 'head', 'cur-ink'],
                [` disk ${plural(b.lookupReads, 'read', 'reads')}`, 'cap', 'ink', 5],
              ];
          D.text(x, tY + 111, l2, { owner: 'bt-ledger', id: 'bt-total' });
        }
        D.region('bt-transform', { x: x - 6, y: tY - 4, w: pw + 12, h: PANEL.transform + 6 });
        return tY + PANEL.transform;
      }

      function lsmPanel(D, x, y, pw, m, view, hid) {
        const s = m.settings;
        const l = m.lsm;
        const write = s.op === WRITE;
        const P = planOf('lsm', m);
        const on = (k) => shown(view, 'lsm', P[k]);
        const L = l.levels;
        const kind = write ? 'w' : 'r';
        const avg = M.formatNum(l.rewritesPerLevel);
        let cy = y;
        panelHead(D, x, y, pw, 'lsm', 'appended, then merged down', ALSO.lsm, view);
        cy += PANEL.head + 6;
        segments(D, x, cy, pw, 'ratio', M.RATIOS, s.ratio, (v) => String(v), 'Size ratio');
        cy += PANEL.knob;
        D.hit('toggle', x, cy + 6, pw, 44, { owner: 'bloom', checked: !!s.bloom, label: 'Bloom filters', sub: s.bloom ? `${fSize(l.bloomBytes)} of memory` : 'off: no filter memory' });
        cy += PANEL.toggle + PANEL.toggleGap;

        // Memory and the log, then the sorted runs on disk, newest on top. Following a lookup with filters on, a
        // column of memory runs down beside the runs: a filter a run, where a lookup's "not here" lands.
        const top = cy;
        const long = pw >= 270;
        const trailX0 = 30;
        const chipW = Math.max(tw('skipped', 'small'), tw(long ? '≈10.5× avg' : '≈10.5×', 'mono'), tw(long ? '1 read, found' : '1 read', 'small'), tw('found', 'small')) + 2;
        const memW = write ? Math.max(Math.round((pw - chipW - 8) * 0.5), trailX0 + 12 + tw('memtable', 'small') + 8) : pw - chipW - 8;
        const logX = x + memW + 8;
        const logW = pw - chipW - 8 - memW - 8;
        const filters = !write && !!s.bloom;
        const headA = filters ? pick(['In memory · the memtable and a filter a run', 'In memory · memtable and filters', 'In memory'], (t) => tw(t, 'label') <= pw) : 'In memory';
        D.text(x, cy + 11, [[headA, 'label', '']], { textCls: 'muted', owner: 'lsm-label' });
        if (write) {
          const headW = tw('written', 'small') + 8;
          D.text(logX, cy + 11, [[pick(['On disk · the log', 'The log, on disk', 'The log', 'Log'], (t) => logX + tw(t, 'label') <= x + pw - headW), 'label', '']], { textCls: 'muted', owner: 'lsm-label' });
          D.text(x + pw, cy + 11, [['written', 'small', 'muted']], { anchor: 'end', owner: 'lsm-label' });
        }
        const memY = cy + 18;
        const memH = 26;
        const trailX = x + trailX0;
        D.add('marks', rect('run box', x + 0.5, memY, memW - 1, memH, 5, ' data-owner="lsm-stack"'));
        const memForms = [`memtable · ${fSize(l.memtableBytes)}, sorted`, `memtable · ${fSize(l.memtableBytes)}`, 'memtable'].map((t) => [[t, 'small', 'ink']]);
        D.text(trailX + 12, memY + 17, pick(memForms, (f) => trailX + 12 + partsWidth(f) <= x + memW - 4), { textCls: 'on-box', owner: 'lsm-stack', id: 'mem-text' });
        if (write) {
          D.add('marks', rect('logtrack', logX, memY + 6, logW, 14, 3, ' data-owner="lsm-stack" data-id="lsm-logtrack"'));
          // Once the record is in the log and the memtable, the write is answered: said inside the log's track.
          if (on('mem')) D.text(logX + 5, memY + 17, [['answered', 'small', 'final-ink']], { textCls: 'on-box', owner: 'lsm-stack', id: 'lsm-answered' });
          else {
            let ticks = '';
            for (let tx = logX + 6; tx < logX + logW - 8; tx += 6) ticks += `M${r1(tx)} ${memY + 9}v8`;
            D.add('marks', `<path class="rec-ticks" d="${ticks}"/>`);
          }
        }
        D.mark({ x0: x, x1: x + pw - chipW - 8, y0: memY, y1: memY + memH }, 'lsm-stack');
        const chip = (yc, text, cls, role, id) => D.text(x + pw, yc + 4, [[text, role, cls]], { anchor: 'end', owner: 'lsm-chip', id });
        if (write && on('log')) {
          D.add('marks', rect('slice logged', logX + logW - 5, memY + 6, 5, 14, 1, ' data-owner="lsm-stack" data-id="lsm-log"'));
          chip(memY + memH / 2, hid.lsmNumbers ? '?×' : '1×', hid.lsmNumbers ? 'muted' : 'amber-ink', 'mono', 'chip-log');
        }
        if (on('mem')) {
          D.add('dots', `<circle class="ringm ${kind}" cx="${trailX}" cy="${memY + memH / 2}" r="4.5" data-owner="lsm-stack" data-id="mem-mark"/>`);
          if (!write && !hid.readNumbers) chip(memY + memH / 2, 'not here', 'muted', 'small', 'chip-mem');
        }
        cy = memY + memH + 6;
        // The ratio claim starts at L1: L0, the flushed memtable, is not ratio times smaller than L1.
        const labelX = trailX + 14;
        const labelD = pick([`On disk · from L1 down, each level ${s.ratio}× the one above, log scale`, `On disk · from L1 down, each level ${s.ratio}× the one above`, `On disk · L1 to L${L}, ${s.ratio}× apart`, `On disk · sorted runs`, 'On disk'], (t) => labelX + tw(t, 'label') <= x + pw);
        D.text(labelX, cy + 11, [[labelD, 'label', '']], { textCls: 'muted', owner: 'lsm-label', id: 'stack-caption' });
        cy += 16;
        const n = L + 1;
        const pitch = PANEL.rows / n;
        const barH = Math.min(12, pitch - 8);
        const sizes = [l.memtableBytes, ...l.levelBytes].map(fSize);
        const sizeW = Math.max(...sizes.map((t) => tw(t, 'small')));
        // Bars start one ring radius right of the trail, so no dot or ring sits on a bar's outline.
        const bx = trailX + 11;
        const bmin = 16;
        const bmax = pw - (bx - x) - 6 - sizeW - 8 - chipW;
        const barW = (bytes) => bmin + (bmax - bmin) * logShare(bytes);
        if (filters) D.add('back', rect('fcol', trailX - 9, memY + memH - 1, 18, cy + PANEL.rows - (memY + memH) - 1, 4, ' data-id="filter-column"'));
        const rowsY = [];
        const reachedLast = Math.max(-1, ...Array.from({ length: n }, (_, j) => (on(`run${j}`) ? j : -1)));
        for (let j = 0; j <= L; j++) {
          const yc = cy + (j + 0.5) * pitch;
          rowsY.push(yc);
          const bytes = j === 0 ? l.memtableBytes : l.levelBytes[j - 1];
          const bw = barW(bytes);
          const reached = on(`run${j}`);
          const readHere = !write && reached && (!s.bloom || j === L);
          D.text(x, yc + 4, [[`L${j}`, 'mono', 'muted']], { owner: 'lsm-stack', data: ` data-level="${j}"` });
          D.add('marks', rect(`run${readHere ? ' read' : ''}`, bx, yc - barH / 2, bw, barH, 2.5, ` data-owner="lsm-stack" data-run="${j}" data-bytes="${bytes}" data-bmin="${bmin}" data-bmax="${r1(bmax)}"`));
          D.mark({ x0: bx, x1: bx + bw, y0: yc - barH / 2, y1: yc + barH / 2 }, 'lsm-stack');
          const sizeForms = j === 0 ? [`${sizes[0]}, flushed`, sizes[0]] : j === L ? [`${sizes[j]}, the data`, sizes[j]] : [sizes[j]];
          D.text(bx + bw + 6, yc + 4, [[pick(sizeForms, (t) => bx + bw + 6 + tw(t, 'small') <= x + pw - chipW - 6), 'small', 'muted']], { owner: 'lsm-size' });
          if (filters) D.add('marks', rect('filt', trailX - 5, yc - 4, 10, 8, 2, ` data-filter="${j}"`));
          if (!reached) continue;
          if (write) {
            // The record rests in the last level it has reached: a solid dot there, hollow rings where it passed.
            if (j < reachedLast) D.add('dots', `<circle class="ring-pass" cx="${trailX}" cy="${r1(yc)}" r="4" data-owner="lsm-stack" data-pass="${j}"/>`);
            else dot(D, trailX, yc, 4, 'w', 'lsm-stack', `w${j}`);
            D.mark({ x0: trailX - 4, x1: trailX + 4, y0: yc - 4, y1: yc + 4 }, 'lsm-stack');
            chip(yc, hid.lsmNumbers ? '?×' : j === 0 ? '1×' : long ? `≈${avg}× avg` : `≈${avg}×`, hid.lsmNumbers ? 'muted' : 'amber-ink', 'mono', `chip-${j}`);
          } else {
            const last = j === L;
            if (s.bloom && !last) {
              // The filter, in memory, answers "not here": the mark lands on the filter, and the run is not opened.
              D.add('dots', `<circle class="skip" cx="${trailX}" cy="${r1(yc)}" r="4.5" data-owner="lsm-stack" data-skip="${j}"/>` + line('skip-slash', trailX - 3, yc + 3, trailX + 3, yc - 3));
              if (!hid.readNumbers) chip(yc, 'skipped', 'muted', 'small', `chip-${j}`);
            } else {
              dot(D, trailX, yc, 4, 'r', 'lsm-stack', `r${j}`);
              const found = last && on('found');
              if (!hid.readNumbers) chip(yc, found ? (long ? '1 read, found' : 'found') : '1 read', found ? 'final-ink' : 'cur-ink', 'small', `chip-${j}`);
            }
            if (last && on('found')) D.add('dots', `<circle class="found-ring" cx="${trailX}" cy="${r1(yc)}" r="7.5" data-owner="lsm-stack"/>`);
          }
        }
        // The trail: the record's way down (a write), or the lookup's (a read), as far as the clock has come.
        if (on('mem') && reachedLast >= 0) D.add('links', line(`trail ${kind}`, trailX, memY + memH / 2 + 5, trailX, rowsY[reachedLast], ' data-owner="lsm-stack"'));
        if (view.play?.engine === 'lsm') {
          // The key travels in the moment before each arrival and holds still between them (the staircase's beat).
          const steps = ['mem', ...rowsY.map((_, j) => `run${j}`)];
          const ys = [memY + memH / 2, ...rowsY];
          const f = view.play.frac;
          for (let i = 0; i + 1 < steps.length; i++) {
            const t1 = P[steps[i + 1]];
            const t0 = Math.max(P[steps[i]], t1 - 0.08);
            if (f > t0 && f < t1) D.add('top', `<circle class="dot key" cx="${trailX}" cy="${r1(ys[i] + (ys[i + 1] - ys[i]) * ((f - t0) / (t1 - t0)))}" r="3.5" data-owner="lsm-stack"/>`);
          }
        }
        D.meta.lsmRows = n;
        // The outline's foot falls in the reserved tag row, so its tag sits on the stroke clear of the last run's labels.
        D.region('lsm-stack', { x: x - 6, y: top - 4, w: pw + 12, h: PANEL.lsmTop + 16 + PANEL.rows + 14 });
        cy += PANEL.rows + 10 + PANEL.tagRow;

        // Why a level costs what it costs (a write), or what the filters did (a lookup).
        const tY = cy;
        if (write) {
          const T = s.ratio;
          D.text(x, tY + 11, [[pick([`L2 filling · ${T} merges from L1`, `L2 filling · ${T} merges`, 'L2 filling'], (t) => tw(t, 'label') <= pw), 'label', '']], { textCls: 'muted', owner: 'lsm-stair' });
          const SW = 84;
          const SH = 62;
          const sx = x;
          const sy = tY + 18;
          const textX = x + SW + 12;
          const textW = pw - SW - 12;
          let lines;
          let sayNow = true;
          if (hid.lsmMarks) {
            D.add('marks', rect('hidden-box', sx + 0.5, sy, SW - 1, SH, 3, ' data-id="stair-hidden"'));
            lines = wrap("This level's merges draw after your answer.", 'small', textW);
          } else {
            const playing = view.play?.engine === 'lsm';
            const from = playing ? Math.max(0, Math.min(1, (view.play.frac - P.stair0) / (P.stair1 - P.stair0))) : 1;
            const rowsShown = Math.ceil(T * from - 1e-9);
            // The sentence counts every row, so it waits until the last row is drawn (prevention 6).
            sayNow = !playing || view.play.frac >= P.stair1 - 1e-9;
            const cw = SW / T;
            const rh = SH / T;
            const cells = cw >= 5 && rh >= 4;
            let soft = '';
            let fresh = '';
            for (let k = 1; k <= rowsShown; k++) {
              const ry = sy + (k - 1) * rh;
              if (k > 1) {
                if (cells) for (let i = 0; i < k - 1; i++) soft += `M${r1(sx + i * cw + 0.75)} ${r1(ry + 0.75)}h${r1(cw - 2.5)}v${r1(rh - 2.5)}h${r1(-(cw - 2.5))}z`;
                else soft += `M${r1(sx + 0.5)} ${r1(ry + 0.5)}h${r1((k - 1) * cw - 2)}v${r1(Math.max(0.5, rh - 2))}h${r1(-((k - 1) * cw - 2))}z`;
              }
              fresh += `M${r1(sx + (k - 1) * cw)} ${r1(ry)}h${r1(cw - 1)}v${r1(rh - 1)}h${r1(-(cw - 1))}z`;
            }
            D.add('marks', `<path class="rewritten${cells ? '' : ' thin'}" d="${soft}" data-id="stair" data-rows="${rowsShown}"/><path class="stair-new" d="${fresh}"/>`);
            // The record the play follows arrives with the middle merge and is written in every merge after it.
            const kr = recordMerge(T);
            if (rowsShown >= kr) D.add('marks', rect('mine', sx + (kr - 1) * cw - 0.75, sy + (kr - 1) * rh - 0.75, cw + 0.5, (rowsShown - kr + 1) * rh + 0.5, 1, ' data-id="stair-mine"'));
            const times = T - kr + 1;
            const full = [
              `Merge k writes k parts: the k − 1 already there and the new one. ${l.partsWritten} parts for ${T} new: about ${avg}× each. Outlined: the record, written ${times} times.`,
              `Merge k writes k parts: the k − 1 already there and the new one. ${l.partsWritten} parts for ${T} new: about ${avg}× each.`,
              `Merge k writes k parts: ${l.partsWritten} for ${T} new, about ${avg}× each.`,
            ];
            const quiet = ['Each merge from above rewrites what the level already holds; the outlined record is rewritten in each merge after it arrives.', 'Each merge from above rewrites what the level already holds.', 'Each merge rewrites the whole level.'];
            lines = pick(
              (hid.lsmNumbers ? quiet : full).map((t) => wrap(t, 'small', textW)),
              (ls) => ls.length <= 4,
            );
          }
          D.mark({ x0: sx, x1: sx + SW, y0: sy, y1: sy + SH }, 'lsm-stair');
          if (sayNow) lines.forEach((t, i) => D.text(textX, sy + 10 + i * 13, [[t, 'small', 'muted']], { owner: 'lsm-stair', id: i === 0 ? 'stair-text' : undefined }));
          if (on('ledger')) {
            const levels = M.formatLevels(L);
            const l1 = hid.lsmNumbers ? ['1 log + 1 flush + ? levels × ?'] : [`1 log + 1 flush + ${levels} × ${avg} on average`, `1 log + 1 flush + ${levels} × ${avg} avg`, `1 log + 1 flush + ${levels} × ${avg}`, `1 + 1 + ${L} × ${avg}`];
            D.text(x, tY + 91, [[pick(l1, (t) => tw(t, 'mono') <= pw), 'mono', 'ink']], { owner: 'lsm-ledger', id: 'lsm-ledger' });
            D.text(
              x,
              tY + 113,
              [
                [hid.lsmNumbers ? '?×' : fAmp(l.writeAmp), 'head', hid.lsmNumbers ? 'muted' : 'amber-ink'],
                [' the data', 'cap', 'ink', 5],
              ],
              { owner: 'lsm-ledger', id: 'lsm-total' },
            );
          }
        } else {

      // ---------- What each engine pays: the model's numbers on fixed scales.

      }
      function writeGroup(D, x, y, w, m, view, hid) {

      function buildStage(W, m, view) {

      // ---------- Focus outlines with their "Look here" tag (prevention 5). An outline takes in every text its region

          const tables = [true, false].map((c) => JSON.stringify(describeRows(m, c)));
          const words = [...sentences, ...tables].join(' | ');
          for (const g of FALSE_CLAIMS) if (g.test(words)) out.push(`${show(s)}: ${g} in "${words.match(g)[0]}"`);
          for (const t of [...sentences, describeRows(m, false).note]) {
            for (const g of PROSE) if (g.test(t)) out.push(`${show(s)}: ${g} in "${t.slice(Math.max(0, t.search(g) - 20), t.search(g) + 30)}"`);
            if (!/[.!?:]$/.test(t) && !/: (met|not yet)$/.test(t)) out.push(`${show(s)}: not a sentence: "${t.slice(-40)}"`);
          }
        }
        for (const t of [MODEL_NOTE]) for (const g of [PROSE[0], PROSE[1]]) if (g.test(t)) out.push(`model note: ${g}`);
        return out;
      };
      // The words of every surface, for a reader to check (shoot.cjs prints a sample of them).
      window.wordsOf = (s) => {
        const m = M.run(s);
        return { summary: summary(m, NOTHING_HIDDEN), notice: settingSentence(m), btree: story('btree', m), lsm: story('lsm', m), checks: goalChecks(m).map((g) => g.text), describe: describeRows(m, false), compact: describeRows(m, true) };
      };

      const stateName = params.get('state') ?? 'default';
      Promise.all([
        document.fonts.load('600 11px "Inter Variable"'),
        document.fonts.load('500 13px "Inter Variable"'),
        document.fonts.load('600 13px "Inter Variable"'),
        document.fonts.load('700 11px "Inter Variable"'),
        document.fonts.load('600 11px "JetBrains Mono Variable"'),
        document.fonts.load('600 13px "JetBrains Mono Variable"'),
      ]).then(() => {
        const first = render(stateName);
        const well = document.getElementById('well');
        const issues = check(well, first.D, first.m, first.view);
        render(stateName);
        window.__collisions = issues;
        document.body.dataset.ready = '1';
      });
    </script>
  </body>
</html>
