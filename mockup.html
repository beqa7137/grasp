<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Durability widget mockup</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url(fonts/inter-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        src: url(fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 800;
        font-display: block;
      }
      /* The app's tokens (apps/app/src/_theme.scss, styles.scss): light is the base, dark overrides. */
      :root {
        color-scheme: light;
        --g-bg: #f4f5f9;
        --g-surface: #ffffff;
        --g-raised: #ffffff;
        --g-sunken: #eef0f5;
        --g-line: #dfe2ea;
        --g-line-strong: #c6cbd6;
        --g-stroke: #707889;
        --g-text: #161a23;
        --g-text-rgb: 22, 26, 35;
        --g-muted: #4a5263;
        --g-faint: #5c6477;
        --g-on-fill: #ffffff;
        --g-warn-ink: #6e4200;
        --g-danger-ink: #9d1630;
        --g-found-ink: #02583f;
        --g-accent: #5846dc;
        --g-accent-rgb: 88, 70, 220;
        --g-accent-soft: rgba(88, 70, 220, 0.14);
        --g-found: #036b4c;
        --g-danger: #c3203d;
        --g-warn: #945800;
        --g-success-ink: var(--g-found-ink);
        --g-success-line: var(--g-found);
        --g-success-soft: rgba(3, 107, 76, 0.12);
        --g-danger-soft: rgba(195, 32, 61, 0.12);
        --g-warn-soft: rgba(148, 88, 0, 0.12);
        --g-viz-stage: #f7f8fb;
        --g-viz-current: #0b74ad;
        --g-viz-current-soft: rgba(11, 116, 173, 0.16);
        --g-viz-considering: #c77700;
        --g-viz-considering-soft: rgba(199, 119, 0, 0.14);
        --g-viz-final-soft: rgba(18, 146, 95, 0.14);
        --g-viz-final: #12925f;
        --g-viz-final-ink: var(--g-found-ink);
        --g-viz-discarded-ink: #687082;
        --g-viz-critical: #d42a49;
        --g-viz-track: #d3d7e0;
        --g-shadow: 0 1px 2px rgba(var(--g-text-rgb), 0.06), 0 3px 10px rgba(var(--g-text-rgb), 0.07);
        --g-shadow-raised: 0 1px 2px rgba(var(--g-text-rgb), 0.08);
        --g-radius-xs: 6px;
        --g-radius-sm: 10px;
        --g-radius-md: 14px;
        --g-radius-pill: 999px;
        --g-text-title-m: 1.0625rem;
        --g-text-title-s: 0.9375rem;
        --g-text-body: 0.875rem;
        --g-text-body-s: 0.8125rem;
        --g-text-label: 0.6875rem;
        --g-font: 'Inter Variable', system-ui, sans-serif;
        --g-font-mono: 'JetBrains Mono Variable', ui-monospace, monospace;
        --g-focus-ring: 2px solid var(--g-accent);
      }
      :root.dark {
        color-scheme: dark;
        --g-bg: #0b0d12;
        --g-surface: #141824;
        --g-raised: #1c2130;
        --g-sunken: #0f121a;
        --g-line: #252a37;
        --g-line-strong: #343b4d;
        --g-stroke: #6b7387;
        --g-text: #e9ebf2;
        --g-text-rgb: 233, 235, 242;
        --g-muted: #8b93a8;
        --g-faint: #828a9e;
        --g-on-fill: #0b0d12;
        --g-warn-ink: #f3e6b3;
        --g-danger-ink: #ffb3bd;
        --g-found-ink: #3ddc97;
        --g-accent: #9d8cff;
        --g-accent-rgb: 157, 140, 255;
        --g-accent-soft: rgba(157, 140, 255, 0.14);
        --g-found: #3ddc97;
        --g-danger: #ff5d73;
        --g-warn: #ffb547;
        --g-success-soft: rgba(61, 220, 151, 0.12);
        --g-danger-soft: rgba(255, 93, 115, 0.12);
        --g-warn-soft: rgba(255, 181, 71, 0.12);
        --g-viz-stage: #0e1118;
        --g-viz-current: #1f9fd0;
        --g-viz-current-soft: rgba(31, 159, 208, 0.16);
        --g-viz-considering: #c08420;
        --g-viz-considering-soft: rgba(192, 132, 32, 0.18);
        --g-viz-final-soft: rgba(34, 173, 116, 0.18);
        --g-viz-final: #22ad74;
        --g-viz-final-ink: var(--g-found);
        --g-viz-discarded-ink: var(--g-muted);
        --g-viz-critical: #e5485f;
        --g-viz-track: #2a3040;
        --g-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        --g-shadow-raised: var(--g-shadow);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--g-bg);
        color: var(--g-text);
        font: 400 var(--g-text-body) / 1.5 var(--g-font);
        font-variant-ligatures: none;
        -webkit-font-smoothing: antialiased;
        overflow-wrap: break-word;
      }
      button {
        font-size: 0.8333rem;
      }
      .page {
        max-width: 1048px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      .eyebrow {
        margin: 0;
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
      }
      h1 {
        margin: 4px 0 14px;
        font: 600 1.25rem/1.3 var(--g-font);
      }
      .panel {
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background: var(--g-surface);
        box-shadow: var(--g-shadow);
        padding: 16px;
      }
      /* Narrow: one column, the controls as the stage's first rows, then the stage, the question, Describe, the cards. */
      .widget {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }
      .main,
      .experiments {
        display: contents;
      }
      .controls {
        order: 1;
      }
      .stage {
        order: 2;
        min-width: 0;
      }
      .dock {
        order: 3;
      }
      .describe {
        order: 4;
      }
      .heading,
      .cards {
        order: 5;
      }
      .controls {
        padding: 12px 12px 0;
        border: 1px solid var(--g-line);
        border-bottom: 0;
        border-radius: var(--g-radius-md) var(--g-radius-md) 0 0;
        background: var(--g-viz-stage);
        display: grid;
        gap: 10px;
        min-width: 0;
      }
      .stage {
        margin-top: -12px;
      }
      .stage .well {
        border-top: 0;
        border-radius: 0 0 var(--g-radius-md) var(--g-radius-md);
      }
      @media (min-width: 1000px) {
        .widget {
          grid-template-columns: minmax(0, 1fr) 340px;
          grid-template-rows: auto 1fr;
          align-items: start;
          column-gap: 20px;
        }
        .main {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: 12px;
          grid-column: 1;
          grid-row: 1 / span 2;
          min-width: 0;
        }
        .controls {
          grid-column: 2;
          grid-row: 1;
          padding: 0;
          border: 0;
          background: none;
        }
        .experiments {
          display: block;
          grid-column: 2;
          grid-row: 2;
          min-width: 0;
        }
        .stage {
          margin-top: 0;
        }
        .stage .well {
          border-top: 1px solid var(--g-line);
          border-radius: var(--g-radius-md);
        }
        .dock {
          margin-top: 12px;
        }
      }
      .well {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--g-line);
        border-radius: var(--g-radius-md);
        background-color: var(--g-viz-stage);
        background-image: radial-gradient(circle, rgba(var(--g-text-rgb), 0.09) 1px, transparent 1.5px);
        background-size: 24px 24px;
        background-position: 11px 11px;
      }
      /* Every fieldset.group carries the same zero padding; a control's own class only adds to it (the R41 padding bug). */
      fieldset.group {
        margin: 0;
        padding: 0;
        border: 0;
        min-width: 0;
      }
      .control-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--g-muted);
        padding: 0;
        margin-bottom: 4px;
      }
      .segments {
        display: flex;
        gap: 4px;
      }
      .segment {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
      }
      .segment input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .segment span {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 6px;
        border-radius: var(--g-radius-sm);
        border: 1px solid var(--g-line-strong);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
        color: var(--g-text);
        font: 500 var(--g-text-body) / 1.15 var(--g-font);
        text-align: center;
      }
      .segment input:checked + span {
        background: var(--g-accent-soft);
        border-color: var(--g-accent);
        box-shadow: inset 0 0 0 1px var(--g-accent);
        font-weight: 600;
      }
      fieldset:disabled .segment span,
      .segment input:disabled + span {
        opacity: 0.55;
      }
      .control-label .why {
        font-weight: 500;
        letter-spacing: normal;
        text-transform: none;
      }
      .segment small {
        font: 500 var(--g-text-label) var(--g-font);
        color: var(--g-muted);
      }
      .toggles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .toggles .segment span {
        flex-direction: column;
        gap: 0;
        font-size: var(--g-text-body-s);
      }
      .notice {
        margin: 0;
        min-height: 2lh;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      /* Below wide the notice would sit over the stage and push it down as it speaks: read out only (_widget-controls.scss). */
      @media (max-width: 999px) {
        .notice {
          position: absolute;
          width: 1px;
          height: 1px;
          min-height: 0;
          overflow: hidden;
          clip-path: inset(50%);
        }
        .controls {
          padding-bottom: 12px;
        }
      }
      .caption {
        margin: 0;
        font-size: var(--g-text-body-s);
        color: var(--g-muted);
      }
      .play {
        position: absolute;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        z-index: 2;
      }
      .play svg {
        display: block;
        width: 36px;
        height: 36px;
        margin: 4px;
      }
      .play circle {
        fill: var(--g-raised);
        stroke: var(--g-accent);
        stroke-width: 1.5;
      }
      .play path {
        fill: var(--g-accent);
      }
      .play:disabled {
        cursor: default;
        opacity: 0.55;
      }
      .handle {
        position: absolute;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        cursor: ew-resize;
        z-index: 2;
      }
      .handle .knob {
        width: 14px;
        height: 26px;
        border-radius: var(--g-radius-pill);
        background: var(--g-raised);
        border: 2px solid var(--g-accent);
        box-shadow: var(--g-shadow-raised);
      }
      .handle[aria-disabled='true'] {
        cursor: default;
      }
      .handle[aria-disabled='true'] .knob {
        opacity: 0.55;
      }
      /* Drawing roles: text sits on a stage-coloured halo; small text is measured as drawn (no tabular digits). */
      svg.draw {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        overflow: visible;
      }
      svg.draw text {
        paint-order: stroke;
        stroke: var(--g-viz-stage);
        stroke-width: 3px;
        stroke-linejoin: round;
      }
      svg.draw text.on-box {
        stroke: var(--g-raised);
      }
      svg.draw text.on-chip {
        stroke: none;
      }
      svg.draw text.on-sunken {
        stroke: var(--g-sunken);
      }
      .t-label {
        font: 600 var(--g-text-label) var(--g-font);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: var(--g-muted);
      }
      .t-cap {
        font: 500 var(--g-text-body-s) var(--g-font);
        fill: var(--g-muted);
      }
      .t-capB {
        font: 600 var(--g-text-body-s) var(--g-font);
        fill: var(--g-text);
      }
      .t-small {
        font: 500 var(--g-text-label) var(--g-font);
        fill: var(--g-muted);
      }
      .t-smallB {
        font: 700 var(--g-text-label) var(--g-font);
        fill: var(--g-text);
      }
      .t-mono {
        font: 600 var(--g-text-label) var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-nameS {
        font: 600 13px var(--g-font-mono);
        fill: var(--g-text);
      }
      .t-head {
        font: 600 var(--g-text-title-m) var(--g-font-mono);
        fill: var(--g-text);
      }
      .ink {
        fill: var(--g-text);
      }
      .muted {
        fill: var(--g-muted);
      }
      .bad {
        fill: var(--g-danger-ink);
      }
      .wait-ink {
        fill: var(--g-warn-ink);
      }
      .cur-ink {
        fill: var(--g-viz-current);
      }
      .crit-ink {
        fill: var(--g-viz-critical);
      }
      .rule {
        stroke: var(--g-line);
      }
      .t-unit {
        text-transform: none;
      }
      /* The chain: wires are structure (3:1 on the stage), the request's path is the current tone. */
      .wire {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1.25;
      }
      .wire.soft {
        stroke-opacity: 0.6;
      }
      .path {
        fill: none;
        stroke: var(--g-viz-current);
        stroke-width: 2.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .path-hidden {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1.25;
        stroke-dasharray: 4 3;
      }
      .box {
        fill: var(--g-raised);
        stroke: var(--g-line-strong);
        stroke-width: 1.25;
      }
      .box.serving {
        stroke: var(--g-viz-current);
        stroke-width: 2;
      }
      .box.next {
        fill: var(--g-viz-current-soft);
        stroke: var(--g-viz-current);
      }
      .box.down {
        fill: url(#hatch);
        stroke: var(--g-viz-discarded-ink);
        stroke-width: 1.25;
      }
      .hatch-fill {
        fill: var(--g-sunken);
      }
      .hatch-line {
        stroke: var(--g-viz-discarded-ink);
        stroke-opacity: 0.4;
        stroke-width: 1.5;
      }
      .xmark {
        stroke: var(--g-viz-critical);
        stroke-width: 2;
        stroke-linecap: round;
        fill: none;
      }
      .xground {
        fill: var(--g-viz-stage);
      }
      .stop {
        fill: var(--g-viz-critical);
        stroke: var(--g-viz-stage);
        stroke-width: 1.5;
        paint-order: stroke;
      }
      .xground.on-box {
        fill: var(--g-raised);
      }
      .ok-ring {
        fill: var(--g-viz-stage);
        stroke: var(--g-viz-final);
        stroke-width: 1.75;
      }
      .ok-mark {
        fill: none;
        stroke: var(--g-viz-final);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bad-ring {
        fill: var(--g-viz-stage);
        stroke: var(--g-viz-critical);
        stroke-width: 1.75;
      }
      .q-ring {
        fill: var(--g-viz-stage);
        stroke: var(--g-stroke);
        stroke-width: 1.25;
        stroke-dasharray: 3 2.5;
      }
      .start-dot {
        fill: var(--g-viz-current);
      }
      .start-dot.hidden {
        fill: var(--g-stroke);
      }
      /* The year: a copy's outage is a neutral tick; what reaches the request is critical. */
      .row-track {
        stroke: var(--g-line);
      }
      .strip-track {
        stroke: var(--g-line-strong);
      }
      .tick-copy {
        fill: var(--g-text);
        fill-opacity: 0.62;
      }
      .tick-fail {
        fill: var(--g-viz-critical);
      }
      .tick-bypassed {
        fill: none;
        stroke: var(--g-stroke);
        stroke-width: 1;
      }
      .req-hidden {
        fill: none;
        stroke: var(--g-stroke);
        stroke-dasharray: 4 3;
      }
      .req-band {
        fill: rgba(var(--g-text-rgb), 0.04);
      }
      .axis {
        stroke: var(--g-line-strong);
      }
      .gridline {
        stroke: var(--g-line);
      }
      .moment {
        stroke: var(--g-text);
        stroke-opacity: 0.4;
      }
      .moment-head {
        fill: var(--g-text);
        fill-opacity: 0.7;
      }
      .ring {
        fill: none;
        stroke: var(--g-text);
        stroke-width: 1.5;
      }
      .playhead {
        stroke: var(--g-text);
        stroke-width: 1.5;
      }
      /* The nines scale: a solid length is what the model gives; the soft length beyond it is the paper's promise. */
      .bar {
        fill: var(--g-viz-current);
      }
      /* What the paper promised: outlined in the current tone (its edge carries it, 3:1), the fill only a tint. */
      .bar.paper {
        fill: color-mix(in srgb, var(--g-viz-current) 22%, var(--g-viz-stage));
        stroke: var(--g-viz-current);
        stroke-width: 1;
      }
      .key-paper {
        fill: var(--g-viz-current);
        fill-opacity: 0.22;
        stroke: var(--g-viz-current);
        stroke-width: 1;
      }
      .key-solid {
        fill: var(--g-viz-current);
      }
      .goal-line {
        stroke: var(--g-muted);
        stroke-width: 1.5;
      }
      .goal-line.met {
        stroke: var(--g-viz-final);
      }
      .ghost-caret {
        fill: none;
        stroke: var(--g-text);
        stroke-width: 1.25;
        stroke-linejoin: round;
      }
      .n-ring {
        fill: var(--g-viz-stage);
        stroke: var(--g-stroke);
        stroke-width: 1.25;
      }
      .inuse {
        fill: var(--g-viz-current);
      }
      .tick-shared {
        fill: var(--g-text);
        fill-opacity: 0.62;
      }
      .split-shared {
        fill: var(--g-viz-critical);
      }
      .split-failover {
        fill: var(--g-viz-critical);
      }
      .split-chance {
        fill: var(--g-text);
      }
      .split-track {
        stroke: var(--g-line-strong);
      }
      .inset-down {
        fill: var(--g-text);
        fill-opacity: 0.62;
      }
      .inset-up {
        stroke: var(--g-viz-current);
        stroke-width: 2;
      }
      .inset-frame {
        fill: none;
        stroke: var(--g-line-strong);
      }
      .bar.optional {
        fill: var(--g-viz-discarded-ink);
        fill-opacity: 0.45;
      }
      .bar.request {
        fill: var(--g-text);
        fill-opacity: 0.82;
      }
      .bar-hidden {
        fill: none;
        stroke: var(--g-stroke);
        stroke-dasharray: 4 3;
      }
      .notch {
        fill: var(--g-viz-stage);
      }
      .capline {
        stroke: var(--g-viz-critical);
        stroke-width: 1.5;
      }
      .capend {
        fill: var(--g-viz-critical);
      }
      .ghost-tick {
        fill: var(--g-viz-stage);
        stroke: var(--g-stroke);
        stroke-width: 1.25;
      }
      .key-copy {
        fill: var(--g-text);
        fill-opacity: 0.62;
      }
      .key-fail {
        fill: var(--g-viz-critical);
      }
      .ok-ink {
        fill: var(--g-viz-final-ink);
      }
      /* Steppers and toggles (kit: g-stepper, the house toggle). */
      .steppers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 8px;
      }
      .stepper {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        align-items: center;
        border: 1px solid var(--g-line-strong);
        border-radius: var(--g-radius-sm);
        background: var(--g-raised);
        box-shadow: var(--g-shadow-raised);
      }
      .stepper button {
        width: 44px;
        height: 44px;
        border: 0;
        background: none;
        color: var(--g-text);
        font: 500 1.125rem/1 var(--g-font);
        cursor: pointer;
      }
      .stepper button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .stepper output {
        display: grid;
        justify-items: center;
        line-height: 1.15;
        font: 600 var(--g-text-body) var(--g-font-mono);
      }
      .stepper output small {
        font: 500 var(--g-text-label) var(--g-font);
        color: var(--g-muted);
      }
      fieldset:disabled .stepper {
        opacity: 0.55;
      }
      .toggles3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
      }
      .toggles3 .segment span {
        flex-direction: column;

  capB: { css: '600 13px "Inter Variable"', size: 13 },

  [/(\d) ×/g, '$1\u0001×'],

  const yRep = yC + 22;
  const bandY = yRep + 8;
  const repForms = !ps.failed ? ['Repair'] : ps.rackDown ? ['No repair: the rack took every piece at 0', 'No repair'] : [`Detection and rebuild of ${fname}, from its failure at 0`, `Detect and rebuild ${fname}`];
  const repLabel = pick(repForms, (f) => tw(f, 'small') <= IW - 130);
  D.text(X0, yRep, [[repLabel, 'small', ps.rackDown ? 'lost-ink' : '']], { owner: 'replabel' });
  const yOth = bandY + 32;
  const lineY = yOth + 12;
  const others = m.n - 1;
  const othForms = ps.rackDown ? [`The ${others} others, in the same event`, `The ${others} others`] : m.n === 2 ? ['The other copy'] : [`The ${others} others`, `${others} others`];
  const yAx = lineY + 16;
  const grid = zoom ? [0, s.repair / 2, s.repair, span] : [0, 24, 48, 72, 96, 120, 144, 168];
  for (const h of grid) D.line(tx(h), yRep + 4, tx(h), yAx, 'gridline', { layer: 'grid', solid: false });
  D.line(X0, yAx, XR, yAx, 'axis', { layer: 'grid', solid: false });
  const axisLabels = zoom ? [0, s.repair, span] : wide ? [0, 24, 48, 72, 96, 120, 144, 168] : [0, 24, 72, 168];
  for (const h of axisLabels) D.text(tx(h), yAx + 14, [[h === 0 ? '0' : M.formatHours(h), 'small']], { anchor: h === 0 ? 'start' : h === span ? 'end' : 'middle', data: ' data-xtick="race"', ground: true });
  D.line(X0, lineY, XR, lineY, 'track', { layer: 'grid', solid: false });
  if (ps.failed && !ps.rackDown) {
    const wx = tx(s.repair);
    D.rect(X0, bandY, Math.max(2, wx - X0), 10, `band${ps.lost ? ' lost' : ''}`, { rx: 2, owner: 'band', mark: false });
    D.mark({ x0: X0, x1: Math.max(X0 + 2, wx), y0: bandY, y1: bandY + 10 }, 'band');
    if (ps.progress > 0) D.rect(X0, bandY, Math.max(1.5, (wx - X0) * ps.progress), 10, 'band-fill', { rx: 2, owner: 'band', mark: false });
    const lead = ps.rebuilt ? [[`rebuilt in ${M.formatHours(s.repair)}`, 'small', 'ok-ink']] : ps.lost ? [['stopped: too few left', 'small', 'lost-ink']] : [[`repair ${M.formatHours(s.repair)}`, 'small']];
    const endX = ps.rebuilt ? wx + 10 : wx + 4;
    if (ps.rebuilt) checkGlyph(D, wx + 1, bandY + 5, 'band', 5.5);
    D.place([[endX + 4, bandY + 9], [X1, yRep, 'end'], [X0 + tw(repLabel, 'small') + 10, yRep]], lead, { owner: 'band' });
    // Staged failures of the others, each at its moment inside the window, each named above its ×; where the names
    // cannot stand apart they are numbered, and the same numbers mark the struck disks.
    if (staged) {
      const shown = stagedList.map((piece, j) => ({ piece, j })).filter(({ piece }) => ps.stagedDown.includes(piece));
      const xsOf = shown.map(({ j }) => tx(s.repair * M.stagedAt(j, m.t)));
      shown.forEach(({ j }, k) => xGlyph(D, xsOf[k], lineY, `st${j}`, 3.5));
      const named = shown.map(({ piece, j }, k) => D.place([[xsOf[k], lineY - 10, 'middle']], [[pcs[piece].id, 'tiny']], { owner: `st${j}`, ignore: `st${j}`, optional: true, data: ' data-staged-name="1"' }));
      if (named.some((b) => !b)) {
        shown.forEach(({ piece, j }, k) => {
          if (named[k]) return;
          D.place([[xsOf[k], lineY - 10, 'middle']], [[String(j + 1), 'tiny']], { owner: `st${j}`, ignore: `st${j}`, data: ' data-staged-name="1"' });
          D.text(diskX(piece) + diskW / 2, yDisk + diskH - 5, [[String(j + 1), 'tiny']], { owner: `disk${piece}`, anchor: 'middle', textCls: 'on-box' });
        });
      }
      D.meta.stagedShown = shown.length;
      if (ps.lost) {
        const lx = tx(s.repair * M.stagedAt(stagedList.length - 1, m.t));
        D.place([[lx + 9, lineY + 4], [lx + 9, lineY - 5], [lx - 9, lineY - 5, 'end']], [['lost', 'smallB', 'lost-ink']], { owner: 'lost', optional: true, ground: true });
      }
    } else if (ps.rebuilt) {
      D.place([[XR, lineY - 5, 'end'], [X1, yOth, 'end']], [['none failed', 'small']], { owner: 'others', optional: true });
    }
    if (playing && ps.progress > 0 && ps.progress < 1 && !ps.lost) {
      const hx = X0 + (wx - X0) * ps.progress;
      D.line(hx, bandY - 3, hx, bandY + 13, 'playhead', { layer: 'top', solid: false });
      D.line(hx, lineY - 5, hx, lineY + 5, 'playhead', { layer: 'top', solid: false });
    }
  } else if (ps.rackDown) {
    // Every other piece went in the same event, at 0: one × at 0 carries them, named.
    xGlyph(D, X0 + 1, lineY, 'rackx', 3.5);
    const ids = pcs.map((p) => p.id).filter((id) => id !== fname);
    const forms = [`${ids.length <= 3 ? M.listOf(ids) : `all ${ids.length}`} lost at 0`, 'lost at 0'];
    for (const f of forms) if (D.place([[X0 + 11, lineY + 4]], [[f, 'small', 'lost-ink']], { owner: 'rackx', optional: f !== forms[forms.length - 1], ground: true, data: ' data-rack-lost="1"' })) break;
  }
  // Row two's words, placed after its marks: at the left, or at the axis end where staged crosses take the left.
  const othFit = othForms.filter((f) => tw(f, 'small') <= IW / 2);
  for (const [k, f] of (othFit.length ? othFit : othForms.slice(-1)).entries()) if (D.place([[X0, yOth], [XR, yOth, 'end'], [X1, yOth, 'end']], [[f, 'small']], { owner: 'othlabel', optional: k < othFit.length - 1 })) break;
  const raceText = raceSentence(m, ps, kind, hid);
  const yRaceText = yAx + 36;
  D.para(X0, yRaceText, wrap(raceText, 'cap', IW), 'cap', LH, { owner: 'racetext' });
  D.meta.raceText = raceText;
  D.region('race', { x: X0 - 6, y: yC - 22, w: IW + 12, h: yAx + 22 - (yC - 22) });
  const yRule = yRaceText + (res.race - 1) * LH + 22;
  D.line(0, yRule, W, yRule, 'rule', { solid: false });

  // D: the model. Headline, then the steps as a walk along a nines scale, then the billion-object conversion.
  const yT = yRule + 28;
  D.text(X0, yT, [[wide ? 'The yearly chance of losing it, from the model' : 'Yearly loss, from the model', 'capB']]);
  const yH = yT + 24;
  // A figure lands with the mark that computes it: during a play NINES waits for the last row.
  const ninesNow = hid.loss ? '?' : playing && !ps.rows.final ? '…' : M.formatNines(m.nines);
  const cols = [
    ['Stored', M.formatX(m.overhead)],
    ['Survives', `any ${m.t}`],
    ['Nines', ninesNow],
  ];
  const cw = IW / 3;
  cols.forEach(([k, v], i) => {
    D.text(X0 + i * cw, yH, [[k, 'label']]);
    D.text(X0 + i * cw, yH + 21, [[v, 'head', v === '?' || v === '…' ? 'muted' : '']], { owner: 'headline', data: i === 2 ? ' data-nines="1"' : '' });
  });
  D.region('headline', { x: X0 - 6, y: yH - 17, w: IW + 12, h: 47 });
  const yAxT = yH + 78;
  const nx = (n) => X0 + ((Math.max(NMIN, Math.min(NMAX, n)) - NMIN) / (NMAX - NMIN)) * IW;
  const ROW = 34;
  const rowsShown = [];
  const plotTop = yAxT + 10;
  const yrF = plotTop + STEP_ROWS * ROW;
  const lyF = yrF + 11;
  const ayF = yrF + 42;
  const yBot = ayF + 14;
  D.text(X0, yAxT - 14, [[wide ? 'Nines, each step right is 10× less likely' : 'Nines · a step is 10× less likely', 'label']]);
  const ticks = wide ? [0, 3, 6, 9, 12, 15, 18, 21, 24] : [0, 6, 9, 12, 18, 24];
  for (const n of [0, 3, 6, 9, 12, 15, 18, 21, 24]) D.line(nx(n), plotTop - 4, nx(n), yBot, `gridline${n === 9 ? ' nine' : ''}`, { layer: 'grid', solid: false });
  for (const n of ticks) D.text(nx(n), yAxT, [[String(n), 'small']], { anchor: 'middle', data: ' data-xtick="nines"', ground: true });
  const levelN = (lv) => -Math.log10(lv);
  const ghostM = view.ghost && !hid.ghost ? M.run(view.ghost) : null;
  const ghostSame = !!ghostM && ghostM.settings.scheme === s.scheme;
  const showRow = (row) => (row.kind === 'final' ? ps.rows.final || !playing : row.kind === 'first' ? ps.rows.first || !playing : row.kind === 'window' ? ps.rows.steps >= row.i || !playing : ps.rows.ways || !playing);
  const valRole = wide ? 'capB' : 'small';
  D.meta.ghostSteps = [];
  if (hid.steps) {
    // One box whatever the scheme, so its height does not tell how many steps a loss needs.
    D.add('marks', `<rect class="bar-hidden" data-box="steps" x="${r1(X0)}" y="${r1(plotTop)}" width="${r1(IW)}" height="${2 * ROW - 6}" rx="4"/>`);
    D.text(X0 + IW / 2, plotTop + ROW + 1, [['The steps show after your answer', 'small']], { anchor: 'middle', owner: 'stepsq' });
  } else {
    let prev = null;
    m.steps.forEach((row, k) => {
      const yr = plotTop + k * ROW;
      const ly = yr + 11;
      const ay = yr + 21;
      const own = `row-${row.kind}${row.i ?? ''}`;
      if (showRow(row)) {
        D.text(X0, ly, [[pick(M.stepWords(m, row), (f) => tw(f, 'small') <= IW), 'small']], { owner: own });
        const x = nx(levelN(row.level));
        const px = prev ? nx(levelN(prev.level)) : nx(0);
        if (row.kind === 'first') {
          D.line(nx(0), ay, x, ay, 'step-arrow first', { owner: own });
          D.add('dots', `<circle class="head-first" cx="${r1(x)}" cy="${r1(ay)}" r="3.5"/>`);
          D.mark({ x0: x - 4, x1: x + 4, y0: ay - 4, y1: ay + 4 }, own);
        } else {
          const right = x >= px;
          D.line(px, ay - 5, px, ay + 5, 'from-tick', { owner: own });
          const hx = right ? x - 5 : x + 5;
          if (Math.abs(x - px) >= 7) {
            D.line(px, ay, hx, ay, `step-arrow${right ? '' : ' up'}`, { owner: own });
            D.add('dots', `<path class="${right ? 'head-cur' : 'head-up'}" d="M${r1(x)} ${r1(ay)}L${r1(hx)} ${r1(ay - 4)}L${r1(hx)} ${r1(ay + 4)}z"/>`);
          }
          D.mark({ x0: Math.min(px, x) - 1, x1: Math.max(px, x) + 1, y0: ay - 5, y1: ay + 5 }, own);
        }
        // The old walk, drawn: each changed step's old arrow as a hairline under the new one, its tip an open caret.
        const g = !ghostM ? null : row.kind === 'first' ? ghostM.steps[0] : ghostSame ? ghostM.steps[k] : null;
        let was = null;
        if (g) {
          const gx = nx(levelN(g.level));
          const gpx = row.kind === 'first' ? nx(0) : nx(levelN(ghostM.steps[k - 1].level));
          if ((Math.abs(gx - x) > 1 || Math.abs(gpx - px) > 1) && Math.abs(gx - gpx) >= 2) {
            const gy = ay + 12;
            const dir = gx >= gpx ? 1 : -1;
            D.line(gpx, gy, gx - dir * 3, gy, 'ghost-step', { owner: `ghost-${own}`, solid: false });
            D.add('dots', `<path class="ghost-tip" d="M${r1(gx - dir * 3.5)} ${r1(gy - 2.5)}L${r1(gx)} ${r1(gy)}L${r1(gx - dir * 3.5)} ${r1(gy + 2.5)}"/>`);
            D.mark({ x0: Math.min(gx, gpx) - 1, x1: Math.max(gx, gpx) + 1, y0: gy - 1.5, y1: gy + 1.5 }, `ghost-${own}`);
            D.mark({ x0: gx - 4, x1: gx + 4, y0: gy - 2.5, y1: gy + 2.5 }, `ghost-${own}`);
            D.meta.ghostSteps.push({ kind: row.kind, i: row.i, len: Math.abs(gx - gpx), newLen: Math.abs(x - px), dir: Math.sign(gx - gpx), newDir: Math.sign(x - px) });
          }
          if (row.kind === 'first' && Math.abs(g.factor / row.factor - 1) > 1e-9) was = `${M.formatRate(row.factor)} (was ${M.formatRate(g.factor)})`;
          if (row.kind === 'window' && Math.abs(g.factor / row.factor - 1) > 1e-9) was = `× ${M.oneIn(row.factor)} (was ${M.oneIn(g.factor)})`;
        }
        const val = row.kind === 'first' ? M.formatRate(row.level) : row.kind === 'window' ? `× ${M.oneIn(row.factor)}` : `× ${M.formatCount(row.factor)}`;
        const lo = Math.min(x, px);
        const hi = Math.max(x, px);
        const cands = [
          [hi + 9, ay + 4.5],
          [lo - 9, ay + 4.5, 'end'],
          [X1, ly, 'end'],
        ];
        (was ? D.place(cands, [[was, valRole, 'ink']], { owner: `val-${own} was`, optional: true }) : null) ?? D.place(cands, [[val, valRole, 'ink']], { owner: `val-${own}` });
        rowsShown.push(row.kind);
      }
      prev = row;
    });
  }

  // The last row: the yearly loss as a bar to a dot at the model's nines. Its value is placed first, beside the dot;
  // then the ghost's caret and its words, as one unit in the lane above the bar, with a bracket to the dot carrying the
  // ratio; then the goal's words beside its mark; whatever finds no place goes into the row's words.
  const finalRow = { kind: 'final', level: m.loss };
  const finalShown = showRow(finalRow);
  const ly = lyF;
  const ay = ayF;
  const yb = ay - 12;
  const extras = [];
  D.meta.final = null;
  if (challenge) {
    const gx = nx(-Math.log10(M.CHALLENGE_BOUNDS.perBillion / M.OBJECTS));
    D.line(gx, ay - 9, gx, ay + 9, `goal-line${view.met ? ' met' : ''}`, { owner: 'goal' });
    D.meta.goal = { gx, y: ay };
  }
  if (hid.loss) {
    D.add('marks', `<rect class="bar-hidden" data-box="final" x="${r1(X0)}" y="${r1(ay - 11)}" width="${r1(IW)}" height="22" rx="3"/>`);
    D.text(X0 + IW - 8, ay + 4, [['after your answer', 'small']], { anchor: 'end', owner: 'finalq' });
  } else if (finalShown) {
    const x = nx(m.nines);
    D.rect(nx(0), ay - 5, x - nx(0), 10, `bar-final${s.rack ? ' rack' : ''}`, { rx: 2, owner: 'row-final' });
    D.add('dots', `<circle class="dot-final" cx="${r1(x)}" cy="${r1(ay)}" r="5"/>`);
    D.mark({ x0: x - 5, x1: x + 5, y0: ay - 5, y1: ay + 5 }, 'row-final');
    const ghostX = ghostM && Math.abs(ghostM.nines - m.nines) > 0.04 ? nx(ghostM.nines) : null;
    let caret = ghostX !== null && Math.abs(ghostX - x) >= 16;
    const col = () => (caret ? D.mark({ x0: ghostX - 15, x1: ghostX + 15, y0: yb - 10, y1: ay + 6 }, 'ghostcol') : null);
    const unmark = () => (D.marks = D.marks.filter((mk) => mk.owner !== 'ghostcol'));
    col();
    const val = `${M.formatNines(m.nines)} nines`;
    const vRole = wide ? 'capB' : 'smallB';
    const tryValue = () =>
      D.place([[x + 9, ay + 4.5]], [[val, vRole]], { owner: 'val-final', optional: true }) ??
      (x - 9 - tw(val, 'smallB') >= nx(0) + 3 ? D.place([[x - 9, ay + 4, 'end']], [[val, 'smallB', 'on-bar']], { owner: 'val-final row-final', ignore: 'row-final', textCls: 'on-chip', optional: true }) : null) ??
      D.place([[x, yb, 'middle']], [[val, vRole]], { owner: 'val-final', optional: true, data: ' data-above="1"' });
    let vb = tryValue();
    if (!vb && caret) {
      unmark();
      caret = false;
      vb = tryValue();
    }
    if (!vb) D.missing.push(val);
    D.meta.final = { x, y: ay, box: vb };
    unmark();
    if (caret) {
      const before = `before ${M.formatNines(ghostM.nines)}`;
      const outer = ghostX > x ? [[ghostX + 7, yb]] : [[ghostX - 7, yb, 'end']];
      D.mark({ x0: ghostX - 5, x1: ghostX + 5, y0: ay - 14, y1: ay - 7 }, 'ghost');
      const cw0 = D.place(outer, [[before, 'small']], { owner: 'ghost', optional: true, minX: X0, maxX: X1, data: ' data-ghost-words="1"' });
      if (!cw0) {
        D.marks = D.marks.filter((mk) => mk.owner !== 'ghost');
        caret = false;
      } else {
        D.add('top', `<path class="ghost-caret" d="M${r1(ghostX - 4)} ${r1(ay - 13)}L${r1(ghostX)} ${r1(ay - 8)}L${r1(ghostX + 4)} ${r1(ay - 13)}"/>`);
        // The comparison the words claim, drawn: a bracket from the caret to the dot, its ratio on the dot's side.
        const ratio = ratioWords(m, ghostM);
        const bracketable = !(vb && vb.y1 < ay - 6);
        if (bracketable) {
          const a = Math.min(ghostX, x);
          const b = Math.max(ghostX, x);
          const by = ay - 10.5;
          D.add('links', `<path class="ghost-bracket" d="M${r1(a)} ${r1(by + 2.5)}V${r1(by)}H${r1(b)}V${r1(by + 2.5)}"/>`);
          D.link(sampleLine(a + 5, by, b - 5, by), 'ghost');
        }
        const side = ghostX > x ? [[x - 8, yb, 'end']] : [[x + 8, yb]];
        const rb = bracketable ? D.place(side, [[ratio, 'small']], { owner: 'ghost ratio', optional: true, minX: X0, maxX: X1, data: ' data-ratio="1"' }) : null;
        if (!rb) extras.push({ k: 'ratio', t: `, ${ratio}` });
      }
    }
    if (ghostX !== null && !caret) extras.push({ k: 'before', t: ` (before ${M.oneIn(ghostM.loss)})` });
    D.meta.caret = caret ? ghostX : null;
  }
  if (challenge) {
    const { gx } = D.meta.goal;
    const gw = D.place([[gx + 6, yb], [gx - 6, yb, 'end']], [['goal: 10 nines', 'small', view.met ? 'ok-ink' : '']], { owner: 'goal', optional: true, minX: X0, maxX: X1, data: ' data-goal-words="1"' });
    if (!gw) extras.push({ k: 'goal', t: ' · goal: 10 nines' });
  }
  if (finalShown || hid.loss) {
    const base = M.stepWords(m, finalRow, hid.loss);
    const sets = [extras, extras.filter((e) => e.k !== 'ratio'), extras.filter((e) => e.k === 'goal')];
    let chosen = null;
    for (const set of sets) {
      chosen = base.map((b) => b + set.map((e) => e.t).join('')).find((f) => tw(f, 'smallB') <= IW);
      if (chosen) break;
    }
    chosen ??= base[base.length - 1];
    D.text(X0, ly, [[chosen, 'smallB']], { owner: 'row-final', data: ' data-final-words="1"' });
    rowsShown.push('final');
  }
  D.line(X0, yBot, X1, yBot, 'axis', { layer: 'grid', solid: false });
  // The billion-object conversion, drawn: the same axis, read as objects lost a year among a billion, on average.
  const conv = wide
    ? [
        [3, '1 million'],
        [6, '1,000'],
        [9, '1'],
        [12, '0.001'],
        [15, '0.000001'],
      ]
    : [
        [6, '1,000'],
        [9, '1'],
        [12, '0.001'],
      ];
  for (const [n, t] of conv) D.text(nx(n), yBot + 14, [[t, n === 9 ? 'smallB' : 'small']], { anchor: 'middle', data: ' data-xtick="billion"', ground: true });
  const billionTitle = ['Objects lost a year on average, among a billion', 'Lost a year on average, of a billion', 'Lost a year, average, of a billion', 'Average lost a year'];
  D.text(X0, yBot + 32, [[pick(billionTitle, (f) => tw(f, 'label') <= IW), 'label']]);
  D.region('steps', { x: X0 - 6, y: yAxT - 38, w: IW + 12, h: yBot + 40 - (yAxT - 38) });
  // Facts at the foot, lines reserved there.
  const yF = yBot + 60;
  D.para(X0, yF, wrap(factsSentence(m, hid, ghostM), 'cap', IW), 'cap', LH, { owner: 'facts' });
  const H = Math.round(yF + (res.facts - 1) * LH + 22);
  D.meta.rowsShown = rowsShown;
  D.label = summary(m, hid);
  return { D, H };
}

// ---------- Focus outlines and their "Look here" tags (the house rule: one tag per outline, on its edge first).
function focusOutlines(D, ids, H) {
  const TAG = { w: 72, h: 16 };
  const boxes = ids.flatMap((id) => (D.regions[id] ?? []).map((b) => ({ ids: [id], x0: b.x, y0: b.y, x1: b.x + b.w, y1: b.y + b.h })));
  boxes.sort((a, b) => a.y0 - b.y0);
  const groups = [];
  for (const b of boxes) {
    const g = groups[groups.length - 1];
    if (g && b.y0 - g.y1 < TAG.h + 4) Object.assign(g, { ids: [...g.ids, ...b.ids], x0: Math.min(g.x0, b.x0), x1: Math.max(g.x1, b.x1), y1: Math.max(g.y1, b.y1) });
    else groups.push({ ...b });
  }
  D.focusGroups = groups.length;
  for (const g of groups) {
    const x = Math.max(3, g.x0);
    const yy = Math.max(3, g.y0);
    const w = Math.min(D.W - 3, g.x1) - x;
    const h = Math.min(H - 3, g.y1) - yy;
    const own = `focus-${g.ids.join('-')}`;
    D.add('top', `<rect class="focus-outline" data-focus="${g.ids.join(' ')}" x="${r1(x)}" y="${r1(yy)}" width="${r1(w)}" height="${r1(h)}" rx="10"/>`);
    D.link([...sampleLine(x, yy, x + w, yy), ...sampleLine(x + w, yy, x + w, yy + h), ...sampleLine(x, yy + h, x + w, yy + h), ...sampleLine(x, yy, x, yy + h)], own);
    const across = [];
    for (let ax = x + w - TAG.w - 16; ax >= x + 16; ax -= 8) across.push(ax);
    const xs = [x + w - TAG.w - 16, x + 16, ...across];
    const ys = [yy - TAG.h / 2, yy + h - TAG.h / 2, yy + 4, yy + h - TAG.h - 4, yy + 22, yy + h - TAG.h - 22, yy + 40];
    let placed = false;
    for (const [tx, ty] of ys.flatMap((t) => xs.map((sx) => [sx, t]))) {
      const tb = { x0: tx, x1: tx + TAG.w, y0: ty, y1: ty + TAG.h };
      if (tx < 3 || tx + TAG.w > D.W - 3 || ty < 3 || ty + TAG.h > H - 3) continue;

    ['reads', (v) => ({ ...hidingBase(v), reads: false })],
    ['rack', (v) => ({ ...hidingBase(v), loss: false, steps: false })],
    ['half', (v) => ({ ...hidingBase(v), ghost: false })],
  ];
  return plants.map(([id, fn]) => noAnswerFor(M.EXPERIMENTS.find((s) => s.id === id), [W], fn).out.length > 0);
};
const hidingBase = (v) => hidingCore(v);
const hidingReal = hidingCore;
/** Every page sentence of every setting, under the false-claim list. */
window.pageWords = () => {
  const out = [];
  const none = hidingReal({ phase: 'rest' });
  for (const s of M.ALL_SETTINGS) {
    const m = M.run(s);
    const texts = [summary(m, none), settingSentence(m), factsSentence(m, none, M.run(M.BASE)), readoutText(m, none), NOTE(s)];
    for (const kind of ['repair', 'staged']) {
      const plan = M.playPlan(s, kind);
      for (const tau of [0, plan.fail + 0.01, plan.winStart + plan.win * 0.7, null]) texts.push(raceSentence(m, M.playState(s, kind, tau), kind, none));
    }
    for (const t of texts) {
      for (const g of FALSE_CLAIMS) if (g.test(t)) out.push(`${show(s)}: ${g} in "${t}"`);
      for (const sentence of t.split(/(?<=[.!?]) /)) if (/^\d/.test(sentence) && !/^\d+ (of|nines)/.test(sentence)) out.push(`${show(s)}: a sentence opens on a numeral: "${sentence}"`);
      if (/\s\s|\s[,.]/.test(t)) out.push(`${show(s)}: spacing in "${t}"`);
    }
    // The HTML surfaces keep a count with its period on one line (g-code-text's DURABILITY_KEEP).
    for (const t of [readoutText(m, none), summary(m, none), settingSentence(m), ...goalChecks(m).map((c) => c.text)]) out.push(...nowrapFindings(t, show(s)));
    // Describe's row headers: the stage's words, unique, never "Any 2 of the 2".
    for (const compact of [false, true]) {
      const heads = describeRows(m, compact).rows.map((r) => r.cells[0]);
      if (new Set(heads).size !== heads.length) out.push(`${show(s)}: Describe's row headers repeat: ${heads.join(' / ')}`);
    }
  }
  return out;
};
const KEEP_UNITS = [/\d[\d.,]* every [\d.,]+(?: (?:million|billion|trillion))? years/g, /\d[\d.,]*%? a year/g, /1 in \d[\d,]*(?: (?:million|billion|trillion))? years/g];
function nowrapFindings(t, where) {
  const html = codeText(t);
  const spans = [...html.matchAll(/<span class="nowrap">([^<]*)<\/span>/g)].map((x) => x[1]);
  const out = [];
  for (const re of KEEP_UNITS) for (const x of t.matchAll(re)) if (!spans.some((sp) => sp.includes(x[0]))) out.push(`${where}: "${x[0]}" can wrap`);
  return out;
}
window.experimentWords = () => M.EXPERIMENTS.flatMap((spec) => {
  const e = M.renderExperiment(spec);
  return [e.ask, e.reveal, ...e.choices].flatMap((t) => nowrapFindings(t, e.id));
});
window.heights = (widths) => {

};
